size:1.05rem;margin:20px 0 6px;color:var(--ac)}p{margin:6px 0}ul,ol{padding-left:20px;margin:4px 0}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}\n.tag{display:inline-block;background:var(--ac);color:#fff;border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:400}\n.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.84rem}th,td{border:1px solid var(--bd);padding:5px;text-align:left}\ndetails{margin:6px 0}summary{cursor:pointer;font-weight:600}svg.sc{width:100%;height:auto;display:block}\n.w{stroke:var(--fg);fill:none;stroke-width:2}.t{fill:var(--fg);font-size:11px}\n.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;align-items:center}\nbutton.b,select,input.n{font:inherit;font-size:.9rem;padding:7px 9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}\nbutton.b{cursor:pointer}button.b.on{background:var(--ac);color:#fff;border-color:var(--ac)}select{flex:1;min-width:130px}input.n{width:110px}\ninput[type=range]{width:100%;accent-color:var(--ac)}\n.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.v{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px;text-align:center}\n.v b{display:block;color:var(--ac)}.v span{font-size:.72rem;color:var(--mut)}\n.q{font-size:.88rem;color:var(--mut)}.msg{font-weight:600;margin:6px 0}.res{font-weight:700;color:var(--ac);margin:6px 0}\n.sim{display:grid;grid-template-columns:1fr;gap:8px}@media(min-width:620px){.sim{grid-template-columns:2fr 1fr}}\n.qq label{display:block;padding:2px 0}.qq{margin:8px 0}\n<\/style><\/head><body>\n<h1>🔋 Zanjirning bir qismi uchun Om qonuni<\/h1><p>Fizika, 8-sinf · II bob «Elektr toki» · 17-§ · <b>45 daqiqa<\/b> · dars ishlanma + interaktiv simulyatsiyalar<\/p><p><b>Mavzu:<\/b> Zanjirning bir qismi uchun Om qonuni<\/p>\n<div class=\"card\"><p><b>Jihozlar:<\/b> proyektor yoki planshet, ampermetr, voltmetr, manba, rezistor, ulovchi simlar, daftar.<\/p>\n<ul><li><b>Ta’limiy:<\/b> Om qonunini tajriba asosida o‘rganish, I = U / R formulasini qo‘llash va masalalar yechish.<\/li><li><b>Rivojlantiruvchi:<\/b> grafik tuzish, bog‘liqliklarni tahlil qilish, xulosa chiqarish ko‘nikmalarini shakllantirish.<\/li><li><b>Tarbiyaviy:<\/b> aniqlik, kuzatuvchanlik va ilmiy tafakkurni tarbiyalash.<\/li><\/ul><p><b>Kutilayotgan natija:<\/b> o‘quvchi I ning U va R ga bog‘liqligini asoslaydi, Om qonunini ta’riflaydi va formuladan foydalanib masalalar yechadi.<\/p><\/div>\n<h2>Dars bosqichlari<\/h2><div class=\"tw\"><table><tr><th>№<\/th><th>Bosqich<\/th><th>Vaqt<\/th><\/tr><tr><td>1<\/td><td>Tashkiliy qism<\/td><td>2 daq<\/td><\/tr><tr><td>2<\/td><td>Takrorlash va motivatsiya<\/td><td>4 daq<\/td><\/tr><tr><td>3<\/td><td>1-reja: I ning U ga bog‘liqligi<\/td><td>9 daq<\/td><\/tr><tr><td>4<\/td><td>2-reja: I ning R ga bog‘liqligi<\/td><td>10 daq<\/td><\/tr><tr><td>5<\/td><td>3-reja: Om qonuni va masalalar<\/td><td>12 daq<\/td><\/tr><tr><td>6<\/td><td>Mustahkamlash testi<\/td><td>5 daq<\/td><\/tr><tr><td>7<\/td><td>Yakun, baholash, uyga vazifa<\/td><td>3 daq<\/td><\/tr><\/table><\/div>\n<h2>Takrorlash va motivatsiya <span class=\"tag\">4 daq<\/span><\/h2>\n<p><b>Savollar:<\/b> Tok kuchi, kuchlanish va qarshilik nima, birliklari qanday? Ular qaysi asboblar bilan o‘lchanadi?<\/p>\n<p><b>Motivatsiya:<\/b> reostat surgichini surganda lampa nega yorqinlashadi? Bugun tok kuchi, kuchlanish va qarshilikni bog‘lovchi qonunni topamiz.<\/p>\n<h2>1-reja. Tok kuchining kuchlanishga bog‘liqligi <span class=\"tag\">9 daq<\/span><\/h2>\n<p><b>Maqsad:<\/b> qarshilik o‘zgarmas bo‘lganda I ning U ga bog‘liqligini tajribada aniqlash; voltamper xarakteristika tushunchasi.<\/p><p><b>Vaqt:<\/b> tajriba tushuntirish 3 · 1-simulyatsiya 4 · savol-topshiriq 2 daqiqa.<\/p>\n<div class=\"card\"><b>1-simulyatsiya: I ning U ga bog‘liqligi (R = 10 Ω o‘zgarmas)<\/b>\n<div class=\"sim\"><svg id=\"s1\" class=\"sc\" viewBox=\"0 0 340 200\"><\/svg><svg id=\"ga1\" class=\"sc\" viewBox=\"0 0 120 80\"><\/svg><\/div>\n<label>Kuchlanish U: <b id=\"u1o\"><\/b><\/label><input type=\"range\" id=\"u1\" min=\"0\" max=\"12\" step=\"1\" value=\"4\">\n<div class=\"row\"><button class=\"b\" id=\"add1\">➕ Nuqtani yozish<\/button><button class=\"b\" id=\"clr1\">Tozalash<\/button><\/div>\n<svg id=\"gr1\" class=\"sc\" viewBox=\"0 0 340 160\"><\/svg><div class=\"tw\"><table id=\"t1\"><\/table><\/div>\n<p class=\"q\">Kuchlanishni o‘zgartirib, bir nechta nuqtani yozing: I(U) grafigi koordinata boshidan o‘tuvchi to‘g‘ri chiziq bo‘ladi, U / I esa har safar bir xil (R).<\/p><\/div>\n<details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary>\n<p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Zanjirni namoyish qiladi: manba, rezistor, ampermetr, voltmetr. Kuchlanishni bosqichma-bosqich oshirib, tok kuchini o‘lchaydi.<\/li><li>Natijalarni jadvalga yozdiradi, I(U) grafigini chizdiradi (voltamper xarakteristika).<\/li><li>Xulosa: qarshilik o‘zgarmas bo‘lsa, tok kuchi kuchlanishga <b>to‘g‘ri proporsional<\/b>.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> simulyatorda 4–5 nuqtani yozadi, jadval va grafikni daftarga ko‘chiradi, U / I nisbati o‘zgarmasligini payqaydi.<\/p>\n<p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>U ni 2 marta oshirsak, I qanday o‘zgaradi? (2 marta ortadi)<\/li><li>Grafik qanday ko‘rinishda? (koordinata boshidan o‘tuvchi to‘g‘ri chiziq)<\/li><li>U / I nisbati nimani bildiradi? (qarshilikni)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> bog‘liqlikni jadval va grafik bilan asoslaydi.<\/li><li><b>4:<\/b> bog‘liqlikni aytadi, grafikda kichik xato.<\/li><li><b>3:<\/b> yordam bilan xulosa chiqaradi.<\/li><li><b>2:<\/b> ayta olmaydi.<\/li><\/ul><\/details><h2>2-reja. Tok kuchining qarshilikka bog‘liqligi <span class=\"tag\">10 daq<\/span><\/h2>\n<p><b>Maqsad:<\/b> kuchlanish o‘zgarmas bo‘lganda I ning R ga bog‘liqligini aniqlash.<\/p><p><b>Vaqt:<\/b> tushuntirish 3 · 2-simulyatsiya 5 · savol-topshiriq 2 daqiqa.<\/p>\n<div class=\"card\"><b>2-simulyatsiya: I ning R ga bog‘liqligi (U o‘zgarmas)<\/b>\n<div class=\"sim\"><svg id=\"s2\" class=\"sc\" viewBox=\"0 0 340 200\"><\/svg><svg id=\"ga2\" class=\"sc\" viewBox=\"0 0 120 80\"><\/svg><\/div>\n<label>Kuchlanish U: <b id=\"u2o\"><\/b><\/label><input type=\"range\" id=\"u2\" min=\"1\" max=\"12\" step=\"1\" value=\"6\">\n<label>Qarshilik R: <b id=\"r2o\"><\/b><\/label><input type=\"range\" id=\"r2\" min=\"2\" max=\"50\" step=\"1\" value=\"10\">\n<svg id=\"gr2\" class=\"sc\" viewBox=\"0 0 340 160\"><\/svg>\n<div class=\"g\"><div class=\"v\"><b id=\"i2\"><\/b><span>I = U / R<\/span><\/div><div class=\"v\"><b id=\"p2\"><\/b><span>I · R<\/span><\/div><div class=\"v\"><b id=\"c2\"><\/b><span>o‘lchash chegarasi<\/span><\/div><\/div>\n<p class=\"q\">R ni 2 marta oshiring: tok kuchi 2 marta kamayadi. Grafik giperbola, I · R esa har doim U ga teng.<\/p><\/div>\n<details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary>\n<p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Kuchlanishni o‘zgarmas ushlab, rezistor qarshiligini o‘zgartiradi (reostat yoki turli rezistorlar) va tok kuchini o‘lchaydi.<\/li><li>Xulosa: kuchlanish o‘zgarmas bo‘lsa, tok kuchi qarshilikka <b>teskari proporsional<\/b>.<\/li><li>Ikkala bog‘liqlikni birlashtiradi: <b>I = U / R<\/b>.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> R ni o‘zgartirib I ni yozadi, I · R ko‘paytmasi o‘zgarmasligini tekshiradi.<\/p>\n<p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>R ni 3 marta oshirsak, I qanday o‘zgaradi? (3 marta kamayadi)<\/li><li>I · R nimaga teng? (U ga)<\/li><li>Grafik nega to‘g‘ri chiziq emas? (teskari proporsionallik)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> teskari bog‘liqlikni asoslaydi va I · R = U ni tekshiradi.<\/li><li><b>4:<\/b> 1 ta noaniqlik.<\/li><li><b>3:<\/b> faqat sifat jihatdan aytadi.<\/li><li><b>2:<\/b> ayta olmaydi.<\/li><\/ul><\/details><h2>3-reja. Om qonuni, formulalar va masalalar <span class=\"tag\">12 daq<\/span><\/h2>\n<p><b>Maqsad:<\/b> Om qonuni ta’rifini bilish, formulalarni qo‘llash, oddiy masalalar yechish.<\/p><p><b>Vaqt:<\/b> Om qonuni 3 · 3-simulyatsiya 4 · masalalar 5 daqiqa.<\/p>\n<div class=\"card\"><b>3-simulyatsiya: Om uchburchagi va hisoblagich<\/b>\n<svg id=\"tri\" class=\"sc\" style=\"max-width:220px;margin:auto\" viewBox=\"0 0 200 125\"><\/svg>\n<p class=\"q\">Noma’lum kattalikni tanlang, ikkita ma’lum qiymatni kiriting.<\/p>\n<div class=\"row\" id=\"un\"><button class=\"b\" data-k=\"U\">U ni top<\/button><button class=\"b on\" data-k=\"I\">I ni top<\/button><button class=\"b\" data-k=\"R\">R ni top<\/button><\/div>\n<div class=\"row\"><label id=\"la\"><\/label><input class=\"n\" id=\"ia\" inputmode=\"decimal\" value=\"12\"><label id=\"lb\"><\/label><input class=\"n\" id=\"ib\" inputmode=\"decimal\" value=\"4\"><\/div>\n<p class=\"res\" id=\"o3\"><\/p>\n<hr><b>Mashq<\/b><div class=\"row\"><button class=\"b\" id=\"nx\">🎲 Yangi masala<\/button><\/div>\n<p id=\"exq\" class=\"msg\"><\/p><div class=\"row\"><input class=\"n\" id=\"ea\" inputmode=\"decimal\" placeholder=\"javob\"><button class=\"b\" id=\"ec\">Tekshirish<\/button><\/div><p id=\"exf\" class=\"msg\"><\/p><\/div>\n<details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary>\n<p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li><b>Om qonuni (1827, Georg Om):<\/b> zanjir qismidagi tok kuchi shu qismdagi kuchlanishga to‘g‘ri, qarshiligiga teskari proporsional: <b>I = U / R<\/b>.<\/li><li>Ifodalari: U = I·R; R = U / I. Birliklar: 1 A = 1 V / 1 Ω.<\/li><li>Eslatma: R = U / I qarshilikni aniqlaydi, lekin R U va I ga emas, o‘tkazgichning o‘zi (l, S, modda) ga bog‘liq.<\/li><li>Masala yechish tartibi: Berilgan → Formula → Hisob → Javob.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> Om uchburchagi yordamida formulani topadi, mashq bilan o‘zini tekshiradi, masalalarni daftarda yechadi.<\/p>\n<p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Om qonunini ta’riflang.<\/li><li>R = U / I dan R ni o‘zgartirib bo‘ladimi? (yo‘q, R o‘tkazgichga bog‘liq)<\/li><li>Quyidagi masalalarni yeching.<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> qonunni ta’riflaydi va 3 ta masalani xatosiz yechadi.<\/li><li><b>4:<\/b> 2 ta masalani yechadi.<\/li><li><b>3:<\/b> 1 ta masalani yechadi.<\/li><li><b>2:<\/b> formulani qo‘llay olmaydi.<\/li><\/ul><\/details><h2>Masalalar (yechimi bilan)<\/h2>\n<div class=\"card\"><p><b>1.<\/b> Lampa uchlaridagi kuchlanish 12 V, qarshiligi 4 Ω. Tok kuchi qancha?<\/p><p><i>Yechim:<\/i> I = U/R = 12/4 = <b>3 A<\/b>.<\/p><\/div>\n<div class=\"card\"><p><b>2.<\/b> Qarshiligi 20 Ω bo‘lgan rezistordan 0,5 A tok o‘tmoqda. Kuchlanish qancha?<\/p><p><i>Yechim:<\/i> U = I·R = 0,5·20 = <b>10 V<\/b>.<\/p><\/div>\n<div class=\"card\"><p><b>3.<\/b> Cho‘g‘lanma lampa 220 V tarmoqqa ulanganda 0,5 A tok o‘tadi. Spirali qarshiligi qancha?<\/p><p><i>Yechim:<\/i> R = U/I = 220/0,5 = <b>440 Ω<\/b>.<\/p><\/div>\n<h2>Mustahkamlash testi <span class=\"tag\">5 daq<\/span><\/h2><div class=\"card\"><div id=\"qz\"><\/div><button class=\"b\" id=\"qc\">Tekshirish<\/button><p id=\"qr\"><\/p><\/div>\n<p class=\"q\">Baho: 5 to‘g‘ri — «5»; 4 — «4»; 3 — «3»; 2 va kam — «2».<\/p>\n<h2>Yakun va uyga vazifa <span class=\"tag\">3 daq<\/span><\/h2><p><b>Refleksiya:<\/b> «Bugun nimani bildim? Nima tushunarsiz qoldi?»<\/p><ol><li>17-§ matnini o‘qing, savollarga javob bering.<\/li><li><b>Masala:<\/b> U = 6 V, R = 30 Ω. I = ? (0,2 A)<\/li><li><b>Masala:<\/b> I = 2 A, R = 55 Ω. U = ? (110 V)<\/li><li><b>Masala:<\/b> reostatdagi kuchlanish 24 V, tok 0,8 A. R = ? (30 Ω)<\/li><li><b>Ijodiy:<\/b> 1-simulyatsiyadan foydalanib, U = 3, 6, 9 V uchun jadval tuzing.<\/li><\/ol>\n<script>\nconst $=s=>document.querySelector(s),nf=(n,d=2)=>String(+n.toFixed(d)).replace('.',',');\nconst FG=getComputedStyle(document.documentElement).getPropertyValue('--fg')||'#888';\nconst MT=[[\"Mis\",0.017],[\"Alyuminiy\",0.028],[\"Temir\",0.10],[\"Nikrom\",1.1]];\nfunction gauge(v,max,L){const a=(-70+140*Math.min(v/max,1.05))*Math.PI/180;let t='';\n for(let i=0;i<=5;i++){const b=(-70+28*i)*Math.PI/180;t+=`<line class=\"w\" style=\"stroke-width:1\" x1=\"${60+40*Math.sin(b)}\" y1=\"${70-40*Math.cos(b)}\" x2=\"${60+46*Math.sin(b)}\" y2=\"${70-46*Math.cos(b)}\"/><text class=\"t\" style=\"font-size:8px\" x=\"${60+31*Math.sin(b)-5}\" y=\"${70-31*Math.cos(b)+3}\">${nf(max*i/5,2)}<\/text>`}\n const e=70*Math.PI/180;\n return `<rect x=\"2\" y=\"2\" width=\"116\" height=\"76\" rx=\"8\" class=\"w\" style=\"stroke-width:1\"/><path class=\"w\" d=\"M${60-46*Math.sin(e)} ${70-46*Math.cos(e)}A46 46 0 0 1 ${60+46*Math.sin(e)} ${70-46*Math.cos(e)}\"/>${t}<line x1=\"60\" y1=\"70\" x2=\"${60+42*Math.sin(a)}\" y2=\"${70-42*Math.cos(a)}\" stroke=\"#dc2626\" stroke-width=\"2\"/><circle cx=\"60\" cy=\"70\" r=\"4\" fill=\"var(--fg)\"/><text class=\"t\" x=\"54\" y=\"54\" style=\"font-size:14px;font-weight:700\">${L}<\/text>`}\nfunction per(s){s=((s%760)+760)%760;if(s<260)return[40+s,40];s-=260;if(s<120)return[300,40+s];s-=120;if(s<260)return[300-s,160];s-=260;return[40,160-s]}\nfunction parts(off){let h='';for(let k=0;k<26;k++){const p=per(k*760/26+off);h+=`<circle cx=\"${p[0]}\" cy=\"${p[1]}\" r=\"3\" fill=\"#2563eb\"/>`}return h}\nfunction box(x,y,txt,col){return `<rect x=\"${x-30}\" y=\"${y-13}\" width=\"60\" height=\"26\" rx=\"5\" fill=\"${col}\" stroke=\"var(--fg)\"/><text x=\"${x}\" y=\"${y+4}\" text-anchor=\"middle\" style=\"font-size:11px;fill:#111;font-weight:600\">${txt}<\/text>`}\nfunction circ(id,a,b,c,cb){return '<rect x=\"40\" y=\"40\" width=\"260\" height=\"120\" class=\"w\"/>'+box(40,100,a,'#fde68a')+box(170,40,b,'#fef08a')+box(300,100,c,cb||'#bbf7d0')+`<g id=\"${id}p\"><\/g>`}\nconst AN=[];function anim(o){o.off=0;o.d=0;AN.push(o)}\nfunction loop(){AN.forEach(a=>{const I=a.I(),mx=a.max();a.d+=(I-a.d)*.15;$('#'+a.g).innerHTML=gauge(a.d,mx,a.L);a.off+=(a.run===false?0:Math.min(I/mx,1)*6);const p=$('#'+a.p);if(p)p.innerHTML=(I>0&&a.run!==false)?parts(a.off):''});requestAnimationFrame(loop)}\nfunction rng(I){return I<=.6?.6:I<=1.2?1.2:I<=3?3:I<=6?6:12}\nfunction quiz(Q,K){$('#qz').innerHTML=Q.map((q,i)=>`<div class=\"qq\"><b>${i+1}. ${q[0]}<\/b>`+q[1].map((o,j)=>`<label><input type=\"radio\" name=\"q${i}\" value=\"${j}\"> ${'ABCD'[j]}) ${o}<\/label>`).join('')+'<\/div>').join('');\n$('#qc').onclick=()=>{let s=0;K.forEach((k,i)=>{const c=document.querySelector(`input[name=q${i}]:checked`);if(c&&+c.value===k)s++});\n$('#qr').innerHTML=`<b>${s}/5 → baho: ${s>=3?s:2}<\/b>`+(s<5?' · Xatolarni qayta ko‘rib chiqing.':' · Ajoyib! 🎉')}}\n\n\n/* 1 */\nconst P1=[];\nfunction d1(){const U=+$('#u1').value;$('#u1o').textContent=U+' V';$('#s1').innerHTML=circ('s1','U = '+U+' V','R = 10 Ω','A');\n const X=u=>30+u/12*300,Y=i=>138-i/1.25*128;\n let h=`<rect x=\"30\" y=\"10\" width=\"300\" height=\"128\" class=\"w\" style=\"stroke-width:1\"/><text class=\"t\" x=\"0\" y=\"16\">I, A<\/text><text class=\"t\" x=\"296\" y=\"154\">U, V<\/text><line x1=\"${X(0)}\" y1=\"${Y(0)}\" x2=\"${X(12)}\" y2=\"${Y(1.2)}\" stroke=\"#94a3b8\" stroke-dasharray=\"4\"/>`;\n P1.forEach(p=>h+=`<circle cx=\"${X(p[0])}\" cy=\"${Y(p[1])}\" r=\"4\" fill=\"#2563eb\"/>`);h+=`<circle cx=\"${X(U)}\" cy=\"${Y(U/10)}\" r=\"5\" fill=\"#dc2626\"/>`;$('#gr1').innerHTML=h;\n $('#t1').innerHTML='<tr><th>U, V<\/th><th>I, A<\/th><th>U / I, Ω<\/th><\/tr>'+P1.map(p=>`<tr><td>${p[0]}<\/td><td>${nf(p[1])}<\/td><td>${nf(p[0]/p[1],1)}<\/td><\/tr>`).join('')}\n$('#u1').oninput=d1;$('#add1').onclick=()=>{const U=+$('#u1').value;if(U>0&&!P1.some(p=>p[0]==U)){P1.push([U,U/10]);d1()}};$('#clr1').onclick=()=>{P1.length=0;d1()};d1();\nanim({p:'s1p',g:'ga1',L:'A',I:()=>+$('#u1').value/10,max:()=>rng(+$('#u1').value/10)});\n/* 2 */\nfunction d2(){const U=+$('#u2').value,R=+$('#r2').value,I=U/R;$('#u2o').textContent=U+' V';$('#r2o').textContent=R+' Ω';$('#s2').innerHTML=circ('s2','U = '+U+' V','R = '+R+' Ω','A');\n const X=r=>30+(r-2)/48*300,Y=i=>138-i/6*128;let pl='';for(let r=2;r<=50;r++)pl+=X(r)+','+Y(U/r)+' ';\n $('#gr2').innerHTML=`<rect x=\"30\" y=\"10\" width=\"300\" height=\"128\" class=\"w\" style=\"stroke-width:1\"/><text class=\"t\" x=\"0\" y=\"16\">I, A<\/text><text class=\"t\" x=\"300\" y=\"154\">R, Ω<\/text><polyline points=\"${pl}\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/><circle cx=\"${X(R)}\" cy=\"${Y(I)}\" r=\"5\" fill=\"#dc2626\"/>`;\n $('#i2').textContent=nf(I)+' A';$('#p2').textContent=nf(I*R,1)+' V';$('#c2').textContent=rng(I)+' A'}\n$('#u2').oninput=d2;$('#r2').oninput=d2;d2();\nanim({p:'s2p',g:'ga2',L:'A',I:()=>+$('#u2').value/+$('#r2').value,max:()=>rng(+$('#u2').value/+$('#r2').value)});\n/* 3 */\nlet unk='I',ex=null;const num=s=>parseFloat(String(s).replace(',','.'));\nfunction tri(){const c=k=>unk==k?'#dc2626':FG;$('#tri').innerHTML=`<polygon points=\"100,8 12,118 188,118\" class=\"w\"/><line x1=\"56\" y1=\"63\" x2=\"144\" y2=\"63\" class=\"w\"/><line x1=\"100\" y1=\"63\" x2=\"100\" y2=\"118\" class=\"w\"/><text x=\"100\" y=\"50\" text-anchor=\"middle\" style=\"font-size:24px;font-weight:700;fill:${c('U')}\">U<\/text><text x=\"68\" y=\"104\" text-anchor=\"middle\" style=\"font-size:24px;font-weight:700;fill:${c('I')}\">I<\/text><text x=\"132\" y=\"104\" text-anchor=\"middle\" style=\"font-size:24px;font-weight:700;fill:${c('R')}\">R<\/text>`}\nfunction c3(){document.querySelectorAll('#un .b').forEach(b=>b.classList.toggle('on',b.dataset.k==unk));\n const L={I:['U, V:','R, Ω:'],U:['I, A:','R, Ω:'],R:['U, V:','I, A:']}[unk];$('#la').textContent=L[0];$('#lb').textContent=L[1];tri();\n const a=num($('#ia').value),b=num($('#ib').value);if(isNaN(a)||isNaN(b)||(unk!='U'&&b==0)){$('#o3').textContent='Qiymatlarni kiriting';return}\n const r={I:a/b,U:a*b,R:a/b}[unk],f={I:`I = U/R = ${nf(a,3)}/${nf(b,3)}`,U:`U = I·R = ${nf(a,3)}·${nf(b,3)}`,R:`R = U/I = ${nf(a,3)}/${nf(b,3)}`}[unk];\n $('#o3').textContent=f+' = '+nf(r,3)+' '+{I:'A',U:'V',R:'Ω'}[unk]}\n$('#un').onclick=e=>{if(e.target.dataset.k){unk=e.target.dataset.k;c3()}};$('#ia').oninput=c3;$('#ib').oninput=c3;c3();\nconst pk=a=>a[Math.floor(Math.random()*a.length)];\nfunction nx(){const R=pk([2,4,5,10,20]),I=pk([0.5,1,2,3]),k=pk(['U','I','R']);ex={k,U:I*R,I,R};\n const t={U:`I = ${nf(I)} A, R = ${R} Ω. U = ? (V)`,I:`U = ${I*R} V, R = ${R} Ω. I = ? (A)`,R:`U = ${I*R} V, I = ${nf(I)} A. R = ? (Ω)`}[k];$('#exq').textContent=t;$('#exf').textContent='';$('#ea').value=''}\n$('#nx').onclick=nx;nx();\n$('#ec').onclick=()=>{const a=num($('#ea').value);$('#exf').innerHTML=Math.abs(a-ex[ex.k])<0.01?'<span style=\"color:#16a34a\">To‘g‘ri! ✅<\/span>':'<span style=\"color:#dc2626\">Xato ❌ Formulani qayta tekshiring.<\/span>'};\n\nquiz([[\"Om qonuni formulasi qaysi?\",[\"I = U / R\",\"I = U · R\",\"I = R / U\",\"U = I / R\"]],[\"R o‘zgarmas, U 2 marta oshsa, I…\",[\"2 marta ortadi\",\"2 marta kamayadi\",\"o‘zgarmaydi\",\"4 marta ortadi\"]],[\"U o‘zgarmas, R 3 marta oshsa, I…\",[\"3 marta ortadi\",\"3 marta kamayadi\",\"o‘zgarmaydi\",\"9 marta kamayadi\"]],[\"U = 9 V, R = 3 Ω. I = ?\",[\"27 A\",\"6 A\",\"3 A\",\"0,33 A\"]],[\"R o‘zgarmas bo‘lganda I(U) grafigi…\",[\"giperbola\",\"koordinata boshidan o‘tuvchi to‘g‘ri chiziq\",\"gorizontal chiziq\",\"aylana\"]]],[0,0,1,2,1]);loop();\n<\/script><\/body><\/html>"}, {"t": "18-§ Masalalar yechish", "h": "<!DOCTYPE html><html lang=\"uz\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><title>Fizika 8-sinf: 18-§ Masalalar yechish — dars ishlanma<\/title><style>\n:root{--bg:#fff;--fg:#1a1a1a;--card:#f3f4f6;--ac:#2563eb;--mut:#6b7280;--bd:#d1d5db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#111827;--fg:#f3f4f6;--card:#1f2937;--ac:#60a5fa;--mut:#9ca3af;--bd:#374151}}\n:root[data-theme=\"dark\"]{--bg:#111827;--fg:#f3f4f6;--card:#1f2937;--ac:#60a5fa;--mut:#9ca3af;--bd:#374151}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}\nbody{margin:0 auto;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;padding:12px;max-width:760px}\nh1{font-size:1.3rem;margin:4px 0 8px}h2{font-size:1.05rem;margin:20px 0 6px;color:var(--ac)}p{margin:6px 0}ul,ol{padding-left:20px;margin:4px 0}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}\n.tag{display:inline-block;background:var(--ac);color:#fff;border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:400}\n.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.84rem}th,td{border:1px solid var(--bd);padding:5px;text-align:left}\ndetails{margin:6px 0}summary{cursor:pointer;font-weight:600}svg.sc{width:100%;height:auto;display:block}\n.w{stroke:var(--fg);fill:none;stroke-width:2}.t{fill:var(--fg);font-size:11px}\n.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;align-items:center}\nbutton.b,select,input.n{font:inherit;font-size:.9rem;padding:7px 9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}\nbutton.b{cursor:pointer}button.b.on{background:var(--ac);color:#fff;border-color:var(--ac)}select{flex:1;min-width:130px}input.n{width:110px}\ninput[type=range]{width:100%;accent-color:var(--ac)}\n.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.v{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px;text-align:center}\n.v b{display:block;color:var(--ac)}.v span{font-size:.72rem;color:var(--mut)}\n.q{font-size:.88rem;color:var(--mut)}.msg{font-weight:600;margin:6px 0}.res{font-weight:700;color:var(--ac);margin:6px 0}\n.sim{display:grid;grid-template-columns:1fr;gap:8px}@media(min-width:620px){.sim{grid-template-columns:2fr 1fr}}\n.qq label{display:block;padding:2px 0}.qq{margin:8px 0}\n<\/style><\/head><body>\n<h1>🧮 Masalalar yechish (Om qonuni)<\/h1><p>Fizika, 8-sinf · II bob «Elektr toki» · 18-§ · <b>45 daqiqa<\/b> · dars ishlanma + interaktiv simulyatsiyalar<\/p><p><b>Mavzu:<\/b> Masalalar yechish: Om qonuni va qarshilik<\/p>\n<div class=\"card\"><p><b>Jihozlar:<\/b> proyektor yoki planshet, ampermetr, voltmetr, manba, rezistor, ulovchi simlar, daftar.<\/p>\n<ul><li><b>Ta’limiy:<\/b> Om qonuni va R = ρ·l/S formulalarini masalalarda qo‘llash, birliklarni SI ga o‘tkazish, grafikdan foydalanish.<\/li><li><b>Rivojlantiruvchi:<\/b> tahlil qilish, ko‘p bosqichli masalani rejalashtirish va tekshirish ko‘nikmalarini rivojlantirish.<\/li><li><b>Tarbiyaviy:<\/b> aniqlik, mustaqil fikrlash va elektr xavfsizligi madaniyatini tarbiyalash.<\/li><\/ul><p><b>Kutilayotgan natija:<\/b> o‘quvchi masalani algoritm bo‘yicha yechadi, birliklarni to‘g‘ri o‘zgartiradi, grafikdan I va R ni topadi va aralash masalalarni bajaradi.<\/p><\/div>\n<h2>Dars bosqichlari<\/h2><div class=\"tw\"><table><tr><th>№<\/th><th>Bosqich<\/th><th>Vaqt<\/th><\/tr><tr><td>1<\/td><td>Tashkiliy qism<\/td><td>2 daq<\/td><\/tr><tr><td>2<\/td><td>Takrorlash va motivatsiya<\/td><td>4 daq<\/td><\/tr><tr><td>3<\/td><td>1-reja: Algoritm va birliklar<\/td><td>9 daq<\/td><\/tr><tr><td>4<\/td><td>2-reja: Grafik masalalar<\/td><td>12 daq<\/td><\/tr><tr><td>5<\/td><td>3-reja: Aralash masalalar<\/td><td>10 daq<\/td><\/tr><tr><td>6<\/td><td>Mustahkamlash testi<\/td><td>5 daq<\/td><\/tr><tr><td>7<\/td><td>Yakun, baholash, uyga vazifa<\/td><td>3 daq<\/td><\/tr><\/table><\/div>\n<h2>Takrorlash va motivatsiya <span class=\"tag\">4 daq<\/span><\/h2>\n<p><b>Savollar:<\/b> Om qonunini ayting. R = ρ·l/S formulasi nimani bildiradi? 1 mA va 1 kΩ necha SI birligiga teng?<\/p>\n<p><b>Motivatsiya:<\/b> uydagi saqlagich nega «kuyadi»? Buni hisoblash orqali tushuntirib beramiz.<\/p>\n<h2>1-reja. Masala yechish algoritmi va birliklar <span class=\"tag\">9 daq<\/span><\/h2>\n<p><b>Maqsad:<\/b> masalani bosqichma-bosqich yechishni va birliklarni (mA, kΩ) SI ga o‘tkazishni o‘rganish.<\/p><p><b>Vaqt:<\/b> tushuntirish 3 · 1-simulyatsiya 4 · savol-topshiriq 2 daqiqa.<\/p>\n<div class=\"card\"><b>1-simulyatsiya: masala yechish bosqichlari<\/b>\n<p id=\"pq\" class=\"msg\"><\/p><div id=\"sv\"><\/div>\n<div class=\"row\"><button class=\"b\" id=\"sn\">Keyingi bosqich ▶<\/button><button class=\"b\" id=\"pn\">🎲 Boshqa masala<\/button><\/div>\n<div class=\"row\"><input class=\"n\" id=\"pa\" inputmode=\"decimal\" placeholder=\"javob (SI)\"><button class=\"b\" id=\"pc\">Tekshirish<\/button><\/div><p id=\"pf\" class=\"msg\"><\/p>\n<p class=\"q\">Bosqichlar: 1) Berilgan · 2) SI ga o‘tkazish (mA → A, kΩ → Ω) · 3) Formula · 4) Hisob · 5) Javob. Javobni SI birliklarida (A, V, Ω) kiriting.<\/p><\/div>\n<details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary>\n<p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Algoritmni yozadi: <b>Berilgan → SI → Formula → Hisob → Javob<\/b>.<\/li><li>Birliklar: 1 mA = 0,001 A; 1 kΩ = 1000 Ω; 1 kV = 1000 V.<\/li><li>Namunani doskada yechadi: U = 12 V, R = 4 kΩ, I = ? → I = 12/4000 = 0,003 A.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> simulyatorda bosqichlarni birma-bir ochadi, javobini kiritib tekshiradi, daftarda 2 ta masala yechadi.<\/p>\n<p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>250 mA necha amper? (0,25 A)<\/li><li>3 kΩ necha Om? (3000 Ω)<\/li><li>U = 220 V, I = 0,5 A. R = ? (440 Ω)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> algoritmni to‘liq bajaradi, birliklarni xatosiz o‘zgartiradi.<\/li><li><b>4:<\/b> 1 ta kichik xato.<\/li><li><b>3:<\/b> birliklarda yordam kerak.<\/li><li><b>2:<\/b> mustaqil yecha olmaydi.<\/li><\/ul><\/details><h2>2-reja. Grafik bilan bog‘liq masalalar <span class=\"tag\">12 daq<\/span><\/h2>\n<p><b>Maqsad:<\/b> voltamper xarakteristika grafigidan tok kuchi va qarshilikni aniqlash, o‘tkazgichlarni solishtirish.<\/p><p><b>Vaqt:<\/b> tushuntirish 3 · 2-simulyatsiya 6 · savol-topshiriq 3 daqiqa.<\/p>\n<div class=\"card\"><b>2-simulyatsiya: voltamper xarakteristikalar<\/b>\n<svg id=\"gr\" class=\"sc\" viewBox=\"0 0 340 160\"><\/svg>\n<label>R₁ (ko‘k): <b id=\"ao\"><\/b><\/label><input type=\"range\" id=\"ra\" min=\"4\" max=\"40\" step=\"1\" value=\"8\">\n<label>R₂ (qizil): <b id=\"bo\"><\/b><\/label><input type=\"range\" id=\"rb\" min=\"4\" max=\"40\" step=\"1\" value=\"20\">\n<label>Kuchlanish U: <b id=\"uo\"><\/b><\/label><input type=\"range\" id=\"uc\" min=\"0\" max=\"12\" step=\"0.5\" value=\"6\">\n<div class=\"g\"><div class=\"v\"><b id=\"i1\"><\/b><span>I₁ (grafikdan)<\/span><\/div><div class=\"v\"><b id=\"i2\"><\/b><span>I₂ (grafikdan)<\/span><\/div><div class=\"v\"><b id=\"rr\"><\/b><span>R₁ = U / I₁<\/span><\/div><\/div>\n<p class=\"msg\">Qaysi o‘tkazgichning qarshiligi katta?<\/p><div class=\"row\" id=\"ch\"><button class=\"b\" data-k=\"1\">1 (ko‘k)<\/button><button class=\"b\" data-k=\"2\">2 (qizil)<\/button><button class=\"b\" data-k=\"0\">Teng<\/button><\/div><p id=\"chf\" class=\"msg\"><\/p>\n<p class=\"q\">Bir xil U da tok kuchi kam bo‘lgan (grafigi pastroq, tekisroq) o‘tkazgichning qarshiligi katta.<\/p><\/div>\n<details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary>\n<p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Grafikni o‘qishni ko‘rsatadi: kerakli U da vertikal chiziq o‘tkazib, I ni topadi; R = U / I.<\/li><li>Xulosa: grafik qanchalik tik (I tez ortsa), qarshilik shunchalik kichik.<\/li><li>Namuna masala: U = 4 V da I = 0,5 A. R = 8 Ω; U = 12 V da I = 1,5 A.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> R₁ va R₂ ni o‘zgartirib grafiklarni solishtiradi, savolga javob beradi, grafikdan R ni hisoblaydi.<\/p>\n<p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Grafikdan U = 6 V da I = 0,75 A. R = ? (8 Ω)<\/li><li>Qaysi grafik tikroq: R = 5 Ω yoki R = 20 Ω? (5 Ω)<\/li><li>U = 12 V da I = 1,5 A bo‘lsa, U = 6 V da I = ? (0,75 A)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> grafikdan I va R ni xatosiz topadi, solishtirishni asoslaydi.<\/li><li><b>4:<\/b> 1 ta hisoblash xatosi.<\/li><li><b>3:<\/b> grafikni yordam bilan o‘qiydi.<\/li><li><b>2:<\/b> grafikni o‘qiy olmaydi.<\/li><\/ul><\/details><h2>3-reja. Aralash masalalar: R = ρ·l/S va Om qonuni <span class=\"tag\">10 daq<\/span><\/h2>\n<p><b>Maqsad:<\/b> qarshilik formulasi va Om qonunini birgalikda qo‘llash; saqlagich vazifasini tushunish.<\/p><p><b>Vaqt:<\/b> tushuntirish 3 · 3-simulyatsiya 4 · masalalar 3 daqiqa.<\/p>\n<div class=\"card\"><b>3-simulyatsiya: simning qarshiligi, tok va saqlagich (5 A)<\/b>\n<div class=\"sim\"><svg id=\"s3\" class=\"sc\" viewBox=\"0 0 340 200\"><\/svg><svg id=\"ga3\" class=\"sc\" viewBox=\"0 0 120 80\"><\/svg><\/div>\n<div class=\"row\"><select id=\"m3\"><\/select><\/div>\n<label>l: <b id=\"lo\"><\/b><\/label><input type=\"range\" id=\"l3\" min=\"1\" max=\"50\" value=\"5\">\n<label>S: <b id=\"so\"><\/b><\/label><input type=\"range\" id=\"s3\" min=\"0.1\" max=\"2\" step=\"0.1\" value=\"0.2\">\n<label>U: <b id=\"vo\"><\/b><\/label><input type=\"range\" id=\"u3\" min=\"1\" max=\"110\" value=\"110\">\n<div id=\"st3\" class=\"res\"><\/div>\n<p class=\"q\">Qalin va qisqa mis simning qarshiligi juda kichik, tok kuchi esa juda katta bo‘ladi. Shuning uchun zanjirga saqlagich qo‘yiladi.<\/p><\/div>\n<details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary>\n<p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Ikki bosqichli masala: avval R = ρ·l/S, so‘ng I = U / R.<\/li><li>Saqlagich — tok ruxsat etilgandan oshsa, o‘zi eriydi va zanjirni uzadi. Yong‘indan saqlaydi.<\/li><li>Kuchli asboblar uchun qalin sim zarur: kichik R, katta tok.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> simulyatorda materiallar, l, S va U ni o‘zgartirib saqlagich qachon kuyishini aniqlaydi.<\/p>\n<p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Mis sim (ρ = 0,017), l = 100 m, S = 1 mm², U = 3,4 V. I = ? (2 A)<\/li><li>Nega 5 A saqlagichli zanjirga 10 A tok o‘tkazib bo‘lmaydi?<\/li><li>Saqlagich kuymasligi uchun nimani o‘zgartirish mumkin? (l ni oshirish, S ni kamaytirish, U ni pasaytirish)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> ikki bosqichli masalani xatosiz yechadi, saqlagichni asoslaydi.<\/li><li><b>4:<\/b> 1 ta xato.<\/li><li><b>3:<\/b> yordam bilan yechadi.<\/li><li><b>2:<\/b> yecha olmaydi.<\/li><\/ul><\/details><h2>Masalalar to‘plami (yechimi bilan)<\/h2>\n<div class=\"card\"><p><b>1.<\/b> Lampaga 220 V berilganda 0,5 A tok o‘tadi. Qarshiligi?<\/p><p><i>Yechim:<\/i> R = U/I = 220/0,5 = <b>440 Ω<\/b>.<\/p><\/div>\n<div class=\"card\"><p><b>2.<\/b> U = 24 V, R = 1,2 kΩ. I = ?<\/p><p><i>Yechim:<\/i> R = 1200 Ω; I = 24/1200 = 0,02 A = <b>20 mA<\/b>.<\/p><\/div>\n<div class=\"card\"><p><b>3.<\/b> Grafikdan: U = 4 V da I = 0,5 A. U = 12 V da I = ?<\/p><p><i>Yechim:<\/i> R = 4/0,5 = 8 Ω; I = 12/8 = <b>1,5 A<\/b>.<\/p><\/div>\n<div class=\"card\"><p><b>4.<\/b> Nikrom sim: l = 5 m, S = 0,2 mm², ρ = 1,1 Ω·mm²/m, U = 110 V. I = ?<\/p><p><i>Yechim:<\/i> R = 1,1·5/0,2 = 27,5 Ω; I = 110/27,5 = <b>4 A<\/b>.<\/p><\/div>\n<h2>Mustahkamlash testi <span class=\"tag\">5 daq<\/span><\/h2><div class=\"card\"><div id=\"qz\"><\/div><button class=\"b\" id=\"qc\">Tekshirish<\/button><p id=\"qr\"><\/p><\/div>\n<p class=\"q\">Baho: 5 to‘g‘ri — «5»; 4 — «4»; 3 — «3»; 2 va kam — «2».<\/p>\n<h2>Yakun va uyga vazifa <span class=\"tag\">3 daq<\/span><\/h2><p><b>Refleksiya:<\/b> «Bugun nimani bildim? Nima tushunarsiz qoldi?»<\/p><ol><li>Daftarda 18-§ masalalarini (darslikdagi 1–3) yeching.<\/li><li><b>Masala:<\/b> U = 5 V, I = 25 mA. R = ? (200 Ω)<\/li><li><b>Masala:<\/b> alyuminiy sim (ρ = 0,028), l = 50 m, S = 2 mm², U = 14 V. I = ? (R = 0,7 Ω; I = 20 A)<\/li><li><b>Ijodiy:<\/b> o‘zingiz uchun Om qonuniga doir 1 ta masala tuzing va yechimini yozing.<\/li><li><i>Qo‘shimcha:<\/i> 3-simulyatsiyada saqlagich kuymaydigan 3 ta variantni toping.<\/li><\/ol>\n<script>\nconst $=s=>document.querySelector(s),nf=(n,d=2)=>String(+n.toFixed(d)).replace('.',',');\nconst FG=getComputedStyle(document.documentElement).getPropertyValue('--fg')||'#888';\nconst MT=[[\"Mis\",0.017],[\"Alyuminiy\",0.028],[\"Temir\",0.10],[\"Nikrom\",1.1]];\nfunction gauge(v,max,L){const a=(-70+140*Math.min(v/max,1.05))*Math.PI/180;let t='';\n for(let i=0;i<=5;i++){const b=(-70+28*i)*Math.PI/180;t+=`<line class=\"w\" style=\"stroke-width:1\" x1=\"${60+40*Math.sin(b)}\" y1=\"${70-40*Math.cos(b)}\" x2=\"${60+46*Math.sin(b)}\" y2=\"${70-46*Math.cos(b)}\"/><text class=\"t\" style=\"font-size:8px\" x=\"${60+31*Math.sin(b)-5}\" y=\"${70-31*Math.cos(b)+3}\">${nf(max*i/5,2)}<\/text>`}\n const e=70*Math.PI/180;\n return `<rect x=\"2\" y=\"2\" width=\"116\" height=\"76\" rx=\"8\" class=\"w\" style=\"stroke-width:1\"/><path class=\"w\" d=\"M${60-46*Math.sin(e)} ${70-46*Math.cos(e)}A46 46 0 0 1 ${60+46*Math.sin(e)} ${70-46*Math.cos(e)}\"/>${t}<line x1=\"60\" y1=\"70\" x2=\"${60+42*Math.sin(a)}\" y2=\"${70-42*Math.cos(a)}\" stroke=\"#dc2626\" stroke-width=\"2\"/><circle cx=\"60\" cy=\"70\" r=\"4\" fill=\"var(--fg)\"/><text class=\"t\" x=\"54\" y=\"54\" style=\"font-size:14px;font-weight:700\">${L}<\/text>`}\nfunction per(s){s=((s%760)+760)%760;if(s<260)return[40+s,40];s-=260;if(s<120)return[300,40+s];s-=120;if(s<260)return[300-s,160];s-=260;return[40,160-s]}\nfunction parts(off){let h='';for(let k=0;k<26;k++){const p=per(k*760/26+off);h+=`<circle cx=\"${p[0]}\" cy=\"${p[1]}\" r=\"3\" fill=\"#2563eb\"/>`}return h}\nfunction box(x,y,txt,col){return `<rect x=\"${x-30}\" y=\"${y-13}\" width=\"60\" height=\"26\" rx=\"5\" fill=\"${col}\" stroke=\"var(--fg)\"/><text x=\"${x}\" y=\"${y+4}\" text-anchor=\"middle\" style=\"font-size:11px;fill:#111;font-weight:600\">${txt}<\/text>`}\nfunction circ(id,a,b,c,cb){return '<rect x=\"40\" y=\"40\" width=\"260\" height=\"120\" class=\"w\"/>'+box(40,100,a,'#fde68a')+box(170,40,b,'#fef08a')+box(300,100,c,cb||'#bbf7d0')+`<g id=\"${id}p\"><\/g>`}\nconst AN=[];function anim(o){o.off=0;o.d=0;AN.push(o)}\nfunction loop(){AN.forEach(a=>{const I=a.I(),mx=a.max();a.d+=(I-a.d)*.15;$('#'+a.g).innerHTML=gauge(a.d,mx,a.L);a.off+=(a.run===false?0:Math.min(I/mx,1)*6);const p=$('#'+a.p);if(p)p.innerHTML=(I>0&&a.run!==false)?parts(a.off):''});requestAnimationFrame(loop)}\nfunction rng(I){return I<=.6?.6:I<=1.2?1.2:I<=3?3:I<=6?6:12}\nfunction quiz(Q,K){$('#qz').innerHTML=Q.map((q,i)=>`<div class=\"qq\"><b>${i+1}. ${q[0]}<\/b>`+q[1].map((o,j)=>`<label><input type=\"radio\" name=\"q${i}\" value=\"${j}\"> ${'ABCD'[j]}) ${o}<\/label>`).join('')+'<\/div>').join('');\n$('#qc').onclick=()=>{let s=0;K.forEach((k,i)=>{const c=document.querySelector(`input[name=q${i}]:checked`);if(c&&+c.value===k)s++});\n$('#qr').innerHTML=`<b>${s}/5 → baho: ${s>=3?s:2}<\/b>`+(s<5?' · Xatolarni qayta ko‘rib chiqing.':' · Ajoyib! 🎉')}}\n\n\n/* 1 */\nconst PB=[{t:\"U = 12 V, R = 4 kΩ. I = ?\",g:\"U = 12 V; R = 4 kΩ\",si:\"R = 4000 Ω\",f:\"I = U / R\",c:\"I = 12 / 4000 = 0,003 A\",a:0.003,r:\"I = 0,003 A = 3 mA\"},\n{t:\"I = 250 mA, R = 40 Ω. U = ?\",g:\"I = 250 mA; R = 40 Ω\",si:\"I = 0,25 A\",f:\"U = I · R\",c:\"U = 0,25 · 40 = 10 V\",a:10,r:\"U = 10 V\"},\n{t:\"U = 220 V, I = 0,5 A. R = ?\",g:\"U = 220 V; I = 0,5 A\",si:\"SI da berilgan\",f:\"R = U / I\",c:\"R = 220 / 0,5 = 440 Ω\",a:440,r:\"R = 440 Ω\"},\n{t:\"U = 36 V, I = 12 mA. R = ?\",g:\"U = 36 V; I = 12 mA\",si:\"I = 0,012 A\",f:\"R = U / I\",c:\"R = 36 / 0,012 = 3000 Ω\",a:3000,r:\"R = 3000 Ω = 3 kΩ\"},\n{t:\"R = 2 kΩ, I = 15 mA. U = ?\",g:\"R = 2 kΩ; I = 15 mA\",si:\"R = 2000 Ω; I = 0,015 A\",f:\"U = I · R\",c:\"U = 0,015 · 2000 = 30 V\",a:30,r:\"U = 30 V\"},\n{t:\"U = 9 V, R = 300 Ω. I = ?\",g:\"U = 9 V; R = 300 Ω\",si:\"SI da berilgan\",f:\"I = U / R\",c:\"I = 9 / 300 = 0,03 A\",a:0.03,r:\"I = 0,03 A = 30 mA\"}];\nlet pb=PB[0],step=0;const SN=[\"1) Berilgan\",\"2) SI ga o‘tkazish\",\"3) Formula\",\"4) Hisob\",\"5) Javob\"];\nfunction p1(){$('#pq').textContent=pb.t;const v=[pb.g,pb.si,pb.f,pb.c,pb.r];$('#sv').innerHTML=SN.map((s,i)=>i<step?`<p><b>${s}:<\/b> ${v[i]}<\/p>`:'').join('');$('#sn').disabled=step>=5;$('#pf').textContent=''}\n$('#sn').onclick=()=>{step++;p1()};\n$('#pn').onclick=()=>{pb=PB[Math.floor(Math.random()*PB.length)];step=0;$('#pa').value='';p1()};\n$('#pc').onclick=()=>{const a=parseFloat($('#pa').value.replace(',','.'));$('#pf').innerHTML=Math.abs(a-pb.a)<1e-6*Math.max(1,pb.a)?'<span style=\"color:#16a34a\">To‘g‘ri! ✅ '+pb.r+'<\/span>':'<span style=\"color:#dc2626\">Xato ❌ Bosqichlarni ochib ko‘ring.<\/span>'};p1();\n/* 2 */\nfunction g2(){const U=+$('#uc').value,r1=+$('#ra').value,r2=+$('#rb').value,X=u=>30+u/12*300,Y=i=>138-Math.min(i,3)/3*128;\n $('#ao').textContent=r1+' Ω';$('#bo').textContent=r2+' Ω';$('#uo').textContent=nf(U,1)+' V';\n let h=`<rect x=\"30\" y=\"10\" width=\"300\" height=\"128\" class=\"w\" style=\"stroke-width:1\"/><text class=\"t\" x=\"0\" y=\"16\">I, A<\/text><text class=\"t\" x=\"296\" y=\"154\">U, V<\/text>`;\n [[r1,'#2563eb'],[r2,'#dc2626']].forEach(([r,c])=>{const ux=12/r>3?3*r:12;h+=`<line x1=\"${X(0)}\" y1=\"${Y(0)}\" x2=\"${X(ux)}\" y2=\"${Y(ux/r)}\" stroke=\"${c}\" stroke-width=\"3\"/>`;if(U/r<=3)h+=`<circle cx=\"${X(U)}\" cy=\"${Y(U/r)}\" r=\"4\" fill=\"${c}\"/>`});\n h+=`<line x1=\"${X(U)}\" y1=\"138\" x2=\"${X(U)}\" y2=\"10\" stroke=\"#94a3b8\" stroke-dasharray=\"4\"/>`;$('#gr').innerHTML=h;\n $('#i1').textContent=nf(U/r1)+' A';$('#i2').textContent=nf(U/r2)+' A';$('#rr').textContent=U>0?nf(r1)+' Ω':'—'}\n['#ra','#rb','#uc'].forEach(s=>$(s).oninput=g2);g2();\n$('#ch').onclick=e=>{const k=e.target.dataset.k;if(k==null)return;const r1=+$('#ra').value,r2=+$('#rb').value,t=r1>r2?'1':r2>r1?'2':'0';\n $('#chf').innerHTML=k==t?'<span style=\"color:#16a34a\">To‘g‘ri! ✅ Grafigi pastroq o‘tkazgichning qarshiligi katta.<\/span>':'<span style=\"color:#dc2626\">Xato ❌ Bir xil U da I ni solishtiring.<\/span>'};\n/* 3 */\n$('#m3').innerHTML=MT.map((m,i)=>`<option value=\"${i}\">${m[0]} (ρ = ${nf(m[1],3)})<\/option>`).join('');$('#m3').value=3;\nconst A3={p:'s3p',g:'ga3',L:'A',I:()=>Math.min(A3.cur||0,5.3),max:()=>5};anim(A3);\nfunction c3(){const m=MT[$('#m3').value],l=+$('#l3').value,S=+$('#s3').value,U=+$('#u3').value,R=m[1]*l/S,I=U/R,ok=I<=5;A3.cur=I;A3.run=ok;\n $('#lo').textContent=l+' m';$('#so').textContent=nf(S,1)+' mm²';$('#vo').textContent=U+' V';\n $('#s3').innerHTML=circ('s3','U = '+U+' V',m[0],ok?'Saqlagich':'KUYDI',ok?'#bbf7d0':'#fca5a5');\n $('#st3').innerHTML=`1) R = ρ·l/S = ${nf(m[1],3)}·${l}/${nf(S,1)} = ${nf(R,3)} Ω<br>2) I = U/R = ${U}/${nf(R,3)} = ${nf(I)} A<br>3) ${ok?'I ≤ 5 A: saqlagich chidaydi, zanjir ishlaydi ✅':'I > 5 A: saqlagich kuyadi, zanjir uziladi ⚠️'}`}\n['#m3','#l3','#s3','#u3'].forEach(s=>$(s).oninput=c3);c3();\n\nquiz([[\"U = 10 V, I = 2 A. R = ?\",[\"20 Ω\",\"5 Ω\",\"0,2 Ω\",\"12 Ω\"]],[\"500 mA necha amper?\",[\"500 A\",\"50 A\",\"0,5 A\",\"0,05 A\"]],[\"Grafikda tikroq chiziq qanday qarshilikka mos?\",[\"kattaroq\",\"kichikroq\",\"farqi yo‘q\",\"nolga\"]],[\"Mis sim (ρ = 0,017), l = 100 m, S = 1 mm², U = 3,4 V. I = ?\",[\"0,5 A\",\"1,7 A\",\"2 A\",\"5,8 A\"]],[\"Saqlagich 5 A ga mo‘ljallangan, zanjirda 6 A tok bo‘lsa…\",[\"saqlagich kuyadi, zanjir uziladi\",\"hech narsa bo‘lmaydi\",\"tok kamayadi\",\"lampa yorqinlashadi\"]]],[1,2,1,2,0]);loop();\n<\/script><\/body><\/html>"}, {"t": "19-§ Laboratoriya ishi: Om qonuni", "h": "<!DOCTYPE html><html lang=\"uz\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><title>Fizika 8-sinf: 19-§ Laboratoriya ishi. Om qonunini o‘rganish — dars ishlanma<\/title><style>\n:root{--bg:#fff;--fg:#1a1a1a;--card:#f3f4f6;--ac:#2563eb;--mut:#6b7280;--bd:#d1d5db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#111827;--fg:#f3f4f6;--card:#1f2937;--ac:#60a5fa;--mut:#9ca3af;--bd:#374151}}\n:root[data-theme=\"dark\"]{--bg:#111827;--fg:#f3f4f6;--card:#1f2937;--ac:#60a5fa;--mut:#9ca3af;--bd:#374151}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}\nbody{margin:0 auto;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;padding:12px;max-width:760px}\nh1{font-size:1.3rem;margin:4px 0 8px}h2{font-size:1.05rem;margin:20px 0 6px;color:var(--ac)}p{margin:6px 0}ul,ol{padding-left:20px;margin:4px 0}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}\n.tag{display:inline-block;background:var(--ac);color:#fff;border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:400}\n.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.84rem}th,td{border:1px solid var(--bd);padding:5px;text-align:left}\ndetails{margin:6px 0}summary{cursor:pointer;font-weight:600}svg.sc{width:100%;height:auto;display:block}\n.w{stroke:var(--fg);fill:none;stroke-width:2}.t{fill:var(--fg);font-size:11px}\n.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;align-items:center}\nbutton.b,select,input.n{font:inherit;font-size:.9rem;padding:7px 9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}\nbutton.b{cursor:pointer}button.b.on{background:var(--ac);color:#fff;border-color:var(--ac)}select{flex:1;min-width:130px}input.n{width:110px}\ninput[type=range]{width:100%;accent-color:var(--ac)}\n.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.v{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px;text-align:center}\n.v b{display:block;color:var(--ac)}.v span{font-size:.72rem;color:var(--mut)}\n.q{font-size:.88rem;color:var(--mut)}.msg{font-weight:600;margin:6px 0}.res{font-weight:700;color:var(--ac);margin:6px 0}\n.sim{display:grid;grid-template-columns:1fr;gap:8px}@media(min-width:620px){.sim{grid-template-columns:2fr 1fr}}\n.qq label{display:block;padding:2px 0}.qq{margin:8px 0}\n<\/style><\/head><body>\n<h1>🔬 Laboratoriya ishi. Om qonunini o‘rganish<\/h1><p>Fizika, 8-sinf · II bob «Elektr toki» · 19-§ · <b>45 daqiqa<\/b> · dars ishlanma + interaktiv simulyatsiyalar<\/p><p><b>Mavzu:<\/b> Laboratoriya ishi. Om qonunini o‘rganish<\/p>\n<div class=\"card\"><p><b>Jihozlar:<\/b> proyektor yoki planshet, ampermetr, voltmetr, manba, rezistor, ulovchi simlar, daftar.<\/p>\n<ul><li><b>Ta’limiy:<\/b> Om qonunini tajribada tekshirish, rezistor qarshiligini o‘lchash, asboblarni to‘g‘ri ulash.<\/li><li><b>Rivojlantiruvchi:<\/b> o‘lchash, jadval to‘ldirish, grafik chizish va xulosa chiqarish ko‘nikmalarini shakllantirish.<\/li><li><b>Tarbiyaviy:<\/b> aniqlik, jamoada ishlash va texnika xavfsizligiga rioya qilishni tarbiyalash.<\/li><\/ul><p><b>Kutilayotgan natija:<\/b> o‘quvchi zanjirni yig‘adi, I va U ni o‘lchaydi, R ni hisoblaydi, grafik chizadi va Om qonuni haqida xulosa chiqaradi.<\/p><\/div>\n<h2>Dars bosqichlari<\/h2><div class=\"tw\"><table><tr><th>№<\/th><th>Bosqich<\/th><th>Vaqt<\/th><\/tr><tr><td>1<\/td><td>Tashkiliy qism<\/td><td>2 daq<\/td><\/tr><tr><td>2<\/td><td>Takrorlash va motivatsiya<\/td><td>4 daq<\/td><\/tr><tr><td>3<\/td><td>1-reja: Maqsad, sxema, xavfsizlik<\/td><td>9 daq<\/td><\/tr><tr><td>4<\/td><td>2-reja: Zanjirni yig‘ish va o‘lchash<\/td><td>12 daq<\/td><\/tr><tr><td>5<\/td><td>3-reja: Jadval, grafik, xulosa<\/td><td>10 daq<\/td><\/tr><tr><td>6<\/td><td>Mustahkamlash testi<\/td><td>5 daq<\/td><\/tr><tr><td>7<\/td><td>Yakun, baholash, uyga vazifa<\/td><td>3 daq<\/td><\/tr><\/table><\/div>\n<h2>Takrorlash va motivatsiya <span class=\"tag\">4 daq<\/span><\/h2>\n<p><b>Savollar:<\/b> Om qonunini ayting. Ampermetr va voltmetr qanday ulanadi? Reostat nima uchun kerak?<\/p>\n<p><b>Motivatsiya:<\/b> Om qonuni formuladan iborat xolos mi? Bugun uni o‘zimiz tajribada tekshirib ko‘ramiz.<\/p>\n<div class=\"card\"><p><b>Ishning maqsadi:<\/b> Om qonunini tajribada tekshirish: tok kuchining kuchlanishga bog‘liqligini o‘rganish va rezistorning qarshiligini aniqlash.<\/p>\n<p><b>Jihozlar:<\/b> manba, kalit, reostat, noma’lum rezistor, ampermetr, voltmetr, simlar.<\/p><\/div><h2>1-reja. Ish maqsadi, sxema va xavfsizlik <span class=\"tag\">9 daq<\/span><\/h2>\n<p><b>Maqsad:<\/b> ishning maqsadi va tartibini bilish; sxemani to‘g‘ri chizish va xavfsizlik qoidalariga rioya qilish.<\/p><p><b>Vaqt:<\/b> tushuntirish 4 · 1-simulyatsiya 3 · savol-topshiriq 2 daqiqa.<\/p>\n<div class=\"card\"><b>1-simulyatsiya: sxemani to‘g‘ri ulang<\/b>\n<svg id=\"s1\" class=\"sc\" viewBox=\"0 -35 340 235\"><\/svg><svg id=\"x1\" style=\"display:none\"><\/svg>\n<div class=\"row\"><span>Ampermetr:<\/span><span id=\"b1a\"><button class=\"b on\" data-k=\"s\">ketma-ket<\/button> <button class=\"b\" data-k=\"p\">parallel<\/button><\/span><\/div>\n<div class=\"row\"><span>Voltmetr:<\/span><span id=\"b1v\"><button class=\"b on\" data-k=\"p\">parallel<\/button> <button class=\"b\" data-k=\"s\">ketma-ket<\/button><\/span><\/div>\n<div class=\"row\"><button class=\"b\" id=\"k1\">Kalit: ochiq<\/button><\/div>\n<p class=\"msg\" id=\"o1\"><\/p><div class=\"row\"><div class=\"v\" style=\"flex:1\"><b id=\"i1\"><\/b><span>ampermetr<\/span><\/div><div class=\"v\" style=\"flex:1\"><b id=\"v1\"><\/b><span>voltmetr<\/span><\/div><\/div>\n<p><b>Xavfsizlik shartnomasi:<\/b><\/p><div id=\"chk\"><\/div><p class=\"msg\" id=\"chm\"><\/p><\/div>\n<details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary>\n<p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Sxemani chizadi: manba, kalit, reostat, rezistor ketma-ket; ampermetr ketma-ket; voltmetr rezistorga parallel.<\/li><li>Ish tartibini tushuntiradi: sxema → yig‘ish (kalit ochiq) → o‘qituvchi tekshiradi → o‘lchash → jadval → grafik → xulosa.<\/li><li>Xavfsizlik: ampermetrni parallel ulamaslik, qutblarga rioya qilish, shkalani oshirmaslik, ish tugagach kalitni ochish.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> sxemani daftarga chizadi, simulyatsiyada noto‘g‘ri ulanishning oqibatini ko‘radi, xavfsizlik shartnomasini belgilaydi.<\/p>\n<p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Ampermetr rezistorga parallel ulansa nima bo‘ladi? (qisqa tutashuv)<\/li><li>Voltmetr ketma-ket ulansa-chi? (tok deyarli yo‘qoladi)<\/li><li>Reostatning vazifasi nima? (tok kuchi va kuchlanishni o‘zgartirish)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> sxemani xatosiz chizadi, oqibatlarni tushuntiradi.<\/li><li><b>4:<\/b> 1 ta kichik xato.<\/li><li><b>3:<\/b> yordam bilan chizadi.<\/li><li><b>2:<\/b> sxemani chiza olmaydi.<\/li><\/ul><\/details><h2>2-reja. Zanjirni yig‘ish va I, U ni o‘lchash <span class=\"tag\">12 daq<\/span><\/h2>\n<p><b>Maqsad:<\/b> zanjirni yig‘ish, reostat yordamida kamida 5 xil holat uchun I va U ni o‘lchash.<\/p><p><b>Vaqt:<\/b> yig‘ish 4 · o‘lchash (2-simulyatsiya/amaliy) 6 · tekshirish 2 daqiqa.<\/p>\n<div class=\"card\"><b>2-simulyatsiya: o‘lchash (R noma’lum)<\/b>\n<div class=\"sim\"><svg id=\"s2\" class=\"sc\" viewBox=\"0 -35 340 235\"><\/svg><div><svg id=\"ga2\" class=\"sc\" viewBox=\"0 0 120 80\"><\/svg><svg id=\"gv2\" class=\"sc\" viewBox=\"0 0 120 80\"><\/svg><\/div><\/div>\n<label>Reostat surgichi (qarshilik): <b id=\"po\"><\/b><\/label><input type=\"range\" id=\"p2\" min=\"0\" max=\"100\" value=\"100\">\n<div class=\"row\"><button class=\"b\" id=\"k2\">Kalit: yopiq<\/button><button class=\"b\" id=\"nr\">🎲 Yangi rezistor<\/button><button class=\"b\" id=\"rc\">📝 O‘lchovni yozish<\/button><\/div>\n<div class=\"g\"><div class=\"v\"><b id=\"ri\"><\/b><span>I (bo‘lim 0,02 A)<\/span><\/div><div class=\"v\"><b id=\"ru\"><\/b><span>U (bo‘lim 0,2 V)<\/span><\/div><div class=\"v\"><b id=\"rn\"><\/b><span>yozilgan o‘lchovlar<\/span><\/div><\/div>\n<p class=\"q\">Manba 6 V, reostat 0–20 Ω. Surgichni surib kamida 5 xil holat uchun I va U ni yozing. Asboblar bo‘lim qiymatigacha yaxlitlab o‘qiladi.<\/p><\/div>\n<details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary>\n<p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Guruhlarni (2–3 kishi) tuzadi, asboblarni tarqatadi, yig‘ilgan zanjirni tekshiradi.<\/li><li>Asbob shkalasidagi bo‘lim qiymatini aniqlashni ko‘rsatadi: bo‘lim qiymati = chegara / bo‘limlar soni.<\/li><li>Reostat surgichini surib o‘lchashni kuzatadi, xatolarni to‘xtatadi.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> zanjirni yig‘adi, reostat bilan tokni o‘zgartiradi, har holatda ampermetr va voltmetr ko‘rsatishini yozadi.<\/p>\n<p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Surgichni surganda I va U qanday o‘zgardi? (birgalikda ortdi yoki kamaydi)<\/li><li>Asbob bo‘lim qiymati 0,02 A bo‘lsa, o‘lchash xatoligi taxminan qancha? (bo‘limning yarmi, 0,01 A)<\/li><li>Kalitni nega har o‘lchovdan keyin ochish yaxshi?<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> zanjirni xatosiz yig‘adi, 5 ta o‘lchovni aniq yozadi.<\/li><li><b>4:<\/b> 4 ta o‘lchov, kichik noaniqlik.<\/li><li><b>3:<\/b> 3 ta o‘lchov, yordam bilan.<\/li><li><b>2:<\/b> o‘lchay olmaydi.<\/li><\/ul><\/details><h2>3-reja. Jadval, grafik, R ni hisoblash va xulosa <span class=\"tag\">10 daq<\/span><\/h2>\n<p><b>Maqsad:<\/b> natijalarni qayta ishlash: R = U / I ni hisoblash, I(U) grafigini chizish, xulosa chiqarish.<\/p><p><b>Vaqt:<\/b> hisoblash 3 · grafik va 3-simulyatsiya 4 · xulosa 3 daqiqa.<\/p>\n<div class=\"card\"><b>3-simulyatsiya: jadval, grafik va xulosa<\/b>\n<div class=\"row\"><button class=\"b\" id=\"ld\">Namuna ma’lumot<\/button><button class=\"b\" id=\"cl\">Tozalash<\/button><button class=\"b\" id=\"rv\">R ni tekshirish<\/button><\/div>\n<div class=\"tw\"><table id=\"t3\"><\/table><\/div><svg id=\"gr\" class=\"sc\" viewBox=\"0 0 340 160\"><\/svg>\n<p class=\"res\" id=\"rs\"><\/p><p class=\"msg\" id=\"rf\"><\/p>\n<p><b>Xulosa (daftarga yozing):<\/b><\/p><div class=\"tw\"><table><tr><td><input style=\"width:100%;border:0;background:transparent;color:inherit;font:inherit\" placeholder=\"1) I(U) grafigi ... bo‘ldi, demak I ~ U.\"><\/td><\/tr><tr><td><input style=\"width:100%;border:0;background:transparent;color:inherit;font:inherit\" placeholder=\"2) Rezistorning qarshiligi R = ... Ω.\"><\/td><\/tr><tr><td><input style=\"width:100%;border:0;background:transparent;color:inherit;font:inherit\" placeholder=\"3) Xatolik sabablari: ...\"><\/td><\/tr><\/table><\/div><\/div>\n<details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary>\n<p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Har o‘lchov uchun R = U / I ni hisoblatadi, o‘rtacha qiymatni topdiradi.<\/li><li>Grafik chizdiradi: gorizontal o‘q — U, vertikal — I. Nuqtalar koordinata boshidan o‘tuvchi to‘g‘ri chiziq atrofida joylashadi.<\/li><li>Xulosa: I ~ U (Om qonuni tasdiqlandi), R o‘zgarmas, kichik farqlar o‘lchash xatoligidan.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> jadvalni to‘ldiradi, grafik chizadi, R o‘rtachasini topadi, xulosani yozadi.<\/p>\n<p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Nuqtalar nega aniq bitta chiziqda yotmaydi? (asbob xatoligi, yaxlitlash)<\/li><li>Grafik qanday ko‘rinishda chiqdi va bu nimani bildiradi? (to‘g‘ri chiziq: I ~ U)<\/li><li>R o‘rtachasi qancha?<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> hisob-kitob, grafik va xulosa to‘liq va aniq.<\/li><li><b>4:<\/b> grafik yoki hisobda kichik xato.<\/li><li><b>3:<\/b> qisman bajaradi, xulosani yordam bilan yozadi.<\/li><li><b>2:<\/b> hisobot yo‘q.<\/li><\/ul><\/details>\n<h2>Mustahkamlash testi <span class=\"tag\">5 daq<\/span><\/h2><div class=\"card\"><div id=\"qz\"><\/div><button class=\"b\" id=\"qc\">Tekshirish<\/button><p id=\"qr\"><\/p><\/div>\n<p class=\"q\">Baho: 5 to‘g‘ri — «5»; 4 — «4»; 3 — «3»; 2 va kam — «2».<\/p>\n<h2>Yakun va uyga vazifa <span class=\"tag\">3 daq<\/span><\/h2><p><b>Refleksiya:<\/b> «Bugun nimani bildim? Nima tushunarsiz qoldi?»<\/p><ol><li>Laboratoriya hisobotini daftarda yakunlang (sxema, jadval, grafik, xulosa).<\/li><li><b>Masala:<\/b> U = 6 V, I = 0,4 A. R = ? (15 Ω)<\/li><li><b>Masala:<\/b> R = 25 Ω, I = 0,2 A. U = ? (5 V)<\/li><li><b>Ijodiy:<\/b> R qiymatlari nega bir-biridan biroz farq qiladi? Xatolik sabablarini 3 ta gapda yozing.<\/li><li><i>Qo‘shimcha:<\/i> 2-simulyatsiyada «Yangi rezistor» tugmasini bosib, boshqa rezistorning R ini toping.<\/li><\/ol>\n<script>\nconst $=s=>document.querySelector(s),nf=(n,d=2)=>String(+n.toFixed(d)).replace('.',',');\nconst FG=getComputedStyle(document.documentElement).getPropertyValue('--fg')||'#888';\nconst MT=[[\"Mis\",0.017],[\"Alyuminiy\",0.028],[\"Temir\",0.10],[\"Nikrom\",1.1]];\nfunction gauge(v,max,L){const a=(-70+140*Math.min(v/max,1.05))*Math.PI/180;let t='';\n for(let i=0;i<=5;i++){const b=(-70+28*i)*Math.PI/180;t+=`<line class=\"w\" style=\"stroke-width:1\" x1=\"${60+40*Math.sin(b)}\" y1=\"${70-40*Math.cos(b)}\" x2=\"${60+46*Math.sin(b)}\" y2=\"${70-46*Math.cos(b)}\"/><text class=\"t\" style=\"font-size:8px\" x=\"${60+31*Math.sin(b)-5}\" y=\"${70-31*Math.cos(b)+3}\">${nf(max*i/5,2)}<\/text>`}\n const e=70*Math.PI/180;\n return `<rect x=\"2\" y=\"2\" width=\"116\" height=\"76\" rx=\"8\" class=\"w\" style=\"stroke-width:1\"/><path class=\"w\" d=\"M${60-46*Math.sin(e)} ${70-46*Math.cos(e)}A46 46 0 0 1 ${60+46*Math.sin(e)} ${70-46*Math.cos(e)}\"/>${t}<line x1=\"60\" y1=\"70\" x2=\"${60+42*Math.sin(a)}\" y2=\"${70-42*Math.cos(a)}\" stroke=\"#dc2626\" stroke-width=\"2\"/><circle cx=\"60\" cy=\"70\" r=\"4\" fill=\"var(--fg)\"/><text class=\"t\" x=\"54\" y=\"54\" style=\"font-size:14px;font-weight:700\">${L}<\/text>`}\nfunction per(s){s=((s%760)+760)%760;if(s<260)return[40+s,40];s-=260;if(s<120)return[300,40+s];s-=120;if(s<260)return[300-s,160];s-=260;return[40,160-s]}\nfunction parts(off){let h='';for(let k=0;k<26;k++){const p=per(k*760/26+off);h+=`<circle cx=\"${p[0]}\" cy=\"${p[1]}\" r=\"3\" fill=\"#2563eb\"/>`}return h}\nfunction box(x,y,txt,col){return `<rect x=\"${x-30}\" y=\"${y-13}\" width=\"60\" height=\"26\" rx=\"5\" fill=\"${col}\" stroke=\"var(--fg)\"/><text x=\"${x}\" y=\"${y+4}\" text-anchor=\"middle\" style=\"font-size:11px;fill:#111;font-weight:600\">${txt}<\/text>`}\nfunction circ(id,a,b,c,cb){return '<rect x=\"40\" y=\"40\" width=\"260\" height=\"120\" class=\"w\"/>'+box(40,100,a,'#fde68a')+box(170,40,b,'#fef08a')+box(300,100,c,cb||'#bbf7d0')+`<g id=\"${id}p\"><\/g>`}\nconst AN=[];function anim(o){o.off=0;o.d=0;AN.push(o)}\nfunction loop(){AN.forEach(a=>{const I=a.I(),mx=a.max();a.d+=(I-a.d)*.15;$('#'+a.g).innerHTML=gauge(a.d,mx,a.L);a.off+=(a.run===false?0:Math.min(I/mx
