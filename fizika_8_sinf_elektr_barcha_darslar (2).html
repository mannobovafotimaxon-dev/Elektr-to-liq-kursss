n:6px 0;font-size:13px;color:#fff}.bar i{display:block;text-align:center;line-height:28px;font-style:normal;overflow:hidden}\n.warn{border-left:4px solid var(--bad);padding-left:10px}\n<\/style><\/head><body><main>\n<h1>Iste’molchilarni aralash ulash (mustaqil o‘qish uchun)<\/h1><p class=sub>Fizika, 8-sinf · II bob «Elektr toki» · 25-§ · 45 daqiqa · dars ishlanma + interaktiv simulyatsiyalar<\/p><p><b>Mavzu:<\/b> Iste’molchilarni aralash ulash (mustaqil o‘qish uchun)<\/p>\n<div class=box><p><b>Jihozlar:<\/b> proyektor yoki planshet, darslik, daftar, kompyuter yoki telefon (simulyatsiya uchun).<\/p><ul><li><b>Ta’limiy:<\/b> aralash ulanish tushunchasi va hisoblash algoritmini mustaqil o‘zlashtirish.<\/li><li><b>Rivojlantiruvchi:<\/b> matn bilan ishlash, tahlil qilish, sxemani soddalashtirish ko‘nikmalari.<\/li><li><b>Tarbiyaviy:<\/b> mustaqil o‘rganish va mas’uliyatni tarbiyalash.<\/li><\/ul><p><b>Kutilayotgan natija:<\/b> o‘quvchi aralash ulanishni ajratadi, R, I, U ni qadamma-qadam hisoblaydi va natijani tekshiradi.<\/p><\/div>\n<h2>Dars bosqichlari<\/h2><div class=tw><table><tr><th>№<\/th><th>Bosqich<\/th><th>Vaqt<\/th><\/tr><tr><td>1<\/td><td>Tashkiliy qism<\/td><td>2 daq<\/td><\/tr><tr><td>2<\/td><td>Takrorlash<\/td><td>5 daq<\/td><\/tr><tr><td>3<\/td><td>1-reja: Mustaqil o‘qish<\/td><td>8 daq<\/td><\/tr><tr><td>4<\/td><td>2-reja: Aralash zanjir simulyatsiyasi<\/td><td>12 daq<\/td><\/tr><tr><td>5<\/td><td>3-reja: Hisoblash algoritmi<\/td><td>10 daq<\/td><\/tr><tr><td>6<\/td><td>Mustahkamlash testi<\/td><td>5 daq<\/td><\/tr><tr><td>7<\/td><td>Yakun, baholash, uyga vazifa<\/td><td>3 daq<\/td><\/tr><\/table><\/div><h2>Tashkiliy qism <span class=badge>2 daq<\/span><\/h2><p>Salomlashish, davomat. Bugungi dars — mustaqil o‘qish darsi: o‘quvchilar darslik matni bilan o‘zlari ishlaydi, o‘qituvchi yo‘naltiradi va tekshiradi.<\/p><h2>Takrorlash <span class=badge>5 daq<\/span><\/h2><p><b>Savollar:<\/b> Ketma-ket ulanishda I, U, R qanday? Parallel ulanishda-chi? Uydagi lampalar qanday ulangan?<\/p><p><b>Motivatsiya:<\/b> Kvartira elektr sxemasida umumiy avtomat lampalarga ketma-ket, lampalar o‘zaro parallel ulangan. Bunday ulanish qanday ataladi? Bugun mustaqil o‘rganamiz.<\/p><h2>1-reja. Mustaqil o‘qish: darslik matni bilan ishlash <span class=badge>8 daq<\/span><\/h2><p><b>Maqsad:<\/b> 25-§ ni mustaqil o‘qib, aralash ulanish tushunchasini o‘zlashtirish.<\/p><p><b>Vaqt:<\/b> o‘qish 4 · savollarga javob 3 · tekshirish 1 daqiqa.<\/p><div class=box><b>1-simulyatsiya: o‘qish yo‘rig‘i va ulanishni aniqlash<\/b><p><b>A) Matnni o‘qib, savollarga javob bering<\/b> (javobni ochib tekshiring):<\/p><details><summary>1. Aralash ulanish deb nimaga aytiladi?<\/summary><p>Zanjirda ham ketma-ket, ham parallel ulangan qismlar bo‘lgan ulanish.<\/p><\/details><details><summary>2. Aralash zanjir qarshiligi qanday topiladi?<\/summary><p>Avval parallel qism qarshiligi R₂₃ topiladi, so‘ng R = R₁ + R₂₃.<\/p><\/details><details><summary>3. Qaysi rezistordan umumiy tok o‘tadi?<\/summary><p>R₁ dan (u parallel tarmoqlanishdan oldin turadi).<\/p><\/details><details><summary>4. Parallel qismdagi kuchlanish qanday?<\/summary><p>Ikkala tarmoqda bir xil: U₂₃ = U − U₁.<\/p><\/details><details><summary>5. Natijani qanday tekshirish mumkin?<\/summary><p>I = I₂ + I₃ bo‘lishi kerak.<\/p><\/details><p><b>B) Qaysi ulanish?<\/b><\/p><div id=cl><\/div><p id=sc><\/p><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Mustaqil ishni yo‘naltiradi, qiynalgan o‘quvchilarga yordam beradi.<\/li><li>Sxema chizishda xatolarni to‘g‘rilaydi.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> matnni o‘qiydi, tayanch konspekt tuzadi, savollarga javob beradi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Aralash ulanish nima? Misol keltiring.<\/li><li>Qaysi qismdan hisoblashni boshlaymiz?<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> Matnni to‘liq o‘zlashtirgan, barcha savolga javob beradi.<\/li><li><b>4:<\/b> 1 ta kichik xato.<\/li><li><b>3:<\/b> Yordam bilan javob beradi.<\/li><li><b>2:<\/b> Javob bera olmaydi.<\/li><\/ul><\/details><h2>2-reja. Aralash zanjir simulyatsiyasi <span class=badge>12 daq<\/span><\/h2><p><b>Maqsad:<\/b> aralash ulanishda I, U, R ni o‘lchash va qonuniyatlarni tekshirish.<\/p><p><b>Vaqt:<\/b> tushuntirish 3 · simulyatsiya 7 · tekshirish 2 daqiqa.<\/p><div class=box><b>2-simulyatsiya: R₁ ketma-ket, R₂ va R₃ parallel<\/b><svg id=s1 viewBox=\"0 0 340 200\"><\/svg><p id=t1><\/p><label>Manba kuchlanishi U: <input type=range id=u1 min=3 max=24 step=1 value=12><\/label><label>R₁: <input type=range id=a1 min=2 max=20 step=1 value=4><\/label><label>R₂: <input type=range id=b1 min=2 max=30 step=1 value=6><\/label><label>R₃: <input type=range id=c1 min=2 max=30 step=1 value=3><\/label><div class=out id=o1><\/div><p class=sub>R₁ dan umumiy tok o‘tadi; parallel tarmoqlarda tok qarshilikka teskari taqsimlanadi. Doim I = I₂ + I₃.<\/p><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Sxemada qismlarni ajratib ko‘rsatadi (ketma-ket va parallel qism).<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> slayderlarni o‘zgartirib, I₂ + I₃ = I ekanini tekshiradi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>R₃ ni kamaytirsak, umumiy tok qanday o‘zgaradi? (ortadi)<\/li><li>R₁ ni oshirsak, U₂₃ qanday o‘zgaradi? (kamayadi)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> Barcha munosabatlarni tasdiqlaydi.<\/li><li><b>4:<\/b> 1 ta kichik xato.<\/li><li><b>3:<\/b> Yordam bilan.<\/li><li><b>2:<\/b> Tekshira olmaydi.<\/li><\/ul><\/details><h2>3-reja. Hisoblash algoritmi: sxemani soddalashtirish <span class=badge>10 daq<\/span><\/h2><p><b>Maqsad:<\/b> aralash zanjirni qadamma-qadam hisoblashni o‘rganish.<\/p><p><b>Vaqt:<\/b> namoyish 3 · mustaqil 5 · muhokama 2 daqiqa.<\/p><div class=box><b>3-simulyatsiya: qadamlar (qiymatlar 2-simulyatsiyadan olinadi)<\/b><svg id=s3 viewBox=\"0 0 340 120\"><\/svg><button class=btn id=st>Keyingi qadam<\/button><button class=btn id=sr>Boshidan<\/button><div id=sl><\/div><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Algoritmni doskada yozadi: 1) parallel qism → R₂₃; 2) R = R₁ + R₂₃; 3) I = U/R; 4) U₁ = IR₁, U₂₃ = U − U₁; 5) I₂, I₃.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> qadamlarni daftarga yozadi, o‘z qiymatlari bilan takrorlaydi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Nima uchun avval parallel qismni hisoblaymiz? (u bitta ekvivalent qarshilikka almashadi)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> Algoritmni to‘liq bajaradi.<\/li><li><b>4:<\/b> 1 ta kichik xato.<\/li><li><b>3:<\/b> Yordam bilan.<\/li><li><b>2:<\/b> Bajara olmaydi.<\/li><\/ul><\/details><h2>Mustahkamlash testi <span class=badge>5 daq<\/span><\/h2><div class=box id=qz><\/div><h2>Yakun va uyga vazifa <span class=badge>3 daq<\/span><\/h2><p><b>Refleksiya:<\/b> «Bugun nimani mustaqil o‘rgandim?»<\/p><ol><li>25-§ konspektini yakunlang, 3 ta aralash sxema chizing.<\/li><li><b>Masala:<\/b> R₁ = 4 Ω, R₂ = R₃ = 6 Ω, U = 14 V. R₂₃, R, I ni toping. (3 Ω; 7 Ω; 2 A)<\/li><li><b>Ijodiy:<\/b> kvartirangizdagi aralash ulanishga misol toping.<\/li><\/ol>\n<script>\nconst $=s=>document.querySelector(s),NS=\"http://www.w3.org/2000/svg\",pk=a=>a[Math.floor(Math.random()*a.length)];\nconst f=(x,d=2)=>(+x).toFixed(d).replace(\".\",\",\"),rd=(x,s)=>Math.round(x/s)*s,spd=I=>I>0?Math.min(25+I*90,240):0;\nfunction S(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}\nfunction box(p,x,y,w,h,t,fill){S(\"rect\",{x,y,width:w,height:h,rx:6,fill:fill||\"var(--card)\",stroke:\"var(--wire)\",\"stroke-width\":2},p);const e=S(\"text\",{x:x+w/2,y:y+h/2+4,\"text-anchor\":\"middle\",\"font-size\":12,fill:\"var(--fg)\"},p);e.textContent=t;return e}\nfunction circ(p,x,y,t){S(\"circle\",{cx:x,cy:y,r:13,fill:\"var(--c3)\",stroke: <td>2 daq<\/td><\/tr><\/table><\/div><h2>Tashkiliy qism <span class=badge>2 daq<\/span><\/h2><p>Salomlashish, davomat, uy vazifasini tekshirish, dars maqsadini e’lon qilish.<\/p><h2>Takrorlash: formulalar <span class=badge>4 daq<\/span><\/h2><div class=tw><table><tr><th>Kattalik<\/th><th>Ketma-ket<\/th><th>Parallel<\/th><\/tr><tr><td>Tok kuchi<\/td><td>I = I₁ = I₂<\/td><td>I = I₁ + I₂<\/td><\/tr><tr><td>Kuchlanish<\/td><td>U = U₁ + U₂<\/td><td>U = U₁ = U₂<\/td><\/tr><tr><td>Qarshilik<\/td><td>R = R₁ + R₂<\/td><td>R = R₁R₂/(R₁+R₂)<\/td><\/tr><\/table><\/div><p>Om qonuni: I = U/R. <b>Masala yechish tartibi:<\/b> Berilgan → Sxema → Formula → Hisob → Javob.<\/p><h2>1-reja. Ketma-ket ulanishga masalalar <span class=badge>8 daq<\/span><\/h2><p><b>Maqsad:<\/b> ketma-ket ulangan zanjir uchun R, U, U₁ ni topish.<\/p><p><b>Vaqt:<\/b> tushuntirish 2 · masala 5 · tekshirish 1 daqiqa.<\/p><div class=box><b>1-simulyatsiya: masala<\/b><div id=p1><\/div><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Namunani doskada «Berilgan–Formula–Yechim–Javob» tartibida yechadi.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> masalani daftarda yechadi va javobni tekshiradi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Qaysi kattalik ketma-ket zanjirda hamma joyda bir xil? (tok kuchi)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> To‘liq va to‘g‘ri yechadi.<\/li><li><b>4:<\/b> Hisobda kichik xato.<\/li><li><b>3:<\/b> Yordam bilan.<\/li><li><b>2:<\/b> Yecha olmaydi.<\/li><\/ul><\/details><h2>2-reja. Parallel ulanishga masalalar <span class=badge>8 daq<\/span><\/h2><p><b>Maqsad:<\/b> parallel zanjir uchun I₁, I₂, I, R ni topish.<\/p><p><b>Vaqt:<\/b> tushuntirish 2 · masala 5 · tekshirish 1 daqiqa.<\/p><div class=box><b>2-simulyatsiya: masala<\/b><div id=p2><\/div><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Parallel zanjirda kuchlanish bir xil ekanini eslatadi.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> masalani yechadi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Parallel zanjirda qaysi tarmoqda tok katta? (qarshiligi kichigida)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> To‘liq va to‘g‘ri.<\/li><li><b>4:<\/b> Kichik xato.<\/li><li><b>3:<\/b> Yordam bilan.<\/li><li><b>2:<\/b> Yecha olmaydi.<\/li><\/ul><\/details><h2>3-reja. Aralash ulanishga masalalar <span class=badge>12 daq<\/span><\/h2><p><b>Maqsad:<\/b> aralash zanjir uchun R, I, U₁, I₂ ni topish.<\/p><p><b>Vaqt:<\/b> namuna 3 · mustaqil yechish 7 · tekshirish 2 daqiqa.<\/p><div class=box><b>3-simulyatsiya: masala<\/b><div id=p3><\/div><div class=box><b>Algoritm:<\/b> 1) R₂₃ = R₂R₃/(R₂+R₃) · 2) R = R₁ + R₂₃ · 3) I = U/R · 4) U₁ = I·R₁, U₂₃ = U − U₁ · 5) I₂ = U₂₃/R₂<\/div><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Namuna: R₁ = 4 Ω, R₂ = 6 Ω, R₃ = 3 Ω, U = 12 V → R₂₃ = 2 Ω; R = 6 Ω; I = 2 A; U₁ = 8 V; U₂₃ = 4 V; I₂ = 0,67 A.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> algoritm bo‘yicha yechadi, tekshiruv: I₂ + I₃ = I.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Hisobni qaysi qismdan boshlaymiz? (parallel qismdan)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> To‘liq va to‘g‘ri yechadi.<\/li><li><b>4:<\/b> Hisobda kichik xato.<\/li><li><b>3:<\/b> Yordam bilan yechadi.<\/li><li><b>2:<\/b> Yecha olmaydi.<\/li><\/ul><\/details><h2>4-reja. Masalani simulyatsiyada tekshiring <span class=badge>4 daq<\/span><\/h2><p><b>Maqsad:<\/b> qo‘lda topilgan javoblarni virtual zanjirda tekshirish.<\/p><p><b>Vaqt:<\/b> qiymat kiritish 1 · taqqoslash 3 daqiqa.<\/p><div class=box><b>4-simulyatsiya: tekshirish<\/b><svg id=s4 viewBox=\"0 0 340 200\"><\/svg><p id=t4><\/p><label>Manba kuchlanishi U: <input type=range id=u4 min=3 max=24 step=1 value=12><\/label><label>R₁: <input type=range id=a4 min=2 max=20 step=1 value=4><\/label><label>R₂: <input type=range id=b4 min=2 max=30 step=1 value=6><\/label><label>R₃: <input type=range id=c4 min=2 max=30 step=1 value=3><\/label><div class=out id=o4><\/div><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Qiymatlarni masaladagiga moslab qo‘yishni ko‘rsatadi.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> o‘z masalasining shartini kiritib, javobni taqqoslaydi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Javoblaringiz mos keldimi? Nega farq bo‘lishi mumkin? (yaxlitlash)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> Hammasi mos.<\/li><li><b>4:<\/b> Kichik farq.<\/li><li><b>3:<\/b> Yordam bilan.<\/li><li><b>2:<\/b> Taqqoslay olmaydi.<\/li><\/ul><\/details><h2>Mustahkamlash testi <span class=badge>5 daq<\/span><\/h2><div class=box id=qz><\/div><h2>Yakun va uyga vazifa <span class=badge>2 daq<\/span><\/h2><p><b>Refleksiya:<\/b> «Qaysi turdagi masala qiyin bo‘ldi?»<\/p><ol><li>26-§ masalalarini yeching.<\/li><li><b>Masala:<\/b> R₁ = 2 Ω, R₂ = R₃ = 4 Ω, U = 12 V (aralash). R, I, U₁ ni toping. (4 Ω; 3 A; 6 V)<\/li><li><b>Ijodiy:<\/b> o‘zingiz aralash ulanishga masala tuzing va yeching.<\/li><\/ol>\n<script>\nconst $=s=>document.querySelector(s),NS=\"http://www.w3.org/2000/svg\",pk=a=>a[Math.floor(Math.random()*a.length)];\nconst f=(x,d=2)=>(+x).toFixed(d).replace(\".\",\",\"),rd=(x,s)=>Math.round(x/s)*s,spd=I=>I>0?Math.min(25+I*90,240):0;\nfunction S(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}\nfunction box(p,x,y,w,h,t,fill){S(\"rect\",{x,y,width:w,height:h,rx:6,fill:fill||\"var(--card)\",stroke:\"var(--wire)\",\"stroke-width\":2},p);const e=S(\"text\",{x:x+w/2,y:y+h/2+4,\"text-anchor\":\"middle\",\"font-size\":12,fill:\"var(--fg)\"},p);e.textContent=t;return e}\nfunction circ(p,x,y,t){S(\"circle\",{cx:x,cy:y,r:13,fill:\"var(--c3)\",stroke:\"var(--wire)\",\"stroke-width\":2},p);const e=S(\"text\",{x,y:y+3.5,\"text-anchor\":\"middle\",\"font-size\":9,fill:\"var(--fg)\"},p);e.textContent=t;return e}\nfunction wire(p,pts){S(\"polygon\",{points:pts.map(q=>q.join(\",\")).join(\" \"),fill:\"none\",stroke:\"var(--wire)\",\"stroke-width\":2},p)}\nconst loops=[];\nfunction Loop(svg,pts,n){const seg=[];let L=0;pts.forEach((a,i)=>{const b=pts[(i+1)%pts.length],d=Math.hypot(b[0]-a[0],b[1]-a[1]);seg.push([a,b,d,L]);L+=d});\nconst dots=[];for(let i=0;i<n;i++)dots.push(S(\"circle\",{r:4,fill:\"var(--ac)\"},svg));\nconst o={v:0,t:0,L,dots,on:true,pos(s){s=((s%L)+L)%L;for(const g of seg)if(s<=g[3]+g[2]){const k=(s-g[3])/g[2];return[g[0][0]+(g[1][0]-g[0][0])*k,g[0][1]+(g[1][1]-g[0][1])*k]}return seg[0][0]}};loops.push(o);return o}\nlet last=performance.now();\nfunction tick(now){const dt=Math.min(now-last,50)/1000;last=now;for(const o of loops){o.t+=o.v*dt;o.dots.forEach((c,i)=>{const p=o.pos(o.t+i*o.L/o.dots.length);c.setAttribute(\"cx\",p[0]);c.setAttribute(\"cy\",p[1]);c.style.display=o.on?\"\":\"none\"})}requestAnimationFrame(tick)}\nrequestAnimationFrame(tick);\nlet qn=0;\nfunction Quiz(id,Q){const r=$(id),u=\"q\"+(qn++);r.innerHTML=Q.map((q,i)=>`<div class=q><b>${i+1}. ${q.q}<\/b>${q.o.map((o,j)=>`<label><input type=radio name=\"${u}_${i}\" value=${j}> ${\"ABCD\"[j]}) ${o}<\/label>`).join(\"\")}<\/div>`).join(\"\")+`<button class=btn>Tekshirish<\/button><p class=res><\/p>`;\nr.querySelector(\"button\").onclick=()=>{let s=0,w=[];Q.forEach((q,i)=>{const c=r.querySelector(`input[name=\"${u}_${i}\"]:checked`);if(c&&+c.value==q.a)s++;else w.push(i+1)});r.querySelector(\".res\").innerHTML=`To‘g‘ri javoblar: <b>${s}/${Q.length}<\/b> → baho «${Math.max(2,5-(Q.length-s))}»`+(w.length?`. Qayta ko‘ring: ${w.join(\", \")}-savol.`:` <span class=ok>Barakalla!<\/span>`)}}\nfunction Prob(id,gen){const r=$(id),k=id.slice(1);let c;function nw(){c=gen();r.innerHTML=`<p><b>${c.t}<\/b><\/p>`+c.a.map((a,i)=>`<label>${a.l} = <input type=text inputmode=decimal id=\"${k}${i}\" style=\"width:110px;display:inline-block\"> ${a.u}<\/label><br>`).join(\"\")+`<button class=btn id=${k}c>Tekshirish<\/button><button class=btn id=${k}n>Yangi masala<\/button><p class=res><\/p>`;\n$(\"#\"+k+\"c\").onclick=()=>{let ok=0;c.a.forEach((a,i)=>{const v=parseFloat($(\"#\"+k+i).value.replace(\",\",\".\"));if(Math.abs(v-a.v)<=Math.max(.02*Math.abs(a.v),.011))ok++});r.querySelector(\".res\").innerHTML=ok==c.a.length?`<span class=ok>To‘g‘ri! Baho: 5<\/span>`:`<span class=bad>${ok}/${c.a.length} to‘g‘ri.<\/span> Yechim: ${c.s}`};$(\"#\"+k+\"n\").onclick=nw}nw()}\nfunction Out(id,arr){$(id).innerHTML=arr.map(a=>`<div><b>${a[1]}<\/b><small>${a[0]}<\/small><\/div>`).join(\"\")}\n\nfunction SeriesCirc(svg){wire(svg,[[30,30],[310,30],[310,170],[30,170]]);\nconst bt=box(svg,10,80,40,40,\"6 V\",\"var(--c1)\"),t1=box(svg,90,16,70,28,\"\",\"var(--c2)\"),t2=box(svg,190,16,70,28,\"\",\"var(--c2)\"),x=S(\"text\",{x:225,y:75,\"text-anchor\":\"middle\",\"font-size\":22,fill:\"var(--bad)\"},svg);\nconst a1=circ(svg,60,30,\"\"),a2=circ(svg,175,30,\"\"),a3=circ(svg,285,30,\"\");S(\"text\",{x:30,y:195,\"font-size\":11,fill:\"var(--mu)\"},svg).textContent=\"A₁, A₂, A₃ — ampermetrlar (ketma-ket)\";\nconst lp=Loop(svg,[[30,30],[310,30],[310,170],[30,170]],26);\nreturn{upd(R1,R2,I,open,U){t1.textContent=\"R₁ = \"+R1+\" Ω\";t2.textContent=\"R₂ = \"+R2+\" Ω\";bt.textContent=U+\" V\";[a1,a2,a3].forEach(a=>a.textContent=f(I));x.textContent=open?\"✕ uzilgan\":\"\";lp.v=spd(I);lp.on=I>0}}}\n\nfunction ParCirc(svg){wire(svg,[[30,30],[280,30],[280,170],[30,170]]);S(\"line\",{x1:155,y1:30,x2:155,y2:170,stroke:\"var(--wire)\",\"stroke-width\":2},svg);\nconst bt=box(svg,10,80,40,40,\"6 V\",\"var(--c1)\"),t1=box(svg,120,86,70,28,\"\",\"var(--c2)\"),t2=box(svg,245,86,70,28,\"\",\"var(--c2)\"),x1=S(\"text\",{x:155,y:145,\"text-anchor\":\"middle\",\"font-size\":13,fill:\"var(--bad)\"},svg),x2=S(\"text\",{x:280,y:145,\"text-anchor\":\"middle\",\"font-size\":13,fill:\"var(--bad)\"},svg);\nconst am=circ(svg,80,30,\"\"),a1=circ(svg,155,58,\"\"),a2=circ(svg,280,58,\"\");S(\"text\",{x:30,y:195,\"font-size\":11,fill:\"var(--mu)\"},svg).textContent=\"A — umumiy tok, A₁, A₂ — tarmoqlardagi toklar\";\nconst l1=Loop(svg,[[30,30],[155,30],[155,170],[30,170]],16),l2=Loop(svg,[[30,30],[280,30],[280,170],[30,170]],26);\nreturn{upd(R1,R2,I1,I2,o1,o2,U){t1.textContent=\"R₁ = \"+R1+\" Ω\";t2.textContent=\"R₂ = \"+R2+\" Ω\";bt.textContent=U+\" V\";am.textContent=f(I1+I2);a1.textContent=f(I1);a2.textContent=f(I2);x1.textContent=o1?\"✕ uzilgan\":\"\";x2.textContent=o2?\"✕ uzilgan\":\"\";l1.v=spd(I1);l1.on=I1>0;l2.v=spd(I2);l2.on=I2>0}}}\n\nfunction MixCirc(svg){wire(svg,[[30,30],[290,30],[290,170],[30,170]]);S(\"line\",{x1:200,y1:30,x2:200,y2:170,stroke:\"var(--wire)\",\"stroke-width\":2},svg);\nconst bt=box(svg,10,80,40,40,\"\",\"var(--c1)\"),t1=box(svg,70,16,70,28,\"\",\"var(--c2)\"),t2=box(svg,165,86,70,28,\"\",\"var(--c2)\"),t3=box(svg,255,86,70,28,\"\",\"var(--c2)\");\nconst am=circ(svg,172,30,\"\"),a2=circ(svg,200,58,\"\"),a3=circ(svg,290,58,\"\");S(\"text\",{x:30,y:195,\"font-size\":11,fill:\"var(--mu)\"},svg).textContent=\"A — umumiy tok (R₁ dan o‘tadi), A₂, A₃ — parallel tarmoqlar\";\nconst lA=Loop(svg,[[30,30],[200,30],[200,170],[30,170]],16),lB=Loop(svg,[[30,30],[290,30],[290,170],[30,170]],26);\nreturn{upd(R1,R2,R3,I,I2,I3,U){t1.textContent=\"R₁ = \"+R1+\" Ω\";t2.textContent=\"R₂ = \"+R2+\" Ω\";t3.textContent=\"R₃ = \"+R3+\" Ω\";bt.textContent=U+\" V\";am.textContent=f(I);a2.textContent=f(I2);a3.textContent=f(I3);lA.v=spd(I2);lB.v=spd(I3);lA.on=I2>0;lB.on=I3>0}}}\nfunction Mix(p){const c=MixCirc($(\"#s\"+p)),g=k=>$(\"#\"+k+p);\nfunction u(){const U=+g(\"u\").value,R1=+g(\"a\").value,R2=+g(\"b\").value,R3=+g(\"c\").value,R23=R2*R3/(R2+R3),R=R1+R23,I=U/R,U1=I*R1,U23=I*R23,I2=U23/R2,I3=U23/R3;c.upd(R1,R2,R3,I,I2,I3,U);\n$(\"#t\"+p).innerHTML=`U = <b>${U} V<\/b>, R₁ = <b>${R1} Ω<\/b>, R₂ = <b>${R2} Ω<\/b>, R₃ = <b>${R3} Ω<\/b>`;\nOut(\"#o\"+p,[[\"R₂₃ = R₂R₃/(R₂+R₃)\",f(R23)+\" Ω\"],[\"R = R₁ + R₂₃\",f(R)+\" Ω\"],[\"I = U/R\",f(I)+\" A\"],[\"U₁ = I·R₁\",f(U1)+\" V\"],[\"U₂₃ = U − U₁\",f(U-U1)+\" V\"],[\"I₂ = U₂₃/R₂\",f(I2)+\" A\"],[\"I₃ = U₂₃/R₃\",f(I3)+\" A\"],[\"I₂ + I₃\",f(I2+I3)+\" A\"]])}\n[\"u\",\"a\",\"b\",\"c\"].forEach(k=>g(k).oninput=u);u()}\n\nProb(\"#p1\",()=>{const R1=pk([5,10,15,20]),R2=pk([5,10,25,30]),I=pk([.2,.4,.5,1]),R=R1+R2,U=I*R;return{t:`R₁ = ${R1} Ω va R₂ = ${R2} Ω ketma-ket ulangan, I = ${f(I,1)} A.`,a:[{l:\"R\",u:\"Ω\",v:R},{l:\"U\",u:\"V\",v:U},{l:\"U₁\",u:\"V\",v:I*R1}],s:`R = ${R}; U = I·R = ${f(U,1)} V; U₁ = I·R₁ = ${f(I*R1,1)} V.`}});\nProb(\"#p2\",()=>{const p=pk([[6,3,2],[10,10,5],[20,5,4],[12,4,3],[30,30,15],[15,10,6]]),U=pk([6,12,24]);return{t:`R₁ = ${p[0]} Ω va R₂ = ${p[1]} Ω parallel ulangan, U = ${U} V.`,a:[{l:\"I₁\",u:\"A\",v:U/p[0]},{l:\"I₂\",u:\"A\",v:U/p[1]},{l:\"I\",u:\"A\",v:U/p[0]+U/p[1]},{l:\"R\",u:\"Ω\",v:p[2]}],s:`I₁ = U/R₁, I₂ = U/R₂, I = I₁+I₂ = ${f(U/p[0]+U/p[1])} A, R = ${p[2]} Ω.`}});\nProb(\"#p3\",()=>{const p=pk([[6,3,2],[10,10,5],[20,5,4],[12,4,3],[30,30,15],[15,10,6]]),R1=pk([2,4,6,8]),I=pk([.5,1,2]),R=R1+p[2],U=I*R,U23=I*p[2];return{t:`R₁ = ${R1} Ω ketma-ket, R₂ = ${p[0]} Ω va R₃ = ${p[1]} Ω parallel ulangan, U = ${f(U,1)} V.`,a:[{l:\"R\",u:\"Ω\",v:R},{l:\"I\",u:\"A\",v:I},{l:\"U₁\",u:\"V\",v:I*R1},{l:\"I₂\",u:\"A\",v:U23/p[0]}],s:`R₂₃ = ${p[2]} Ω; R = ${R} Ω; I = U/R = ${f(I)} A; U₁ = ${f(I*R1)} V; U₂₃ = ${f(U23)} V; I₂ = U₂₃/R₂ = ${f(U23/p[0])} A.`}});\nMix(4);\nQuiz(\"#qz\",[{q:\"R₁ = 15 Ω va R₂ = 25 Ω ketma-ket. R = ?\",o:[\"40 Ω\",\"9,4 Ω\",\"375 Ω\",\"10 Ω\"],a:0},{q:\"R₁ = 20 Ω va R₂ = 5 Ω parallel. R = ?\",o:[\"25 Ω\",\"4 Ω\",\"100 Ω\",\"15 Ω\"],a:1},{q:\"U = 24 V, R = 8 Ω. I = ?\",o:[\"3 A\",\"192 A\",\"0,33 A\",\"16 A\"],a:0},{q:\"12 V ga parallel ulangan ikki 6 Ω lampochka. Umumiy tok?\",o:[\"2 A\",\"4 A\",\"1 A\",\"0,5 A\"],a:1},{q:\"R₁ = 2 Ω, R₂ = R₃ = 4 Ω (R₂, R₃ parallel). R = ?\",o:[\"8 Ω\",\"4 Ω\",\"2 Ω\",\"1 Ω\"],a:1}]);\n<\/script><\/main><\/body><\/html>"}, {"t": "27-§ Elektr sig‘imi. Kondensatorlar", "h": "<!DOCTYPE html><html lang=\"uz\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><title>Elektr sig‘imi. Kondensatorlar<\/title><style>:root{--bg:#fff;--fg:#1c1e21;--mu:#5f6673;--card:#f1f3f6;--c1:#fbe99a;--c2:#fff0a0;--c3:#c9f2d3;--bd:#d3d8df;--ac:#2f5fe0;--ok:#15803d;--bad:#c62828;--wire:#222;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#15171b;--fg:#e8eaee;--mu:#9aa3b2;--card:#1f2329;--c1:#6b5a14;--c2:#6b5f1c;--c3:#1f5a33;--bd:#38404c;--ac:#7ea1ff;--ok:#4ade80;--bad:#ff8a80;--wire:#d6dbe3;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#15171b;--fg:#e8eaee;--mu:#9aa3b2;--card:#1f2329;--c1:#6b5a14;--c2:#6b5f1c;--c3:#1f5a33;--bd:#38404c;--ac:#7ea1ff;--ok:#4ade80;--bad:#ff8a80;--wire:#d6dbe3;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nmain{max-width:760px;margin:0 auto;padding:16px}\nh1{font-size:25px;line-height:1.25;margin:.4em 0}h2{color:var(--ac);font-size:20px;line-height:1.3;margin:1.6em 0 .3em}\n.sub{color:var(--mu)}.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin:12px 0}\n.badge{display:inline-block;background:var(--ac);color:var(--bg);border-radius:10px;padding:1px 10px;font-size:14px;margin-left:6px;white-space:nowrap}\n.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid var(--bd);padding:7px 9px;text-align:left}\n.btn{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:9px 14px;margin:4px 4px 4px 0;cursor:pointer}\n.btn.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}\ninput[type=range]{width:100%}svg{width:100%;height:auto;display:block}\n.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:10px 0}\n.out div{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center}\n.out b{display:block;color:var(--ac);font-size:19px}.out small{color:var(--mu)}\ndetails{margin:10px 0}summary{font-weight:700;cursor:pointer}.ok{color:var(--ok)}.bad{color:var(--bad)}\n.q{margin:12px 0}.q label{display:block;padding:4px 0}\ntextarea,input[type=text]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;width:100%;box-sizing:border-box}\n.bar{display:flex;height:28px;border-radius:8px;overflow:hidden;margin:6px 0;font-size:13px;color:#fff}.bar i{display:block;text-align:center;line-height:28px;font-style:normal;overflow:hidden}\n.warn{border-left:4px solid var(--bad);padding-left:10px}\n<\/style><\/head><body><main>\n<h1>Elektr sig‘imi. Kondensatorlar<\/h1><p class=sub>Fizika, 8-sinf · II bob «Elektr toki» · 27-§ · 45 daqiqa · dars ishlanma + interaktiv simulyatsiyalar<\/p><p><b>Mavzu:<\/b> Elektr sig‘imi. Kondensatorlar<\/p>\n<div class=box><p><b>Jihozlar:<\/b> proyektor yoki planshet, kondensatorlar to‘plami (namuna), lampochka, manba, daftar.<\/p><ul><li><b>Ta’limiy:<\/b> kondensator tuzilishi, elektr sig‘imi C = q/U va uning birliklarini bilish.<\/li><li><b>Rivojlantiruvchi:<\/b> sig‘imning S, d va dielektrikka bog‘liqligini tahlil qilish, masala yechish.<\/li><li><b>Tarbiyaviy:<\/b> texnikaga qiziqish va ehtiyotkorlikni tarbiyalash.<\/li><\/ul><p><b>Kutilayotgan natija:<\/b> o‘quvchi kondensatorning tuzilishini va ishlashini tushuntiradi, sig‘im bog‘liqliklarini aytadi va C = q/U bo‘yicha masala yechadi.<\/p><\/div>\n<h2>Dars bosqichlari<\/h2><div class=tw><table><tr><th>№<\/th><th>Bosqich<\/th><th>Vaqt<\/th><\/tr><tr><td>1<\/td><td>Tashkiliy qism<\/td><td>2 daq<\/td><\/tr><tr><td>2<\/td><td>Takrorlash<\/td><td>5 daq<\/td><\/tr><tr><td>3<\/td><td>1-reja: Kondensator va sig‘im<\/td><td>10 daq<\/td><\/tr><tr><td>4<\/td><td>2-reja: Yassi kondensator<\/td><td>12 daq<\/td><\/tr><tr><td>5<\/td><td>3-reja: Birliklar va masalalar<\/td><td>8 daq<\/td><\/tr><tr><td>6<\/td><td>Mustahkamlash testi<\/td><td>5 daq<\/td><\/tr><tr><td>7<\/td><td>Yakun, baholash, uyga vazifa<\/td><td>3 daq<\/td><\/tr><\/table><\/div><h2>Tashkiliy qism <span class=badge>2 daq<\/span><\/h2><p>Salomlashish, davomat, dars maqsadini e’lon qilish.<\/p><h2>Takrorlash <span class=badge>5 daq<\/span><\/h2><p><b>Savollar:<\/b> Elektr zaryadi nima? Zaryad birligi? Kuchlanish nima? Dielektrik nima?<\/p><p><b>Motivatsiya:<\/b> Fotoapparat chaqnog‘i qanday qilib bir lahzada katta yorug‘lik beradi? Bunda zaryadni to‘plab turadigan qurilma — kondensator ishlaydi.<\/p><h2>1-reja. Kondensator va elektr sig‘imi <span class=badge>10 daq<\/span><\/h2><p><b>Maqsad:<\/b> kondensator tuzilishi va sig‘im tushunchasi: C = q / U.<\/p><p><b>Vaqt:<\/b> tushuntirish 4 · 1-simulyatsiya 4 · savol-topshiriq 2 daqiqa.<\/p><div class=box><b>1-simulyatsiya: kondensatorni zaryadlash va zaryadsizlantirish<\/b><svg id=s1 viewBox=\"0 0 340 220\"><\/svg><label>Manba kuchlanishi U (V): <input type=range id=u1 min=1 max=12 step=1 value=9><\/label><label>Sig‘im C (µF): <input type=range id=c1 min=10 max=100 step=10 value=50><\/label><button class=btn id=ch>⚡ Zaryadlash<\/button><button class=btn id=dc>💡 Zaryadsizlantirish<\/button><div class=out id=o1><\/div><p class=sub>Zaryadlanishda tok dastlab katta, so‘ng kamayadi. Kondensator kuchlanishi manba kuchlanishiga yetgach tok to‘xtaydi.<\/p><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Kondensator tuzilishini ko‘rsatadi: ikki o‘tkazgich (qoplama) va ular orasidagi dielektrik.<\/li><li>Sig‘im ta’rifi: C = q/U, birligi 1 F = 1 C / 1 V.<\/li><li>Analogiya: idish — hajm; kondensator — zaryad sig‘imi.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> simulyatsiyada kondensatorni zaryadlaydi, q va U_c o‘zgarishini kuzatadi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Kondensator zaryadlanganda tok qanday o‘zgaradi? (kamayib nolga keladi)<\/li><li>Zaryadsizlantirishda lampochka nega yonib o‘chadi? (zaryad tugaydi)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> Tuzilish va sig‘imni to‘liq tushuntiradi.<\/li><li><b>4:<\/b> 1 ta kichik xato.<\/li><li><b>3:<\/b> Yordam bilan.<\/li><li><b>2:<\/b> Tushuntira olmaydi.<\/li><\/ul><\/details><h2>2-reja. Yassi kondensator: sig‘im nimaga bog‘liq? <span class=badge>12 daq<\/span><\/h2><p><b>Maqsad:<\/b> sig‘imning plastina yuzi, masofa va dielektrikka bog‘liqligini aniqlash.<\/p><p><b>Vaqt:<\/b> tushuntirish 3 · 2-simulyatsiya 7 · xulosa 2 daqiqa.<\/p><div class=box><b>2-simulyatsiya: yassi kondensator<\/b><svg id=s2 viewBox=\"0 0 340 200\"><\/svg><label>Plastina yuzi S (sm²): <input type=range id=sa min=10 max=100 step=5 value=50><\/label><label>Plastinalar orasidagi masofa d (mm): <input type=range id=dd min=1 max=10 step=1 value=3><\/label><p>Dielektrik: <button class=\"btn on\" data-e=1>havo (ε=1)<\/button><button class=btn data-e=2>qog‘oz (ε≈2)<\/button><button class=btn data-e=7>shisha (ε≈7)<\/button><\/p><div class=out id=o2><\/div><p class=sub>C = ε·ε₀·S / d, bunda ε₀ = 8,85·10⁻¹² F/m.<\/p><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Tajribani ko‘rsatadi: S oshsa C ortadi; d kamaysa C ortadi; dielektrik C ni oshiradi.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> slayderlarni o‘zgartirib, jadval to‘ldiradi: S↑, d↓, ε↑ → C?<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Sig‘imni oshirish uchun nima qilamiz? (yuzni oshirish, masofani kamaytirish, dielektrik qo‘yish)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> Uchala bog‘liqlikni tasdiqlaydi.<\/li><li><b>4:<\/b> 1 ta kichik xato.<\/li><li><b>3:<\/b> Yordam bilan.<\/li><li><b>2:<\/b> Aniqlay olmaydi.<\/li><\/ul><\/details><h2>3-reja. Birliklar va masalalar <span class=badge>8 daq<\/span><\/h2><p><b>Maqsad:<\/b> sig‘im birliklari va C = q/U bo‘yicha masalalar.<\/p><p><b>Vaqt:<\/b> birliklar 2 · masala 5 · tekshirish 1 daqiqa.<\/p><div class=box><b>3-simulyatsiya: masala<\/b><div class=tw><table><tr><th>Birlik<\/th><th>Belgi<\/th><th>F da<\/th><\/tr><tr><td>millifarad<\/td><td>mF<\/td><td>10⁻³ F<\/td><\/tr><tr><td>mikrofarad<\/td><td>µF<\/td><td>10⁻⁶ F<\/td><\/tr><tr><td>nanofarad<\/td><td>nF<\/td><td>10⁻⁹ F<\/td><\/tr><tr><td>pikofarad<\/td><td>pF<\/td><td>10⁻¹² F<\/td><\/tr><\/table><\/div><div id=pr><\/div><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Namuna: C = 50 µF, U = 10 V → q = CU = 500 µC.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> masalani «Berilgan–Formula–Yechim–Javob» bilan yechadi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>q = C·U formulasidan nimani topamiz? (zaryadni)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> To‘liq va to‘g‘ri.<\/li><li><b>4:<\/b> Kichik xato.<\/li><li><b>3:<\/b> Yordam bilan.<\/li><li><b>2:<\/b> Yecha olmaydi.<\/li><\/ul><\/details><h2>Mustahkamlash testi <span class=badge>5 daq<\/span><\/h2><div class=box id=qz><\/div><h2>Yakun va uyga vazifa <span class=badge>3 daq<\/span><\/h2><p><b>Refleksiya:<\/b> «Bugun nimani bildim?»<\/p><ol><li>27-§ ni o‘qing, savollarga javob bering.<\/li><li><b>Masala:<\/b> C = 20 µF, U = 12 V. q = ? (240 µC)<\/li><li><b>Masala:<\/b> q = 600 µC, U = 12 V. C = ? (50 µF)<\/li><li><b>Ijodiy:<\/b> kondensator ishlatiladigan 3 ta qurilmani toping.<\/li><\/ol>\n<script>\nconst $=s=>document.querySelector(s),NS=\"http://www.w3.org/2000/svg\",pk=a=>a[Math.floor(Math.random()*a.length)];\nconst f=(x,d=2)=>(+x).toFixed(d).replace(\".\",\",\"),rd=(x,s)=>Math.round(x/s)*s,spd=I=>I>0?Math.min(25+I*90,240):0;\nfunction S(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}\nfunction b ntersecting}).observe(c)}catch(e){}\n  const t0=performance.now();let last=t0;\n  (function loop(now){\n    if(vis){const o=ctx(c);fn(o.g,o.W,o.H,(now-t0)/1000,(now-last)/1000)}\n    last=now;requestAnimationFrame(loop);\n  })(t0);\n}\nfunction bulb(g,x,y,r,glow){\n  if(glow>0.01){\n    const R=r*(1.8+glow*1.6),gr=g.createRadialGradient(x,y,r*.3,x,y,R);\n    gr.addColorStop(0,`rgba(255,214,0,${.85*glow})`);gr.addColorStop(1,'rgba(255,214,0,0)');\n    g.fillStyle=gr;g.beginPath();g.arc(x,y,R,0,7);g.fill();\n  }\n  g.fillStyle=`rgba(255,241,118,${.25+.75*glow})`;g.strokeStyle='#37474f';g.lineWidth=3;\n  g.beginPath();g.arc(x,y,r,0,7);g.fill();g.stroke();\n  g.lineWidth=2;const d=r*.7;g.beginPath();g.moveTo(x-d,y-d);g.lineTo(x+d,y+d);g.moveTo(x+d,y-d);g.lineTo(x-d,y+d);g.stroke();\n}\nfunction loopBox(W,H){return{x0:W*.1,x1:W*.9,y0:H*.18,y1:H*.82}}\nfunction loopPt(p,s){\n  const a=p.x1-p.x0,b=p.y1-p.y0;let d=(((s%1)+1)%1)*(2*a+2*b);\n  if(d<a)return[p.x0+d,p.y1];d-=a;\n  if(d<b)return[p.x1,p.y1-d];d-=b;\n  if(d<a)return[p.x1-d,p.y0];d-=a;\n  return[p.x0,p.y0+d];\n}\n/* Oddiy zanjir: manba (chapda), lampochka (o'ngda), harakatlanuvchi zaryadlar */\nfunction drawLoop(g,W,H,t,o){\n  const p=loopBox(W,H),my=(p.y0+p.y1)/2;\n  g.strokeStyle='#37474f';g.lineWidth=3;g.strokeRect(p.x0,p.y0,p.x1-p.x0,p.y1-p.y0);\n  g.fillStyle='#fff';g.fillRect(p.x0-14,my-18,28,36);g.fillRect(p.x1-14,my-18,28,36);\n  g.strokeStyle='#37474f';g.lineWidth=3;g.beginPath();g.moveTo(p.x0,my-18);g.lineTo(p.x0,my-7);g.moveTo(p.x0,my+7);g.lineTo(p.x0,my+18);g.stroke();\n  g.lineWidth=4;g.beginPath();g.moveTo(p.x0-16,my-7);g.lineTo(p.x0+16,my-7);g.stroke();\n  g.beginPath();g.moveTo(p.x0-9,my+7);g.lineTo(p.x0+9,my+7);g.stroke();\n  g.font='bold 14px system-ui';g.textAlign='left';g.fillStyle='#c62828';g.fillText('+',p.x0+20,my-5);g.fillStyle='#1565c0';g.fillText('−',p.x0+20,my+17);\n  bulb(g,p.x1,my,18,o.glow||0);\n  const n=o.n||16;\n  for(let i=0;i<n;i++){const q=loopPt(p,i/n+t*(o.speed||.1));g.fillStyle='#1976d2';g.beginPath();g.arc(q[0],q[1],4,0,7);g.fill()}\n}\n\n/* Masalalar generatori: gens = [()=>({t,u,a,s:[...]})] */\nfunction Gen(id,gens){\n  const el=document.getElementById(id);\n  el.innerHTML='<div class=\"out prob\"><\/div><div><input type=\"text\" inputmode=\"decimal\" placeholder=\"Javobingiz\" size=\"10\"> <b class=\"u\"><\/b> <button class=\"btn\" data-a=\"chk\">Tekshirish<\/button><button class=\"btn ghost\" data-a=\"sol\">Yechimni ko‘rish<\/button><button class=\"btn ghost\" data-a=\"new\">Yangi masala ↻<\/button><\/div><div class=\"fb\"><\/div><div class=\"sol\"><\/div><div class=\"mut sc\"><\/div>';\n  let cur,ok=0,tot=0;\n  const P=$('.prob',el),I=$('input',el),FB=$('.fb',el),SOL=$('.sol',el);\n  function nw(){cur=pick(gens)();P.innerHTML=cur.t;$('.u',el).textContent=cur.u;I.value='';FB.textContent='';FB.className='fb';SOL.innerHTML=''}\n  function sol(){SOL.innerHTML=cur.s.map(x=>`<div class=\"step\">${x}<\/div>`).join('');$$('.step',SOL).forEach((e,i)=>setTimeout(()=>e.classList.add('show'),200+i*650))}\n  el.onclick=e=>{\n    const a=e.target.dataset&&e.target.dataset.a;if(!a)return;\n    if(a==='new')nw();\n    if(a==='sol')sol();\n    if(a==='chk'){\n      const v=parseFloat(I.value.replace(',','.'));\n      if(isNaN(v)){FB.textContent='Javobni raqam bilan kiriting.';FB.className='fb bad';return}\n      tot++;const good=Math.abs(v-cur.a)<=Math.max(0.02*Math.abs(cur.a),0.01);\n      if(good){ok++;FB.textContent='✅ To‘g‘ri!';FB.className='fb ok'}\n      else{FB.textContent='❌ Qaytadan urinib ko‘ring yoki «Yechimni ko‘rish»ni bosing.';FB.className='fb bad'}\n      $('.sc',el).textContent=`Natija: ${ok} / ${tot}`;\n    }\n  };\n  nw();\n}\n\nfunction Quiz(el,qs){\n  el.innerHTML=qs.map((q,i)=>`<div class=\"q\" data-a=\"${q[2]}\"><p>${i+1}. ${q[0]}<\/p>${q[1].map((o,j)=>`<button data-j=\"${j}\">${'ABCD'[j]}) ${o}<\/button>`).join('')}<\/div>`).join('')+`<div class=\"out sc\">Natija: 0 / ${qs.length}<\/div>`;\n  let score=0,done=0;\n  $$('.q',el).forEach(q=>q.onclick=e=>{\n    const b=e.target.closest('button');if(!b||q.dataset.done)return;\n    q.dataset.done=1;const j=+b.dataset.j,a=+q.dataset.a;done++;\n    if(j===a){score++;b.classList.add('ok')}else{b.classList.add('bad');q.children[a+1].classList.add('ok')}\n    $('.sc',el).textContent=`Natija: ${score} / ${qs.length}`+(done===qs.length?(score===qs.length?' — a’lo! 🎉':score>=qs.length-1?' — yaxshi!':' — mavzuni qayta ko‘rib chiqing.'):'');\n  });\n}\n\nfunction LESSON(L){\n  document.title=`${L.n}-§ · ${L.title}`;\n  const ul=a=>'<ul>'+a.map(x=>`<li>${x}<\/li>`).join('')+'<\/ul>';\n  const col=['#1565c0','#00897b','#e65100','#6a1b9a','#2e7d32','#c62828','#455a64'];\n  const tot=L.stages.reduce((a,s)=>a+s.m,0);\n  if(tot!==45)console.warn('Vaqt yig‘indisi 45 emas:',tot);\n  let c=0,rows='',bar='';\n  L.stages.forEach((s,i)=>{\n    const a=c;c+=s.m;const w=s.w?L.widgets.find(x=>x.id===s.w):null;\n    bar+=`<span style=\"flex:${s.m};background:${col[i%7]}\" title=\"${s.name}\">${s.m}′<\/span>`;\n    rows+=`<tr><td><span class=\"min\" style=\"background:${col[i%7]}\">${a}–${c}′<\/span><\/td><td><b>${s.name}<\/b><br><span class=\"mut\">${s.m} daq.<\/span><\/td><td>${s.t}<\/td><td>${s.s}<\/td><td>${w?`<a href=\"#${w.id}\">${w.tag}<\/a>`:'—'}<\/td><\/tr>`;\n  });\n  let h=`<header class=\"hero\"><span class=\"badge\">${L.n}-§<\/span><span class=\"badge\">45 daqiqa<\/span><span class=\"badge\">${L.chapter}<\/span><h1>${L.title}<\/h1><p>${L.sub}<\/p><p class=\"noprint\" style=\"margin-top:10px\"><button class=\"btn ghost\" onclick=\"window.print()\">🖨 Chop etish / PDF<\/button><\/p><\/header>`;\n  h+=`<section class=\"card\"><h2>📋 Dars pasporti<\/h2><div class=\"grid\"><div><b>Fan<\/b><br>Fizika<\/div><div><b>Mavzu / bet<\/b><br>${L.n}-§ · ${L.pages}<\/div><div><b>Dars turi<\/b><br>${L.type}<\/div><div><b>Metodlar<\/b><br>${L.method}<\/div><div><b>Davomiyligi<\/b><br>45 daqiqa<\/div><\/div><\/section>`;\n  h+=`<section class=\"card\"><h2>🎯 Dars maqsadlari<\/h2><div class=\"grid\"><div><b>Ta’limiy<\/b>${ul(L.goals.edu)}<\/div><div><b>Rivojlantiruvchi<\/b>${ul(L.goals.dev)}<\/div><div><b>Tarbiyaviy<\/b>${ul(L.goals.tarb)}<\/div><\/div><h3>Kutilayotgan natijalar<\/h3>${ul(L.outcomes)}<h3>Tayanch tushunchalar<\/h3><p>${L.terms.join(' · ')}<\/p><h3>Jihozlar<\/h3>${ul(L.equip)}<\/section>`;\n  h+=`<section class=\"card\"><h2>⏱ Dars bosqichlari (jami ${tot} daqiqa)<\/h2><div class=\"tl\">${bar}<\/div><div class=\"tw\"><table class=\"plan\"><tr><th>Vaqt<\/th><th>Bosqich<\/th><th>O‘qituvchi faoliyati<\/th><th>O‘quvchi faoliyati<\/th><th>Vosita<\/th><\/tr>${rows}<\/table><\/div><\/section>`;\n  L.widgets.forEach(w=>{h+=`<section class=\"card\" id=\"${w.id}\"><h2>${w.title}<\/h2><p class=\"mut\">${w.desc}<\/p>${w.html}<\/section>`});\n  h+=`<section class=\"card\"><h2>🖍 Doskaga yozuv<\/h2><div class=\"out\">${L.board.map(x=>`<div>${x}<\/div>`).join('')}<\/div><\/section>`;\n  h+=`<section class=\"card\"><h2>📐 Asosiy formulalar<\/h2><div class=\"fm\">${L.formulas.map(x=>`<div><b>${x[0]}<\/b><code>${x[1]}<\/code><\/div>`).join('')}<\/div><\/section>`;\n  h+=`<section class=\"card\"><h2>❓ Nazorat savollari<\/h2><ol>${L.questions.map(x=>`<li>${x}<\/li>`).join('')}<\/ol><\/section>`;\n  h+=`<section class=\"card\"><h2>✅ Mini-test (o‘z-o‘zini tekshirish)<\/h2><div id=\"quiz\"><\/div><\/section>`;\n  h+=`<section class=\"card\"><h2>🏠 Uyga vazifa<\/h2>${ul(L.homework)}<\/section>`;\n  h+=`<section class=\"card\"><h2>📊 Baholash mezonlari<\/h2>${ul(L.rubric)}<\/section>`;\n  h+=`<section class=\"card\"><h2>💡 O‘qituvchiga maslahatlar<\/h2>${ul(L.tips)}<\/section>`;\n  $('#root').innerHTML=h;\n  Quiz($('#quiz'),L.quiz);\n  try{L.init&&L.init()}catch(e){console.error(e)}\n}\n<\/script><script>LESSON({\nn:28,title:`Kondensatorlarni parallel va ketma-ket ulash`,sub:`Ekvivalent sig'im, zaryad va kuchlanishning taqsimlanishi`,\nchapter:`II bob`,pages:`darslik 82–83-betlar`,type:`Yangi bilim beruvchi (aralash) dars`,\nmethod:`Muammoli bayon, animatsiya, virtual tajriba, juftlikda ishlash`,\ngoals:{\n edu:[`Kondensatorlarni parallel va ketma-ket ulash sxemalarini farqlash`,`Har ikki ulashda umumiy sig'im, zaryad va kuchlanish munosabatlarini bilish`,`C = C₁ + C₂ va 1/C = 1/C₁ + 1/C₂ formulalarini qo'llash`],\n dev:[`Elektr sxemani o'qish va chizish ko'nikmasi`,`Analogiya orqali xulosa chiqarish (yuza ↔ masofa)`,`Virtual tajriba natijasini hisob bilan solishtirish`],\n tarb:[`Hamkorlikda ishlash, aniqlik va mas'uliyat`,`Texnikada kondensatorlardan oqilona foydalanishga qiziqish`]},\noutcomes:[`O'quvchi sxemada ulanish turini aniqlaydi`,`Ikki-uch kondensatorli zanjirning umumiy sig'imini hisoblaydi`,`Simulyatsiyada olingan q, U, C qiymatlarini hisob bilan tasdiqlaydi`],\nterms:[`ekvivalent (umumiy) sig'im`,`parallel ulash`,`ketma-ket ulash`,`kondensatorlar batareyasi`],\nequip:[`Proyektor yoki smartfon/planshet (shu fayl)`,`Darslik va daftar`,`Real kondensatorlar to'plami (ko'rgazma uchun, ixtiyoriy)`,`Doska, marker`],\nstages:[\n{m:2,name:`Tashkiliy qism`,t:`Salomlashadi, davomatni aniqlaydi, mavzu va maqsadni e'lon qiladi, mavzuni doskaga yozadi.`,s:`Jihozlarni tayyorlaydi, mavzuni daftarga yozadi.`},\n{m:7,name:`Takrorlash (27-§)`,t:`Blits-so'rov: sig'im ta'rifi, C = q/U, farad va mikrofarad, yassi kondensator sig'imi nimalarga bog'liq? 3 nafar o'quvchini baholaydi.`,s:`Og'zaki javob beradi, formulalarni doskada yozadi, o'zaro tekshiradi.`},\n{m:5,name:`Muammoli vaziyat + animatsiya`,w:`anim`,t:`«6 µF kerak, qo'lda esa 2 µF va 3 µF bor. Nima qilamiz?» Animatsiyani ko'rsatadi: parallel ulashda plastinka yuzasi qo'shiladi, ketma-ket ulashda masofa qo'shiladi.`,s:`Farazini aytadi, animatsiyani kuzatib «yuza ↑ ⇒ C ↑», «masofa ↑ ⇒ C ↓» xulosasini chiqaradi.`},\n{m:10,name:`Yangi mavzuni bayon qilish`,t:`Parallel: U bir xil, q = q₁+q₂ ⇒ C = C₁+C₂. Ketma-ket: q bir xil, U = U₁+U₂ ⇒ 1/C = 1/C₁+1/C₂. Formulalarni birgalikda keltirib chiqaradi; ikki kondensator uchun C = C₁C₂/(C₁+C₂).`,s:`Sxemalarni chizadi, formulalarni daftarga yozadi, keltirib chiqarishda savollarga javob beradi.`},\n{m:10,name:`Virtual tajriba (simulyatsiya)`,w:`sim`,t:`Juftliklarga topshiriq: 1) C₁=2, C₂=3, C₃=6 µF, U=12 V — ikkala ulash uchun C, q, U ni yozing; 2) sig'imlarni o'zgartirib qonuniyatni toping. Yo'naltiradi, xatolarni to'g'rilaydi.`,s:`Slayderlarni o'zgartiradi, natijani daftarga yozadi va hisob bilan solishtiradi.`},\n{m:7,name:`Mustahkamlash`,t:`Mini-test (5 savol) va masala: C₁ = 6 µF, C₂ = 3 µF ketma-ket, U = 90 V. C, q, U₁, U₂ ni toping.`,s:`Testni ishlaydi, masalani doskada yechadi, o'zini baholaydi.`},\n{m:4,name:`Yakun, baholash, uyga vazifa`,t:`Dars xulosasini aytadi (3 ta asosiy gap), faol o'quvchilarni baholaydi, uyga vazifani tushuntiradi.`,s:`Refleksiya: «Bugun nimani bildim / nima qiyin bo'ldi?»`}\n],\nwidgets:[\n{id:`anim`,tag:`🎬 Animatsiya`,title:`🎬 Animatsiya: nega C parallelda ortadi, ketma-ketda kamayadi?`,desc:`O'zi takrorlanadi (8 soniya). Chapda parallel ulash: plastinkalar yuzasi qo'shiladi. O'ngda ketma-ket ulash: o'rtadagi plastinkalar «yo'qoladi», masofa 2 marta ortadi.`,\n html:`<canvas id=\"cA\" style=\"height:300px\"><\/canvas>`},\n{id:`sim`,tag:`🧪 Simulyatsiya`,title:`🧪 Simulyatsiya: kondensatorlar batareyasi`,desc:`Ulash turini tanlang, sig'im va kuchlanishni o'zgartiring. Plastinkalardagi «+» va «−» belgilar zaryadlanishni ko'rsatadi, jadvalda esa q, U va C hisoblanadi.`,\n html:`<div><button class=\"btn on\" id=\"mP\">Parallel<\/button><button class=\"btn ghost\" id=\"mS\">Ketma-ket<\/button><\/div>\n<div class=\"ctl\">\n<label>U = <b id=\"vsU\">12<\/b> V <input type=\"range\" id=\"sU\" min=\"1\" max=\"50\" value=\"12\"><\/label>\n<label>C₁ = <b id=\"vs1\">2<\/b> µF <input type=\"range\" id=\"s1\" min=\"1\" max=\"10\" value=\"2\"><\/label>\n<label>C₂ = <b id=\"vs2\">3<\/b> µF <input type=\"range\" id=\"s2\" min=\"1\" max=\"10\" value=\"3\"><\/label>\n<label>C₃ = <b id=\"vs3\">6<\/b> µF <input type=\"range\" id=\"s3\" min=\"1\" max=\"10\" value=\"6\"><\/label><\/div>\n<canvas id=\"cS\" style=\"height:300px\"><\/canvas><div class=\"out\" id=\"oS\"><\/div>`}\n],\nboard:[`<b>28-§. Kondensatorlarni parallel va ketma-ket ulash<\/b>`,`<b>Parallel:<\/b> U = U₁ = U₂ ; q = q₁ + q₂ ; <b>C = C₁ + C₂<\/b>`,`<b>Ketma-ket:<\/b> q = q₁ = q₂ ; U = U₁ + U₂ ; <b>1/C = 1/C₁ + 1/C₂<\/b>`,`Ikkita ketma-ket: C = C₁·C₂ / (C₁ + C₂)`,`Misol: 6 µF va 3 µF ketma-ket ⇒ C = 18/9 = 2 µF`],\nformulas:[[`Parallel ulash`,`U = U₁ = U₂ ; q = q₁ + q₂ ; C = C₁ + C₂`],[`Ketma-ket ulash`,`q = q₁ = q₂ ; U = U₁ + U₂ ; 1/C = 1/C₁ + 1/C₂`],[`Ikki kondensator (ketma-ket)`,`C = C₁C₂ / (C₁ + C₂)`],[`Zaryad`,`q = C·U`]],\nquestions:[`Parallel ulangan kondensatorlarda qaysi kattalik hamma uchun bir xil bo'ladi?`,`Nima uchun parallel ulanganda umumiy sig'im ortadi?`,`Ketma-ket ulanganda umumiy sig'im nega eng kichik sig'imdan ham kichik bo'ladi?`,`300 V ga chidaydigan kondensatorlar bor, 600 V kuchlanishda ishlatish kerak. Ularni qanday ulaysiz?`],\nquiz:[\n[`C₁ = 2 µF va C₂ = 3 µF parallel ulangan. Umumiy sig'im?`,[`1,2 µF`,`5 µF`,`6 µF`,`1 µF`],1],\n[`6 µF va 3 µF ketma-ket ulangan. Umumiy sig'im?`,[`9 µF`,`4,5 µF`,`2 µF`,`18 µF`],2],\n[`Ketma-ket ulangan kondensatorlarda nima bir xil?`,[`kuchlanish`,`zaryad`,`sig'im`,`energiya`],1],\n[`Parallel ulashda umumiy sig'im...`,[`eng kichik sig'imdan kichik`,`sig'imlar yig'indisiga teng`,`o'rtacha qiymatga teng`,`o'zgarmaydi`],1],\n[`Yuqori kuchlanishga chidamlilikni oshirish uchun kondensatorlar...`,[`ketma-ket ulanadi`,`parallel ulanadi`,`farqi yo'q`,`ulanmaydi`],0]],\nhomework:[`28-§ matnini o'qing, formulalarni yod oling, sxemalarni daftarga chizing.`,`Masala: C₁ = 3 µF va C₂ = 6 µF kondensatorlar 12 V manbaga ketma-ket ulangan. C, q, U₁, U₂ ni toping. (Javob: 2 µF; 24 µC; 8 V; 4 V)`,`Masala: xuddi shu kondensatorlar parallel ulansa, umumiy zaryad qancha? (Javob: 108 µC)`,`Ijodiy: uydagi biror elektron qurilmadagi kondensatorlarni toping va sxemada qanday ulanganini taxmin qiling.`],\nrubric:[`5 («a'lo»): formulalarni keltirib chiqaradi, simulyatsiya natijasini hisob bilan tasdiqlaydi, masalani xatosiz yechadi.`,`4 («yaxshi»): formulalarni to'g'ri qo'llaydi, 1 ta arifmetik xato.`,`3 («qoniqarli»): ulanish turini aniqlaydi, formulani yozadi, lekin hisoblashda yordam kerak.`,`Test: 5/5 — «5», 4/5 — «4», 3/5 — «3».`],\ntips:[`Animatsiyani bosqichma-bosqich to'xtatib, har kadrda «nima o'zgardi?» deb so'rang.`,`Simulyatsiyada avval hisoblab, keyin tekshirishni talab qiling — shunda tajriba «tasdiq»ga aylanadi.`,`Kuchli o'quvchilarga 3 ta kondensatorli aralash ulashni (29-§ ga ko'prik) taklif qiling.`,`Telefon bo'lmasa, proyektordan umumiy ko'rsatish yetarli: juftliklar uchun natijalar jadvalini oldindan chop eting.`],\ninit(){\n /* ANIMATSIYA */\n anim($('#cA'),(g,W,H,t)=>{\n  const k=Math.min(1,W/700),T=t%8;\n  let s=T<1.5?0:T<3.5?(T-1.5)/2:T<6.5?1:Math.max(0,1-(T-6.5)/1.5);s=sm(s);\n  const fs=Math.round(15*Math.max(.85,k));\n  g.font=`bold ${fs}px system-ui`;g.textAlign='center';g.fillStyle='#0d47a1';\n  g.fillText('PARALLEL ulash',W*.25,24);g.fillText('KETMA-KET ulash',W*.75,24);\n  g.strokeStyle='#cfd8dc';g.lineWidth=1;g.beginPath();g.moveTo(W/2,10);g.lineTo(W/2,H-10);g.stroke();\n  const w=78*k,d=34*k,pt=6;\n  const plate=(x,y,ww,col,al=1)=>{g.globalAlpha=al;g.fillStyle=col;g.fillRect(x,y-pt/2,ww,pt);g.globalAlpha=1};\n  const field=(x,y,ww,h,n)=>{g.strokeStyle='#90a4ae';g.lineWidth=1;g.setLineDash([3,3]);for(let i=0;i<n;i++){const xx=x+ww*(i+.5)/n;g.beginPath();g.moveTo(xx,y+pt/2);g.lineTo(xx,y+h-pt/2);g.stroke()}g.setLineDash([])};\n  /* parallel */\n  const cx=W*.25,y1=H*.3,gap=lerp(60*k,0,s),xl=cx-w-gap/2,xr=cx+gap/2;\n  [xl,xr].forEach(x=>{plate(x,y1,w,'#e53935');plate(x,y1+d,w,'#1e88e5');field(x,y1,w,d,4)});\n  g.font=`bold ${fs}px system-ui`;g.fillStyle='#e53935';g.fillText('+',cx,y1-10);g.fillStyle='#1e88e5';g.fillText('−',cx,y1+d+22);\n  g.fillStyle='#1c2733';g.globalAlpha=1-s;g.fillText('C₁',xl+w/2,y1+d+46);g.fillText('C₂',xr+w/2,y1+d+46);\n  g.globalAlpha=s;g.fillText('C = C₁ + C₂',cx,y1+d+46);\n  g.fillStyle='#e65100';g.globalAlpha=sm((s-.5)*2);g.fillText('S ortdi ⇒ C ortdi',cx,y1+d+76);g.globalAlpha=1;\n  /* ketma-ket */\n  const cx2=W*.75,ya=H*.2,gb=lerp(50*k,0,s),x2=cx2-w/2;\n  plate(x2,ya,w,'#e53935');plate(x2,ya+d,w,'#7e57c2',1-s);plate(x2,ya+d+gb,w,'#7e57c2',1-s);plate(x2,ya+2*d+gb,w,'#1e88e5');\n  field(x2,ya,w,d,4);field(x2,ya+d+gb,w,d,4);\n  g.fillStyle='#e53935';g.fillText('+',cx2,ya-10);g.fillStyle='#1e88e5';g.fillText('−',cx2,ya+2*d+gb+22);\n  g.fillStyle='#1c2733';g.globalAlpha=1-s;g.textAlign='right';g.fillText('C₁',x2-8,ya+d/2+5);g.fillText('C₂',x2-8,ya+d+gb+d/2+5);\n  g.textAlign='center';g.globalAlpha=s;g.fillText('1/C = 1/C₁ + 1/C₂',cx2,ya+2*d+gb+46);\n  g.fillStyle='#e65100';g.globalAlpha=sm((s-.5)*2);g.fillText('d ortdi ⇒ C kamaydi',cx2,ya+2*d+gb+76);g.globalAlpha=1;\n  g.fillStyle='#78909c';g.font=`${Math.round(12*Math.max(.9,k))}px system-ui`;g.fillText(`C = εε₀S / d`,W/2,H-10);\n });\n /* SIMULYATSIYA */\n let mode='par',S=null,t0=performance.now();\n const ids=['sU','s1','s2','s3'];\n function calc(){\n  const U=+$('#sU').value,C=[+$('#s1').value,+$('#s2').value,+$('#s3').value];\n  ids.forEach(i=>{$('#v'+i).textContent=$('#'+i).value});\n  let Ct,q=[],Uv=[],txt;\n  if(mode==='par'){Ct=C[0]+C[1]+C[2];C.forEach((c,i)=>{q[i]=c*U;Uv[i]=U});txt=`C = ${C.map(c=>f(c)).join(' + ')} = <b>${f(Ct)} µF<\/b>`}\n  else{const inv=C.reduce((a,c)=>a+1/c,0);Ct=1/inv;const Q=Ct*U;C.forEach((c,i)=>{q[i]=Q;Uv[i]=Q/c});txt=`1/C = ${C.map(c=>'1/'+f(c)).join(' + ')} = ${f(inv,3)} µF⁻¹ ⇒ C = <b>${f(Ct)} µF<\/b>`}\n  const W=Ct*U*U/2;\n  $('#oS').innerHTML=`<div>${txt}<\/div><table><tr><th><\/th><th>C (µF)<\/th><th>q (µC)<\/th><th>U (V)<\/th><\/tr>`+C.map((c,i)=>`<tr><th>C${'₁₂₃'[i]}<\/th><td>${f(c)}<\/td><td>${f(q[i])}<\/td><td>${f(Uv[i])}<\/td><\/tr>`).join('')+`<tr><th>Umumiy<\/th><td><b>${f(Ct)}<\/b><\/td><td><b>${f(mode==='par'?q[0]+q[1]+q[2]:q[0])}<\/b><\/td><td><b>${f(U)}<\/b><\/td><\/tr><\/table><div class=\"mut\">Tekshiruv: ${mode==='par'?'q = q₁+q₂+q₃, U hammasida bir xil; C eng katta sig‘imdan ham katta.':'q hammasida bir xil, U₁+U₂+U₃ = '+f(Uv[0]+Uv[1]+Uv[2])+' V = U; C eng kichik sig‘imdan ham kichik.'}<\/div><div>Energiya: W = CU²/2 = <b>${f(W/1000,3)} mJ<\/b><\/div>`;\n  S={U,C,q,Uv};t0=performance.now();\n }\n ids.forEach(i=>$('#'+i).oninput=calc);\n $('#mP').onclick=()=>{mode='par';$('#mP').className='btn on';$('#mS').className='btn ghost';calc()};\n $('#mS').onclick=()=>{mode='ser';$('#mS').className='btn on';$('#mP').className='btn ghost';calc()};\n calc();\n anim($('#cS'),(g,W,H,t)=>{\n  if(!S)return;\n  const p=Math.min(1,(performance.now()-t0)/2500),k=Math.min(1,W/700),{C,q,Uv,U}=S;\n  const qmax=Math.max(...q),nS=i=>Math.max(p>.05?1:0,Math.round((1+4*q[i]/qmax)*p));\n  const fs=Math.round(12*Math.max(.9,k));g.font=`${fs}px system-ui`;g.textAlign='center';\n  const L=(a,b,c,d)=>{g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()};\n  g.strokeStyle='#37474f';g.lineWidth=2.5;\n  const pw=44*k+14;\n  const bat=(x,yc)=>{g.lineWidth=2.5;g.strokeStyle='#37474f';g.lineWidth=4;L(x-16,yc-8,x+16,yc-8);L(x-9,yc+8,x+9,yc+8);g.lineWidth=2.5;g.fillStyle='#c62828';g.textAlign='left';g.font=`bold ${fs+2}px system-ui`;g.fillText('+',x+20,yc-6);g.fillStyle='#1565c0';g.fillText('−',x+20,yc+16);g.fillStyle='#1c2733';g.font=`bold ${fs}px system-ui`;g.fillText(`U = ${f(U)} V`,x-16,yc+36);g.textAlign='center';g.font=`${fs}px system-ui`};\n  if(S&&mode==='par'){\n   const yt=H*.1,yb=H*.9,yc=H*.5,gp=Math.max(18,H*.07),x0=W*.1,xs=[.32,.55,.78].map(a=>a*W);\n   L(x0,yt,xs[2],yt);L(x0,yb,xs[2],yb);L(x0,yt,x0,yc-8);L(x0,yc+8,x0,yb);bat(x0,yc);\n   xs.forEach((x,i)=>{\n    g.lineWidth=2.5;g.strokeStyle='#37474f';L(x,yt,x,yc-gp);L(x,yb,x,yc+gp);\n    g.lineWidth=5;g.strokeStyle='#e53935';L(x-pw/2,yc-gp,x+pw/2,yc-gp);g.strokeStyle='#1e88e5';L(x-pw/2,yc+gp,x+pw/2,yc+gp);\n    const n=nS(i);\n    for(let j=0;j<n;j++){const xx=x-pw/2+pw*(j+.5)/5;g.fillStyle='#e53935';g.fillText('+',xx,yc-gp+14);g.fillStyle='#1e88e5';g.fillText('−',xx,yc+gp-6)}\n    g.fillStyle='#1c2733';g.fillText(`C${i+1} = ${f(C[i])} µF`,x,yc+gp+24);g.fillText(`q = ${f(q[i])} µC`,x,yc+gp+40);g.fillText(`U = ${f(Uv[i])} V`,x,yc+gp+56);\n   });\n  } else if(S){\n   const x0=W*.08,x1=W*.92,y0=H*.3,y1=H*.82,ym=(y0+y1)/2,gp=Math.max(10,12*k),xs=[.3,.5,.7].map(a=>a*W),ph=Math.min(60,H*.2);\n   g.lineWidth=2.5;g.strokeStyle='#37474f';\n   L(x0,y0,xs[0]-gp,y0);L(xs[0]+gp,y0,xs[1]-gp,y0);L(xs[1]+gp,y0,xs[2]-gp,y0);L(xs[2]+gp,y0,x1,y0);\n   L(x1,y0,x1,y1);L(x1,y1,x0,y1);L(x0,y0,x0,ym-8);L(x0,ym+8,x0,y1);bat(x0,ym);\n   xs.forEach((x,i)=>{\n    g.lineWidth=5;g.strokeStyle='#e53935';L(x-gp,y0-ph/2,x-gp,y0+ph/2);g.strokeStyle='#1e88e5';L(x+gp,y0-ph/2,x+gp,y0+ph/2);\n    const n=nS(i);\n    for(let j=0;j<n;j++){const yy=y0-ph/2+ph*(j+.5)/5+4;g.fillStyle='#e53935';g.fillText('+',x-gp+9,yy);g.fillStyle='#1e88e5';g.fillText('−',x+gp-9,yy)}\n    g.fillStyle='#1c2733';g.fillText(`C${i+1} = ${f(C[i])} µF`,x,y0+ph/2+22);g.fillText(`q = ${f(q[i])} µC`,x,y0+ph/2+38);g.fillText(`U = ${f(Uv[i])} V`,x,y0+ph/2+54);\n   });\n  }\n  g.fillStyle='#78909c';g.textAlign='right';g.fillText(`Zaryadlanish: ${Math.round(p*100)} %`,W-8,16);\n });\n}\n});\n<\/script><\/body><\/html>"}]</script>
<script>
var L=JSON.parse(document.getElementById('data').textContent);
var sel=document.getElementById('sel'),fr=document.getElementById('fr'),cnt=document.getElementById('cnt'),
    prev=document.getElementById('prev'),next=document.getElementById('next'),cur=-1;
L.forEach(function(l,i){var o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+l.t;sel.appendChild(o)});
function go(i,noHash){
  if(i<0||i>=L.length||i===cur)return;
  cur=i;sel.value=i;fr.srcdoc=L[i].h;
  cnt.textContent=(i+1)+'/'+L.length;
  prev.disabled=i===0;next.disabled=i===L.length-1;
  document.title=L[i].t+' — Fizika 8-sinf';
  if(!noHash){try{history.replaceState(null,'','#d'+(i+1))}catch(e){}}
}
sel.onchange=function(){go(+sel.value)};
prev.onclick=function(){go(cur-1)};
next.onclick=function(){go(cur+1)};
function fromHash(){var m=/^#d(\d+)$/.exec(location.hash);return m?Math.min(L.length,Math.max(1,+m[1]))-1:0}
window.addEventListener('hashchange',function(){go(fromHash(),true)});
go(fromHash(),true);
</script>
