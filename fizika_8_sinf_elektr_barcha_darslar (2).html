=>d[0]/d[1]);if(!Rs.length)return;const ra=Rs.reduce((a,b)=>a+b,0)/Rs.length;$('#rf').textContent=`Haqiqiy R = ${Rx} Ω. Sizning natijangiz: ${nf(ra,1)} Ω (farq ${nf(Math.abs(ra-Rx)/Rx*100,1)} %).`};\nt3();\n\nquiz([[\"Bu ishda ampermetr qanday ulanadi?\",[\"ketma-ket\",\"parallel\",\"faqat manbaga\",\"ulanmaydi\"]],[\"Voltmetr rezistorga qanday ulanadi?\",[\"ketma-ket\",\"parallel\",\"reostatga\",\"kalitga\"]],[\"Reostatning vazifasi bu ishda?\",[\"qarshilikni o‘lchash\",\"manbani almashtirish\",\"tok kuchi va kuchlanishni o‘zgartirish\",\"kuchlanishni o‘lchash\"]],[\"U = 4,5 V, I = 0,3 A. R = ?\",[\"1,35 Ω\",\"15 Ω\",\"0,07 Ω\",\"150 Ω\"]],[\"I(U) grafigi qanday bo‘ladi?\",[\"giperbola\",\"koordinata boshidan o‘tuvchi to‘g‘ri chiziq\",\"gorizontal chiziq\",\"aylana\"]]],[0,1,2,1,1]);loop();\n<\/script><\/body><\/html>"}, {"t": "20-§ Reostat bilan tok kuchini rostlash", "h": "<!DOCTYPE html><html lang=\"uz\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><title>Amaliy mashg‘ulot. Reostat yordamida tok kuchini rostlash<\/title><style>:root{--bg:#fff;--fg:#1c1e21;--mu:#5f6673;--card:#f1f3f6;--c1:#fbe99a;--c2:#fff0a0;--c3:#c9f2d3;--bd:#d3d8df;--ac:#2f5fe0;--ok:#15803d;--bad:#c62828;--wire:#222;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#15171b;--fg:#e8eaee;--mu:#9aa3b2;--card:#1f2329;--c1:#6b5a14;--c2:#6b5f1c;--c3:#1f5a33;--bd:#38404c;--ac:#7ea1ff;--ok:#4ade80;--bad:#ff8a80;--wire:#d6dbe3;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#15171b;--fg:#e8eaee;--mu:#9aa3b2;--card:#1f2329;--c1:#6b5a14;--c2:#6b5f1c;--c3:#1f5a33;--bd:#38404c;--ac:#7ea1ff;--ok:#4ade80;--bad:#ff8a80;--wire:#d6dbe3;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nmain{max-width:760px;margin:0 auto;padding:16px}\nh1{font-size:25px;line-height:1.25;margin:.4em 0}h2{color:var(--ac);font-size:20px;line-height:1.3;margin:1.6em 0 .3em}\n.sub{color:var(--mu)}.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin:12px 0}\n.badge{display:inline-block;background:var(--ac);color:var(--bg);border-radius:10px;padding:1px 10px;font-size:14px;margin-left:6px;white-space:nowrap}\n.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid var(--bd);padding:7px 9px;text-align:left}\n.btn{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:9px 14px;margin:4px 4px 4px 0;cursor:pointer}\n.btn.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}\ninput[type=range]{width:100%}svg{width:100%;height:auto;display:block}\n.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:10px 0}\n.out div{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center}\n.out b{display:block;color:var(--ac);font-size:19px}.out small{color:var(--mu)}\ndetails{margin:10px 0}summary{font-weight:700;cursor:pointer}.ok{color:var(--ok)}.bad{color:var(--bad)}\n.q{margin:12px 0}.q label{display:block;padding:4px 0}\ntextarea,input[type=text]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;width:100%;box-sizing:border-box}\n.bar{display:flex;height:28px;border-radius:8px;overflow:hidden;margin:6px 0;font-size:13px;color:#fff}.bar i{display:block;text-align:center;line-height:28px;font-style:normal;overflow:hidden}\n.warn{border-left:4px solid var(--bad);padding-left:10px}\n<\/style><\/head><body><main>\n<h1>Amaliy mashg‘ulot. Reostat yordamida tok kuchini rostlash<\/h1><p class=sub>Fizika, 8-sinf · II bob «Elektr toki» · 20-§ · 45 daqiqa · dars ishlanma + interaktiv simulyatsiyalar<\/p><p><b>Mavzu:<\/b> Amaliy mashg‘ulot. Reostat yordamida tok kuchini rostlash<\/p>\n<div class=box><p><b>Jihozlar:<\/b> proyektor yoki planshet, tok manbai (4–6 V), reostat, lampochka, kalit, ampermetr, voltmetr, ulovchi simlar, daftar.<\/p><ul><li><b>Ta’limiy:<\/b> reostatning tuzilishi va vazifasini bilish, zanjirda tok kuchini rostlash, asboblarni to‘g‘ri ulash.<\/li><li><b>Rivojlantiruvchi:<\/b> o‘lchash, jadval to‘ldirish, grafik chizish va xulosa chiqarish ko‘nikmalarini shakllantirish.<\/li><li><b>Tarbiyaviy:<\/b> aniqlik, jamoada ishlash va texnika xavfsizligiga rioya qilishni tarbiyalash.<\/li><\/ul><p><b>Kutilayotgan natija:<\/b> o‘quvchi zanjirni yig‘adi, reostat bilan tokni rostlaydi, I va U ni o‘lchaydi, R ni hisoblaydi va I(U) grafigini chizadi.<\/p><\/div>\n<h2>Dars bosqichlari<\/h2><div class=tw><table><tr><th>№<\/th><th>Bosqich<\/th><th>Vaqt<\/th><\/tr><tr><td>1<\/td><td>Tashkiliy qism<\/td><td>2 daq<\/td><\/tr><tr><td>2<\/td><td>Takrorlash va motivatsiya<\/td><td>5 daq<\/td><\/tr><tr><td>3<\/td><td>1-reja: Reostat tuzilishi<\/td><td>10 daq<\/td><\/tr><tr><td>4<\/td><td>2-reja: Zanjirni yig‘ish va o‘lchash<\/td><td>12 daq<\/td><\/tr><tr><td>5<\/td><td>3-reja: Jadval, grafik, xulosa<\/td><td>8 daq<\/td><\/tr><tr><td>6<\/td><td>Mustahkamlash testi<\/td><td>5 daq<\/td><\/tr><tr><td>7<\/td><td>Yakun, baholash, uyga vazifa<\/td><td>3 daq<\/td><\/tr><\/table><\/div><h2>Tashkiliy qism <span class=badge>2 daq<\/span><\/h2><p>Salomlashish, davomat, texnika xavfsizligi qoidalarini eslatish, dars maqsadini e’lon qilish.<\/p><h2>Takrorlash va motivatsiya <span class=badge>5 daq<\/span><\/h2><p><b>Savollar:<\/b> Om qonunini ayting. Tok kuchi qanday birlikda o‘lchanadi? Qarshilik ortsa, tok kuchi qanday o‘zgaradi?<\/p><p><b>Motivatsiya:<\/b> Magnitofonda ovoz balandligini, stol chirog‘ining yorug‘ligini qanday silliq o‘zgartiramiz? Bugun shu qurilma — reostat bilan ishlaymiz.<\/p><div class=box><b>Ishning maqsadi:<\/b> reostat yordamida zanjirdagi tok kuchini rostlashni o‘rganish va tok kuchi kuchlanishga bog‘liqligini tekshirish.<\/div><h2>1-reja. Reostat tuzilishi va sxemadagi o‘rni <span class=badge>10 daq<\/span><\/h2><p><b>Maqsad:<\/b> reostatning tuzilishi va ishlash prinsipini tushunish.<\/p><p><b>Vaqt:<\/b> tushuntirish 4 · 1-simulyatsiya 4 · savol-topshiriq 2 daqiqa.<\/p><div class=box><b>1-simulyatsiya: surgichni suring<\/b><svg id=s1 viewBox=\"0 0 340 150\"><\/svg><label>Surgich holati: <input type=range id=g1 min=0 max=100 step=1 value=50><\/label><div class=out id=o1><\/div><p class=sub>Tok chap uchdan surgichgacha bo‘lgan sim qismidan o‘tadi: shu qism uzunligi qarshilikni belgilaydi (R = 0–20 Ω).<\/p><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Reostat tuzilishini (g‘altak, sirpanuvchi kontakt, klemmalar) ko‘rsatadi, sxemadagi belgisini chizadi.<\/li><li>«Suv kranini burash» analogiyasi: surgich = kran, qarshilik = kran torayishi.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> reostatni daftarga chizadi, simulyatsiyada surgichni surib R ning o‘zgarishini kuzatadi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Surgich o‘ng tomonga surilsa R qanday o‘zgaradi? (ortadi)<\/li><li>Reostat zanjirga qanday ulanadi? (ketma-ket)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> Tuzilish va ishlash prinsipini to‘liq tushuntiradi.<\/li><li><b>4:<\/b> 1 ta kichik xato.<\/li><li><b>3:<\/b> Yordam bilan tushuntiradi.<\/li><li><b>2:<\/b> Tushuntira olmaydi.<\/li><\/ul><\/details><h2>2-reja. Zanjirni yig‘ish va tok kuchini rostlash <span class=badge>12 daq<\/span><\/h2><p><b>Maqsad:<\/b> zanjirni yig‘ish, reostat yordamida kamida 5 xil holat uchun I va U ni o‘lchash.<\/p><p><b>Vaqt:<\/b> yig‘ish 3 · o‘lchash (2-simulyatsiya/amaliy) 7 · tekshirish 2 daqiqa.<\/p><div class=box><b>2-simulyatsiya: lampochka zanjiri (manba 6 V, lampochka 10 Ω, reostat 0–20 Ω)<\/b><svg id=s2 viewBox=\"0 0 340 200\"><\/svg><label>Reostat qarshiligi: <input type=range id=g2 min=0 max=20 step=0.1 value=10><\/label><p><b id=r2><\/b><\/p><button class=btn id=k2>Kalit: yopiq<\/button><button class=btn id=w2>📝 O‘lchovni yozish<\/button><div class=out id=o2><\/div><p class=sub>Asboblar bo‘lim qiymatigacha yaxlitlab o‘qiladi: ampermetr 0,02 A, voltmetr 0,2 V.<\/p><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Guruhlarni (2–3 kishi) tuzadi, asboblarni tarqatadi, zanjirni tekshiradi.<\/li><li>Shkala bo‘lim qiymatini aniqlashni ko‘rsatadi: bo‘lim qiymati = chegara / bo‘limlar soni.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> zanjirni yig‘adi, reostat bilan tokni o‘zgartiradi, har holatda ampermetr va voltmetr ko‘rsatishini yozadi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Surgichni surganda I va U qanday o‘zgardi? (birgalikda ortdi yoki kamaydi)<\/li><li>Bo‘lim qiymati 0,02 A bo‘lsa, o‘lchash xatoligi taxminan qancha? (bo‘limning yarmi)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> Zanjirni xatosiz yig‘adi, 5 ta o‘lchovni aniq yozadi.<\/li><li><b>4:<\/b> 4 ta o‘lchov, kichik noaniqlik.<\/li><li><b>3:<\/b> 3 ta o‘lchov, yordam bilan.<\/li><li><b>2:<\/b> O‘lchay olmaydi.<\/li><\/ul><\/details><h2>3-reja. Jadval, grafik, R ni hisoblash va xulosa <span class=badge>8 daq<\/span><\/h2><p><b>Maqsad:<\/b> natijalarni qayta ishlash: R = U / I, I(U) grafigini chizish, xulosa.<\/p><p><b>Vaqt:<\/b> hisoblash 2 · grafik 3 · xulosa 3 daqiqa.<\/p><div class=box><b>3-simulyatsiya: jadval, grafik va xulosa<\/b><button class=btn id=ns>Namuna ma’lumot<\/button><button class=btn id=cl>Tozalash<\/button><button class=btn id=ck>R ni tekshirish<\/button><div class=tw><table id=tb><\/table><\/div><svg id=s3 viewBox=\"0 0 340 230\"><\/svg><p id=rs><\/p><b>Xulosa (daftarga yozing):<\/b><textarea rows=3 placeholder=\"Masalan: tok kuchi kuchlanishga to‘g‘ri proporsional...\"><\/textarea><details><summary>Namunaviy xulosa<\/summary><p>I va U o‘zaro to‘g‘ri proporsional (grafik — koordinata boshidan o‘tuvchi to‘g‘ri chiziq), R = U/I deyarli o‘zgarmaydi. Kichik farqlar o‘lchash xatoligidan. Om qonuni tasdiqlandi.<\/p><\/details><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Hisoblash usulini ko‘rsatadi, grafik o‘qlarini belgilaydi: gorizontal — U, vertikal — I.<\/li><li>Xulosa yozishda yordam beradi.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> jadvalni to‘ldiradi, grafik chizadi, R o‘rtachasini topadi, xulosani yozadi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Nuqtalar nega aniq bitta chiziqda yotmaydi? (asbob xatoligi, yaxlitlash)<\/li><li>Grafik qanday ko‘rinishda chiqdi? (to‘g‘ri chiziq: I ~ U)<\/li><li>R o‘rtachasi qancha? (≈ 10 Ω)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> Hisob-kitob, grafik va xulosa to‘liq va aniq.<\/li><li><b>4:<\/b> Grafik yoki hisobda kichik xato.<\/li><li><b>3:<\/b> Qisman bajaradi, xulosani yordam bilan yozadi.<\/li><li><b>2:<\/b> Hisobot yo‘q.<\/li><\/ul><\/details><h2>Mustahkamlash testi <span class=badge>5 daq<\/span><\/h2><div class=box id=qz><\/div><h2>Yakun va uyga vazifa <span class=badge>3 daq<\/span><\/h2><p><b>Refleksiya:<\/b> «Bugun nimani bildim? Nima tushunarsiz qoldi?»<\/p><ol><li>Laboratoriya hisobotini daftarda yakunlang (sxema, jadval, grafik, xulosa).<\/li><li><b>Masala:<\/b> U = 6 V, I = 0,4 A. R = ? (15 Ω)<\/li><li><b>Masala:<\/b> R = 25 Ω, I = 0,2 A. U = ? (5 V)<\/li><li><b>Ijodiy:<\/b> R qiymatlari nega bir-biridan biroz farq qiladi? Xatolik sabablarini 3 ta gapda yozing.<\/li><li><i>Qo‘shimcha:<\/i> reostat ishlatiladigan 3 ta qurilmani toping.<\/li><\/ol>\n<script>\nconst $=s=>document.querySelector(s),NS=\"http://www.w3.org/2000/svg\",pk=a=>a[Math.floor(Math.random()*a.length)];\nconst f=(x,d=2)=>(+x).toFixed(d).replace(\".\",\",\"),rd=(x,s)=>Math.round(x/s)*s,spd=I=>I>0?Math.min(25+I*90,240):0;\nfunction S(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}\nfunction box(p,x,y,w,h,t,fill){S(\"rect\",{x,y,width:w,height:h,rx:6,fill:fill||\"var(--card)\",stroke:\"var(--wire)\",\"stroke-width\":2},p);const e=S(\"text\",{x:x+w/2,y:y+h/2+4,\"text-anchor\":\"middle\",\"font-size\":12,fill:\"var(--fg)\"},p);e.textContent=t;return e}\nfunction circ(p,x,y,t){S(\"circle\",{cx:x,cy:y,r:13,fill:\"var(--c3)\",stroke:\"var(--wire)\",\"stroke-width\":2},p);const e=S(\"text\",{x,y:y+3.5,\"text-anchor\":\"middle\",\"font-size\":9,fill:\"var(--fg)\"},p);e.textContent=t;return e}\nfunction wire(p,pts){S(\"polygon\",{points:pts.map(q=>q.join(\",\")).join(\" \"),fill:\"none\",stroke:\"var(--wire)\",\"stroke-width\":2},p)}\nconst loops=[];\nfunction Loop(svg,pts,n){const seg=[];let L=0;pts.forEach((a,i)=>{const b=pts[(i+1)%pts.length],d=Math.hypot(b[0]-a[0],b[1]-a[1]);seg.push([a,b,d,L]);L+=d});\nconst dots=[];for(let i=0;i<n;i++)dots.push(S(\"circle\",{r:4,fill:\"var(--ac)\"},svg));\nconst o={v:0,t:0,L,dots,on:true,pos(s){s=((s%L)+L)%L;for(const g of seg)if(s<=g[3]+g[2]){const k=(s-g[3])/g[2];return[g[0][0]+(g[1][0]-g[0][0])*k,g[0][1]+(g[1][1]-g[0][1])*k]}return seg[0][0]}};loops.push(o);return o}\nlet last=performance.now();\nfunction tick(now){const dt=Math.min(now-last,50)/1000;last=now;for(const o of loops){o.t+=o.v*dt;o.dots.forEach((c,i)=>{const p=o.pos(o.t+i*o.L/o.dots.length);c.setAttribute(\"cx\",p[0]);c.setAttribute(\"cy\",p[1]);c.style.display=o.on?\"\":\"none\"})}requestAnimationFrame(tick)}\nrequestAnimationFrame(tick);\nlet qn=0;\nfunction Quiz(id,Q){const r=$(id),u=\"q\"+(qn++);r.innerHTML=Q.map((q,i)=>`<div class=q><b>${i+1}. ${q.q}<\/b>${q.o.map((o,j)=>`<label><input type=radio name=\"${u}_${i}\" value=${j}> ${\"ABCD\"[j]}) ${o}<\/label>`).join(\"\")}<\/div>`).join(\"\")+`<button class=btn>Tekshirish<\/button><p class=res><\/p>`;\nr.querySelector(\"button\").onclick=()=>{let s=0,w=[];Q.forEach((q,i)=>{const c=r.querySelector(`input[name=\"${u}_${i}\"]:checked`);if(c&&+c.value==q.a)s++;else w.push(i+1)});r.querySelector(\".res\").innerHTML=`To‘g‘ri javoblar: <b>${s}/${Q.length}<\/b> → baho «${Math.max(2,5-(Q.length-s))}»`+(w.length?`. Qayta ko‘ring: ${w.join(\", \")}-savol.`:` <span class=ok>Barakalla!<\/span>`)}}\nfunction Prob(id,gen){const r=$(id),k=id.slice(1);let c;function nw(){c=gen();r.innerHTML=`<p><b>${c.t}<\/b><\/p>`+c.a.map((a,i)=>`<label>${a.l} = <input type=text inputmode=decimal id=\"${k}${i}\" style=\"width:110px;display:inline-block\"> ${a.u}<\/label><br>`).join(\"\")+`<button class=btn id=${k}c>Tekshirish<\/button><button class=btn id=${k}n>Yangi masala<\/button><p class=res><\/p>`;\n$(\"#\"+k+\"c\").onclick=()=>{let ok=0;c.a.forEach((a,i)=>{const v=parseFloat($(\"#\"+k+i).value.replace(\",\",\".\"));if(Math.abs(v-a.v)<=Math.max(.02*Math.abs(a.v),.011))ok++});r.querySelector(\".res\").innerHTML=ok==c.a.length?`<span class=ok>To‘g‘ri! Baho: 5<\/span>`:`<span class=bad>${ok}/${c.a.length} to‘g‘ri.<\/span> Yechim: ${c.s}`};$(\"#\"+k+\"n\").onclick=nw}nw()}\nfunction Out(id,arr){$(id).innerHTML=arr.map(a=>`<div><b>${a[1]}<\/b><small>${a[0]}<\/small><\/div>`).join(\"\")}\n\n(function(){const g=$(\"#g1\"),svg=$(\"#s1\");S(\"line\",{x1:40,y1:25,x2:320,y2:25,stroke:\"var(--wire)\",\"stroke-width\":3},svg);const ls=[];for(let i=0;i<=26;i++){ls.push(S(\"line\",{x1:40+i*10,y1:50,x2:40+i*10,y2:100,\"stroke-width\":4},svg))}\nS(\"line\",{x1:20,y1:75,x2:40,y2:75,stroke:\"var(--wire)\",\"stroke-width\":3},svg);S(\"text\",{x:6,y:70,\"font-size\":11,fill:\"var(--fg)\"},svg).textContent=\"A\";S(\"text\",{x:322,y:20,\"font-size\":11,fill:\"var(--fg)\"},svg).textContent=\"B\";\nconst sl=S(\"line\",{y1:25,y2:48,stroke:\"var(--bad)\",\"stroke-width\":3},svg),tr=S(\"polygon\",{fill:\"var(--bad)\"},svg),tx=S(\"text\",{y:125,\"font-size\":12,\"text-anchor\":\"middle\",fill:\"var(--fg)\"},svg);tx.textContent=\"surgich\";\nfunction u(){const p=+g.value/100,x=40+p*260;ls.forEach((l,i)=>l.setAttribute(\"stroke\",40+i*10<=x+1?\"var(--ac)\":\"var(--bd)\"));sl.setAttribute(\"x1\",x);sl.setAttribute(\"x2\",x);tr.setAttribute(\"points\",`${x-6},112 ${x+6},112 ${x},102`);tx.setAttribute(\"x\",x);const R=20*p;Out(\"#o1\",[[\"ishlayotgan sim\",Math.round(p*100)+\" %\"],[\"reostat qarshiligi\",f(R,1)+\" Ω\"],[\"tok (lampochka 10 Ω, 6 V)\",f(6/(10+R))+\" A\"]])}g.oninput=u;u()})();\nconst rows=[];let kl=true;\n(function(){const svg=$(\"#s2\");wire(svg,[[30,40],[310,40],[310,170],[30,170]]);const bt=box(svg,10,90,40,40,\"6 V\",\"var(--c1)\");box(svg,80,28,80,24,\"Reostat\",\"var(--c2)\");S(\"circle\",{cx:310,cy:105,r:16,fill:\"#ffd84d\",opacity:1,id:\"gl\"},svg);const gl=svg.lastChild;S(\"circle\",{cx:310,cy:105,r:16,fill:\"none\",stroke:\"var(--wire)\",\"stroke-width\":2},svg);S(\"text\",{x:270,y:109,\"font-size\":11,\"text-anchor\":\"end\",fill:\"var(--fg)\"},svg).textContent=\"Lampa\";\ncirc(svg,170,170,\"A\");const kt=box(svg,225,158,50,24,\"Kalit\",\"var(--card)\");circ(svg,255,105,\"V\");S(\"polyline\",{points:\"255,92 255,70 310,70 310,89\",fill:\"none\",stroke:\"var(--wire)\",\"stroke-dasharray\":\"4\",},svg);S(\"polyline\",{points:\"255,118 255,140 310,140 310,121\",fill:\"none\",stroke:\"var(--wire)\",\"stroke-dasharray\":\"4\"},svg);\nconst lp=Loop(svg,[[30,40],[310,40],[310,170],[30,170]],26);const g=$(\"#g2\");let I=0;\nfunction u(){const Rh=+g.value;I=kl?6/(10+Rh):0;gl.setAttribute(\"opacity\",.12+.88*I/.6);lp.v=spd(I*3);lp.on=kl;$(\"#r2\").innerHTML=\"Reostat qarshiligi: \"+f(Rh,1)+\" Ω\";Out(\"#o2\",[[\"ampermetr\",f(rd(I,.02))+\" A\"],[\"voltmetr (lampa)\",f(rd(I*10,.2),1)+\" V\"],[\"yozilgan o‘lchov\",rows.length]])}\ng.oninput=u;$(\"#k2\").onclick=function(){kl=!kl;this.textContent=\"Kalit: \"+(kl?\"yopiq\":\"ochiq\");u()};\n$(\"#w2\").onclick=()=>{if(!kl)return;rows.push({rh:+g.value,I:rd(I,.02),U:rd(I*10,.2)});u();draw()};u()})();\nfunction draw(){const t=$(\"#tb\"),n=rows.length;t.innerHTML=\"<tr><th>№<\/th><th>Rh, Ω<\/th><th>I, A<\/th><th>U, V<\/th><th>R=U/I, Ω<\/th><\/tr>\"+rows.map((r,i)=>`<tr><td>${i+1}<\/td><td>${f(r.rh,1)}<\/td><td>${f(r.I)}<\/td><td>${f(r.U,1)}<\/td><td>${f(r.U/r.I,1)}<\/td><\/tr>`).join(\"\");\nconst svg=$(\"#s3\");svg.innerHTML=\"\";S(\"rect\",{x:40,y:10,width:280,height:190,fill:\"none\",stroke:\"var(--wire)\"},svg);for(let i=0;i<=6;i++){S(\"text\",{x:40+i*280/6,y:216,\"font-size\":11,\"text-anchor\":\"middle\",fill:\"var(--fg)\"},svg).textContent=i}S(\"text\",{x:330,y:224,\"font-size\":11,\"text-anchor\":\"end\",fill:\"var(--fg)\"},svg).textContent=\"U, V\";S(\"text\",{x:2,y:14,\"font-size\":11,fill:\"var(--fg)\"},svg).textContent=\"I, A\";[0,.2,.4,.6].forEach(v=>S(\"text\",{x:36,y:204-v/.6*190,\"font-size\":10,\"text-anchor\":\"end\",fill:\"var(--fg)\"},svg).textContent=f(v,1));\nif(n){const m=rows.reduce((a,r)=>a+r.U/r.I,0)/n;S(\"line\",{x1:40,y1:200,x2:320,y2:200-(6/m)/.6*190,stroke:\"var(--ac)\",\"stroke-dasharray\":\"5\"},svg);rows.forEach(r=>S(\"circle\",{cx:40+r.U/6*280,cy:200-r.I/.6*190,r:5,fill:\"var(--bad)\"},svg))}}\n$(\"#ns\").onclick=()=>{rows.length=0;[0,5,10,15,20].forEach(h=>{const I=6/(10+h);rows.push({rh:h,I:rd(I,.02),U:rd(I*10,.2)})});draw()};$(\"#cl\").onclick=()=>{rows.length=0;draw()};\n$(\"#ck\").onclick=()=>{if(!rows.length){$(\"#rs\").innerHTML=\"<span class=bad>Avval o‘lchovlarni yozing yoki namuna yuklang.<\/span>\";return}const m=rows.reduce((a,r)=>a+r.U/r.I,0)/rows.length;$(\"#rs\").innerHTML=`R o‘rtachasi ≈ <b>${f(m,1)} Ω<\/b>. Lampochka qarshiligi 10 Ω ga yaqin: ${Math.abs(m-10)<1?\"<span class=ok>natija to‘g‘ri<\/span>\":\"<span class=bad>o‘lchovlarni qayta tekshiring<\/span>\"}.`};draw();\nQuiz(\"#qz\",[{q:\"Reostatning vazifasi?\",o:[\"kuchlanishni o‘lchash\",\"qarshilikni o‘zgartirib tok kuchini rostlash\",\"manbani almashtirish\",\"tokni o‘chirish\"],a:1},{q:\"Ishlayotgan sim qismi uzunroq bo‘lsa, tok kuchi?\",o:[\"ortadi\",\"kamayadi\",\"o‘zgarmaydi\",\"nolga teng\"],a:1},{q:\"Ampermetr reostatga qanday ulanadi?\",o:[\"ketma-ket\",\"parallel\",\"faqat manbaga\",\"ulanmaydi\"],a:0},{q:\"U = 6 V, R = 20 Ω. I = ?\",o:[\"120 A\",\"0,3 A\",\"3,3 A\",\"14 A\"],a:1},{q:\"Reostat qarshiligi 0 Ω bo‘lsa, lampochka?\",o:[\"eng xira\",\"eng yorqin\",\"o‘chadi\",\"o‘zgarmaydi\"],a:1}]);\n<\/script><\/main><\/body><\/html>"}, {"t": "21-§ Iste’molchilarni ketma-ket ulash", "h": "<!DOCTYPE html><html lang=\"uz\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><title>Iste’molchilarni ketma-ket ulash<\/title><style>:root{--bg:#fff;--fg:#1c1e21;--mu:#5f6673;--card:#f1f3f6;--c1:#fbe99a;--c2:#fff0a0;--c3:#c9f2d3;--bd:#d3d8df;--ac:#2f5fe0;--ok:#15803d;--bad:#c62828;--wire:#222;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#15171b;--fg:#e8eaee;--mu:#9aa3b2;--card:#1f2329;--c1:#6b5a14;--c2:#6b5f1c;--c3:#1f5a33;--bd:#38404c;--ac:#7ea1ff;--ok:#4ade80;--bad:#ff8a80;--wire:#d6dbe3;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#15171b;--fg:#e8eaee;--mu:#9aa3b2;--card:#1f2329;--c1:#6b5a14;--c2:#6b5f1c;--c3:#1f5a33;--bd:#38404c;--ac:#7ea1ff;--ok:#4ade80;--bad:#ff8a80;--wire:#d6dbe3;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nmain{max-width:760px;margin:0 auto;padding:16px}\nh1{font-size:25px;line-height:1.25;margin:.4em 0}h2{color:var(--ac);font-size:20px;line-height:1.3;margin:1.6em 0 .3em}\n.sub{color:var(--mu)}.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin:12px 0}\n.badge{display:inline-block;background:var(--ac);color:var(--bg);border-radius:10px;padding:1px 10px;font-size:14px;margin-left:6px;white-space:nowrap}\n.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid var(--bd);padding:7px 9px;text-align:left}\n.btn{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:9px 14px;margin:4px 4px 4px 0;cursor:pointer}\n.btn.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}\ninput[type=range]{width:100%}svg{width:100%;height:auto;display:block}\n.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:10px 0}\n.out div{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center}\n.out b{display:block;color:var(--ac);font-size:19px}.out small{color:var(--mu)}\ndetails{margin:10px 0}summary{font-weight:700;cursor:pointer}.ok{color:var(--ok)}.bad{color:var(--bad)}\n.q{margin:12px 0}.q label{display:block;padding:4px 0}\ntextarea,input[type=text]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;width:100%;box-sizing:border-box}\n.bar{display:flex;height:28px;border-radius:8px;overflow:hidden;margin:6px 0;font-size:13px;color:#fff}.bar i{display:block;text-align:center;line-height:28px;font-style:normal;overflow:hidden}\n.warn{border-left:4px solid var(--bad);padding-left:10px}\n<\/style><\/head><body><main>\n<h1>Iste’molchilarni ketma-ket ulash<\/h1><p class=sub>Fizika, 8-sinf · II bob «Elektr toki» · 21-§ · 45 daqiqa · dars ishlanma + interaktiv simulyatsiyalar<\/p><p><b>Mavzu:<\/b> Iste’molchilarni ketma-ket ulash<\/p>\n<div class=box><p><b>Jihozlar:<\/b> proyektor yoki planshet, 2 ta lampochka (rezistor), manba, kalit, ampermetr, voltmetr, simlar, daftar.<\/p><ul><li><b>Ta’limiy:<\/b> ketma-ket ulanishda I = I₁ = I₂, U = U₁ + U₂, R = R₁ + R₂ qonuniyatlarini bilish.<\/li><li><b>Rivojlantiruvchi:<\/b> sxema chizish, qonuniyatni tajribada tekshirish, masala yechish.<\/li><li><b>Tarbiyaviy:<\/b> aniqlik va mas’uliyatni tarbiyalash.<\/li><\/ul><p><b>Kutilayotgan natija:<\/b> o‘quvchi ketma-ket ulanish sxemasini chizadi, qonuniyatlarni tushuntiradi va masalalar yechadi.<\/p><\/div>\n<h2>Dars bosqichlari<\/h2><div class=tw><table><tr><th>№<\/th><th>Bosqich<\/th><th>Vaqt<\/th><\/tr><tr><td>1<\/td><td>Tashkiliy qism<\/td><td>2 daq<\/td><\/tr><tr><td>2<\/td><td>Uy vazifasi va takrorlash<\/td><td>6 daq<\/td><\/tr><tr><td>3<\/td><td>1-reja: Sxema va tok kuchi<\/td><td>9 daq<\/td><\/tr><tr><td>4<\/td><td>2-reja: Kuchlanish va qarshilik<\/td><td>12 daq<\/td><\/tr><tr><td>5<\/td><td>3-reja: Masala yechish<\/td><td>8 daq<\/td><\/tr><tr><td>6<\/td><td>Mustahkamlash testi<\/td><td>5 daq<\/td><\/tr><tr><td>7<\/td><td>Yakun, baholash, uyga vazifa<\/td><td>3 daq<\/td><\/tr><\/table><\/div><h2>Tashkiliy qism <span class=badge>2 daq<\/span><\/h2><p>Salomlashish, davomat, dars maqsadini e’lon qilish.<\/p><h2>Uy vazifasi va takrorlash <span class=badge>6 daq<\/span><\/h2><p><b>Savollar:<\/b> Om qonunini yozing. Reostat nima uchun kerak? Ampermetr va voltmetr qanday ulanadi? Sxemada manba, kalit, rezistor belgilarini chizing.<\/p><p><b>Motivatsiya:<\/b> Yangi yil girlyandasida bitta lampochka kuyib qolsa, butun girlyanda o‘chadi. Nima uchun? Bugun shuni aniqlaymiz.<\/p><h2>1-reja. Ketma-ket ulanish sxemasi va tok kuchi <span class=badge>9 daq<\/span><\/h2><p><b>Maqsad:<\/b> ketma-ket ulanish tushunchasi, sxemasi va tok kuchining xususiyatini bilish: I = I₁ = I₂.<\/p><p><b>Vaqt:<\/b> tushuntirish 4 · 1-simulyatsiya 3 · savol-topshiriq 2 daqiqa.<\/p><div class=box><b>1-simulyatsiya: tok kuchi ketma-ket zanjirda<\/b><svg id=s1 viewBox=\"0 0 340 200\"><\/svg><p id=t1><\/p><label>R₁: <input type=range id=a1 min=5 max=30 step=5 value=10><\/label><label>R₂: <input type=range id=b1 min=5 max=30 step=5 value=20><\/label><button class=btn id=x1>R₂ ni uzish (lampa kuyganday)<\/button><div class=out id=o1><\/div><p class=sub>Uchala ampermetr bir xil ko‘rsatadi. Zanjir bir joyda uzilsa, hamma joyda tok to‘xtaydi.<\/p><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Girlyanda sxemasini chizadi: iste’molchilar bir-biridan keyin ulangan.<\/li><li>Animatsiyada elektronlar yagona yo‘ldan o‘tishini ko‘rsatadi («bir yo‘lli ko‘cha»).<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> sxemani daftarga chizadi, simulyatsiyada zanjirni uzib natijani kuzatadi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Zanjirning turli joylarida tok kuchi qanday? (bir xil)<\/li><li>Bitta iste’molchi uzilsa nima bo‘ladi? (butun zanjirda tok to‘xtaydi)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> Sxemani xatosiz chizadi, oqibatlarni tushuntiradi.<\/li><li><b>4:<\/b> 1 ta kichik xato.<\/li><li><b>3:<\/b> Yordam bilan chizadi.<\/li><li><b>2:<\/b> Sxemani chiza olmaydi.<\/li><\/ul><\/details><h2>2-reja. Kuchlanish va umumiy qarshilik <span class=badge>12 daq<\/span><\/h2><p><b>Maqsad:<\/b> U = U₁ + U₂ va R = R₁ + R₂ munosabatlarini tajribada tekshirish.<\/p><p><b>Vaqt:<\/b> tushuntirish 4 · 2-simulyatsiya 6 · tekshirish 2 daqiqa.<\/p><div class=box><b>2-simulyatsiya: kuchlanishlar taqsimoti<\/b><svg id=s2 viewBox=\"0 0 340 200\"><\/svg><p id=t2><\/p><label>Manba kuchlanishi: <input type=range id=u2 min=3 max=24 step=1 value=12><\/label><label>R₁: <input type=range id=a2 min=5 max=30 step=5 value=10><\/label><label>R₂: <input type=range id=b2 min=5 max=30 step=5 value=20><\/label><div class=bar id=bar2><\/div><div class=out id=o2><\/div><p class=sub>Katta qarshilikka katta kuchlanish to‘g‘ri keladi: U₁ / U₂ = R₁ / R₂.<\/p><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Om qonuni yordamida formulalarni keltirib chiqaradi: U₁ = IR₁, U₂ = IR₂, U = I(R₁ + R₂).<\/li><li>Namuna: R₁ = 10 Ω, R₂ = 20 Ω, U = 12 V → R = 30 Ω, I = 0,4 A, U₁ = 4 V, U₂ = 8 V.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> simulyatsiyada U₁ + U₂ = U ekanini tekshiradi, jadvalga yozadi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>U₁ + U₂ nimaga teng? (manba kuchlanishiga)<\/li><li>R₁ = R₂ bo‘lsa, kuchlanish qanday taqsimlanadi? (teng)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> Barcha munosabatlarni tajribada tasdiqlaydi.<\/li><li><b>4:<\/b> 1 ta kichik xato.<\/li><li><b>3:<\/b> Yordam bilan tekshiradi.<\/li><li><b>2:<\/b> Tekshira olmaydi.<\/li><\/ul><\/details><h2>3-reja. Masala yechish <span class=badge>8 daq<\/span><\/h2><p><b>Maqsad:<\/b> ketma-ket ulanish formulalarini masalalarda qo‘llash.<\/p><p><b>Vaqt:<\/b> masala tanlash 1 · yechish 5 · tekshirish 2 daqiqa.<\/p><div class=box><b>3-simulyatsiya: o‘zingizni sinang<\/b><div id=pr><\/div><p class=sub>Formulalar: R = R₁ + R₂ · I = U / R · U₁ = I·R₁<\/p><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Doskada namunaviy masalani yechadi, so‘ng mustaqil ishni nazorat qiladi.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> masalani «Berilgan–Formula–Yechim» shaklida yechadi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Ketma-ket ulangan ikki rezistor uchun umumiy qarshilik qanday topiladi?<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> Masalani to‘liq va to‘g‘ri yechadi.<\/li><li><b>4:<\/b> Hisobda kichik xato.<\/li><li><b>3:<\/b> Yordam bilan yechadi.<\/li><li><b>2:<\/b> Yecha olmaydi.<\/li><\/ul><\/details><h2>Mustahkamlash testi <span class=badge>5 daq<\/span><\/h2><div class=box id=qz><\/div><h2>Yakun va uyga vazifa <span class=badge>3 daq<\/span><\/h2><p><b>Refleksiya:<\/b> «Bugun nimani bildim?»<\/p><ol><li>21-§ ni o‘qing, savollarga javob bering.<\/li><li><b>Masala:<\/b> R₁ = 15 Ω, R₂ = 25 Ω ketma-ket, I = 0,3 A. R, U, U₁ ni toping. (40 Ω; 12 V; 4,5 V)<\/li><li><b>Ijodiy:<\/b> girlyanda sxemasini chizing va uni qanday sozlash mumkinligini yozing.<\/li><\/ol>\n<script>\nconst $=s=>document.querySelector(s),NS=\"http://www.w3.org/2000/svg\",pk=a=>a[Math.floor(Math.random()*a.length)];\nconst f=(x,d=2)=>(+x).toFixed(d).replace(\".\",\",\"),rd=(x,s)=>Math.round(x/s)*s,spd=I=>I>0?Math.min(25+I*90,240):0;\nfunction S(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}\nfunction box(p,x,y,w,h,t,fill){S(\"rect\",{x,y,width:w,height:h,rx:6,fill:fill||\"var(--card)\",stroke:\"var(--wire)\",\"stroke-width\":2},p);const e=S(\"text\",{x:x+w/2,y:y+h/2+4,\"text-anchor\":\"middle\",\"font-size\":12,fill:\"var(--fg)\"},p);e.textContent=t;return e}\nfunction circ(p,x,y,t){S(\"circle\",{cx:x,cy:y,r:13,fill:\"var(--c3)\",stroke:\"var(--wire)\",\"stroke-width\":2},p);const e=S(\"text\",{x,y:y+3.5,\"text-anchor\":\"middle\",\"font-size\":9,fill:\"var(--fg)\"},p);e.textContent=t;return e}\nfunction wire(p,pts){S(\"polygon\",{points:pts.map(q=>q.join(\",\")).join(\" \"),fill:\"none\",stroke:\"var(--wire)\",\"stroke-width\":2},p)}\nconst loops=[];\nfunction Loop(svg,pts,n){const seg=[];let L=0;pts.forEach((a,i)=>{const b=pts[(i+1)%pts.length],d=Math.hypot(b[0]-a[0],b[1]-a[1]);seg.push([a,b,d,L]);L+=d});\nconst dots=[];for(let i=0;i<n;i++)dots.push(S(\"circle\",{r:4,fill:\"var(--ac)\"},svg));\nconst o={v:0,t:0,L,dots,on:true,pos(s){s=((s%L)+L)%L;for(const g of seg)if(s<=g[3]+g[2]){const k=(s-g[3])/g[2];return[g[0][0]+(g[1][0]-g[0][0])*k,g[0][1]+(g[1][1]-g[0][1])*k]}return seg[0][0]}};loops.push(o);return o}\nlet last=performance.now();\nfunction tick(now){const dt=Math.min(now-last,50)/1000;last=now;for(const o of loops){o.t+=o.v*dt;o.dots.forEach((c,i)=>{const p=o.pos(o.t+i*o.L/o.dots.length);c.setAttribute(\"cx\",p[0]);c.setAttribute(\"cy\",p[1]);c.style.display=o.on?\"\":\"none\"})}requestAnimationFrame(tick)}\nrequestAnimationFrame(tick);\nlet qn=0;\nfunction Quiz(id,Q){const r=$(id),u=\"q\"+(qn++);r.innerHTML=Q.map((q,i)=>`<div class=q><b>${i+1}. ${q.q}<\/b>${q.o.map((o,j)=>`<label><input type=radio name=\"${u}_${i}\" value=${j}> ${\"ABCD\"[j]}) ${o}<\/label>`).join(\"\")}<\/div>`).join(\"\")+`<button class=btn>Tekshirish<\/button><p class=res><\/p>`;\nr.querySelector(\"button\").onclick=()=>{let s=0,w=[];Q.forEach((q,i)=>{const c=r.querySelector(`input[name=\"${u}_${i}\"]:checked`);if(c&&+c.value==q.a)s++;else w.push(i+1)});r.querySelector(\".res\").innerHTML=`To‘g‘ri javoblar: <b>${s}/${Q.length}<\/b> → baho «${Math.max(2,5-(Q.length-s))}»`+(w.length?`. Qayta ko‘ring: ${w.join(\", \")}-savol.`:` <span class=ok>Barakalla!<\/span>`)}}\nfunction Prob(id,gen){const r=$(id),k=id.slice(1);let c;function nw(){c=gen();r.innerHTML=`<p><b>${c.t}<\/b><\/p>`+c.a.map((a,i)=>`<label>${a.l} = <input type=text inputmode=decimal id=\"${k}${i}\" style=\"width:110px;display:inline-block\"> ${a.u}<\/label><br>`).join(\"\")+`<button class=btn id=${k}c>Tekshirish<\/button><button class=btn id=${k}n>Yangi masala<\/button><p class=res><\/p>`;\n$(\"#\"+k+\"c\").onclick=()=>{let ok=0;c.a.forEach((a,i)=>{const v=parseFloat($(\"#\"+k+i).value.replace(\",\",\".\"));if(Math.abs(v-a.v)<=Math.max(.02*Math.abs(a.v),.011))ok++});r.querySelector(\".res\").innerHTML=ok==c.a.length?`<span class=ok>To‘g‘ri! Baho: 5<\/span>`:`<span class=bad>${ok}/${c.a.length} to‘g‘ri.<\/span> Yechim: ${c.s}`};$(\"#\"+k+\"n\").onclick=nw}nw()}\nfunction Out(id,arr){$(id).innerHTML=arr.map(a=>`<div><b>${a[1]}<\/b><small>${a[0]}<\/small><\/div>`).join(\"\")}\n\nfunction SeriesCirc(svg){wire(svg,[[30,30],[310,30],[310,170],[30,170]]);\nconst bt=box(svg,10,80,40,40,\"6 V\",\"var(--c1)\"),t1=box(svg,90,16,70,28,\"\",\"var(--c2)\"),t2=box(svg,190,16,70,28,\"\",\"var(--c2)\"),x=S(\"text\",{x:225,y:75,\"text-anchor\":\"middle\",\"font-size\":22,fill:\"var(--bad)\"},svg);\nconst a1=circ(svg,60,30,\"\"),a2=circ(svg,175,30,\"\"),a3=circ(svg,285,30,\"\");S(\"text\",{x:30,y:195,\"font-size\":11,fill:\"var(--mu)\"},svg).textContent=\"A₁, A₂, A₃ — ampermetrlar (ketma-ket)\";\nconst lp=Loop(svg,[[30,30],[310,30],[310,170],[30,170]],26);\nreturn{upd(R1,R2,I,open,U){t1.textContent=\"R₁ = \"+R1+\" Ω\";t2.textContent=\"R₂ = \"+R2+\" Ω\";bt.textContent=U+\" V\";[a1,a2,a3].forEach(a=>a.textContent=f(I));x.textContent=open?\"✕ uzilgan\":\"\";lp.v=spd(I);lp.on=I>0}}}\n\nfunction Ser(p,o){const svg=$(\"#s\"+p),c=SeriesCirc(svg);let open=false;const A=$(\"#a\"+p),B=$(\"#b\"+p),U=o.U?$(\"#u\"+p):null;\nfunction u(){const R1=+A.value,R2=+B.value,V=U?+U.value:6,R=R1+R2,I=open?0:V/R;c.upd(R1,R2,I,open,V);\n$(\"#t\"+p).innerHTML=`R₁ = <b>${R1} Ω<\/b>, R₂ = <b>${R2} Ω<\/b>`+(U?`, U = <b>${V} V<\/b>`:\"\");\nif(o.v){Out(\"#o\"+p,[[\"U₁ = I·R₁\",f(I*R1)+\" V\"],[\"U₂ = I·R₂\",f(I*R2)+\" V\"],[\"U₁ + U₂\",f(I*R)+\" V\"],[\"manba U\",V+\" V\"],[\"R = R₁ + R₂\",R+\" Ω\"]]);const w=I>0?100*R1/R:50;$(\"#bar\"+p).innerHTML=`<i style=\"width:${w}%;background:var(--ac)\">U₁ ${f(I*R1,1)}<\/i><i style=\"width:${100-w}%;background:var(--ok)\">U₂ ${f(I*R2,1)}<\/i>`}\nelse Out(\"#o\"+p,[[\"I (A₁=A₂=A₃)\",f(I)+\" A\"],[\"R = R₁ + R₂\",R+\" Ω\"],[\"U = 6 V\",open?\"zanjir uzilgan\":\"zanjir yopiq\"]])}\n[A,B,U].forEach(e=>e&&(e.oninput=u));if(o.brk)$(\"#x\"+p).onclick=function(){open=!open;this.textContent=open?\"R₂ ni ulash\":\"R₂ ni uzish (lampa kuyganday)\";u()};u()}\nSer(1,{brk:1});Ser(2,{U:1,v:1});\nProb(\"#pr\",()=>{const R1=pk([5,10,15,20]),R2=pk([5,10,25,30]),I=pk([.2,.4,.5,1]),R=R1+R2,U=I*R;return{t:`R₁ = ${R1} Ω va R₂ = ${R2} Ω rezistorlar ketma-ket ulangan, zanjirda I = ${f(I,1)} A tok bor.`,a:[{l:\"R\",u:\"Ω\",v:R},{l:\"U\",u:\"V\",v:U},{l:\"U₁\",u:\"V\",v:I*R1}],s:`R = ${R1}+${R2} = ${R} Ω; U = I·R = ${f(U,1)} V; U₁ = I·R₁ = ${f(I*R1,1)} V.`}});\nQuiz(\"#qz\",[{q:\"Ketma-ket ulanishda tok kuchi?\",o:[\"hamma joyda bir xil\",\"katta qarshilikda katta\",\"tarmoqlanadi\",\"nolga teng\"],a:0},{q:\"Umumiy qarshilik?\",o:[\"R₁·R₂\",\"R₁ + R₂\",\"R₁ − R₂\",\"R₁ / R₂\"],a:1},{q:\"Umumiy kuchlanish?\",o:[\"U₁ = U₂\",\"U₁ + U₂\",\"U₁ − U₂\",\"U₁·U₂\"],a:1},{q:\"R₁ = 10 Ω, R₂ = 20 Ω, U = 12 V. I = ?\",o:[\"0,4 A\",\"0,6 A\",\"2,4 A\",\"3 A\"],a:0},{q:\"Bitta iste’molchi uzilsa, ketma-ket zanjirda:\",o:[\"qolganlari yonadi\",\"hammasi o‘chadi\",\"tok ortadi\",\"kuchlanish nolga teng\"],a:1}]);\n<\/script><\/main><\/body><\/html>"}, {"t": "22-§ Iste’molchilarni parallel ulash", "h": "<!DOCTYPE html><html lang=\"uz\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><title>Iste’molchilarni parallel ulash<\/title><style>:root{--bg:#fff;--fg:#1c1e21;--mu:#5f6673;--card:#f1f3f6;--c1:#fbe99a;--c2:#fff0a0;--c3:#c9f2d3;--bd:#d3d8df;--ac:#2f5fe0;--ok:#15803d;--bad:#c62828;--wire:#222;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#15171b;--fg:#e8eaee;--mu:#9aa3b2;--card:#1f2329;--c1:#6b5a14;--c2:#6b5f1c;--c3:#1f5a33;--bd:#38404c;--ac:#7ea1ff;--ok:#4ade80;--bad:#ff8a80;--wire:#d6dbe3;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#15171b;--fg:#e8eaee;--mu:#9aa3b2;--card:#1f2329;--c1:#6b5a14;--c2:#6b5f1c;--c3:#1f5a33;--bd:#38404c;--ac:#7ea1ff;--ok:#4ade80;--bad:#ff8a80;--wire:#d6dbe3;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nmain{max-width:760px;margin:0 auto;padding:16px}\nh1{font-size:25px;line-height:1.25;margin:.4em 0}h2{color:var(--ac);font-size:20px;line-height:1.3;margin:1.6em 0 .3em}\n.sub{color:var(--mu)}.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin:12px 0}\n.badge{display:inline-block;background:var(--ac);color:var(--bg);border-radius:10px;padding:1px 10px;font-size:14px;margin-left:6px;white-space:nowrap}\n.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid var(--bd);padding:7px 9px;text-align:left}\n.btn{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:9px 14px;margin:4px 4px 4px 0;cursor:pointer}\n.btn.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}\ninput[type=range]{width:100%}svg{width:100%;height:auto;display:block}\n.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:10px 0}\n.out div{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center}\n.out b{display:block;color:var(--ac);font-size:19px}.out small{color:var(--mu)}\ndetails{margin:10px 0}summary{font-weight:700;cursor:pointer}.ok{color:var(--ok)}.bad{color:var(--bad)}\n.q{margin:12px 0}.q label{display:block;padding:4px 0}\ntextarea,input[type=text]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;width:100%;box-sizing:border-box}\n.bar{display:flex;height:28px;border-radius:8px;overflow:hidden;margin:6px 0;font-size:13px;color:#fff}.bar i{display:block;text-align:center;line-height:28px;font-style:normal;overflow:hidden}\n.warn{border-left:4px solid var(--bad);padding-left:10px}\n<\/style><\/head><body><main>\n<h1>Iste’molchilarni parallel ulash<\/h1><p class=sub>Fizika, 8-sinf · II bob «Elektr toki» · 22-§ · 45 daqiqa · dars ishlanma + interaktiv simulyatsiyalar<\/p><p><b>Mavzu:<\/b> Iste’molchilarni parallel ulash<\/p>\n<div class=box><p><b>Jihozlar:<\/b> proyektor yoki planshet, 2–3 ta lampochka, manba, kalit, ampermetr, voltmetr, simlar, daftar.<\/p><ul><li><b>Ta’limiy:<\/b> parallel ulanishda U = U₁ = U₂, I = I₁ + I₂, 1/R = 1/R₁ + 1/R₂ qonuniyatlarini bilish.<\/li><li><b>Rivojlantiruvchi:<\/b> ketma-ket va parallel ulanishni taqqoslash, mantiqiy fikrlash.<\/li><li><b>Tarbiyaviy:<\/b> uyda elektr tarmog‘idan xavfsiz foydalanish madaniyatini shakllantirish.<\/li><\/ul><p><b>Kutilayotgan natija:<\/b> o‘quvchi parallel ulanish sxemasini chizadi, formulalarni qo‘llab masala yechadi va ikki ulanishni taqqoslaydi.<\/p><\/div>\n<h2>Dars bosqichlari<\/h2><div class=tw><table><tr><th>№<\/th><th>Bosqich<\/th><th>Vaqt<\/th><\/tr><tr><td>1<\/td><td>Tashkiliy qism<\/td><td>2 daq<\/td><\/tr><tr><td>2<\/td><td>Takrorlash<\/td><td>6 daq<\/td><\/tr><tr><td>3<\/td><td>1-reja: Sxema va kuchlanish<\/td><td>9 daq<\/td><\/tr><tr><td>4<\/td><td>2-reja: Tok kuchlari va qarshilik<\/td><td>12 daq<\/td><\/tr><tr><td>5<\/td><td>3-reja: Masala va taqqoslash<\/td><td>8 daq<\/td><\/tr><tr><td>6<\/td><td>Mustahkamlash testi<\/td><td>5 daq<\/td><\/tr><tr><td>7<\/td><td>Yakun, baholash, uyga vazifa<\/td><td>3 daq<\/td><\/tr><\/table><\/div><h2>Tashkiliy qism <span class=badge>2 daq<\/span><\/h2><p>Salomlashish, davomat, dars maqsadini e’lon qilish.<\/p><h2>Takrorlash <span class=badge>6 daq<\/span><\/h2><p>Ketma-ket ulanish qonuniyatlari bo‘yicha tezkor so‘rov: I, U, R. Ketma-ket ulanish sxemasini doskada chizish.<\/p><p><b>Motivatsiya:<\/b> Uyda bitta lampochka o‘chsa, qolganlari nega yonib turadi? Rozetkalar qanday ulangan?<\/p><h2>1-reja. Parallel ulanish sxemasi va kuchlanish <span class=badge>9 daq<\/span><\/h2><p><b>Maqsad:<\/b> parallel ulanish sxemasi va U = U₁ = U₂ ni tushunish.<\/p><p><b>Vaqt:<\/b> tushuntirish 4 · 1-simulyatsiya 3 · savol-topshiriq 2 daqiqa.<\/p><div class=box><b>1-simulyatsiya: tarmoqlarni uzib ko‘ring (manba 6 V)<\/b><svg id=s1 viewBox=\"0 0 340 200\"><\/svg><p id=t1><\/p><label>R₁: <input type=range id=a1 min=3 max=30 step=1 value=6><\/label><label>R₂: <input type=range id=b1 min=3 max=30 step=1 value=3><\/label><button class=btn id=x10>1-tarmoqni uzish<\/button><button class=btn id=x11>2-tarmoqni uzish<\/button><div class=out id=o1><\/div><p class=sub>Bitta tarmoq uzilsa, ikkinchisi ishlashda davom etadi — uydagi elektr tarmog‘i shunday.<\/p><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Sxemani chizadi, tarmoqlanish nuqtalarini (tugun) ko‘rsatadi.<\/li><li>Animatsiya: tok tugunda ikkiga bo‘linadi (daryoning tarmoqlanishi).<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> sxemani chizadi, tarmoqlardan birini uzib natijani kuzatadi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Tarmoqlardagi kuchlanish qanday? (bir xil)<\/li><li>Bitta tarmoq uzilsa, ikkinchisida nima bo‘ladi? (tok davom etadi)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> Sxemani xatosiz chizadi, tushuntiradi.<\/li><li><b>4:<\/b> 1 ta kichik xato.<\/li><li><b>3:<\/b> Yordam bilan.<\/li><li><b>2:<\/b> Chiza olmaydi.<\/li><\/ul><\/details><h2>2-reja. Tok kuchlari va umumiy qarshilik <span class=badge>12 daq<\/span><\/h2><p><b>Maqsad:<\/b> I = I₁ + I₂ va 1/R = 1/R₁ + 1/R₂ ni tekshirish.<\/p><p><b>Vaqt:<\/b> tushuntirish 4 · 2-simulyatsiya 6 · tekshirish 2 daqiqa.<\/p><div class=box><b>2-simulyatsiya: tok kuchlari<\/b><svg id=s2 viewBox=\"0 0 340 200\"><\/svg><p id=t2><\/p><label>Manba kuchlanishi: <input type=range id=u2 min=3 max=24 step=1 value=12><\/label><label>R₁: <input type=range id=a2 min=3 max=30 step=1 value=6><\/label><label>R₂: <input type=range id=b2 min=3 max=30 step=1 value=3><\/label><div class=out id=o2><\/div><p class=sub>Umumiy qarshilik har bir tarmoq qarshiligidan kichik. Ikki bir xil rezistor uchun R = R₁ / 2.<\/p><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Om qonuni: I₁ = U/R₁, I₂ = U/R₂, I = I₁ + I₂ → 1/R = 1/R₁ + 1/R₂.<\/li><li>Namuna: R₁ = 6 Ω, R₂ = 3 Ω, U = 12 V → R = 2 Ω; I₁ = 2 A; I₂ = 4 A; I = 6 A.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> qarshiliklarni o‘zgartirib, tok kuchlari yig‘indisini tekshiradi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Umumiy qarshilik nega kichik? (tok o‘tadigan yo‘llar ko‘paydi)<\/li><li>Qaysi tarmoqda tok katta? (qarshiligi kichigida)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> Munosabatlarni tajribada tasdiqlaydi.<\/li><li><b>4:<\/b> 1 ta kichik xato.<\/li><li><b>3:<\/b> Yordam bilan.<\/li><li><b>2:<\/b> Tekshira olmaydi.<\/li><\/ul><\/details><h2>3-reja. Masala yechish va taqqoslash <span class=badge>8 daq<\/span><\/h2><p><b>Maqsad:<\/b> parallel ulanish formulalarini qo‘llash, ketma-ket ulanish bilan taqqoslash.<\/p><p><b>Vaqt:<\/b> masala 5 · taqqoslash jadvali 3 daqiqa.<\/p><div class=box><b>3-simulyatsiya: masala<\/b><div id=pr><\/div><div class=tw><table><tr><th>Kattalik<\/th><th>Ketma-ket<\/th><th>Parallel<\/th><\/tr><tr><td>Tok kuchi<\/td><td>I = I₁ = I₂<\/td><td>I = I₁ + I₂<\/td><\/tr><tr><td>Kuchlanish<\/td><td>U = U₁ + U₂<\/td><td>U = U₁ = U₂<\/td><\/tr><tr><td>Qarshilik<\/td><td>R = R₁ + R₂<\/td><td>1/R = 1/R₁ + 1/R₂<\/td><\/tr><tr><td>Bittasi uzilsa<\/td><td>hammasi o‘chadi<\/td><td>qolgani ishlaydi<\/td><\/tr><\/table><\/div><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Namunaviy masalani yechadi, taqqoslash jadvalini birga to‘ldiradi.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> masalani yechadi, jadvalni daftarga ko‘chiradi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Qachon parallel ulanish qulay? (maishiy asboblar uchun)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> Masala va jadval to‘liq.<\/li><li><b>4:<\/b> Kichik xato.<\/li><li><b>3:<\/b> Yordam bilan.<\/li><li><b>2:<\/b> Bajara olmaydi.<\/li><\/ul><\/details><h2>Mustahkamlash testi <span class=badge>5 daq<\/span><\/h2><div class=box id=qz><\/div><h2>Yakun va uyga vazifa <span class=badge>3 daq<\/span><\/h2><p><b>Refleksiya:<\/b> «Bugun nimani bildim?»<\/p><ol><li>22-§ ni o‘qing.<\/li><li><b>Masala:<\/b> R₁ = 20 Ω, R₂ = 5 Ω parallel, U = 12 V. R, I₁, I₂, I ni toping. (4 Ω; 0,6 A; 2,4 A; 3 A)<\/li><li><b>Ijodiy:<\/b> uyingizdagi 3 ta asbobning ulanishini aniqlang.<\/li><\/ol>\n<script>\nconst $=s=>document.querySelector(s),NS=\"http://www.w3.org/2000/svg\",pk=a=>a[Math.floor(Math.random()*a.length)];\nconst f=(x,d=2)=>(+x).toFixed(d).replace(\".\",\",\"),rd=(x,s)=>Math.round(x/s)*s,spd=I=>I>0?Math.min(25+I*90,240):0;\nfunction S(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}\nfunction box(p,x,y,w,h,t,fill){S(\"rect\",{x,y,width:w,height:h,rx:6,fill:fill||\"var(--card)\",s »`+(w.length?`. Qayta ko‘ring: ${w.join(\", \")}-savol.`:` <span class=ok>Barakalla!<\/span>`)}}\nfunction Prob(id,gen){const r=$(id),k=id.slice(1);let c;function nw(){c=gen();r.innerHTML=`<p><b>${c.t}<\/b><\/p>`+c.a.map((a,i)=>`<label>${a.l} = <input type=text inputmode=decimal id=\"${k}${i}\" style=\"width:110px;display:inline-block\"> ${a.u}<\/label><br>`).join(\"\")+`<button class=btn id=${k}c>Tekshirish<\/button><button class=btn id=${k}n>Yangi masala<\/button><p class=res><\/p>`;\n$(\"#\"+k+\"c\").onclick=()=>{let ok=0;c.a.forEach((a,i)=>{const v=parseFloat($(\"#\"+k+i).value.replace(\",\",\".\"));if(Math.abs(v-a.v)<=Math.max(.02*Math.abs(a.v),.011))ok++});r.querySelector(\".res\").innerHTML=ok==c.a.length?`<span class=ok>To‘g‘ri! Baho: 5<\/span>`:`<span class=bad>${ok}/${c.a.length} to‘g‘ri.<\/span> Yechim: ${c.s}`};$(\"#\"+k+\"n\").onclick=nw}nw()}\nfunction Out(id,arr){$(id).innerHTML=arr.map(a=>`<div><b>${a[1]}<\/b><small>${a[0]}<\/small><\/div>`).join(\"\")}\n\nfunction ParCirc(svg){wire(svg,[[30,30],[280,30],[280,170],[30,170]]);S(\"line\",{x1:155,y1:30,x2:155,y2:170,stroke:\"var(--wire)\",\"stroke-width\":2},svg);\nconst bt=box(svg,10,80,40,40,\"6 V\",\"var(--c1)\"),t1=box(svg,120,86,70,28,\"\",\"var(--c2)\"),t2=box(svg,245,86,70,28,\"\",\"var(--c2)\"),x1=S(\"text\",{x:155,y:145,\"text-anchor\":\"middle\",\"font-size\":13,fill:\"var(--bad)\"},svg),x2=S(\"text\",{x:280,y:145,\"text-anchor\":\"middle\",\"font-size\":13,fill:\"var(--bad)\"},svg);\nconst am=circ(svg,80,30,\"\"),a1=circ(svg,155,58,\"\"),a2=circ(svg,280,58,\"\");S(\"text\",{x:30,y:195,\"font-size\":11,fill:\"var(--mu)\"},svg).textContent=\"A — umumiy tok, A₁, A₂ — tarmoqlardagi toklar\";\nconst l1=Loop(svg,[[30,30],[155,30],[155,170],[30,170]],16),l2=Loop(svg,[[30,30],[280,30],[280,170],[30,170]],26);\nreturn{upd(R1,R2,I1,I2,o1,o2,U){t1.textContent=\"R₁ = \"+R1+\" Ω\";t2.textContent=\"R₂ = \"+R2+\" Ω\";bt.textContent=U+\" V\";am.textContent=f(I1+I2);a1.textContent=f(I1);a2.textContent=f(I2);x1.textContent=o1?\"✕ uzilgan\":\"\";x2.textContent=o2?\"✕ uzilgan\":\"\";l1.v=spd(I1);l1.on=I1>0;l2.v=spd(I2);l2.on=I2>0}}}\n\nfunction Par(p,o){const svg=$(\"#s\"+p),c=ParCirc(svg);const o1=[0,0];const A=$(\"#a\"+p),B=$(\"#b\"+p),U=o.U?$(\"#u\"+p):null;\nfunction u(){const R1=+A.value,R2=+B.value,V=U?+U.value:6,I1=o1[0]?0:V/R1,I2=o1[1]?0:V/R2,I=I1+I2,R=I>0?V/I:0;c.upd(R1,R2,I1,I2,o1[0],o1[1],V);\n$(\"#t\"+p).innerHTML=`R₁ = <b>${R1} Ω<\/b>, R₂ = <b>${R2} Ω<\/b>`+(U?`, U = <b>${V} V<\/b>`:\"\");\nif(o.v)Out(\"#o\"+p,[[\"I₁ = U/R₁\",f(I1)+\" A\"],[\"I₂ = U/R₂\",f(I2)+\" A\"],[\"I₁ + I₂\",f(I)+\" A\"],[\"R = U/I\",f(R)+\" Ω\"],[\"1/R₁ + 1/R₂\",f(1/R1+1/R2,3)+\" 1/Ω\"],[\"1/R\",R>0&&!o1[0]&&!o1[1]?f(1/R,3)+\" 1/Ω\":\"—\"]]);\nelse Out(\"#o\"+p,[[\"U₁ (1-tarmoq)\",o1[0]?\"0 V\":V+\" V\"],[\"U₂ (2-tarmoq)\",o1[1]?\"0 V\":V+\" V\"],[\"umumiy I\",f(I)+\" A\"]])}\n[A,B,U].forEach(e=>e&&(e.oninput=u));if(o.brk)[0,1].forEach(i=>$(\"#x\"+p+i).onclick=function(){o1[i]=!o1[i];this.textContent=(o1[i]?\"\":\"\")+(i+1)+\"-tarmoqni \"+(o1[i]?\"ulash\":\"uzish\");u()});u()}\nPar(1,{brk:1});Par(2,{U:1,v:1});\nProb(\"#pr\",()=>{const p=pk([[6,3,2],[10,10,5],[20,5,4],[12,4,3],[30,30,15],[15,10,6]]),U=pk([6,12,24]);return{t:`R₁ = ${p[0]} Ω va R₂ = ${p[1]} Ω parallel ulangan, U = ${U} V.`,a:[{l:\"I₁\",u:\"A\",v:U/p[0]},{l:\"I₂\",u:\"A\",v:U/p[1]},{l:\"I\",u:\"A\",v:U/p[0]+U/p[1]},{l:\"R\",u:\"Ω\",v:p[2]}],s:`I₁ = U/R₁, I₂ = U/R₂, I = I₁+I₂ = ${f(U/p[0]+U/p[1])} A, R = U/I = ${p[2]} Ω.`}});\nQuiz(\"#qz\",[{q:\"Parallel ulanishda kuchlanish?\",o:[\"tarmoqlarda bir xil\",\"qo‘shiladi\",\"nolga teng\",\"kamayadi\"],a:0},{q:\"Umumiy tok?\",o:[\"I₁ = I₂\",\"I₁ + I₂\",\"I₁ − I₂\",\"I₁·I₂\"],a:1},{q:\"Ikki 10 Ω rezistor parallel. R = ?\",o:[\"20 Ω\",\"10 Ω\",\"5 Ω\",\"2 Ω\"],a:2},{q:\"Bitta tarmoq uzilsa, ikkinchisi?\",o:[\"o‘chadi\",\"ishlaydi\",\"tok ortadi 2 marta\",\"portlaydi\"],a:1},{q:\"Uydagi lampalar qanday ulangan?\",o:[\"ketma-ket\",\"parallel\",\"aralash emas\",\"ulanmagan\"],a:1}]);\n<\/script><\/main><\/body><\/html>"}, {"t": "23-§ Tok manbalarini ulash", "h": "<!DOCTYPE html><html lang=\"uz\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><title>Amaliy mashg‘ulot. Tok manbalarini ulash<\/title><style>:root{--bg:#fff;--fg:#1c1e21;--mu:#5f6673;--card:#f1f3f6;--c1:#fbe99a;--c2:#fff0a0;--c3:#c9f2d3;--bd:#d3d8df;--ac:#2f5fe0;--ok:#15803d;--bad:#c62828;--wire:#222;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#15171b;--fg:#e8eaee;--mu:#9aa3b2;--card:#1f2329;--c1:#6b5a14;--c2:#6b5f1c;--c3:#1f5a33;--bd:#38404c;--ac:#7ea1ff;--ok:#4ade80;--bad:#ff8a80;--wire:#d6dbe3;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#15171b;--fg:#e8eaee;--mu:#9aa3b2;--card:#1f2329;--c1:#6b5a14;--c2:#6b5f1c;--c3:#1f5a33;--bd:#38404c;--ac:#7ea1ff;--ok:#4ade80;--bad:#ff8a80;--wire:#d6dbe3;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nmain{max-width:760px;margin:0 auto;padding:16px}\nh1{font-size:25px;line-height:1.25;margin:.4em 0}h2{color:var(--ac);font-size:20px;line-height:1.3;margin:1.6em 0 .3em}\n.sub{color:var(--mu)}.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin:12px 0}\n.badge{display:inline-block;background:var(--ac);color:var(--bg);border-radius:10px;padding:1px 10px;font-size:14px;margin-left:6px;white-space:nowrap}\n.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid var(--bd);padding:7px 9px;text-align:left}\n.btn{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:9px 14px;margin:4px 4px 4px 0;cursor:pointer}\n.btn.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}\ninput[type=range]{width:100%}svg{width:100%;height:auto;display:block}\n.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:10px 0}\n.out div{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center}\n.out b{display:block;color:var(--ac);font-size:19px}.out small{color:var(--mu)}\ndetails{margin:10px 0}summary{font-weight:700;cursor:pointer}.ok{color:var(--ok)}.bad{color:var(--bad)}\n.q{margin:12px 0}.q label{display:block;padding:4px 0}\ntextarea,input[type=text]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;width:100%;box-sizing:border-box}\n.bar{display:flex;height:28px;border-radius:8px;overflow:hidden;margin:6px 0;font-size:13px;color:#fff}.bar i{display:block;text-align:center;line-height:28px;font-style:normal;overflow:hidden}\n.warn{border-left:4px solid var(--bad);padding-left:10px}\n<\/style><\/head><body><main>\n<h1>Amaliy mashg‘ulot. Tok manbalarini ulash<\/h1><p class=sub>Fizika, 8-sinf · II bob «Elektr toki» · 23-§ · 45 daqiqa · dars ishlanma + interaktiv simulyatsiyalar<\/p><p><b>Mavzu:<\/b> Amaliy mashg‘ulot. Tok manbalarini ulash<\/p>\n<div class=box><p><b>Jihozlar:<\/b> proyektor yoki planshet, 2–3 ta bir xil galvanik element (1,5 V), voltmetr, lampochka, kalit, simlar.<\/p><ul><li><b>Ta’limiy:<\/b> galvanik elementlarni ketma-ket va parallel ulash usullari va natijalarini bilish.<\/li><li><b>Rivojlantiruvchi:<\/b> tajriba o‘tkazish, o‘lchash, xulosa chiqarish.<\/li><li><b>Tarbiyaviy:<\/b> qutblarni to‘g‘ri ulash, ehtiyotkorlik, qisqa tutashuvdan saqlanish.<\/li><\/ul><p><b>Kutilayotgan natija:<\/b> o‘quvchi elementlarni ulash usullarini ajratadi, kuchlanishni topadi va vaziyatga mos ulashni tanlaydi.<\/p><\/div>\n<h2>Dars bosqichlari<\/h2><div class=tw><table><tr><th>№<\/th><th>Bosqich<\/th><th>Vaqt<\/th><\/tr><tr><td>1<\/td><td>Tashkiliy qism<\/td><td>2 daq<\/td><\/tr><tr><td>2<\/td><td>Takrorlash<\/td><td>5 daq<\/td><\/tr><tr><td>3<\/td><td>1-reja: Ulash usullari<\/td><td>9 daq<\/td><\/tr><tr><td>4<\/td><td>2-reja: Amaliy topshiriqlar<\/td><td>12 daq<\/td><\/tr><tr><td>5<\/td><td>3-reja: Jadval va xulosa<\/td><td>9 daq<\/td><\/tr><tr><td>6<\/td><td>Mustahkamlash testi<\/td><td>5 daq<\/td><\/tr><tr><td>7<\/td><td>Yakun, baholash, uyga vazifa<\/td><td>3 daq<\/td><\/tr><\/table><\/div><h2>Tashkiliy qism <span class=badge>2 daq<\/span><\/h2><p>Salomlashish, davomat, xavfsizlik qoidalari (qisqa tutashuvdan saqlanish), guruhlarga bo‘lish.<\/p><h2>Takrorlash <span class=badge>5 daq<\/span><\/h2><p><b>Savollar:<\/b> Tok manbai nima? EYuK nima? Elektr zanjiri qanday qismlardan iborat? Sxemada galvanik element belgisini chizing.<\/p><p><b>Motivatsiya:<\/b> Pultda 2–3 ta batareya bor. Ularni qanday joylashtirish kerak va nima uchun qutblarga e’tibor beramiz?<\/p><h2>1-reja. Elementlarni ulash usullari <span class=badge>9 daq<\/span><\/h2><p><b>Maqsad:<\/b> tok manbalarini ketma-ket va parallel ulash natijalarini bilish.<\/p><p><b>Vaqt:<\/b> tushuntirish 4 · 1-simulyatsiya 3 · savol-topshiriq 2 daqiqa.<\/p><div class=box><b>1-simulyatsiya: batareyalarni ulang (lampochka 3 V ga mo‘ljallangan)<\/b><svg id=s1 viewBox=\"0 0 340 200\"><\/svg><label>Elementlar soni (har biri 1,5 V): <input type=range id=n1 min=1 max=4 step=1 value=2><\/label><button class=\"btn on\" id=m0>Ketma-ket<\/button><button class=btn id=m1>Parallel<\/button><button class=btn id=rv>Bittasini teskari qo‘yish<\/button><div class=out id=o1><\/div><p id=w1><\/p><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Ketma-ket: ℰ = ℰ₁ + ℰ₂ (+ → −). Parallel (bir xil elementlar): ℰ bitta element kabi, ammo ish muddati ortadi.<\/li><li>Animatsiya: ikkita nasos ketma-ket (bosim ikki baravar) va yonma-yon (bosim o‘sha, ammo uzoqroq ishlaydi).<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> simulyatsiyada ulash turini va elementlar sonini o‘zgartirib, voltmetr ko‘rsatishini yozadi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Ketma-ket ulangan 3 ta 1,5 V element beradigan kuchlanish? (4,5 V)<\/li><li>Parallel ulashning afzalligi? (uzoqroq ishlaydi)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> Ikkala usulni to‘liq tushuntiradi.<\/li><li><b>4:<\/b> 1 ta kichik xato.<\/li><li><b>3:<\/b> Yordam bilan.<\/li><li><b>2:<\/b> Tushuntira olmaydi.<\/li><\/ul><\/details><h2>2-reja. Amaliy topshiriqlar: to‘g‘ri ulanishni tanlang <span class=badge>12 daq<\/span><\/h2><p><b>Maqsad:<\/b> vaziyatga qarab manbalarni to‘g‘ri ulash.<\/p><p><b>Vaqt:<\/b> vazifani o‘qish 2 · tanlash va muhokama 8 · xulosa 2 daqiqa.<\/p><div class=box><b>2-simulyatsiya: vazifalar<\/b><div id=tk><\/div><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Guruhlarga turli vazifa beradi, javoblarni muhokama qildiradi.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> vazifani o‘qiydi, ulash usulini tanlaydi, natijani asoslaydi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Nega teskari ulangan element kuchlanishni kamaytiradi? (ℰ qarama-qarshi ishora bilan qo‘shiladi)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> Barcha vazifani to‘g‘ri hal qiladi va asoslaydi.<\/li><li><b>4:<\/b> 1 ta kichik xato.<\/li><li><b>3:<\/b> Yordam bilan.<\/li><li><b>2:<\/b> Bajara olmaydi.<\/li><\/ul><\/details><h2>3-reja. Natijalar jadvali va xulosa <span class=badge>9 daq<\/span><\/h2><p><b>Maqsad:<\/b> o‘lchash natijalarini jadvalga yozish va xulosa chiqarish.<\/p><p><b>Vaqt:<\/b> o‘lchash/namuna 4 · jadval 3 · xulosa 2 daqiqa.<\/p><div class=box><b>3-simulyatsiya: jadval<\/b><button class=btn id=ns>Namuna ma’lumot<\/button><button class=btn id=cl>Tozalash<\/button><div class=tw><table id=tb><\/table><\/div><details><summary>Namunaviy xulosa<\/summary><p>Ketma-ket ulashda kuchlanish elementlar EYuK lari yig‘indisiga teng. Parallel ulashda kuchlanish bitta elementnikiga teng, lekin ish muddati ortadi. Teskari ulangan element kuchlanishni kamaytiradi.<\/p><\/details><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Real tajriba: 2 ta element bilan voltmetr yordamida o‘lchash (agar jihoz bo‘lsa).<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> jadvalni to‘ldiradi, xulosani daftarga yozadi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Natijalar nazariyaga mosmi? Xatolik sabablari?<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> Jadval va xulosa to‘liq.<\/li><li><b>4:<\/b> Kichik xato.<\/li><li><b>3:<\/b> Yordam bilan.<\/li><li><b>2:<\/b> Hisobot yo‘q.<\/li><\/ul><\/details><h2>Mustahkamlash testi <span class=badge>5 daq<\/span><\/h2><div class=box id=qz><\/div><h2>Yakun va uyga vazifa <span class=badge>3 daq<\/span><\/h2><p><b>Refleksiya:<\/b> «Bugun nimani bildim?»<\/p><ol><li>23-§ ni o‘qing.<\/li><li><b>Masala:<\/b> 1,5 V li 4 ta element ketma-ket ulangan. U = ? (6 V)<\/li><li><b>Ijodiy:<\/b> fonarik yoki pultdagi batareyalar qanday ulanganini tushuntiring.<\/li><\/ol>\n<script>\nconst $=s=>document.querySelector(s),NS=\"http://www.w3.org/2000/svg\",pk=a=>a[Math.floor(Math.random()*a.length)];\nconst f=(x,d=2)=>(+x).toFixed(d).replace(\".\",\",\"),rd=(x,s)=>Math.round(x/s)*s,spd=I=>I>0?Math.min(25+I*90,240):0;\nfunction S(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}\nfunction box(p,x,y,w,h,t,fill){S(\"rect\",{x,y,width:w,height:h,rx:6,fill:fill||\"var(--card)\",stroke:\"var(--wire)\",\"stroke-width\":2},p);const e=S(\"text\",{x:x+w/2,y:y+h/2+4,\"text-anchor\":\"middle\",\"font-size\":12,fill:\"var(--fg)\"},p);e.textContent=t;return e}\nfunction circ(p,x,y,t){S(\"circle\",{cx:x,cy:y,r:13,fill:\"var(--c3)\",stroke:\"var(--wire)\",\"stroke-width\":2},p);const e=S(\"text\",{x,y:y+3.5,\"text-anchor\":\"middle\",\"font-size\":9,fill:\"var(--fg)\"},p);e.t \"Lampochka normal yonadi ✓\";\ngl.setAttribute(\"opacity\",Math.min(U/3,1)*.9+.1);lp.v=spd(U/3);lp.on=U>.05;\nOut(\"#o1\",[[\"voltmetr (U)\",f(U,1)+\" V\"],[\"ish davomiyligi\",(mode?n:1)+\" × (nisbiy)\"],[\"ulanish\",mode?\"parallel\":\"ketma-ket\"]]);$(\"#w1\").className=cls;$(\"#w1\").textContent=msg}\nN.oninput=u;[0,1].forEach(i=>$(\"#m\"+i).onclick=()=>{mode=i;$(\"#m0\").className=\"btn\"+(i?\"\":\" on\");$(\"#m1\").className=\"btn\"+(i?\" on\":\"\");u()});$(\"#rv\").onclick=function(){rev=!rev;this.classList.toggle(\"on\");u()};u()})();\nconst T=[{q:\"Lampochka 3 V ga mo‘ljallangan. 1,5 V li 2 ta element bor. Qanday ulaysiz?\",o:[\"Ketma-ket (+ → −)\",\"Parallel (+ → +, − → −)\",\"Ketma-ket, bittasi teskari\",\"Faqat bitta element\"],a:0,e:[\"✓ U = 1,5 + 1,5 = 3 V — lampochka to‘liq yonadi.\",\"✗ U = 1,5 V — lampochka xira yonadi.\",\"✗ U = 0 V — EYuK lar bir-birini yo‘qotadi.\",\"✗ U = 1,5 V — xira.\"]},\n{q:\"1,5 V li lampochka, 2 ta 1,5 V element. Lampochka uzoqroq yonishi kerak.\",o:[\"Ketma-ket\",\"Parallel\",\"Faqat bitta element\",\"Ketma-ket, bittasi teskari\"],a:1,e:[\"✗ U = 3 V — lampochka kuyib qolishi mumkin!\",\"✓ U = 1,5 V, tok ikki elementdan olinadi — ish muddati ~2 marta uzoq.\",\"✗ Yonadi, lekin muddati 2 marta qisqa.\",\"✗ Yonmaydi.\"]},\n{q:\"Pult uchun 4,5 V kerak (1,5 V li elementlar). Qanday ulaysiz?\",o:[\"3 ta ketma-ket\",\"3 ta parallel\",\"2 ta ketma-ket\",\"4 ta ketma-ket\"],a:0,e:[\"✓ 3 × 1,5 = 4,5 V.\",\"✗ U = 1,5 V.\",\"✗ U = 3 V — yetmaydi.\",\"✗ U = 6 V — ortiqcha.\"]}];\n(function(){const r=$(\"#tk\");let i=0;function sh(){const t=T[i];r.innerHTML=`<p><b>Vazifa ${i+1}/${T.length}:<\/b> ${t.q}<\/p>`+t.o.map((o,j)=>`<button class=btn data-j=${j}>${o}<\/button>`).join(\"\")+`<p id=tv><\/p><button class=btn id=nx>Keyingi vazifa<\/button>`;r.querySelectorAll(\"[data-j]\").forEach(b=>b.onclick=()=>{const j=+b.dataset.j;$(\"#tv\").innerHTML=`<span class=${j==t.a?\"ok\":\"bad\"}>${t.e[j]}<\/span>`});$(\"#nx\").onclick=()=>{i=(i+1)%T.length;sh()}}sh()})();\nconst rows=[];function draw(){$(\"#tb\").innerHTML=\"<tr><th>№<\/th><th>Ulanish<\/th><th>U, V<\/th><th>Lampochka<\/th><\/tr>\"+rows.map((r,i)=>`<tr><td>${i+1}<\/td><td>${r[0]}<\/td><td>${f(r[1],2)}<\/td><td>${r[2]}<\/td><\/tr>`).join(\"\")}\n$(\"#ns\").onclick=()=>{rows.length=0;[[\"1 ta element\",1.5,\"xira\"],[\"2 ta ketma-ket\",3,\"normal\"],[\"2 ta parallel\",1.5,\"xira (uzoq yonadi)\"],[\"3 ta ketma-ket\",4.5,\"kuyish xavfi\"],[\"2 ta, biri teskari\",0,\"yonmaydi\"]].forEach(a=>rows.push([a[0],a[1]+(Math.random()-.5)*.08*(a[1]>0),a[2]]));draw()};$(\"#cl\").onclick=()=>{rows.length=0;draw()};draw();\nQuiz(\"#qz\",[{q:\"Ketma-ket ulangan 2 ta 1,5 V elementning kuchlanishi?\",o:[\"1,5 V\",\"3 V\",\"0 V\",\"0,75 V\"],a:1},{q:\"Parallel ulangan 2 ta 1,5 V element kuchlanishi?\",o:[\"3 V\",\"1,5 V\",\"0 V\",\"4,5 V\"],a:1},{q:\"Parallel ulashning afzalligi?\",o:[\"kuchlanish ortadi\",\"ish muddati ortadi\",\"tok to‘xtaydi\",\"qarshilik nolga teng\"],a:1},{q:\"Qutblar noto‘g‘ri (teskari) ulansa, ketma-ket zanjirda?\",o:[\"kuchlanish kamayadi\",\"kuchlanish ortadi\",\"o‘zgarmaydi\",\"tok kuchayadi\"],a:0},{q:\"1,5 V li 4 ta element ketma-ket. U = ?\",o:[\"1,5 V\",\"3 V\",\"6 V\",\"9 V\"],a:2}]);\n<\/script><\/main><\/body><\/html>"}, {"t": "24-§ Laboratoriya ishi: ketma-ket va parallel", "h": "<!DOCTYPE html><html lang=\"uz\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><title>Laboratoriya ishi. O‘tkazgichlarni ketma-ket va parallel ulashni o‘rganish<\/title><style>:root{--bg:#fff;--fg:#1c1e21;--mu:#5f6673;--card:#f1f3f6;--c1:#fbe99a;--c2:#fff0a0;--c3:#c9f2d3;--bd:#d3d8df;--ac:#2f5fe0;--ok:#15803d;--bad:#c62828;--wire:#222;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#15171b;--fg:#e8eaee;--mu:#9aa3b2;--card:#1f232 00%;box-sizing:border-box}\n.bar{display:flex;height:28px;border-radius:8px;overflow:hidden;margin:6px 0;font-size:13px;color:#fff}.bar i{display:block;text-align:center;line-height:28px;font-style:normal;overflow:hidden}\n.warn{border-left:4px solid var(--bad);padding-left:10px}\n<\/style><\/head><body><main>\n<h1>Laboratoriya ishi. O‘tkazgichlarni ketma-ket va parallel ulashni o‘rganish<\/h1><p class=sub>Fizika, 8-sinf · II bob «Elektr toki» · 24-§ · 45 daqiqa · dars ishlanma + interaktiv simulyatsiyalar<\/p><p><b>Mavzu:<\/b> Laboratoriya ishi. O‘tkazgichlarni ketma-ket va parallel ulashni o‘rganish<\/p>\n<div class=box><p><b>Jihozlar:<\/b> proyektor yoki planshet, tok manbai, kalit, 2 ta rezistor (R₁ ≈ 4 Ω, R₂ ≈ 6 Ω), ampermetr, voltmetr, simlar, daftar.<\/p><ul><li><b>Ta’limiy:<\/b> ketma-ket va parallel ulanish qonuniyatlarini tajribada tekshirish, asboblar bilan o‘lchash.<\/li><li><b>Rivojlantiruvchi:<\/b> hisoblash, o‘lchash natijalarini nazariya bilan taqqoslash, xatolikni baholash.<\/li><li><b>Tarbiyaviy:<\/b> mustaqil va jamoaviy ishlash, aniqlik.<\/li><\/ul><p><b>Kutilayotgan natija:<\/b> o‘quvchi ikkala ulanishda I, U, R ni o‘lchaydi, nazariy qiymat bilan taqqoslaydi, nisbiy xatolikni hisoblaydi va xulosa yozadi.<\/p><\/div>\n<h2>Dars bosqichlari<\/h2><div class=tw><table><tr><th>№<\/th><th>Bosqich<\/th><th>Vaqt<\/th><\/tr><tr><td>1<\/td><td>Tashkiliy qism<\/td><td>2 daq<\/td><\/tr><tr><td>2<\/td><td>Takrorlash va ishning maqsadi<\/td><td>4 daq<\/td><\/tr><tr><td>3<\/td><td>1-reja: Sxema va xavfsizlik<\/td><td>7 daq<\/td><\/tr><tr><td>4<\/td><td>2-reja: Ketma-ket ulanish<\/td><td>10 daq<\/td><\/tr><tr><td>5<\/td><td>3-reja: Parallel ulanish<\/td><td>10 daq<\/td><\/tr><tr><td>6<\/td><td>4-reja: Hisobot va xulosa<\/td><td>7 daq<\/td><\/tr><tr><td>7<\/td><td>Mini test<\/td><td>3 daq<\/td><\/tr><tr><td>8<\/td><td>Yakun, baholash, uyga vazifa<\/td><td>2 daq<\/td><\/tr><\/table><\/div><h2>Tashkiliy qism <span class=badge>2 daq<\/span><\/h2><p>Salomlashish, davomat, laboratoriya xavfsizlik qoidalari, jihozlarni tekshirish.<\/p><h2>Takrorlash va ishning maqsadi <span class=badge>4 daq<\/span><\/h2><p><b>Savollar:<\/b> Ketma-ket va parallel ulanishda I, U, R qanday topiladi?<\/p><div class=box><b>Ishning maqsadi:<\/b> o‘tkazgichlarni ketma-ket va parallel ulash qonuniyatlarini tajribada tekshirish. <b>Jihozlar:<\/b> manba, kalit, R₁ ≈ 4 Ω, R₂ ≈ 6 Ω, ampermetr, voltmetr, simlar.<\/div><h2>1-reja. Sxema, asboblarni ulash va xavfsizlik <span class=badge>7 daq<\/span><\/h2><p><b>Maqsad:<\/b> asboblarni to‘g‘ri ulash, xavfsizlik qoidalariga rioya qilish.<\/p><p><b>Vaqt:<\/b> tushuntirish 3 · 1-simulyatsiya 3 · savol 1 daqiqa.<\/p><div class=box><b>1-simulyatsiya: asboblarni ulang<\/b><p>Ampermetr: <button class=\"btn on\" data-a=0>ketma-ket<\/button><button class=btn data-a=1>parallel<\/button><\/p><p>Voltmetr: <button class=\"btn on\" data-v=0>parallel<\/button><button class=btn data-v=1>ketma-ket<\/button><\/p><p><button class=btn id=kk>Kalit: ochiq<\/button><\/p><div class=out id=o1><\/div><p id=w1><\/p><p><b>Xavfsizlik shartnomasi:<\/b><\/p><label><input type=checkbox> Zanjir yig‘ilganda kalit ochiq.<\/label><br><label><input type=checkbox> Ampermetrni ketma-ket, voltmetrni parallel ulayman.<\/label><br><label><input type=checkbox> Qutblar (+/−) va asbob chegarasiga rioya qilaman.<\/label><br><label><input type=checkbox> Zanjirni o‘qituvchi tekshirgach yoqaman.<\/label><br><label><input type=checkbox> Ish tugagach kalitni ochaman.<\/label><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Sxemani chizadi, ish tartibini tushuntiradi: sxema → yig‘ish → tekshirish → o‘lchash → jadval → xulosa.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> sxemani daftarga chizadi, noto‘g‘ri ulanish oqibatini ko‘radi, shartnomani belgilaydi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Ampermetr parallel ulansa nima bo‘ladi? (qisqa tutashuv)<\/li><li>Voltmetr ketma-ket ulansa-chi? (tok deyarli yo‘qoladi)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> Sxemani xatosiz chizadi, oqibatlarni tushuntiradi.<\/li><li><b>4:<\/b> 1 ta kichik xato.<\/li><li><b>3:<\/b> Yordam bilan.<\/li><li><b>2:<\/b> Chiza olmaydi.<\/li><\/ul><\/details><h2>2-reja. Ketma-ket ulanishni o‘rganish <span class=badge>10 daq<\/span><\/h2><p><b>Maqsad:<\/b> ketma-ket ulangan R₁ va R₂ uchun I, U, R ni o‘lchash va R = R₁ + R₂ ni tekshirish.<\/p><p><b>Vaqt:<\/b> yig‘ish 3 · o‘lchash 5 · tekshirish 2 daqiqa.<\/p><div class=box><b>2-simulyatsiya: ketma-ket ulanish<\/b><svg id=s1 viewBox=\"0 0 340 200\"><\/svg><p>Kuchlanish: <button class=\"btn on\" data-u=\"1\">1,5 V<\/button><button class=btn data-u=\"3\">3 V<\/button><button class=btn data-u=\"4.5\">4,5 V<\/button><\/p><button class=btn id=m1>📝 O‘lchovni yozish<\/button><button class=btn id=n1>Namuna<\/button><button class=btn id=c1>Tozalash<\/button><div class=out id=o1b><\/div><div class=tw><table id=tb1><\/table><\/div><p class=sub>Asboblar bo‘limlari: ampermetr 0,02 A, voltmetr 0,1 V.<\/p><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Guruhlarga jihoz tarqatadi, zanjirni tekshiradi.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> zanjirni yig‘adi, 3 xil kuchlanishda I va U ni o‘lchaydi, R = U/I ni hisoblaydi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>R o‘lchangan va R₁ + R₂ orasidagi farq qancha? (xatolik, %)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> 3 ta o‘lchov va hisob to‘liq.<\/li><li><b>4:<\/b> Kichik noaniqlik.<\/li><li><b>3:<\/b> Yordam bilan.<\/li><li><b>2:<\/b> O‘lchay olmaydi.<\/li><\/ul><\/details><h2>3-reja. Parallel ulanishni o‘rganish <span class=badge>10 daq<\/span><\/h2><p><b>Maqsad:<\/b> parallel ulangan R₁ va R₂ uchun I, U, R ni o‘lchash va 1/R = 1/R₁ + 1/R₂ ni tekshirish.<\/p><p><b>Vaqt:<\/b> yig‘ish 3 · o‘lchash 5 · tekshirish 2 daqiqa.<\/p><div class=box><b>3-simulyatsiya: parallel ulanish<\/b><svg id=s2 viewBox=\"0 0 340 200\"><\/svg><p>Kuchlanish: <button class=\"btn on\" data-w=\"1\">1,5 V<\/button><button class=btn data-w=\"3\">3 V<\/button><button class=btn data-w=\"4.5\">4,5 V<\/button><\/p><button class=btn id=m2>📝 O‘lchovni yozish<\/button><button class=btn id=n2>Namuna<\/button><button class=btn id=c2>Tozalash<\/button><div class=out id=o2b><\/div><div class=tw><table id=tb2><\/table><\/div><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Zanjirni yig‘ishda yordam beradi.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> umumiy tokni ampermetr bilan, kuchlanishni voltmetr bilan o‘lchaydi, R ni topadi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Umumiy qarshilik R₁ va R₂ dan kichikmi? (ha)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> Hisob va o‘lchovlar to‘liq.<\/li><li><b>4:<\/b> Kichik xato.<\/li><li><b>3:<\/b> Yordam bilan.<\/li><li><b>2:<\/b> Bajara olmaydi.<\/li><\/ul><\/details><h2>4-reja. Hisobot, xatolik va xulosa <span class=badge>7 daq<\/span><\/h2><p><b>Maqsad:<\/b> natijalarni taqqoslash va nisbiy xatolikni hisoblash.<\/p><p><b>Vaqt:<\/b> hisoblash 3 · xulosa 4 daqiqa.<\/p><div class=box><b>4-simulyatsiya: hisobot<\/b><button class=btn id=hs>Hisobotni shakllantirish<\/button><div id=hr><\/div><p class=sub>Nisbiy xatolik: ε = |R<sub>o‘lch<\/sub> − R<sub>nazariy<\/sub>| / R<sub>nazariy<\/sub> · 100 %<\/p><\/div><details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary><p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Xatolik formulasini tushuntiradi, xulosa yozishni nazorat qiladi.<\/li><\/ul><p><b>O‘quvchi faoliyati:<\/b> o‘rtacha R ni topadi, ε ni hisoblaydi, xulosa yozadi.<\/p><p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Xatolik sabablari? (asbob aniqligi, yaxlitlash, sim qarshiligi)<\/li><\/ol><p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> To‘liq hisobot, xulosa.<\/li><li><b>4:<\/b> Kichik xato.<\/li><li><b>3:<\/b> Yordam bilan.<\/li><li><b>2:<\/b> Hisobot yo‘q.<\/li><\/ul><\/details><h2>Mini test <span class=badge>3 daq<\/span><\/h2><div class=box id=qz><\/div><h2>Yakun va uyga vazifa <span class=badge>2 daq<\/span><\/h2><p><b>Refleksiya:<\/b> «Bugun nimani bildim?»<\/p><ol><li>Laboratoriya hisobotini daftarda yakunlang.<\/li><li>21–24-§ bo‘yicha qisqa konspekt tuzing.<\/li><li><b>Qo‘shimcha:<\/b> aralash ulanish: R₁ = 2 Ω ketma-ket, R₂ = R₃ = 6 Ω parallel. R = ? (5 Ω)<\/li><\/ol>\n<script>\nconst $=s=>document.querySelector(s),NS=\"http://www.w3.org/2000/svg\",pk=a=>a[Math.floor(Math.random()*a.length)];\nconst f=(x,d=2)=>(+x).toFixed(d).replace(\".\",\",\"),rd=(x,s)=>Math.round(x/s)*s,spd=I=>I>0?Math.min(25+I*90,240):0;\nfunction S(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}\nfunction box(p,x,y,w,h,t,fill){S(\"rect\",{x,y,width:w,height:h,rx:6,fill:fill||\"var(--card)\",stroke:\"var(--wire)\",\"stroke-width\":2},p);const e=S(\"text\",{x:x+w/2,y:y+h/2+4,\"text-anchor\":\"middle\",\"font-size\":12,fill:\"var(--fg)\"},p);e.textContent=t;return e}\nfunction circ(p,x,y,t){S(\"circle\",{cx:x,cy:y,r:13,fill:\"var(--c3)\",stroke:\"var(--wire)\",\"stroke-width\":2},p);const e=S(\"text\",{x,y:y+3.5,\"text-anchor\":\"middle\",\"font-size\":9,fill:\"var(--fg)\"},p);e.textContent=t;return e}\nfunction wire(p,pts){S(\"polygon\",{points:pts.map(q=>q.join(\",\")).join(\" \"),fill:\"none\",stroke:\"var(--wire)\",\"stroke-width\":2},p)}\nconst loops=[];\nfunction Loop(svg,pts,n){const seg=[];let L=0;pts.forEach((a,i)=>{const b=pts[(i+1)%pts.length],d=Math.hypot(b[0]-a[0],b[1]-a[1]);seg.push([a,b,d,L]);L+=d});\nconst dots=[];for(let i=0;i<n;i++)dots.push(S(\"circle\",{r:4,fill:\"var(--ac)\"},svg));\nconst o={v:0,t:0,L,dots,on:true,pos(s){s=((s%L)+L)%L;for(const g of seg)if(s<=g[3]+g[2]){const k=(s-g[3])/g[2];return[g[0][0]+(g[1][0]-g[0][0])*k,g[0][1]+(g[1][1]-g[0][1])*k]}return seg[0][0]}};loops.push(o);return o}\nlet last=performance.n
