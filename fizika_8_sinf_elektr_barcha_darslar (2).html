ass=\"card ex\"><h3>2. Grafik usul<\/h3><p>Tezlik grafigida to’g’ri to’rtburchak yuzi masofaga teng: 5 m/s × 4 s = <b>20 m<\/b>.<\/p><\/div>\n<div class=\"card ex\"><h3>3. Taqqoslash (proporsiya)<\/h3><p>2 s da 10 m yursa, 4 s da: 10 · (4/2) = <b>20 m<\/b> (tezlik o’zgarmas).<\/p><\/div>\n<h2>Masala konstruktori<\/h2>\n<div class=\"card\"><p id=\"pr\"><\/p>\n<label>Tezlik <span id=\"v2\"><\/span><\/label><input type=\"range\" id=\"q1\" min=\"18\" max=\"108\" step=\"18\" value=\"54\">\n<label>Vaqt <span id=\"t2\"><\/span><\/label><input type=\"range\" id=\"q2\" min=\"5\" max=\"60\" step=\"5\" value=\"20\">\n<div class=\"ex\" id=\"cs\"><\/div><\/div>\n<h2>Xatoni top<\/h2>\n<p class=\"mut\">Har bir yechimda qanday xato borligini tanlang.<\/p>\n<div id=\"er\"><\/div>\n<\/section>\n\n<!-- 3 -->\n<section class=\"sec\">\n<h2>Asosiy formulalar<\/h2>\n<div class=\"card\"><table><tr><th>Kattalik<\/th><th>Formula<\/th><th>Birlik<\/th><\/tr>\n<tr><td>Tezlik<\/td><td>v = s/t<\/td><td>m/s<\/td><\/tr>\n<tr><td>Zichlik<\/td><td>ρ = m/V<\/td><td>kg/m³<\/td><\/tr>\n<tr><td>Bosim<\/td><td>p = F/S<\/td><td>Pa<\/td><\/tr>\n<tr><td>Tok kuchi<\/td><td>I = q/t<\/td><td>A<\/td><\/tr>\n<tr><td>Kuchlanish<\/td><td>U = I·R<\/td><td>V<\/td><\/tr><\/table>\n<p class=\"mut\">s — yo’l (m), t — vaqt (s), m — massa (kg), V — hajm (m³), F — kuch (N), S — yuza (m²), q — zaryad (C), R — qarshilik (Ω).<\/p><\/div>\n<h2>Formula uchburchagi<\/h2>\n<div class=\"chips\" id=\"fc\"><\/div>\n<div class=\"card\"><svg class=\"tri\" id=\"tri\" viewBox=\"0 0 220 150\" width=\"100%\" height=\"190\"><polygon points=\"110,6 214,144 6,144\" fill=\"none\" stroke=\"var(--bd)\" stroke-width=\"3\"/>\n<g data-k=\"0\"><circle cx=\"110\" cy=\"52\" r=\"23\"/><text x=\"110\" y=\"59\" text-anchor=\"middle\" font-size=\"20\"><\/text><\/g>\n<g data-k=\"1\"><circle cx=\"62\" cy=\"112\" r=\"23\"/><text x=\"62\" y=\"119\" text-anchor=\"middle\" font-size=\"20\"><\/text><\/g>\n<g data-k=\"2\"><circle cx=\"158\" cy=\"112\" r=\"23\"/><text x=\"158\" y=\"119\" text-anchor=\"middle\" font-size=\"20\"><\/text><\/g><\/svg>\n<div class=\"res\" id=\"fe\">Kattalikni bosing<\/div><\/div>\n<h2>Simulyatsiya<\/h2>\n<div class=\"card\"><canvas id=\"c3\"><\/canvas>\n<label><span id=\"n2\"><\/span><span id=\"v3\"><\/span><\/label><input type=\"range\" id=\"s2\">\n<label><span id=\"n3\"><\/span><span id=\"v4\"><\/span><\/label><input type=\"range\" id=\"s3\">\n<div class=\"res\" id=\"o3\"><\/div><\/div>\n<h2>Yechimli misollar<\/h2>\n<div class=\"card ex\"><h3>1-misol<\/h3><p><b>Berilgan:<\/b> s = 150 m, t = 30 s<br><b>Topish kerak:<\/b> v<br><b>Yechish:<\/b> v = s/t = 150/30<br><b>Javob:<\/b> 5 m/s<\/p><\/div>\n<div class=\"card ex\"><h3>2-misol<\/h3><p><b>Berilgan:<\/b> m = 2400 kg, V = 3 m³<br><b>Topish kerak:<\/b> ρ<br><b>Yechish:<\/b> ρ = m/V = 2400/3<br><b>Javob:<\/b> 800 kg/m³<\/p><\/div>\n<div class=\"card ex\"><h3>3-misol<\/h3><p><b>Berilgan:<\/b> F = 600 N, S = 0,3 m²<br><b>Topish kerak:<\/b> p<br><b>Yechish:<\/b> p = F/S = 600/0,3<br><b>Javob:<\/b> 2000 Pa<\/p><\/div>\n<h2>Mustaqil mashq<\/h2>\n<div class=\"card\"><p id=\"pq\"><\/p><input type=\"text\" id=\"pa\" inputmode=\"decimal\" placeholder=\"Javobni kiriting\">\n<div class=\"row\" style=\"margin-top:8px\"><button class=\"pri\" id=\"pc\">Tekshirish<\/button><button id=\"pn\">Yangi masala<\/button><\/div><div class=\"fb\" id=\"pf\"><\/div><\/div>\n<\/section>\n\n<!-- Test -->\n<section class=\"sec\">\n<h2>Test<\/h2>\n<div class=\"bar\"><i id=\"tb\" style=\"width:0\"><\/i><\/div>\n<div class=\"card\" id=\"tq\"><\/div>\n<\/section>\n\n<h2>Esda saqla<\/h2>\n<div class=\"card\"><ul style=\"margin:0;padding-left:20px\">\n<li>Masalani avval diqqat bilan o’qing, so’ng “Berilgan” va “Topish kerak”ni yozing.<\/li>\n<li>Barcha kattaliklarni SI birliklariga o’tkazing (72 km/soat = 20 m/s).<\/li>\n<li>Kerakli formulani tanlang: v = s/t, ρ = m/V, p = F/S, I = q/t.<\/li>\n<li>Hisoblang va javobni birligi bilan yozing.<\/li>\n<li>Javob mantiqan to’g’riligini tekshiring.<\/li><\/ul><\/div>\n<\/div>\n\n<script>\nconst $=id=>document.getElementById(id),fm=x=>String(+x.toFixed(2)).replace(\".\",\",\");\nconst secs=[...document.querySelectorAll(\".sec\")],tabs=[...document.querySelectorAll(\".tabs button\")];\ntabs.forEach((b,i)=>b.onclick=()=>{tabs.forEach(t=>t.classList.remove(\"on\"));secs.forEach(s=>s.classList.remove(\"on\"));b.classList.add(\"on\");secs[i].classList.add(\"on\");scrollTo({top:0,behavior:\"smooth\"})});\n$(\"th\").onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).colorScheme===\"dark\";r.dataset.theme=d?\"light\":\"dark\"};\n\n/* canvas loop */\nconst draws=[];\nfunction cv(id,fn){const c=$(id),x=c.getContext(\"2d\");const rs=()=>{const d=devicePixelRatio||1;c.width=c.clientWidth*d;c.height=c.clientHeight*d;x.setTransform(d,0,0,d,0,0)};rs();addEventListener(\"resize\",rs);draws.push(t=>fn(x,c.clientWidth,c.clientHeight,t))}\nrequestAnimationFrame(function L(t){const cs=getComputedStyle(document.documentElement);window.C={ac:cs.getPropertyValue(\"--ac\").trim(),a2:cs.getPropertyValue(\"--ac2\").trim(),bd:cs.getPropertyValue(\"--bd\").trim(),tx:cs.getPropertyValue(\"--tx\").trim()};draws.forEach(f=>f(t));requestAnimationFrame(L)});\n\n/* 1-bo'lim */\nfunction chain(){const n=[...document.querySelectorAll(\".node\")];n.forEach(e=>e.classList.remove(\"on\"));n.forEach((e,i)=>setTimeout(()=>e.classList.add(\"on\"),300+i*700))}\n$(\"chb\").onclick=chain;chain();\nfunction upd1(){const v=+$(\"r1\").value,t=+$(\"r2\").value;$(\"v1\").textContent=v+\" km/soat\";$(\"t1\").textContent=t+\" soat\";$(\"o1\").textContent=\"s = v·t = \"+v+\" · \"+t+\" = \"+v*t+\" km\"}\n$(\"r1\").oninput=$(\"r2\").oninput=upd1;upd1();\ncv(\"c1\",(x,w,h,t)=>{const v=+$(\"r1\").value;x.clearRect(0,0,w,h);x.fillStyle=C.bd;x.fillRect(0,h*.62,w,h*.3);x.fillStyle=C.tx;const off=(t*v*.0035)%50;for(let i=-1;i<w/50+1;i++)x.fillRect(i*50-off,h*.77,26,4);\nconst cx=((t*v*.0012)%(w+120))-90,cy=h*.62-30;x.fillStyle=C.ac;x.beginPath();x.roundRect(cx,cy,80,28,8);x.fill();x.fillStyle=C.a2;x.fillRect(cx+22,cy-14,36,16);x.fillStyle=C.tx;[18,62].forEach(o=>{x.beginPath();x.arc(cx+o,cy+30,8,0,7);x.fill()})});\n\n/* 2-bo'lim */\nconst ST=[\"Shartni o’qing va tahlil qiling: nima ma’lum, nima so’ralmoqda?\",\"“Berilgan” va “Topish kerak”ni yozing.\",\"Birliklarni SI ga o’tkazing (km/soat → m/s, g → kg).\",\"Mos formulani tanlang.\",\"Sonlarni qo’yib hisoblang.\",\"Javobni tekshiring va birligi bilan yozing.\"];\nconst sb=$(\"steps\");ST.forEach((s,i)=>{const d=document.createElement(\"div\");d.className=\"step\";d.style.setProperty(\"--i\",i);d.innerHTML=\"<b>\"+(i+1)+\"-bosqich.<\/b> \"+s;sb.appendChild(d)});\nlet sc=0;const sl=[...sb.children];\n$(\"nx\").onclick=()=>{if(sc<sl.length)sl[sc++].classList.add(\"show\");$(\"nx\").textContent=sc<sl.length?\"Keyingi bosqich\":\"Hammasi ochildi ✓\"};\n$(\"rs\").onclick=()=>{sl.forEach(e=>e.classList.remove(\"show\"));sc=0;$(\"nx\").textContent=\"Keyingi bosqich\"};\nfunction upd2(){const v=+$(\"q1\").value,t=+$(\"q2\").value,ms=v/3.6;$(\"v2\").textContent=v+\" km/soat\";$(\"t2\").textContent=t+\" s\";\n$(\"pr\").innerHTML=\"Mashina <b>\"+v+\" km/soat<\/b> tezlik bilan <b>\"+t+\" s<\/b> harakatlandi. U qancha masofa bosdi?\";\n$(\"cs\").innerHTML=\"<b>Berilgan:<\/b> v = \"+v+\" km/soat = \"+ms+\" m/s, t = \"+t+\" s<br><b>Topish kerak:<\/b> s<br><b>Yechish:<\/b> s = v·t = \"+ms+\" · \"+t+\" = \"+fm(ms*t)+\" m<br><b>Javob:<\/b> \"+fm(ms*t)+\" m\"}\n$(\"q1\").oninput=$(\"q2\").oninput=upd2;upd2();\nconst EN=[\"Birliklar aralashtirilgan\",\"Formula noto’g’ri tanlangan\",\"Javob tekshirilmagan\"];\nconst ER=[[\"Masala: v = 36 km/soat, t = 10 s, s = ?<br>Yechim: s = 36 · 10 = 360 m\",0],[\"Masala: m = 2 kg, V = 0,5 m³, ρ = ?<br>Yechim: ρ = V/m = 0,25 kg/m³\",1],[\"Masala: s = 300 m, t = 60 s, v = ?<br>Yechim: v = s/t = 300/60 = 50 m/s (yayov tezligi!)\",2]];\nER.forEach((e,i)=>{const d=document.createElement(\"div\");d.className=\"card\";d.innerHTML=\"<p>\"+e[0]+\"<\/p>\"+EN.map((n,j)=>\"<button class='opt' data-j='\"+j+\"'>\"+n+\"<\/button>\").join(\"\")+\"<div class='fb'><\/div>\";\nd.querySelectorAll(\".opt\").forEach(b=>b.onclick=()=>{const ok=+b.dataset.j===e[1];b.classList.add(ok?\"ok\":\"no\");const f=d.querySelector(\".fb\");f.className=\"fb \"+(ok?\"ok\":\"no\");f.textContent=ok?\"To’g’ri! Xato: \"+EN[e[1]].toLowerCase()+\".\":\"Noto’g’ri, yana urinib ko’ring.\"});$(\"er\").appendChild(d)});\n\n/* 3-bo'lim: a = b*c */\nconst F=[{n:\"v = s/t\",s:[\"s\",\"v\",\"t\"],u:[\"m\",\"m/s\",\"s\"],r:[[1,30,1],[1,20,1]],nm:[\"Tezlik\",\"Vaqt\"],col:\"a2\"},\n{n:\"ρ = m/V\",s:[\"m\",\"ρ\",\"V\"],u:[\"kg\",\"kg/m³\",\"m³\"],r:[[500,8000,100],[1,10,1]],nm:[\"Zichlik\",\"Hajm\"]},\n{n:\"p = F/S\",s:[\"F\",\"p\",\"S\"],u:[\"N\",\"Pa\",\"m²\"],r:[[100,5000,100],[1,5,1]],nm:[\"Bosim\",\"Yuza\"]},\n{n:\"I = q/t\",s:[\"q\",\"I\",\"t\"],u:[\"C\",\"A\",\"s\"],r:[[1,10,1],[1,20,1]],nm:[\"Tok kuchi\",\"Vaqt\"]},\n{n:\"U = I·R\",s:[\"U\",\"I\",\"R\"],u:[\"V\",\"A\",\"Ω\"],r:[[1,10,1],[1,50,1]],nm:[\"Tok kuchi\",\"Qarshilik\"]}];\nlet fi=0,fk=null;\nF.forEach((f,i)=>{const b=document.createElement(\"button\");b.className=\"chip\"+(i?\"\":\" on\");b.textContent=f.n;b.onclick=()=>{fi=i;fk=null;setF()};$(\"fc\").appendChild(b)});\nfunction setF(){const f=F[fi];[...$(\"fc\").children].forEach((b,i)=>b.classList.toggle(\"on\",i===fi));\ndocument.querySelectorAll(\"#tri g\").forEach((g,i)=>{g.querySelector(\"text\").textContent=f.s[i];g.classList.toggle(\"on\",fk===i)});\nconst[a,b,c]=f.s;$(\"fe\").textContent=fk===null?\"Kattalikni bosing\":fk===0?a+\" = \"+b+\" · \"+c:fk===1?b+\" = \"+a+\" / \"+c:c+\" = \"+a+\" / \"+b;\n[[\"s2\",0,\"n2\",\"v3\"],[\"s3\",1,\"n3\",\"v4\"]].forEach(([id,k])=>{const r=$(id),q=f.r[k];r.min=q[0];r.max=q[1];r.step=q[2];r.value=Math.round((q[0]+q[1])/2/q[2])*q[2];$(\"n\"+(k+2)).textContent=f.nm[k]+\" (\"+f.s[k+1]+\")\"});upd3()}\ndocument.querySelectorAll(\"#tri g\").forEach(g=>g.onclick=()=>{fk=+g.dataset.k;setF()});\nfunction upd3(){const f=F[fi],b=+$(\"s2\").value,c=+$(\"s3\").value;$(\"v3\").textContent=b+\" \"+f.u[1];$(\"v4\").textContent=b?c+\" \"+f.u[2]:\"\";$(\"o3\").textContent=f.s[0]+\" = \"+f.s[1]+\"·\"+f.s[2]+\" = \"+b+\" · \"+c+\" = \"+fm(b*c)+\" \"+f.u[0]}\n$(\"s2\").oninput=$(\"s3\").oninput=upd3;setF();\ncv(\"c3\",(x,w,h,t)=>{const f=F[fi],r=f.r,nb=(+$(\"s2\").value-r[0][0])/(r[0][1]-r[0][0]),nc=(+$(\"s3\").value-r[1][0])/(r[1][1]-r[1][0]),N=3+Math.round(nc*12),sp=.05+nb*.25;x.clearRect(0,0,w,h);\nx.strokeStyle=C.bd;x.lineWidth=14;x.lineCap=\"round\";x.beginPath();x.moveTo(10,h/2);x.lineTo(w-10,h/2);x.stroke();\nfor(let i=0;i<N;i++){const px=10+((i*(w-20)/N+t*sp)%(w-20));x.fillStyle=fi===3||fi===4?C.a2:C.ac;x.beginPath();x.arc(px,h/2,fi===0?7:5,0,7);x.fill()}\nx.fillStyle=C.tx;x.font=\"13px sans-serif\";x.fillText(\"Tez = \"+f.nm[0].toLowerCase()+\", ko’p = \"+f.nm[1].toLowerCase(),12,20)});\nfunction rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}\nlet pa=0;\nfunction newP(){const k=rnd(0,2),x=rnd(2,15),y=rnd(2,12);\nif(k===0){pa=x*y;$(\"pq\").innerHTML=\"Velosipedchi \"+x+\" m/s tezlik bilan \"+y+\" s yurdi. Yo’l s necha metr?\"}\nelse if(k===1){const r=rnd(2,9)*100;pa=r*y;$(\"pq\").innerHTML=\"Zichligi \"+r+\" kg/m³ bo’lgan suyuqlikning hajmi \"+y+\" m³. Massasi m necha kg?\"}\nelse{pa=x*y;$(\"pq\").innerHTML=\"Sim orqali \"+y+\" s davomida \"+x+\" A tok o’tdi. Zaryad q necha C?\"}\n$(\"pa\").value=\"\";$(\"pf\").textContent=\"\"}\n$(\"pn\").onclick=newP;newP();\n$(\"pc\").onclick=()=>{const v=parseFloat($(\"pa\").value.replace(\",\",\".\"));const f=$(\"pf\");if(isNaN(v)){f.className=\"fb no\";f.textContent=\"Avval son kiriting.\";return}\nconst ok=Math.abs(v-pa)<.01;f.className=\"fb \"+(ok?\"ok\":\"no\");f.textContent=ok?\"To’g’ri! Zo’r natija.\":\"Noto’g’ri. Maslahat: ko’paytirishni qayta tekshiring. To’g’ri javob: \"+fm(pa)}\n\n/* Test */\nconst Q=[\n[\"Masala yechishning asosiy maqsadi nima?\",[\"Nazariyani mustahkamlash va mantiqiy fikrlash\",\"Faqat baho olish\",\"Formulalarni yodlash\"],0,\"Masala nazariyani amalda qo’llashga o’rgatadi.\"],\n[\"“Berilgan” qismiga nima yoziladi?\",[\"Javob\",\"Shartda berilgan kattaliklar\",\"Formula nomi\"],1,\"“Berilgan”da shartdagi ma’lum qiymatlar yoziladi.\"],\n[\"72 km/soat necha m/s?\",[\"20 m/s\",\"72 m/s\",\"259 m/s\"],0,\"72 / 3,6 = 20 m/s.\"],\n[\"Tezligi 10 m/s bo’lgan avtobus 30 s da qancha yo’l bosadi?\",[\"3 m\",\"300 m\",\"40 m\"],1,\"s = v·t = 10·30 = 300 m.\"],\n[\"Zichlik formulasi qaysi?\",[\"ρ = V/m\",\"ρ = m·V\",\"ρ = m/V\"],2,\"Zichlik massaning hajmga nisbatiga teng.\"],\n[\"F = 100 N, S = 2 m². Bosim p qancha?\",[\"50 Pa\",\"200 Pa\",\"98 Pa\"],0,\"p = F/S = 100/2 = 50 Pa.\"],\n[\"q = 30 C zaryad 6 s da o’tdi. Tok kuchi I qancha?\",[\"180 A\",\"24 A\",\"5 A\"],2,\"I = q/t = 30/6 = 5 A.\"],\n[\"Kuch o’zgarmas, yuza 2 marta kamaysa, bosim qanday o’zgaradi?\",[\"2 marta ortadi\",\"2 marta kamayadi\",\"O’zgarmaydi\"],0,\"p = F/S: maxraj kamaysa, bosim ortadi.\"]];\nlet qi=0,sc2=0;\nfunction showQ(){const box=$(\"tq\");$(\"tb\").style.width=(qi/Q.length*100)+\"%\";\nif(qi>=Q.length){const p=Math.round(sc2/Q.length*100),g=p>=90?\"5 (a’lo)\":p>=70?\"4 (yaxshi)\":p>=50?\"3 (qoniqarli)\":\"2 (qayta o’rganing)\";\nbox.innerHTML=\"<h3>Natija<\/h3><div class='res'>\"+sc2+\" / \"+Q.length+\" ball • \"+p+\"% • Baho: \"+g+\"<\/div><button class='pri' id='rt' style='width:100%;margin-top:10px'>Qayta boshlash<\/button>\";\n$(\"rt\").onclick=()=>{qi=0;sc2=0;showQ()};return}\nconst q=Q[qi];box.innerHTML=\"<p class='mut'>Savol \"+(qi+1)+\" / \"+Q.length+\"<\/p><h3>\"+q[0]+\"<\/h3>\"+q[1].map((o,j)=>\"<button class='opt' data-j='\"+j+\"'>\"+o+\"<\/button>\").join(\"\")+\"<div class='fb' id='tf'><\/div>\";\nlet done=0;box.querySelectorAll(\".opt\").forEach(b=>b.onclick=()=>{if(done)return;done=1;const j=+b.dataset.j,ok=j===q[2];if(ok)sc2++;b.classList.add(ok?\"ok\":\"no\");if(!ok)box.querySelectorAll(\".opt\")[q[2]].classList.add(\"ok\");\nconst f=$(\"tf\");f.className=\"fb \"+(ok?\"ok\":\"no\");f.textContent=(ok?\"To’g’ri! \":\"Noto’g’ri. \")+q[3];\nconst n=document.createElement(\"button\");n.className=\"pri opt\";n.textContent=qi<Q.length-1?\"Keyingi savol\":\"Natijani ko’rish\";n.onclick=()=>{qi++;showQ()};box.appendChild(n)})}\nshowQ();\n<\/script>\n<\/body>\n<\/html>\n"}, {"t": "14-§ Laboratoriya ishi", "h": "<!DOCTYPE html>\n<html lang=\"uz\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Fizika 8-sinf: 14-§ Laboratoriya ishi — dars ishlanma<\/title>\n<style>\n:root{--bg:#fff;--fg:#1a1a1a;--card:#f3f4f6;--ac:#2563eb;--mut:#6b7280;--bd:#d1d5db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#111827;--fg:#f3f4f6;--card:#1f2937;--ac:#60a5fa;--mut:#9ca3af;--bd:#374151}}\n:root[data-theme=\"dark\"]{--bg:#111827;--fg:#f3f4f6;--card:#1f2937;--ac:#60a5fa;--mut:#9ca3af;--bd:#374151}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0 auto;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;padding:12px;max-width:760px}\nh1{font-size:1.3rem;margin:4px 0 8px}h2{font-size:1.05rem;margin:20px 0 6px;color:var(--ac)}\np{margin:6px 0}ul,ol{padding-left:20px;margin:4px 0}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}\n.tag{display:inline-block;background:var(--ac);color:#fff;border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:400}\n.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.84rem}th,td{border:1px solid var(--bd);padding:4px;text-align:left;vertical-align:top}\ntd input{width:100%;min-width:60px;border:0;background:transparent;color:var(--fg);font:inherit;padding:4px}\ndetails{margin:6px 0}summary{cursor:pointer;font-weight:600}\nsvg.sc{width:100%;height:auto;display:block;touch-action:manipulation}\n.w{stroke:var(--fg);fill:none;stroke-width:2}.t{fill:var(--fg);font-size:11px}\n.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;align-items:center}\nbutton.b{font:inherit;font-size:.88rem;padding:7px 9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);cursor:pointer}\nbutton.b.on{background:var(--ac);color:#fff;border-color:var(--ac)}button.b:disabled{opacity:.4}\ninput[type=range]{width:100%;accent-color:var(--ac)}\n.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}\n.v{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px;text-align:center}\n.v b{display:block;color:var(--ac)}.v span{font-size:.72rem;color:var(--mut)}\n.q{font-size:.88rem;color:var(--mut)}.msg{font-weight:600;margin:6px 0}\n.sim{display:grid;grid-template-columns:1fr;gap:8px}@media(min-width:620px){.sim{grid-template-columns:2fr 1fr}}\n.qq label{display:block;padding:2px 0}.qq{margin:8px 0}\n.chk label{display:block;padding:3px 0}\n<\/style><\/head><body>\n<h1>🔌 Laboratoriya ishi<\/h1>\n<p>Fizika, 8-sinf · II bob «Elektr toki» · 14-§ · <b>45 daqiqa<\/b> · dars ishlanma + interaktiv simulyatsiyalar<\/p>\n<p><b>Mavzu:<\/b> Elektr zanjirni yig‘ish, uning turli qismlaridagi tok kuchi va kuchlanishni o‘lchash.<\/p>\n\n<div class=\"card\">\n<p><b>Dars turi:<\/b> laboratoriya ishi. <b>Usullar:<\/b> suhbat, simulyatsiya, amaliy ish (guruhda 2–3 kishi), hisobot.<\/p>\n<p><b>Jihozlar:<\/b> batareya (yoki o‘zgaruvchan manba), kalit, lampochka, ampermetr, voltmetr, ulovchi simlar, proyektor yoki planshet.<\/p>\n<ul><li><b>Ta’limiy:<\/b> zanjir elementlari, ularning belgilarini va xavfsizlik qoidalarini bilish; ampermetr va voltmetrni to‘g‘ri ulash; tok kuchi va kuchlanishni o‘lchash.<\/li>\n<li><b>Rivojlantiruvchi:<\/b> sxema bo‘yicha zanjir yig‘ish, o‘lchash natijalarini jadvalga yozish, xulosa chiqarish.<\/li>\n<li><b>Tarbiyaviy:<\/b> aniqlik, jamoada ishlash, texnika xavfsizligiga rioya qilish.<\/li><\/ul>\n<p><b>Kutilayotgan natija:<\/b> o‘quvchi zanjirni sxema bo‘yicha yig‘adi, I ni ampermetr bilan, U ni voltmetr bilan o‘lchaydi va ketma-ket zanjir qonuniyatlari haqida xulosa chiqaradi.<\/p><\/div>\n\n<h2>Dars bosqichlari<\/h2>\n<div class=\"tw\"><table><tr><th>№<\/th><th>Bosqich<\/th><th>Vaqt<\/th><\/tr>\n<tr><td>1<\/td><td>Tashkiliy qism<\/td><td>2 daq<\/td><\/tr><tr><td>2<\/td><td>Takrorlash va motivatsiya<\/td><td>4 daq<\/td><\/tr>\n<tr><td>3<\/td><td>1-reja: Elementlar va xavfsizlik<\/td><td>9 daq<\/td><\/tr><tr><td>4<\/td><td>2-reja: Zanjirni yig‘ish, tok kuchini o‘lchash<\/td><td>12 daq<\/td><\/tr>\n<tr><td>5<\/td><td>3-reja: Kuchlanishni o‘lchash, hisobot, xulosa<\/td><td>10 daq<\/td><\/tr><tr><td>6<\/td><td>Mustahkamlash testi<\/td><td>5 daq<\/td><\/tr>\n<tr><td>7<\/td><td>Yakun, baholash, uyga vazifa<\/td><td>3 daq<\/td><\/tr><\/table><\/div>\n\n<h2>Takrorlash va motivatsiya <span class=\"tag\">4 daq<\/span><\/h2>\n<p><b>Savollar:<\/b> Elektr toki nima? Tok kuchi va kuchlanish nima, birliklari qanday? Zanjir qanday elementlardan iborat?<\/p>\n<p><b>Motivatsiya:<\/b> uydagi chiroq yonishi uchun zanjirda nimalar bo‘lishi kerak? Bugun zanjirni o‘zimiz yig‘ib, tok va kuchlanishni o‘lchaymiz.<\/p>\n\n<h2>1-reja. Zanjir elementlari va xavfsizlik qoidalari <span class=\"tag\">9 daq<\/span><\/h2>\n<p><b>Maqsad:<\/b> zanjir elementlarini, ularning shartli belgilarini va xavfsizlik qoidalarini o‘zlashtirish; ampermetr va voltmetr ulanishini farqlash.<\/p>\n<p><b>Vaqt:<\/b> tushuntirish 4 · 1-simulyatsiya 3 · savol-topshiriq 2 daqiqa.<\/p>\n<div class=\"card\"><b>1-simulyatsiya: elementlar va xavfsizlik<\/b>\n<div class=\"row\" id=\"el\"><\/div>\n<div class=\"sim\"><svg id=\"elsv\" class=\"sc\" viewBox=\"0 0 120 50\"><\/svg><div id=\"elin\"><\/div><\/div>\n<p><b>Xavfsizlik shartnomasi<\/b> (barchasini belgilang):<\/p>\n<div class=\"chk\" id=\"chk\"><\/div><p class=\"msg\" id=\"chm\"><\/p><\/div>\n<details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary>\n<p><b>O‘qituvchi faoliyati:<\/b><\/p><ul>\n<li>Elementlarni ko‘rsatib, belgilarini chizadi: manba, kalit, lampa, ampermetr (A), voltmetr (V), ulovchi sim.<\/li>\n<li>Muhim qoida: <b>ampermetr ketma-ket<\/b>, <b>voltmetr parallel<\/b> ulanadi. Ampermetrni parallel ulash qisqa tutashuvga olib keladi.<\/li>\n<li>Xavfsizlik: zanjir yig‘ilganda kalit ochiq; manbani oxirida ulash; o‘qituvchi tekshirgach yoqish; shkala chegarasidan oshmaslik; qutblarga (+/−) rioya qilish; ho‘l qo‘l bilan tegmaslik; shikastlangan simni ishlatmaslik.<\/li><\/ul>\n<p><b>O‘quvchi faoliyati:<\/b> elementlar belgilarini daftarga chizadi, simulyatsiyada xavfsizlik qoidalarini belgilaydi, sxemani o‘qiydi.<\/p>\n<p><b>Savol-topshiriqlar:<\/b><\/p><ol>\n<li>Ampermetr zanjirga qanday ulanadi? (ketma-ket)<\/li><li>Voltmetr-chi? (parallel)<\/li>\n<li>Nega zanjir yig‘ilganda kalit ochiq bo‘lishi kerak?<\/li><li>Oddiy zanjir sxemasini chizing (manba, kalit, lampa, ampermetr, voltmetr).<\/li><\/ol>\n<p><b>Baholash mezoni:<\/b><\/p><ul>\n<li><b>5:<\/b> barcha belgilarni xatosiz chizadi, ulanish qoidasini asoslaydi, xavfsizlikni to‘liq sanaydi.<\/li><li><b>4:<\/b> 1–2 xato qiladi.<\/li>\n<li><b>3:<\/b> belgilarni yordam bilan chizadi, qoidani biladi.<\/li><li><b>2:<\/b> elementlarni farqlay olmaydi.<\/li><\/ul><\/details>\n\n<h2>2-reja. Zanjirni yig‘ish va tok kuchini o‘lchash <span class=\"tag\">12 daq<\/span><\/h2>\n<p><b>Maqsad:<\/b> zanjirni yig‘ish, ampermetr bilan turli qismlarda tok kuchini o‘lchash va uning bir xilligini aniqlash.<\/p>\n<p><b>Vaqt:<\/b> sxemani muhokama 2 · yig‘ish va o‘lchash (amaliy/simulyatsiya) 8 · savol-topshiriq 2 daqiqa.<\/p>\n<div class=\"card\"><b>2-simulyatsiya: zanjirni yig‘ing<\/b>\n<p class=\"q\">Elementni tanlang, so‘ng sxemadagi bo‘sh joyga (1–6) bosing. Joylashgan elementni olib tashlash uchun uni bosing.<\/p>\n<div class=\"row\" id=\"pal\"><\/div>\n<div class=\"sim\"><svg id=\"s2\" class=\"sc\" viewBox=\"0 0 340 200\"><\/svg><svg id=\"g2\" class=\"sc\" viewBox=\"0 0 120 80\"><\/svg><\/div>\n<div class=\"row\"><button class=\"b\" id=\"k2\">Kalit: ochiq<\/button><button class=\"b\" id=\"rec2\">📝 Hisobotga yozish<\/button><\/div>\n<label>Manba kuchlanishi: <b id=\"u2o\"><\/b><\/label><input type=\"range\" id=\"u2\" min=\"1.5\" max=\"6\" step=\"0.5\" value=\"4.5\">\n<p class=\"msg\" id=\"st2\"><\/p>\n<p class=\"q\">Ampermetrni 1–6 joylarga ko‘chirib ko‘ring: ketma-ket zanjirda tok kuchi hamma joyda bir xil. Lampa qarshiligi 10 Ω deb olingan.<\/p><\/div>\n<details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary>\n<p><b>O‘qituvchi faoliyati:<\/b><\/p><ul>\n<li>Ish tartibini ko‘rsatadi: sxema bo‘yicha manba → kalit → lampa → ampermetr ketma-ket yig‘iladi; kalit ochiq; o‘qituvchi tekshiradi; kalit yopiladi.<\/li>\n<li>Ampermetr shkalasi bo‘limi va qiymatini aniqlashni o‘rgatadi (bo‘lim qiymati = chegara / bo‘limlar soni).<\/li>\n<li>Guruhlarni kuzatadi, xatoni (ampermetrni parallel ulash, qutb adashishi) o‘z vaqtida to‘xtatadi.<\/li><\/ul>\n<p><b>O‘quvchi faoliyati:<\/b> zanjirni yig‘adi, ampermetrni uchta turli joyga ulab I ni o‘lchaydi va hisobot jadvaliga yozadi.<\/p>\n<p><b>Savol-topshiriqlar:<\/b><\/p><ol>\n<li>Ampermetrni zanjirning turli joyiga ulaganda ko‘rsatish o‘zgardimi? Nega? (yo‘q, zaryad hech qayerda to‘planmaydi)<\/li>\n<li>Manba kuchlanishi oshirilsa, tok kuchi qanday o‘zgaradi? (ortadi)<\/li>\n<li>Ampermetr strelkasi chapga og‘sa nima qilish kerak? (qutblarni almashtirish)<\/li><\/ol>\n<p><b>Baholash mezoni:<\/b><\/p><ul>\n<li><b>5:<\/b> zanjirni xatosiz va xavfsiz yig‘adi, 3 joyda o‘lchaydi, asboblarni to‘g‘ri o‘qiydi.<\/li><li><b>4:<\/b> kichik noaniqlik, yo‘naltirish kerak bo‘ldi.<\/li>\n<li><b>3:<\/b> zanjirni yordam bilan yig‘adi, 1–2 o‘lchash qiladi.<\/li><li><b>2:<\/b> mustaqil bajara olmaydi.<\/li><\/ul><\/details>\n\n<h2>3-reja. Kuchlanishni o‘lchash, jadval va xulosa <span class=\"tag\">10 daq<\/span><\/h2>\n<p><b>Maqsad:<\/b> voltmetr bilan zanjir qismlaridagi kuchlanishni o‘lchash, natijalarni jadvalga yozish va xulosa chiqarish.<\/p>\n<p><b>Vaqt:<\/b> o‘lchash 5 · jadval va xulosa 3 · muhokama 2 daqiqa.<\/p>\n<div class=\"card\"><b>3-simulyatsiya: voltmetr bilan o‘lchash<\/b>\n<p class=\"q\">Zanjir: manba, kalit va ketma-ket ikki lampa (L₁ = 10 Ω, L₂ = 20 Ω). Voltmetr qaysi qismga parallel ulanishini tanlang.<\/p>\n<div class=\"row\" id=\"vsel\"><\/div>\n<div class=\"sim\"><svg id=\"s3\" class=\"sc\" viewBox=\"0 0 340 250\"><\/svg><svg id=\"g3\" class=\"sc\" viewBox=\"0 0 120 80\"><\/svg><\/div>\n<div class=\"row\"><button class=\"b\" id=\"k3\">Kalit: yopiq<\/button><button class=\"b\" id=\"rec3\">📝 Hisobotga yozish<\/button><\/div>\n<label>Manba kuchlanishi: <b id=\"u3o\"><\/b><\/label><input type=\"range\" id=\"u3\" min=\"1.5\" max=\"12\" step=\"0.5\" value=\"6\">\n<div class=\"g\"><div class=\"v\"><b id=\"i3\"><\/b><span>I (hamma joyda)<\/span><\/div><div class=\"v\"><b id=\"a3\"><\/b><span>U₁<\/span><\/div><div class=\"v\"><b id=\"b3\"><\/b><span>U₂<\/span><\/div><\/div>\n<p class=\"q\">Barcha qismlarni o‘lchab, U₁ + U₂ ni manba kuchlanishi bilan solishtiring.<\/p><\/div>\n<details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary>\n<p><b>O‘qituvchi faoliyati:<\/b><\/p><ul>\n<li>Voltmetrni qaysi qismga parallel ulashni ko‘rsatadi, qutblarga e’tibor qaratadi.<\/li>\n<li>Natijalarni jadvalga yozishni va xatoliklarni (asbob aniqligi) muhokama qilishni boshqaradi.<\/li>\n<li>Xulosani yo‘naltiruvchi savollar orqali chiqartiradi: ketma-ket zanjirda I bir xil, U = U₁ + U₂.<\/li><\/ul>\n<p><b>O‘quvchi faoliyati:<\/b> manba, L₁ va L₂ dagi kuchlanishni o‘lchaydi, hisobot jadvalini to‘ldiradi, xulosani yozadi.<\/p>\n<p><b>Savol-topshiriqlar:<\/b><\/p><ol>\n<li>Manba kuchlanishi 6 V, U₁ = 2 V. U₂ = ? (4 V)<\/li>\n<li>Voltmetrni ketma-ket ulasak nima bo‘ladi? (zanjirda tok deyarli yo‘qoladi, chunki qarshiligi juda katta)<\/li>\n<li>Qaysi lampada kuchlanish katta va nega? (L₂ da, qarshiligi katta)<\/li><\/ol>\n<p><b>Baholash mezoni:<\/b><\/p><ul>\n<li><b>5:<\/b> to‘g‘ri o‘lchaydi, jadvalni to‘liq va aniq to‘ldiradi, U = U₁ + U₂ xulosasini asoslaydi.<\/li><li><b>4:<\/b> kichik xato, xulosa to‘liq emas.<\/li>\n<li><b>3:<\/b> o‘lchaydi, xulosani yordam bilan chiqaradi.<\/li><li><b>2:<\/b> o‘lchay va yoza olmaydi.<\/li><\/ul><\/details>\n\n<h2>Laboratoriya hisobot jadvali<\/h2>\n<div class=\"card\"><p><b>Ishning maqsadi:<\/b> zanjirni yig‘ish, I va U ni o‘lchash.<\/p>\n<p><b>Asboblar:<\/b> manba, kalit, lampalar, ampermetr, voltmetr, simlar.<\/p>\n<p><b>1-jadval. Tok kuchi<\/b> (simulyatsiyada «Hisobotga yozish» tugmasi qatorni o‘zi to‘ldiradi)<\/p><div class=\"tw\"><table id=\"ta\"><\/table><\/div>\n<p><b>2-jadval. Kuchlanish<\/b><\/p><div class=\"tw\"><table id=\"tb\"><\/table><\/div>\n<p><b>Xulosa:<\/b><\/p><div class=\"tw\"><table><tr><td><input placeholder=\"1) Ketma-ket zanjirda tok kuchi ... \"><\/td><\/tr><tr><td><input placeholder=\"2) Umumiy kuchlanish U = ...\"><\/td><\/tr><tr><td><input placeholder=\"3) Qaysi lampada kuchlanish ko‘p va nega? ...\"><\/td><\/tr><\/table><\/div><\/div>\n\n<h2>Mustahkamlash testi <span class=\"tag\">5 daq<\/span><\/h2>\n<div class=\"card\"><div id=\"qz\"><\/div><button class=\"b\" id=\"qc\">Tekshirish<\/button><p id=\"qr\"><\/p><\/div>\n<p class=\"q\">Baho: 5 to‘g‘ri — «5»; 4 — «4»; 3 — «3»; 2 va kam — «2».<\/p>\n\n<h2>Yakun va uyga vazifa <span class=\"tag\">3 daq<\/span><\/h2>\n<p><b>Refleksiya:<\/b> «Bugun qaysi o‘lchash eng qiziq edi? Nima qiyin bo‘ldi?»<\/p>\n<ol><li>14-§ matnini o‘qing, ish hisobotini daftarga to‘liq yozib tugating.<\/li>\n<li><b>Masala:<\/b> ketma-ket ulangan ikki lampadagi kuchlanish 2,5 V va 3,5 V. Manba kuchlanishi qancha? (6 V)<\/li>\n<li><b>Masala:<\/b> lampa qarshiligi 12 Ω, manba 6 V. Ampermetr nimani ko‘rsatadi? (0,5 A)<\/li>\n<li><b>Ijodiy:<\/b> fonar yoki o‘yinchoq zanjirini chizing va elementlarini belgilang.<\/li>\n<li><i>Qo‘shimcha:<\/i> 3-simulyatsiyada manba kuchlanishini 3 marta o‘zgartirib, U = U₁ + U₂ ni tekshiring.<\/li><\/ol>\n\n<script>\nconst $=s=>document.querySelector(s),nf=(n,d=2)=>String(+n.toFixed(d)).replace('.',',');\nconst FG=getComputedStyle(document.documentElement).getPropertyValue('--fg')||'#888';\n\n/* ---- 1-simulyatsiya ---- */\nconst EL=[[\"Manba\",'<line class=\"w\" x1=\"8\" y1=\"25\" x2=\"45\" y2=\"25\"/><line class=\"w\" x1=\"45\" y1=\"9\" x2=\"45\" y2=\"41\"/><line class=\"w\" x1=\"60\" y1=\"17\" x2=\"60\" y2=\"33\" style=\"stroke-width:5\"/><line class=\"w\" x1=\"60\" y1=\"25\" x2=\"112\" y2=\"25\"/><text class=\"t\" x=\"36\" y=\"8\">+<\/text><text class=\"t\" x=\"64\" y=\"12\">−<\/text>',\"Zanjirda tok hosil qiladi (batareya, akkumulyator).\",\"Qutblari (+ va −) bor. Ish oxirida ulanadi.\"],\n[\"Kalit\",'<line class=\"w\" x1=\"8\" y1=\"35\" x2=\"38\" y2=\"35\"/><line class=\"w\" x1=\"38\" y1=\"35\" x2=\"72\" y2=\"12\"/><line class=\"w\" x1=\"82\" y1=\"35\" x2=\"112\" y2=\"35\"/><circle cx=\"38\" cy=\"35\" r=\"3\" fill=\"var(--fg)\"/><circle cx=\"82\" cy=\"35\" r=\"3\" fill=\"var(--fg)\"/>',\"Zanjirni ulaydi va uzadi.\",\"Ketma-ket ulanadi. Yig‘ishda ochiq bo‘ladi.\"],\n[\"Lampa\",'<line class=\"w\" x1=\"8\" y1=\"25\" x2=\"42\" y2=\"25\"/><circle class=\"w\" cx=\"60\" cy=\"25\" r=\"18\"/><path class=\"w\" d=\"M47 12L73 38M73 12L47 38\"/><line class=\"w\" x1=\"78\" y1=\"25\" x2=\"112\" y2=\"25\"/>',\"Elektr energiyasini yorug‘lik va issiqlikka aylantiradi (iste’molchi).\",\"Zanjirga ketma-ket ulanadi.\"],\n[\"Ampermetr\",'<line class=\"w\" x1=\"8\" y1=\"25\" x2=\"38\" y2=\"25\"/><circle class=\"w\" cx=\"60\" cy=\"25\" r=\"20\"/><text class=\"t\" x=\"53\" y=\"31\" style=\"font-size:18px;font-weight:700\">A<\/text><line class=\"w\" x1=\"82\" y1=\"25\" x2=\"112\" y2=\"25\"/>',\"Tok kuchini o‘lchaydi. Birligi: amper (A).\",\"<b>Ketma-ket<\/b> ulanadi. Qarshiligi juda kichik, parallel ulansa qisqa tutashuv bo‘ladi.\"],\n[\"Voltmetr\",'<line class=\"w\" x1=\"8\" y1=\"25\" x2=\"38\" y2=\"25\"/><circle class=\"w\" cx=\"60\" cy=\"25\" r=\"20\"/><text class=\"t\" x=\"54\" y=\"31\" style=\"font-size:18px;font-weight:700\">V<\/text><line class=\"w\" x1=\"82\" y1=\"25\" x2=\"112\" y2=\"25\"/>',\"Kuchlanishni o‘lchaydi. Birligi: volt (V).\",\"<b>Parallel<\/b> ulanadi (o‘lchanadigan qism uchlariga). Qarshiligi juda katta.\"],\n[\"Sim\",'<line class=\"w\" x1=\"8\" y1=\"25\" x2=\"112\" y2=\"25\"/>',\"Elementlarni o‘zaro bog‘laydi.\",\"Izolyatsiyasi butun bo‘lishi kerak.\"]];\n$('#el').innerHTML=EL.map((e,i)=>`<button class=\"b\" data-i=\"${i}\">${e[0]}<\/button>`).join('');\nfunction showEl(i){document.querySelectorAll('#el .b').forEach((b,j)=>b.classList.toggle('on',i==j));$('#elsv').innerHTML=EL[i][1];$('#elin').innerHTML=`<p><b>${EL[i][0]}<\/b><\/p><p>${EL[i][2]}<\/p><p>${EL[i][3]}<\/p>`}\n$('#el').onclick=e=>{if(e.target.dataset.i)showEl(+e.target.dataset.i)};showEl(0);\nconst SAF=[\"Zanjir yig‘ilganda kalit ochiq bo‘ladi.\",\"Manba oxirida ulanadi, o‘qituvchi tekshirgach.\",\"Ampermetr ketma-ket, voltmetr parallel ulanadi.\",\"Qutblarga (+/−) va asbob chegarasiga rioya qilaman.\",\"Ho‘l qo‘l bilan tegmayman, shikastlangan simni ishlatmayman.\"];\n$('#chk').innerHTML=SAF.map((s,i)=>`<label><input type=\"checkbox\" class=\"sc1\"> ${s}<\/label>`).join('');\n$('#chk').onchange=()=>{const a=[...document.querySelectorAll('.sc1')].every(c=>c.checked);$('#chm').textContent=a?'✅ Laboratoriya ishiga ruxsat berildi!':''};\n\n/* ---- umumiy: strelkali asbob va zarrachalar ---- */\nfunction gauge(v,max,L){const a=(-70+140*Math.min(v/max,1.05))*Math.PI/180;let t='';\n for(let i=0;i<=5;i++){const b=(-70+28*i)*Math.PI/180;t+=`<line class=\"w\" style=\"stroke-width:1\" x1=\"${60+40*Math.sin(b)}\" y1=\"${70-40*Math.cos(b)}\" x2=\"${60+46*Math.sin(b)}\" y2=\"${70-46*Math.cos(b)}\"/><text class=\"t\" style=\"font-size:8px\" x=\"${60+31*Math.sin(b)-5}\" y=\"${70-31*Math.cos(b)+3}\">${nf(max*i/5,2)}<\/text>`}\n const e=70*Math.PI/180;\n return `<rect x=\"2\" y=\"2\" width=\"116\" height=\"76\" rx=\"8\" class=\"w\" style=\"stroke-width:1\"/><path class=\"w\" d=\"M${60-46*Math.sin(e)} ${70-46*Math.cos(e)}A46 46 0 0 1 ${60+46*Math.sin(e)} ${70-46*Math.cos(e)}\"/>${t}<line x1=\"60\" y1=\"70\" x2=\"${60+42*Math.sin(a)}\" y2=\"${70-42*Math.cos(a)}\" stroke=\"#dc2626\" stroke-width=\"2\"/><circle cx=\"60\" cy=\"70\" r=\"4\" fill=\"var(--fg)\"/><text class=\"t\" x=\"54\" y=\"54\" style=\"font-size:14px;font-weight:700\">${L}<\/text>`}\nfunction per(s){s=((s%760)+760)%760;if(s<260)return[40+s,40];s-=260;if(s<120)return[300,40+s];s-=120;if(s<260)return[300-s,160];s-=260;return[40,160-s]}\nfunction parts(off){let h='';for(let k=0;k<26;k++){const p=per(k*760/26+off);h+=`<circle cx=\"${p[0]}\" cy=\"${p[1]}\" r=\"3\" fill=\"#2563eb\"/>`}return h}\nfunction box(x,y,txt,col){return `<rect x=\"${x-28}\" y=\"${y-13}\" width=\"56\" height=\"26\" rx=\"5\" fill=\"${col}\" stroke=\"var(--fg)\"/><text x=\"${x}\" y=\"${y+4}\" text-anchor=\"middle\" style=\"font-size:11px;fill:#111;font-weight:600\">${txt}<\/text>`}\n\n/* ---- tablitsalar ---- */\nfunction mk(id,cols,n){$(id).innerHTML='<tr>'+cols.map(c=>`<th>${c}<\/th>`).join('')+'<\/tr>'+Array.from({length:n},(_,i)=>'<tr><td>'+(i+1)+'<\/td>'+cols.slice(1).map(()=>'<td><input><\/td>').join('')+'<\/tr>').join('')}\nmk('#ta',[\"№\",\"Ampermetr o‘rni\",\"U manba, V\",\"I, A\"],4);mk('#tb',[\"№\",\"U manba, V\",\"U₁, V\",\"U₂, V\",\"U₁+U₂, V\"],4);\nfunction addRow(id,v){const rows=[...$(id).querySelectorAll('tr')].slice(1);const r=rows.find(r=>![...r.querySelectorAll('input')].some(i=>i.value));if(!r)return;r.querySelectorAll('input').forEach((i,k)=>i.value=v[k])}\n\n/* ---- 2-simulyatsiya ---- */\nconst SL=[[110,40],[230,40],[300,100],[230,160],[110,160],[40,100]];\nconst CP={manba:[\"Manba\",\"#fde68a\"],kalit:[\"Kalit\",\"#d1d5db\"],lampa:[\"Lampa\",\"#fef08a\"],ampermetr:[\"A\",\"#bbf7d0\"]};\nconst s2={slots:Array(6).fill(null),sel:null,closed:false};\nfunction pal(){$('#pal').innerHTML=Object.keys(CP).map(k=>`<button class=\"b${s2.sel==k?' on':''}\" data-k=\"${k}\" ${s2.slots.includes(k)?'disabled':''}>${CP[k][0]=='A'?'Ampermetr':CP[k][0]}<\/button>`).join('')}\nfunction flow2(){const h=n=>s2.slots.includes(n);return h('manba')&&h('kalit')&&h('lampa')&&s2.closed?+$('#u2').value/10:0}\nfunction draw2(){const u=+$('#u2').value;$('#u2o').textContent=nf(u,1)+' V';\n let h='<rect x=\"40\" y=\"40\" width=\"260\" height=\"120\" rx=\"2\" class=\"w\"/>';\n SL.forEach((p,i)=>{const k=s2.slots[i];h+=k?box(p[0],p[1],CP[k][0],CP[k][1]):`<rect x=\"${p[0]-22}\" y=\"${p[1]-11}\" width=\"44\" height=\"22\" rx=\"4\" fill=\"var(--card)\" stroke=\"var(--mut)\" stroke-dasharray=\"3\"/><text x=\"${p[0]}\" y=\"${p[1]+4}\" text-anchor=\"middle\" class=\"t\">${i+1}<\/text>`});\n SL.forEach((p,i)=>h+=`<rect data-i=\"${i}\" x=\"${p[0]-30}\" y=\"${p[1]-15}\" width=\"60\" height=\"30\" fill=\"transparent\" style=\"cursor:pointer\"/>`);\n $('#s2').innerHTML=h+'<g id=\"pt2\"><\/g>';\n const miss=['manba','kalit','lampa'].filter(k=>!s2.slots.includes(k)).map(k=>CP[k][0]);\n $('#st2').textContent=miss.length?'Yetishmaydi: '+miss.join(', '):(s2.closed?(s2.slots.includes('ampermetr')?'Ampermetr '+(s2.slots.indexOf('ampermetr')+1)+'-joyda: I = '+nf(u/10)+' A':'Zanjir ishlayapti. Ampermetrni ulang.'):'Zanjir yig‘ildi, kalitni yoping.');\n $('#k2').textContent='Kalit: '+(s2.closed?'yopiq':'ochiq');pal()}\n$('#pal').onclick=e=>{const k=e.target.dataset.k;if(k){s2.sel=s2.sel==k?null:k;pal()}};\n$('#s2').onclick=e=>{let i=e.target.dataset.i;if(i==null)return;i=+i;\n if(s2.slots[i]){s2.slots[i]=null}else if(s2.sel){s2.slots[i]=s2.sel;s2.sel=null}draw2()};\n$('#k2').onclick=()=>{s2.closed=!s2.closed;draw2()};$('#u2').oninput=draw2;\n$('#rec2').onclick=()=>{const a=s2.slots.indexOf('ampermetr');if(a<0||!flow2())return;addRow('#ta',[(a+1)+'-joy',nf(+$('#u2').value,1),nf(flow2())])};\ndraw2();\n\n/* ---- 3-simulyatsiya ---- */\nconst s3={sel:0,on:true},VS=[\"Manba\",\"L₁\",\"L₂\",\"L₁ + L₂\"];\nconst VP=[[[40,86],[40,114]],[[202,40],[258,40]],[[300,86],[300,114]],[[202,40],[300,114]]];\n$('#vsel').innerHTML=VS.map((v,i)=>`<button class=\"b\" data-i=\"${i}\">${v}<\/button>`).join('');\nfunction m3(){const U=+$('#u3').value,I=s3.on?U/30:0,s=s3.sel;\n return{U,I,U1:I*10,U2:I*20,V:[U,I*10,I*20,I*30][s]}}\nfunction draw3(){const m=m3();$('#u3o').textContent=nf(m.U,1)+' V';\n document.querySelectorAll('#vsel .b').forEach((b,i)=>b.classList.toggle('on',i==s3.sel));\n let h='<rect x=\"40\" y=\"40\" width=\"260\" height=\"120\" class=\"w\"/>'+box(40,100,'Manba','#fde68a')+box(110,40,'Kalit','#d1d5db')+box(230,40,'L₁ 10Ω','#fef08a')+box(300,100,'L₂ 20Ω','#fef08a');\n const p=VP[s3.sel];\n h+=`<circle cx=\"170\" cy=\"225\" r=\"17\" fill=\"#bfdbfe\" stroke=\"var(--fg)\"/><text x=\"170\" y=\"231\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:#111\">V<\/text>`;\n [[p[0],154],[p[1],186]].forEach(q=>h+=`<polyline points=\"${q[0][0]},${q[0][1]} ${q[0][0]},${q[0][1]>100?(q[0][1]+14):(q[0][1]-0)} ${q[1]},225\" fill=\"none\" stroke=\"#dc2626\" stroke-dasharray=\"4\" stroke-width=\"2\"/><circle cx=\"${q[0][0]}\" cy=\"${q[0][1]}\" r=\"4\" fill=\"#dc2626\"/>`);\n $('#s3').innerHTML=h+'<g id=\"pt3\"><\/g>';\n $('#k3').textContent='Kalit: '+(s3.on?'yopiq':'ochiq');\n $('#i3').textContent=nf(m.I)+' A';$('#a3').textContent=nf(m.U1)+' V';$('#b3').textContent=nf(m.U2)+' V'}\n$('#vsel').onclick=e=>{if(e.target.dataset.i){s3.sel=+e.target.dataset.i;draw3()}};\n$('#k3').onclick=()=>{s3.on=!s3.on;draw3()};$('#u3').oninput=draw3;\n$('#rec3').onclick=()=>{const m=m3();if(!s3.on)return;addRow('#tb',[nf(m.U,1),nf(m.U1),nf(m.U2),nf(m.U1+m.U2)])};\ndraw3();\n\n/* ---- tsikl ---- */\nlet off=0,d2=0,d3=0;\nfunction loop(){const I2=flow2(),m=m3();off+=(I2||m.I)*0+0;\n const a2=s2.slots.includes('ampermetr')?I2:0;d2+=(a2-d2)*.15;d3+=(m.V-d3)*.15;\n $('#g2').innerHTML=gauge(d2,0.8,'A');$('#g3').innerHTML=gauge(d3,12,'V');\n off2+=I2*6;off3+=m.I*6;\n const p2=$('#pt2'),p3=$('#pt3');if(p2)p2.innerHTML=I2>0?parts(off2):'';if(p3)p3.innerHTML=m.I>0?parts(off3):'';\n requestAnimationFrame(loop)}\nlet off2=0,off3=0;loop();\n\n/* ---- test ---- */\nconst Q=[[\"Ampermetr zanjirga qanday ulanadi?\",[\"ketma-ket\",\"parallel\",\"faqat manbaga\",\"ixtiyoriy\"]],\n[\"Voltmetr zanjirga qanday ulanadi?\",[\"ketma-ket\",\"o‘lchanayotgan qismga parallel\",\"faqat kalitga\",\"ulanmaydi\"]],\n[\"Ketma-ket zanjirda tok kuchi turli qismlarda…\",[\"ortib boradi\",\"kamayib boradi\",\"bir xil\",\"nolga teng\"]],\n[\"Ketma-ket ulangan ikki lampada U₁ = 2 V, U₂ = 3 V. Umumiy kuchlanish?\",[\"1 V\",\"2,5 V\",\"5 V\",\"6 V\"]],\n[\"Tok kuchining birligi?\",[\"amper\",\"volt\",\"om\",\"vatt\"]]];\nconst K=[0,1,2,2,0];\n$('#qz').innerHTML=Q.map((q,i)=>`<div class=\"qq\"><b>${i+1}. ${q[0]}<\/b>`+q[1].map((o,j)=>`<label><input type=\"radio\" name=\"q${i}\" value=\"${j}\"> ${'ABCD'[j]}) ${o}<\/label>`).join('')+'<\/div>').join('');\n$('#qc').onclick=()=>{let s=0;K.forEach((k,i)=>{const c=document.querySelector(`input[name=q${i}]:checked`);if(c&&+c.value===k)s++});\n $('#qr').innerHTML=`<b>${s}/5 → baho: ${s>=3?s:2}<\/b>`+(s<5?' · Xatolarni qayta ko‘rib chiqing.':' · Ajoyib! 🎉')};\n<\/script>\n<\/body><\/html>\n"}, {"t": "15-§ Elektr qarshilik", "h": "<!DOCTYPE html>\n<html lang=\"uz\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Fizika 8-sinf: 15-§ Elektr qarshilik — dars ishlanma<\/title>\n<style>\n:root{--bg:#fff;--fg:#1a1a1a;--card:#f3f4f6;--ac:#2563eb;--mut:#6b7280;--bd:#d1d5db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#111827;--fg:#f3f4f6;--card:#1f2937;--ac:#60a5fa;--mut:#9ca3af;--bd:#374151}}\n:root[data-theme=\"dark\"]{--bg:#111827;--fg:#f3f4f6;--card:#1f2937;--ac:#60a5fa;--mut:#9ca3af;--bd:#374151}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0 auto;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;padding:12px;max-width:760px}\nh1{font-size:1.3rem;margin:4px 0 8px}h2{font-size:1.05rem;margin:20px 0 6px;color:var(--ac)}\np{margin:6px 0}ul,ol{padding-left:20px;margin:4px 0}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}\n.tag{display:inline-block;background:var(--ac);color:#fff;border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:400}\n.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.84rem}th,td{border:1px solid var(--bd);padding:6px;text-align:left;vertical-align:top}\ndetails{margin:6px 0}summary{cursor:pointer;font-weight:600}\ncanvas,svg.sc{width:100%;height:auto;display:block}\n.t{fill:var(--fg);font-size:12px}\n.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0;align-items:center}\nselect,button.b{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);cursor:pointer}\nselect{flex:1;min-width:140px}\ninput[type=range]{width:100%;accent-color:var(--ac)}\n.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}\n.v{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;text-align:center}\n.v b{display:block;font-size:1.05rem;color:var(--ac)}.v span{font-size:.72rem;color:var(--mut)}\n.bar{height:10px;background:var(--bg);border:1px solid var(--bd);border-radius:5px;overflow:hidden;margin:2px 0 6px}.bar i{display:block;height:100%}\n.q{font-size:.88rem;color:var(--mut)}.res{font-weight:700;color:var(--ac);text-align:center;margin:6px 0}\n.qq label{display:block;padding:2px 0}.qq{margin:8px 0}\n<\/style><\/head><body>\n<h1>⚡ Elektr qarshilik<\/h1>\n<p>Fizika, 8-sinf · II bob «Elektr toki» · 15-§ · <b>45 daqiqa<\/b> · dars ishlanma + interaktiv simulyatsiyalar<\/p>\n\n<div class=\"card\">\n<p><b>Dars turi:<\/b> yangi bilim beruvchi, interaktiv. <b>Usullar:<\/b> suhbat, animatsiya, simulyatsiya, masala yechish, juftlikda ishlash.<\/p>\n<p><b>Jihozlar:<\/b> turli moddali (mis, alyuminiy, temir, nikrom) simlar, batareya, ampermetr, voltmetr, proyektor yoki planshet.<\/p>\n<ul><li><b>Ta’limiy:<\/b> elektr qarshilik, uning sababi, birligi va o‘tkazgich o‘lchamlari hamda moddasiga bog‘liqligini o‘rgatish; R = ρ·l/S formulasini qo‘llash.<\/li>\n<li><b>Rivojlantiruvchi:<\/b> mikrodunyo modelini tasavvur qilish, grafik va simulyatsiyadan xulosa chiqarish, masala yechish.<\/li>\n<li><b>Tarbiyaviy:<\/b> elektr jihozlaridan xavfsiz va tejamkor foydalanish.<\/li><\/ul>\n<p><b>Kutilayotgan natija:<\/b> o‘quvchi qarshilik sababini tushuntiradi, R ning l, S va moddaga bog‘liqligini asoslaydi, oddiy masalalarni yechadi.<\/p><\/div>\n\n<h2>Dars bosqichlari<\/h2>\n<div class=\"tw\"><table><tr><th>№<\/th><th>Bosqich<\/th><th>Vaqt<\/th><\/tr>\n<tr><td>1<\/td><td>Tashkiliy qism<\/td><td>2 daq<\/td><\/tr><tr><td>2<\/td><td>Takrorlash va motivatsiya<\/td><td>4 daq<\/td><\/tr>\n<tr><td>3<\/td><td>1-reja: Elektr qarshilik tushunchasi<\/td><td>9 daq<\/td><\/tr><tr><td>4<\/td><td>2-reja: Qarshilikning bog‘liqligi, ρ<\/td><td>12 daq<\/td><\/tr>\n<tr><td>5<\/td><td>3-reja: Masalalar va qo‘llanilishi<\/td><td>10 daq<\/td><\/tr><tr><td>6<\/td><td>Mustahkamlash testi<\/td><td>5 daq<\/td><\/tr>\n<tr><td>7<\/td><td>Yakun, baholash, uyga vazifa<\/td><td>3 daq<\/td><\/tr><\/table><\/div>\n\n<h2>Takrorlash va motivatsiya <span class=\"tag\">4 daq<\/span><\/h2>\n<p><b>Savollar:<\/b> Elektr toki nima? Tok kuchi va kuchlanish qaysi asboblar bilan o‘lchanadi? Om qonuni qanday ifodalanadi?<\/p>\n<p><b>Motivatsiya:<\/b> nega elektr choynak simi qiziydi-yu, unga ulangan uzatgich sim qizimaydi? Bugun shu sirni ochamiz.<\/p>\n\n<h2>1-reja. Elektr qarshilik, uning sababi va birligi <span class=\"tag\">9 daq<\/span><\/h2>\n<p><b>Maqsad:<\/b> qarshilik tushunchasini, uning mikroskopik sababini va o‘lchov birligini o‘zlashtirish.<\/p>\n<p><b>Vaqt:<\/b> tushuntirish 3 · 1-animatsiya 4 · savol-topshiriq 2 daqiqa.<\/p>\n<div class=\"card\"><b>1-animatsiya: o‘tkazgich ichida elektronlar<\/b>\n<canvas id=\"c1\" width=\"340\" height=\"170\"><\/canvas>\n<label>Kuchlanish (maydon): <span id=\"u1o\"><\/span><\/label><input type=\"range\" id=\"u1\" min=\"0\" max=\"100\" value=\"40\">\n<label>Harorat (ionlar tebranishi): <span id=\"t1o\"><\/span><\/label><input type=\"range\" id=\"t1\" min=\"0\" max=\"100\" value=\"30\">\n<div class=\"g\"><div class=\"v\"><b id=\"h1\"><\/b><span>to‘qnashuv / s<\/span><\/div><div class=\"v\"><b id=\"d1\"><\/b><span>o‘rtacha yo‘nalgan tezlik<\/span><\/div><div class=\"v\"><b id=\"e1\"><\/b><span>qizish (nisbiy)<\/span><\/div><\/div>\n<p class=\"q\">Ko‘k — erkin elektronlar, qizil — kristall panjara ionlari. Kuchlanishni oshiring, so‘ng haroratni: ionlar kuchliroq tebransa, to‘qnashuv ko‘payadi va tok oqimi qiyinlashadi, ya’ni qarshilik ortadi.<\/p><\/div>\n<details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary>\n<p><b>O‘qituvchi faoliyati:<\/b><\/p><ul>\n<li>Elektr qarshilik — o‘tkazgichning tok o‘tishiga qarshilik ko‘rsatish xususiyati ekanini aytadi. Belgisi R.<\/li>\n<li>Sababi: erkin elektronlar tartibli harakatda kristall panjara ionlari bilan to‘qnashadi, energiyasining bir qismini ionlarga beradi, shuning uchun o‘tkazgich qiziydi.<\/li>\n<li>Birligi — Om (Ω), nemis olimi Georg Om sharafiga. 1 Ω = 1 V / 1 A. Karrali birliklar: 1 kΩ = 1000 Ω, 1 MΩ = 10⁶ Ω. Hisoblash: R = U / I.<\/li>\n<li>Metallarda harorat ortsa ionlar tebranishi kuchayadi va qarshilik ortadi.<\/li><\/ul>\n<p><b>O‘quvchi faoliyati:<\/b> animatsiyani kuzatadi, kuchlanish va haroratni o‘zgartirib to‘qnashuvlar sonini yozadi, ta’rif va birliklarni daftarga qayd etadi.<\/p>\n<p><b>Savol-topshiriqlar:<\/b><\/p><ol>\n<li>Elektr qarshilik nima? Sababi nima?<\/li><li>Nega tok o‘tganda o‘tkazgich qiziydi?<\/li>\n<li>Qarshilik birligini ayting. 2,5 kΩ necha Om? (2500 Ω)<\/li><li>U = 12 V, I = 3 A bo‘lsa, R = ? (4 Ω)<\/li><\/ol>\n<p><b>Baholash mezoni:<\/b><\/p><ul>\n<li><b>5:<\/b> sababni to‘liq tushuntiradi, birliklarni almashtiradi, R = U/I ni qo‘llaydi.<\/li><li><b>4:<\/b> sababni aytadi, hisoblashda kichik xato.<\/li>\n<li><b>3:<\/b> ta’rif va birlikni biladi, sababni yordam bilan aytadi.<\/li><li><b>2:<\/b> tushunchani ayta olmaydi.<\/li><\/ul><\/details>\n\n<h2>2-reja. Qarshilikning l, S va moddaga bog‘liqligi, solishtirma qarshilik <span class=\"tag\">12 daq<\/span><\/h2>\n<p><b>Maqsad:<\/b> R ning uzunlik, kesim yuzi va moddaga bog‘liqligini aniqlash, ρ tushunchasini kiritish.<\/p>\n<p><b>Vaqt:<\/b> tushuntirish 4 · 2-simulyatsiya 5 · savol-topshiriq 3 daqiqa.<\/p>\n<div class=\"card\"><b>2-simulyatsiya: qarshilik simulyatori<\/b>\n<svg id=\"w2\" class=\"sc\" viewBox=\"0 0 340 100\"><\/svg>\n<div class=\"row\"><select id=\"m2\" class=\"mat\"><\/select><\/div>\n<label>Uzunlik l: <span id=\"l2o\"><\/span><\/label><input type=\"range\" id=\"l2\" min=\"1\" max=\"100\" value=\"50\">\n<label>Kesim yuzi S: <span id=\"s2o\"><\/span><\/label><input type=\"range\" id=\"s2\" min=\"0.1\" max=\"4\" step=\"0.1\" value=\"1\">\n<div class=\"res\" id=\"f2\"><\/div>\n<div id=\"bars\"><\/div>\n<p class=\"q\">Barlar bir xil l va S da to‘rt moddaning qarshiligini solishtiradi. Savol: uzunlikni 2 marta oshirsangiz R qanday o‘zgaradi? Yuzani 2 marta oshirsangiz-chi?<\/p><\/div>\n<details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary>\n<p><b>O‘qituvchi faoliyati:<\/b><\/p><ul>\n<li>Tajribani namoyish qiladi: bir xil moddali uzun va qisqa sim, ingichka va yo‘g‘on sim, turli moddali simlar bilan ampermetr ko‘rsatishini solishtiradi.<\/li>\n<li>Xulosa: R uzunlikka <b>to‘g‘ri<\/b> proporsional, kesim yuziga <b>teskari<\/b> proporsional, moddaga bog‘liq.<\/li>\n<li>Formula: <b>R = ρ·l / S<\/b>. ρ — solishtirma qarshilik: uzunligi 1 m, kesimi 1 mm² bo‘lgan o‘tkazgichning qarshiligi. Birligi: Ω·mm²/m.<\/li>\n<li>Jadval (Ω·mm²/m): mis 0,017; alyuminiy 0,028; temir 0,10; nikrom 1,1.<\/li><\/ul>\n<p><b>O‘quvchi faoliyati:<\/b> simulyatorda l, S va moddani o‘zgartirib jadval to‘ldiradi, bog‘liqlikni o‘z so‘zi bilan ifodalaydi, formuladan l va S ni ifodalaydi.<\/p>\n<p><b>Savol-topshiriqlar:<\/b><\/p><ol>\n<li>l ni 3 marta oshirsak, R qanday o‘zgaradi? (3 marta ortadi)<\/li><li>S ni 2 marta kamaytirsak-chi? (2 marta ortadi)<\/li>\n<li>Nega ρ ning birligi Ω·mm²/m? (formuladan: ρ = R·S/l)<\/li><li>Qaysi modda eng yaxshi o‘tkazgich, qaysi biri eng yomon (jadvaldan)? (mis; nikrom)<\/li><\/ol>\n<p><b>Baholash mezoni:<\/b><\/p><ul>\n<li><b>5:<\/b> uch bog‘liqlikni asoslaydi, ρ ma’nosini tushuntiradi, formulani erkin ishlatadi.<\/li><li><b>4:<\/b> bog‘liqliklarni biladi, ρ ma’nosida noaniqlik bor.<\/li>\n<li><b>3:<\/b> formulani biladi, bog‘liqlikni yordam bilan tushuntiradi.<\/li><li><b>2:<\/b> bog‘liqlikni ayta olmaydi.<\/li><\/ul><\/details>\n\n<h2>3-reja. Masalalar yechish va hayotda qo‘llanilishi <span class=\"tag\">10 daq<\/span><\/h2>\n<p><b>Maqsad:<\/b> R = ρ·l/S va R = U/I bo‘yicha masalalar yechish; simlar va isitgichlarda qarshilikning ahamiyatini tushunish.<\/p>\n<p><b>Vaqt:<\/b> masalalar 5 · 3-simulyatsiya 3 · muhokama 2 daqiqa.<\/p>\n<div class=\"card\"><b>3-simulyatsiya: tok kuchining real vaqtdagi grafigi<\/b>\n<canvas id=\"c3\" width=\"340\" height=\"150\"><\/canvas>\n<div class=\"row\"><select id=\"m3\" class=\"mat\"><\/select><button class=\"b\" id=\"pr\">🔥 Isitgich (nikrom)<\/button><\/div>\n<label>l: <span id=\"l3o\"><\/span><\/label><input type=\"range\" id=\"l3\" min=\"1\" max=\"100\" value=\"20\">\n<label>S: <span id=\"s3o\"><\/span><\/label><input type=\"range\" id=\"s3\" min=\"0.1\" max=\"4\" step=\"0.1\" value=\"1\">\n<label>U: <span id=\"u3o\"><\/span><\/label><input type=\"range\" id=\"u3\" min=\"1\" max=\"220\" value=\"12\">\n<div class=\"g\"><div class=\"v\"><b id=\"r3\"><\/b><span>R<\/span><\/div><div class=\"v\"><b id=\"i3\"><\/b><span>I = U/R<\/span><\/div><div class=\"v\"><b id=\"p3\"><\/b><span>quvvat P = U·I<\/span><\/div><\/div>\n<p class=\"q\">Parametrlarni o‘zgartiring: grafik darhol yangi tok kuchiga o‘tadi. «Isitgich» tugmasi nikrom spiralni (l = 11 m, S = 0,5 mm², U = 220 V) o‘rnatadi: tok kuchi ≈ 9 A, quvvat ≈ 2 kW.<\/p><\/div>\n<details open><summary>Masalalar (yechimi bilan)<\/summary>\n<div class=\"card\"><p><b>1-masala.<\/b> Uzunligi 200 m, kesimi 2 mm² bo‘lgan mis simning qarshiligini toping (ρ = 0,017 Ω·mm²/m).<\/p>\n<p><i>Yechim:<\/i> R = ρ·l/S = 0,017·200/2 = <b>1,7 Ω<\/b>.<\/p><\/div>\n<div class=\"card\"><p><b>2-masala.<\/b> Isitgich spirali nikromdan: l = 11 m, S = 0,5 mm², ρ = 1,1 Ω·mm²/m. 220 V tarmoqda tok kuchi qancha?<\/p>\n<p><i>Yechim:<\/i> R = 1,1·11/0,5 = 24,2 Ω; I = U/R = 220/24,2 ≈ <b>9,1 A<\/b>.<\/p><\/div>\n<div class=\"card\"><p><b>3-masala.<\/b> Kesimi 2 mm² bo‘lgan alyuminiy simning qarshiligi 1,4 Ω. Uning uzunligi qancha (ρ = 0,028)?<\/p>\n<p><i>Yechim:<\/i> l = R·S/ρ = 1,4·2/0,028 = <b>100 m<\/b>.<\/p><\/div>\n<p><b>O‘qituvchi faoliyati:<\/b><\/p><ul>\n<li>Masala yechish algoritmini beradi: «Berilgan → Formula → Hisob → Javob».<\/li>\n<li>Qo‘llanilishi: elektr uzatish simlari mis va alyuminiydan (ρ kichik, qarshilik va isrof kam); isitgich asboblar (choynak, dazmol, pech) nikromdan (ρ katta, yuqori haroratga chidamli); cho‘g‘lanma lampada volfram spiral.<\/li>\n<li>Xavfsizlik: ingichka sim katta tokda qiziydi va yong‘in chiqarishi mumkin, shuning uchun quvvatli asboblarga yo‘g‘on sim kerak.<\/li><\/ul>\n<p><b>O‘quvchi faoliyati:<\/b> masalalarni juftlikda yechadi, javoblarni sinf bilan solishtiradi, simulyatsiyada isitgich rejimini kuzatadi.<\/p>\n<p><b>Savol-topshiriqlar:<\/b><\/p><ol>\n<li>Nega uzatish simlari misdan, isitgich spirali nikromdan yasaladi?<\/li>\n<li>Nega quvvatli asbobning simi yo‘g‘on bo‘ladi?<\/li>\n<li>Temir sim (ρ = 0,10), l = 50 m, S = 1 mm². R = ? (5 Ω)<\/li><\/ol>\n<p><b>Baholash mezoni:<\/b><\/p><ul>\n<li><b>5:<\/b> masalani to‘liq yechadi (berilgan, formula, hisob, javob), qo‘llanilishini asoslaydi.<\/li><li><b>4:<\/b> yechimda 1 ta hisoblash xatosi.<\/li>\n<li><b>3:<\/b> formulani to‘g‘ri tanlaydi, yechimni yordam bilan tugatadi.<\/li><li><b>2:<\/b> masalani boshlay olmaydi.<\/li><\/ul><\/details>\n\n<h2>Mustahkamlash testi <span class=\"tag\">5 daq<\/span><\/h2>\n<div class=\"card\"><div id=\"qz\"><\/div><button class=\"b\" id=\"qc\">Tekshirish<\/button><p id=\"qr\"><\/p><\/div>\n<p class=\"q\">Baho: 5 to‘g‘ri — «5»; 4 — «4»; 3 — «3»; 2 va kam — «2».<\/p>\n\n<h2>Yakun va uyga vazifa <span class=\"tag\">3 daq<\/span><\/h2>\n<p><b>Refleksiya:<\/b> «Bugun eng qiziq nima edi? Nima tushunarsiz qoldi?»<\/p>\n<ol><li>15-§ matnini o‘qing, savollarga javob bering.<\/li>\n<li><b>Masala:<\/b> uzunligi 50 m, kesimi 1 mm² bo‘lgan temir simning qarshiligini toping (ρ = 0,10). (5 Ω)<\/li>\n<li><b>Masala:<\/b> konstantan simning qarshiligi 10 Ω, kesimi 0,5 mm², ρ = 0,5. Uzunligi qancha? (10 m)<\/li>\n<li><b>Ijodiy:<\/b> nega uzatgich simi misdan, isitgich spirali nikromdan? Daftarga 3–4 gapda yozing.<\/li>\n<li><i>Qo‘shimcha:<\/i> 2-simulyatsiyada to‘rt moddaning qarshiligini bir xil l va S da solishtirib, jadval tuzing.<\/li><\/ol>\n\n<script>\nconst $=s=>document.querySelector(s),nf=(n,d=2)=>String(+n.toFixed(d)).replace('.',',');\nconst MT=[[\"Mis\",0.017,\"#c2410c\"],[\"Alyuminiy\",0.028,\"#94a3b8\"],[\"Temir\",0.10,\"#57534e\"],[\"Nikrom\",1.1,\"#ca8a04\"]];\ndocument.querySelectorAll('.mat').forEach(s=>s.innerHTML=MT.map((m,i)=>`<option value=\"${i}\">${m[0]} (ρ = ${nf(m[1],3)})<\/option>`).join(''));\nconst FG=getComputedStyle(document.documentElement).getPropertyValue('--fg')||'#888';\n\n/* 1-animatsiya */\n(()=>{const c=$('#c1'),x=c.getContext('2d'),W=340,H=170,ions=[];\nfor(let i=0;i<8;i++)for(let j=0;j<4;j++)ions.push({x:30+i*40,y:35+j*34,p:Math.random()*6});\nconst el=Array.from({length:14},()=>({x:Math.random()*W,y:20+Math.random()*130,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,f:0}));\nlet hits=0,rate=0,t0=performance.now(),ph=0,heat=0;\nfunction f(){const U=+$('#u1').value,T=+$('#t1').value;ph+=.2;\n $('#u1o').textContent=U+' %';$('#t1o').textContent=T+' %';\n x.clearRect(0,0,W,H);x.fillStyle='rgba(148,163,184,.18)';x.fillRect(5,10,330,150);\n x.strokeStyle='#94a3b8';x.strokeRect(5,10,330,150);\n let sv=0;\n ions.forEach((n,k)=>{const a=T/100*5;n.dx=a*Math.sin(ph+n.p);n.dy=a*Math.cos(ph*1.3+n.p);\n  x.fillStyle='#ef4444';x.beginPath();x.arc(n.x+n.dx,n.y+n.dy,9,0,7);x.fill()});\n el.forEach(e=>{e.vx+=U/100*.07;const s=Math.hypot(e.vx,e.vy);if(s>3.5){e.vx*=3.5/s;e.vy*=3.5/s}\n  e.x+=e.vx;e.y+=e.vy;if(e.x>335)e.x=8;if(e.x<8)e.x=335;if(e.y<14||e.y>156)e.vy*=-1;\n  ions.forEach(n=>{if(Math.hypot(e.x-n.x-n.dx,e.y-n.y-n.dy)<12.5&&e.f<=0){hits++;e.f=8;const a=Math.random()*6.28,v=.6+Math.random()*.8;e.vx=Math.cos(a)*v;e.vy=Math.sin(a)*v}});\n  e.f--;sv+=e.vx;x.fillStyle=e.f>0?'#fde047':'#2563eb';x.beginPath();x.arc(e.x,e.y,3.5,0,7);x.fill()});\n x.fillStyle=FG;x.font='12px sans-serif';x.fillText('+',10,172-8);x.fillText('−  →  elektr maydon',300-90,172-8);\n const now=performance.now();if(now-t0>1000){rate=hits;hits=0;t0=now;heat=rate}\n $('#h1').textContent=rate;$('#d1').textContent=nf(sv/el.length,1);$('#e1').textContent=Math.min(100,Math.round(heat/3))+' %';\n requestAnimationFrame(f)}\nf()})();\n\n/* 2-simulyatsiya */\nfunction u2(){const l=+$('#l2').value,S=+$('#s2').value,m=MT[$('#m2').value],R=m[1]*l/S;\n $('#l2o').textContent=l+' m';$('#s2o').textContent=nf(S,1)+' mm²';\n $('#w2').innerHTML=`<rect x=\"10\" y=\"${50-(4+S*4)/2}\" width=\"${30+l*2.8}\" height=\"${4+S*4}\" rx=\"3\" fill=\"${m[2]}\"/><text class=\"t\" x=\"10\" y=\"18\">l = ${l} m, S = ${nf(S,1)} mm², ${m[0].toLowerCase()}<\/text>`;\n $('#f2').textContent=`R = ρ·l/S = ${nf(m[1],3)}·${l}/${nf(S,1)} = ${nf(R)} Ω`;\n $('#bars').innerHTML=MT.map(q=>{const r=q[1]*l/S;return `<div>${q[0]}: <b>${nf(r)} Ω<\/b><div class=\"bar\"><i style=\"width:${r/(1.1*l/S)*100}%;background:${q[2]}\"><\/i><\/div><\/div>`}).join('')}\n['#m2','#l2','#s2'].forEach(s=>$(s).oninput=u2);u2();\n\n/* 3-simulyatsiya */\nconst Hs=[];\nfunction u3(){const l=+$('#l3').value,S=+$('#s3').value,U=+$('#u3').value,m=MT[$('#m3').value],R=m[1]*l/S;\n $('#l3o').textContent=l+' m';$('#s3o').textContent=nf(S,1)+' mm²';$('#u3o').textContent=U+' V';return{R,I:U/R,U}}\nfunction tick(){const o=u3();Hs.push(o.I);if(Hs.length>170)Hs.shift();\n $('#r3').textContent=nf(o.R)+' Ω';$('#i3').textContent=nf(o.I)+' A';$('#p3').textContent=nf(o.U*o.I,1)+' W';\n const c=$('#c3'),x=c.getContext('2d'),W=340,H=150,mx=Math.max(...Hs,.001)*1.25;\n x.clearRect(0,0,W,H);x.strokeStyle='#94a3b8';x.lineWidth=1;x.strokeRect(30,8,304,124);\n x.fillStyle=FG;x.font='11px sans-serif';x.fillText(nf(mx,1)+' A',0,16);x.fillText('0',14,132);x.fillText('vaqt →',280,146);x.fillText('I (A)',0,76);\n x.beginPath();x.strokeStyle='#2563eb';x.lineWidth=2;\n Hs.forEach((v,i)=>{const X=30+i*304/170,Y=132-v/mx*124;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke()}\nsetInterval(tick,100);\n['#m3','#l3','#s3','#u3'].forEach(s=>$(s).oninput=u3);\n$('#pr').onclick=()=>{$('#m3').value=3;$('#l3').value=11;$('#s3').value=0.5;$('#u3').value=220;u3()};\n\n/* Test */\nconst Q=[[\"Elektr qarshilikning birligi?\",[\"Om\",\"Amper\",\"Volt\",\"Vatt\"]],\n[\"Elektr qarshilikning sababi nima?\",[\"elektronlar soni\",\"elektronlarning kristall panjara ionlari bilan to‘qnashuvi\",\"magnit maydon\",\"sim rangi\"]],\n[\"Sim uzunligi 2 marta oshirilsa, qarshilik…\",[\"2 marta ortadi\",\"2 marta kamayadi\",\"o‘zgarmaydi\",\"4 marta ortadi\"]],\n[\"Kesim yuzi 2 marta oshirilsa, qarshilik…\",[\"2 marta ortadi\",\"2 marta kamayadi\",\"o‘zgarmaydi\",\"4 marta kamayadi\"]],\n[\"Jadvaldagi moddalardan qaysi birining ρ eng kichik?\",[\"mis\",\"alyuminiy\",\"temir\",\"nikrom\"]]];\nconst K=[0,1,0,1,0];\n$('#qz').innerHTML=Q.map((q,i)=>`<div class=\"qq\"><b>${i+1}. ${q[0]}<\/b>`+q[1].map((o,j)=>`<label><input type=\"radio\" name=\"q${i}\" value=\"${j}\"> ${'ABCD'[j]}) ${o}<\/label>`).join('')+'<\/div>').join('');\n$('#qc').onclick=()=>{let s=0;K.forEach((k,i)=>{const c=document.querySelector(`input[name=q${i}]:checked`);if(c&&+c.value===k)s++});\n $('#qr').innerHTML=`<b>${s}/5 → baho: ${s>=3?s:2}<\/b>`+(s<5?' · Xatolarni qayta ko‘rib chiqing.':' · Ajoyib! 🎉')};\n<\/script>\n<\/body><\/html>\n"}, {"t": "16-§ Rezistorlar, reostatlar, potensiometrlar", "h": "<!DOCTYPE html><html lang=\"uz\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><title>Fizika 8-sinf: 16-§ Rezistorlar, reostatlar, potensiometrlar — dars ishlanma<\/title><style>\n:root{--bg:#fff;--fg:#1a1a1a;--card:#f3f4f6;--ac:#2563eb;--mut:#6b7280;--bd:#d1d5db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#111827;--fg:#f3f4f6;--card:#1f2937;--ac:#60a5fa;--mut:#9ca3af;--bd:#374151}}\n:root[data-theme=\"dark\"]{--bg:#111827;--fg:#f3f4f6;--card:#1f2937;--ac:#60a5fa;--mut:#9ca3af;--bd:#374151}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;padding:12px;max-width:760px;margin-inline:auto}\nh1{font-size:1.15rem;margin:4px 0 10px}\n.tabs{display:flex;gap:6px;margin-bottom:10px}\n.tab{flex:1;padding:9px 4px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;font:inherit;font-size:.85rem;cursor:pointer}\n.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}\n.sc{width:100%;height:auto;display:block}\n.w{stroke:var(--fg);fill:none;stroke-width:2}\n.bgf{fill:var(--card)}\n.t{fill:var(--fg);font-size:12px}\n.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}\nselect,button.b,input[type=text]{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}\nselect{flex:1;min-width:130px}\nbutton.b{cursor:pointer}\n.res{font-size:1.3rem;font-weight:700;color:var(--ac);text-align:center;margin:6px 0}\ninput[type=range]{width:100%;accent-color:var(--ac)}\n.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.v{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;text-align:center}\n.v b{display:block;font-size:1.1rem;color:var(--ac)}\n.v span{font-size:.75rem;color:var(--mut)}\n.bar{height:12px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;overflow:hidden;margin-top:4px}\n.bar i{display:block;height:100%;background:#f59e0b;width:0}\n.q{font-size:.88rem;color:var(--mut);margin:6px 0 0}\n.ok{color:#16a34a;font-weight:600}.no{color:#dc2626;font-weight:600}\n.cols{display:grid;grid-template-columns:1fr;gap:10px}\n@media(min-width:640px){.cols{grid-template-columns:1fr 1fr}}\n\nh1{font-size:1.3rem}h2{font-size:1.05rem;margin:20px 0 6px;color:var(--ac)}\ntable{width:100%;border-collapse:collapse;font-size:.84rem}th,td{border:1px solid var(--bd);padding:6px;text-align:left;vertical-align:top}\n.tw{overflow-x:auto}details{margin:6px 0}summary{cursor:pointer;font-weight:600}ul,ol{padding-left:20px;margin:4px 0}\n.tag{display:inline-block;background:var(--ac);color:#fff;border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:400}\np{margin:6px 0}.qq{margin:8px 0}.qq label{display:block;padding:2px 0}\n<\/style><\/head><body><h1>💡 Rezistorlar. Reostatlar. Potensiometrlar<\/h1>\n<p>Fizika, 8-sinf · II bob «Elektr toki» · 16-§ · <b>45 daqiqa<\/b> · dars ishlanma + interaktiv simulyatsiyalar<\/p>\n<div class=\"card\"><p><b>Dars turi:<\/b> yangi bilim beruvchi, interaktiv. <b>Usullar:<\/b> suhbat, namoyish, simulyatsiya, juftlikda ishlash.<\/p>\n<p><b>Jihozlar:<\/b> rezistorlar, reostat, potensiometr, 6 V manba, lampa, ampermetr, voltmetr, kalit, simlar, proyektor yoki planshet.<\/p>\n<ul><li><b>Ta’limiy:<\/b> rezistor, reostat, potensiometr tuzilishi, belgisi va vazifasini tushuntirish; tok kuchi va kuchlanishni rostlashni o‘rgatish.<\/li>\n<li><b>Rivojlantiruvchi:<\/b> sxemani o‘qish, rang kodini aniqlash, kuzatishdan xulosa chiqarish.<\/li>\n<li><b>Tarbiyaviy:<\/b> elektr jihozlarini xavfsiz ishlatish, tejamkorlik.<\/li><\/ul>\n<p><b>Kutilayotgan natija:<\/b> o‘quvchi rezistorni belgisidan va rang kodidan taniydi, reostat bilan tok kuchini rostlashni tushuntiradi, reostat va potensiometrni farqlaydi.<\/p><\/div>\n<h2>Dars bosqichlari<\/h2><div class=\"tw\"><table><tr><th>№<\/th><th>Bosqich<\/th><th>Vaqt<\/th><\/tr>\n<tr><td>1<\/td><td>Tashkiliy qism<\/td><td>2 daq<\/td><\/tr><tr><td>2<\/td><td>Takrorlash va motivatsiya<\/td><td>4 daq<\/td><\/tr>\n<tr><td>3<\/td><td>1-reja: Rezistorlar<\/td><td>9 daq<\/td><\/tr><tr><td>4<\/td><td>2-reja: Reostat<\/td><td>12 daq<\/td><\/tr>\n<tr><td>5<\/td><td>3-reja: Potensiometr<\/td><td>10 daq<\/td><\/tr><tr><td>6<\/td><td>Mustahkamlash testi<\/td><td>5 daq<\/td><\/tr>\n<tr><td>7<\/td><td>Yakun, baholash, uyga vazifa<\/td><td>3 daq<\/td><\/tr><\/table><\/div>\n<h2>Takrorlash va motivatsiya <span class=\"tag\">4 daq<\/span><\/h2>\n<p><b>Savollar:<\/b> Om qonunini ayting. Sim qarshiligi nimalarga bog‘liq (R = ρ·l / S)? Nega ba’zi simlar qizib ketadi?<\/p>\n<p><b>Motivatsiya:<\/b> radioning ovozini yoki stol chirog‘ining yorug‘ligini qanday sozlaysiz? Bugun shu qurilmalar sirini bilib olamiz.<\/p>\n<h2>1-reja. Rezistorlar, turlari, shartli belgisi va vazifasi <span class=\"tag\">9 daq<\/span><\/h2>\n<p><b>Maqsad:<\/b> rezistor tushunchasi, turlari va belgisini o‘zlashtirish; rang kodi bo‘yicha qarshilikni aniqlash.<\/p><p><b>Vaqt:<\/b> tushuntirish 4 · 1-simulyatsiya 3 · savol-topshiriq 2 daqiqa.<\/p>\n\n<div class=\"card\">\n<svg id=\"rs\" class=\"sc\" viewBox=\"0 0 300 120\"><\/svg>\n<div class=\"res\" id=\"rv\"><\/div>\n<div class=\"row\"><select id=\"b1\"><\/select><select id=\"b2\"><\/select><\/div>\n<div class=\"row\"><select id=\"b3\"><\/select><select id=\"b4\"><\/select><\/div>\n<p class=\"q\">1–2-halqa: raqamlar · 3-halqa: ko‘paytiruvchi · 4-halqa: aniqlik<\/p>\n<\/div>\n<div class=\"card\">\n<b>Mashq<\/b>\n<div class=\"row\"><button class=\"b\" id=\"mq\">🎲 Tasodifiy rezistor<\/button><\/div>\n<div id=\"mo\" class=\"row\"><\/div><div id=\"mf\"><\/div>\n<\/div>\n\n<details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary>\n<p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Rezistor — zanjirda ma’lum qarshilik hosil qiluvchi element.<\/li><li>Turlari: simli, uglerodli (plyonkali), o‘zgaruvchan; maxsus: termistor (haroratga), fotorezistor (yorug‘likka bog‘liq).<\/li><li>Belgisi: to‘g‘ri to‘rtburchak, yonida R va qarshiligi (Ω).<\/li><li>Vazifasi: tok kuchini cheklash, kuchlanishni taqsimlash, issiqlik hosil qilish.<\/li><li>Rang kodi: 1–2-halqa raqam, 3-halqa ko‘paytiruvchi, 4-halqa aniqlik (oltin ±5 %, kumush ±10 %).<\/li><\/ul>\n<p><b>O‘quvchi faoliyati:<\/b> belgisini chizadi, turlarini yozadi, simulyatorda halqalarni tanlab qarshilikni hisoblaydi, «Tasodifiy rezistor» bilan o‘zini tekshiradi.<\/p>\n<p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Rezistor nima uchun kerak?<\/li><li>Belgisini chizing.<\/li><li>Sariq, binafsha, qizil, oltin halqali rezistor qarshiligi? (4,7 kΩ ±5 %)<\/li><li>Termistor oddiy rezistordan nimasi bilan farq qiladi?<\/li><\/ol>\n<p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> belgini chizadi, turlarini sanaydi, rang kodini xatosiz topadi.<\/li><li><b>4:<\/b> rang kodida 1 ta kichik xato.<\/li><li><b>3:<\/b> tushuncha va belgini biladi, rang kodini yordam bilan topadi.<\/li><li><b>2:<\/b> tushunchani ayta olmaydi.<\/li><\/ul><\/details><h2>2-reja. Reostat qurilmasi va ishlash prinsipi, tok kuchini rostlash <span class=\"tag\">12 daq<\/span><\/h2>\n<p><b>Maqsad:<\/b> reostat tuzilishi, sim uzunligi–qarshilik–tok kuchi bog‘lanishini tushunish.<\/p><p><b>Vaqt:<\/b> tushuntirish 4 · 2-simulyatsiya/tajriba 5 · savol-topshiriq 3 daqiqa.<\/p>\n\n<div class=\"card\">\n<svg id=\"s2\" class=\"sc\" viewBox=\"0 0 360 230\"><\/svg>\n<label>Surgichni suring:<\/label>\n<input type=\"range\" id=\"r2\" min=\"0\" max=\"100\" value=\"50\">\n<div class=\"g\" style=\"margin-top:8px\">\n<div class=\"v\"><b id=\"o2l\"><\/b><span>ulangan sim uzunligi<\/span><\/div>\n<div class=\"v\"><b id=\"o2r\"><\/b><span>reostat qarshiligi<\/span><\/div>\n<div class=\"v\"><b id=\"o2i\"><\/b><span>tok kuchi (ampermetr)<\/span><\/div>\n<div class=\"v\"><b id=\"o2b\"><\/b><span>lampa yorug‘ligi<\/span><\/div>\n<\/div>\n<div class=\"bar\"><i id=\"o2bar\"><\/i><\/div>\n<p class=\"q\">Manba 6 V, lampa 10 Ω, reostat 0–20 Ω (1 m sim = 2 Ω). Surgich o‘ngga siljisa, ulangan (ko‘k) sim qisqaradi. Savol: nega lampa yorqinlashdi?<\/p>\n<\/div>\n\n<details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary>\n<p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Reostat — qarshiligi silliq o‘zgaradigan rezistor.<\/li><li>Tuzilishi: izolyatsiyalangan silindrga o‘ralgan yuqori solishtirma qarshilikli sim (nikelin, konstantan), <b>surgich<\/b>, ikki qisqich.<\/li><li>Surgich surilganda ulangan sim uzunligi l o‘zgaradi, demak R = ρ·l / S o‘zgaradi.<\/li><li>Lampaga <b>ketma-ket<\/b> ulanadi: I = U / (R<sub>lampa<\/sub> + R<sub>reostat<\/sub>).<\/li><li>Real zanjir (reostat, lampa, ampermetr) namoyish qilinadi va simulyatsiya bilan taqqoslanadi.<\/li><\/ul>\n<p><b>O‘quvchi faoliyati:<\/b> tuzilishini chizadi, surgichni surib uzunlik, qarshilik, tok kuchi va lampa yorug‘ligini kuzatadi, xulosa chiqaradi.<\/p>\n<p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Reostat simi nega kuchli qarshilikli materialdan yasaladi?<\/li><li>Surgich uzunlikni qisqartirsa, tok kuchi qanday o‘zgaradi?<\/li><li><b>Masala:<\/b> reostat 20 Ω, lampa 10 Ω, manba 6 V. Eng kichik va eng katta tok? (0,6 A va 0,2 A)<\/li><li>Reostat ampermetrga nega ketma-ket ulanadi?<\/li><\/ol>\n<p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> tuzilishi, prinsipi va formulani to‘liq tushuntiradi, masalani xatosiz yechadi.<\/li><li><b>4:<\/b> prinsipni tushuntiradi, hisoblashda xato bor.<\/li><li><b>3:<\/b> kuzatishni aytadi, sababini yordam bilan tushuntiradi.<\/li><li><b>2:<\/b> bog‘lanishni ayta olmaydi.<\/li><\/ul><\/details><h2>3-reja. Potensiometr, reostatdan farqi, kuchlanishni rostlash va qo‘llanilishi <span class=\"tag\">10 daq<\/span><\/h2>\n<p><b>Maqsad:<\/b> potensiometr tuzilishi va ulanishini, reostatdan farqini, amaliy qo‘llanilishini bilish.<\/p><p><b>Vaqt:<\/b> tushuntirish 4 · 3-simulyatsiya (yonma-yon) 4 · savol-topshiriq 2 daqiqa.<\/p>\n\n<div class=\"card\">\n<label>Ikkala sxemada surgichni birga suring:<\/label>\n<input type=\"range\" id=\"r3\" min=\"0\" max=\"100\" value=\"50\">\n<\/div>\n<div class=\"cols\">\n<div class=\"card\"><b>Reostat (ketma-ket)<\/b>\n<svg id=\"s3a\" class=\"sc\" viewBox=\"0 0 360 230\"><\/svg>\n<div class=\"g\"><div class=\"v\"><b id=\"a3v\"><\/b><span>lampa kuchlanishi<\/span><\/div><div class=\"v\"><b id=\"a3i\"><\/b><span>tok kuchi<\/span><\/div><\/div>\n<div class=\"bar\"><i id=\"a3b\"><\/i><\/div><\/div>\n<div class=\"card\"><b>Potensiometr (bo‘luvchi)<\/b>\n<svg id=\"s3b\" class=\"sc\" viewBox=\"0 0 360 230\"><\/svg>\n<div class=\"g\"><div class=\"v\"><b id=\"b3v\"><\/b><span>lampa kuchlanishi<\/span><\/div><div class=\"v\"><b id=\"b3i\"><\/b><span>tok kuchi<\/span><\/div><\/div>\n<div class=\"bar\"><i id=\"b3b\"><\/i><\/div><\/div>\n<\/div>\n<div class=\"card\"><p class=\"q\" style=\"margin:0\">Surgichni eng chapga olib boring: reostatda lampa 2 V da yonib turadi (0 ga tushmaydi), potensiometrda esa 0 V — lampa butunlay so‘nadi. Reostat <b>tok kuchini<\/b>, potensiometr <b>kuchlanishni<\/b> rostlaydi.<\/p><\/div>\n\n<details open><summary>Faoliyat, savol-topshiriqlar, baholash<\/summary>\n<p><b>O‘qituvchi faoliyati:<\/b><\/p><ul><li>Potensiometr — <b>uchta chiqishli<\/b> o‘zgaruvchan rezistor. Manba ikkala chetiga, yuklama surgich va bir chetga ulanadi: <b>kuchlanish bo‘luvchi<\/b>.<\/li><li>Kuchlanish 0 dan manba kuchlanishigacha silliq o‘zgaradi (reostatda 0 gacha tushmaydi).<\/li><li>Qo‘llanilishi: radio/televizorda <b>ovoz balandligi<\/b>, <b>yorug‘lik rostlagichi (dimmer)<\/b>, joystik, asbob sozlagichlari. Kuchli zamonaviy dimmerlar ko‘pincha yarimo‘tkazgichli (triak) sxemada, lekin g‘oya o‘xshash.<\/li><\/ul>\n<p><b>O‘quvchi faoliyati:<\/b> ikki sxemani chizadi, umumiy surgich bilan solishtiradi, farqlarni jadvalga yozadi, hayotdan misol keltiradi.<\/p>\n<p><b>Savol-topshiriqlar:<\/b><\/p><ol><li>Potensiometrning nechta chiqishi bor? (3 ta)<\/li><li>Lampani 0 V dan boshlab yoqish uchun qaysi qurilma kerak?<\/li><li><b>Masala:<\/b> manba 12 V, potensiometr 100 Ω, yuklamasiz, surgich o‘rtada. Chiqish kuchlanishi? (6 V)<\/li><li>Ovoz balandligi tugmasi qaysi qurilmaga o‘xshaydi va nega?<\/li><\/ol>\n<p><b>Baholash mezoni:<\/b><\/p><ul><li><b>5:<\/b> farqni to‘g‘ri tushuntiradi, 2 ta misol keltiradi, masalani yechadi.<\/li><li><b>4:<\/b> farqni tushuntiradi, 1 ta misol.<\/li><li><b>3:<\/b> potensiometr ekanini biladi, farqni to‘liq tushuntira olmaydi.<\/li><li><b>2:<\/b> qurilmalarni farqlay olmaydi.<\/li><\/ul><\/details><h2>Taqqoslash jadvali<\/h2><div class=\"tw\"><table><tr><th>Belgi<\/th><th>Reostat<\/th><th>Potensiometr<\/th><\/tr>\n<tr><td>Chiqishlar<\/td><td>2 ta ishlatiladi (surgich + chet)<\/td><td>3 ta (ikki chet + surgich)<\/td><\/tr>\n<tr><td>Ulanishi<\/td><td>Yuklamaga ketma-ket<\/td><td>Manbaga ikki chetidan, yuklama surgichdan (bo‘luvchi)<\/td><\/tr>\n<tr><td>Rostlaydi<\/td><td>Tok kuchini<\/td><td>Kuchlanishni<\/td><\/tr>\n<tr><td>Oralig‘i<\/td><td>0 gacha tushmaydi<\/td><td>0 dan manba kuchlanishigacha<\/td><\/tr>\n<tr><td>Energiya<\/td><td>Qarshilikda issiqlik ajraladi<\/td><td>Doim tok oqadi, isrof bor<\/td><\/tr>\n<tr><td>Qo‘llanishi<\/td><td>Tok sozlash, tajriba stendi<\/td><td>Ovoz balandligi, rostlagichlar, datchiklar<\/td><\/tr><\/table><\/div>\n<h2>Mustahkamlash testi <span class=\"tag\">5 daq<\/span><\/h2><div class=\"card\"><div id=\"qz\"><\/div><button class=\"b\" id=\"qc\">Tekshirish<\/button><p id=\"qr\"><\/p><\/div>\n<p class=\"q\">Baho: 5 to‘g‘ri — «5»; 4 — «4»; 3 — «3»; 2 va kam — «2».<\/p>\n<h2>Yakun va uyga vazifa <span class=\"tag\">3 daq<\/span><\/h2>\n<p><b>Refleksiya:<\/b> «Bugun eng qiziq nima edi? Nima tushunarsiz qoldi?»<\/p>\n<ol><li>16-§ matnini o‘qing, savollarga javob bering.<\/li><li>Rezistor, reostat, potensiometr belgilarini chizib, farqlarini yozing.<\/li>\n<li><b>Masala:<\/b> lampa 15 Ω, reostat 0–25 Ω, manba 8 V. Eng kichik va eng katta tok kuchini toping.<\/li>\n<li><b>Ijodiy:<\/b> uyingizdagi ikki qurilmada qanday rostlagich borligini yozing va sababini tushuntiring.<\/li>\n<li><i>Qo‘shimcha:<\/i> simulyatorda uchta rezistorning rang kodini aniqlab daftarga yozing.<\/li><\/ol><script>\nconst $=s=>document.querySelector(s);\nconst nf=(n,d=2)=>String(+n.toFixed(d)).replace('.',',');\ndocument.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{\n document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));\n document.querySelectorAll('.pn').forEach(p=>p.hidden=p.id!==b.dataset.p)});\n\n/* ---------- 1. Rang kodi ---------- */\nconst D=[[\"Qora\",\"#111\",0],[\"Jigarrang\",\"#7b4a1e\",1],[\"Qizil\",\"#d62828\",2],[\"To‘q sariq\",\"#f77f00\",3],[\"Sariq\",\"#fcd34d\",4],[\"Yashil\",\"#2a9d3f\",5],[\"Ko‘k\",\"#1d4ed8\",6],[\"Binafsha\",\"#8b5cf6\",7],[\"Kulrang\",\"#9ca3af\",8],[\"Oq\",\"#f9fafb\",9]];\nconst D1=D.slice(1);\nconst M=D.slice(0,7).map(d=>[d[0],d[1],Math.pow(10,d[2])]).concat([[\"Oltin\",\"#d4a017\",0.1],[\"Kumush\",\"#c0c0c0\",0.01]]);\nconst T=[[\"Jigarrang\",\"#7b4a1e\",1],[\"Qizil\",\"#d62828\",2],[\"Oltin\",\"#d4a017\",5],[\"Kumush\",\"#c0c0c0\",10]];\nfunction fill(id,a,def){const s=$(id);s.innerHTML=a.map((x,i)=>`<option value=\"${i}\">${x[0]}<\/option>`).join('');s.value=def}\nfill('#b1',D1,3);fill('#b2',D,7);fill('#b3',M,2);fill('#b4',T,2);\nfunction fmt(v){return v>=1e6?nf(v/1e6)+' MΩ':v>=1e3?nf(v/1e3)+' kΩ':nf(v)+' Ω'}\nfunction drawRes(c){\n const x=[95,120,150,205];\n $('#rs').innerHTML=`<line class=\"w\" x1=\"10\" y1=\"60\" x2=\"75\" y2=\"60\"/><line class=\"w\" x1=\"225\" y1=\"60\" x2=\"290\" y2=\"60\"/>\n <rect x=\"70\" y=\"30\" width=\"160\" height=\"60\" rx=\"22\" fill=\"#e8d5a8\" stroke=\"#8a7a50\" stroke-width=\"2\"/>`+\n c.map((h,i)=>`<rect x=\"${x[i]}\" y=\"31\" width=\"14\" height=\"58\" fill=\"${h}\" stroke=\"#0004\"/>`).join('');\n}\nfunction upd(){\n const a=D1[+$('#b1').value],b=D[+$('#b2').value],m=M[+$('#b3').value],t=T[+$('#b4').value];\n drawRes([a[1],b[1],m[1],t[1]]);\n $('#rv').textContent='R = '+fmt((a[2]*10+b[2])*m[2])+' ± '+t[2]+' %';\n}\n['#b1','#b2','#b3','#b4'].forEach(s=>$(s).onchange=upd);upd();\nlet ans=0;\n$('#mq').onclick=()=>{\n const a=1+Math.floor(Math.random()*9),b=Math.floor(Math.random()*10),mi=Math.floor(Math.random()*7),ti=2+Math.floor(Math.random()*2);\n drawRes([D[a][1],D[b][1],M[mi][1],T[ti][1]]);\n $('#rv').textContent='R = ?';\n const v=(a*10+b)*M[mi][2];\n const opts=[v,v*10,v/10].sort(()=>Math.random()-.5);\n $('#mo').innerHTML=opts.map(o=>`<button class=\"b\" data-v=\"${o}\">${fmt(o)}<\/button>`).join('');\n $('#mf').textContent='Halqalarni o‘qing va qarshilikni tanlang.';\n $('#mo').querySelectorAll('button').forEach(bt=>bt.onclick=()=>{\n  const ok=+bt.dataset.v===v;\n  $('#mf').innerHTML=ok?'<span class=\"ok\">To‘g‘ri! ✅ '+fmt(v)+' ± '+T[ti][2]+' %<\/span>':'<span class=\"no\">Xato ❌ Yana urinib ko‘ring.<\/span>';\n  if(ok)$('#rv').textContent='R = '+fmt(v)+' ± '+T[ti][2]+' %';\n });\n};\n\n/* ---------- 2–3. Reostat / potensiometr sxemasi ---------- */\nfunction draw(el,mode,x,b){\n const sx=70+250*x;let c='';\n for(let X=70;X<=320;X+=7){\n  let cl='#9ca3af';\n  if(mode=='r'&&X>=sx)cl='#2563eb';\n  if(mode=='p')cl=X<=sx?'#f59e0b':'#2563eb';\n  c+=`<line x1=\"${X}\" y1=\"130\" x2=\"${X}\" y2=\"170\" stroke=\"${cl}\" stroke-width=\"3\"/>`;\n }\n const bot=mode=='r'?'M40 150V200H320V150':'M40 150V200H70V150M70 200H320V150';\n el.innerHTML=\n `<circle cx=\"40\" cy=\"95\" r=\"${18+22*b}\" fill=\"#fde047\" opacity=\"${.12+.5*b}\"/>\n <path class=\"w\" d=\"M40 40H${sx}V128\"/><path class=\"w\" d=\"${bot}\"/>\n <path class=\"w\" d=\"M40 40V150\"/>${c}\n <rect x=\"70\" y=\"130\" width=\"250\" height=\"40\" rx=\"4\" class=\"w\"/>\n <circle cx=\"40\" cy=\"95\" r=\"16\" class=\"w\" fill=\"#fde047\" fill-opacity=\"${.1+.9*b}\"/>\n <path class=\"w\" d=\"M33 88L47 102M47 88L33 102\"/>\n <polygon points=\"${sx-7},118 ${sx+7},118 ${sx},130\" fill=\"#dc2626\"/>\n <rect x=\"178\" y=\"190\" width=\"24\" height=\"20\" class=\"bgf\"/>\n <line x1=\"184\" y1=\"190\" x2=\"184\" y2=\"210\" stroke=\"var(--fg)\" stroke-width=\"3\"/>\n <line x1=\"196\" y1=\"195\" x2=\"196\" y2=\"205\" stroke=\"var(--fg)\" stroke-width=\"5\"/>\n <text class=\"t\" x=\"52\" y=\"68\">lampa<\/text><text class=\"t\" x=\"186\" y=\"224\">manba 6 V<\/text>\n <text class=\"t\" x=\"66\" y=\"185\">A<\/text><text class=\"t\" x=\"316\" y=\"185\">B<\/text>\n <text class=\"t\" x=\"${Math.min(sx+10,310)}\" y=\"112\">C<\/text>`;\n}\nconst rheo=x=>{const R=(1-x)*20,I=6/(10+R);return{R,I,V:I*10}};\nconst pot=x=>{const R1=x*20,R2=(1-x)*20,Rp=R1>0?R1*10/(R1+10):0,V=6*Rp/(Rp+R2);return{V,I:V/10}};\nconst bright=V=>Math.pow(V/6,2);\nfunction u2(){\n const x=$('#r2').value/100,o=rheo(x),b=bright(o.V),l=(1-x)*10;\n draw($('#s2'),'r',x,b);\n $('#o2l').textContent=nf(l,1)+' m';$('#o2r').textContent=nf(o.R,1)+' Ω';\n $('#o2i').textContent=nf(o.I)+' A';$('#o2b').textContent=Math.round(b*100)+' %';\n $('#o2bar').style.width=b*100+'%';\n}\nfunction u3(){\n const x=$('#r3').value/100,a=rheo(x),p=pot(x);\n draw($('#s3a'),'r',x,bright(a.V));draw($('#s3b'),'p',x,bright(p.V));\n $('#a3v').textContent=nf(a.V)+' V';$('#a3i').textContent=nf(a.I)+' A';$('#a3b').style.width=bright(a.V)*100+'%';\n $('#b3v').textContent=nf(p.V)+' V';$('#b3i').textContent=nf(p.I)+' A';$('#b3b').style.width=bright(p.V)*100+'%';\n}\n$('#r2').oninput=u2;$('#r3').oninput=u3;u2();u3();\n\nconst Q=[[\"Rezistorning sxemadagi belgisi?\",[\"doira\",\"to‘g‘ri to‘rtburchak\",\"uchburchak\",\"ikki parallel chiziq\"]],\n[\"Sariq–binafsha–qizil–oltin rezistor qarshiligi?\",[\"47 Ω\",\"470 Ω\",\"4,7 kΩ\",\"47 kΩ\"]],\n[\"Reostatda ulangan sim uzunligi ortsa, tok kuchi…\",[\"ortadi\",\"kamayadi\",\"o‘zgarmaydi\",\"0 bo‘ladi\"]],\n[\"Reostat zanjirga qanday ulanadi?\",[\"parallel\",\"ketma-ket\",\"faqat manbaga\",\"ulanmaydi\"]],\n[\"Kuchlanishni 0 dan rostlash uchun qaysi qurilma kerak?\",[\"rezistor\",\"reostat\",\"potensiometr\",\"ampermetr\"]]];\nconst K=[1,2,1,1,2];\n$('#qz').innerHTML=Q.map((q,i)=>`<div class=\"qq\"><b>${i+1}. ${q[0]}<\/b>`+q[1].map((o,j)=>`<label><input type=\"radio\" name=\"q${i}\" value=\"${j}\"> ${'ABCD'[j]}) ${o}<\/label>`).join('')+'<\/div>').join('');\n$('#qc').onclick=()=>{let s=0;K.forEach((k,i)=>{const c=document.querySelector(`input[name=q${i}]:checked`);if(c&&+c.value===k)s++});\n $('#qr').innerHTML=`<b>${s}/5 → baho: ${s>=3?s:2}<\/b>`+(s<5?' · Xatolarni qayta ko‘rib chiqing.':' · Ajoyib! 🎉')};\n<\/script><\/body><\/html>"}, {"t": "17-§ Zanjir qismi uchun Om qonuni", "h": "<!DOCTYPE html><html lang=\"uz\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><title>Fizika 8-sinf: 17-§ Zanjirning bir qismi uchun Om qonuni — dars ishlanma<\/title><style>\n:root{--bg:#fff;--fg:#1a1a1a;--card:#f3f4f6;--ac:#2563eb;--mut:#6b7280;--bd:#d1d5db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#111827;--fg:#f3f4f6;--card:#1f2937;--ac:#60a5fa;--mut:#9ca3af;--bd:#374151}}\n:root[data-theme=\"dark\"]{--bg:#111827;--fg:#f3f4f6;--card:#1f2937;--ac:#60a5fa;--mut:#9ca3af;--bd:#374151}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}\nbody{margin:0 auto;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;padding:12px;max-width:760px}\nh1{font-size:1.3rem;margin:4px 0 8px}h2{font-
