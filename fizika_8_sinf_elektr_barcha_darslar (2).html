nk);cursor:pointer}\nbutton:focus-visible,input:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}\nbutton[aria-current=true],button.on{background:var(--pri);color:var(--bg);font-weight:600}\nbutton:disabled{opacity:.4;cursor:default}\nmain{max-width:860px;margin:auto;padding:8px 16px}\n.slide[hidden]{display:none}\nh2{font-size:1.4rem;margin:.6em 0 .3em}\n.goal{background:var(--box);border-left:6px solid var(--pri);padding:10px 14px;border-radius:8px;font-weight:600}\n.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:14px 0}\ncanvas{width:100%;height:auto;display:block;border-radius:10px}\n.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}\n.ctl button{flex:1 1 140px}\n.status{margin:10px 0 0;font-weight:600;min-height:3.2em}\n.know{background:var(--box);border:2px solid var(--pri);border-radius:14px;padding:4px 14px;margin:14px 0}\n.know h3{margin:.5em 0 .2em}\n.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;padding:0;list-style:none}\n.chips li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}\n.pl{color:var(--plus);font-weight:700}.mn{color:var(--el);font-weight:700}\n.flow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-weight:600}\n.flow span{background:var(--box);border:2px solid var(--pri);border-radius:10px;padding:6px 12px}\n.flow i{font-style:normal;font-size:1.8rem;color:var(--lamp);animation:nudge 1.2s ease-in-out infinite}\n@keyframes nudge{50%{transform:translateX(8px)}}\nfieldset{border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:8px 12px}\nlegend{font-weight:600;padding:0 6px}\nlabel{display:block;padding:8px 4px;cursor:pointer}\ninput[type=radio]{width:20px;height:20px;vertical-align:-4px;margin-right:8px}\n.res{font-weight:700;margin-top:4px}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}\nnav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;gap:10px;padding:10px 16px;justify-content:center}\nnav.bar button{flex:1;max-width:260px}\n@media(prefers-reduced-motion:reduce){.flow i{animation:none}}\n<\/style>\n<\/head>\n<body>\n<header>\n<h1>⚡ Tok manbalari · 8-sinf fizika<\/h1>\n<div class=\"menu\" id=\"menu\"><\/div>\n<\/header>\n<main>\n\n<section class=\"slide\" data-t=\"1. Umumiy tushuncha\">\n<h2>1. Tok manbai va uning vazifasi<\/h2>\n<p class=\"goal\">Maqsad: tok manbasi zanjirda nima uchun kerakligini tushunish.<\/p>\n<p><b>Tok manbai<\/b> — elektr maydon hosil qiladigan qurilma. Bu maydon sim ichidagi erkin elektronlarni tartibli harakatga keltiradi, natijada zanjirda elektr toki paydo bo‘ladi. Manbaning ikkita qutbi bor: <span class=\"pl\">musbat (+)<\/span> va <span class=\"mn\">manfiy (−)<\/span>.<\/p>\n<div class=\"card\">\n<canvas id=\"c1\" width=\"400\" height=\"200\" aria-label=\"Manba, lampochka va kalitdan iborat zanjir\"><\/canvas>\n<p class=\"status\" id=\"t1\" aria-live=\"polite\"><\/p>\n<div class=\"ctl\"><button id=\"b1\"><\/button><\/div>\n<\/div>\n<div class=\"know\"><h3>Bilib oling<\/h3>\n<p>• Tok manbai elektr maydon hosil qiladi va zaryadlarni harakatga keltiradi.<br>\n• Elektronlar manfiy (−) qutbdan musbat (+) qutb tomon harakatlanadi.<br>\n• Tokning an’anaviy yo‘nalishi esa + dan − tomon (u elektronlar harakatiga teskari).<\/p><\/div>\n<h3>Mini-savollar<\/h3><div id=\"q1\"><\/div>\n<\/section>\n\n<section class=\"slide\" data-t=\"2. Turlari va tuzilishi\">\n<h2>2. Tok manbalarining turlari va tuzilishi<\/h2>\n<p class=\"goal\">Maqsad: tok manbalarining turlarini va ularda qaysi energiya elektr energiyasiga aylanishini bilish.<\/p>\n<div class=\"card\">\n<div class=\"ctl\" id=\"types\" style=\"margin:0 0 10px\"><\/div>\n<canvas id=\"c2\" width=\"400\" height=\"220\" aria-label=\"Tanlangan manbaning ichki tuzilishi\"><\/canvas>\n<div class=\"flow\" id=\"fl\"><\/div>\n<p class=\"status\" id=\"t2\" aria-live=\"polite\"><\/p>\n<\/div>\n<div class=\"know\"><h3>Bilib oling<\/h3>\n<p>• Galvanik element va akkumulyatorda kimyoviy energiya elektr energiyasiga aylanadi.<br>\n• Generatorda mexanik energiya, quyosh batareyasida yorug‘lik energiyasi elektr energiyasiga aylanadi.<br>\n• Akkumulyatorni qayta zaryadlash mumkin, galvanik elementni esa yo‘q.<\/p><\/div>\n<h3>Mini-savollar<\/h3><div id=\"q2\"><\/div>\n<\/section>\n\n<section class=\"slide\" data-t=\"3. Ishlatilishi\">\n<h2>3. Tok manbalarining ishlatilishi va ahamiyati<\/h2>\n<p class=\"goal\">Maqsad: manbasiz zanjirda tok bo‘lmasligini va manbalar soni yorqinlikka ta’sirini ko‘rish.<\/p>\n<ul class=\"chips\">\n<li>📺 <b>Pult<\/b> — galvanik element<\/li>\n<li>📱 <b>Telefon<\/b> — akkumulyator<\/li>\n<li>🚗 <b>Avtomobil<\/b> — akkumulyator va generator<\/li>\n<li>🏭 <b>Elektr stansiya<\/b> — generator<\/li>\n<li>☀️ <b>Quyosh paneli<\/b> — quyosh batareyasi<\/li><\/ul>\n<p><b>Zanjir qismlari:<\/b> manba (energiya beradi), iste’molchi (lampochka — energiyani ishlatadi), kalit (zanjirni ulaydi va uzadi), simlar (qismlarni bog‘laydi).<\/p>\n<div class=\"card\">\n<p style=\"margin:0 0 8px\">Zanjirni o‘zingiz yig‘ing: qismlarni ulang yoki olib tashlang.<\/p>\n<canvas id=\"c3\" width=\"400\" height=\"200\" aria-label=\"Zanjirni yig‘ish simulyatsiyasi\"><\/canvas>\n<div class=\"ctl\" id=\"p3\"><\/div>\n<div class=\"ctl\" id=\"n3\"><\/div>\n<p class=\"status\" id=\"t3\" aria-live=\"polite\"><\/p>\n<\/div>\n<div class=\"know\"><h3>Bilib oling<\/h3>\n<p>• Manbasiz zanjirda tok bo‘lmaydi.<br>\n• Zanjir yopiq bo‘lishi kerak: manba, iste’molchi, kalit va simlar.<br>\n• Elementlar ketma-ket ulansa, lampochka yorqinroq yonadi.<\/p><\/div>\n<h3>Mini-savollar<\/h3><div id=\"q3\"><\/div>\n<\/section>\n\n<section class=\"slide\" data-t=\"4. Yakuniy test\">\n<h2>Yakuniy mustahkamlash<\/h2>\n<p class=\"goal\">Maqsad: o‘tilgan mavzuni 5 ta test bilan tekshirish.<\/p>\n<div id=\"qf\"><\/div>\n<p class=\"status\" id=\"score\" aria-live=\"polite\"><\/p>\n<div class=\"know\"><h3>Qisqa xulosa<\/h3>\n<p>Tok manbai elektr maydon hosil qilib, zaryadlarni harakatga keltiradi. Manbalar turlari: galvanik element, akkumulyator, generator va quyosh batareyasi. Manbasiz zanjirda tok bo‘lmaydi, ketma-ket ulangan elementlar soni ortsa, lampochka yorqinroq yonadi.<\/p><\/div>\n<\/section>\n\n<\/main>\n<nav class=\"bar\"><button id=\"prev\">‹ Oldingi<\/button><button id=\"next\">Keyingi ›<\/button><\/nav>\n\n<script>\nconst $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];\nconst css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\n\n/* ---------- Navigatsiya ---------- */\nconst S=$$('.slide');let cur=0;\nS.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.dataset.t;b.onclick=()=>go(i);$('#menu').append(b)});\nfunction go(i){cur=Math.max(0,Math.min(S.length-1,i));S.forEach((s,k)=>s.hidden=k!==cur);\n$$('#menu button').forEach((b,k)=>b.setAttribute('aria-current',k===cur));\n$('#prev').disabled=cur==0;$('#next').disabled=cur==S.length-1;scrollTo(0,0)}\n$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);\naddEventListener('keydown',e=>{if(e.key=='ArrowRight')go(cur+1);if(e.key=='ArrowLeft')go(cur-1)});\n\n/* ---------- Savollar ---------- */\nconst Q={\nq1:[['Tok manbasining asosiy vazifasi nima?',['Zaryadlarni yo‘qotish','Elektr maydon hosil qilib, zaryadlarni harakatga keltirish','Simni qizdirish'],1],\n['Elektronlar zanjirda qaysi yo‘nalishda harakatlanadi?',['Musbat qutbdan manfiy qutbga','Manfiy qutbdan musbat qutbga','Joyida turadi'],1]],\nq2:[['Generatorda qaysi energiya elektr energiyasiga aylanadi?',['Yorug‘lik energiyasi','Kimyoviy energiya','Mexanik energiya'],2],\n['Quyosh batareyasi qaysi energiyani elektr energiyasiga aylantiradi?',['Yorug‘lik energiyasini','Mexanik energiyani','Issiqlik energiyasini'],0]],\nq3:[['Manbasiz zanjirda tok bo‘ladimi?',['Ha, agar lampochka bo‘lsa','Yo‘q, chunki zaryadlarni harakatga keltiruvchi elektr maydon yo‘q','Ha, agar kalit ulangan bo‘lsa'],1],\n['3 ta element ketma-ket ulansa, lampochka yorqinligi qanday o‘zgaradi?',['Kamayadi','O‘zgarmaydi','Ortadi'],2]],\nqf:[['Tok manbasining qutblari qanday belgilanadi?',['Plyus (+) va minus (−)','Qizil va ko‘k','Katta va kichik'],0],\n['Akkumulyator galvanik elementdan nimasi bilan farq qiladi?',['Uni qayta zaryadlash mumkin','U energiya bermaydi','U faqat quyoshda ishlaydi'],0],\n['Televizor pulti uchun qaysi manba mos?',['Generator','Galvanik element (batareyka)','Quyosh paneli'],1],\n['Elektr zanjirida kalitning vazifasi nima?',['Tok hosil qilish','Zanjirni ulash va uzish','Lampochkani yoritish'],1],\n['Elektr stansiyalarida qaysi manba ishlatiladi?',['Galvanik element','Quyosh batareyasi faqat','Generator'],2]]};\nfunction chk(id,i){const q=Q[id][i],v=$(`input[name=${id}${i}]:checked`),r=$(`#${id}r${i}`);\nif(!v){r.textContent='Avval javobni tanlang.';r.className='res';return 0}\nconst ok=+v.value===q[2];r.textContent=ok?'To‘g‘ri! ✓':'Noto‘g‘ri. To‘g‘ri javob: '+q[1][q[2]];r.className='res '+(ok?'ok':'bad');return ok?1:0}\nfor(const id in Q){$('#'+id).innerHTML=Q[id].map((q,i)=>`<fieldset><legend>${i+1}. ${q[0]}<\/legend>${q[1].map((o,j)=>`<label><input type=\"radio\" name=\"${id}${i}\" value=\"${j}\">${o}<\/label>`).join('')}<div class=\"res\" id=\"${id}r${i}\" aria-live=\"polite\"><\/div>${id=='qf'?'':`<button onclick=\"chk('${id}',${i})\">Javobni tekshirish<\/button>`}<\/fieldset>`).join('')\n+(id=='qf'?'<button id=\"fin\" style=\"width:100%\">Natijani tekshirish<\/button>':'')}\n$('#fin').onclick=()=>{let n=0;Q.qf.forEach((_,i)=>n+=chk('qf',i));\n$('#score').textContent=`Natija: ${n} / 5 — `+(n==5?'Ajoyib, mavzuni mukammal o‘zlashtirdingiz!':n>=3?'Yaxshi! Xato javoblarni qayta ko‘rib chiqing.':'Mavzuni qayta takrorlab, yana urinib ko‘ring.')};\n\n/* ---------- Yordamchi chizish ---------- */\nfunction pp(P,f){const L=[];let T=0;for(let i=0;i<P.length-1;i++){const l=Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]);L.push(l);T+=l}\nlet d=(((f%1)+1)%1)*T,k=0;while(k<L.length-1&&d>L[k]){d-=L[k];k++}const a=P[k],b=P[k+1],q=d/L[k];return[a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q]}\nfunction dots(x,P,ph,n,al,skip){const el=css('--el');for(let i=0;i<n;i++){const[px,py]=pp(P,i/n+ph);if(skip&&skip(px,py))continue;\nx.globalAlpha=al;x.fillStyle=el;x.beginPath();x.arc(px,py,7,0,7);x.fill();x.fillStyle='#fff';x.fillRect(px-3.5,py-1,7,2)}x.globalAlpha=1}\nfunction bulb(x,px,py,g){const lp=css('--lamp');if(g>0){const r=x.createRadialGradient(px,py,3,px,py,26+16*g);r.addColorStop(0,lp);r.addColorStop(1,'rgba(255,200,60,0)');\nx.globalAlpha=Math.min(1,.4+.6*g);x.fillStyle=r;x.beginPath();x.arc(px,py,26+16*g,0,7);x.fill()}\nx.globalAlpha=1;x.fillStyle=css('--card');x.beginPath();x.arc(px,py,15,0,7);x.fill();\nif(g>0){x.globalAlpha=.3+.7*g;x.fillStyle=lp;x.fill();x.globalAlpha=1}\nx.strokeStyle=css('--ink');x.lineWidth=3;x.beginPath();x.arc(px,py,15,0,7);x.stroke();\nx.beginPath();x.moveTo(px-7,py+6);x.lineTo(px-4,py-3);x.lineTo(px,py+4);x.lineTo(px+4,py-3);x.lineTo(px+7,py+6);x.stroke()}\nfunction dashBox(x,a,b,c,d,t){x.save();x.setLineDash([4,4]);x.lineWidth=2;x.strokeStyle=css('--mut');x.strokeRect(a,b,c,d);x.fillStyle=css('--mut');x.font='12px system-ui';x.textAlign='center';x.fillText(t,a+c/2,b+d+14);x.restore()}\n\n/* ---------- Zanjir simulyatsiyasi (1 va 3-bo‘lim) ---------- */\nfunction circ(cv,s,dt){const x=cv.getContext('2d'),bg=css('--card'),ink=css('--ink');\nconst flow=s.n>0&&s.lamp&&s.sw=='closed';if(flow)s.ph=((s.ph||0)+dt*.09*s.n)%1;\nx.clearRect(0,0,400,200);x.lineCap='round';x.lineWidth=4;x.strokeStyle=ink;x.strokeRect(40,40,320,120);\nconst gap=(a,b,c,d)=>{x.fillStyle=bg;x.fillRect(a,b,c,d)};\n/* manba */\ngap(24,64,32,72);\nif(s.n>0){for(let i=0;i<s.n;i++){const y=100-s.n*7+i*14;x.strokeStyle=ink;x.lineWidth=4;x.beginPath();x.moveTo(26,y+3);x.lineTo(54,y+3);x.stroke();\nx.lineWidth=7;x.beginPath();x.moveTo(32,y+10);x.lineTo(48,y+10);x.stroke()}\nconst y0=100-s.n*7;x.font='bold 22px system-ui';x.textAlign='left';x.fillStyle=css('--plus');x.fillText('+',62,y0+10);x.fillStyle=css('--el');x.fillText('−',62,y0+s.n*14+4)}\nelse dashBox(x,28,76,24,48,'manba yo‘q');\n/* lampochka */\ngap(185,25,30,30);\nif(s.lamp)bulb(x,200,40,flow?s.n/3:0);else dashBox(x,186,28,28,24,'lampochka yo‘q');\n/* kalit */\ngap(344,78,32,44);\nif(s.sw=='absent')dashBox(x,348,82,24,36,'kalit yo‘q');\nelse{x.fillStyle=ink;[[360,82],[360,118]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],5,0,7);x.fill()});\nx.lineWidth=4;x.strokeStyle=ink;x.beginPath();x.moveTo(360,118);s.sw=='closed'?x.lineTo(360,82):x.lineTo(384,92);x.stroke()}\n/* elektronlar */\nconst P=[[40,160],[360,160],[360,40],[40,40],[40,160]];\ndots(x,P,s.ph||0,14,flow?1:.3,(px,py)=>(px<64&&py>62&&py<138)||(py<58&&px>182&&px<218)||(px>338&&py>76&&py<124));\nif(flow){x.font='bold 15px system-ui';x.textAlign='left';x.fillStyle=css('--plus');x.fillText('I →',92,24);x.fillStyle=css('--el');x.fillText('← e⁻',92,70)}}\n\nconst s1={n:1,lamp:1,sw:'open'};\nfunction u1(){const c=s1.sw=='closed';$('#b1').textContent=c?'Kalitni uzish':'Kalitni ulash';\n$('#t1').textContent=c?'Kalit ulangan: manba elektr maydon hosil qiladi, elektronlar tartibli harakatlanadi, lampochka yonadi.':'Kalit uzilgan: zanjir ochiq, elektronlar tartibsiz turadi, tok yo‘q, lampochka yonmaydi.'}\n$('#b1').onclick=()=>{s1.sw=s1.sw=='closed'?'open':'closed';u1()};u1();\n\nconst s3={n:1,lamp:1,sw:'closed'},st={src:1,cells:1};\n['Manba','Lampochka','Kalit'].forEach((nm,i)=>{const b=document.createElement('button');b.id='p3'+i;b.onclick=()=>{[()=>st.src^=1,()=>s3.lamp^=1,()=>s3.sw=s3.sw=='closed'?'absent':'closed'][i]();u3()};$('#p3').append(b)});\n[1,2,3].forEach(n=>{const b=document.createElement('button');b.id='n3'+n;b.textContent=n+' ta element';b.onclick=()=>{st.cells=n;u3()};$('#n3').append(b)});\nfunction u3(){s3.n=st.src?st.cells:0;const on=[st.src,s3.lamp,s3.sw=='closed'];\n['Manba','Lampochka','Kalit'].forEach((nm,i)=>{const b=$('#p3'+i);b.textContent=nm+(on[i]?': ulangan ✓':': yo‘q ✕');b.className=on[i]?'on':''});\n[1,2,3].forEach(n=>$('#n3'+n).className=st.cells==n?'on':'');\n$('#t3').textContent=!st.src?'Manba yo‘q: zaryadlarni harakatga keltiruvchi elektr maydon hosil bo‘lmaydi, shuning uchun tok yo‘q.':!s3.lamp?'Lampochka yo‘q: zanjir uzilgan, tok yo‘q.':s3.sw=='absent'?'Kalit yo‘q: zanjir uzilgan, tok yo‘q.':`${st.cells} ta element ketma-ket ulangan: lampochka yorqinligi — ${['','kichik','o‘rtacha','yuqori'][st.cells]}.`}\nu3();\n\n/* ---------- Manba turlari (2-bo‘lim) ---------- */\nconst T=[\n{n:'Galvanik element',a:'Kimyoviy energiya',i:'Tuzilishi: ikki xil metall elektrod (masalan, rux va mis) elektrolitga tushirilgan. Kimyoviy reaksiya natijasida elektrodlarda zaryadlar to‘planadi. Misol: batareyka.'},\n{n:'Akkumulyator',a:'Kimyoviy energiya',i:'Tuzilishi: qo‘rg‘oshin plastinalar sulfat kislota eritmasida. Uni tashqi manbadan qayta zaryadlash va ko‘p marta ishlatish mumkin.'},\n{n:'Generator',a:'Mexanik energiya',i:'Tuzilishi: magnit maydonida aylanuvchi g‘altak. G‘altak aylanganda unda elektr toki hosil bo‘ladi. Elektr stansiyalarida turbina generatorni aylantiradi.'},\n{n:'Quyosh batareyasi',a:'Yorug‘lik energiyasi',i:'Tuzilishi: yarimo‘tkazgich plastinalar. Yorug‘lik tushganda ular elektronlarni harakatga keltiradi. Quyosh panellari shunday elementlardan yig‘iladi.'}];\nlet k2=0;\nT.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t.n;b.onclick=()=>{k2=i;u2()};$('#types').append(b)});\nfunction u2(){$$('#types button').forEach((b,i)=>b.className=i==k2?'on':'');\n$('#fl').innerHTML=`<span>${T[k2].a}<\/span><i>➜<\/i><span>Elektr energiya<\/span>`;$('#t2').textContent=T[k2].i}\nu2();\nfunction sim2(cv,k,t){const x=cv.getContext('2d'),ink=css('--ink'),lp=css('--lamp'),mu=css('--mut'),pl=css('--plus'),el=css('--el');\nx.clearRect(0,0,400,220);x.lineWidth=4;x.lineCap='round';x.lineJoin='round';x.strokeStyle=ink;x.textAlign='center';const ph=t*.12;\nif(k<2){x.fillStyle='rgba(60,160,230,.28)';x.fillRect(100,100,200,100);\nx.beginPath();x.moveTo(100,70);x.lineTo(100,200);x.lineTo(300,200);x.lineTo(300,70);x.stroke();\nx.fillStyle=k?'#6b7280':'#9aa5b1';x.fillRect(136,60,20,125);x.fillStyle=k?'#8a4b2a':'#c8742f';x.fillRect(244,60,20,125);\nx.strokeStyle=ink;x.lineWidth=2;x.strokeRect(136,60,20,125);x.strokeRect(244,60,20,125);x.lineWidth=4;\nx.font='bold 22px system-ui';x.fillStyle=el;x.fillText('−',116,60);x.fillStyle=pl;x.fillText('+',284,60);\nx.font='13px system-ui';x.fillStyle=mu;x.fillText('Elektrolit',200,192);x.fillStyle=ink;x.fillText(k?'Pb':'Zn (rux)',146,216);x.fillText(k?'PbO₂':'Cu (mis)',254,216);\nfor(let i=0;i<8;i++){const f=(i/8+t*.1)%1,r=i%4;\nx.fillStyle=pl;x.beginPath();x.arc(165+f*70,115+r*17,6,0,7);x.fill();x.fillStyle='#fff';x.font='bold 11px system-ui';x.fillText('+',165+f*70,119+r*17);\nx.fillStyle='#6a4bd6';x.beginPath();x.arc(235-f*70,124+r*17,6,0,7);x.fill();x.fillStyle='#fff';x.fillText('−',235-f*70,128+r*17)}\nconst P=[[146,60],[146,25],[254,25],[254,60]];x.strokeStyle=ink;x.lineWidth=4;x.beginPath();P.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke();\nbulb(x,200,25,.9);dots(x,P,ph,8,1,(px,py)=>py<42&&px>184&&px<216)}\nelse if(k==2){x.font='bold 22px system-ui';x.fillStyle='#d62839';x.fillRect(30,70,50,90);x.fillStyle='#1e6fd9';x.fillRect(320,70,50,90);\nx.fillStyle='#fff';x.fillText('N',55,125);x.fillText('S',345,125);\nx.setLineDash([8,6]);x.lineWidth=2;x.strokeStyle=mu;[90,115,140].forEach(y=>{x.beginPath();x.moveTo(80,y);x.lineTo(320,y);x.stroke()});x.setLineDash([]);\nconst a=t*2.2,w=Math.abs(Math.cos(a))*70+4;x.strokeStyle=lp;x.lineWidth=7;x.strokeRect(200-w/2,80,w,70);\nx.fillStyle=mu;x.font='14px system-ui';x.fillText('↻ g‘altak aylanadi',200,66);\nx.strokeStyle=ink;x.lineWidth=4;x.beginPath();x.moveTo(200,150);x.lineTo(200,185);x.stroke();bulb(x,200,200,.2+.8*Math.abs(Math.sin(a)))}\nelse{x.fillStyle=lp;x.beginPath();x.arc(55,45,22,0,7);x.fill();x.strokeStyle=lp;x.lineWidth=3;\nfor(let i=0;i<8;i++){const q=i*Math.PI/4;x.beginPath();x.moveTo(55+28*Math.cos(q),45+28*Math.sin(q));x.lineTo(55+38*Math.cos(q),45+38*Math.sin(q));x.stroke()}\nx.setLineDash([8,8]);x.lineDashOffset=-t*40;[0,1,2].forEach(j=>{x.beginPath();x.moveTo(95,60+j*12);x.lineTo(180+j*45,128);x.stroke()});x.setLineDash([]);\nx.fillStyle='#1a3a8a';x.fillRect(150,130,180,26);x.strokeStyle='#8fb0ff';x.lineWidth=1;for(let i=1;i<6;i++){x.beginPath();x.moveTo(150+i*30,130);x.lineTo(150+i*30,156);x.stroke()}\nx.strokeStyle=ink;x.lineWidth=3;x.strokeRect(150,130,180,26);\nconst P=[[150,156],[150,200],[330,200],[330,156]];x.lineWidth=4;x.beginPath();P.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke();\nbulb(x,240,200,.9);dots(x,P,ph,8,1,(px,py)=>py>182&&px>222&&px<258);\nx.font='bold 20px system-ui';x.fillStyle=el;x.fillText('−',132,180);x.fillStyle=pl;x.fillText('+',348,180)}}\n\n/* ---------- Animatsiya sikli ---------- */\nconst c1=$('#c1'),c2=$('#c2'),c3=$('#c3');let last=0;\nfunction loop(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;\nif(c1.offsetParent)circ(c1,s1,dt);if(c3.offsetParent)circ(c3,s3,dt);if(c2.offsetParent)sim2(c2,k2,ts/1000);requestAnimationFrame(loop)}\ngo(0);requestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>\n"}, {"t": "Tok kuchi va uni o‘lchash", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Tok kuchi va uni oʻlchash<\/title>\n<style>\n:root{--bg:#f3f6fb;--card:#fff;--tx:#14213d;--mu:#56627f;--ac:#1d4ed8;--ac2:#e08a00;--ok:#15803d;--bad:#c62828;--bd:#d9e0ee;--wire:#44506b;--cv:#e8f0ff;--el:#2563eb;--okbg:#e3f6e8;--badbg:#fde8e8;color-scheme:light;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0d1322;--card:#172036;--tx:#e8edf8;--mu:#9aa8c7;--ac:#6ea0ff;--ac2:#ffb53d;--ok:#5fd68a;--bad:#ff7b7b;--bd:#2a3654;--wire:#9fb0d3;--cv:#1b2a4a;--el:#79b0ff;--okbg:#12301f;--badbg:#3a1a1e;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#0d1322;--card:#172036;--tx:#e8edf8;--mu:#9aa8c7;--ac:#6ea0ff;--ac2:#ffb53d;--ok:#5fd68a;--bad:#ff7b7b;--bd:#2a3654;--wire:#9fb0d3;--cv:#1b2a4a;--el:#79b0ff;--okbg:#12301f;--badbg:#3a1a1e;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;-webkit-text-size-adjust:100%}\nbody::before{content:\"\";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}\nheader{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 6px;max-width:760px;margin:auto}\nh1{font-size:22px;line-height:1.2;margin:0}\nh2{font-size:19px;margin:0 0 8px}h3{font-size:16px;margin:14px 0 6px}\n.sub{color:var(--mu);font-size:14px;margin:2px 0 0}\nnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 12px;border-bottom:1px solid var(--bd)}\n.tabs{display:flex;gap:6px;max-width:760px;margin:auto}\n.tab{flex:1;min-height:46px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font:600 14px/1.2 inherit;font-family:inherit;cursor:pointer;padding:4px}\n.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}\nmain{max-width:760px;margin:auto;padding:14px 14px 40px}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}\n.def{border-left:5px solid var(--ac);background:var(--cv);padding:10px 14px;border-radius:0 12px 12px 0;margin:10px 0}\ncanvas{width:100%;display:block;background:var(--cv);border-radius:12px}\n.btn{min-height:50px;padding:0 22px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:700 16px inherit;font-family:inherit;cursor:pointer}\n.btn.alt{background:transparent;color:var(--ac);border:2px solid var(--ac)}\n.btn.off{background:var(--bad)}\n.btn:active{transform:scale(.97)}\n.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}\n.sl{margin:10px 0}.sl label{display:flex;justify-content:space-between;font-weight:600}\ninput[type=range]{width:100%;height:44px;accent-color:var(--ac);margin:0}\ninput[type=text]{min-height:50px;font:700 18px inherit;font-family:inherit;width:140px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);padding:0 12px}\n.big{font-size:24px;font-weight:800;color:var(--ac)}\n.bar{height:14px;border-radius:8px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac2);width:0;transition:width .2s}\n.formula{font-size:34px;font-weight:800;text-align:center;letter-spacing:1px;margin:8px 0}\ntable{width:100%;border-collapse:collapse}td,th{padding:9px 6px;border-bottom:1px solid var(--bd);text-align:left}\n.fb{margin-top:8px;padding:10px 12px;border-radius:12px;font-weight:600}.fb:empty{display:none}\n.good{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}\n.seg{display:flex;gap:6px;flex-wrap:wrap}.seg .btn{flex:1;min-width:30%;padding:0 8px;font-size:14px}\n.seg .btn:not(.on){background:transparent;color:var(--ac);border:2px solid var(--ac)}\n#tri{width:100%;max-width:260px;display:block;margin:auto}\n#tri polygon,#tri line{fill:none;stroke:var(--wire);stroke-width:3}\n#tri g{cursor:pointer}#tri circle{fill:var(--cv);stroke:var(--ac);stroke-width:2.5}\n#tri text{fill:var(--tx);font:800 26px system-ui;text-anchor:middle;dominant-baseline:central}\n#tri g.sel circle{fill:var(--ac)}#tri g.sel text{fill:#fff}\n.q{padding:12px 0;border-bottom:1px solid var(--bd)}.q p{margin:0 0 8px;font-weight:700}\n.q .btn{display:block;width:100%;margin:6px 0;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd)}\n.q .btn.ok{border-color:var(--ok);background:var(--okbg)}.q .btn.no{border-color:var(--bad);background:var(--badbg)}\n.rem li{margin:8px 0}\nul,ol{padding-left:20px;margin:6px 0}\n@media (prefers-reduced-motion:reduce){.bar i{transition:none}}\n<\/style>\n<\/head>\n<body>\n<header><div><h1>Tok kuchi va uni oʻlchash<\/h1><p class=\"sub\">Fizika, 8-sinf · interaktiv dars<\/p><\/div><button class=\"btn alt\" id=\"th\" aria-label=\"Rejimni almashtirish\">◐<\/button><\/header>\n<nav><div class=\"tabs\">\n<button class=\"tab on\" data-t=\"s1\">1. Tok<\/button><button class=\"tab\" data-t=\"s2\">2. Formula<\/button><button class=\"tab\" data-t=\"s3\">3. Ampermetr<\/button><button class=\"tab\" data-t=\"s4\">Yakun<\/button>\n<\/div><\/nav>\n<main>\n\n<section class=\"sec\" id=\"s1\">\n<div class=\"card\"><h2>Elektr toki nima?<\/h2>\n<div class=\"def\"><b>Elektr toki<\/b> — zaryadlangan zarralarning tartibli (yoʻnalgan) harakatidir. Metallarda bu zarralar — erkin elektronlar.<\/div>\n<canvas id=\"c1\" data-h=\"230\"><\/canvas>\n<div class=\"row\"><button class=\"btn\" id=\"pw\">Manbani ulash<\/button><\/div>\n<div class=\"sl\"><label>Kuchlanish U <span id=\"v1o\">6 V<\/span><\/label><input type=\"range\" id=\"v1\" min=\"1\" max=\"12\" step=\"1\" value=\"6\"><\/div>\n<div>Tok kuchi: <span class=\"big\" id=\"i1\">0 A<\/span><\/div><div class=\"bar\"><i id=\"b1\"><\/i><\/div>\n<p class=\"sub\">Kuchlanish oshsa, elektronlar tezroq oqadi va tok kuchi ortadi (bu yerda qarshilik R = 6 Ω).<\/p>\n<p><b>Eslatma:<\/b> tok yoʻnalishi sifatida shartli ravishda <b>+ dan − ga<\/b> yoʻnalish qabul qilingan. Elektronlar esa teskari — <b>− dan + ga<\/b> harakatlanadi.<\/p><\/div>\n<div class=\"card\"><h2>Suv oqimi bilan oʻxshatish<\/h2>\n<canvas id=\"cw\" data-h=\"110\"><\/canvas>\n<ul><li>Nasos ↔ tok manbai<\/li><li>Suv zarralari ↔ elektronlar<\/li><li>Quvur kesimidan oʻtgan suv ↔ oʻtkazgich kesimidan oʻtgan zaryad<\/li><\/ul>\n<p class=\"sub\">Nasos kuchliroq (kuchlanish katta) boʻlsa, suv oqimi ham kuchli boʻladi.<\/p><\/div>\n<div class=\"card\"><h2>Tok kuchi<\/h2>\n<div class=\"def\"><b>Tok kuchi<\/b> — oʻtkazgichning koʻndalang kesimidan <b>1 sekundda<\/b> oʻtgan zaryad miqdori.<\/div><\/div>\n<\/section>\n\n<section class=\"sec\" id=\"s2\" hidden>\n<div class=\"card\"><h2>Formula<\/h2>\n<div class=\"formula\">I = q / t<\/div>\n<ul><li><b>I<\/b> — tok kuchi (amper, A)<\/li><li><b>q<\/b> — zaryad miqdori (kulon, Kl)<\/li><li><b>t<\/b> — vaqt (sekund, s)<\/li><\/ul>\n<h3>Birlik: amper (A)<\/h3>\n<p>Andre-Mari Amper (1775–1836) — fransuz fizigi, elektr va magnitlanish hodisalarini oʻrgangan olim. Tok kuchi birligi uning nomi bilan atalgan.<\/p>\n<table><tr><th>Birlik<\/th><th>Amperda<\/th><\/tr><tr><td>1 kA (kiloamper)<\/td><td>1000 A<\/td><\/tr><tr><td>1 A (amper)<\/td><td>1 A<\/td><\/tr><tr><td>1 mA (milliamper)<\/td><td>0,001 A<\/td><\/tr><tr><td>1 µA (mikroamper)<\/td><td>0,000001 A<\/td><\/tr><\/table><\/div>\n\n<div class=\"card\"><h2>Simulyatsiya<\/h2>\n<canvas id=\"c2\" data-h=\"150\"><\/canvas>\n<div class=\"sl\"><label>Zaryad q <span id=\"qo\">20 Kl<\/span><\/label><input type=\"range\" id=\"q\" min=\"1\" max=\"60\" value=\"20\"><\/div>\n<div class=\"sl\"><label>Vaqt t <span id=\"to\">5 s<\/span><\/label><input type=\"range\" id=\"t\" min=\"1\" max=\"20\" value=\"5\"><\/div>\n<div class=\"def\" style=\"text-align:center\"><span class=\"big\" id=\"i2\"><\/span><\/div>\n<p class=\"sub\">Zarralar soni q ga, tezligi esa I ga mos: zaryad koʻp va vaqt kam boʻlsa, tok kuchi katta.<\/p><\/div>\n\n<div class=\"card\"><h2>Formula uchburchagi<\/h2>\n<p class=\"sub\">Topmoqchi boʻlgan kattalikni bosing (u “yopiladi”).<\/p>\n<svg id=\"tri\" viewBox=\"0 0 240 170\"><polygon points=\"120,8 232,162 8,162\"/><line x1=\"62\" y1=\"90\" x2=\"178\" y2=\"90\"/>\n<g data-v=\"q\"><circle cx=\"120\" cy=\"56\" r=\"27\"/><text x=\"120\" y=\"56\">q<\/text><\/g>\n<g data-v=\"I\"><circle cx=\"66\" cy=\"128\" r=\"27\"/><text x=\"66\" y=\"128\">I<\/text><\/g>\n<g data-v=\"t\"><circle cx=\"174\" cy=\"128\" r=\"27\"/><text x=\"174\" y=\"128\">t<\/text><\/g><\/svg>\n<div class=\"formula\" id=\"triO\">I = q / t<\/div><p class=\"sub\" id=\"triT\" style=\"text-align:center\">Uchburchakdagi harfni bosing.<\/p><\/div>\n\n<div class=\"card\"><h2>Misollar<\/h2>\n<h3>1-misol<\/h3><p>Oʻtkazgich kesimidan 10 s da 30 Kl zaryad oʻtdi. Tok kuchi qancha?<\/p>\n<p><b>Berilgan:<\/b> q = 30 Kl, t = 10 s.<br><b>Yechish:<\/b> I = q / t = 30 / 10 = <b>3 A<\/b>.<\/p>\n<h3>2-misol<\/h3><p>Lampochkadagi tok kuchi 0,5 A. 20 s davomida kesimdan qancha zaryad oʻtadi?<\/p>\n<p><b>Berilgan:<\/b> I = 0,5 A, t = 20 s.<br><b>Yechish:<\/b> q = I · t = 0,5 · 20 = <b>10 Kl<\/b>.<\/p>\n<h3>Oʻzingiz yeching<\/h3><p id=\"ex2q\"><\/p>\n<div class=\"row\"><input type=\"text\" id=\"ex2a\" inputmode=\"decimal\" placeholder=\"q = ? Kl\"><button class=\"btn\" id=\"ex2c\">Tekshirish<\/button><button class=\"btn alt\" id=\"ex2n\">Yangi mashq<\/button><\/div><div class=\"fb\" id=\"ex2r\"><\/div><\/div>\n<\/section>\n\n<section class=\"sec\" id=\"s3\" hidden>\n<div class=\"card\"><h2>Ampermetr<\/h2>\n<div class=\"row\"><svg width=\"56\" height=\"56\" viewBox=\"0 0 56 56\" aria-hidden=\"true\"><circle cx=\"28\" cy=\"28\" r=\"22\" fill=\"var(--card)\" stroke=\"var(--ac)\" stroke-width=\"3.5\"/><text x=\"28\" y=\"35\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"var(--tx)\" font-family=\"system-ui\">A<\/text><\/svg><div><b>Ampermetr<\/b> — tok kuchini oʻlchaydigan asbob. Belgisi: doira ichida “A”.<\/div><\/div>\n<ol><li>Ampermetr zanjirga <b>ketma-ket<\/b> ulanadi.<\/li><li>“+” qisqich manbaning musbat qutbi tomoniga, “−” qisqich manfiy tomoniga ulanadi.<\/li><li>Ichki qarshiligi juda kichik, shuning uchun parallel ulab boʻlmaydi.<\/li><li>Tok shkaladan oshmasligi kerak.<\/li><\/ol>\n<div class=\"def\"><b>Boʻlinma narxi<\/b> = (katta qiymat − kichik qiymat) / boʻlinmalar soni.<br>Quyidagi shkalada 0 dan 1 A gacha 5 ta boʻlinma: (1 − 0) / 5 = <b>0,2 A<\/b>.<\/div><\/div>\n\n<div class=\"card\"><h2>Elektr zanjir<\/h2>\n<canvas id=\"c3\" data-h=\"250\"><\/canvas>\n<div class=\"row\"><button class=\"btn\" id=\"sw\">Kalitni ulash<\/button><\/div>\n<div class=\"seg\" id=\"mode\"><button class=\"btn on\" data-m=\"ok\">Ketma-ket<\/button><button class=\"btn\" data-m=\"par\">Parallel<\/button><button class=\"btn\" data-m=\"rev\">Qutblar teskari<\/button><\/div>\n<div class=\"sl\"><label>Kuchlanish U <span id=\"uo\">6 V<\/span><\/label><input type=\"range\" id=\"u\" min=\"1\" max=\"12\" value=\"6\"><\/div>\n<div class=\"sl\"><label>Qarshilik R <span id=\"ro\">6 Ω<\/span><\/label><input type=\"range\" id=\"r\" min=\"2\" max=\"20\" value=\"6\"><\/div>\n<canvas id=\"c3g\" data-h=\"180\"><\/canvas>\n<div style=\"text-align:center;margin:8px 0\"><span class=\"big\" id=\"dig\"><\/span><\/div>\n<div class=\"fb\" id=\"warn\"><\/div><\/div>\n\n<div class=\"card\"><h2>Strelkani oʻqing<\/h2>\n<p class=\"sub\">Shkala 0 dan 6 A gacha, boʻlinma narxi 0,2 A.<\/p>\n<canvas id=\"c3r\" data-h=\"180\"><\/canvas>\n<div class=\"row\"><input type=\"text\" id=\"ex3a\" inputmode=\"decimal\" placeholder=\"I = ? A\"><button class=\"btn\" id=\"ex3c\">Tekshirish<\/button><button class=\"btn alt\" id=\"ex3n\">Yangi<\/button><\/div><div class=\"fb\" id=\"ex3r\"><\/div><\/div>\n<\/section>\n\n<section class=\"sec\" id=\"s4\" hidden>\n<div class=\"card\"><h2>Test<\/h2><div id=\"quiz\"><\/div><div class=\"fb\" id=\"res\"><\/div><div class=\"row\"><button class=\"btn alt\" id=\"rs\" hidden>Qayta boshlash<\/button><\/div><\/div>\n<div class=\"card\"><h2>Esda saqla<\/h2><ul class=\"rem\">\n<li>Elektr toki — zaryadlangan zarralarning tartibli harakati; uning yoʻnalishi + dan − ga qabul qilingan.<\/li>\n<li>Tok kuchi I = q / t; birligi — amper (A). Bundan q = I · t va t = q / I.<\/li>\n<li>1 kA = 1000 A, 1 mA = 0,001 A, 1 µA = 0,000001 A.<\/li>\n<li>Ampermetr zanjirga ketma-ket ulanadi, “+” qisqich manbaning musbat qutbi tomonga qaraydi.<\/li><\/ul><\/div>\n<\/section>\n<\/main>\n\n<script>\nconst $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];\nconst fmt=(v,d=2)=>{let s=(+v).toFixed(d);if(s.includes('.'))s=s.replace(/\\.?0+$/,'');return s.replace('.',',')};\nconst num=v=>parseFloat(String(v).trim().replace(',','.'));\nconst rnd=(a,b)=>a+Math.random()*(b-a);\nconst TP=Math.PI*2;\nlet K={};\nfunction colors(){const s=getComputedStyle(document.documentElement);for(const k of['tx','mu','ac','ac2','bd','wire','cv','card','ok','bad','el'])K[k]=s.getPropertyValue('--'+k).trim()}\nfunction fit(c){const w=c.clientWidth;if(!w)return null;const h=+c.dataset.h,d=window.devicePixelRatio||1;\n if(c._w!==w){c.width=Math.round(w*d);c.height=Math.round(h*d);c.style.height=h+'px';c._w=w}\n const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);return{x,w,h}}\nfunction line(x,a,b,c,d,col,w){x.strokeStyle=col;x.lineWidth=w||3;x.lineCap='round';x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke()}\nfunction rr(x,a,b,c,d,r){x.beginPath();x.roundRect?x.roundRect(a,b,c,d,r):x.rect(a,b,c,d)}\nfunction txt(x,t,a,b,col,size,al,wt){x.fillStyle=col;x.font=(wt||600)+' '+size+'px system-ui,sans-serif';x.textAlign=al||'center';x.textBaseline='middle';x.fillText(t,a,b)}\nfunction arrow(x,x1,x2,y,col,t,dy){line(x,x1,y,x2,y,col,3);const s=x2>x1?-1:1;x.fillStyle=col;x.beginPath();x.moveTo(x2,y);x.lineTo(x2+s*11,y-6);x.lineTo(x2+s*11,y+6);x.fill();txt(x,t,(x1+x2)/2,y+dy,col,12.5)}\n\n/* tema va tablar */\n$('#th').onclick=()=>{const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};\n$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(t=>t.classList.toggle('on',t===b));$$('.sec').forEach(s=>s.hidden=s.id!==b.dataset.t);scrollTo({top:0})});\n\n/* 1-bo'lim */\nconst S1={on:false,V:6,els:Array.from({length:34},()=>({x:Math.random(),y:Math.random(),a:rnd(0,TP),s:rnd(.05,.1)})),dr:Array.from({length:18},()=>({x:Math.random(),y:Math.random()}))};\nfunction upd1(){const I=S1.on?S1.V/6:0;$('#v1o').textContent=S1.V+' V';$('#i1').textContent=fmt(I)+' A';$('#b1').style.width=I/2*100+'%'}\n$('#pw').onclick=()=>{S1.on=!S1.on;$('#pw').textContent=S1.on?'Manbani uzish':'Manbani ulash';$('#pw').classList.toggle('off',S1.on);upd1()};\n$('#v1').oninput=e=>{S1.V=+e.target.value;upd1()};\nfunction draw1(dt){const f=fit($('#c1'));if(!f)return;const{x,w,h}=f;\n const x0=64,x1=w-64,y0=64,y1=h-64,ww=x1-x0,hh=y1-y0;\n x.fillStyle=K.card;x.strokeStyle=K.wire;x.lineWidth=3;rr(x,x0,y0,ww,hh,14);x.fill();x.stroke();\n x.fillStyle=K.mu;x.globalAlpha=.35;for(let i=0;i<8;i++)for(let j=0;j<3;j++){x.beginPath();x.arc(x0+ww*(i+.5)/8,y0+hh*(j+.5)/3,6,0,TP);x.fill()}x.globalAlpha=1;\n const dr=S1.on?S1.V*.03:0;\n for(const e of S1.els){e.a+=rnd(-1,1)*9*dt;e.x+=(Math.cos(e.a)*e.s*80/ww+dr)*dt;e.y+=Math.sin(e.a)*e.s*80/hh*dt;\n  if(e.x>1)e.x-=1;if(e.x<0)e.x+=1;if(e.y<.07||e.y>.93){e.a=-e.a;e.y=Math.min(.93,Math.max(.07,e.y))}\n  const px=x0+e.x*ww,py=y0+e.y*hh;x.fillStyle=K.el;x.beginPath();x.arc(px,py,5.5,0,TP);x.fill();line(x,px-3,py,px+3,py,'#fff',1.6)}\n for(const[a,s,c]of[[x0-32,'−',K.el],[x1+32,'+',K.bad]]){x.fillStyle=c;x.beginPath();x.arc(a,h/2,19,0,TP);x.fill();txt(x,s,a,h/2,'#fff',24,'center',800)}\n line(x,x0-13,h/2,x0,h/2,K.wire);line(x,x1,h/2,x1+13,h/2,K.wire);\n if(S1.on){arrow(x,x0+30,x1-30,26,K.el,'elektronlar: − dan +',-0+17);arrow(x,x1-30,x0+30,h-26,K.ac2,'tok yoʻnalishi: + dan −',-17)}\n else txt(x,'Manba ulanmagan: elektronlar tartibsiz harakatlanadi',w/2,26,K.mu,13)}\nconst W={d:Array.from({length:18},()=>({x:Math.random(),y:Math.random()}))};\nfunction drawW(dt){const f=fit($('#cw'));if(!f)return;const{x,w,h}=f;const x0=78,x1=w-20,y0=28,y1=78;\n x.fillStyle=K.card;x.strokeStyle=K.wire;x.lineWidth=3;rr(x,x0,y0,x1-x0,y1-y0,10);x.fill();x.stroke();\n rr(x,10,y0-6,58,y1-y0+12,10);x.fillStyle=K.ac;x.fill();txt(x,'Nasos',39,53,'#fff',13,'center',700);\n const sp=S1.on?S1.V*.03:0;x.fillStyle=K.ac;\n for(const d of W.d){d.x=(d.x+sp*dt)%1;x.beginPath();x.arc(x0+10+d.x*(x1-x0-20),y0+8+d.y*(y1-y0-16),5,0,TP);x.fill()}\n if(S1.on)arrow(x,x0+20,x1-20,h-14,K.ac,'suv oqimi',-0+0);}\n\n/* 2-bo'lim */\nconst P2=Array.from({length:30},(_,i)=>({x:Math.random(),y:((i*37)%100)/100}));\nconst S2={q:20,t:5};\nfunction upd2(){S2.q=+$('#q').value;S2.t=+$('#t').value;$('#qo').textContent=S2.q+' Kl';$('#to').textContent=S2.t+' s';\n $('#i2').textContent='I = '+S2.q+' / '+S2.t+' = '+fmt(S2.q/S2.t)+' A'}\n$('#q').oninput=$('#t').oninput=upd2;\nfunction draw2(dt){const f=fit($('#c2'));if(!f)return;const{x,w,h}=f;const I=S2.q/S2.t,n=Math.min(30,Math.max(2,Math.round(S2.q/2))),v=Math.min(480,25+I*18);\n x.fillStyle=K.card;x.strokeStyle=K.wire;x.lineWidth=3;rr(x,8,28,w-16,100,12);x.fill();x.stroke();\n for(let i=0;i<n;i++){const p=P2[i];p.x=(p.x+v/w*dt)%1;x.fillStyle=K.el;x.beginPath();x.arc(8+p.x*(w-16),40+p.y*76,6,0,TP);x.fill();line(x,8+p.x*(w-16)-3.2,40+p.y*76,8+p.x*(w-16)+3.2,40+p.y*76,'#fff',1.6)}\n x.setLineDash([6,5]);line(x,w/2,20,w/2,136,K.ac2,2.5);x.setLineDash([]);txt(x,'kesim',w/2,12,K.ac2,12.5);\n txt(x,'zarralar soni ~ q,  tezlik ~ I',w/2,h-12,K.mu,12.5)}\nconst TRI={I:['I = q / t','I ni yopsak, q va t qoladi: q chiziq ustida, t ostida — boʻlinadi.'],q:['q = I · t','q ni yopsak, I va t yonma-yon qoladi — koʻpaytiriladi.'],t:['t = q / I','t ni yopsak, q ustida, I ostida qoladi — boʻlinadi.']};\n$$('#tri g').forEach(g=>g.onclick=()=>{$$('#tri g').forEach(o=>o.classList.toggle('sel',o===g));const a=TRI[g.dataset.v];$('#triO').textContent=a[0];$('#triT').textContent=a[1]});\nlet ex2;function new2(){const I=[.5,1.5,2,2.5,4][Math.floor(Math.random()*5)],t=[2,4,5,10][Math.floor(Math.random()*4)];ex2={I,t,q:I*t};\n $('#ex2q').textContent='Tok kuchi '+fmt(I)+' A. '+t+' s davomida kesimdan qancha zaryad oʻtadi?';$('#ex2a').value='';$('#ex2r').textContent='';$('#ex2r').className='fb'}\nfunction fb(el,ok,m){el.textContent=m;el.className='fb '+(ok?'good':'bad')}\n$('#ex2c').onclick=()=>{const v=num($('#ex2a').value);const r=$('#ex2r');if(isNaN(v))return fb(r,false,'Javobni raqam bilan kiriting.');\n Math.abs(v-ex2.q)<1e-6?fb(r,true,'✓ Toʻgʻri! q = I · t = '+fmt(ex2.I)+' · '+ex2.t+' = '+fmt(ex2.q)+' Kl'):fb(r,false,'✗ Qayta urinib koʻring. Maslahat: q = I · t.')};\n$('#ex2n').onclick=new2;\n\n/* 3-bo'lim */\nconst S3={sw:false,mode:'ok',U:6,R:6,a:-60,off:0};\nconst cur=()=>S3.sw?S3.U/S3.R:0;\nfunction upd3(){S3.U=+$('#u').value;S3.R=+$('#r').value;$('#uo').textContent=S3.U+' V';$('#ro').textContent=S3.R+' Ω';\n $('#sw').textContent=S3.sw?'Kalitni uzish':'Kalitni ulash';$('#sw').classList.toggle('off',S3.sw);\n const m=S3.mode,w=$('#warn'),d=$('#dig'),I=cur();\n if(m==='par'){d.textContent=S3.sw?'Qisqa tutashuv!':'I = 0 A';w.className='fb bad';w.textContent='⚠ Ampermetr rezistorga parallel ulandi! Uning qarshiligi juda kichik, shuning uchun butun tok u orqali oʻtadi (qisqa tutashuv) va asbob kuyib qolishi mumkin. Ampermetr doim ketma-ket ulanadi.'}\n else if(m==='rev'){d.textContent=S3.sw?'Strelka teskari ogʻdi':'I = 0 A';w.className='fb bad';w.textContent='⚠ Qutblar teskari! Tok ampermetrning “+” qisqichidan emas, “−” qisqichidan kirmoqda, shuning uchun strelka noldan chapga ogʻadi. “+” qisqich manbaning musbat qutbi tomonga ulanishi kerak.'}\n else{d.textContent='I = '+fmt(I)+' A';w.className='fb good';w.textContent=S3.sw?'✓ Toʻgʻri ulangan. I = U / R = '+S3.U+' / '+S3.R+' = '+fmt(I)+' A':'Kalit uzilgan: zanjir ochiq, tok yoʻq.'}}\n$('#sw').onclick=()=>{S3.sw=!S3.sw;upd3()};$('#u').oninput=$('#r').oninput=upd3;\n$$('#mode .btn').forEach(b=>b.onclick=()=>{S3.mode=b.dataset.m;$$('#mode .btn').forEach(o=>o.classList.toggle('on',o===b));upd3()});\nfunction pt(s,L,T,R,B){const a=R-L,b=B-T;if(s<a)return[L+s,T];s-=a;if(s<b)return[R,T+s];s-=b;if(s<a)return[R-s,B];s-=a;return[L,B-s]}\nfunction draw3(dt){const f=fit($('#c3'));if(!f)return;const{x,w,h}=f;\n const L=36,R=w-36,T=34,B=h-34,m=(T+B)/2,mx=(L+R)/2,par=S3.mode==='par',Rp=par?R-86:R,I=cur(),W=K.wire;\n line(x,L,T,mx-26,T,W);line(x,mx+26,T,R,T,W);line(x,R,T,R,m-22,W);line(x,R,m+22,R,B,W);\n if(par){line(x,R,B,L,B,W);line(x,Rp,T,Rp,m-17,W);line(x,Rp,m+17,Rp,B,W)}else{line(x,R,B,mx+34,B,W);line(x,mx-34,B,L,B,W)}\n line(x,L,B,L,m+8,W);line(x,L,m-8,L,T,W);\n if(S3.sw){const P=2*((Rp-L)+(B-T)),sp=par?200:Math.min(200,40+I*25);S3.off=(S3.off+sp*dt)%26;\n  x.fillStyle=K.ac2;for(let s=S3.off;s<P;s+=26){const p=pt(s,L,T,Rp,B);x.beginPath();x.arc(p[0],p[1],3.5,0,TP);x.fill()}}\n /* batareya */\n line(x,L-16,m-8,L+16,m-8,K.tx,4);line(x,L-9,m+8,L+9,m+8,K.tx,4);\n txt(x,'+',L-26,m-8,K.bad,16,'center',800);txt(x,'−',L-26,m+9,K.el,18,'center',800);txt(x,'U = '+S3.U+' V',L+22,m,K.tx,13,'left',700);\n /* kalit */\n x.fillStyle=K.tx;for(const px of[mx-26,mx+26]){x.beginPath();x.arc(px,T,4.5,0,TP);x.fill()}\n S3.sw?line(x,mx-26,T,mx+26,T,K.ok,4):line(x,mx-26,T,mx+16,T-22,K.bad,4);txt(x,'Kalit',mx,T+22,K.mu,12.5);\n /* rezistor */\n rr(x,R-11,m-22,22,44,4);x.fillStyle=K.card;x.fill();if(S3.sw&&!par){x.globalAlpha=Math.min(.9,I/5+.15);x.fillStyle=K.ac2;x.fill();x.globalAlpha=1}\n x.strokeStyle=K.tx;x.lineWidth=2.5;x.stroke();txt(x,'R = '+S3.R+' Ω',R,m+38,K.tx,12.5,'center',700);\n /* ampermetr */\n const ax=par?Rp:mx,ay=par?m:B;x.beginPath();x.arc(ax,ay,16,0,TP);x.fillStyle=K.card;x.fill();x.strokeStyle=K.ac;x.lineWidth=3;x.stroke();txt(x,'A',ax,ay+1,K.tx,17,'center',800);\n const rev=S3.mode==='rev',pl=rev?'−':'+',mi=rev?'+':'−',cp=c=>c==='+'?K.bad:K.el;\n if(par){txt(x,'+',ax+25,ay-12,K.bad,15,'center',800);txt(x,'−',ax+25,ay+13,K.el,17,'center',800)}\n else{txt(x,pl,ax+28,ay+15,cp(pl),16,'center',800);txt(x,mi,ax-28,ay+15,cp(mi),16,'center',800)}\n let tg=-60+120*Math.min(I,6)/6;if(rev&&S3.sw)tg=-72;if(par&&S3.sw)tg=72+Math.sin(performance.now()/45)*2;\n S3.a+=(tg-S3.a)*(1-Math.exp(-7*dt))}\nfunction dial(x,w,h,a){const cx=w/2,cy=h-20,r=Math.min(w/2-14,h-40);\n x.beginPath();x.arc(cx,cy,r+8,Math.PI,0);x.closePath();x.fillStyle=K.card;x.fill();x.strokeStyle=K.bd;x.lineWidth=2;x.stroke();\n for(let i=0;i<=30;i++){const g=(-60+4*i)*Math.PI/180,sx=Math.sin(g),sy=-Math.cos(g),big=i%5===0,r1=r-(big?16:9);\n  line(x,cx+sx*r1,cy+sy*r1,cx+sx*r,cy+sy*r,K.tx,big?2.5:1.3);if(big)txt(x,i/5,cx+sx*(r-29),cy+sy*(r-29),K.tx,13,'center',700)}\n txt(x,'A',cx,cy-r*.38,K.ac,22,'center',800);\n const g=a*Math.PI/180;line(x,cx,cy,cx+Math.sin(g)*(r-4),cy-Math.cos(g)*(r-4),K.bad,3);x.fillStyle=K.tx;x.beginPath();x.arc(cx,cy,7,0,TP);x.fill()}\nfunction drawG(){const f=fit($('#c3g'));if(f)dial(f.x,f.w,f.h,S3.a)}\nlet v3=1;function new3(){v3=Math.round(rnd(1,29))*.2;$('#ex3a').value='';$('#ex3r').textContent='';$('#ex3r').className='fb'}\nfunction drawR(){const f=fit($('#c3r'));if(f)dial(f.x,f.w,f.h,-60+120*v3/6)}\n$('#ex3c').onclick=()=>{const v=num($('#ex3a').value),r=$('#ex3r');if(isNaN(v))return fb(r,false,'Javobni raqam bilan kiriting.');\n Math.abs(v-v3)<.011?fb(r,true,'✓ Toʻgʻri! I = '+fmt(v3)+' A'):fb(r,false,'✗ Notoʻgʻri. Boʻlinma narxi 0,2 A: strelka qaysi boʻlinmada turganini sanang.')};\n$('#ex3n').onclick=new3;\n\n/* test */\nconst Q=[\n{q:'Elektr toki nima?',o:['Zaryadlangan zarralarning tartibli harakati','Zarralarning xaotik issiqlik harakati','Atomlarning tinch turishi'],c:0,e:'Tok — zaryadlangan zarralarning yoʻnalgan harakati. Xaotik harakat tok hosil qilmaydi.'},\n{q:'Tok kuchi formulasi qaysi?',o:['I = q · t','I = q / t','I = t / q'],c:1,e:'Tok kuchi zaryadning vaqtga nisbatiga teng: I = q / t.'},\n{q:'Kesimdan 5 s da 20 Kl zaryad oʻtdi. Tok kuchi qancha?',o:['0,25 A','100 A','4 A'],c:2,e:'I = q / t = 20 / 5 = 4 A.'},\n{q:'Ampermetr zanjirga qanday ulanadi?',o:['Parallel','Ketma-ket','Istalgancha'],c:1,e:'Ampermetr ketma-ket ulanadi. Qarshiligi juda kichik, parallel ulansa qisqa tutashuv boʻladi.'},\n{q:'250 mA necha amperga teng?',o:['2,5 A','0,025 A','0,25 A'],c:2,e:'1 mA = 0,001 A, demak 250 mA = 250 · 0,001 = 0,25 A.'}];\nlet score,done;\nfunction quiz(){score=0;done=0;$('#res').textContent='';$('#res').className='fb';$('#rs').hidden=true;\n $('#quiz').innerHTML=Q.map((q,i)=>'<div class=\"q\"><p>'+(i+1)+'. '+q.q+'<\/p>'+q.o.map((o,j)=>'<button class=\"btn\" data-i=\"'+i+'\" data-j=\"'+j+'\">'+o+'<\/button>').join('')+'<div class=\"fb\" id=\"e'+i+'\"><\/div><\/div>').join('');\n $$('#quiz .btn').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,j=+b.dataset.j,q=Q[i],bs=$$('#quiz .btn[data-i=\"'+i+'\"]');if(bs[0].dataset.d)return;\n  bs.forEach(o=>o.dataset.d=1);bs[q.c].classList.add('ok');const ok=j===q.c;if(!ok)b.classList.add('no');else score++;\n  fb($('#e'+i),ok,(ok?'✓ Toʻgʻri! ':'✗ Notoʻgʻri. ')+q.e);done++;\n  if(done===Q.length){fb($('#res'),score>=4,'Natija: '+score+' / '+Q.length+(score===5?' — ajoyib!':score>=4?' — juda yaxshi!':' — mavzuni yana bir bor koʻrib chiqing.'));$('#rs').hidden=false}})}\n$('#rs').onclick=()=>{quiz();scrollTo({top:0})};\n\n/* tsikl */\nlet last=performance.now();\nfunction loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;colors();\n if(!$('#s1').hidden){draw1(dt);drawW(dt)}\n if(!$('#s2').hidden)draw2(dt);\n if(!$('#s3').hidden){draw3(dt);drawG();drawR()}\n requestAnimationFrame(loop)}\nupd1();upd2();upd3();new2();new3();quiz();requestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>\n"}, {"t": "Elektr kuchlanish", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Elektr kuchlanish va uni o‘lchash — 8-sinf fizika<\/title>\n<style>\n/* ===== Ranglar (yorug‘ va qorong‘i rejim) ===== */\n:root{color-scheme:light dark;--bg:#f3f7fb;--card:#fff;--ink:#12263a;--mut:#4a5f75;--pri:#1565c0;--onpri:#fff;--acc:#f59e0b;\n--ok:#14793f;--bad:#c62828;--line:#6f879f;--water:#1e88e5;--pipe:#bddcf7;--el:#e8590c;--know:#e3f0ff;--bd:#c9d6e3;--pump:#90a4ae;--pos:#d32f2f}\n@media (prefers-color-scheme:dark){:root{--bg:#0e1622;--card:#17222f;--ink:#e8eef5;--mut:#a5b5c6;--pri:#64b5f6;--onpri:#0b1a2a;--acc:#ffb74d;\n--ok:#5ad08a;--bad:#ff8a80;--line:#8fa6bd;--water:#4fc3f7;--pipe:#1f4a6e;--el:#ff9a5c;--know:#14304d;--bd:#2d3e51;--pump:#546e7a;--pos:#ff6b6b}}\n*{box-sizing:border-box}\n[hidden]{display:none!important}\nbody{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nheader{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:8px 12px}\nheader h1{font-size:1.05rem;margin:0 0 6px}\nnav{display:flex;gap:6px;overflow-x:auto}\nnav button{flex:1 0 auto}\nmain{max-width:860px;margin:0 auto;padding:14px 14px 100px}\nh2{font-size:1.45rem;margin:.2em 0 .4em}\nh3{font-size:1.1rem;margin:1.2em 0 .4em}\n.goal{background:var(--card);border-left:5px solid var(--acc);padding:10px 14px;border-radius:8px;margin:0 0 12px}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:12px 0}\ncanvas{width:100%;height:auto;display:block}\n.btn,button{min-height:48px;min-width:48px;padding:0 16px;font:inherit;font-weight:600;border-radius:12px;border:2px solid var(--pri);background:var(--card);color:var(--pri);cursor:pointer}\nbutton.on,.btn.main{background:var(--pri);color:var(--onpri)}\nbutton:disabled{opacity:.4;cursor:default}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}\ninput[type=range]{width:100%;height:48px;accent-color:var(--pri)}\n.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}\n.row label{font-weight:600}\n.big{font-size:1.5rem;font-weight:700;color:var(--pri)}\n.formula{font-size:1.2rem;font-weight:600;background:var(--know);border-radius:10px;padding:10px 14px;line-height:1.9}\n.know{background:var(--know);border:2px solid var(--pri);border-radius:14px;padding:12px 16px;margin:14px 0}\n.know b.t{display:block;color:var(--pri);margin-bottom:4px}\n.msg{min-height:3.2em;font-weight:600;padding:8px 12px;border-radius:10px;background:var(--know)}\n.msg.warn{background:rgba(198,40,40,.15);color:var(--bad)}\n.msg.good{background:rgba(20,121,63,.15);color:var(--ok)}\n.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}\n.opt{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 10px;border:1px solid var(--bd);border-radius:10px;margin:6px 0;cursor:pointer}\n.opt input{width:22px;height:22px;accent-color:var(--pri)}\n.num,select{min-height:48px;font:inherit;padding:0 10px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--ink);width:150px}\n.fb{font-weight:600;margin:8px 0 0}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}\n.res{font-size:1.15rem;font-weight:600}\nfooter{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;gap:10px;justify-content:space-between;align-items:center;padding:8px 12px}\nfooter button{flex:1;max-width:220px}\n#pg{color:var(--mut);font-weight:600}\n<\/style>\n<\/head>\n<body>\n<header>\n  <h1>⚡ Elektr kuchlanish va uni o‘lchash · 8-sinf<\/h1>\n  <nav id=\"menu\" aria-label=\"Bo‘limlar\"><\/nav>\n<\/header>\n\n<main>\n<!-- ================= 1-BO‘LIM ================= -->\n<section class=\"slide\" aria-labelledby=\"h1\">\n  <h2 id=\"h1\">1. Elektr kuchlanish nima?<\/h2>\n  <p class=\"goal\"><b>Maqsad:<\/b> kuchlanish nima ekanini va u tokka qanday ta’sir qilishini tushunish.<\/p>\n  <p>Elektr maydon zaryadlarni zanjir bo‘ylab ko‘chirish uchun ish bajaradi. Shu ishni ko‘rsatuvchi kattalik <b>elektr kuchlanish<\/b> deyiladi. Uni manba qutblari orasidagi “elektr bosimi” deb tasavvur qiling: nasos suvni bosim bilan haydagani kabi, manba ham elektronlarni harakatga keltiradi.<\/p>\n  <div class=\"card\">\n    <canvas id=\"c1\" aria-label=\"Suv oqimi va elektr zanjiri simulyatsiyasi\"><\/canvas>\n    <div class=\"row\"><label for=\"u1\">Kuchlanish U:<\/label><span class=\"big\" id=\"u1v\">6 V<\/span><\/div>\n    <input type=\"range\" id=\"u1\" min=\"0\" max=\"12\" step=\"1\" value=\"6\">\n    <p class=\"msg\" id=\"st1\" aria-live=\"polite\"><\/p>\n  <\/div>\n  <div class=\"know\"><b class=\"t\">Bilib oling<\/b>\n    Kuchlanish — elektr maydonning zaryadni ko‘chirishda bajargan ishini ko‘rsatuvchi kattalik. Kuchlanish qancha katta bo‘lsa, tok shuncha kuchli, lampochka shuncha yorqin. <b>U = 0<\/b> bo‘lsa, tok yo‘q. Elektronlar manfiy (−) qutbdan musbat (+) qutbga harakatlanadi; tokning an’anaviy yo‘nalishi esa + dan − ga.<\/div>\n  <h3>Mini-savollar<\/h3><div id=\"q1\"><\/div>\n<\/section>\n\n<!-- ================= 2-BO‘LIM ================= -->\n<section class=\"slide\" aria-labelledby=\"h2\" hidden>\n  <h2 id=\"h2\">2. Formula va o‘lchov birligi<\/h2>\n  <p class=\"goal\"><b>Maqsad:<\/b> kuchlanish formulasini va volt birligini hisoblashda qo‘llashni o‘rganish.<\/p>\n  <p><b>U = A / q<\/b>, bunda U — kuchlanish, A — maydon ishi (joul, J), q — zaryad (kulon, C). Birligi — <b>volt (V)<\/b>: 1 V = 1 J / 1 C.<\/p>\n  <div class=\"card\">\n    <canvas id=\"c2\" aria-label=\"Zaryad ko‘chishi animatsiyasi\"><\/canvas>\n    <div class=\"row\"><label for=\"A\">Ish A:<\/label><span class=\"big\" id=\"Av\"><\/span><\/div>\n    <input type=\"range\" id=\"A\" min=\"1\" max=\"100\" step=\"1\" value=\"24\">\n    <div class=\"row\"><label for=\"q\">Zaryad q:<\/label><span class=\"big\" id=\"qv\"><\/span><\/div>\n    <input type=\"range\" id=\"q\" min=\"1\" max=\"20\" step=\"1\" value=\"6\">\n    <div class=\"formula\" id=\"f2\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"card\">\n    <b>Birliklar konvertori<\/b> <small>(1 kV = 1000 V, 1 V = 1000 mV)<\/small>\n    <div class=\"row\"><input class=\"num\" id=\"cv\" type=\"text\" inputmode=\"decimal\" value=\"1500\" aria-label=\"Qiymat\">\n      <select id=\"cu\" aria-label=\"Birlik\"><option value=\"0.001\">mV<\/option><option value=\"1\" selected>V<\/option><option value=\"1000\">kV<\/option><\/select><\/div>\n    <div class=\"formula\" id=\"cr\"><\/div>\n  <\/div>\n  <div class=\"know\"><b class=\"t\">Bilib oling<\/b>\n    U = A / q. Birligi: 1 V = 1 J / 1 C. Karrali birliklar: 1 kV = 1000 V; 1 V = 1000 mV. Bir xil zaryadni ko‘chirishda ish qancha katta bo‘lsa, kuchlanish ham shuncha katta.<\/div>\n  <h3>Mini-savollar<\/h3><div id=\"q2\"><\/div>\n<\/section>\n\n<!-- ================= 3-BO‘LIM ================= -->\n<section class=\"slide\" aria-labelledby=\"h3t\" hidden>\n  <h2 id=\"h3t\">3. Kuchlanishni voltmetr bilan o‘lchash<\/h2>\n  <p class=\"goal\"><b>Maqsad:<\/b> voltmetrni to‘g‘ri ulash va shkaladan ko‘rsatkichni o‘qishni o‘rganish.<\/p>\n  <p>Voltmetr (sxemada <b>V<\/b> belgisi) kuchlanishni o‘lchaydi. U iste’molchiga <b>parallel<\/b> ulanadi, “+” qismi manbaning “+” tomoniga ulanadi. <b>Bo‘lim bahosi<\/b> = (katta qiymat − kichik qiymat) / oradagi bo‘limlar soni. Bu shkalada: (1 V − 0 V) / 2 = <b>0,5 V<\/b>.<\/p>\n  <div class=\"card\">\n    <canvas id=\"c3\" aria-label=\"Voltmetrni ulash sxemasi\"><\/canvas>\n    <div class=\"row\"><b>Elementlar soni (har biri 1,5 V):<\/b>\n      <span id=\"nb\"><\/span><\/div>\n    <div class=\"row\"><b>Ulanish usuli:<\/b><button id=\"mp\" class=\"on\">Parallel<\/button><button id=\"ms\">Ketma-ket<\/button><\/div>\n    <div class=\"row\"><b>Qutblar:<\/b><button id=\"po\" class=\"on\">To‘g‘ri (+ → +)<\/button><button id=\"pr\">Teskari<\/button><\/div>\n    <div class=\"row\"><button id=\"con\" class=\"btn main\">Voltmetrni ulash<\/button><\/div>\n    <canvas id=\"cg\" style=\"max-width:420px;margin:auto\" aria-label=\"Voltmetr shkalasi\"><\/canvas>\n    <p class=\"msg\" id=\"st3\" aria-live=\"polite\"><\/p>\n  <\/div>\n  <div class=\"card\"><b>Mashq: shkaladan o‘qing<\/b>\n    <canvas id=\"cx\" style=\"max-width:420px;margin:auto\" aria-label=\"Mashq shkalasi\"><\/canvas>\n    <div class=\"row\"><input class=\"num\" id=\"exin\" type=\"text\" inputmode=\"decimal\" placeholder=\"… V\" aria-label=\"Ko‘rsatkich\"><button id=\"exchk\" class=\"btn main\">Tekshirish<\/button><button id=\"exnew\">Yangi mashq<\/button><\/div>\n    <p class=\"fb\" id=\"exfb\" aria-live=\"polite\"><\/p>\n  <\/div>\n  <div class=\"know\"><b class=\"t\">Bilib oling<\/b>\n    Voltmetr iste’molchiga parallel ulanadi, “+” qismi manbaning “+” tomoniga ulanadi. Ketma-ket ulash yoki qutblarni almashtirish mumkin emas. Ko‘rsatkichni o‘qishdan oldin bo‘lim bahosini aniqlang. Manbalar ketma-ket ulansa, kuchlanishlar qo‘shiladi: 3 ta element → 3 · 1,5 V = 4,5 V.<\/div>\n  <h3>Mini-savollar<\/h3><div id=\"q3\"><\/div>\n<\/section>\n\n<!-- ================= YAKUNIY TEST ================= -->\n<section class=\"slide\" aria-labelledby=\"h4\" hidden>\n  <h2 id=\"h4\">4. Yakuniy mustahkamlash<\/h2>\n  <p class=\"goal\"><b>Maqsad:<\/b> mavzu bo‘yicha bilimingizni 5 ta test bilan tekshirish.<\/p>\n  <div id=\"qt\"><\/div>\n  <div class=\"row\"><button id=\"tchk\" class=\"btn main\">Natijani ko‘rsatish<\/button><\/div>\n  <p class=\"res\" id=\"tres\" aria-live=\"polite\"><\/p>\n<\/section>\n<\/main>\n\n<footer>\n  <button id=\"prev\">◀ Oldingi<\/button><span id=\"pg\"><\/span><button id=\"next\">Keyingi ▶<\/button>\n<\/footer>\n\n<script>\n\"use strict\";\n/* ===== Yordamchi funksiyalar ===== */\nconst $ = id => document.getElementById(id);\nconst fmt = (x, d = 1) => (+x.toFixed(d)).toString().replace(\".\", \",\");\nconst css = getComputedStyle(document.documentElement);\nconst C = n => css.getPropertyValue(n).trim();           // joriy rang (yorug‘/qorong‘i)\n/* Canvasni 2x aniqlikda tayyorlash */\nfunction mk(id, w, h) { const c = $(id); c.width = w * 2; c.height = h * 2; const g = c.getContext(\"2d\"); g.scale(2, 2); return g; }\nfunction txt(g, s, x, y, size, col, al) { g.font = `600 ${size}px system-ui,sans-serif`; g.fillStyle = col; g.textAlign = al || \"center\"; g.textBaseline = \"middle\"; g.fillText(s, x, y); }\n\n/* ===== Navigatsiya ===== */\nconst slides = document.querySelectorAll(\".slide\");\nconst names = [\"1. Tushuncha\", \"2. Formula\", \"3. Voltmetr\", \"4. Test\"];\nlet cur = 0;\nnames.forEach((n, i) => { const b = document.createElement(\"button\"); b.textContent = n; b.onclick = () => go(i); $(\"menu\").appendChild(b); });\nfunction go(i) {\n  cur = Math.max(0, Math.min(slides.length - 1, i));\n  slides.forEach((s, k) => s.hidden = k !== cur);\n  [...$(\"menu\").children].forEach((b, k) => b.classList.toggle(\"on\", k === cur));\n  $(\"prev\").disabled = cur === 0; $(\"next\").disabled = cur === slides.length - 1;\n  $(\"pg\").textContent = (cur + 1) + \" / \" + slides.length;\n  window.scrollTo(0, 0);\n}\n$(\"prev\").onclick = () => go(cur - 1); $(\"next\").onclick = () => go(cur + 1);\ndocument.addEventListener(\"keydown\", e => {\n  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;   // slayder/kiritishga xalaqit bermaslik\n  if (e.key === \"ArrowRight\") go(cur + 1); if (e.key === \"ArrowLeft\") go(cur - 1);\n});\n\n/* ===== 1-simulyatsiya: suv o‘xshatmasi va elektr zanjiri ===== */\nconst g1 = mk(\"c1\", 720, 300); let U1 = 6, off = 0, ang = 0;\n/* Kontur (to‘rtburchak) bo‘ylab nuqta: pastki-chapdan o‘ngga, yuqoriga, chapga, pastga (soat strelkasiga teskari) */\nfunction pt(b, t) {\n  const L = 2 * (b.w + b.h); let d = (((t % 1) + 1) % 1) * L;\n  if (d < b.w) return [b.x + d, b.y + b.h]; d -= b.w;\n  if (d < b.h) return [b.x + b.w, b.y + b.h - d]; d -= b.h;\n  if (d < b.w) return [b.x + b.w - d, b.y]; d -= b.w;\n  return [b.x, b.y + d];\n}\nfunction draw1(dt) {\n  const v = U1 / 12 * 0.22; off += v * dt; ang += v * dt * 30;   // tezlik kuchlanishga proporsional\n  g1.clearRect(0, 0, 720, 300);\n  const W = { x: 50, y: 70, w: 270, h: 170 }, E = { x: 400, y: 70, w: 270, h: 170 };\n  [W, E].forEach((b, k) => {\n    g1.strokeStyle = k ? C(\"--line\") : C(\"--pipe\"); g1.lineWidth = k ? 4 : 16; g1.strokeRect(b.x, b.y, b.w, b.h);\n    for (let i = 0; i < 22; i++) {\n      const p = pt(b, i / 22 + off); g1.beginPath(); g1.arc(p[0], p[1], k ? 7 : 5, 0, 7);\n      g1.fillStyle = k ? C(\"--el\") : C(\"--water\"); g1.fill();\n      if (k) txt(g1, \"−\", p[0], p[1], 11, \"#fff\");\n    }\n  });\n  const my = 155;\n  /* Nasos (suv) */\n  g1.fillStyle = C(\"--pump\"); g1.fillRect(W.x - 24, my - 36, 48, 72);\n  g1.fillStyle = C(\"--water\"); const hh = U1 / 12 * 60; g1.fillRect(W.x - 18, my + 30 - hh, 36, hh);\n  txt(g1, \"Nasos\", W.x, my + 52, 13, C(\"--ink\")); txt(g1, \"Bosim: \" + U1, W.x, my - 50, 12, C(\"--mut\"));\n  /* G‘ildirak (turbina) */\n  const wx = W.x + W.w; g1.fillStyle = C(\"--card\"); g1.strokeStyle = C(\"--ink\"); g1.lineWidth = 3;\n  g1.beginPath(); g1.arc(wx, my, 26, 0, 7); g1.fill(); g1.stroke();\n  for (let k = 0; k < 4; k++) { const a = ang + k * Math.PI / 2; g1.beginPath(); g1.moveTo(wx, my); g1.lineTo(wx + 22 * Math.cos(a), my + 22 * Math.sin(a)); g1.stroke(); }\n  txt(g1, \"G‘ildirak\", wx, my + 44, 13, C(\"--ink\"));\n  /* Batareya (manba) */\n  g1.fillStyle = C(\"--pri\"); g1.fillRect(E.x - 20, my - 36, 40, 72);\n  txt(g1, \"+\", E.x, my - 20, 24, C(\"--onpri\")); txt(g1, \"−\", E.x, my + 20, 26, C(\"--onpri\"));\n  txt(g1, \"Manba\", E.x, my + 52, 13, C(\"--ink\"));\n  /* Lampochka: yorqinlik kuchlanishga bog‘liq */\n  const bx = E.x + E.w, b = U1 / 12;\n  if (b > 0) { const gr = g1.createRadialGradient(bx, my, 5, bx, my, 30 + 50 * b); gr.addColorStop(0, `rgba(255,214,60,${.9 * b})`); gr.addColorStop(1, \"rgba(255,214,60,0)\"); g1.fillStyle = gr; g1.beginPath(); g1.arc(bx, my, 85, 0, 7); g1.fill(); }\n  g1.fillStyle = `rgba(255,214,60,${.1 + .9 * b})`; g1.strokeStyle = C(\"--ink\"); g1.lineWidth = 3;\n  g1.beginPath(); g1.arc(bx, my, 22, 0, 7); g1.fill(); g1.stroke();\n  g1.beginPath(); g1.moveTo(bx - 14, my - 14); g1.lineTo(bx + 14, my + 14); g1.moveTo(bx + 14, my - 14); g1.lineTo(bx - 14, my + 14); g1.stroke();\n  txt(g1, \"Lampochka\", bx, my + 44, 13, C(\"--ink\"));\n  txt(g1, \"Suv o‘xshatmasi\", 185, 25, 16, C(\"--water\")); txt(g1, \"Elektr zanjiri\", 535, 25, 16, C(\"--el\"));\n  txt(g1, \"Suv bosim farqi tufayli oqadi\", 185, 280, 13, C(\"--mut\")); txt(g1, \"Elektronlar: − dan + ga\", 535, 280, 13, C(\"--mut\"));\n}\n$(\"u1\").oninput = e => {\n  U1 = +e.target.value; $(\"u1v\").textContent = U1 + \" V\";\n  $(\"st1\").textContent = U1 === 0 ? \"U = 0 V: bosim farqi yo‘q — suv oqmaydi, elektronlar harakatlanmaydi, tok yo‘q, lampochka yonmaydi.\"\n    : `U = ${U1} V: ${U1 < 5 ? \"kuchlanish kichik — elektronlar sekin harakatlanadi, lampochka xira yonadi.\" : U1 < 9 ? \"kuchlanish o‘rtacha — elektronlar tezroq harakatlanadi, lampochka yorqinroq.\" : \"kuchlanish katta — elektronlar tez harakatlanadi, lampochka juda yorqin.\"}`;\n};\n$(\"u1\").oninput({ target: $(\"u1\") });\n\n/* ===== 2-simulyatsiya: U = A / q ===== */\nconst g2 = mk(\"c2\", 720, 210); let A = 24, Q = 6, t2 = 0;\nfunction draw2(dt) {\n  t2 += dt * 0.35; const p = t2 % 1; g2.clearRect(0, 0, 720, 210);\n  g2.fillStyle = C(\"--pos\"); g2.fillRect(50, 10, 14, 170); g2.fillStyle = C(\"--water\"); g2.fillRect(656, 10, 14, 170);\n  txt(g2, \"+\", 57, 195, 20, C(\"--pos\")); txt(g2, \"−\", 663, 195, 20, C(\"--water\"));\n  g2.strokeStyle = C(\"--mut\"); g2.lineWidth = 1.5; g2.setLineDash([6, 6]);\n  [30, 95, 160].forEach(y => { g2.beginPath(); g2.moveTo(80, y); g2.lineTo(640, y); g2.stroke(); }); g2.setLineDash([]);\n  txt(g2, \"elektr maydon →\", 360, 12, 12, C(\"--mut\"));\n  const n = Math.min(Q, 20), x0 = 80 + p * (560 - 70);\n  for (let i = 0; i < n; i++) {                       // q ta zaryad guruhi 1-nuqtadan 2-nuqtaga ko‘chadi\n    const cx = x0 + (i % 5) * 13, cy = 50 + Math.floor(i / 5) * 24;\n    g2.beginPath(); g2.arc(cx, cy, 8, 0, 7); g2.fillStyle = C(\"--pos\"); g2.fill(); txt(g2, \"+\", cx, cy, 12, \"#fff\");\n  }\n  g2.fillStyle = C(\"--acc\"); g2.fillRect(80, 160, A / 100 * 560 * p, 8);          // bajarilgan ish\n  txt(g2, `Ish A = ${A} J`, 90, 182, 13, C(\"--ink\"), \"left\");\n}\nfunction upd2() {\n  A = +$(\"A\").value; Q = +$(\"q\").value; $(\"Av\").textContent = A + \" J\"; $(\"qv\").textContent = Q + \" C\";\n  const U = A / Q;\n  $(\"f2\").innerHTML = `U = A / q<br>U = ${A} J / ${Q} C<br>U = <span style=\"color:var(--pri)\">${fmt(U, 2)} V<\/span> &nbsp;(= ${fmt(U * 1000, 0)} mV = ${fmt(U / 1000, 5)} kV)`;\n}\n$(\"A\").oninput = upd2; $(\"q\").oninput = upd2; upd2();\nfunction conv() {\n  const v = parseFloat($(\"cv\").value.replace(\",\", \".\")), f = +$(\"cu\").value; if (isNaN(v)) { $(\"cr\").textContent = \"Son kiriting.\"; return; }\n  const V = v * f, s = x => (+x.toPrecision(7)).toString().replace(\".\", \",\");\n  $(\"cr\").innerHTML = `${s(V * 1000)} mV<br>${s(V)} V<br>${s(V / 1000)} kV`;\n}\n$(\"cv\").oninput = conv; $(\"cu\").onchange = conv; conv();\n\n/* ===== 3-simulyatsiya: voltmetr ===== */\nconst g3 = mk(\"c3\", 720, 300), gg = mk(\"cg\", 360, 200), gx = mk(\"cx\", 360, 200);\nconst S = { n: 1, mode: \"par\", pol: \"ok\", on: false }; let needle = 0, exv = 0;\n/* Strelkali shkala: 0 dan 6 V gacha, bo‘lim bahosi 0,5 V */\nfunction drawGauge(g, v) {\n  g.clearRect(0, 0, 360, 200); const cx = 180, cy = 175, R = 140, an = x => Math.PI * 1.15 + x / 6 * Math.PI * 0.7;\n  g.fillStyle = C(\"--card\"); g.strokeStyle = C(\"--ink\"); g.lineWidth = 3; g.beginPath(); g.arc(cx, cy, R + 12, Math.PI, 0); g.closePath(); g.fill(); g.stroke();\n  g.lineWidth = 3; g.beginPath(); g.arc(cx, cy, R, an(0), an(6)); g.stroke();\n  for (let k = 0; k <= 12; k++) {\n    const a = an(k / 2), r2 = R - (k % 2 ? 9 : 17); g.lineWidth = k % 2 ? 1.5 : 3;\n    g.beginPath(); g.moveTo(cx + R * Math.cos(a), cy + R * Math.sin(a)); g.lineTo(cx + r2 * Math.cos(a), cy + r2 * Math.sin(a)); g.stroke();\n    if (!(k % 2)) txt(g, k / 2, cx + (R - 32) * Math.cos(a), cy + (R - 32) * Math.sin(a), 15, C(\"--ink\"));\n  }\n  txt(g, \"V\", cx, cy - 55, 26, C(\"--pri\"));\n  const a = an(Math.max(-0.4, Math.min(6.3, v)));\n  g.strokeStyle = C(\"--bad\"); g.lineWidth = 4; g.lineCap = \"round\"; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + (R - 8) * Math.cos(a), cy + (R - 8) * Math.sin(a)); g.stroke();\n  g.fillStyle = C(\"--ink\"); g.beginPath(); g.arc(cx, cy, 8, 0, 7); g.fill();\n}\nfunction target() { return (!S.on || S.mode === \"ser\") ? 0 : (S.pol === \"ok\" ? S.n * 1.5 : -0.4); }\nfunction draw3() {\n  needle += (target() - needle) * 0.12; drawGauge(gg, needle); drawGauge(gx, exv);\n  g3.clearRect(0, 0, 720, 300); g3.lineWidth = 4; g3.strokeStyle = C(\"--line\"); g3.lineCap = \"round\";\n  const ln = (a, b, c, d) => { g3.beginPath(); g3.moveTo(a, b); g3.lineTo(c, d); g3.stroke(); };\n  ln(60, 90, 420, 90); ln(420, 90, 420, 143); ln(420, 187, 420, 240); ln(60, 90, 60, 139); ln(60, 191, 60, 240);\n  if (S.on && S.mode === \"ser\") { ln(60, 240, 222, 240); ln(258, 240, 420, 240); } else ln(60, 240, 420, 240);\n  /* Manba */\n  g3.fillStyle = C(\"--pri\"); g3.fillRect(42, 139, 36, 52); txt(g3, \"+\", 60, 152, 20, C(\"--onpri\")); txt(g3, \"−\", 60, 180, 22, C(\"--onpri\"));\n  txt(g3, \"Manba \" + fmt(S.n * 1.5) + \" V\", 60, 265, 13, C(\"--ink\"));\n  /* Lampochka (ketma-ket ulansa, tok deyarli yo‘q — yonmaydi) */\n  const b = (S.on && S.mode === \"ser\") ? 0 : S.n * 1.5 / 4.5;\n  if (b > 0) { const gr = g3.createRadialGradient(420, 165, 5, 420, 165, 30 + 40 * b); gr.addColorStop(0, `rgba(255,214,60,${.9 * b})`); gr.addColorStop(1, \"rgba(255,214,60,0)\"); g3.fillStyle = gr; g3.beginPath(); g3.arc(420, 165, 70, 0, 7); g3.fill(); }\n  g3.fillStyle = `rgba(255,214,60,${.1 + .9 * b})`; g3.strokeStyle = C(\"--ink\"); g3.beginPath(); g3.arc(420, 165, 22, 0, 7); g3.fill(); g3.stroke();\n  g3.beginPath(); g3.moveTo(406, 151); g3.lineTo(434, 179); g3.moveTo(434, 151); g3.lineTo(406, 179); g3.stroke();\n  txt(g3, \"Lampochka\", 450, 165, 13, C(\"--ink\"), \"left\");\n  /* Voltmetr */\n  g3.lineWidth = 4; g3.strokeStyle = C(\"--line\");\n  const vm = (x, y, r) => { g3.fillStyle = C(\"--card\"); g3.strokeStyle = C(\"--ink\"); g3.lineWidth = 3; g3.beginPath(); g3.arc(x, y, r, 0, 7); g3.fill(); g3.stroke(); txt(g3, \"V\", x, y, r * .9, C(\"--pri\")); g3.strokeStyle = C(\"--line\"); g3.lineWidth = 4; };\n  if (S.on && S.mode === \"ser\") vm(240, 240, 18);\n  else {\n    if (S.on) { ln(420, 90, 580, 90); ln(580, 90, 580, 135); ln(420, 240, 580, 240); ln(580, 240, 580, 195); }\n    vm(580, 165, 30);\n    const top = S.pol === \"ok\" ? \"+\" : \"−\", bot = S.pol === \"ok\" ? \"−\" : \"+\";\n    txt(g3, top, 610, 138, 20, top === \"+\" ? C(\"--pos\") : C(\"--water\")); txt(g3, bot, 610, 192, 22, bot === \"+\" ? C(\"--pos\") : C(\"--water\"));\n  }\n}\nfunction msg3() {\n  const m = $(\"st3\"); let c = \"msg\", t;\n  if (!S.on) t = \"Voltmetr ulanmagan. Ko‘rsatkich 0 V. “Voltmetrni ulash” tugmasini bosing.\";\n  else if (S.mode === \"ser\") { c += \" warn\"; t = \"⚠️ Xato! Voltmetr ketma-ket ulanmaydi. Zanjir deyarli uzilib qoladi: lampochka o‘chdi va lampochkadagi kuchlanishni o‘lchab bo‘lmaydi. Voltmetrni lampochkaga parallel ulang.\"; }\n  else if (S.pol === \"rev\") { c += \" warn\"; t = \"⚠️ Xato! Qutblar teskari: strelka noldan chapga og‘adi, asbob shikastlanishi mumkin. Voltmetrning “+” qismini manbaning “+” tomoniga ulang.\"; }\n  else { c += \" good\"; t = `✅ To‘g‘ri ulandi: parallel, qutblar mos. Ko‘rsatkich: ${S.n} · 1,5 V = ${fmt(S.n * 1.5)} V.`; }\n  m.className = c; m.textContent = t;\n}\nfor (let i = 1; i <= 3; i++) { const b = document.createElement(\"button\"); b.textContent = i; b.setAttribute(\"aria-label\", i + \" ta element\"); if (i === 1) b.className = \"on\";\n  b.onclick = () => { S.n = i; [...$(\"nb\").children].forEach(x => x.classList.toggle(\"on\", x === b)); msg3(); }; $(\"nb\").appendChild(b); }\nconst setSeg = (a, b, key, val) => { $(a).onclick = () => { S[key] = val; $(a).classList.add(\"on\"); $(b).classList.remove(\"on\"); msg3(); }; };\n$(\"mp\").onclick = () => { S.mode = \"par\"; $(\"mp\").classList.add(\"on\"); $(\"ms\").classList.remove(\"on\"); msg3(); };\n$(\"ms\").onclick = () => { S.mode = \"ser\"; $(\"ms\").classList.add(\"on\"); $(\"mp\").classList.remove(\"on\"); msg3(); };\n$(\"po\").onclick = () => { S.pol = \"ok\"; $(\"po\").classList.add(\"on\"); $(\"pr\").classList.remove(\"on\"); msg3(); };\n$(\"pr\").onclick = () => { S.pol = \"rev\"; $(\"pr\").classList.add(\"on\"); $(\"po\").classList.remove(\"on\"); msg3(); };\n$(\"con\").onclick = () => { S.on = !S.on; $(\"con\").textContent = S.on ? \"Voltmetrni uzish\" : \"Voltmetrni ulash\"; msg3(); };\nmsg3();\n/* Shkaladan o‘qish mashqi */\nfunction newEx() { exv = (Math.floor(Math.random() * 11) + 1) * 0.5; $(\"exin\").value = \"\"; $(\"exfb\").textContent = \"\"; }\n$(\"exnew\").onclick = newEx; newEx();\n$(\"exchk\").onclick = () => {\n  const v = parseFloat($(\"exin\").value.replace(\",\", \".\")), f = $(\"exfb\");\n  if (isNaN(v)) { f.className = \"fb\"; f.textContent = \"Ko‘rsatkichni son bilan kiriting.\"; return; }\n  const ok = Math.abs(v - exv) < 1e-6; f.className = \"fb \" + (ok ? \"ok\" : \"bad\");\n  f.textContent = ok ? \"✅ To‘g‘ri!\" : `❌ Noto‘g‘ri. To‘g‘ri javob: ${fmt(exv)} V. Eslatma: bo‘lim bahosi 0,5 V.`;\n};\n\n/* ===== Savollar (mini-savollar va yakuniy test) ===== */\nfunction buildQ(box, list, final) {\n  list.forEach((q, i) => {\n    const d = document.createElement(\"div\"); d.className = \"q\";\n    let h = `<p><b>${i + 1}. ${q.t}<\/b><\/p>`;\n    if (q.o) h += q.o.map((o, j) => `<label class=\"opt\"><input type=\"radio\" name=\"${box.id}${i}\" value=\"${j}\"><span>${o}<\/span><\/label>`).join(\"\");\n    else h += `<input class=\"num\" type=\"text\" inputmode=\"decimal\" placeholder=\"Javob, ${q.u}\" aria-label=\"Javob\">`;\n    if (!final) h += `<div class=\"row\"><button class=\"btn main chk\">Javobni tekshirish<\/button><\/div>`;\n    d.innerHTML = h + `<p class=\"fb\" aria-live=\"polite\"><\/p>`; box.appendChild(d); q.el = d;\n    if (!final) d.querySelector(\".chk\").onclick = () => grade(q);\n  });\n}\nfunction grade(q) {   // true / false, javob kiritilmagan bo‘lsa null\n  const fb = q.el.querySelector(\".fb\"); let ok;\n  if (q.o) { const s = q.el.querySelector(\"input:checked\"); if (!s) { fb.className = \"fb\"; fb.textContent = \"Avval javobni tanlang.\"; return null; } ok = +s.value === q.c; }\n  else { const v = parseFloat(q.el.querySelector(\".num\").value.replace(\",\", \".\")); if (isNaN(v)) { fb.className = \"fb\"; fb.textContent = \"Avval javobni kiriting.\"; return null; } ok = Math.abs(v - q.a) < 1e-6; }\n  fb.className = \"fb \" + (ok ? \"ok\" : \"bad\");\n  fb.innerHTML = ok ? \"✅ To‘g‘ri!\" : \"❌ Noto‘g‘ri. To‘g‘ri javob: <b>\" + (q.o ? q.o[q.c] : fmt(q.a) + \" \" + q.u) + \"<\/b>.\" + (q.e ? \" \" + q.e : \"\");\n  return ok;\n}\nbuildQ($(\"q1\"), [\n  { t: \"Suv o‘xshatmasida elektr kuchlanish nimaga mos keladi?\", o: [\"Quvurdagi suv miqdoriga\", \"Nasos hosil qilgan bosimga\", \"Quvur uzunligiga\"], c: 1, e: \"Kuchlanish — manba qutblari orasidagi “elektr bosimi”.\" },\n  { t: \"Kuchlanish 0 V bo‘lsa, zanjirda nima bo‘ladi?\", o: [\"Lampochka juda yorqin yonadi\", \"Lampochka miltillaydi\", \"Tok yo‘q, lampochka yonmaydi\"], c: 2 }]);\nbuildQ($(\"q2\"), [\n  { t: \"1 volt nimaga teng?\", o: [\"1 J / 1 C\", \"1 C / 1 J\", \"1 J · 1 C\"], c: 0, e: \"U = A / q, shuning uchun 1 V = 1 J / 1 C.\" },\n  { t: \"Maydon 60 J ish bajarib, 12 C zaryadni ko‘chirdi. Kuchlanishni toping (U = A / q).\", a: 5, u: \"V\", e: \"U = 60 J / 12 C = 5 V.\" }]);\nbuildQ($(\"q3\"), [\n  { t: \"Voltmetr iste’molchiga qanday ulanadi?\", o: [\"Ketma-ket\", \"Parallel\", \"Faqat manbaga ketma-ket\"], c: 1 },\n  { t: \"Har biri 1,5 V bo‘lgan 3 ta element ketma-ket ulangan. Voltmetr necha volt ko‘rsatadi?\", o: [\"1,5 V\", \"3 V\", \"4,5 V\"], c: 2, e: \"3 · 1,5 V = 4,5 V.\" }]);\n/* Yakuniy test: to‘g‘ri javoblar turli o‘rinlarda (2, 4, 1, 3, 2-variant) */\nconst test = [\n  { t: \"Elektr kuchlanishning o‘lchov birligi qaysi?\", o: [\"Amper\", \"Volt\", \"Om\", \"Joul\"], c: 1 },\n  { t: \"1 kV necha voltga teng?\", o: [\"10 V\", \"100 V\", \"10 000 V\", \"1000 V\"], c: 3 },\n  { t: \"Maydon 40 J ish bajarib, 10 C zaryadni ko‘chirdi. Kuchlanish qancha?\", o: [\"4 V\", \"400 V\", \"0,25 V\", \"50 V\"], c: 0, e: \"U = 40 / 10 = 4 V.\" },\n  { t: \"Voltmetr sxemada qanday ulanadi?\", o: [\"Iste’molchiga ketma-ket\", \"Manbaning ichiga\", \"Iste’molchiga parallel\", \"Hech qanday ulanmaydi\"], c: 2 },\n  { t: \"Har biri 1,5 V bo‘lgan 2 ta element ketma-ket ulansa, kuchlanish qancha?\", o: [\"1,5 V\", \"3 V\", \"0,75 V\", \"4,5 V\"], c: 1 }];\nbuildQ($(\"qt\"), test, true);\n$(\"tchk\").onclick = () => {\n  const r = test.map(grade); if (r.includes(null)) { $(\"tres\").textContent = \"Avval barcha 5 ta savolga javob bering.\"; return; }\n  const n = r.filter(Boolean).length;\n  const w = n === 5 ? \"A’lo! Mavzuni mukammal o‘zlashtirdingiz.\" : n === 4 ? \"Yaxshi! Xatoingizni yuqoridagi tushuntirishdan ko‘rib chiqing.\" : n === 3 ? \"Qoniqarli. U = A / q formulasi va voltmetr ulanishini takrorlang.\" : \"Mavzuni qayta ko‘rib chiqing: 1–3 bo‘limlardagi simulyatsiyalarni yana sinab ko‘ring.\";\n  $(\"tres\").textContent = `Natija: ${n} / 5. ${w}`;\n};\n\n/* ===== Asosiy animatsiya sikli (faqat ko‘rinib turgan slayd chiziladi) ===== */\nlet last = 0;\nfunction loop(ts) {\n  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;\n  if (cur === 0) draw1(dt); else if (cur === 1) draw2(dt); else if (cur === 2) draw3();\n  requestAnimationFrame(loop);\n}\ngo(0); requestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>\n"}, {"t": "Fizik masalalar yechish", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Fizik masalalar yechish<\/title>\n<style>\n:root{--bg:#f4f7fb;--card:#fff;--tx:#12203a;--mut:#5b6b85;--ac:#2456d6;--ac2:#f59e0b;--ok:#15803d;--bad:#c62828;--bd:#d6deeb;--soft:#e8eefb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0e1626;--card:#16223a;--tx:#e8eefc;--mut:#9fb0cc;--ac:#6c9bff;--ac2:#fbbf24;--ok:#4ade80;--bad:#ff8a80;--bd:#2a3a5c;--soft:#1c2c4d;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#0e1626;--card:#16223a;--tx:#e8eefc;--mut:#9fb0cc;--ac:#6c9bff;--ac2:#fbbf24;--ok:#4ade80;--bad:#ff8a80;--bd:#2a3a5c;--soft:#1c2c4d;color-scheme:dark}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 \"Trebuchet MS\",\"Segoe UI\",system-ui,sans-serif}\n.wrap{max-width:760px;margin:0 auto;padding:14px}\nh1{font-size:1.55rem;margin:6px 0 2px}h2{font-size:1.25rem;margin:18px 0 8px}h3{font-size:1.02rem;margin:0 0 6px}\np{margin:6px 0}.mut{color:var(--mut);font-size:.92rem}\n.top{display:flex;justify-content:space-between;align-items:center;gap:8px}\n.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}\nbutton{font:inherit;cursor:pointer;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px 10px;min-height:48px;transition:transform .15s,background .2s,border-color .2s}\nbutton:active{transform:scale(.96)}\nbutton:focus-visible,input:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}\n.tabs button{padding:10px 4px;font-size:.88rem;font-weight:700}\n.tabs button.on,.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}\n.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}\n.sec{display:none}.sec.on{display:block;animation:fi .35s}\n@keyframes fi{from{opacity:0}to{opacity:1}}\ncanvas{width:100%;height:150px;display:block;border-radius:12px;background:var(--soft)}\nlabel{display:flex;justify-content:space-between;font-weight:700;margin-top:10px}\ninput[type=range]{width:100%;height:36px;accent-color:var(--ac)}\n.res{font-size:1.15rem;font-weight:700;color:var(--ac);background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:10px}\n.chain{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0}\n.node{padding:12px;border-radius:12px;border:2px solid var(--bd);opacity:.45;transform:scale(.97);transition:all .5s;font-weight:700}\n.node.on{opacity:1;transform:scale(1);border-color:var(--ac2);background:var(--soft);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac2) 30%,transparent)}\n@media(min-width:560px){.chain{grid-template-columns:repeat(4,1fr)}.node{text-align:center}}\n.step{opacity:0;max-height:0;overflow:hidden;transform:translateX(-24px);transition:all .5s;border-left:5px solid var(--ac);background:var(--card);border-radius:10px;padding:0 12px;margin:0 0 0 calc(var(--i)*8px)}\n.step.show{opacity:1;max-height:140px;transform:none;padding:10px 12px;margin-bottom:8px}\n.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}\ntable{width:100%;border-collapse:collapse;font-size:.9rem}th,td{border-bottom:1px solid var(--bd);padding:7px 4px;text-align:left}\n.ex b{color:var(--ac)}\n.opt{display:block;width:100%;text-align:left;margin:6px 0}\n.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}\n.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}\n.fb{margin-top:8px;font-weight:700}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}\n.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}\n.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{min-height:44px;padding:8px 12px}\ninput[type=text]{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);min-height:48px}\nsvg text{fill:#fff;font-weight:700;pointer-events:none}\n.tri g{cursor:pointer}.tri circle{fill:var(--ac);transition:fill .2s,r .2s}.tri g.on circle{fill:var(--ac2);r:27}\n@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<div class=\"top\"><div><h1>Fizik masalalar yechish<\/h1><p class=\"mut\">8-sinf • Fizika<\/p><\/div><button id=\"th\" aria-label=\"Rejimni almashtirish\">🌓<\/button><\/div>\n<nav class=\"tabs\"><button class=\"on\">1-bo’lim<\/button><button>2-bo’lim<\/button><button>3-bo’lim<\/button><button>Test<\/button><\/nav>\n\n<!-- 1 -->\n<section class=\"sec on\">\n<h2>Masala yechish nima uchun kerak?<\/h2>\n<p>Masala yechish — nazariyani amalda sinash. U formulalarni mustahkamlaydi, mantiqiy fikrlashni o’stiradi va hayotiy muammolarni hisoblash orqali hal qilishga o’rgatadi.<\/p>\n<div class=\"card\"><div class=\"chain\" id=\"chain\"><div class=\"node\">📘 Nazariya<\/div><div class=\"node\">✏️ Masala<\/div><div class=\"node\">✅ Natija<\/div><div class=\"node\">🏗️ Hayotda qo’llash<\/div><\/div><button class=\"pri\" id=\"chb\" style=\"width:100%\">Zanjirni qayta yurgizish<\/button><\/div>\n<h2>Simulyatsiya: mashina yo’li<\/h2>\n<div class=\"card\"><canvas id=\"c1\"><\/canvas>\n<label>Tezlik v <span id=\"v1\">60 km/soat<\/span><\/label><input type=\"range\" id=\"r1\" min=\"20\" max=\"120\" step=\"10\" value=\"60\">\n<label>Vaqt t <span id=\"t1\">3 soat<\/span><\/label><input type=\"range\" id=\"r2\" min=\"1\" max=\"6\" step=\"1\" value=\"3\">\n<div class=\"res\" id=\"o1\"><\/div><\/div>\n<h2>Hayotiy misollar<\/h2>\n<div class=\"card\"><h3>🏗️ Qurilish<\/h3><p>Devor bosimi poydevorga qanchalik ta’sir qilishi p = F/S formulasi bilan hisoblanadi.<\/p><\/div>\n<div class=\"card\"><h3>🚌 Transport<\/h3><p>Yo’l vaqti va yoqilg’i sarfi s = v·t asosida rejalashtiriladi.<\/p><\/div>\n<div class=\"card\"><h3>💡 Elektr uskunalari<\/h3><p>Sim tanlash uchun tok kuchi I = q/t va kuchlanish U = I·R hisoblanadi.<\/p><\/div>\n<\/section>\n\n<!-- 2 -->\n<section class=\"sec\">\n<h2>Masalani yechish bosqichlari<\/h2>\n<div id=\"steps\"><\/div>\n<div class=\"row\"><button class=\"pri\" id=\"nx\">Keyingi bosqich<\/button><button id=\"rs\">Boshidan<\/button><\/div>\n<h2>Yechish usullari<\/h2>\n<div class=\"card ex\"><h3>1. Analitik usul<\/h3><p>Formula bilan: v = 5 m/s, t = 4 s bo’lsa, <b>s = v·t = 20 m<\/b>.<\/p><\/div>\n<div cl
