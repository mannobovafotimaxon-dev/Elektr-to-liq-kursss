20;--cd:#172033;--tx:#e8ecf4;--mu:#9aa5ba;--ln:#2a3550;--ac:#7ab0ff;--lq:#1b3558;--hd:rgba(14,19,32,.94)}}\n:root[data-theme=\"dark\"]{color-scheme:dark;--bg:#0e1320;--cd:#172033;--tx:#e8ecf4;--mu:#9aa5ba;--ln:#2a3550;--ac:#7ab0ff;--lq:#1b3558;--hd:rgba(14,19,32,.94)}\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:inherit}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nbody::before{content:\"\";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}\nheader{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln);padding:10px 12px 8px}\nh1{font-size:1.15rem;margin:0 0 8px;text-align:center}\nnav{display:flex;gap:6px;max-width:900px;margin:auto}\n.tab{flex:1;min-height:46px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:12px;font:600 .82rem/1.2 inherit;padding:4px;cursor:pointer}\n.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}\nmain{max-width:900px;margin:auto;padding:12px}\n.sec{display:none}.sec.on{display:block}\n.card{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:0 0 14px}\nh2{font-size:1.2rem;margin:.2rem 0 .6rem}h3{font-size:1.02rem;margin:.2rem 0 .5rem}\np{margin:.4rem 0}.mu{color:var(--mu);font-size:.9rem}\n.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}\n.terms div{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:.92rem}\ncanvas{width:100%;display:block;border-radius:12px;background:var(--bg)}\n.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}\n.btn,.chip{min-height:46px;padding:8px 16px;border-radius:12px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);font:600 .95rem inherit;cursor:pointer}\n.btn{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.off{background:var(--cd);color:var(--tx);border-color:var(--ln)}\n.chip.on{outline:3px solid var(--ac);outline-offset:-1px}\n.sl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:8px 0}\ninput[type=range]{width:100%;height:36px;accent-color:var(--ac)}\n.v{min-width:70px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}\n.rx{background:var(--bg);border-left:4px solid var(--ac);border-radius:8px;padding:8px 12px;margin:6px 0;font-size:.98rem}\n.law{text-align:center;font-size:1.25rem;font-weight:700;background:var(--lq);border-radius:12px;padding:12px;margin:8px 0}\n.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:8px 0}\n.big div{background:var(--bg);border-radius:12px;padding:8px 4px}.big b{display:block;font-size:1.2rem}\n.steps{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:.95rem;line-height:1.9;overflow-x:auto}\ndetails{background:var(--bg);border-radius:10px;padding:8px 12px;margin:6px 0}summary{cursor:pointer;font-weight:600;min-height:32px}\ninput[type=text]{min-height:46px;width:130px;border:1px solid var(--ln);border-radius:10px;padding:0 10px;font-size:1rem;background:var(--cd);color:var(--tx)}\n.res{font-weight:700;margin-left:4px}.ok{color:var(--ok)}.bad{color:var(--bad)}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}\n.grid svg{width:100%;height:auto;background:var(--bg);border-radius:10px}\n.grid .card{margin:0}.eq{font-weight:600;background:var(--bg);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:.92rem}\n.opt{display:block;width:100%;text-align:left;margin:6px 0;min-height:46px;padding:8px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);font:inherit;cursor:pointer}\n.opt.sel{outline:3px solid var(--ac);outline-offset:-1px}.opt.c{background:rgba(22,163,74,.22)}.opt.w{background:rgba(220,38,38,.2)}\n<\/style><\/head><body>\n<header><h1>⚡ Elektroliz. Faradeyning birinchi qonuni<\/h1>\n<nav><button class=\"tab on\">1. Elektroliz hodisasi<\/button><button class=\"tab\">2. Faradey qonuni<\/button><button class=\"tab\">3. Qoʻllanilishi<\/button><\/nav><\/header>\n<main>\n\n<section class=\"sec on\" id=\"s1\">\n<div class=\"card\"><h2>Elektroliz nima?<\/h2>\n<p><b>Elektroliz<\/b> — elektrolit eritmasi yoki suyuqlanmasidan oʻzgarmas tok oʻtganda elektrodlarda oksidlanish-qaytarilish reaksiyalari borib, modda ajralib chiqadigan jarayon.<\/p>\n<div class=\"terms\">\n<div><b>Elektrolit<\/b> — eritmada ionlarga ajraladigan modda (tuz, kislota, asos).<\/div>\n<div><b>Dissotsiatsiya<\/b> — modda suvda ionlarga ajralishi.<\/div>\n<div><b>Katod (−)<\/b> — manfiy elektrod; kationlar elektron qabul qilib <i>qaytariladi<\/i>.<\/div>\n<div><b>Anod (+)<\/b> — musbat elektrod; anionlar elektron berib <i>oksidlanadi<\/i>.<\/div>\n<div><b>Kation (+)<\/b> — musbat ion, katodga boradi.<\/div>\n<div><b>Anion (−)<\/b> — manfiy ion, anodga boradi.<\/div><\/div><\/div>\n<div class=\"card\"><h3>Animatsiya (inert — grafit elektrodlar)<\/h3>\n<canvas id=\"c1\" style=\"height:300px\"><\/canvas>\n<div class=\"row\"><button class=\"btn off\" id=\"pw\">▶ Tokni yoqish<\/button><span class=\"mu\" id=\"el-l\">Elektrolit:<\/span>\n<button class=\"chip on\" data-e=\"cu\">CuSO₄<\/button><button class=\"chip\" data-e=\"nacl\">NaCl<\/button><button class=\"chip\" data-e=\"ag\">AgNO₃<\/button><\/div>\n<div class=\"sl\"><span>Kuchlanish<\/span><input type=\"range\" id=\"vv\" min=\"1\" max=\"12\" step=\"1\" value=\"6\"><span class=\"v\" id=\"vo\">6 V<\/span><\/div>\n<div id=\"rx\"><\/div><\/div>\n<\/section>\n\n<section class=\"sec\" id=\"s2\">\n<div class=\"card\"><h2>Faradeyning birinchi qonuni<\/h2>\n<p>Elektrodda ajralgan modda massasi elektrolit orqali oʻtgan elektr zaryadiga toʻgʻri proporsional.<\/p>\n<div class=\"law\">m = k·I·t = k·q<\/div>\n<div class=\"law\">k = M / (F·n)<\/div>\n<p class=\"mu\">k — elektrokimyoviy ekvivalent (g/C), M — molyar massa (g/mol), n — ionning zaryad soni (qabul qilingan elektronlar), F = 96485 C/mol — Faradey doimiysi, q = I·t.<\/p><\/div>\n<div class=\"card\"><h3>Simulyatsiya<\/h3>\n<div class=\"row\" id=\"mch\"><\/div>\n<div class=\"sl\"><span>I<\/span><input type=\"range\" id=\"Is\" min=\"0.1\" max=\"5\" step=\"0.1\" value=\"2\"><span class=\"v\" id=\"Io\"><\/span><\/div>\n<div class=\"sl\"><span>t<\/span><input type=\"range\" id=\"ts\" min=\"0\" max=\"60\" step=\"0.5\" value=\"20\"><span class=\"v\" id=\"to\"><\/span><\/div>\n<div class=\"row\"><button class=\"btn\" id=\"pl\">▶ Vaqtni oʻtkazish<\/button><button class=\"chip\" id=\"rs\">↺ 0<\/button><\/div>\n<div class=\"big\"><div>q<b id=\"bq\"><\/b><\/div><div>k<b id=\"bk\"><\/b><\/div><div>m<b id=\"bm\"><\/b><\/div><\/div>\n<canvas id=\"c2\" style=\"height:150px\"><\/canvas>\n<p class=\"mu\">Katod kesimi: ajralgan metall qatlami m ga mos qalinlashadi (barcha metallar uchun bir xil masshtab).<\/p><\/div>\n<div class=\"card\"><h3>m ning t (q = I·t) ga bogʻliqligi<\/h3><canvas id=\"c3\" style=\"height:260px\"><\/canvas>\n<p class=\"mu\">Joriy I da barcha metallar: toʻgʻri chiziqlar, qiyaligi k·I ga teng. Nuqtalar — tanlangan t.<\/p><\/div>\n<div class=\"card\"><h3>Kalkulyator — qadam-baqadam yechim<\/h3><p class=\"mu\">Yuqoridagi modda, I va t qiymatlari ishlatiladi.<\/p><div class=\"steps\" id=\"st\"><\/div><\/div>\n<div class=\"card\"><h3>Namunaviy masalalar<\/h3><div id=\"ex\"><\/div><\/div>\n<div class=\"card\"><h3>Mustaqil masalalar<\/h3><div id=\"pr\"><\/div><\/div>\n<\/section>\n\n<section class=\"sec\" id=\"s3\">\n<div class=\"card\"><h2>Elektrolizning amaliy qoʻllanilishi<\/h2><p class=\"mu\">Har bir sxemada: chapda katod (−), oʻngda anod (+); ionlar katodga qarab harakatlanadi.<\/p><\/div>\n<div class=\"grid\" id=\"ap\"><\/div>\n<div class=\"card\" style=\"margin-top:14px\"><h3>Yakuniy test<\/h3><div id=\"qz\"><\/div>\n<div class=\"row\"><button class=\"btn\" id=\"qb\">Tekshirish<\/button><b id=\"qr\"><\/b><\/div><\/div>\n<\/section>\n<\/main>\n<script>\nconst $=id=>document.getElementById(id),F=96485,dpr=Math.min(devicePixelRatio||1,2);\nconst MT={Cu:{n:\"Mis\",M:63.55,z:2,c:\"#c8642d\"},Ag:{n:\"Kumush\",M:107.87,z:1,c:\"#9aa3ad\"},Ni:{n:\"Nikel\",M:58.69,z:2,c:\"#4f9a93\"},Zn:{n:\"Rux\",M:65.38,z:2,c:\"#7d8fb3\"},Al:{n:\"Alyuminiy\",M:26.98,z:3,c:\"#d08fb0\"}};\nconst kk=s=>MT[s].M/(F*MT[s].z);\nconst sg=(x,p=4)=>Number(x.toPrecision(p)).toString().replace(\".\",\",\");\nconst css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nfunction fit(cv){const W=cv.clientWidth,H=cv.clientHeight;if(!W)return null;if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}const x=cv.getContext(\"2d\");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);return{x,W,H}}\n/* tabs */\ndocument.querySelectorAll(\".tab\").forEach((b,i)=>b.onclick=()=>{document.querySelectorAll(\".tab\").forEach((t,j)=>t.classList.toggle(\"on\",i==j));document.querySelectorAll(\".sec\").forEach((s,j)=>s.classList.toggle(\"on\",i==j));scrollTo(0,0)});\n/* ===== 1-bo'lim ===== */\nconst E={cu:{cat:[\"Cu²⁺\",\"#3b82f6\"],an:[\"SO₄²⁻\",\"#a855f7\"],kd:\"#c8642d\",kg:0,ag:\"rgba(190,210,240,.9)\",liq:\"rgba(59,130,246,.3)\",\nr:[\"CuSO₄ → Cu²⁺ + SO₄²⁻ (dissotsiatsiya)\",\"Katod (−): Cu²⁺ + 2e⁻ → Cu⁰ (mis ajraladi)\",\"Anod (+): 2H₂O − 4e⁻ → O₂↑ + 4H⁺\"]},\nnacl:{cat:[\"Na⁺\",\"#f59e0b\"],an:[\"Cl⁻\",\"#10b981\"],kd:0,kg:\"rgba(190,215,255,.9)\",ag:\"#c5d93a\",liq:\"rgba(148,163,184,.22)\",\nr:[\"NaCl → Na⁺ + Cl⁻ (dissotsiatsiya)\",\"Katod (−): 2H₂O + 2e⁻ → H₂↑ + 2OH⁻\",\"Anod (+): 2Cl⁻ − 2e⁻ → Cl₂↑\"]},\nag:{cat:[\"Ag⁺\",\"#94a3b8\"],an:[\"NO₃⁻\",\"#ef4444\"],kd:\"#b4bcc7\",kg:0,ag:\"rgba(190,210,240,.9)\",liq:\"rgba(148,163,184,.22)\",\nr:[\"AgNO₃ → Ag⁺ + NO₃⁻ (dissotsiatsiya)\",\"Katod (−): Ag⁺ + e⁻ → Ag⁰ (kumush ajraladi)\",\"Anod (+): 2H₂O − 4e⁻ → O₂↑ + 4H⁺\"]}};\nlet el=\"cu\",on=false,dep=0,ions=[],bub=[];\nfunction reset1(){dep=0;bub=[];ions=[];for(let i=0;i<7;i++){ions.push({c:1,x:Math.random(),y:Math.random()},{c:0,x:Math.random(),y:Math.random()})}\n $(\"rx\").innerHTML=E[el].r.map(t=>`<div class=\"rx\">${t}<\/div>`).join(\"\")}\ndocument.querySelectorAll(\"[data-e]\").forEach(b=>b.onclick=()=>{el=b.dataset.e;document.querySelectorAll(\"[data-e]\").forEach(x=>x.classList.toggle(\"on\",x==b));reset1()});\n$(\"pw\").onclick=()=>{on=!on;$(\"pw\").textContent=on?\"⏸ Tokni oʻchirish\":\"▶ Tokni yoqish\";$(\"pw\").classList.toggle(\"off\",!on)};\n$(\"vv\").oninput=e=>$(\"vo\").textContent=e.target.value+\" V\";\nreset1();\nfunction d1(){const f=fit($(\"c1\"));if(!f)return;const{x,W,H}=f,e=E[el],mu=css(\"--mu\"),tx=css(\"--tx\");\n const bx=W*.06,bw=W*.88,by=H*.36,bb=H*.95,cx=W*.2,ax=W*.8,ew=12,ey=H*.14,ey2=H*.82;\n x.fillStyle=e.liq;x.fillRect(bx,by,bw,bb-by);x.strokeStyle=mu;x.lineWidth=2;x.beginPath();x.moveTo(bx,H*.28);x.lineTo(bx,bb);x.lineTo(bx+bw,bb);x.lineTo(bx+bw,H*.28);x.stroke();\n /* simlar va batareya */\n x.strokeStyle=tx;x.lineWidth=2;x.beginPath();x.moveTo(cx,ey);x.lineTo(cx,H*.07);x.lineTo(W*.4,H*.07);x.moveTo(ax,ey);x.lineTo(ax,H*.07);x.lineTo(W*.6,H*.07);x.stroke();\n x.fillStyle=css(\"--cd\");x.fillRect(W*.4,H*.02,W*.2,H*.1);x.strokeRect(W*.4,H*.02,W*.2,H*.1);\n x.fillStyle=tx;x.font=\"bold 13px system-ui\";x.textAlign=\"center\";x.fillText($(\"vv\").value+\" V\",W*.5,H*.085);\n x.fillStyle=\"#2563eb\";x.fillText(\"−\",W*.43,H*.085);x.fillStyle=\"#dc2626\";x.fillText(\"+\",W*.57,H*.085);\n /* elektrodlar */\n const th=e.kd?Math.min(10,dep*.07):0;\n x.fillStyle=\"#4b5563\";x.fillRect(cx-ew/2,ey,ew,ey2-ey);x.fillRect(ax-ew/2,ey,ew,ey2-ey);\n if(th){x.fillStyle=e.kd;x.fillRect(cx+ew/2,by,th,ey2-by);x.fillRect(cx-ew/2-th,by,th,ey2-by)}\n x.fillStyle=mu;x.font=\"12px system-ui\";x.textAlign=\"right\";x.fillText(\"Katod (−)\",cx-12,H*.31);x.textAlign=\"left\";x.fillText(\"Anod (+)\",ax+12,H*.31);\n /* ionlar */\n const x0=cx+ew/2+16,x1=ax-ew/2-16,y0=by+18,y1=bb-14,v=on?.5+$(\"vv\").value*.22:0,vn=v/(x1-x0);\n for(const p of ions){if(on){p.x+=(p.c?-1:1)*vn;p.y+=(Math.random()-.5)*.03}else{p.x+=(Math.random()-.5)*.012;p.y+=(Math.random()-.5)*.02}\n  p.y=Math.max(0,Math.min(1,p.y));\n  if(p.c&&p.x<0){p.x=.85+Math.random()*.15;dep++;if(e.kg)bub.push({x:cx+(Math.random()-.5)*14,y:by+Math.random()*(ey2-by),c:e.kg})}\n  else if(!p.c&&p.x>1){p.x=Math.random()*.15;bub.push({x:ax+(Math.random()-.5)*14,y:by+Math.random()*(ey2-by),c:e.ag})}\n  p.x=Math.max(-.2,Math.min(1.05,p.x));\n  const[l,c]=p.c?e.cat:e.an,X=x0+p.x*(x1-x0),Y=y0+p.y*(y1-y0);\n  x.fillStyle=c;x.beginPath();x.arc(X,Y,11,0,7);x.fill();x.fillStyle=\"#fff\";x.font=\"bold 9px system-ui\";x.textAlign=\"center\";x.fillText(l,X,Y+3)}\n bub=bub.filter(b=>(b.y-=1.3)>by-6).slice(-70);\n for(const b of bub){x.fillStyle=b.c;x.beginPath();x.arc(b.x,b.y,3.2,0,7);x.fill()}\n x.fillStyle=mu;x.font=\"12px system-ui\";x.textAlign=\"center\";\n x.fillText(on?\"Tok oʻtmoqda: kationlar ← katod, anod → anionlar\":\"Tok oʻchiq: ionlar xaotik harakatda\",W/2,H*.995-2)}\n/* ===== 2-bo'lim ===== */\nlet ms=\"Cu\",pl=false;\n$(\"mch\").innerHTML=Object.keys(MT).map(s=>`<button class=\"chip${s==\"Cu\"?\" on\":\"\"}\" data-m=\"${s}\" style=\"border-bottom:5px solid ${MT[s].c}\">${s}<\/button>`).join(\"\");\ndocument.querySelectorAll(\"[data-m]\").forEach(b=>b.onclick=()=>{ms=b.dataset.m;document.querySelectorAll(\"[data-m]\").forEach(x=>x.classList.toggle(\"on\",x==b));u2()});\n[\"Is\",\"ts\"].forEach(i=>$(i).oninput=u2);\n$(\"pl\").onclick=()=>{if(+$(\"ts\").value>=60)$(\"ts\").value=0;pl=!pl;$(\"pl\").textContent=pl?\"⏸ Toʻxtatish\":\"▶ Vaqtni oʻtkazish\"};\n$(\"rs\").onclick=()=>{pl=false;$(\"pl\").textContent=\"▶ Vaqtni oʻtkazish\";$(\"ts\").value=0;u2()};\nfunction steps(s,I,tm){const o=MT[s],ts=tm*60,q=I*ts,k=kk(s),m=k*q;\n return `<b>1) Berilgan:<\/b> ${o.n} (M = ${sg(o.M)} g/mol, n = ${o.z}); I = ${sg(I)} A; t = ${sg(tm)} min = ${sg(ts)} s.<br>\n<b>2) Zaryad:<\/b> q = I·t = ${sg(I)} · ${sg(ts)} = ${sg(q)} C.<br>\n<b>3) k:<\/b> k = M/(F·n) = ${sg(o.M)}/(96485·${o.z}) = ${sg(k)} g/C = ${sg(k*1000)} mg/C.<br>\n<b>4) Massa:<\/b> m = k·q = ${sg(k)} · ${sg(q)} = <b>${sg(m)} g<\/b> (${sg(m*1000)} mg).<br>\n<b>5) Modda miqdori:<\/b> ν = q/(n·F) = ${sg(q/(o.z*F))} mol.`}\nfunction u2(){const I=+$(\"Is\").value,t=+$(\"ts\").value,k=kk(ms),q=I*t*60,m=k*q;\n $(\"Io\").textContent=sg(I,2)+\" A\";$(\"to\").textContent=sg(t,3)+\" min\";\n $(\"bq\").textContent=sg(q)+\" C\";$(\"bk\").textContent=sg(k*1000)+\" mg/C\";$(\"bm\").textContent=m<1?sg(m*1000)+\" mg\":sg(m)+\" g\";\n $(\"st\").innerHTML=steps(ms,I,t)}\nfunction d2(){if(pl){const t=Math.min(60,+$(\"ts\").value+.15);$(\"ts\").value=t;if(t>=60){pl=false;$(\"pl\").textContent=\"▶ Vaqtni oʻtkazish\"}u2()}\n let f=fit($(\"c2\"));if(f){const{x,W,H}=f,m=kk(ms)*+$(\"Is\").value*+$(\"ts\").value*60,th=2+Math.min(m/20.2,1)*55,cx=W/2,pw=30;\n  x.fillStyle=\"#4b5563\";x.fillRect(cx-pw/2,10,pw,H-20);x.fillStyle=MT[ms].c;x.fillRect(cx+pw/2,10,th,H-20);x.fillRect(cx-pw/2-th,10,th,H-20);\n  x.fillStyle=css(\"--mu\");x.font=\"12px system-ui\";x.textAlign=\"left\";x.fillText(\"katod\",cx+pw/2+th+8,H/2-6);x.fillText(\"qatlam: \"+(m<1?sg(m*1000,3)+\" mg\":sg(m,3)+\" g\"),cx+pw/2+th+8,H/2+10)}\n f=fit($(\"c3\"));if(f){const{x,W,H}=f,I=+$(\"Is\").value,t=+$(\"ts\").value,L=44,B=28,T=10,R=12,ks=Object.keys(MT);\n  let ym=Math.max(...ks.map(s=>kk(s)*I*3600))*1.08;const px=v=>L+v/60*(W-L-R),py=v=>H-B-v/ym*(H-B-T),mu=css(\"--mu\");\n  x.strokeStyle=css(\"--ln\");x.fillStyle=mu;x.font=\"11px system-ui\";x.lineWidth=1;\n  for(let i=0;i<=4;i++){const y=ym*i/4;x.beginPath();x.moveTo(L,py(y));x.lineTo(W-R,py(y));x.stroke();x.textAlign=\"right\";x.fillText(sg(y,2),L-4,py(y)+4)}\n  for(let i=0;i<=6;i++){x.textAlign=\"center\";x.fillText(i*10,px(i*10),H-B+14)}\n  x.fillText(\"t, min\",W-R-16,H-4);x.save();x.translate(10,T+40);x.rotate(-Math.PI/2);x.fillText(\"m, g\",0,0);x.restore();\n  ks.forEach((s,i)=>{const k=kk(s)*I,c=MT[s].c;x.strokeStyle=c;x.lineWidth=s==ms?4:2;x.beginPath();x.moveTo(px(0),py(0));x.lineTo(px(60),py(k*3600));x.stroke();\n   x.fillStyle=c;x.beginPath();x.arc(px(t),py(k*t*60),5,0,7);x.fill();x.font=\"bold 12px system-ui\";x.textAlign=\"left\";x.fillText(s,L+8+i*42,T+12)})}}\n/* masalalar */\nconst fx=sg;\nfunction mkEx(){const k=s=>kk(s);let h=\"\";\n h+=`<details><summary>1-masala. Mis kuporosi eritmasidan I = 2 A tok 30 min oʻtganda katodda qancha mis ajraladi?<\/summary>${steps(\"Cu\",2,30)}<\/details>`;\n const t2=1.08/(k(\"Ag\")*2);\n h+=`<details><summary>2-masala. AgNO₃ eritmasidan 1,08 g kumush ajratish uchun I = 2 A tok qancha vaqt oʻtishi kerak?<\/summary>k = 107,87/(96485·1) = ${fx(k(\"Ag\"))} g/C.<br>t = m/(k·I) = 1,08/(${fx(k(\"Ag\"))}·2) = <b>${fx(t2,3)} s ≈ ${fx(t2/60,3)} min<\/b>.<\/details>`;\n h+=`<details><summary>3-masala. Alyuminiy olishda I = 10 A tok 1 soat oʻtkazildi. Katodda necha gramm Al ajraladi?<\/summary>${steps(\"Al\",10,60)}<\/details>`;$(\"ex\").innerHTML=h}\nconst PR=[{q:\"Ni (M = 58,69; n = 2), I = 3 A, t = 20 min. m = ? (g)\",a:kk(\"Ni\")*3*1200},{q:\"AgNO₃ eritmasi: I = 1,5 A tokda 3 g Ag ajratish uchun t = ? (min)\",a:3/(kk(\"Ag\")*1.5)/60},{q:\"Ruxning (M = 65,38; n = 2) elektrokimyoviy ekvivalenti k = ? (mg/C)\",a:kk(\"Zn\")*1000}];\n$(\"pr\").innerHTML=PR.map((p,i)=>`<div style=\"margin:10px 0\"><b>${i+1}.<\/b> ${p.q}<div class=\"row\"><input type=\"text\" inputmode=\"decimal\" id=\"pi${i}\" placeholder=\"javob\"><button class=\"btn\" data-p=\"${i}\">Tekshirish<\/button><span class=\"res\" id=\"pp${i}\"><\/span><\/div><\/div>`).join(\"\");\ndocument.querySelectorAll(\"[data-p]\").forEach(b=>b.onclick=()=>{const i=+b.dataset.p,v=parseFloat($(\"pi\"+i).value.replace(\",\",\".\")),a=PR[i].a,r=$(\"pp\"+i);\n if(isNaN(v)){r.className=\"res bad\";r.textContent=\"Son kiriting\";return}\n const ok=Math.abs(v-a)/a<.02;r.className=\"res \"+(ok?\"ok\":\"bad\");r.textContent=ok?\"✓ Toʻgʻri! (\"+sg(a)+\")\":\"✗ Notoʻgʻri. Toʻgʻri javob: \"+sg(a)})\n/* ===== 3-bo'lim ===== */\nconst sch=o=>`<svg viewBox=\"0 0 160 100\" role=\"img\"><rect x=\"14\" y=\"30\" width=\"132\" height=\"64\" rx=\"8\" fill=\"${o.l||\"var(--lq)\"}\" stroke=\"var(--mu)\"/><rect x=\"42\" y=\"10\" width=\"9\" height=\"66\" rx=\"2\" fill=\"${o.c}\"/><rect x=\"109\" y=\"10\" width=\"9\" height=\"66\" rx=\"2\" fill=\"${o.a}\"/><rect x=\"51\" y=\"34\" width=\"0\" height=\"38\" fill=\"${o.d}\"><animate attributeName=\"width\" values=\"0;7;7\" dur=\"4s\" repeatCount=\"indefinite\"/><\/rect>`+\n [0,1,2].map(i=>`<circle r=\"3.5\" cy=\"${42+i*14}\" fill=\"${o.i}\"><animate attributeName=\"cx\" values=\"104;57\" dur=\"${2.4+i*.5}s\" repeatCount=\"indefinite\"/><\/circle>`).join(\"\")+\n [[o.gc,60],[o.ga,100]].map(([c,X])=>c?[0,1].map(j=>`<circle r=\"2.6\" cx=\"${X+j*5}\" fill=\"${c}\"><animate attributeName=\"cy\" values=\"76;34\" dur=\"${1.6+j*.6}s\" repeatCount=\"indefinite\"/><\/circle>`).join(\"\"):\"\").join(\"\")+\n `<text x=\"46.5\" y=\"8\" text-anchor=\"middle\" font-size=\"10\" fill=\"#2563eb\" font-weight=\"700\">−<\/text><text x=\"113.5\" y=\"8\" text-anchor=\"middle\" font-size=\"10\" fill=\"#dc2626\" font-weight=\"700\">+<\/text><\/svg>`;\nconst AP=[\n{t:\"Galvanostegiya (xromlash, nikellash)\",s:{c:\"#8b95a1\",a:\"#4f9a93\",d:\"#d8dee6\",i:\"#22c55e\"},e:\"Ni²⁺ + 2e⁻ → Ni (buyum sirtida)\",x:\"Velosiped rul, kran va avtomobil bamperi zanglamasligi va yaltirashi uchun yupqa Ni/Cr qatlam bilan qoplanadi.\"},\n{t:\"Galvanoplastika\",s:{c:\"#94a3b8\",a:\"#c8642d\",d:\"#c8642d\",i:\"#3b82f6\"},e:\"Cu²⁺ + 2e⁻ → Cu (qolipda)\",x:\"Haykal va bosma klishe nusxalari, audio-disk matritsalari, muzey eksponatlari nusxasi.\"},\n{t:\"Alyuminiy olish\",s:{l:\"rgba(251,146,60,.38)\",c:\"#374151\",a:\"#374151\",d:\"#d6dae0\",i:\"#e2e8f0\",ga:\"#9ca3af\"},e:\"Al³⁺ + 3e⁻ → Al; anodda grafit yonib CO₂ hosil boʻladi\",x:\"Al₂O₃ kriolitda ≈950 °C da suyuqlantiriladi. Samolyot, kabel, qadoq folgasi; juda koʻp elektr energiya sarflanadi.\"},\n{t:\"Rafinirlash (mis tozalash)\",s:{c:\"#c8642d\",a:\"#6b4a3a\",d:\"#c8642d\",i:\"#3b82f6\"},e:\"Anod: Cu − 2e⁻ → Cu²⁺; katod: Cu²⁺ + 2e⁻ → Cu\",x:\"Elektr simlari uchun juda toza mis olinadi; anod loyqasida oltin va kumush yigʻiladi.\"},\n{t:\"Suvdan vodorod olish\",s:{c:\"#4b5563\",a:\"#4b5563\",d:\"transparent\",i:\"#60a5fa\",gc:\"#bfdbfe\",ga:\"#e5e7eb\"},e:\"2H₂O → 2H₂↑ + O₂↑ (H₂ va O₂ hajmi 2 : 1)\",x:\"“Yashil vodorod” — qayta tiklanuvchi energiya bilan olinadigan ekologik toza yoqilgʻi.\"},\n{t:\"Xlor va NaOH ishlab chiqarish\",s:{c:\"#4b5563\",a:\"#4b5563\",d:\"transparent\",i:\"#f59e0b\",gc:\"#bfdbfe\",ga:\"#c5d93a\"},e:\"2NaCl + 2H₂O → 2NaOH + H₂↑ + Cl₂↑\",x:\"Suvni zararsizlantirish, sovun, qogʻoz va tozalash vositalari ishlab chiqarish.\"}];\n$(\"ap\").innerHTML=AP.map(a=>`<div class=\"card\"><h3>${a.t}<\/h3>${sch(a.s)}<div class=\"eq\">${a.e}<\/div><p class=\"mu\"><b>Hayotdan:<\/b> ${a.x}<\/p><\/div>`).join(\"\");\nconst QZ=[\n{q:\"Elektrolizda kationlar qaysi elektrodga harakatlanadi?\",o:[\"Anodga\",\"Katodga\",\"Ikkalasiga\",\"Hech biriga\"],a:1,e:\"Kationlar musbat, shuning uchun manfiy elektrod — katodga boradi.\"},\n{q:\"2 A tok 100 s oʻtganda elektrolitdan oʻtgan zaryad q = ?\",o:[\"50 C\",\"102 C\",\"200 C\",\"20 C\"],a:2,e:\"q = I·t = 2·100 = 200 C.\"},\n{q:\"Elektrokimyoviy ekvivalent formulasi qaysi?\",o:[\"k = M·F·n\",\"k = M/(F·n)\",\"k = F/(M·n)\",\"k = n/(M·F)\"],a:1,e:\"k = M/(F·n), F = 96485 C/mol.\"},\n{q:\"Bir xil tok va vaqtda Cu, Ag, Al dan qaysi birining massasi eng katta ajraladi?\",o:[\"Cu\",\"Ag\",\"Al\",\"Barchasi bir xil\"],a:1,e:\"M/n: Ag — 107,9; Cu — 31,8; Al — 9,0. Ag uchun k eng katta.\"},\n{q:\"NaCl eritmasi elektrolizida (inert elektrodlar) katodda nima ajraladi?\",o:[\"Na metali\",\"Cl₂\",\"H₂\",\"O₂\"],a:2,e:\"Katodda suv qaytariladi: 2H₂O + 2e⁻ → H₂↑ + 2OH⁻.\"}];\nlet qa=QZ.map(()=>-1),qd=false;\nfunction rq(){$(\"qz\").innerHTML=QZ.map((q,i)=>`<div style=\"margin:12px 0\"><b>${i+1}. ${q.q}<\/b>`+q.o.map((o,j)=>`<button class=\"opt${qa[i]==j?\" sel\":\"\"}${qd&&j==q.a?\" c\":\"\"}${qd&&qa[i]==j&&j!=q.a?\" w\":\"\"}\" data-q=\"${i}\" data-j=\"${j}\">${o}<\/button>`).join(\"\")+(qd?`<div class=\"mu\">💡 ${q.e}<\/div>`:\"\")+`<\/div>`).join(\"\");\n document.querySelectorAll(\"[data-q]\").forEach(b=>b.onclick=()=>{if(qd)return;qa[+b.dataset.q]=+b.dataset.j;rq()})}\n$(\"qb\").onclick=()=>{if(qa.includes(-1)){$(\"qr\").textContent=\"Avval barcha savollarga javob bering\";return}qd=true;const s=qa.filter((v,i)=>v==QZ[i].a).length;$(\"qr\").textContent=`Natija: ${s} / 5 `+(s==5?\"🏆 Aʼlo!\":s>=3?\"👍 Yaxshi\":\"📘 Mavzuni takrorlang\");rq()};\nrq();mkEx();u2();$(\"Io\").textContent=\"2 A\";\n(function loop(){d1();d2();requestAnimationFrame(loop)})();\n<\/script><\/body><\/html>\n"}, {"t": "Faradeyning 2-qonuni", "i": "2️⃣", "h": "<!DOCTYPE html>\n<html lang=\"uz\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Faradeyning ikkinchi qonuni<\/title>\n<style>\n:root{--bg:#f6f8fb;--card:#fff;--tx:#18212f;--mu:#5b6677;--ac:#2563eb;--bd:#dde3ec;--ok:#16a34a;--no:#dc2626;--liq:#e8f1ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0f1520;--card:#18202e;--tx:#e8edf5;--mu:#9aa6b8;--ac:#6ea0ff;--bd:#2a3547;--liq:#16273f;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#0f1520;--card:#18202e;--tx:#e8edf5;--mu:#9aa6b8;--ac:#6ea0ff;--bd:#2a3547;--liq:#16273f;color-scheme:dark}\n*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nmain{max-width:820px;margin:0 auto;padding:12px 14px 40px}\nh1{font-size:1.6rem;margin:.6em 0 .2em}h2{font-size:1.3rem;margin:0 0 .5em}h3{font-size:1.05rem;margin:1em 0 .3em}\n.sub{color:var(--mu);margin:0 0 14px}\nsection{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:16px 0}\nnav{display:flex;gap:6px;overflow-x:auto;margin:8px 0}nav a{white-space:nowrap;padding:6px 12px;border:1px solid var(--bd);border-radius:99px;color:var(--ac);text-decoration:none;background:var(--card);font-size:.9rem}\n.f{font:1.15rem Georgia,serif;text-align:center;padding:10px;background:var(--bg);border-radius:10px;margin:10px 0;overflow-x:auto}\ncanvas{width:100%;max-width:300px;height:auto;aspect-ratio:300/190;background:var(--liq);border-radius:10px;border:1px solid var(--bd)}\n.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}\nlabel{display:block;font-size:.92rem;margin:8px 0 2px}input[type=range]{width:100%}\n.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}\nbutton{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:10px;cursor:pointer}\nbutton.on{background:var(--ac);color:#fff;border-color:var(--ac)}\ntable{width:100%;border-collapse:collapse;font-size:.9rem;margin:8px 0}td,th{border-bottom:1px solid var(--bd);padding:5px 4px;text-align:left}\n.bar{height:14px;border-radius:7px;transition:width .2s;min-width:2px}\n.res{background:var(--bg);border-radius:10px;padding:10px;margin:8px 0}\n.q{border-top:1px dashed var(--bd);padding-top:10px;margin-top:10px}.q button{display:block;width:100%;text-align:left;margin:4px 0}\n.q .ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}.q .no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,transparent)}\n.ex{font-size:.92rem;color:var(--mu);margin-top:4px}\ndetails{border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin:8px 0}summary{cursor:pointer;font-weight:600}\n.leg{font-size:.85rem;color:var(--mu);text-align:center}\n.tg{float:right}\n<\/style><\/head><body><main>\n<button class=\"tg\" onclick=\"tgl()\" aria-label=\"Rejim\">◐ Rejim<\/button>\n<h1>⚡ Faradeyning ikkinchi qonuni<\/h1>\n<p class=\"sub\">Interaktiv dars · 9–11-sinf · Elektroliz<\/p>\n<nav><a href=\"#s1\">1. Qonun<\/a><a href=\"#s2\">2. Ekvivalent<\/a><a href=\"#s3\">3. Formula<\/a><a href=\"#s4\">Xulosa<\/a><a href=\"#s5\">Masalalar<\/a><\/nav>\n\n<section id=\"s1\"><h2>1. Faradeyning ikkinchi qonuni<\/h2>\n<p>Ingliz olimi <b>Maykl Faradey<\/b> (1791–1867) 1833–34-yillarda elektroliz qonunlarini aniqladi.<\/p>\n<p><b>Birinchi qonun:<\/b> ajralgan modda massasi elektrolitdan o‘tgan zaryadga to‘g‘ri proporsional: <i>m = k·Q<\/i>.<br>\n<b>Ikkinchi qonun:<\/b> bir xil zaryad turli elektrolitlardan o‘tganda, ajralgan modda massalari ularning kimyoviy ekvivalentlariga proporsional: <i>m₁ : m₂ : m₃ = E₁ : E₂ : E₃<\/i>. Birinchi qonun “qancha zaryad — shuncha massa” desa, ikkinchisi “turli moddalar orasidagi nisbat nima bilan belgilanadi” degan savolga javob beradi.<\/p>\n<h3>Simulyatsiya: uchta elektrolit ketma-ket ulangan<\/h3>\n<p class=\"ex\">Ketma-ket ulanganda uchala hujayradan <b>bir xil zaryad<\/b> o‘tadi. Zaryadni o‘zgartiring.<\/p>\n<label>Zaryad Q = <b id=\"q1v\">0.50<\/b> F (1 F = 96485 C)<\/label><input type=\"range\" id=\"q1\" min=\"0\" max=\"2\" step=\"0.05\" value=\"0.5\">\n<div class=\"row\"><div><canvas id=\"c1a\" width=\"300\" height=\"190\"><\/canvas><div class=\"leg\">CuSO₄ · Cu²⁺<\/div><\/div><div><canvas id=\"c1b\" width=\"300\" height=\"190\"><\/canvas><div class=\"leg\">AgNO₃ · Ag⁺<\/div><\/div><div><canvas id=\"c1c\" width=\"300\" height=\"190\"><\/canvas><div class=\"leg\">AlCl₃ · Al³⁺<\/div><\/div><\/div>\n<p class=\"leg\">● kation (+) katodga (−, chap) · ○ anion (−) anodga (+, o‘ng) · e⁻ va I strelkalari<\/p>\n<table id=\"t1\"><\/table>\n<div class=\"res\" id=\"r1\"><\/div>\n<div class=\"quiz\" id=\"z1\"><\/div><\/section>\n\n<section id=\"s2\"><h2>2. Kimyoviy ekvivalentning ahamiyati<\/h2>\n<p><b>Kimyoviy ekvivalent<\/b> — 1 mol elektronni (1 F) qabul qilib yoki berib ajraladigan modda massasi: <b>E = M / n<\/b>, bunda M — molyar massa (g/mol), n — ion zaryadi (valentlik).<\/p>\n<p>Nima uchun ekvivalent massani belgilaydi? Har bir ion katodda n ta elektron oladi. 1 mol elektron esa M/n gramm moddani neytrallaydi. Demak, <b>m = E · (o‘tgan elektronlar moli)<\/b>. Valentligi katta ion kamroq massa beradi.<\/p>\n<h3>Simulyatsiya: modda tanlang<\/h3>\n<div class=\"btns\" id=\"b2\"><\/div>\n<label>O‘tgan elektronlar: <b id=\"q2v\">0.50<\/b> mol e⁻<\/label><input type=\"range\" id=\"q2\" min=\"0\" max=\"1\" step=\"0.05\" value=\"0.5\">\n<div class=\"row\"><canvas id=\"c2\" width=\"300\" height=\"190\"><\/canvas><\/div>\n<div class=\"res\" id=\"r2\"><\/div>\n<div class=\"quiz\" id=\"z2\"><\/div><\/section>\n\n<section id=\"s3\"><h2>3. Formula va qo‘llanilishi<\/h2>\n<p>Zaryad Q = I·t ekanini va n·F zaryad bir mol ionni neytrallashini birlashtirsak:<\/p>\n<div class=\"f\">m = (M / (n·F)) · I · t<\/div>\n<table><tr><th>Belgi<\/th><th>Ma’nosi<\/th><th>Birligi<\/th><\/tr>\n<tr><td>m<\/td><td>ajralgan massa<\/td><td>g<\/td><\/tr><tr><td>M<\/td><td>molyar massa<\/td><td>g/mol<\/td><\/tr>\n<tr><td>n<\/td><td>ion zaryadi (valentlik)<\/td><td>—<\/td><\/tr><tr><td>F<\/td><td>Faradey doimiysi, 96485<\/td><td>C/mol<\/td><\/tr>\n<tr><td>I<\/td><td>tok kuchi<\/td><td>A<\/td><\/tr><tr><td>t<\/td><td>vaqt (sekundga o‘tkazing!)<\/td><td>s<\/td><\/tr><\/table>\n<details><summary>Masala 1 (Cu)<\/summary>Mis sulfat eritmasidan I = 2 A tok t = 30 min o‘tdi. m = ?<br>\n1) t = 30·60 = 1800 s<br>2) Q = 2·1800 = 3600 C<br>3) M = 63,55 g/mol, n = 2: E = 31,78 g/mol<br>\n4) m = 63,55/(2·96485) · 3600 = 3,293·10⁻⁴ · 3600 ≈ <b>1,19 g<\/b><\/details>\n<details><summary>Masala 2 (Al)<\/summary>Alyuminiy xlorid eritmasidan I = 10 A tok 1 soat o‘tdi. m = ?<br>\n1) t = 3600 s, Q = 36000 C<br>2) M = 26,98, n = 3: M/(nF) = 26,98/289455 = 9,321·10⁻⁵ g/C<br>\n3) m = 9,321·10⁻⁵ · 36000 ≈ <b>3,36 g<\/b><\/details>\n<h3>Amaliy qo‘llanilishi<\/h3>\n<p>• <b>Galvanik qoplash:<\/b> nikel, xrom bilan qoplash zanglashdan saqlaydi va sayqal beradi; qatlam qalinligi I·t bilan boshqariladi.<br>\n• <b>Rafinatsiya:<\/b> toza misni olish — nopok mis anod, toza mis katod.<br>\n• <b>Alyuminiy olish:<\/b> Al₂O₃ ning kriolitdagi <i>suyuqlanmasi<\/i> elektrolizi (eritma emas, chunki suvda Al emas, H₂ ajraladi).<br>\n• <b>Elektrotipiya:<\/b> bosma shakllarining metall nusxasini olish.<\/p>\n<h3>Kalkulyator<\/h3>\n<div class=\"btns\" id=\"b3\"><\/div>\n<label>Tok kuchi I = <b id=\"iv\">2.0<\/b> A<\/label><input type=\"range\" id=\"i3\" min=\"0.1\" max=\"10\" step=\"0.1\" value=\"2\">\n<label>Vaqt t = <b id=\"tv\">30<\/b> min<\/label><input type=\"range\" id=\"t3\" min=\"1\" max=\"120\" step=\"1\" value=\"30\">\n<div class=\"row\"><canvas id=\"c3\" width=\"300\" height=\"190\"><\/canvas><\/div>\n<p class=\"leg\">Qatlam qalinligi sxematik masshtabda<\/p>\n<div class=\"res\" id=\"r3\"><\/div>\n<div class=\"quiz\" id=\"z3\"><\/div><\/section>\n\n<section id=\"s4\"><h2>Asosiy xulosalar<\/h2>\n<p>1. Birinchi qonun: m ∝ Q. Ikkinchi qonun: bir xil Q da m ∝ E.<br>\n2. Kimyoviy ekvivalent E = M/n (g/mol).<br>\n3. 1 F = 96485 C har qanday moddaning 1 ekvivalentini ajratadi.<br>\n4. Umumiy formula: m = M·I·t / (n·F), t sekundda.<br>\n5. Elektroliz qoplash, tozalash va metall olishda qo‘llanadi.<\/p><\/section>\n\n<section id=\"s5\"><h2>Mustaqil ishlash uchun masalalar<\/h2><div id=\"p5\"><\/div><\/section>\n<\/main>\n<script>\nconst F=96485,$=id=>document.getElementById(id);\nconst MT={Cu:{M:63.55,n:2,c:\"#e07b39\",ion:\"Cu²⁺\"},Ag:{M:107.87,n:1,c:\"#4aa3e8\",ion:\"Ag⁺\"},Al:{M:26.98,n:3,c:\"#9b7ede\",ion:\"Al³⁺\"},Zn:{M:65.38,n:2,c:\"#2fb5a3\",ion:\"Zn²⁺\"},Ni:{M:58.69,n:2,c:\"#7fb94a\",ion:\"Ni²⁺\"}};\nconst E=k=>MT[k].M/MT[k].n, fmt=(x,d=2)=>x.toFixed(d).replace(\".\",\",\");\nfunction tgl(){const r=document.documentElement,d=matchMedia(\"(prefers-color-scheme:dark)\").matches;const cur=r.dataset.theme||(d?\"dark\":\"light\");r.dataset.theme=cur===\"dark\"?\"light\":\"dark\"}\nconst dark=()=>{const t=document.documentElement.dataset.theme;return t?t===\"dark\":matchMedia(\"(prefers-color-scheme:dark)\").matches};\nfunction cell(cv,get){const x=cv.getContext(\"2d\"),W=300,H=190,P=[];\nfor(let i=0;i<12;i++){P.push({k:1,x:75+Math.random()*150,y:75+Math.random()*95});P.push({k:0,x:75+Math.random()*150,y:75+Math.random()*95})}\nlet ph=0;(function loop(){const g=get(),d=dark(),tx=d?\"#e8edf5\":\"#18212f\",sp=.3+1.6*g.flow;ph+=sp;x.clearRect(0,0,W,H);\nx.fillStyle=d?\"#1c3558\":\"#cfe2ff\";x.fillRect(20,60,260,120);\nx.strokeStyle=tx;x.lineWidth=2;x.strokeRect(20,40,260,140);\nx.fillStyle=g.c;x.fillRect(62,45,9,120);x.fillRect(71,45,Math.max(0,g.dep)*22,120);\nx.fillStyle=\"#888\";x.fillRect(230,45,9,120);\nx.strokeStyle=tx;x.lineWidth=1.5;x.beginPath();x.moveTo(66,45);x.lineTo(66,14);x.lineTo(125,14);x.moveTo(175,14);x.lineTo(234,14);x.lineTo(234,45);x.stroke();\nx.fillRect(125,6,4,16);x.fillRect(135,10,3,8);x.fillRect(165,6,4,16);x.fillRect(172,10,3,8);\nx.fillStyle=tx;x.font=\"bold 11px sans-serif\";x.textAlign=\"center\";x.fillText(\"−\",118,36);x.fillText(\"+\",182,36);\nx.fillText(\"katod −\",66,188);x.fillText(\"anod +\",234,188);\nx.fillStyle=\"#e11d48\";x.fillText(\"e⁻↓\",46,34);x.fillStyle=\"#2563eb\";x.fillText(\"I↓\",254,34);\nx.fillStyle=tx;x.fillText(\"I (eritmada) ←\",150,56);\nfor(const p of P){const v=g.flow>0?sp:0;if(p.k){p.x-=v;if(p.x<g.cx(75)){p.x=222;p.y=75+Math.random()*95}\nx.fillStyle=g.c;x.beginPath();x.arc(p.x,p.y,7,0,7);x.fill();x.fillStyle=\"#fff\";x.fillText(\"+\",p.x,p.y+4)}\nelse{p.x+=v;if(p.x>226){p.x=g.cx(75);p.y=75+Math.random()*95}\nx.strokeStyle=d?\"#cbd5e1\":\"#475569\";x.lineWidth=2;x.beginPath();x.arc(p.x,p.y,6,0,7);x.stroke();x.fillStyle=x.strokeStyle;x.fillText(\"−\",p.x,p.y+4)}}\nrequestAnimationFrame(loop)})()}\ncell.cx=0;\nfunction mkcell(id,get){const o=get;cell($(id),()=>{const g=o();g.cx=()=>78+g.dep*22;return g})}\nfunction bars(rows,mx){return rows.map(r=>`<tr><td>${r[0]}<\/td><td>${r[1]}<\/td><td style=\"width:45%\"><div class=\"bar\" style=\"background:${r[2]};width:${Math.max(1,r[3]/mx*100)}%\"><\/div><\/td><\/tr>`).join(\"\")}\nfunction quiz(id,items){const el=$(id);el.innerHTML=\"<h3>Mini-test<\/h3>\"+items.map((it,i)=>`<div class=\"q\"><b>${i+1}. ${it.q}<\/b>${it.o.map((o,j)=>`<button data-i=\"${i}\" data-j=\"${j}\">${o}<\/button>`).join(\"\")}<div class=\"ex\" id=\"${id}e${i}\"><\/div><\/div>`).join(\"\");\nel.onclick=e=>{const b=e.target.closest(\"button\");if(!b)return;const i=+b.dataset.i,j=+b.dataset.j,it=items[i];\nel.querySelectorAll(`button[data-i=\"${i}\"]`).forEach((x,k)=>{x.disabled=true;if(k===it.a)x.classList.add(\"ok\")});if(j!==it.a)b.classList.add(\"no\");\n$(id+\"e\"+i).textContent=(j===it.a?\"✅ To‘g‘ri. \":\"❌ Noto‘g‘ri. \")+it.e}}\n// S1\nlet q1=.5;const m1=k=>E(k)*q1;\nconst S1=[[\"Cu\",\"CuSO₄\"],[\"Ag\",\"AgNO₃\"],[\"Al\",\"AlCl₃\"]];\n[\"c1a\",\"c1b\",\"c1c\"].forEach((id,i)=>mkcell(id,()=>({c:MT[S1[i][0]].c,flow:.5,dep:Math.min(1,m1(S1[i][0])/(E(\"Ag\")*2))})));\nfunction u1(){q1=+$(\"q1\").value;$(\"q1v\").textContent=fmt(q1);\n$(\"t1\").innerHTML=\"<tr><th>Elektrolit<\/th><th>E, g/mol · m, g<\/th><th>m<\/th><\/tr>\"+bars(S1.map(s=>[s[1],`E=${fmt(E(s[0]))}<br>m=${fmt(m1(s[0]))}`,MT[s[0]].c,m1(s[0])]),E(\"Ag\")*2);\n$(\"r1\").innerHTML=`Q = ${Math.round(q1*F)} C.<br>m(Cu) : m(Ag) : m(Al) = ${fmt(m1(\"Cu\"))} : ${fmt(m1(\"Ag\"))} : ${fmt(m1(\"Al\"))} = ${fmt(E(\"Cu\"))} : ${fmt(E(\"Ag\"))} : ${fmt(E(\"Al\"))} (E nisbati). Har birida m/E = ${fmt(q1,2)} — bir xil.`}\n$(\"q1\").oninput=u1;u1();\nquiz(\"z1\",[{q:\"Ikkinchi qonun nimani bildiradi?\",o:[\"Massa vaqtga teskari proporsional\",\"Bir xil zaryadda massalar ekvivalentlar nisbatida bo‘ladi\",\"Massa tok kuchining kvadratiga bog‘liq\"],a:1,e:\"Bir xil Q da m₁:m₂ = E₁:E₂.\"},\n{q:\"1 F (96485 C) o‘tganda katodda qancha Ag ajraladi?\",o:[\"26,98 g\",\"63,55 g\",\"107,87 g\"],a:2,e:\"Ag⁺: n=1, E=M=107,87 g/mol.\"},\n{q:\"Bir xil zaryadda Cu va Al massalari nisbati taxminan?\",o:[\"3,5 : 1\",\"1 : 3,5\",\"2 : 3\"],a:0,e:\"31,78 : 8,99 ≈ 3,5.\"}]);\n// S2\nlet cur2=\"Cu\";const bt=(id,cb,cu)=>{$(id).innerHTML=Object.keys(MT).map(k=>`<button data-k=\"${k}\" class=\"${k===cu?\"on\":\"\"}\">${k}<\/button>`).join(\"\");$(id).onclick=e=>{const k=e.target.dataset.k;if(!k)return;cb(k);$(id).querySelectorAll(\"button\").forEach(b=>b.classList.toggle(\"on\",b.dataset.k===k))}};\nbt(\"b2\",k=>{cur2=k;u2()},cur2);\nmkcell(\"c2\",()=>{const m=E(cur2)*(+$(\"q2\").value);return{c:MT[cur2].c,flow:.5,dep:Math.min(1,m/108)}});\nfunction u2(){const q=+$(\"q2\").value,k=cur2,t=MT[k];$(\"q2v\").textContent=fmt(q);\n$(\"r2\").innerHTML=`Ion: <b>${t.ion}<\/b> (n=${t.n}). M=${fmt(t.M)} g/mol → <b>E = ${fmt(t.M)}/${t.n} = ${fmt(E(k))} g/mol<\/b>.<br>${fmt(q)} mol e⁻ → ${fmt(q/t.n,3)} mol ${k} → <b>m = ${fmt(E(k)*q)} g<\/b>.`}\n$(\"q2\").oninput=u2;u2();\nquiz(\"z2\",[{q:\"Al ning ekvivalenti (M=26,98; n=3)?\",o:[\"8,99 g/mol\",\"26,98 g/mol\",\"80,94 g/mol\"],a:0,e:\"E = 26,98/3 ≈ 8,99.\"},\n{q:\"Zn²⁺ uchun n nechaga teng?\",o:[\"1\",\"2\",\"3\"],a:1,e:\"Zn²⁺ ioni 2 ta elektron oladi, E = 65,38/2 = 32,69.\"},\n{q:\"Nega ekvivalent massani belgilaydi?\",o:[\"1 mol e⁻ har doim 1 ekvivalent moddani ajratadi\",\"Anod massasi tufayli\",\"Haroratga bog‘liq\"],a:0,e:\"1 mol e⁻ = 1 F, u M/n gramm modda ajratadi.\"}]);\n// S3\nlet cur3=\"Cu\";bt(\"b3\",k=>{cur3=k;u3()},cur3);\nconst m3=()=>MT[cur3].M/(MT[cur3].n*F)*(+$(\"i3\").value)*(+$(\"t3\").value)*60;\nmkcell(\"c3\",()=>({c:MT[cur3].c,flow:(+$(\"i3\").value)/10,dep:1-Math.exp(-m3()/15)}));\nfunction u3(){const I=+$(\"i3\").value,t=+$(\"t3\").value,k=cur3,T=MT[k];$(\"iv\").textContent=I.toFixed(1);$(\"tv\").textContent=t;\n$(\"r3\").innerHTML=`Q = ${I.toFixed(1)}·${t*60} = <b>${Math.round(I*t*60)} C<\/b><br>m = ${fmt(T.M)}/(${T.n}·96485) · ${Math.round(I*t*60)} = <b>${fmt(m3(),3)} g<\/b>`}\n$(\"i3\").oninput=$(\"t3\").oninput=u3;u3();\nquiz(\"z3\",[{q:\"Vaqt ikki baravar oshsa (I o‘zgarmas), massa?\",o:[\"O‘zgarmaydi\",\"2 marta ortadi\",\"4 marta ortadi\"],a:1,e:\"m ∝ I·t.\"},\n{q:\"0,1 F zaryad o‘tganda AgNO₃ dan qancha Ag ajraladi?\",o:[\"1,08 g\",\"10,79 g\",\"107,9 g\"],a:1,e:\"0,1·107,87 ≈ 10,79 g.\"},\n{q:\"Formulada t qaysi birlikda olinadi?\",o:[\"Minut\",\"Soat\",\"Sekund\"],a:2,e:\"I (A) · t (s) = Q (C).\"}]);\n// S5\nconst P=[[\"Ag⁺ eritmasidan I=3 A tok 40 min o‘tdi. Ag massasi?\",\"Q=3·2400=7200 C; m=107,87/96485·7200 ≈ 8,05 g\"],\n[\"Zn²⁺ eritmasidan 2 A tok bilan 3,27 g Zn ajratish uchun qancha vaqt kerak?\",\"t=m·n·F/(M·I)=3,27·2·96485/(65,38·2) ≈ 4826 s ≈ 80 min\"],\n[\"Al suyuqlanmasidan 100 A tok 1 soat o‘tdi. Al massasi?\",\"Q=360000 C; m=26,98/(3·96485)·360000 ≈ 33,6 g\"],\n[\"Nikellashda I=4 A, t=25 min. Ni massasi (M=58,69, n=2)?\",\"Q=6000 C; m=58,69/(2·96485)·6000 ≈ 1,82 g\"],\n[\"Ketma-ket ulangan CuSO₄ va AgNO₃ dan bir xil zaryad o‘tdi. Katodda 3,18 g Cu ajraldi. Ag massasi?\",\"m(Ag)=3,18·107,87/31,78 ≈ 10,8 g (E nisbati)\"]];\n$(\"p5\").innerHTML=P.map((p,i)=>`<p><b>${i+1}.<\/b> ${p[0]}<\/p><details><summary>Javob<\/summary>${p[1]}<\/details>`).join(\"\");\n<\/script><\/body><\/html>\n"}, {"t": "Gazlarda elektr toki", "i": "🌩️", "h": "<!DOCTYPE html>\n<html lang=\"uz\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Gazlarda elektr toki<\/title>\n<style>\n:root{--bg:#f3f6fb;--c:#fff;--t:#10213f;--p:#2563eb;--ok:#15803d;--no:#b91c1c;--b:#d5deec;--k:#e3ecff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0d1526;--c:#16213a;--t:#e8eefc;--p:#60a5fa;--ok:#4ade80;--no:#f87171;--b:#2b3a5c;--k:#1d2b4d}}\n:root[data-theme=\"dark\"]{--bg:#0d1526;--c:#16213a;--t:#e8eefc;--p:#60a5fa;--ok:#4ade80;--no:#f87171;--b:#2b3a5c;--k:#1d2b4d}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,-apple-system,\"Segoe UI\",sans-serif}\nbody::before{content:\"\";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}\nheader{padding:16px 14px 6px;text-align:center}h1{margin:0;font-size:1.4rem}header p{margin:2px 0;opacity:.7}\n#nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;background:var(--bg)}\n#nav button{min-height:48px;border:2px solid var(--b);border-radius:12px;background:var(--c);color:var(--t);font-weight:700;font-size:.85rem}\n#nav button.on{background:var(--p);border-color:var(--p);color:#fff}\nsection{display:none;max-width:720px;margin:0 auto;padding:8px 12px 40px}section.on{display:block}\nh2{font-size:1.2rem;margin:8px 0}h3{margin:18px 0 8px}\n.box{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin:10px 0}\n.f{background:var(--k);border-left:5px solid var(--p);border-radius:10px;padding:8px 12px;margin:6px 0;font-weight:700;font-size:1.05rem}\ncanvas{width:100%;height:auto;display:block;border-radius:12px;background:#0b1530}\n.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.b{flex:1 1 130px;min-height:50px;border:2px solid var(--p);border-radius:12px;background:var(--c);color:var(--t);font-size:1rem;font-weight:700;padding:6px 10px}\n.b.on{background:var(--p);color:#fff}\ninput[type=range]{width:100%;height:36px;accent-color:var(--p)}\n.st{font-weight:700;padding:8px 0}.lg{font-size:.85rem;opacity:.85}\n.q{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin:10px 0}\n.o{display:block;width:100%;min-height:48px;margin:6px 0;text-align:left;border:2px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t);font-size:.98rem;padding:8px 12px}\n.o.y{border-color:var(--ok);background:rgba(34,197,94,.2)}.o.n{border-color:var(--no);background:rgba(239,68,68,.2)}\n.ex{margin:4px 0;font-size:.92rem}.ex.y{color:var(--ok)}.ex.n{color:var(--no)}\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}\n.cd{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;font-size:.9rem}.cd i{font-size:2rem;font-style:normal}.cd b{display:block}\n.big{font-size:1.6rem;font-weight:800;text-align:center;color:var(--p)}\n<\/style><\/head><body>\n<header><h1>⚡ Gazlarda elektr toki<\/h1><p>8-sinf fizikasi · interaktiv dars<\/p><\/header>\n<div id=\"nav\"><button class=\"on\">1 Ionlanish<\/button><button>2 Tok<\/button><button>3 Razryad<\/button><button>✓ Yakun<\/button><\/div>\n\n<section class=\"on\">\n<h2>1. Gazlarning elektr oʻtkazuvchanligi va ionlanish<\/h2>\n<div class=\"box\">Oddiy sharoitda gaz neytral atom va molekulalardan iborat, erkin zaryadlar deyarli yoʻq — shuning uchun gaz dielektrikdir. Gazga energiya berilsa (rentgen va ultrabinafsha nurlar, yuqori harorat, alanga), atomdan elektron ajralib chiqadi. Bu jarayon <b>ionlanish<\/b> deyiladi. Natijada musbat ion va erkin elektron hosil boʻladi. Ionlovchi omil qancha kuchli boʻlsa, shuncha koʻp zaryad paydo boʻladi. Omil taʼsiri toʻxtasa, zaryadlar qayta birikib, gaz yana dielektrikka aylanadi.<\/div>\n<div class=\"f\">A + energiya → A⁺ + e⁻<\/div>\n<canvas id=\"c1\" width=\"340\" height=\"230\"><\/canvas>\n<div class=\"row\" id=\"ib\"><button class=\"b\" data-t=\"xr\">Rentgen<\/button><button class=\"b\" data-t=\"uv\">Ultrabinafsha<\/button><button class=\"b\" data-t=\"ht\">Yuqori harorat<\/button><button class=\"b\" data-t=\"fl\">Alanga<\/button><\/div>\n<label>Ionlovchi kuchi: <b id=\"pv\">50<\/b>%<input type=\"range\" id=\"pw\" min=\"0\" max=\"100\" value=\"50\"><\/label>\n<div class=\"st\">Ionlar: <span id=\"ic\">0<\/span> / 12 · Erkin elektronlar: <span id=\"ec\">0<\/span><\/div>\n<div class=\"lg\">🟡 neytral atom (aylanuvchi elektron) · 🔴 musbat ion (+) · 🔵 erkin elektron<\/div>\n<button class=\"b\" id=\"rs\" style=\"width:100%\">Qayta boshlash<\/button>\n<h3>Tekshiruv savollari<\/h3><div id=\"q0\"><\/div>\n<\/section>\n\n<section>\n<h2>2. Gazda elektr tokining hosil boʻlishi<\/h2>\n<div class=\"box\">Elektrodlarga kuchlanish berilsa, elektr maydon zaryadlarni harakatga keltiradi: elektronlar anodga (+), musbat ionlar katodga (−) yoʻnaladi. Elektronlar yengil, shuning uchun ionlardan ancha tez harakatlanadi. Zaryadlarning tartibli harakati gazda elektr tokini hosil qiladi. Elektron va ion uchrashib neytral atomga aylanishi mumkin — bu <b>rekombinatsiya<\/b>. Kuchlanish kichik boʻlsa, zaryadlarning koʻp qismi rekombinatsiyalanadi va tok kichik boʻladi. Kuchlanish oshgani sari tok ortadi, soʻng barcha zaryadlar elektrodlarga yetadi va tok <b>toʻyinadi<\/b>.<\/div>\n<div class=\"f\">I = q / t<\/div><div class=\"f\">I<sub>toʻyinish<\/sub> = e · N₀ (N₀ — 1 s da hosil boʻlgan juftlar)<\/div><div class=\"f\">A⁺ + e⁻ → A (rekombinatsiya)<\/div>\n<canvas id=\"c2\" width=\"340\" height=\"190\"><\/canvas>\n<div class=\"lg\">🔵 elektron (tez, anodga) · 🔴 ion (sekin, katodga) · ⚪ chaqnash — rekombinatsiya<\/div>\n<label>Kuchlanish U: <b id=\"uv2\">20<\/b> V (sekin oʻzgartiring)<input type=\"range\" id=\"u2\" min=\"0\" max=\"100\" value=\"20\"><\/label>\n<canvas id=\"g2\" width=\"340\" height=\"170\"><\/canvas>\n<div class=\"st\">Tok (shartli): <span id=\"i2\">0<\/span><\/div>\n<button class=\"b\" id=\"gc\" style=\"width:100%\">Grafikni tozalash<\/button>\n<h3>Tekshiruv savollari<\/h3><div id=\"q1\"><\/div>\n<\/section>\n\n<section>\n<h2>3. Mustaqil va nomustaqil gaz razryadlari<\/h2>\n<div class=\"box\"><b>Nomustaqil razryad<\/b> faqat tashqi ionlovchi omil boʻlganda davom etadi: manba oʻchsa, tok toʻxtaydi. Kuchlanish yetarlicha oshsa, elektron maydonda tezlashib atomga urilganda uni ionlaydi — bu <b>zarbali ionlanish<\/b>. Yangi elektronlar ham ionlaydi va elektronlar <b>koʻchkisi<\/b> hosil boʻladi. Endi razryad tashqi manbasiz ham davom etadi — bu <b>mustaqil razryad<\/b>. Uning turlari: uchqunli, toj, yoy va shuʻlali.<\/div>\n<div class=\"f\">Zarbali ionlanish: E<sub>k<\/sub> ≥ A<sub>ion<\/sub><\/div><div class=\"f\">Mustaqil razryad: U ≥ U<sub>teshilish<\/sub><\/div>\n<canvas id=\"c3\" width=\"340\" height=\"190\"><\/canvas>\n<div class=\"lg\">Teshilish kuchlanishi ≈ 60 V (shartli). Mustaqil razryadda gaz yorishadi.<\/div>\n<label>Kuchlanish U: <b id=\"uv3\">30<\/b> V<input type=\"range\" id=\"u3\" min=\"0\" max=\"100\" value=\"30\"><\/label>\n<div class=\"row\"><button class=\"b on\" id=\"sb\">Ionlovchi manba: yoniq<\/button><button class=\"b\" id=\"p1\">Nomustaqil (30 V)<\/button><button class=\"b\" id=\"p2\">Mustaqil (80 V)<\/button><\/div>\n<div class=\"st\" id=\"s3\">—<\/div><div class=\"lg\">Elektronlar: <span id=\"e3\">0<\/span> · Ionlar: <span id=\"n3\">0<\/span> · Tok (shartli): <span id=\"i3\">0<\/span><\/div>\n<div class=\"lg\">Sinab koʻring: 80 V da manbani oʻchiring — razryad davom etadi. 30 V da esa toʻxtaydi.<\/div>\n<h3>Razryad turlari va qoʻllanilishi<\/h3>\n<div class=\"cards\">\n<div class=\"cd\"><i>⚡<\/i><b>Uchqunli<\/b>Katta kuchlanishda qisqa, shoxlangan uchqun. Chaqmoq shunday. Qoʻllanish: chaqmoqoʻtkazgich binolarni himoya qiladi.<\/div>\n<div class=\"cd\"><i>✨<\/i><b>Toj<\/b>Oʻtkir uchlar atrofida kuchsiz nurlanish. Qoʻllanish: chaqmoqoʻtkazgich uchi, elektrofiltrlar (tutunni tozalash).<\/div>\n<div class=\"cd\"><i>🔥<\/i><b>Yoy<\/b>Katta tok, juda yorqin va issiq (minglab °C). Qoʻllanish: elektr yoyli payvandlash, projektorlar.<\/div>\n<div class=\"cd\"><i>💡<\/i><b>Shuʻlali (“shiqildoq”)<\/b>Past bosimli gazda tinch nurlanish. Qoʻllanish: lyuminestsent, reklama (neon) va gaz lampalari.<\/div>\n<\/div>\n<h3>Tekshiruv savollari<\/h3><div id=\"q2\"><\/div>\n<\/section>\n\n<section>\n<h2>Darsni yakunlash<\/h2>\n<div class=\"box\"><b>5 ta asosiy xulosa<\/b><ol>\n<li>Oddiy gaz — dielektrik; ionlanishda neytral atomdan musbat ion va erkin elektron hosil boʻladi.<\/li>\n<li>Gazda tok tashuvchilar — elektronlar va musbat ionlar.<\/li>\n<li>Elektronlar anodga tez, ionlar katodga sekin harakatlanadi; qarama-qarshi zaryadlar rekombinatsiyalanadi.<\/li>\n<li>Kuchlanish oshganda tok toʻyinishga yetadi: I = e·N₀.<\/li>\n<li>Zarbali ionlanish mustaqil razryadni hosil qiladi; turlari: uchqunli, toj, yoy, shuʻlali.<\/li><\/ol><\/div>\n<h3>Yakuniy test<\/h3><div id=\"q3\"><\/div><div class=\"box big\" id=\"res\">Natija: — / 5<\/div>\n<button class=\"b\" id=\"rt\" style=\"width:100%\">Testni qayta boshlash<\/button>\n<\/section>\n\n<script>\nconst $=s=>document.querySelector(s);\nfunction quiz(el,arr,cb){el.innerHTML=\"\";let done=0,sc=0;arr.forEach((it,i)=>{const d=document.createElement(\"div\");d.className=\"q\";d.innerHTML=\"<b>\"+(i+1)+\". \"+it[0]+\"<\/b>\";const e=document.createElement(\"p\");it[1].forEach((o,j)=>{const b=document.createElement(\"button\");b.className=\"o\";b.textContent=o;b.onclick=()=>{if(d.dataset.a)return;d.dataset.a=1;const ok=j==it[2];b.classList.add(ok?\"y\":\"n\");if(!ok)d.children[it[2]+1].classList.add(\"y\");e.textContent=(ok?\"✅ Toʻgʻri! \":\"❌ Notoʻgʻri. \")+it[3];e.className=\"ex \"+(ok?\"y\":\"n\");done++;sc+=ok;if(cb&&done==arr.length)cb(sc)};d.append(b)});d.append(e);el.append(d)})}\nconst Q=[[[\"Ionlanish nima?\",[\"Atomdan elektron ajralib, musbat ion hosil boʻlishi\",\"Atomga elektron qoʻshilishi\",\"Yadroning parchalanishi\"],0,\"Neytral atom elektron yoʻqotsa, musbat ion boʻladi.\"],[\"Oddiy sharoitda gaz qanday?\",[\"Yaxshi oʻtkazgich\",\"Dielektrik\",\"Metalldek oʻtkazadi\"],1,\"Gazda erkin zaryadlar deyarli yoʻq.\"],[\"Qaysi biri ionlovchi omil emas?\",[\"Rentgen nurlari\",\"Yuqori harorat\",\"Sovuq suv\"],2,\"Sovuq suv atomga ionlash uchun yetarli energiya bermaydi.\"]],\n[[\"Elektronlar qayerga harakatlanadi?\",[\"Katodga\",\"Anodga\",\"Joyida turadi\"],1,\"Elektronlar manfiy, shuning uchun musbat anodga tortiladi.\"],[\"Rekombinatsiya nima?\",[\"Ion va elektronning birikib neytral atom hosil qilishi\",\"Atomning ionlanishi\",\"Elektrodning qizishi\"],0,\"A⁺ + e⁻ → A.\"],[\"Tok nima uchun toʻyinadi?\",[\"Gaz tugaydi\",\"B ash([]);g.fillStyle=\"#4ade80\";g.fillText(\"toʻyinish toki\",40,Y(40)-4);\npts.forEach((p,i)=>{g.fillStyle=i==pts.length-1?\"#fff\":\"#fbbf24\";g.beginPath();g.arc(34+p.u/100*(w-42),Y(Math.min(p.i,50)),i==pts.length-1?5:3,0,7);g.fill()})}\ngr();$(\"#gc\").onclick=()=>{pts.length=0;gr()};\n$(\"#u2\").oninput=e=>{U2=+e.target.value;$(\"#uv2\").textContent=U2};\nconst s2=Sim($(\"#c2\"),{U:()=>U2,src:()=>1,rate:40,rec:1,mult:0,cur:I=>{$(\"#i2\").textContent=I.toFixed(0);pts.push({u:U2,i:I});if(pts.length>150)pts.shift();gr()}});\n\nlet U3=30,src=1;const stt=$(\"#s3\");let Iv=0;\n$(\"#u3\").oninput=e=>{U3=+e.target.value;$(\"#uv3\").textContent=U3};\nconst setU=v=>{U3=v;$(\"#u3\").value=v;$(\"#uv3\").textContent=v};\n$(\"#p1\").onclick=()=>setU(30);$(\"#p2\").onclick=()=>setU(80);\n$(\"#sb\").onclick=e=>{src=!src;e.target.classList.toggle(\"on\",src);e.target.textContent=\"Ionlovchi manba: \"+(src?\"yoniq\":\"oʻchiq\")};\nconst s3=Sim($(\"#c3\"),{U:()=>U3,src:()=>src,rate:25,rec:0,mult:1,cur:I=>Iv=I,ui:(ne,ni)=>{$(\"#e3\").textContent=ne;$(\"#n3\").textContent=ni;$(\"#i3\").textContent=Iv.toFixed(0);\nstt.textContent=U3>=60&&ne>3?\"🔥 Mustaqil razryad: zarbali ionlanish, elektronlar koʻchkisi\":src?\"Nomustaqil razryad: tok ionlovchi manbaga bogʻliq\":ne+ni>0?\"Manba oʻchdi — zaryadlar chiqib ketmoqda…\":\"⛔ Razryad toʻxtadi\"}});\n\nlet last=0;(function loop(t){const dt=Math.min((t-last)/1000||0,.05);last=t;if(cur==0)ion(dt);else if(cur==1)s2.step(dt);else if(cur==2)s3.step(dt);requestAnimationFrame(loop)})(0);\n<\/script><\/body><\/html>\n"}, {"t": "Vakuumda elektr toki", "i": "💡", "h": "<!DOCTYPE html>\n<html lang=\"uz\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Vakuumda elektr toki<\/title>\n<style>\n:root{--bg:#eef3fb;--card:#fff;--tx:#14213d;--mut:#51607a;--pri:#2563eb;--acc:#f59e0b;--ok:#16a34a;--bad:#dc2626;--bd:#d6dfef;--cv:#0b1530;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1424;--card:#172038;--tx:#e8eefc;--mut:#9fb0d0;--bd:#2a3656;--pri:#60a5fa}}\n*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--tx);font:18px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nmain{max-width:860px;margin:auto;padding:14px}\nheader{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-radius:22px;padding:24px 20px;margin-bottom:14px}\nh1{margin:0 0 6px;font-size:30px;line-height:1.2}h2{margin:0 0 10px;font-size:25px;color:var(--pri)}h3{margin:16px 0 6px;font-size:20px}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:14px}\n.tag{display:inline-block;background:var(--acc);color:#222;border-radius:99px;padding:2px 12px;font-size:14px;font-weight:700;margin-bottom:6px}\n.note{background:rgba(245,158,11,.15);border-left:5px solid var(--acc);padding:10px 12px;border-radius:10px;margin:10px 0}\n.term{background:rgba(37,99,235,.12);border-radius:8px;padding:0 6px;font-weight:600}\nul{padding-left:22px;margin:6px 0}li{margin:4px 0}\ncanvas{width:100%;display:block;background:var(--cv);border-radius:14px;touch-action:none}\n.ctl{margin:10px 0}.ctl label{display:flex;justify-content:space-between;font-weight:600;gap:8px}\ninput[type=range]{width:100%;height:34px;accent-color:var(--pri)}\n.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--pri);color:#fff;cursor:pointer;min-height:48px}\n.read{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.read div{flex:1;min-width:120px;background:var(--bg);border-radius:12px;padding:8px 12px;text-align:center}\n.read b{display:block;font-size:24px;color:var(--pri)}.read span{font-size:14px;color:var(--mut)}\n.q{border-top:1px dashed var(--bd);padding-top:12px;margin-top:12px}\n.opt{display:block;width:100%;text-align:left;font:inherit;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:10px 12px;margin:6px 0;cursor:pointer;min-height:46px}\n.opt.sel{border-color:var(--pri)}.opt.ok{border-color:var(--ok);background:rgba(22,163,74,.18)}.opt.bad{border-color:var(--bad);background:rgba(220,38,38,.15)}\n.fb{font-size:16px;margin-top:4px;color:var(--mut)}.score{font-size:22px;font-weight:800;margin-top:12px}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.two{grid-template-columns:1fr}}\nsmall{color:var(--mut)}\n<\/style><\/head><body><main>\n\n<header><h1>⚡ Vakuumda elektr toki<\/h1><div>Fizika, 8-sinf · interaktiv dars<\/div><\/header>\n\n<section class=\"card\"><span class=\"tag\">Dars maqsadlari<\/span>\n<ul><li>Vakuum nima ekanini va uning xususiyatlarini tushuntirish.<\/li>\n<li>Vakuumda tok qanday hosil bo‘lishini (elektronlar harakatini) izohlash.<\/li>\n<li>Vakuumli asboblarning amaliy ahamiyatini bilish.<\/li><\/ul>\n<h3>Tayanch tushunchalar<\/h3>\n<ul><li><b>Elektr toki<\/b> — zaryadlangan zarralarning tartibli harakati.<\/li>\n<li><b>Elektron<\/b> — manfiy (−) zaryadli juda kichik zarra.<\/li>\n<li><b>Kuchlanish<\/b> — zaryadlarni harakatga keltiruvchi “itaruvchi kuch” (birligi: volt, V).<\/li>\n<li><b>Bosim<\/b> — gaz molekulalarining devorga urilish kuchi.<\/li><\/ul><\/section>\n\n<!-- 1 -->\n<section class=\"card\"><span class=\"tag\">1-bo‘lim<\/span><h2>Vakuum va uning xususiyatlari<\/h2>\n<p><span class=\"term\">Vakuum<\/span> — gaz molekulalari juda kam bo‘lgan bo‘shliq. Oddiy havoda atmosfera bosimi taxminan <b>101 kPa<\/b> (kilopaskal — bosim birligi).<\/p>\n<ul><li><b>Past vakuum:<\/b> havo kamaygan, lekin molekulalar hali ancha (masalan, changyutgich ichi).<\/li>\n<li><b>Yuqori vakuum:<\/b> molekulalar juda kam — ular bir-biriga deyarli duch kelmaydi (televizor trubkasi ichi).<\/li><\/ul>\n<h3>Xususiyatlari<\/h3>\n<ul><li>Molekulalar juda kam.<\/li><li>Issiqlik o‘tkazuvchanligi pasayadi (termos shu sababli ushlab turadi).<\/li>\n<li>Ovoz tarqalmaydi — uni tashiydigan molekulalar yo‘q.<\/li><li>Yorug‘lik erkin o‘tadi (Quyosh nuri kosmosdan shunday keladi).<\/li><\/ul>\n<h3>🔬 Simulyatsiya: nasos<\/h3>\n<canvas id=\"c1\" width=\"600\" height=\"260\"><\/canvas>\n<div class=\"ctl\"><label>Nasos ishlashi <span id=\"v1\">0%<\/span><\/label><input id=\"s1\" type=\"range\" min=\"0\" max=\"100\" value=\"0\"><\/div>\n<div class=\"read\"><div><b id=\"n1\">80<\/b><span>molekulalar soni<\/span><\/div><div><b id=\"p1\">101 kPa<\/b><span>bosim<\/span><\/div><div><b id=\"t1\">Atmosfera<\/b><span>holat<\/span><\/div><\/div>\n<div id=\"q1\"><\/div><\/section>\n\n<!-- 2 -->\n<section class=\"card\"><span class=\"tag\">2-bo‘lim<\/span><h2>Vakuumda tok va elektronlar<\/h2>\n<p>Vakuumda tok tashuvchi <b>erkin zaryadlar yo‘q<\/b> (molekulalar deyarli yo‘q), shuning uchun tok o‘z-o‘zidan hosil bo‘lmaydi. Zaryadlarni biz o‘zimiz yaratishimiz kerak.<\/p>\n<p><span class=\"term\">Termoelektron emissiya<\/span> — qizdirilgan metall (<span class=\"term\">katod<\/span>) sirtidan elektronlarning uchib chiqishi. Metall qancha qizisa, shuncha ko‘p elektron chiqadi.<\/p>\n<p>Musbat qutbga ulangan <span class=\"term\">anod<\/span> elektronlarni o‘ziga tortadi: elektr maydon ularni katoddan anodga haydaydi. Anod kuchlanishi oshsa, tok ham oshadi, so‘ng barcha chiqqan elektronlar anodga yetganda tok o‘sishdan to‘xtaydi (<span class=\"term\">to‘yinish toki<\/span>).<\/p>\n<div class=\"note\">⚠️ Elektronlar manfiy zaryadli va <b>katoddan anodga<\/b> harakatlanadi. An’anaviy tok yo‘nalishi esa <b>teskari<\/b> — anoddan katodga.<\/div>\n<h3>🔬 Simulyatsiya: vakuumli diod<\/h3>\n<canvas id=\"c2\" width=\"600\" height=\"250\"><\/canvas>\n<div class=\"ctl\"><label>Katod harorati <span id=\"v2a\"><\/span><\/label><input id=\"s2a\" type=\"range\" min=\"0\" max=\"100\" value=\"60\"><\/div>\n<div class=\"ctl\"><label>Anod kuchlanishi <span id=\"v2b\"><\/span><\/label><input id=\"s2b\" type=\"range\" min=\"0\" max=\"300\" value=\"120\"><\/div>\n<button class=\"btn\" id=\"pol\">🔄 Ulanish: TO‘G‘RI (anod +)<\/button>\n<div class=\"read\"><div><b id=\"i2\">0 mA<\/b><span>ampermetr<\/span><\/div><div><b id=\"m2\">—<\/b><span>holat<\/span><\/div><\/div>\n<canvas id=\"c2g\" width=\"600\" height=\"240\"><\/canvas>\n<small>Grafik: tok (mA) – kuchlanish (V). Nuqta hozirgi holatni ko‘rsatadi. Chapda (teskari ulanish) tok nolga teng: diod tokni faqat bir tomonga o‘tkazadi.<\/small>\n<div id=\"q2\"><\/div><\/section>\n\n<!-- 3 -->\n<section class=\"card\"><span class=\"tag\">3-bo‘lim<\/span><h2>Qo‘llanilishi va ahamiyati<\/h2>\n<ul><li><b>Vakuumli diod<\/b> — o‘zgaruvchan tokni to‘g‘rilaydi (<span class=\"term\">to‘g‘rilagich<\/span>: tokni bir yo‘nalishli qiladi).<\/li>\n<li><b>Elektron-nurli trubka (ENT)<\/b> — eski televizor va osillograf (tok o‘zgarishini ko‘rsatuvchi asbob) ekrani.<\/li>\n<li><b>Rentgen trubkasi<\/b> — tez elektronlar anodga urilib, rentgen nurlari hosil qiladi (tibbiyotda).<\/li>\n<li><b>Elektron mikroskop<\/b> — elektron dastasi yordamida juda mayda narsalarni ko‘rsatadi.<\/li><\/ul>\n<p>Hozir vakuumli lampalarni asosan <b>yarimo‘tkazgichli<\/b> diod va tranzistorlar almashtirgan: ular kichik, arzon, qizdirish kerak emas va kam energiya sarflaydi. Vakuum esa ENT, rentgen va mikroskoplarda hali ham kerak.<\/p>\n<h3>🔬 Simulyatsiya: elektron-nurli trubka<\/h3>\n<div class=\"two\"><div><canvas id=\"c3\" width=\"600\" height=\"240\"><\/canvas><\/div><div><canvas id=\"c3s\" width=\"240\" height=\"240\"><\/canvas><\/div><\/div>\n<div class=\"ctl\"><label>Tezlatuvchi kuchlanish <span id=\"v3a\"><\/span><\/label><input id=\"s3a\" type=\"range\" min=\"100\" max=\"500\" value=\"300\"><\/div>\n<div class=\"ctl\"><label>Tik og‘diruvchi plastinalar (Y) <span id=\"v3b\"><\/span><\/label><input id=\"s3b\" type=\"range\" min=\"-100\" max=\"100\" value=\"0\"><\/div>\n<div class=\"ctl\"><label>Gorizontal plastinalar (X) <span id=\"v3c\"><\/span><\/label><input id=\"s3c\" type=\"range\" min=\"-100\" max=\"100\" value=\"0\"><\/div>\n<small>Yuqori plastina musbat bo‘lsa, manfiy elektronlar unga tomon og‘adi. Tezlatuvchi kuchlanish katta bo‘lsa, elektronlar tezroq uchadi va kamroq og‘adi.<\/small>\n<div id=\"q3\"><\/div><\/section>\n\n<!-- final -->\n<section class=\"card\"><span class=\"tag\">Yakuniy test<\/span><h2>5 savol<\/h2><div id=\"qf\"><\/div>\n<button class=\"btn\" id=\"chk\" style=\"margin-top:12px\">Tekshirish<\/button><div class=\"score\" id=\"sc\"><\/div><\/section>\n\n<section class=\"card\"><span class=\"tag\">Xulosa<\/span>\n<ul><li>Vakuumda molekulalar kam: ovoz o‘tmaydi, issiqlik kam o‘tadi, yorug‘lik o‘tadi.<\/li>\n<li>Tok hosil bo‘lishi uchun katod qizdiriladi (termoelektron emissiya) va anodga musbat kuchlanish beriladi.<\/li>\n<li>Elektronlar katoddan anodga uchadi; diod faqat bir tomonga o‘tkazadi.<\/li>\n<li>Vakuum ENT, rentgen trubkasi va elektron mikroskopda qo‘llanadi.<\/li><\/ul>\n<h3>📝 Uy vazifasi<\/h3>\n<ol><li>Vakuumli diod va yarimo‘tkazgichli diodni solishtiring: 3 ta o‘xshashlik va 3 ta farqni yozing.<\/li>\n<li>Uyingizdagi qaysi asboblarda (yoki shifoxonada) vakuumdan foydalanilishini topib, 3 ta misol keltiring.<\/li><\/ol><\/section>\n<\/main>\n<script>\nvar $=function(s){return document.querySelector(s)};\nfunction mk(id,qs,fin){var el=$(id),sel=[],ds=[];\nqs.forEach(function(q,i){var d=document.createElement('div');d.className='q';d.innerHTML='<b>'+(i+1)+'. '+q[0]+'<\/b>';\nvar fb=document.createElement('div');fb.className='fb';var bs=[];\nq[1].forEach(function(o,j){var b=document.createElement('button');b.className='opt';b.textContent=o;bs.push(b);\nb.onclick=function(){if(d.dataset.done)return;\nif(fin){sel[i]=j;bs.forEach(function(x,k){x.classList.toggle('sel',k==j)})}\nelse{d.dataset.done=1;b.classList.add(j==q[2]?'ok':'bad');bs[q[2]].classList.add('ok');fb.textContent=(j==q[2]?'✅ To‘g‘ri! ':'❌ Noto‘g‘ri. ')+q[3]}};\nd.appendChild(b)});d.appendChild(fb);el.appendChild(d);ds.push([d,bs,fb,q])});\nif(fin)$('#chk').onclick=function(){var s=0;ds.forEach(function(x,i){var q=x[3];x[0].dataset.done=1;\nif(sel[i]==q[2]){s++;x[1][q[2]].classList.add('ok')}else{if(sel[i]!=null)x[1][sel[i]].classList.add('bad');x[1][q[2]].classList.add('ok')}\nx[2].textContent=q[3]});\n$('#sc').textContent='Natija: '+s+' / 5 ball '+(s==5?'🏆 Ajoyib!':s>=3?'👍 Yaxshi!':'📚 Darsni yana bir ko‘rib chiqing.')}}\nmk('#q1',[[\"Vakuumda ovoz tarqaladimi?\",[\"Ha, tez tarqaladi\",\"Yo‘q\",\"Faqat past ovozlar\"],1,\"Ovoz tarqalishi uchun molekulalar kerak, vakuumda ular deyarli yo‘q.\"],\n[\"Idishdan nasos bilan havo chiqarilsa, bosim nima bo‘ladi?\",[\"Kamayadi\",\"Ortadi\",\"O‘zgarmaydi\"],0,\"Molekulalar kamayadi, devorga urilishlar ham kamayadi.\"],\n[\"Yuqori vakuum past vakuumdan nimasi bilan farq qiladi?\",[\"Molekulalar yanada kam\",\"Molekulalar ko‘p\",\"U issiqroq\"],0,\"Yuqori vakuumda molekulalar juda kam.\"]]);\nmk('#q2',[[\"Termoelektron emissiya nima?\",[\"Muzlatilgan metallning tok o‘tkazishi\",\"Qizigan metalldan elektronlar chiqishi\",\"Gazning yorug‘lik chiqarishi\"],1,\"Qizigan katod elektronlarni “bug‘lantiradi”.\"],\n[\"Teskari ulanishda (anod −) vakuumli diodda tok qanday?\",[\"Eng katta\",\"Yarim\",\"Yo‘q\"],2,\"Manfiy anod elektronlarni itaradi, ular anodga yetmaydi.\"],\n[\"Elektronlar diod ichida qaysi yo‘nalishda harakatlanadi?\",[\"Anoddan katodga\",\"Katoddan anodga\",\"Ikki yo‘nalishda\"],1,\"Elektronlar manfiy, shuning uchun musbat anodga tortiladi. An’anaviy tok yo‘nalishi teskari.\"]]);\nmk('#q3',[[\"Vakuumli diodning asosiy vazifasi qaysi?\",[\"Tokni kuchaytirish emas, to‘g‘rilash\",\"Ovozni o‘chirish\",\"Havoni sovitish\"],0,\"Diod tokni faqat bir tomonga o‘tkazadi.\"],\n[\"ENT da nur izini nima og‘diradi?\",[\"Og‘diruvchi plastinalardagi kuchlanish\",\"Havo oqimi\",\"Katod rangi\"],0,\"Plastinalar orasidagi elektr maydon elektronlarni og‘diradi.\"],\n[\"Vakuumli lampalarni asosan nima almashtirgan?\",[\"Yarimo‘tkazgichli asboblar\",\"Shisha idishlar\",\"Magnitlar\"],0,\"Diod va tranzistorlar kichik, arzon va kam energiya sarflaydi.\"]]);\nmk('#qf',[[\"Vakuum nima?\",[\"Gaz molekulalari juda kam bo‘lgan bo‘shliq\",\"Faqat suvsiz joy\",\"Juda issiq havo\"],0,\"Vakuum — molekulalar kam bo‘lgan bo‘shliq.\"],\n[\"Vakuumda tok o‘z-o‘zidan nega hosil bo‘lmaydi?\",[\"Kuchlanish yo‘q\",\"Erkin zaryadlar yo‘q\",\"Yorug‘lik o‘tadi\"],1,\"Tok tashuvchi zarralar yo‘q, katod qizdirilib elektronlar hosil qilinadi.\"],\n[\"Katoddan elektronlar chiqishi qanday ataladi?\",[\"Termoelektron emissiya\",\"Kondensatsiya\",\"Diffuziya\"],0,\"Qizigan katoddan elektronlar chiqadi.\"],\n[\"An’anaviy tok yo‘nalishi qanday?\",[\"Elektronlar bilan bir xil\",\"Anoddan katodga (elektronlarga teskari)\",\"Tok yo‘nalishi yo‘q\"],1,\"Elektronlar katoddan anodga, an’anaviy tok esa anoddan katodga.\"],\n[\"Elektron-nurli trubka qayerda ishlatilgan?\",[\"Eski televizor va osillografda\",\"Muzlatgichda\",\"Soatda\"],0,\"ENT eski televizor va osillograf ekranlarida bo‘lgan.\"]],true);\n\n/* 1-simulyatsiya */\nvar c1=$('#c1'),x1=c1.getContext('2d'),M=[],pump=0;\nfor(var i=0;i<80;i++)M.push({x:20+Math.random()*560,y:20+Math.random()*220,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5});\n$('#s1').oninput=function(){pump=+this.value;$('#v1').textContent=pump+'%'};\nfunction d1(){var n=Math.round(80*Math.pow(1-pump/100,2)),P=101.3*n/80;\nx1.clearRect(0,0,600,260);x1.strokeStyle='#60a5fa';x1.lineWidth=4;x1.strokeRect(2,2,596,256);\nfor(var i=0;i<n;i++){var m=M[i];m.x+=m.vx;m.y+=m.vy;if(m.x<10||m.x>590)m.vx*=-1;if(m.y<10||m.y>250)m.vy*=-1;\nx1.fillStyle='#fbbf24';x1.beginPath();x1.arc(m.x,m.y,6,0,7);x1.fill()}\n$('#n1').textContent=n;$('#p1').textContent=n==0?'≈ 0':(P<1?(P*1000).toFixed(0)+' Pa':P.toFixed(1)+' kPa');\n$('#t1').textContent=n>60?'Atmosfera':n>20?'Past vakuum':'Yuqori vakuum'}\n\n/* 2-simulyatsiya */\nvar c2=$('#c2'),x2=c2.getContext('2d'),g=$('#c2g'),xg=g.getContext('2d'),E=[],fwd=true,CX=110,AX=490;\n$('#pol').onclick=function(){fwd=!fwd;this.textContent=fwd?'🔄 Ulanish: TO‘G‘RI (anod +)':'🔄 Ulanish: TESKARI (anod −)'};\nfunction Tk(){return 1800+10*$('#s2a').value}\nfunction Is(){return 30*Math.pow((Tk()-1800)/1000,4)}\nfunction Icur(U,f,T){var s=30*Math.pow((T-1800)/1000,4);return f?s*(1-Math.exp(-U/60)):0}\nfunction d2(){var T=Tk(),U=+$('#s2b').value,I=Icur(U,fwd,T);\n$('#v2a').textContent=T+' K';$('#v2b').textContent=(fwd?'+':'−')+U+' V';\n$('#i2').textContent=I.toFixed(1)+' mA';$('#m2').textContent=I<0.05?(fwd?'Tok yo‘q':'Tok yo‘q (bir tomonlama)'):'Tok bor';\nif(Math.random()<Is()/12&&E.length<120)E.push({x:CX+8,y:50+Math.random()*150,v:.8,t:0});\nvar a=U/60;\nx2.clearRect(0,0,600,250);\nvar glow=Math.max(0,(T-1800)/1000);x2.fillStyle='rgba(255,'+Math.round(120+80*glow)+',40,'+(.25+.75*glow)+')';x2.fillRect(CX-5,40,10,170);\nx2.fillStyle='#94a3b8';x2.fillRect(AX,40,10,170);\nx2.fillStyle='#fff';x2.font='bold 15px sans-serif';x2.fillText('Katod',CX-22,32);x2.fillText('Anod',AX-8,32);\nx2.fillStyle=fwd?'#f87171':'#60a5fa';x2.fillText(fwd?'−':'+',CX-4,232);x2.fillStyle=fwd?'#60a5fa':'#f87171';x2.fillText(fwd?'+':'−',AX+1,232);\nfor(var i=E.length-1;i>=0;i--){var e=E[i];e.v+=fwd?a*.06:-a*.06;e.x+=e.v;\nif(e.x>AX||e.x<CX){E.splice(i,1);continue}\nx2.fillStyle='#38bdf8';x2.beginPath();x2.arc(e.x,e.y,5,0,7);x2.fill()}\nif(I>0.05){x2.strokeStyle='#fbbf24';x2.fillStyle='#fbbf24';x2.lineWidth=2;x2.beginPath();x2.moveTo(AX+5,225);x2.lineTo(CX,225);x2.stroke();\nx2.beginPath();x2.moveTo(CX,225);x2.lineTo(CX+10,220);x2.lineTo(CX+10,230);x2.fill();x2.fillText('an’anaviy tok',270,218)}\nx2.fillStyle='#7dd3fc';x2.fillText('● elektron (−) →',230,20);\n/* grafik */\nxg.clearRect(0,0,600,240);xg.strokeStyle='#64748b';xg.lineWidth=1;xg.beginPath();xg.moveTo(300,10);xg.lineTo(300,220);xg.moveTo(20,200);xg.lineTo(590,200);xg.stroke();\nxg.fillStyle='#94a3b8';xg.font='13px sans-serif';xg.fillText('U (V)',555,194);xg.fillText('I (mA)',306,18);xg.fillText('teskari',60,192);xg.fillText('to‘g‘ri',500,216);\nxg.strokeStyle='#38bdf8';xg.lineWidth=3;xg.beginPath();xg.moveTo(20,200);xg.lineTo(300,200);\nfor(var u=0;u<=300;u+=5)xg.lineTo(300+u*.95,200-Icur(u,true,T)*5.8);xg.stroke();\nxg.fillStyle='#fbbf24';xg.beginPath();xg.arc(300+(fwd?1:-1)*U*.95,200-I*5.8,8,0,7);xg.fill()}\n\n/* 3-simulyatsiya */\nvar c3=$('#c3'),x3=c3.getContext('2d'),cs=$('#c3s'),xs=cs.getContext('2d'),ph=0,trail=[];\nfunction d3(){var Ua=+$('#s3a').value,Vy=+$('#s3b').value,Vx=+$('#s3c').value;\n$('#v3a').textContent=Ua+' V';$('#v3b').textContent=Vy+' V';$('#v3c').textContent=Vx+' V';\nvar s=Vy/Ua,off=20*s,sl=2*off/130,ye=120-off,sy=Math.max(-105,Math.min(105,20*s+sl*230*1)),sx=Math.max(-90,Math.min(90,90*Vx/Ua));\nvar scr=120-sy;\nx3.clearRect(0,0,600,240);x3.strokeStyle='#475569';x3.lineWidth=3;x3.strokeRect(10,40,570,160);\nx3.fillStyle='#f97316';x3.fillRect(30,100,8,40);x3.fillStyle='#94a3b8';x3.fillRect(105,60,6,45);x3.fillRect(105,135,6,45);\nx3.fillStyle=Vy>0?'#f87171':Vy<0?'#60a5fa':'#94a3b8';x3.fillRect(200,70,130,6);\nx3.fillStyle=Vy<0?'#f87171':Vy>0?'#60a5fa':'#94a3b8';x3.fillRect(200,164,130,6);\nx3.fillStyle='#22c55e';x3.fillRect(560,40,10,160);\nx3.fillStyle='#fff';x3.font='13px sans-serif';x3.fillText('katod',20,92);x3.fillText('tezlatgich',80,52);x3.fillText('og‘diruvchi',215,62);x3.fillText('ekran',535,32);\nvar pts=[[38,120],[200,120]],N=12;for(var k=1;k<=N;k++){var t=k/N;pts.push([200+130*t,120-off*t*t])}pts.push([560,scr]);\nx3.strokeStyle='rgba(56,189,248,.45)';x3.lineWidth=2;x3.beginPath();pts.forEach(function(p,i){i?x3.lineTo(p[0],p[1]):x3.moveTo(p[0],p[1])});x3.stroke();\nvar L=[0];for(var i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));\nvar spd=1+Ua/200;ph=(ph+spd)%40;x3.fillStyle='#7dd3fc';\nfor(var d=ph;d<L[L.length-1];d+=40){var j=1;while(j<L.length-1&&L[j]<d)j++;var f=(d-L[j-1])/(L[j]-L[j-1]||1);\nx3.beginPath();x3.arc(pts[j-1][0]+f*(pts[j][0]-pts[j-1][0]),pts[j-1][1]+f*(pts[j][1]-pts[j-1][1]),4,0,7);x3.fill()}\nx3.fillStyle='#4ade80';x3.beginPath();x3.arc(560,scr,6,0,7);x3.fill();\nxs.fillStyle='rgba(11,21,48,.25)';xs.fillRect(0,0,240,240);\nxs.clearRect(0,0,240,240);xs.strokeStyle='#1e3a5f';xs.lineWidth=1;xs.beginPath();xs.moveTo(120,0);xs.lineTo(120,240);xs.moveTo(0,120);xs.lineTo(240,120);xs.stroke();\nxs.fillStyle='rgba(74,222,128,.25)';xs.beginPath();xs.arc(120+sx*1.2/1,120-sy*1.2*.857,16,0,7);xs.fill();\nxs.fillStyle='#4ade80';xs.beginPath();xs.arc(120+sx*1.2,120-sy*1.2*.857,7,0,7);xs.fill()}\nfunction fit(){[c1,c2,g,c3,cs].forEach(function(c){c.style.height=(c.clientWidth*c.height/c.width)+'px'});}\ncs.style.background='#0b1530';\n(function loop(){d1();d2();d3();requestAnimationFrame(loop)})();\n<\/script><\/body><\/html>\n"}]</script>
