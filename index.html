<script id="d" type="application/json">[{"t": "Elektr zaryadlari", "i": "⚡", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Elektr zaryadlari<\/title>\n<style>\n:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#5b667a;--br:#d9deea;--pos:#e53935;--neg:#1e66f5;--ac:#6c4cf1;--ok:#1b9e5a;--no:#d6336c;--cv:#eef2ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#10141f;--card:#1a2030;--tx:#eef1f8;--mu:#9aa6bd;--br:#2d3550;--pos:#ff6b6b;--neg:#5b9bff;--ac:#9a84ff;--ok:#3ddc84;--no:#ff7aa8;--cv:#141a2b;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#10141f;--card:#1a2030;--tx:#eef1f8;--mu:#9aa6bd;--br:#2d3550;--pos:#ff6b6b;--neg:#5b9bff;--ac:#9a84ff;--ok:#3ddc84;--no:#ff7aa8;--cv:#141a2b;color-scheme:dark}\n*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--tx);font:18px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nheader{padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:820px;margin:auto}\nh1{font-size:1.3rem;margin:0}h2{font-size:1.35rem;margin:.2em 0}h3{font-size:1.05rem;margin:1em 0 .3em;color:var(--ac)}\nnav{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;max-width:820px;margin:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}\nbutton{font:inherit;font-weight:600;border:2px solid var(--br);background:var(--card);color:var(--tx);border-radius:14px;padding:12px 16px;min-height:48px;cursor:pointer}\nnav button{white-space:nowrap}nav button.on,.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}\nmain{max-width:820px;margin:auto;padding:8px 16px 40px}\nsection{display:none}section.on{display:block}\n.card{background:var(--card);border:1px solid var(--br);border-radius:18px;padding:16px;margin:12px 0}\nul{padding-left:1.2em;margin:.3em 0}\ncanvas{width:100%;height:auto;background:var(--cv);border-radius:14px;display:block;border:1px solid var(--br)}\n.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}\n.pri{background:var(--ac);border-color:var(--ac);color:#fff}\n.st{font-weight:600;margin:8px 0;min-height:1.6em}\n.p{color:var(--pos)}.n{color:var(--neg)}\n.q{margin:14px 0}.q p{margin:.2em 0 .5em;font-weight:600}\n.q button{display:block;width:100%;text-align:left;margin:6px 0}\n.q button.ok{background:var(--ok);border-color:var(--ok);color:#fff}.q button.bad{background:var(--no);border-color:var(--no);color:#fff}\n.ex{font-size:.95rem;color:var(--mu);margin:.3em 0}\ninput[type=range]{width:100%;height:36px;accent-color:var(--ac)}\n.seg{display:flex;gap:8px;flex-wrap:wrap}\n<\/style>\n<\/head>\n<body>\n<header><h1>⚡ Elektr zaryadlari<\/h1><button id=\"th\" aria-label=\"Rejim\">🌓<\/button><\/header>\n<nav id=\"nav\"><\/nav>\n<main>\n\n<section id=\"s0\">\n<div class=\"card\"><h2>1. Elektr zaryadlari va ularning turlari<\/h2>\n<p>Baʼzi jismlar bir-biriga ishqalanganda elektrlanadi, yaʼni boshqa yengil jismlarni oʻziga tortadi. Tabiatda ikki xil elektr zaryadi bor: <b class=\"p\">musbat (+)<\/b> va <b class=\"n\">manfiy (−)<\/b>. Elektron — manfiy zaryadga ega elementar zarra. Ishqalanganda elektronlar bir jismdan ikkinchisiga oʻtadi. Elektron olgan jism manfiy, elektron yoʻqotgan jism musbat zaryadlanadi. Zaryad yoʻqolmaydi va yoʻqdan paydo boʻlmaydi, faqat bir jismdan boshqasiga oʻtadi (zaryadning saqlanish qonuni).<\/p>\n<h3>Asosiy tushunchalar<\/h3>\n<ul><li>Zaryad — jismning elektr xossasini bildiruvchi kattalik.<\/li><li>Elektron — manfiy zaryadli zarra.<\/li><li>Neytral jismda musbat va manfiy zaryadlar teng.<\/li><\/ul><\/div>\n<div class=\"card\"><h3>Simulyatsiya: ebonit va jun<\/h3>\n<canvas id=\"c1\" width=\"360\" height=\"220\"><\/canvas>\n<div class=\"row\"><button class=\"pri\" id=\"rub\">🧶 Ishqalash<\/button><button id=\"rs1\">↺ Qaytadan<\/button><\/div>\n<div class=\"st\" id=\"t1\"><\/div><\/div>\n<div class=\"card\"><h3>Tekshiruv savollari<\/h3><div id=\"q0\"><\/div><\/div>\n<\/section>\n\n<section id=\"s1\">\n<div class=\"card\"><h2>2. Zaryadlarning oʻzaro taʼsiri<\/h2>\n<p>Zaryadlangan jismlar bir-biriga taʼsir kuchi bilan taʼsir qiladi. <b>Bir xil ismli zaryadlar itarishadi, har xil ismli zaryadlar tortishadi.<\/b> Bu kuch zaryadlar orasidagi masofaga bogʻliq. Masofa kamaysa, kuch ortadi, masofa ortsa, kuch kamayadi (Kulon qonuni). Zaryad qancha katta boʻlsa, kuch ham shuncha katta boʻladi.<\/p>\n<h3>Asosiy tushunchalar<\/h3>\n<ul><li>Itarishish: (+ +) yoki (− −).<\/li><li>Tortishish: (+ −).<\/li><li>Kuch masofa kamayishi bilan ortadi.<\/li><\/ul><\/div>\n<div class=\"card\"><h3>Simulyatsiya: ikki sharcha<\/h3>\n<div class=\"row seg\" id=\"sg1\"><\/div>\n<canvas id=\"c2\" width=\"360\" height=\"200\"><\/canvas>\n<label>Masofa: <b id=\"rv\"><\/b><input type=\"range\" id=\"rg\" min=\"1\" max=\"10\" value=\"5\"><\/label>\n<div class=\"st\" id=\"t2\"><\/div><\/div>\n<div class=\"card\"><h3>Tekshiruv savollari<\/h3><div id=\"q1\"><\/div><\/div>\n<\/section>\n\n<section id=\"s2\">\n<div class=\"card\"><h2>3. Zaryadlardan foydalanish<\/h2>\n<p>Elektr zaryadlarining xossalari texnikada keng qoʻllanadi. Kserokopiya va lazerli printerda zaryadlangan baraban tonerni oʻziga tortadi. Yashin qaytargich chaqmoq zaryadini xavfsiz yerga oʻtkazadi. Elektrostatik filtrda chang zarralari zaryadlanib, qarama-qarshi zaryadli plastinkaga yopishadi. Shunday qilib havo tozalanadi.<\/p>\n<h3>Asosiy tushunchalar<\/h3>\n<ul><li>Elektrostatik tortishish — toner va chang tutishda.<\/li><li>Chaqmoq — bulut va yer orasidagi katta elektr uchquni.<\/li><li>Yashin qaytargich — binoni himoya qiladi.<\/li><\/ul><\/div>\n<div class=\"card\"><h3>Simulyatsiya<\/h3>\n<div class=\"seg\" id=\"md\"><\/div>\n<canvas id=\"c3\" width=\"360\" height=\"220\" style=\"margin-top:10px\"><\/canvas>\n<div class=\"row\"><button class=\"pri\" id=\"go\">▶ Boshlash<\/button><\/div>\n<div class=\"st\" id=\"t3\"><\/div><\/div>\n<div class=\"card\"><h3>Tekshiruv savollari<\/h3><div id=\"q2\"><\/div><\/div>\n<\/section>\n\n<section id=\"s3\">\n<div class=\"card\"><h2>Dars xulosasi<\/h2>\n<ul><li>Ikki xil zaryad bor: musbat (+) va manfiy (−).<\/li><li>Elektron — manfiy zaryadli elementar zarra.<\/li><li>Ishqalanganda elektronlar bir jismdan boshqasiga oʻtadi.<\/li><li>Zaryad yoʻqolmaydi va yoʻqdan paydo boʻlmaydi.<\/li><li>Bir xil ismli zaryadlar itarishadi, har xil ismlilar tortishadi.<\/li><li>Masofa kamaysa, taʼsir kuchi ortadi.<\/li><li>Toner, yashin qaytargich, elektrofiltr — amaliy qoʻllanish.<\/li><\/ul><\/div>\n<div class=\"card\"><h3>Yakuniy test (5 savol)<\/h3><div id=\"qf\"><\/div><div class=\"st\" id=\"sc\"><\/div><\/div>\n<\/section>\n<\/main>\n\n<script>\nconst $=s=>document.querySelector(s),cs=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst names=['1. Zaryadlar turlari','2. Oʻzaro taʼsir','3. Qoʻllanilishi','Xulosa va test'];let tab=0;\nnames.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>show(i);$('#nav').appendChild(b)});\nfunction show(i){tab=i;document.querySelectorAll('section').forEach((s,j)=>s.classList.toggle('on',i==j));document.querySelectorAll('#nav button').forEach((b,j)=>b.classList.toggle('on',i==j));scrollTo(0,0)}\n$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};\n\nfunction quiz(el,qs,fin){let ans=0,sc=0;const box=$(el);qs.forEach(q=>{const d=document.createElement('div');d.className='q';d.innerHTML='<p>'+q[0]+'<\/p>';const ex=document.createElement('div');ex.className='ex';\nq[1].forEach((o,i)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{d.qu sofa kamaysa, kuch ortadi.'],['Kserokopiyada toner nimaga tortiladi?',['Zaryadlangan barabanga','Magnitga','Issiq lampaga'],0,'Qarama-qarshi zaryadli baraban tonerni tortadi.']],1);\n\nfunction chg(ctx,x,y,s,r=9){ctx.fillStyle=s>0?cs('--pos'):s<0?cs('--neg'):'#888';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-r/2,y);ctx.lineTo(x+r/2,y);if(s>0){ctx.moveTo(x,y-r/2);ctx.lineTo(x,y+r/2)}ctx.stroke()}\nfunction txt(ctx,s,x,y,c){ctx.fillStyle=c||cs('--tx');ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText(s,x,y)}\nfunction arrow(ctx,x1,y,x2,c){ctx.strokeStyle=ctx.fillStyle=c;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();const d=x2>x1?1:-1;ctx.beginPath();ctx.moveTo(x2+d*12,y);ctx.lineTo(x2,y-9);ctx.lineTo(x2,y+9);ctx.fill()}\n\n/* 1-simulyatsiya */\nlet a1=0,fl=[],rb=0;const X=i=>68+i*24;\n$('#rub').onclick=()=>{rb=50;const k=a1+fl.length;if(k<4)fl.push({t:0,k})};\n$('#rs1').onclick=()=>{a1=0;fl=[];rb=0;u1()};\nfunction u1(){$('#t1').innerHTML='Ebonit: <span class=\"n\">−'+a1+'<\/span> &nbsp; Jun: <span class=\"p\">+'+a1+'<\/span> &nbsp; Jami zaryad: 0'+(a1>=4?' <br>Elektronlar jundan ebonitga oʻtdi!':'')}\nfunction d1(){const c=$('#c1'),x=c.getContext('2d');x.clearRect(0,0,360,220);const ox=rb>0?Math.sin(rb*.6)*16:0;if(rb>0)rb--;\nx.fillStyle='#d9b38c';x.fillRect(50,130,260,60);x.fillStyle='#4a3b32';x.beginPath();x.roundRect(50+ox,30,260,50,14);x.fill();\nfor(let i=0;i<6;i++){chg(x,X(i)+ox,46,1);chg(x,X(i),148,1)}\nfor(let i=0;i<6+a1;i++)chg(x,X(i)+ox,66,-1);\nconst wl=6-a1-fl.length;for(let i=0;i<wl;i++)chg(x,X(i),172,-1);\nfl.forEach(f=>{f.t+=1/40;const sx=X(5-f.k),sy=172,ex=X(6+f.k)+ox,ey=66,t=Math.min(1,f.t);chg(x,sx+(ex-sx)*t,sy+(ey-sy)*t-Math.sin(t*3.14)*25,-1)});\nconst n=fl.length;fl=fl.filter(f=>f.t<1);if(fl.length<n){a1+=n-fl.length;u1()}\ntxt(x,'Ebonit tayoqcha',180,22);txt(x,'Jun mato',180,208)}\nu1();\n\n/* 2-simulyatsiya */\nlet sA=1,sB=1;\n[['A sharcha:',0],['B sharcha:',1]].forEach(([l,w])=>{const d=document.createElement('div');d.className='row';d.innerHTML='<b>'+l+'<\/b>';['+','−'].forEach((s,i)=>{const b=document.createElement('button');b.textContent=s;b.className=(i==0?'on':'');b.onclick=()=>{if(w)sB=i?-1:1;else sA=i?-1:1;d.querySelectorAll('button').forEach(z=>z.classList.remove('on'));b.classList.add('on')};d.appendChild(b)});$('#sg1').appendChild(d)});\nfunction d2(){const x=$('#c2').getContext('2d'),r=+$('#rg').value;x.clearRect(0,0,360,200);const h=r*8+24,ax=180-h,bx=180+h,y=125,F=100/(r*r),L=8+60/r,same=sA==sB;\n$('#rv').textContent=r+' (shartli birlik)';\nx.strokeStyle=cs('--mu');x.setLineDash([4,4]);x.lineWidth=1;x.beginPath();x.moveTo(ax,170);x.lineTo(bx,170);x.stroke();x.setLineDash([]);txt(x,'r',180,188,cs('--mu'));\nchg(x,ax,y,sA,22);chg(x,bx,y,sB,22);\nconst c=cs('--ac');if(same){arrow(x,ax,70,ax-L,c);arrow(x,bx,70,bx+L,c)}else{arrow(x,ax,70,ax+L,c);arrow(x,bx,70,bx-L,c)}\ntxt(x,'F',ax,45,c);txt(x,'F',bx,45,c);\n$('#t2').innerHTML=(same?'Bir xil ismli zaryadlar <b>itarishadi<\/b>.':'Har xil ismli zaryadlar <b>tortishadi<\/b>.')+'<br>Kuch: '+F.toFixed(1)+' (masofa kamaysa, kuch ortadi)'}\n\n/* 3-simulyatsiya */\nlet md=0,t3=0,pl=false;const M=['🖨 Printer','⛈ Yashin','🌫 Filtr'],cap=[['1. Baraban musbat zaryadlanadi','2. Manfiy toner zaryadlangan joylarga tortiladi','3. Toner qogʻozga oʻtadi va qizdirib mustahkamlanadi'],['Bulut quyi qismida manfiy zaryad toʻplanadi','Chaqmoq yashin qaytargichga uriladi','Zaryad sim orqali yerga oʻtadi — bino xavfsiz'],['Chang zarralari musbat zaryadlanadi','Ular manfiy plastinkaga tortiladi','Chang yopishdi, havo toza']];\nM.forEach((m,i)=>{const b=document.createElement('button');b.textContent=m;b.className=i?'':'on';b.onclick=()=>{md=i;t3=0;pl=false;document.querySelectorAll('#md button').forEach((z,j)=>z.classList.toggle('on',i==j))};$('#md').appendChild(b)});$('#md').className='seg';\n$('#go').onclick=()=>{t3=0;pl=true};\nfunction d3(){const x=$('#c3').getContext('2d');x.clearRect(0,0,360,220);if(pl){t3+=1/200;if(t3>=1){t3=1;pl=false}}const t=t3,s=t<.34?0:t<.67?1:2;\nif(md==0){x.strokeStyle=cs('--mu');x.lineWidth=4;x.beginPath();x.arc(120,95,50,0,7);x.stroke();txt(x,'baraban',120,98,cs('--mu'));\nconst m=s==0?Math.floor(t/.34*9):8;for(let i=0;i<m;i++){const g=i*.785,px=120+Math.cos(g)*50,py=95+Math.sin(g)*50;chg(x,px,py,1,8);if(s>=1&&i<8){const p=s==1?(t-.34)/.33:1;if(s==2&&i%2)continue;chg(x,120+(px-120)*(1.0)+ (1-p)*(180-px)*.0,py-(1-p)*0,-1,0)}}\nx.fillStyle=cs('--neg');x.fillRect(220,20,60,24);txt(x,'toner',250,37,'#fff');\nif(s>=1){const p=s==1?(t-.34)/.33:1;for(let i=0;i<8;i++){const g=i*.785,px=120+Math.cos(g)*58,py=95+Math.sin(g)*58;chg(x,250+(px-250)*p,32+(py-32)*p,-1,5)}}\nconst px=s==2?20+(t-.67)/.33*120:20;x.fillStyle='#fff';x.strokeStyle=cs('--br');x.fillRect(px,165,170,12);x.strokeRect(px,165,170,12);if(s==2)for(let i=0;i<9;i++)chg(x,px+14+i*18,163,-1,4)}\nelse if(md==1){x.fillStyle=cs('--mu');x.beginPath();x.ellipse(160,40,100,28,0,0,7);x.fill();x.fillStyle='#7c5a3a';x.fillRect(0,195,360,25);\nx.fillStyle=cs('--br');x.fillRect(250,150,60,45);x.strokeStyle=cs('--tx');x.lineWidth=3;x.beginPath();x.moveTo(280,150);x.lineTo(280,118);x.stroke();txt(x,'yashin qaytargich',275,112);\nconst k=Math.min(7,Math.floor(t/.4*8));for(let i=0;i<k;i++){chg(x,90+i*25,72,-1,8);chg(x,30+i*30,208,1,7)}\nif(t>=.45&&t<.85){const f=t<.57;if(f){x.fillStyle='rgba(255,240,150,.25)';x.fillRect(0,0,360,220)}x.strokeStyle='#ffd400';x.lineWidth=f?6:2;x.beginPath();[[170,66],[205,80],[190,92],[240,104],[225,112],[280,118]].forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke()}\nif(t>=.6){x.strokeStyle=cs('--pos');x.lineWidth=3;x.setLineDash([5,4]);x.beginPath();x.moveTo(280,118);x.lineTo(280,195);x.stroke();x.setLineDash([]);txt(x,'tok → yerga',330,175,cs('--pos'))}}\nelse{x.strokeStyle=cs('--mu');x.lineWidth=3;x.strokeRect(10,45,340,125);x.fillStyle=cs('--neg');x.fillRect(150,162,190,10);txt(x,'manfiy plastinka (−)',245,190,cs('--neg'));x.fillStyle=cs('--pos');x.fillRect(110,45,4,60);txt(x,'+ zaryadlovchi',112,38,cs('--pos'));\nfor(let i=0;i<14;i++){let px=(i*37)%90+10+t*320,py=60+(i*29)%80;const past=px>112;if(past)py=Math.min(py+(px-112)*.45,158-(i%4)*3);px=Math.min(px,335-(i%7)*12);if(px>335-(i%7)*12-1&&past)py=158-(i%4)*3;chg(x,px,py,past?1:0,past?5:4)}\nif(t==0)txt(x,'havo oqimi →',70,150,cs('--mu'));}\n$('#t3').textContent=cap[md][s]}\nfunction loop(){if(tab==0)d1();if(tab==1)d2();if(tab==2)d3();requestAnimationFrame(loop)}\nCanvasRenderingContext2D.prototype.roundRect||(CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h)});\nshow(0);loop();\n<\/script>\n<\/body>\n<\/html>\n"}, {"t": "Metallarda elektr toki", "i": "🔩", "h": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Metallarda elektr toki<\/title>\n<style>\n/* ===== Ranglar (yorugʻ rejim) ===== */\n:root{--bg:#f2f6fb;--card:#fff;--tx:#17202f;--mu:#586378;--bd:#d9e0ec;--rod:#e3e9f3;\n--el:#2f7bff;--ion:#ee8a1f;--cur:#16a34a;--fb:#eef4ff;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0e1522;--card:#172033;--tx:#e8edf7;--mu:#9aa6bd;--bd:#2a3550;--rod:#25304a;--el:#5b9bff;--ion:#ffa347;--cur:#3ddc84;--fb:#1d2a45}}\n:root[data-theme=\"dark\"]{--bg:#0e1522;--card:#172033;--tx:#e8edf7;--mu:#9aa6bd;--bd:#2a3550;--rod:#25304a;--el:#5b9bff;--ion:#ffa347;--cur:#3ddc84;--fb:#1d2a45}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 \"Segoe UI\",system-ui,-apple-system,sans-serif}\n.wrap{max-width:760px;margin:0 auto;padding:14px 12px 28px}\nh1{font-size:1.35rem;margin:6px 0 2px}\n.sub{color:var(--mu);margin:0 0 12px;font-size:.92rem}\n.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}\n.tabs button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:20px;font:inherit;font-size:.88rem;cursor:pointer}\n.tabs button.on{background:var(--el);border-color:var(--el);color:#fff}\n.sec{display:none}.sec.on{display:block}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}\nh2{font-size:1.15rem;margin:0 0 8px}\nh3{font-size:1rem;margin:0 0 6px}\np{margin:0 0 8px}\nb{color:var(--el)}\n.formula{border:2px solid var(--cur);border-radius:10px;padding:8px 12px;text-align:center;font-size:1.1rem;font-weight:600;margin:10px 0;background:var(--fb)}\ncanvas{width:100%;display:block;border-radius:10px;background:var(--bg);border:1px solid var(--bd)}\n.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}\n.btn{border:0;background:var(--el);color:#fff;padding:9px 14px;border-radius:10px;font:inherit;font-size:.92rem;cursor:pointer}\n.btn.alt{background:var(--rod);color:var(--tx)}\n.btn.g{background:var(--cur);color:#fff}\n.btn:disabled{opacity:.4;cursor:default}\nbutton:focus-visible,input:focus-visible{outline:3px solid var(--ion);outline-offset:2px}\n.sl{display:flex;align-items:center;gap:8px;flex:1 1 220px}\n.sl input{flex:1}\n.note{font-size:.85rem;color:var(--mu);background:var(--bg);border-radius:8px;padding:8px 10px}\n.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}\n.kv div{background:var(--bg);border-radius:10px;padding:6px 8px;text-align:center;font-size:.82rem;color:var(--mu)}\n.kv b{display:block;font-size:1.15rem;color:var(--tx)}\n.seg{display:flex;gap:6px}.seg button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 11px;font:inherit;cursor:pointer}\n.seg button.on{border-color:var(--ion);background:var(--ion);color:#fff}\nul{margin:0;padding-left:20px}li{margin-bottom:4px}\n.q{border-top:1px solid var(--bd);padding-top:10px;margin-top:10px}\n.q label{display:block;padding:5px 0;cursor:pointer}\n.fb{font-size:.9rem;margin:6px 0 0}.fb.ok{color:var(--cur)}.fb.no{color:#dc2626}\n.nav{display:flex;justify-content:space-between;gap:8px}\n.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<h1>Metallarda elektr toki<\/h1>\n<p class=\"sub\">8-sinf fizikasi · interaktiv dars<\/p>\n<nav class=\"tabs\" id=\"tabs\"><\/nav>\n\n<!-- ============ 1-BOʻLIM ============ -->\n<section class=\"sec on\" id=\"s0\">\n<div class=\"card\">\n<h2>1. Metallarning elektr oʻtkazuvchanligi<\/h2>\n<p>Moddalar elektr tokini oʻtkazish qobiliyatiga qarab ikkiga boʻlinadi. Metallarda atomlardan ajralgan <b>erkin elektronlar<\/b> koʻp, ular butun metall boʻylab harakatlana oladi. Shuning uchun metallar <b>oʻtkazgich<\/b> hisoblanadi. <b>Dielektrik<\/b>larda (shisha, plastmassa, quruq havo) erkin zaryadlar deyarli yoʻq, shu sababli ular tok oʻtkazmaydi. <b>Elektr toki<\/b> — zaryadli zarralarning tartibli (yoʻnalgan) harakatidir.<\/p>\n<div class=\"formula\">I = q / t &nbsp;<span style=\"font-weight:400;font-size:.85rem\">(1 A = 1 C / 1 s)<\/span><\/div>\n<canvas id=\"c1\"><\/canvas>\n<div class=\"ctrl\">\n<button class=\"btn g\" id=\"b1\">Zanjirni ulash<\/button>\n<button class=\"btn alt\" data-run=\"0\">Toʻxtatish<\/button>\n<button class=\"btn alt\" data-reset=\"0\">Qayta boshlash<\/button>\n<\/div>\n<div class=\"note\" id=\"r1\"><\/div>\n<p style=\"margin-top:8px;font-size:.85rem\" class=\"note\"><span class=\"dot\" style=\"background:var(--el)\"><\/span> elektron &nbsp; <span class=\"dot\" style=\"background:var(--ion)\"><\/span> musbat ion / atom &nbsp; <span class=\"dot\" style=\"background:var(--cur)\"><\/span> tok<\/p>\n<\/div>\n<div class=\"card\"><h3>Asosiy xulosa<\/h3><ul>\n<li>Metallarda erkin elektronlar koʻp — ular yaxshi oʻtkazgich.<\/li>\n<li>Dielektriklarda erkin zaryadlar yoʻq — tok oʻtmaydi.<\/li>\n<li>Elektr toki — zaryadli zarralarning tartibli harakati; I = q/t.<\/li><\/ul><\/div>\n<div class=\"card\"><h3>Tezkor savollar<\/h3><div id=\"q0\"><\/div><\/div>\n<\/section>\n\n<!-- ============ 2-BOʻLIM ============ -->\n<section class=\"sec\" id=\"s1\">\n<div class=\"card\">\n<h2>2. Metallarda tokning hosil boʻlishi<\/h2>\n<p>Metall — <b>kristall panjara<\/b>: uning tugunlarida <b>musbat ionlar<\/b> joylashgan va ular oʻz oʻrni atrofida tebranadi. Ionlar orasida <b>erkin elektronlar<\/b> xaotik (tartibsiz) harakatlanadi. Tok boʻlmaganda elektronlar bir yoʻnalishda siljimaydi. Zanjirga kuchlanish ulansa, elektr maydon elektronlarni manfiy qutbdan musbat qutbga suradi: xaotik harakat ustiga <b>tartibli dreyf harakat<\/b> qoʻshiladi. Dreyf tezligi juda kichik (taxminan mm/s), issiqlik harakati tezligi esa ~10⁵ m/s. Tokning <b>shartli yoʻnalishi<\/b> musbat qutbdan manfiyga, elektronlar esa aksincha harakatlanadi.<\/p>\n<div class=\"formula\">Tok (shartli): + → − &nbsp;|&nbsp; Elektronlar: − → +<\/div>\n<canvas id=\"c2\"><\/canvas>\n<div class=\"ctrl\">\n<div class=\"sl\"><label for=\"u2\">Kuchlanish U:<\/label><input type=\"range\" id=\"u2\" min=\"0\" max=\"12\" step=\"0.5\" value=\"0\"><b id=\"uv2\">0<\/b> V<\/div>\n<\/div>\n<div class=\"ctrl\">\n<button class=\"btn alt\" data-run=\"1\">Toʻxtatish<\/button>\n<button class=\"btn alt\" data-reset=\"1\">Qayta boshlash<\/button>\n<\/div>\n<div class=\"note\" id=\"r2\"><\/div>\n<p class=\"note\" style=\"margin-top:8px\">Eslatma: chizmada tezliklar koʻrinishi uchun kattalashtirilgan. Haqiqiy dreyf tezligi issiqlik tezligidan million marta kichik.<\/p>\n<\/div>\n<div class=\"card\"><h3>Asosiy xulosa<\/h3><ul>\n<li>Tok oʻchiq: elektronlar xaotik harakatlanadi, oʻrtacha siljish yoʻq.<\/li>\n<li>Tok ulansa: xaotik harakatga tartibli dreyf qoʻshiladi; U oshsa dreyf tezligi ortadi.<\/li>\n<li>Shartli tok yoʻnalishi + dan −ga, elektronlar yoʻnalishi − dan +ga.<\/li><\/ul><\/div>\n<div class=\"card\"><h3>Tezkor savollar<\/h3><div id=\"q1\"><\/div><\/div>\n<\/section>\n\n<!-- ============ 3-BOʻLIM ============ -->\n<section class=\"sec\" id=\"s2\">\n<div class=\"card\">\n<h2>3. Elektr qarshilik va haroratning ta’siri<\/h2>\n<p>Harakatlanayotgan elektronlar ionlar bilan <b>toʻqnashadi<\/b> — bu <b>elektr qarshilikni<\/b> (R) hosil qiladi. Harorat oshsa, ionlar <b>kuchliroq tebranadi<\/b>, toʻqnashuvlar koʻpayadi, shuning uchun metallning <b>qarshiligi ortadi<\/b> va tok kuchi kamayadi. Metallar uchun qarshilik harorat bilan deyarli chiziqli oʻzgaradi. Bunda <b>α<\/b> — qarshilikning harorat koeffitsiyenti (turli moddada turlicha).<\/p>\n<div class=\"formula\">R = U / I<br>R = R₀(1 + α·ΔT)<\/div>\n<canvas id=\"c3\"><\/canvas>\n<div class=\"ctrl\">\n<div class=\"sl\"><label for=\"t3\">Harorat:<\/label><input type=\"range\" id=\"t3\" min=\"0\" max=\"500\" step=\"5\" value=\"20\"><b id=\"tv3\">20<\/b> °C<\/div>\n<\/div>\n<div class=\"ctrl\"><div class=\"seg\" id=\"mat\">\n<button data-m=\"Cu\" class=\"on\">Mis<\/button><button data-m=\"Al\">Alyuminiy<\/button><button data-m=\"Fe\">Temir<\/button><\/div>\n<button class=\"btn alt\" data-run=\"2\">Toʻxtatish<\/button>\n<button class=\"btn alt\" data-reset=\"2\">Qayta boshlash<\/button><\/div>\n<div class=\"kv\"><div>Harorat<b id=\"vT\"><\/b><\/div><div>Qarshilik R<b id=\"vR\"><\/b><\/div><div>Ampermetr I<b id=\"vI\" style=\"color:var(--cur)\"><\/b><\/div><\/div>\n<div class=\"note\" id=\"f3\"><\/div>\n<canvas id=\"c4\" style=\"margin-top:10px\"><\/canvas>\n<p class=\"note\" style=\"margin-top:8px\">Kuchlanish U = 12 V (oʻzgarmas), ΔT — 0 °C dan boshlab hisoblangan harorat farqi. R₀ va α qiymatlari oʻquv maqsadida yaxlitlangan.<\/p>\n<\/div>\n<div class=\"card\"><h3>Asosiy xulosa<\/h3><ul>\n<li>Qarshilik — elektronlarning ionlar bilan toʻqnashuvi natijasi.<\/li>\n<li>Metall qizisa, ionlar kuchli tebranadi: R ortadi, I kamayadi.<\/li>\n<li>R = U/I va R = R₀(1 + αΔT); α har bir moddada oʻzgacha.<\/li><\/ul><\/div>\n<div class=\"card\"><h3>Tezkor savollar<\/h3><div id=\"q2\"><\/div><\/div>\n<\/section>\n\n<!-- ============ XULOSA VA TEST ============ -->\n<section class=\"sec\" id=\"s3\">\n<div class=\"card\"><h2>Umumiy xulosa<\/h2><ul>\n<li>Metallarda erkin elektronlar bor, shuning uchun ular tokni yaxshi oʻtkazadi; dielektriklarda esa yoʻq.<\/li>\n<li>Elektr toki — zaryadli zarralarning tartibli harakati: I = q/t.<\/li>\n<li>Elektronlarning tartibli (dreyf) tezligi juda kichik; tok yoʻnalishi shartli ravishda + dan −ga olingan.<\/li>\n<li>Harorat oshsa metallning qarshiligi ortadi: R = R₀(1 + αΔT), I = U/R kamayadi.<\/li><\/ul><\/div>\n<div class=\"card\"><h2>Mini-test<\/h2><div id=\"q3\"><\/div>\n<p class=\"fb\" id=\"score\" style=\"font-weight:600;margin-top:12px\"><\/p><\/div>\n<\/section>\n\n<div class=\"nav\"><button class=\"btn alt\" id=\"prev\">‹ Oldingi<\/button><button class=\"btn\" id=\"next\">Keyingi ›<\/button><\/div>\n<\/div>\n\n<script>\n/* ================= Umumiy yordamchilar ================= */\nconst $=s=>document.querySelector(s),R=(a,b)=>a+Math.random()*(b-a),TAU=Math.PI*2;\nlet K={}; // joriy mavzu ranglari (CSS oʻzgaruvchilaridan)\nfunction th(){const s=getComputedStyle(document.documentElement);[\"el\",\"ion\",\"cur\",\"rod\",\"tx\",\"mu\",\"bd\",\"card\"].forEach(k=>K[k]=s.getPropertyValue(\"--\"+k).trim())}\n// Canvasni ekran zichligiga moslash; mantiqiy oʻlcham W×H\nfunction fit(c,W,H){const d=devicePixelRatio||1,w=c.clientWidth;if(!w)return null;\n if(c.width!==Math.round(w*d)){c.width=Math.round(w*d);c.height=Math.round(w*d*H/W);c.style.height=(w*H/W)+\"px\"}\n const x=c.getContext(\"2d\"),s=c.width/W;x.setTransform(s,0,0,s,0,0);x.clearRect(0,0,W,H);return x}\nfunction dot(x,a,b,r,c){x.fillStyle=c;x.beginPath();x.arc(a,b,r,0,TAU);x.fill()}\nfunction txt(x,s,a,b,c,sz,al){x.fillStyle=c;x.font=`600 ${sz||15}px system-ui,sans-serif`;x.textAlign=al||\"center\";x.fillText(s,a,b)}\nfunction arrow(x,a,b,c,d,col,lb){x.strokeStyle=x.fillStyle=col;x.lineWidth=3;x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke();\n const g=Math.atan2(d-b,c-a);x.beginPath();x.moveTo(c,d);x.lineTo(c-11*Math.cos(g-.45),d-11*Math.sin(g-.45));x.lineTo(c-11*Math.cos(g+.45),d-11*Math.sin(g+.45));x.fill();\n if(lb)txt(x,lb,(a+c)/2,b-8,col,15)}\nfunction bulb(x,cx,cy,l){ // lampochka, l = yorqinlik 0..1\n if(l>.02){const g=x.createRadialGradient(cx,cy,4,cx,cy,70);g.addColorStop(0,`rgba(255,214,70,${.8*l})`);g.addColorStop(1,\"rgba(255,214,70,0)\");x.fillStyle=g;x.fillRect(cx-70,cy-70,140,140)}\n dot(x,cx,cy,22,K.rod);x.globalAlpha=l;dot(x,cx,cy,22,\"#ffd23f\");x.globalAlpha=1;\n x.strokeStyle=K.mu;x.lineWidth=2;x.beginPath();x.arc(cx,cy,22,0,TAU);x.stroke();\n x.beginPath();x.moveTo(cx-9,cy+8);x.lineTo(cx-4,cy-6);x.lineTo(cx+4,cy+6);x.lineTo(cx+9,cy-8);x.stroke()}\n// Elektron harakati: xaotik (issiqlik) + dreyf; ionlar bilan toʻqnashuv\nfunction step(p,dt,o){\n p.a+=R(-1,1)*(o.j||0)*dt;\n if(o.ions)for(const i of o.ions){const dx=p.x-i.px,dy=p.y-i.py;\n  if(dx*dx+dy*dy<o.rc*o.rc){p.a=Math.atan2(dy,dx)+R(-1.2,1.2);p.x=i.px+Math.cos(p.a)*o.rc;p.y=i.py+Math.sin(p.a)*o.rc;break}}\n p.x+=(Math.cos(p.a)*o.vt+o.drift)*dt;p.y+=Math.sin(p.a)*o.vt*dt;\n if(p.y<o.y0){p.y=o.y0;p.a=-p.a}if(p.y>o.y1){p.y=o.y1;p.a=-p.a}\n if(p.x>o.x1){if(o.wrap&&o.drift>0)p.x=o.x0;else{p.x=o.x1;p.a=Math.PI-p.a}}\n if(p.x<o.x0){p.x=o.x0;p.a=Math.PI-p.a}}\nfunction mkIons(n,m,x0,dx,y0,dy){const a=[];for(let i=0;i<n;i++)for(let j=0;j<m;j++)a.push({nx:x0+i*dx,ny:y0+j*dy,px:0,py:0,ph:i*1.7+j*2.3});return a}\nfunction vibrate(ions,t,A){for(const i of ions){i.px=i.nx+A*Math.sin(t*9+i.ph);i.py=i.ny+A*Math.cos(t*8+i.ph*1.3)}}\n\n/* ================= 1-simulyatsiya: metall va dielektrik ================= */\nconst S1={c:$(\"#c1\"),W:640,H:330,run:true,\n reset(){this.conn=false;this.N=0;this.t=0;this.b=0;this.tm=0;\n  this.m=Array.from({length:26},()=>({x:R(100,470),y:R(52,108),a:R(0,TAU)}));$(\"#b1\").textContent=\"Zanjirni ulash\"},\n update(dt){this.tm+=dt;const d=this.conn?45:0;\n  for(const p of this.m){p.px=p.x;step(p,dt,{vt:40,drift:d,x0:100,x1:470,y0:48,y1:112,wrap:1,j:9});\n   // oʻrta chiziqdan (x=285) oʻtgan sof elektronlar soni\n   if(p.px<285&&p.x>=285)this.N++;else if(p.px>=285&&p.x<285&&p.x>p.px-50)this.N--}\n  if(this.conn)this.t+=dt;this.b+=((this.conn?1:0)-this.b)*Math.min(1,dt*6)},\n draw(x){\n  const rows=[{y:40,m:1,cy:80,lb:\"Metall oʻtkazgich\"},{y:210,m:0,cy:250,lb:\"Dielektrik (shisha, plastmassa)\"}];\n  for(const r of rows){\n   x.strokeStyle=K.mu;x.lineWidth=3;x.beginPath();x.moveTo(62,r.cy);x.lineTo(100,r.cy);x.moveTo(470,r.cy);x.lineTo(528,r.cy);x.moveTo(572,r.cy);x.lineTo(606,r.cy);x.stroke();\n   x.fillStyle=K.rod;x.fillRect(100,r.y,370,80);x.strokeStyle=K.bd;x.strokeRect(100,r.y,370,80);\n   x.fillStyle=K.card;x.fillRect(14,r.cy-22,48,44);x.strokeStyle=K.mu;x.strokeRect(14,r.cy-22,48,44);\n   txt(x,\"−\",38,r.cy+8,K.el,24);txt(x,\"+\",620,r.cy+6,K.ion,24);txt(x,r.lb,100,r.y-8,K.tx,15,\"left\");\n   for(let i=0;i<14;i++)for(let j=0;j<2;j++){const ix=113+i*26.5,iy=r.y+24+j*32;\n    if(r.m)dot(x,ix,iy,5,K.ion);\n    else{dot(x,ix,iy,7,K.ion);const a=this.tm*3+i+j*2;dot(x,ix+8*Math.cos(a),iy+8*Math.sin(a),3.5,K.el)}} // bogʻlangan elektronlar\n   if(r.m)for(const p of this.m)dot(x,p.x,p.y,4.5,K.el);\n   bulb(x,550,r.cy,r.m?this.b:0);\n   txt(x,r.m&&this.conn?\"Lampochka yonadi\":\"Lampochka yonmaydi\",550,r.cy+46,K.tx,13)}\n  if(this.conn){arrow(x,460,142,110,142,K.cur,\"I (shartli: + → −)\");arrow(x,110,174,460,174,K.el,\"e⁻ (− → +)\")}\n  const N=Math.max(0,this.N);\n  $(\"#r1\").innerHTML=`Metallda: <b>${this.conn?\"tok bor\":\"tok yoʻq\"}<\/b>. Kesimdan oʻtgan elektronlar: N = ${N} ta, q = N·e, t = ${this.t.toFixed(1)} s → I = q/t ${this.conn&&this.t>.5?\"≈ \"+(N/this.t).toFixed(1)+\" e/s\":\"\"}.<br>Dielektrikda erkin zaryad yoʻq: elektronlar atomlarga bogʻlangan, tok oʻtmaydi.`}};\n$(\"#b1\").onclick=()=>{S1.conn=!S1.conn;S1.N=0;S1.t=0;$(\"#b1\").textContent=S1.conn?\"Zanjirni uzish\":\"Zanjirni ulash\"};\n\n/* ================= 2-simulyatsiya: panjara, xaotik va dreyf harakat ================= */\nconst S2={c:$(\"#c2\"),W:640,H:340,run:true,ions:mkIons(10,4,92,50,78,50),\n reset(){this.tm=0;this.U=0;$(\"#u2\").value=0;$(\"#uv2\").textContent=0;\n  this.e=Array.from({length:34},()=>({x:R(70,570),y:R(55,245),a:R(0,TAU)}))},\n update(dt){this.tm+=dt;vibrate(this.ions,this.tm,2.5);\n  for(const p of this.e)step(p,dt,{vt:75,drift:this.U*7,x0:70,x1:570,y0:55,y1:250,ions:this.ions,rc:11,wrap:1})},\n draw(x){\n  x.fillStyle=K.el;x.fillRect(28,55,10,195);x.fillStyle=K.ion;x.fillRect(602,55,10,195);\n  txt(x,\"−\",33,46,K.el,22);txt(x,\"+\",607,46,K.ion,22);\n  for(const i of this.ions){dot(x,i.px,i.py,10,K.ion);txt(x,\"+\",i.px,i.py+5,\"#fff\",14)}\n  for(const p of this.e)dot(x,p.x,p.y,4.5,K.el);\n  if(this.U>0){arrow(x,520,290,120,290,K.cur,\"I (shartli: + → −)\");arrow(x,120,326,520,326,K.el,\"e⁻ harakati (− → +)\")}\n  else txt(x,\"Kuchlanish yoʻq: elektronlar xaotik harakatda\",320,300,K.mu,15);\n  $(\"#r2\").innerHTML=this.U>0?`U = ${this.U} V: dreyf tezligi U ga mutanosib (${Math.round(this.U/12*100)} % maksimumdan). Elektronlar xaotik harakat bilan birga <b>oʻrtacha<\/b> − qutbdan + qutbga siljiydi.`:`U = 0: elektronlar tartibsiz harakatlanadi, oʻrtacha siljish yoʻq → tok yoʻq.`}};\n$(\"#u2\").oninput=e=>{S2.U=+e.target.value;$(\"#uv2\").textContent=e.target.value};\n\n/* ================= 3-simulyatsiya: qarshilik va harorat ================= */\nconst MAT={Cu:{n:\"Mis\",a:.0043,R0:10},Al:{n:\"Alyuminiy\",a:.0041,R0:15},Fe:{n:\"Temir\",a:.0060,R0:25}};\nconst S3={c:$(\"#c3\"),g:$(\"#c4\"),W:640,H:260,run:true,m:\"Cu\",T:20,U:12,ions:mkIons(8,3,75,70,70,60),\n reset(){this.tm=0;this.T=20;this.m=\"Cu\";$(\"#t3\").value=20;$(\"#tv3\").textContent=20;\n  document.querySelectorAll(\"#mat button\").forEach(b=>b.classList.toggle(\"on\",b.dataset.m===\"Cu\"));\n  this.e=Array.from({length:22},()=>({x:R(50,590),y:R(45,215),a:R(0,TAU)}))},\n calc(){const m=MAT[this.m],Rv=m.R0*(1+m.a*this.T);return{m,Rv,I:this.U/Rv}},\n update(dt){this.tm+=dt;const A=2+this.T/500*8,k=this.calc();vibrate(this.ions,this.tm,A);\n  for(const p of this.e)step(p,dt,{vt:60+this.T*.08,drift:k.I*60,x0:40,x1:600,y0:40,y1:220,ions:this.ions,rc:11+A*.5,wrap:1})},\n draw(x){\n  const k=this.calc(),h=this.T/500;\n  for(const i of this.ions){ // qizigan sari ionlar atrofida qizil nur\n   if(h>.05){x.globalAlpha=h*.55;dot(x,i.px,i.py,10+h*8,\"#ef4444\");x.globalAlpha=1}\n   dot(x,i.px,i.py,10,K.ion);txt(x,\"+\",i.px,i.py+5,\"#fff\",14)}\n  for(const p of this.e)dot(x,p.x,p.y,4.5,K.el);\n  txt(x,`${k.m.n}: T = ${this.T} °C`,20,22,K.tx,15,\"left\");\n  arrow(x,540,250,380,250,K.cur,\"I = \"+k.I.toFixed(2)+\" A\");\n  // koʻrsatkichlar\n  const dT=this.T;$(\"#vT\").textContent=this.T+\" °C\";$(\"#vR\").textContent=k.Rv.toFixed(1)+\" Ω\";$(\"#vI\").textContent=k.I.toFixed(2)+\" A\";\n  $(\"#f3\").innerHTML=`R = R₀(1 + α·ΔT) = ${k.m.R0}·(1 + ${k.m.a}·${dT}) = <b>${k.Rv.toFixed(1)} Ω<\/b><br>I = U/R = ${this.U}/${k.Rv.toFixed(1)} = <b style=\"color:var(--cur)\">${k.I.toFixed(2)} A<\/b>`;\n  this.graph(k)},\n graph(k){ // R(T) grafigi\n  const x=fit(this.g,640,260);if(!x)return;\n  const L=60,Rr=620,Tp=15,B=220,m=k.m,R500=m.R0*(1+m.a*500),ym=Math.ceil(R500/10)*10;\n  const X=t=>L+t/500*(Rr-L),Y=r=>B-r/ym*(B-Tp);\n  x.strokeStyle=K.bd;x.fillStyle=K.mu;x.lineWidth=1;x.font=\"13px system-ui\";x.textAlign=\"center\";\n  for(let t=0;t<=500;t+=100){x.beginPath();x.moveTo(X(t),Tp);x.lineTo(X(t),B);x.stroke();x.fillText(t,X(t),B+16)}\n  x.textAlign=\"right\";for(let i=0;i<=4;i++){const r=ym*i/4;x.beginPath();x.moveTo(L,Y(r));x.lineTo(Rr,Y(r));x.stroke();x.fillText(Math.round(r),L-6,Y(r)+4)}\n  x.strokeStyle=K.tx;x.lineWidth=2;x.beginPath();x.moveTo(L,Tp);x.lineTo(L,B);x.lineTo(Rr,B);x.stroke();\n  txt(x,\"T, °C\",Rr-20,B+34,K.tx,13);txt(x,\"R, Ω\",L+14,Tp+2,K.tx,13);\n  x.strokeStyle=K.ion;x.lineWidth=3;x.beginPath();x.moveTo(X(0),Y(m.R0));x.lineTo(X(500),Y(R500));x.stroke();\n  x.setLineDash([5,4]);x.strokeStyle=K.cur;x.lineWidth=1.5;x.beginPath();x.moveTo(X(this.T),B);x.lineTo(X(this.T),Y(k.Rv));x.lineTo(L,Y(k.Rv));x.stroke();x.setLineDash([]);\n  dot(x,X(this.T),Y(k.Rv),7,K.cur)}};\n$(\"#t3\").oninput=e=>{S3.T=+e.target.value;$(\"#tv3\").textContent=e.target.value};\ndocument.querySelectorAll(\"#mat button\").forEach(b=>b.onclick=()=>{S3.m=b.dataset.m;document.querySelectorAll(\"#mat button\").forEach(o=>o.classList.toggle(\"on\",o===b))});\n\n/* ================= Boshlash/Toʻxtatish va Qayta boshlash ================= */\nconst sims=[S1,S2,S3];\ndocument.querySelectorAll(\"[data-run]\").forEach(b=>b.onclick=()=>{const s=sims[b.dataset.run];s.run=!s.run;b.textContent=s.run?\"Toʻxtatish\":\"Boshlash\"});\ndocument.querySelectorAll(\"[data-reset]\").forEach(b=>b.onclick=()=>{const i=b.dataset.reset;sims[i].reset();sims[i].run=true;document.querySelector(`[data-run=\"${i}\"]`).textContent=\"Toʻxtatish\"});\nsims.forEach(s=>{s.reset();s.tm=s.tm||0});\n\n/* ================= Tablar va navigatsiya ================= */\nconst names=[\"1. Oʻtkazuvchanlik\",\"2. Tok hosil boʻlishi\",\"3. Qarshilik\",\"4. Xulosa va test\"];\nlet cur=0;\nnames.forEach((n,i)=>{const b=document.createElement(\"button\");b.textContent=n;b.onclick=()=>show(i);$(\"#tabs\").append(b)});\nfunction show(i){cur=i;document.querySelectorAll(\".sec\").forEach((s,j)=>s.classList.toggle(\"on\",j===i));\n [...$(\"#tabs\").children].forEach((b,j)=>b.classList.toggle(\"on\",j===i));\n $(\"#prev\").disabled=i===0;$(\"#next\").disabled=i===3;window.scrollTo({top:0,behavior:\"smooth\"})}\n$(\"#prev\").onclick=()=>show(cur-1);$(\"#next\").onclick=()=>show(cur+1);\n\n/* ================= Savollar ================= */\nfunction quiz(el,items,sc){let ok=0,done=0;\n items.forEach((q,qi)=>{const d=document.createElement(\"div\");d.className=\"q\";\n  d.innerHTML=`<p><b style=\"color:inherit\">${qi+1}. ${q.q}<\/b><\/p>`+q.o.map((t,i)=>`<label><input type=\"radio\" name=\"${el.id}_${qi}\" value=\"${i}\"> ${t}<\/label>`).join(\"\")+`<button class=\"btn\">Javobni tekshirish<\/button><p class=\"fb\"><\/p>`;\n  const fb=d.querySelector(\".fb\");\n  d.querySelector(\"button\").onclick=()=>{const s=d.querySelector(\"input:checked\");\n   if(!s){fb.className=\"fb\";fb.textContent=\"Avval javobni tanlang.\";return}\n   const good=+s.value===q.a;fb.className=\"fb \"+(good?\"ok\":\"no\");fb.textContent=(good?\"Toʻgʻri! \":\"Notoʻgʻri. \")+q.e;\n   if(sc&&!d.dataset.done){d.dataset.done=1;done++;if(good)ok++;sc.textContent=`Natija: ${ok} / ${items.length} (javob berilgan: ${done})`}};\n  el.append(d)})}\nquiz($(\"#q0\"),[\n {q:\"Qaysi moddada erkin elektronlar koʻp?\",o:[\"Mis\",\"Shisha\",\"Plastmassa\"],a:0,e:\"Metallarda erkin elektronlar koʻp, shuning uchun ular tokni yaxshi oʻtkazadi.\"},\n {q:\"Elektr toki nima?\",o:[\"Zarralarning xaotik harakati\",\"Zaryadli zarralarning tartibli harakati\",\"Atomlarning tebranishi\"],a:1,e:\"Elektr toki — zaryadli zarralarning tartibli (yoʻnalgan) harakati.\"}]);\nquiz($(\"#q1\"),[\n {q:\"Metallarda tokni hosil qiluvchi zarralar qaysilar?\",o:[\"Neytronlar\",\"Musbat ionlar\",\"Erkin elektronlar\"],a:2,e:\"Ionlar panjara tugunlarida qoladi, tokni erkin elektronlar hosil qiladi.\"},\n {q:\"Elektronlar harakat yoʻnalishi shartli tok yoʻnalishiga nisbatan qanday?\",o:[\"Qarama-qarshi\",\"Bir xil\",\"Tok yoʻnalishi yoʻq\"],a:0,e:\"Shartli tok + dan −ga, elektronlar esa − dan +ga harakatlanadi.\"}]);\nquiz($(\"#q2\"),[\n {q:\"Metall qizdirilsa, uning qarshiligi qanday oʻzgaradi?\",o:[\"Kamayadi\",\"Oʻzgarmaydi\",\"Ortadi\"],a:2,e:\"Ionlar kuchli tebranadi, toʻqnashuvlar koʻpayadi, R ortadi.\"},\n {q:\"U = 12 V, R = 4 Ω boʻlsa, tok kuchi qancha?\",o:[\"48 A\",\"3 A\",\"0,33 A\"],a:1,e:\"I = U/R = 12/4 = 3 A.\"}]);\nquiz($(\"#q3\"),[\n {q:\"Elektr tokining shartli yoʻnalishi qanday qabul qilingan?\",o:[\"Manfiy qutbdan musbat qutbga\",\"Musbat qutbdan manfiy qutbga\",\"Tok yoʻnalishi yoʻq\"],a:1,e:\"Shartli yoʻnalish: + dan −ga. Elektronlar esa aksincha harakatlanadi.\"},\n {q:\"Dreyf tezligi nima?\",o:[\"Elektronlarning issiqlik harakati tezligi\",\"Elektr maydon ta’sirida tartibli harakatning oʻrtacha tezligi\",\"Yorugʻlik tezligi\"],a:1,e:\"Dreyf tezligi — tartibli siljishning juda kichik oʻrtacha tezligi (mm/s tartibida).\"},\n {q:\"Temir sim 0 °C da 25 Ω, α = 0,006 1/°C. 100 °C da R = ?\",o:[\"25 Ω\",\"40 Ω\",\"15 Ω\"],a:1,e:\"R = 25·(1 + 0,006·100) = 25·1,6 = 40 Ω.\"}],$(\"#score\"));\n\n/* ================= Asosiy sikl (requestAnimationFrame) ================= */\nlet last=performance.now();\nfunction loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;th();\n if(cur<3){const s=sims[cur];if(s.run)s.update(dt);const x=fit(s.c,s.W,s.H);if(x)s.draw(x)}\n requestAnimationFrame(loop)}\nshow(0);requestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>\n"}, {"t": "Suyuqliklarda elektr toki", "i": "💧", "h": "<!doctype html>\n<html lang=\"uz\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Suyuqliklarda elektr toki<\/title>\n<style>\n:root{--bg:#f4f7fb;--card:#fff;--tx:#14202e;--mu:#5a6b7d;--ac:#0b6bcb;--bd:#d9e2ec;--r:#e53935;--b:#1e88e5;--ok:#2e7d32;--no:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1620;--card:#172230;--tx:#e8eef5;--mu:#9fb0c2;--ac:#5aa9ff;--bd:#2a3a4c}}\n:root[data-theme=dark]{--bg:#0e1620;--card:#172230;--tx:#e8eef5;--mu:#9fb0c2;--ac:#5aa9ff;--bd:#2a3a4c}\n*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nheader{padding:18px 16px 8px;max-width:900px;margin:auto}h1{font-size:1.5rem;margin:0}header p{color:var(--mu);margin:4px 0}\nnav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:900px;margin:auto}\nnav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}\nnav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}\nmain{max-width:900px;margin:auto;padding:0 16px 40px}section{display:none}section.on{display:block}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:12px 0}\nh2{font-size:1.25rem;margin:.6em 0}h3{font-size:1.05rem;margin:0 0 6px;color:var(--ac)}\ndt{font-weight:600}dd{margin:0 0 6px 0;color:var(--mu)}.f{font-family:Georgia,serif;font-size:1.1rem;text-align:center;background:var(--bg);border-radius:8px;padding:6px;margin:8px 0}\ncanvas{width:100%;height:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;display:block}\n.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:8px 0}.row label{flex:1 1 220px;font-size:.92rem}\ninput[type=range]{width:100%}.out{font-weight:600;background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 0}\n.btn,.card button.b{border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer}\nselect{font:inherit;padding:6px;border-radius:8px;background:var(--card);color:var(--tx);border:1px solid var(--bd)}\n.cap{min-height:3em;font-weight:600}.red{color:var(--r)}.blue{color:var(--b)}\n.q button.o{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}\n.q .ok{border-color:var(--ok);background:rgba(46,125,50,.18)}.q .no{border-color:var(--no);background:rgba(198,40,40,.18)}.ex{color:var(--mu);font-size:.93rem;margin-top:4px}\ndetails{margin:6px 0}summary{cursor:pointer;color:var(--ac);font-weight:600}ul{padding-left:20px;margin:4px 0}\n<\/style><\/head><body>\n<header><h1>⚡ Suyuqliklarda elektr toki<\/h1><p>Fizika, 9–11-sinf · nazariya, simulyatsiya, animatsiya, mustahkamlash<\/p><\/header>\n<nav id=\"nav\"><button data-t=\"s1\" class=\"on\">1. Tok hosil bo‘lishi<\/button><button data-t=\"s2\">2. Elektrolitlar<\/button><button data-t=\"s3\">3. Elektroliz<\/button><button data-t=\"s4\">Mustahkamlash<\/button><button data-t=\"s5\">Xulosa<\/button><\/nav>\n<main>\n\n<section id=\"s1\" class=\"on\">\n<h2>1. Suyuqliklarda elektr toki va uning hosil bo‘lishi<\/h2>\n<div class=\"card\"><h3>A) Nazariya<\/h3><dl>\n<dt>Dielektrik suyuqlik<\/dt><dd>Erkin zaryad tashuvchilari deyarli yo‘q, tok o‘tkazmaydi: distillangan suv, kerosin, transformator moyi.<\/dd>\n<dt>O‘tkazuvchi suyuqlik<\/dt><dd>Erkin zaryadli zarralari bor: suyuq metallar (simob — tok tashuvchi erkin elektronlar) va elektrolitlar (tok tashuvchi ionlar).<\/dd>\n<dt>Ion<\/dt><dd>Elektron yo‘qotgan yoki biriktirgan zaryadli atom (yoki atomlar guruhi): Na⁺, Cl⁻, Cu²⁺, SO₄²⁻.<\/dd>\n<dt>Elektrolitik dissotsiatsiya<\/dt><dd>Modda molekulalarining erituvchi ta’sirida ionlarga ajralishi: NaCl → Na⁺ + Cl⁻. Suvning dielektrik singdiruvchanligi ε ≈ 81, shuning uchun ionlar orasidagi tortishish kuchi taxminan 81 marta kamayadi va ular ajralib ketadi.<\/dd>\n<dt>Elektr toki<\/dt><dd>Zaryadli zarralarning elektr maydon ta’sirida tartibli harakati. Buning uchun erkin zaryadlar va elektr maydon kerak.<\/dd><\/dl>\n<p><b>Hayotiy misol:<\/b> quruq osh tuzi tok o‘tkazmaydi, tuzli suv o‘tkazadi. Nam qo‘l (ter tarkibida tuz bor) bilan elektr asbobiga tegish xavfli.<\/p>\n<div class=\"f\">R = U / I &nbsp; (U — kuchlanish, V; I — tok kuchi, A; R — qarshilik, Ω)<\/div>\n<p><b>Masala.<\/b> Tuzli suvli idish 12 V ga ulanganda ampermetr 24 mA ko‘rsatdi. Qarshilikni toping.<br>\n<i>Yechim:<\/i> I = 24 mA = 0,024 A; R = 12 / 0,024 = <b>500 Ω<\/b>.<\/p><\/div>\n<div class=\"card\"><h3>B) Simulyatsiya: o‘tkazuvchanlikni solishtirish (U = 12 V)<\/h3>\n<canvas id=\"c1\"><\/canvas>\n<div class=\"row\"><label>Tuz konsentratsiyasi: <b id=\"v1\">8<\/b> % <input id=\"s1c\" type=\"range\" min=\"0\" max=\"20\" step=\"1\" value=\"8\"><\/label><\/div>\n<div class=\"out\" id=\"s1o\"><\/div>\n<p class=\"ex\">Model sifat jihatidan to‘g‘ri: ionlar soni ortsa tok ortadi, ammo katta konsentratsiyada ionlar o‘zaro to‘sqinlik qilib, o‘sish sekinlashadi.<\/p><\/div>\n<div class=\"card\"><h3>C) Animatsiya: dissotsiatsiya<\/h3><div id=\"an1\"><\/div><\/div>\n<\/section>\n\n<section id=\"s2\">\n<h2>2. Elektrolitlar va ularda tok o‘tkazish mexanizmi<\/h2>\n<div class=\"card\"><h3>A) Nazariya<\/h3>\n<p><b>Elektrolitlar<\/b> — suvli eritmada yoki suyuqlanmada ionlarga ajraladigan moddalar: kislotalar, ishqorlar, tuzlar.<\/p>\n<ul><li>Maydon yo‘q: ionlar faqat tartibsiz issiqlik harakatida.<\/li>\n<li>Maydon bor: <span class=\"red\">musbat ionlar (kationlar)<\/span> katodga (−), <span class=\"blue\">manfiy ionlar (anionlar)<\/span> anodga (+) tomon siljiydi.<\/li>\n<li>Elektrodlarda ionlar neytrallanadi; tashqi zanjirda tokni elektronlar tashiydi.<\/li>\n<li>Harorat ortsa, suyuqlik yopishqoqligi kamayadi, ionlar tezlashadi — <b>elektrolit qarshiligi kamayadi<\/b> (metallarda esa ortadi).<\/li><\/ul>\n<div class=\"f\">v = u · E, &nbsp; E = U / L<\/div>\n<p>v — ionning siljish tezligi (m/s); u — ion harakatchanligi (m²/(V·s)); E — maydon kuchlanganligi (V/m); U — kuchlanish (V); L — elektrodlar orasidagi masofa (m). 25 °C da: u(Na⁺) = 5,19·10⁻⁸, u(Cl⁻) = 7,91·10⁻⁸ m²/(V·s).<\/p>\n<p><b>Masala.<\/b> NaCl eritmasida U = 20 V, L = 10 cm. Na⁺ siljish tezligini toping.<br><i>Yechim:<\/i> E = 20/0,1 = 200 V/m; v = 5,19·10⁻⁸·200 ≈ 1,04·10⁻⁵ m/s ≈ <b>10,4 µm/s<\/b> (juda sekin!).<\/p><\/div>\n<div class=\"card\"><h3>B) Simulyatsiya: ionlar elektr maydonida<\/h3>\n<canvas id=\"c2\"><\/canvas>\n<div class=\"row\"><label>Kuchlanish: <b id=\"v2u\">10<\/b> V <input id=\"s2u\" type=\"range\" min=\"0\" max=\"50\" value=\"10\"><\/label>\n<label>Harorat: <b id=\"v2t\">25<\/b> °C <input id=\"s2t\" type=\"range\" min=\"5\" max=\"80\" value=\"25\"><\/label><\/div>\n<div class=\"out\" id=\"s2o\"><\/div>\n<p class=\"ex\">L = 10 cm, u harorat bilan taxminan 2 %/°C ortadi deb olingan. Elektrodda neytrallangan ion o‘rnida yangisi paydo bo‘ladi (konsentratsiya o‘zgarmas modeli). Ekranda tezlik ko‘rinish uchun oshirilgan.<\/p><\/div>\n<div class=\"card\"><h3>C) Animatsiya: yo‘nalishli harakat<\/h3><div id=\"an2\"><\/div><\/div>\n<\/section>\n\n<section id=\"s3\">\n<h2>3. Elektroliz hodisasi va uning amaliy ahamiyati<\/h2>\n<div class=\"card\"><h3>A) Nazariya<\/h3>\n<p><b>Elektroliz<\/b> — elektrolitdan tok o‘tganda elektrodlarda moddalar ajralib chiqishi (oksidlanish-qaytarilish jarayoni). <b>Elektrod<\/b> — elektrolitga tushirilgan o‘tkazgich. <b>Anod<\/b> — musbat (+), <b>katod<\/b> — manfiy (−) elektrod.<\/p>\n<p>CuSO₄ eritmasi, mis elektrodlar: katodda Cu²⁺ + 2e⁻ → Cu (mis cho‘kadi); anodda Cu − 2e⁻ → Cu²⁺ (mis eriydi).<\/p>\n<div class=\"f\">m = k · I · t &nbsp;(1-qonun) &nbsp;&nbsp; k = (1/F)(M/n) &nbsp;(2-qonun)<br>m = (1/F)(M/n)·I·t<\/div>\n<p>m — ajralgan modda massasi (kg yoki g); k — elektrokimyoviy ekvivalent (kg/C); I — tok kuchi (A); t — vaqt (s); F ≈ 96485 C/mol — Faradey doimiysi; M — molyar massa (kg/mol yoki g/mol); n — valentlik (bitta ion tashiydigan elementar zaryadlar soni). Mis uchun k = 63,5/(2·96485) ≈ 3,29·10⁻⁴ g/C.<\/p>\n<p><b>Masala.<\/b> Cu uchun I = 2 A, t = 30 min. Katodda necha gramm mis ajraladi?<br><i>Yechim:<\/i> t = 1800 s; m = 3,29·10⁻⁴ · 2 · 1800 ≈ <b>1,18 g<\/b>.<\/p>\n<h3>Amaliy ahamiyati<\/h3><ul>\n<li><b>Galvanostegiya<\/b> — buyumni (katod) yupqa metall qatlam bilan qoplash: <b>xrom, nikel<\/b>, sink, oltin; korroziya va yeyilishdan himoya, bezak.<\/li>\n<li><b>Galvanoplastika<\/b> — buyumning relyefli metall nusxasini olish (matritsa, haykal, bosma klishe); 1838-yilda M. Yakobi ixtiro qilgan.<\/li>\n<li><b>Rafinirlash<\/b> — qo‘pol misni tozalash: qo‘pol mis anod, toza mis katod; ~99,99 % mis olinadi.<\/li>\n<li><b>Alyuminiy olish<\/b> — Al₂O₃ ning kriolitdagi suyuqlanmasi (~950 °C) elektrolizi; suvli eritmadan Al ajralmaydi.<\/li>\n<li><b>Akkumulyatorlar<\/b> — zaryadlashda elektroliz, razryadda kimyoviy energiya elektr energiyaga aylanadi. Qo‘rg‘oshinli akkumulyator (avtomobil, zaxira quvvat): har bir element ≈2 V, 6 ta ≈12 V; litiy-ionli (telefon, noutbuk, elektromobil).<\/li><\/ul><\/div>\n<div class=\"card\"><h3>B) Simulyatsiya: CuSO₄ elektrolizi<\/h3>\n<canvas id=\"c3\"><\/canvas>\n<div class=\"row\"><label>Tok kuchi: <b id=\"v3i\">2<\/b> A <input id=\"s3i\" type=\"range\" min=\"0.1\" max=\"5\" step=\"0.1\" value=\"2\"><\/label>\n<label>Vaqt: <b id=\"v3t\">20<\/b> min <input id=\"s3t\" type=\"range\" min=\"0\" max=\"60\" step=\"1\" value=\"20\"><\/label><\/div>\n<div class=\"row\"><button class=\"b\" id=\"s3p\">▶ Vaqtni yurgizish (1 s = 1 min)<\/button><button class=\"b\" id=\"s3r\">↻ Nolga<\/button><\/div>\n<div class=\"out\" id=\"s3o\"><\/div><canvas id=\"c3g\"><\/canvas><\/div>\n<div class=\"card\"><h3>C) Animatsiya: elektrodlarda neytrallanish<\/h3><div id=\"an3\"><\/div><\/div>\n<\/section>\n\n<section id=\"s4\"><h2>Mustahkamlash<\/h2>\n<div class=\"card\"><h3>5 ta test<\/h3><div id=\"quiz\"><\/div><div class=\"out\" id=\"score\">To‘g‘ri javoblar: 0 / 5<\/div><\/div>\n<div class=\"card\"><h3>Hisoblash masalalari<\/h3>\n<p><b>1.<\/b> Mis sulfat eritmasidan I = 4 A tok 45 min o‘tdi. Katodda qancha mis ajraladi? (k = 3,29·10⁻⁴ g/C)<\/p>\n<details><summary>Yechim<\/summary>t = 2700 s; m = kIt = 3,29·10⁻⁴·4·2700 ≈ <b>3,55 g<\/b>.<\/details>\n<p><b>2.<\/b> Yuzasi 200 cm² bo‘lgan buyum nikellanmoqda: I = 5 A, t = 1 soat. Qatlam qalinligini toping (M = 58,7 g/mol, n = 2, ρ = 8,9 g/cm³; tok unumi 100 %).<\/p>\n<details><summary>Yechim<\/summary>k = 58,7/(2·96485) ≈ 3,04·10⁻⁴ g/C; m = 3,04·10⁻⁴·5·3600 ≈ 5,48 g; V = m/ρ ≈ 0,615 cm³; h = V/S ≈ 0,00308 cm ≈ <b>31 µm<\/b>.<\/details><\/div>\n<div class=\"card\"><h3>Mulohaza yuritish<\/h3>\n<p>Nima uchun harorat ortganda metall o‘tkazgichning qarshiligi ortadi, elektrolitniki esa kamayadi?<\/p>\n<details><summary>Namunaviy javob<\/summary>Metallda tok tashuvchilar soni deyarli o‘zgarmaydi, ammo kristall panjara ionlarining tebranishi kuchayib, elektronlar sochilishi ortadi. Elektrolitda isitilganda yopishqoqlik kamayadi (ionlar tezroq harakatlanadi) va dissotsiatsiya kuchayadi, shuning uchun qarshilik kamayadi.<\/details><\/div><\/section>\n\n<section id=\"s5\"><h2>Xulosa<\/h2>\n<div class=\"card\"><ul><li>Suyuqlik tok o‘tkazishi uchun erkin zaryadlar kerak: elektrolitlarda ular ionlar, suyuq metallarda elektronlar.<\/li>\n<li>Elektrolitik dissotsiatsiya natijasida ionlar hosil bo‘ladi; maydonda kationlar katodga, anionlar anodga siljiydi.<\/li>\n<li>Elektrolizda ajralgan massa m = kIt = (1/F)(M/n)It formulasi bilan topiladi.<\/li>\n<li>Elektroliz galvanostegiya, galvanoplastika, rafinirlash, alyuminiy olish va akkumulyatorlarda qo‘llanadi.<\/li><\/ul><\/div>\n<div class=\"card\"><h3>Adabiyotlar<\/h3><ul>\n<li>Fizika darsliklari, 9–11-sinf (Xalq ta’limi vazirligi tasdiqlagan nashrlar; maktabdagi joriy nashrni tekshiring).<\/li>\n<li>Sivuxin D. V. Umumiy fizika kursi, 3-tom: Elektr.<\/li>\n<li>Halliday D., Resnick R., Walker J. Fundamentals of Physics.<\/li>\n<li>Atkins P., de Paula J. Physical Chemistry (ion harakatchanligi, elektroliz).<\/li>\n<li>NIST/CODATA: Faradey doimiysi F = 96485,33 C/mol.<\/li><\/ul><\/div><\/section>\n<\/main>\n<script>\n/* ===== Umumiy yordamchilar ===== */\nconst $=s=>document.querySelector(s),W=600,H=300,R='#e53935',B='#1e88e5',CU='#d98a3d';\nconst clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),ease=q=>q*q*(3-2*q);\nlet seed=7;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;\nconst th={};function readTheme(){const s=getComputedStyle(document.documentElement);['tx','mu','card','bd'].forEach(k=>th[k]=s.getPropertyValue('--'+k).trim())}\nconst loop=[];let last=0;\nfunction reg(id,fn,h=H){const c=$('#'+id);c.width=W;c.height=h;loop.push({c,g:c.getContext('2d'),fn})}\nfunction frame(t){const dt=Math.min(.1,(t-last)/1000||0);last=t;readTheme();loop.forEach(f=>f.c.offsetParent&&f.fn(f.g,dt));requestAnimationFrame(frame)}\nfunction ion(g,x,y,s,r=9,lab){g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=s>0?R:B;g.fill();g.fillStyle='#fff';g.font='bold 10px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(lab||(s>0?'+':'−'),x,y+.5)}\nfunction beaker(g,x,y,w,h){g.fillStyle='rgba(80,170,230,.18)';g.fillRect(x,y+20,w,h-20);g.strokeStyle=th.mu;g.lineWidth=3;g.beginPath();g.moveTo(x,y);g.lineTo(x,y+h);g.lineTo(x+w,y+h);g.lineTo(x+w,y);g.stroke()}\nfunction txt(g,s,x,y,col,sz=13,al='center'){g.fillStyle=col||th.tx;g.font=sz+'px sans-serif';g.textAlign=al;g.textBaseline='middle';g.fillText(s,x,y)}\nfunction plates(g,xc,xa,y0=30,y1=270){g.fillStyle='#7d8791';g.fillRect(xc-6,y0,12,y1-y0);g.fillRect(xa-6,y0,12,y1-y0);txt(g,'Katod (−)',xc+10,16,B,13);txt(g,'Anod (+)',xa-10,16,R,13)}\nfunction bind(id,out,f=v=>v){const e=$('#'+id);const u=()=>$('#'+out).textContent=f(e.value);e.addEventListener('input',u);u();return e}\n$('#nav').onclick=e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll('section,nav button').forEach(x=>x.classList.remove('on'));$('#'+t).classList.add('on');e.target.classList.add('on')};\n\n/* ===== 1-simulyatsiya: o‘tkazuvchanlik ===== */\n(()=>{const cs=bind('s1c','v1');let P=[];\nconst build=()=>{P=[];for(let i=0;i<Math.round(cs.value*3);i++)P.push({x:370+rnd()*170,y:150+rnd()*100,s:i%2?1:-1})};cs.addEventListener('input',build);build();\nconst pair=(g,x,I,lab)=>{beaker(g,x,110,210,160);g.fillStyle='#7d8791';g.fillRect(x+36,60,8,150);g.fillRect(x+166,60,8,150);\ng.strokeStyle=th.tx;g.lineWidth=2;g.beginPath();g.moveTo(x+40,60);g.lineTo(x+40,40);g.lineTo(x+88,40);g.moveTo(x+170,60);g.lineTo(x+170,40);g.lineTo(x+122,40);g.stroke();\ng.beginPath();g.arc(x+105,40,17,0,7);g.fillStyle='rgba(255,210,0,'+clamp(I/120)+')';g.fill();g.stroke();txt(g,lab,x+105,288,th.tx,13)};\nreg('c1',g=>{g.clearRect(0,0,W,H);const c=+cs.value,I=.01+14*c/(1+c/30);\npair(g,40,.01,'Distillangan suv');pair(g,350,I,'Tuzli suv');\nP.forEach(p=>{p.x=clamp(p.x+(Math.random()-.5)*3,356,544);p.y=clamp(p.y+(Math.random()-.5)*3,140,262);ion(g,p.x,p.y,p.s,7)});\n$('#s1o').innerHTML='Distillangan suv: I ≈ 0,01 mA &nbsp;|&nbsp; Tuzli suv: I ≈ '+I.toFixed(1)+' mA <span class=\"red\">(Na⁺)<\/span> <span class=\"blue\">(Cl⁻)<\/span>'})})();\n\n/* ===== 2-simulyatsiya: ionlar maydonda ===== */\n(()=>{const su=bind('s2u','v2u'),st=bind('s2t','v2t');const P=[];\nfor(let i=0;i<30;i++)P.push({x:60+rnd()*480,y:30+rnd()*240,s:i%2?1:-1});\nreg('c2',g=>{g.clearRect(0,0,W,H);plates(g,30,570);const U=+su.value,T=+st.value,f=1+.02*(T-25),E=U/.1;\nconst vNa=5.19e-8*f*E*1e6,vCl=7.91e-8*f*E*1e6,amp=1.2*Math.sqrt((T+273)/298);\nP.forEach(p=>{const v=(p.s>0?vNa:vCl)*.35;p.x+=(p.s>0?-v:v)+(Math.random()-.5)*amp*2;p.y=clamp(p.y+(Math.random()-.5)*amp*2,25,275);\nif(p.x<45)p.x=555;if(p.x>555)p.x=45;ion(g,p.x,p.y,p.s,8,p.s>0?'Na⁺':'Cl⁻')});\ng.strokeStyle=th.mu;g.beginPath();g.moveTo(200,290);g.lineTo(400,290);g.lineTo(390,285);g.moveTo(400,290);g.lineTo(390,295);g.stroke();txt(g,'E maydon yo‘nalishi: anoddan katodga',300,278,th.mu,11);\n$('#s2o').innerHTML='E = '+E.toFixed(0)+' V/m &nbsp; <span class=\"red\">v(Na⁺) = '+vNa.toFixed(1)+' µm/s<\/span> &nbsp; <span class=\"blue\">v(Cl⁻) = '+vCl.toFixed(1)+' µm/s<\/span>'})})();\n\n/* ===== 3-simulyatsiya: CuSO4 elektrolizi ===== */\n(()=>{const si=bind('s3i','v3i'),stt=bind('s3t','v3t');const K=63.5/(2*96485);let run=false,acc=0;const P=[];\nfor(let i=0;i<24;i++)P.push({x:90+rnd()*420,y:60+rnd()*190,s:i%2?1:-1});\n$('#s3p').onclick=function(){run=!run;this.textContent=run?'⏸ Pauza':'▶ Vaqtni yurgizish (1 s = 1 min)'};\n$('#s3r').onclick=()=>{stt.value=0;stt.dispatchEvent(new Event('input'))};\nreg('c3',(g,dt)=>{if(run){acc+=dt;if(acc>=1){acc=0;stt.value=Math.min(60,+stt.value+1);stt.dispatchEvent(new Event('input'));if(+stt.value>=60)$('#s3p').click()}}\ng.clearRect(0,0,W,H);const I=+si.value,t=+stt.value,m=K*I*t*60;beaker(g,40,40,520,240);\ng.fillStyle='#7d8791';g.fillRect(70,60,12,190);g.fillRect(518,60,12,190);\ng.fillStyle=CU;g.fillRect(82,60,Math.min(40,m*7),190);g.fillRect(518+0,60,0,0);\ntxt(g,'Katod (−)',76,50,B,13);txt(g,'Anod (+)',524,50,R,13);txt(g,'CuSO₄ eritmasi',300,268,th.mu,12);\nP.forEach(p=>{const v=I*.5,w=2*I;p.x+=(p.s>0?-v:v)+(Math.random()-.5)*1.5;p.y=clamp(p.y+(Math.random()-.5)*1.5,70,245);\nconst l=82+Math.min(40,m*7)+8;if(p.x<l)p.x=505;if(p.x>505)p.x=l;ion(g,p.x,p.y,p.s,9,p.s>0?'Cu²⁺':'SO₄²⁻')});\n$('#s3o').innerHTML='Q = It = '+(I*t*60).toFixed(0)+' C &nbsp; <span style=\"color:'+CU+'\">m = kIt = '+m.toFixed(3)+' g<\/span> &nbsp; (k = '+(K*1e4).toFixed(2)+'·10⁻⁴ g/C)'});\nreg('c3g',g=>{g.clearRect(0,0,W,240);const I=+si.value,t=+stt.value,x0=60,y0=205,gw=510,gh=180,ym=6;\ng.strokeStyle=th.mu;g.lineWidth=1;g.beginPath();g.moveTo(x0,15);g.lineTo(x0,y0);g.lineTo(x0+gw,y0);g.stroke();\nfor(let i=0;i<=6;i++){const y=y0-i*gh/6;txt(g,i,x0-8,y,th.mu,11,'right');g.strokeStyle=th.bd;g.beginPath();g.moveTo(x0,y);g.lineTo(x0+gw,y);g.stroke()}\nfor(let i=0;i<=60;i+=10)txt(g,i,x0+i/60*gw,y0+12,th.mu,11);\ntxt(g,'t, min',x0+gw-10,y0+28,th.mu,12);txt(g,'m, g',24,10,th.mu,12);\ng.strokeStyle=CU;g.lineWidth=3;g.beginPath();g.moveTo(x0,y0);g.lineTo(x0+gw,y0-K*I*3600/ym*gh);g.stroke();\nconst px=x0+t/60*gw,py=y0-K*I*t*60/ym*gh;g.fillStyle=R;g.beginPath();g.arc(px,py,6,0,7);g.fill();txt(g,'m = kIt (to‘g‘ri proporsionallik)',x0+gw/2,30,th.tx,12)},240)})();\n\n/* ===== Animatsiya moduli: pauza, qayta boshlash, tezlik ===== */\nfunction mkAnim(box,draw,caps,dur){const el=$('#'+box);el.innerHTML='<canvas><\/canvas><p class=\"cap\"><\/p><div class=\"row\"><button class=\"b\">▶ Boshlash<\/button><button class=\"b\">↻ Qayta<\/button><label style=\"flex:0 0 auto\">Tezlik <select><option value=\".5\">0,5×<\/option><option value=\"1\" selected>1×<\/option><option value=\"2\">2×<\/option><\/select><\/label><\/div>';\nconst c=el.querySelector('canvas'),cap=el.querySelector('.cap'),[bp,br]=el.querySelectorAll('button'),sp=el.querySelector('select');let p=0,on=false;\nc.id=box+'c';const sync=()=>bp.textContent=on?'⏸ Pauza':(p>=1?'✔ Tugadi':'▶ '+(p>0?'Davom':'Boshlash'));\nbp.onclick=()=>{if(p>=1)p=0;on=!on;sync()};br.onclick=()=>{p=0;on=true;sync()};\nreg(box+'c',(g,dt)=>{if(on){p+=dt/dur*sp.value;if(p>=1){p=1;on=false;sync()}}g.clearRect(0,0,W,H);draw(g,p);cap.textContent=caps[Math.min(caps.length-1,Math.floor(p*caps.length))]});}\nconst T0=[];for(let i=0;i<40;i++)T0.push([rnd(),rnd()]);\n/* 1: dissotsiatsiya */\nmkAnim('an1',(g,p)=>{beaker(g,40,20,520,260);const q=ease(clamp((p-.2)/.5));\nfor(let i=0;i<16;i++){const r=i>>2,c=i&3,s=(r+c)%2?1:-1,x0=262+c*26,y0=120+r*26,[a,b]=T0[i],x=x0+(60+a*480-x0)*q,y=y0+(50+b*200-y0)*q+(p>.7?Math.sin(p*40+i)*4:0);ion(g,x,y,s,10,s>0?'Na⁺':'Cl⁻')}\nif(p>.1)for(let i=20;i<32;i++)txt(g,'H₂O',60+T0[i][0]*480,40+T0[i][1]*230,'rgba(120,150,180,'+(.6)+')',11)},\n['1. NaCl kristalli: Na⁺ (qizil) va Cl⁻ (ko‘k) kristall panjarada joylashgan.','2. Qutbli suv molekulalari ionlarni tortib, panjaradan ajrata boshlaydi.','3. Erkin ionlar hosil bo‘ldi: NaCl → Na⁺ + Cl⁻ (elektrolitik dissotsiatsiya).'],12);\n/* 2: yo‘nalishli harakat */\nmkAnim('an2',(g,p)=>{plates(g,40,560);const q=ease(clamp((p-.25)/.65));\nfor(let i=0;i<16;i++){const s=i%2?1:-1,x0=80+T0[i][0]*440,y=40+T0[i][1]*220,x=s>0?x0-(x0-72)*q:x0+(528-x0)*q;ion(g,x+(q<1?Math.sin(p*30+i)*4:0),y+Math.cos(p*25+i)*3,s,9,s>0?'Na⁺':'Cl⁻')}\nif(p>.15){g.strokeStyle=th.mu;g.beginPath();g.moveTo(400,288);g.lineTo(200,288);g.stroke();txt(g,'E',300,276,th.mu,13)}},\n['1. Maydon yo‘q: ionlar tartibsiz issiqlik harakatida.','2. Manba ulandi: elektrodlar orasida E maydon hosil bo‘ldi.','3. Na⁺ katod (−) ga, Cl⁻ anod (+) ga yo‘nalgan harakatlanadi.'],12);\n/* 3: neytrallanish */\nmkAnim('an3',(g,p)=>{g.fillStyle='#7d8791';const dep=clamp((p-.65)/.3);g.fillRect(40,40,12,220);g.fillStyle=CU;g.fillRect(52,40,4+dep*16,220);\ng.fillStyle='#7d8791';g.fillRect(548,40,12,220);g.fillStyle=CU;g.fillRect(548-(dep*16),40,dep*16,220);\ntxt(g,'Katod (−)',56,26,B,13);txt(g,'Anod (+)',552,26,R,13);const q=ease(clamp((p-.1)/.5));\nfor(let i=0;i<14;i++){const s=i%2?1:-1,x0=100+T0[i][0]*400,y=50+T0[i][1]*200;\nif(s>0){const x=x0-(x0-(76+dep*0))*q;if(q<1)ion(g,x,y,1,10,'Cu²⁺');else if(dep<1){g.beginPath();g.arc(76,y,7,0,7);g.fillStyle=CU;g.fill()}}\nelse ion(g,x0+(500-x0)*q,y,-1,11,'SO₄²⁻')}\nif(p>.65)for(let i=0;i<4;i++)ion(g,520-(p-.65)*150+i*3,70+i*50,1,10,'Cu²⁺');\nif(p>.6)txt(g,p<.8?'Cu²⁺ + 2e⁻ → Cu':'Cu − 2e⁻ → Cu²⁺',300,285,th.tx,14)},\n['1. CuSO₄ → Cu²⁺ + SO₄²⁻: eritmada ionlar bor.','2. Maydon ta’sirida Cu²⁺ katodga, SO₄²⁻ anodga yo‘naladi.','3. Katodda: Cu²⁺ + 2e⁻ → Cu — mis atomlari cho‘kadi.','4. Anodda: Cu − 2e⁻ → Cu²⁺ — anod mis eriydi, eritma tarkibi saqlanadi.'],14);\n\n/* ===== Testlar ===== */\nconst QZ=[['Qaysi suyuqlik dielektrik hisoblanadi?',['Distillangan suv','Osh tuzi eritmasi','Sulfat kislota eritmasi','Mis kuporosi eritmasi'],0,'Toza suvda ionlar juda kam, shuning uchun u deyarli tok o‘tkazmaydi.'],\n['Elektrolitda elektr tokini nima tashiydi?',['Faqat elektronlar','Erkin ionlar','Neytral molekulalar','Neytronlar'],1,'Dissotsiatsiyadan hosil bo‘lgan musbat va manfiy ionlar tartibli harakatlanadi.'],\n['Harorat ortganda elektrolitning qarshiligi qanday o‘zgaradi?',['Ortadi','Kamayadi','O‘zgarmaydi','Avval ortadi, keyin yo‘qoladi'],1,'Yopishqoqlik kamayib, ionlar harakatchanligi ortadi (dissotsiatsiya ham kuchayadi).'],\n['Elektrolizda kationlar qaysi elektrodga boradi?',['Anodga','Katodga','Ikkalasiga teng','Hech biriga'],1,'Kationlar musbat, katod esa manfiy elektrod, shuning uchun ular katodga tortiladi.'],\n['I va t ikki baravar oshirilsa, ajralgan massa necha marta ortadi?',['2 marta','3 marta','4 marta','O‘zgarmaydi'],2,'m = kIt: 2 · 2 = 4 marta.']];\n(()=>{let sc=0;const box=$('#quiz');QZ.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.innerHTML='<p><b>'+(i+1)+'. '+q[0]+'<\/b><\/p>';let done=0;\nq[1].forEach((o,j)=>{const b=document.createElement('button');b.className='o';b.textContent=o;b.onclick=()=>{if(done)return;done=1;b.classList.add(j==q[2]?'ok':'no');d.querySelectorAll('.o')[q[2]].classList.add('ok');if(j==q[2])sc++;$('#score').textContent='To‘g‘ri javoblar: '+sc+' / 5';e.hidden=0};d.appendChild(b)});\nconst e=document.createElement('div');e.className='ex';e.hidden=1;e.textContent='Izoh: '+q[3];d.appendChild(e);box.appendChild(d)})})();\nrequestAnimationFrame(frame);\n<\/script><\/body><\/html>\n"}, {"t": "Elektroliz", "i": "🧪", "h": "<!DOCTYPE html>\n<html lang=\"uz\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Elektroliz – 8-sinf fizikasi<\/title>\n<style>\n:root{--bg:#f7f8fb;--cd:#fff;--tx:#1b2230;--mu:#5b6678;--bd:#dde2ec;--cu:#e07b00;--cl:#2e9e44;--pl:#d93636;--mn:#2f6fe0;--fa:#fff4d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#10141c;--cd:#1a202c;--tx:#eef1f7;--mu:#a3adc0;--bd:#2b3445;--cu:#ff9a2e;--cl:#4cc364;--pl:#ff6b6b;--mn:#6da2ff;--fa:#3a3016}}\n:root[data-theme=\"dark\"]{--bg:#10141c;--cd:#1a202c;--tx:#eef1f7;--mu:#a3adc0;--bd:#2b3445;--cu:#ff9a2e;--cl:#4cc364;--pl:#ff6b6b;--mn:#6da2ff;--fa:#3a3016}\n*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--tx);font:18px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}\nmain{max-width:640px;margin:0 auto;padding:12px 14px 90px}\nh1{font-size:22px;margin:6px 0}h2{font-size:21px;margin:4px 0 10px}h3{font-size:18px;margin:14px 0 6px}\n.dots{display:flex;gap:6px;margin:8px 0 14px}.dots i{flex:1;height:8px;border-radius:4px;background:var(--bd)}.dots i.on{background:var(--cu)}\n.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0}\n.fact{background:var(--fa);border:2px dashed var(--cu);border-radius:16px;padding:12px 14px;margin:14px 0}\n.fact b{color:var(--cu)}\n.f{font-size:24px;text-align:center;font-weight:700;margin:8px 0}\n.p{color:var(--pl);font-weight:700}.m{color:var(--mn);font-weight:700}.c{color:var(--cu);font-weight:700}.g{color:var(--cl);font-weight:700}\ncanvas{width:100%;height:auto;display:block;border-radius:12px;background:var(--cd);border:1px solid var(--bd)}\nlabel{display:block;font-weight:600;margin:10px 0 2px}input[type=range]{width:100%;height:36px;accent-color:var(--cu)}\nbutton{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--cu);color:#fff;min-height:48px;cursor:pointer}\nbutton.s{background:var(--bd);color:var(--tx)}\n.row{display:flex;gap:8px;flex-wrap:wrap}.row>button{flex:1}\n.out{background:var(--bg);border-radius:12px;padding:10px;margin-top:10px;font-weight:600}\n.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.grid .card{margin:0;padding:12px}.ic{font-size:30px}.grid p{margin:4px 0 0;font-size:16px}\n.nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center}\n.nav button{flex:1;max-width:300px}.nav button:disabled{opacity:.4}\n.sec{display:none}.sec.on{display:block}\n.q button{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);margin:6px 0}\n.q button.ok{border-color:var(--cl);background:rgba(46,158,68,.18)}.q button.no{border-color:var(--pl);background:rgba(217,54,54,.15)}\n.ex{font-size:16px;color:var(--mu);margin-top:4px}\nol li{margin:6px 0}\n<\/style><\/head><body><main>\n<h1>⚡ Elektroliz<\/h1>\n<div class=\"dots\" id=\"dots\"><i><\/i><i><\/i><i><\/i><\/div>\n\n<!-- 1 -->\n<section class=\"sec on\">\n<h2>1. Elektroliz hodisasi<\/h2>\n<div class=\"card\">\n<p><b>Elektrolit<\/b> – tuz, kislota yoki ishqorning suvdagi eritmasi. U tokni oʻtkazadi.<\/p>\n<p>Eritmada zaryadlangan zarralar bor. Ularni <b>ionlar<\/b> deymiz. <span class=\"p\">Musbat ion (+)<\/span> va <span class=\"m\">manfiy ion (−)<\/span> boʻladi.<\/p>\n<p>Eritmaga ikkita <b>elektrod<\/b> tushiriladi: <span class=\"p\">anod (+)<\/span> va <span class=\"m\">katod (−)<\/span>.<\/p>\n<p><span class=\"m\">Katod<\/span> musbat ionlarni tortadi. <span class=\"p\">Anod<\/span> manfiy ionlarni tortadi. Ionlar harakati – elektr toki!<\/p>\n<p>Elektrodlarda modda ajralib chiqadi. Bu hodisa – <b>elektroliz<\/b>.<\/p>\n<\/div>\n<div class=\"card\"><div class=\"f\">m = k · I · t<\/div>\n<p><b>m<\/b> – ajralgan modda massasi.<br><b>I<\/b> – tok kuchi (amper, A). Ionlar oqimi qanchalik kuchli.<br><b>t<\/b> – vaqt (sekund, s).<br><b>k<\/b> – elektrokimyoviy ekvivalent. Har modda uchun oʻz soni bor. Mis uchun k ≈ 0,33 mg/C.<\/p>\n<p class=\"ex\">Tok kuchi yoki vaqt 2 marta oshsa, massa ham 2 marta oshadi.<\/p><\/div>\n<h3>🔬 Simulyatsiya: CuCl₂ eritmasi<\/h3>\n<div class=\"card\">\n<canvas id=\"c1\"><\/canvas>\n<label>Tok kuchi I: <span id=\"v1i\">2,0<\/span> A<\/label><input type=\"range\" id=\"i1\" min=\"0.5\" max=\"5\" step=\"0.5\" value=\"2\">\n<label>Vaqt t: <span id=\"v1t\">30<\/span> daqiqa<\/label><input type=\"range\" id=\"t1\" min=\"5\" max=\"60\" step=\"5\" value=\"30\">\n<div class=\"row\" style=\"margin-top:8px\"><button id=\"b1\">▶ Boshlash<\/button><button class=\"s\" id=\"r1\">↺ Qaytadan<\/button><\/div>\n<div class=\"out\" id=\"o1\"><\/div>\n<p class=\"ex\"><span class=\"c\">●<\/span> Cu²⁺ ionlari katodga boradi va mis boʻlib yopishadi. <span class=\"g\">●<\/span> Cl⁻ ionlari anodga boradi, xlor (Cl₂) gazi pufakchalari chiqadi.<\/p>\n<\/div>\n<div class=\"fact\"><b>💡 Bilasizmi?<\/b> Elektroliz qonunini 1833-yilda ingliz olimi Maykl Faradey kashf etgan.<\/div>\n<\/section>\n\n<!-- 2 -->\n<section class=\"sec\">\n<h2>2. Turmushda elektroliz<\/h2>\n<div class=\"grid\">\n<div class=\"card\"><div class=\"ic\">🔧<\/div><b>Nikellash, xromlash<\/b><p>Buyum ustiga yupqa nikel yoki xrom qatlami yopishtiriladi. Yaltiraydi, zanglamaydi.<\/p><\/div>\n<div class=\"card\"><div class=\"ic\">💍<\/div><b>Kumush, oltin yuritish<\/b><p>Taqinchoq va qoshiqlar qimmat metall bilan yupqa qoplanadi.<\/p><\/div>\n<div class=\"card\"><div class=\"ic\">🗿<\/div><b>Galvanoplastika<\/b><p>Buyumning aniq nusxasi (relyef, haykalcha) metalldan olinadi.<\/p><\/div>\n<div class=\"card\"><div class=\"ic\">🛡️<\/div><b>Zangdan himoya<\/b><p>Temir sirti rux yoki xrom bilan qoplanadi. Zang urmaydi.<\/p><\/div>\n<div class=\"card\" style=\"grid-column:1/3\"><div class=\"ic\">🔋<\/div><b>Akkumulyatorni zaryadlash<\/b><p>Zaryadlaganda tok akkumulyator ichida elektroliz kabi kimyoviy oʻzgarish qiladi. Energiya saqlanadi.<\/p><\/div>\n<\/div>\n<p><b>Galvanostegiya<\/b> – buyumni elektroliz bilan metall qatlam bilan qoplash.<\/p>\n<h3>🔬 Simulyatsiya: kalitni mis bilan qoplash<\/h3>\n<div class=\"card\">\n<canvas id=\"c2\"><\/canvas>\n<p style=\"margin:8px 0\">Eritma: CuSO₄. Anod – mis plastina (+). Katod – kalit (−).<\/p>\n<div class=\"row\"><button id=\"b2\">▶ Boshlash<\/button><button class=\"s\" id=\"r2\">↺ Qaytadan<\/button><\/div>\n<div class=\"out\" id=\"o2\"><\/div>\n<\/div>\n<div class=\"fact\"><b>💡 Bilasizmi?<\/b> Galvanoplastikani 1838-yilda olim B. Yakobi kashf etgan. Oldin undan bosmaxona shakllari yasalgan.<\/div>\n<\/section>\n\n<!-- 3 -->\n<section class=\"sec\">\n<h2>3. Sanoat va texnika<\/h2>\n<div class=\"grid\">\n<div class=\"card\"><div class=\"ic\">✈️<\/div><b>Alyuminiy olish<\/b><p>Eritilgan alyuminiy oksididan katta tok bilan toza alyuminiy ajratiladi.<\/p><\/div>\n<div class=\"card\"><div class=\"ic\">🔌<\/div><b>Misni tozalash<\/b><p>Xom mis anod boʻladi. Katodda juda toza mis qoplanadi. Simlar shundan.<\/p><\/div>\n<div class=\"card\"><div class=\"ic\">🧂<\/div><b>Osh tuzi eritmasi<\/b><p>Xlor, vodorod va ishqor (NaOH) olinadi. Sovun, qogʻoz, dori uchun kerak.<\/p><\/div>\n<div class=\"card\"><div class=\"ic\">💧<\/div><b>Vodorod energetikasi<\/b><p>Suvni elektroliz qilib vodorod olinadi. U toza yoqilgʻi.<\/p><\/div>\n<\/div>\n<h3>🔬 Simulyatsiya: sanoat vannasi<\/h3>\n<div class=\"card\">\n<canvas id=\"c3\"><\/canvas>\n<label>Tok kuchi I: <span id=\"v3i\">40<\/span> kA<\/label><input type=\"range\" id=\"i3\" min=\"10\" max=\"100\" step=\"10\" value=\"40\">\n<div class=\"out\" id=\"o3\"><\/div>\n<p class=\"ex\">Hisob 1 soat uchun. Kuchlanish U ≈ 3,5 V deb olindi. Energiya E = U·I·t.<\/p>\n<\/div>\n<div class=\"card\"><b>🌍 Xulosa:<\/b> Elektroliz juda koʻp elektr energiya sarflaydi. 1 kg alyuminiy uchun taxminan 13–15 kWh kerak. Elektr energiya qayta tiklanuvchi manbadan (quyosh, shamol) boʻlsa, ekologiya uchun yaxshi. Chiqindi eritmalarni tozalash ham muhim.<\/div>\n<div class=\"fact\"><b>💡 Bilasizmi?<\/b> Alyuminiy ilgari oltindan qimmat boʻlgan. Elektroliz uni arzon qildi.<\/div>\n\n<h3>🧮 Masala<\/h3>\n<div class=\"card\"><p><b>Tok kuchi 2 A, vaqt 30 daqiqa. Ajralgan mis massasi qancha?<\/b><\/p>\n<button class=\"s\" id=\"sb\">Yechimni koʻrish<\/button>\n<ol id=\"sol\" style=\"display:none\">\n<li>Berilgan: I = 2 A, t = 30 daqiqa, k = 0,33 mg/C.<\/li>\n<li>Vaqtni sekundga oʻtkazamiz: t = 30 · 60 = 1800 s.<\/li>\n<li>Formula: m = k · I · t.<\/li>\n<li>Hisob: m = 0,33 · 2 · 1800 = 1188 mg.<\/li>\n<li><b>Javob: m ≈ 1,19 g mis.<\/b><\/li><\/ol><\/div>\n\n<h3>📝 Test (5 ta savol)<\/h3>\n<div class=\"card q\" id=\"quiz\"><\/div>\n<div class=\"card\"><b>✅ Xulosa.<\/b> Elektroliz – eritmadan tok oʻtganda moddalar ajralishi. Tokni ionlar tashiydi. Ajralgan massa m = k·I·t formulasi bilan topiladi. Elektroliz bilan buyumlar qoplanadi, metallar tozalanadi, alyuminiy, xlor va vodorod olinadi. Buning uchun koʻp energiya kerak.<\/div>\n<\/section>\n<\/main>\n<div class=\"nav\"><button class=\"s\" id=\"pv\">← Oldingi<\/button><button id=\"nx\">Keyingi →<\/button><\/div>\n\n<script>\nconst $=id=>document.getElementById(id),F=(n,d=1)=>n.toFixed(d).replace('.',',');\nfunction setup(id){const c=$(id);c.width=680;c.height=440;const x=c.getContext('2d');x.scale(2,2);return x}\nconst X=[setup('c1'),setup('c2'),setup('c3')];\nlet cur=0,TX='#1b2230',CU='#e07b00',CL='#2e9e44',PL='#d93636',MN='#2f6fe0';\nfunction col(){const s=getComputedStyle(document.body);TX=s.getPropertyValue('--tx').trim();CU=s.getPropertyValue('--cu').trim();CL=s.getPropertyValue('--cl').trim();PL=s.getPropertyValue('--pl').trim();MN=s.getPropertyValue('--mn').trim()}\nfunction ion(x,px,py,c,s){x.fillStyle=c;x.beginPath();x.arc(px,py,9,0,7);x.fill();x.fillStyle='#fff';x.font='bold 13px sans-serif';x.textAlign='center';x.fillText(s,px,py+5)}\nfunction txt(x,s,px,py,c,sz=14){x.fillStyle=c;x.font='bold '+sz+'px sans-serif';x.textAlign='center';x.fillText(s,px,py)}\nfunction beaker(x,tint){x.clearRect(0,0,340,220);x.fillStyle=tint;x.fillRect(20,50,300,150);x.strokeStyle='#8a94a6';x.lineWidth=3;x.beginPath();x.moveTo(20,30);x.lineTo(20,200);x.lineTo(320,200);x.lineTo(320,30);x.stroke()}\nfunction plate(x,px,w,c,sign,sc){x.fillStyle=c;x.fillRect(px,40,w,130);txt(x,sign,px+w/2,28,sc,22)}\nfunction bub(a,x0,y0,rate,run){if(run&&Math.random()<rate)a.push({x:x0+(Math.random()-.5)*12,y:y0,v:.6+Math.random()});for(let i=a.length-1;i>=0;i--){a[i].y-=a[i].v;if(a[i].y<48)a.splice(i,1)}}\nfunction drawB(x,a,c){x.fillStyle=c;a.forEach(b=>{x.globalAlpha=.8;x.beginPath();x.arc(b.x,b.y,4,0,7);x.fill()});x.globalAlpha=1}\nconst rnd=(a,b)=>a+Math.random()*(b-a);\n/* Sim1 */\nconst s1={p:0,run:0,cu:[],cl:[],bb:[]};\nfor(let i=0;i<10;i++){s1.cu.push({x:rnd(80,262),y:rnd(70,185)});s1.cl.push({x:rnd(80,262),y:rnd(70,185)})}\nfunction upd1(){const I=+$('i1').value,T=+$('t1').value,t=s1.p*T,m=0.33*I*t*60;\n$('v1i').textContent=F(I);$('v1t').textContent=T;\n$('o1').innerHTML='m = k·I·t = 0,33 · '+F(I)+' · '+Math.round(t*60)+' s<br><span class=\"c\">m ≈ '+F(m,0)+' mg = '+F(m/1000,2)+' g<\/span> &nbsp; (t = '+F(t,0)+' daq)';return m}\nfunction d1(){const x=X[0],I=+$('i1').value,m=upd1();beaker(x,'rgba(60,170,150,.25)');\nif(s1.run){s1.p+=1/480;if(s1.p>=1){s1.p=1;s1.run=0;$('b1').textContent='▶ Boshlash'}}\nconst sp=s1.run?.4+I*.5:0;s1.cu.forEach(o=>{o.x+=sp;if(o.x>262){o.x=rnd(76,100);o.y=rnd(70,185)}ion(x,o.x,o.y,CU,'+')});\ns1.cl.forEach(o=>{o.x-=sp;if(o.x<76){o.x=rnd(240,262);o.y=rnd(70,185)}ion(x,o.x,o.y,CL,'−')});\nplate(x,56,14,'#555d6b','+',PL);plate(x,270,10,'#9aa3b2','−',MN);\nconst L=Math.min(10,m/600);x.fillStyle=CU;x.fillRect(270-L,40,L,130);\nbub(s1.bb,63,165,s1.run?I*.05:0,1);drawB(x,s1.bb,CL);\ntxt(x,'Cl₂ ↑',63,190,CL,12);txt(x,'Cu qatlami',255,190,CU,12);txt(x,'CuCl₂',170,215,TX,13)}\n$('b1').onclick=()=>{if(s1.p>=1)s1.p=0;s1.run=!s1.run;$('b1').textContent=s1.run?'⏸ Toʻxtatish':'▶ Davom'};\n$('r1').onclick=()=>{s1.p=0;s1.run=0;s1.bb=[];$('b1').textContent='▶ Boshlash'};\n/* Sim2 */\nconst s2={t:0,run:0,fr:0,cu:[],so:[]};\nfor(let i=0;i<8;i++){s2.cu.push({x:rnd(80,230),y:rnd(70,185)});s2.so.push({x:rnd(80,230),y:rnd(70,185)})}\nfunction key(x,w,c){x.strokeStyle=c;x.fillStyle=c;x.lineWidth=w;x.lineJoin='round';x.beginPath();x.arc(250,70,20,0,7);x.stroke();x.fillRect(244,88,12,80);x.fillRect(252,140,14,8);x.fillRect(252,155,10,8);x.beginPath();x.arc(250,70,20,0,7);x.fill()}\nfunction d2(){const x=X[1];beaker(x,'rgba(60,130,220,.22)');\nif(s2.run){s2.fr++;if(s2.fr%30==0)s2.t++;if(s2.t>=60){s2.t=60;s2.run=0;$('b2').textContent='▶ Boshlash'}}\nconst sp=s2.run?1.1:0;s2.cu.forEach(o=>{o.x+=sp;if(o.x>228){o.x=rnd(76,100);o.y=rnd(70,185)}ion(x,o.x,o.y,CU,'+')});\ns2.so.forEach(o=>{o.x-=sp*.6;if(o.x<76)o.x=rnd(210,228);ion(x,o.x,o.y,'#7a8396','−')});\nplate(x,56,14,CU,'+',PL);txt(x,'−',250,22,MN,22);\nconst L=s2.t/10;key(x,L*2+0.01,CU);\nx.globalCompositeOperation='destination-over';x.globalCompositeOperation='source-over';\nx.fillStyle='#9aa3b2';x.beginPath();x.arc(250,70,13,0,7);x.fill();x.fillRect(247,88,6,80);\nx.strokeStyle='#9aa3b2';x.lineWidth=0;\n// qoplama yuzasi\nx.fillStyle=CU;const k=Math.min(1,L/6);x.globalAlpha=k;x.beginPath();x.arc(250,70,13,0,7);x.fill();x.fillRect(247,88,6,80);x.globalAlpha=1;\ntxt(x,'CuSO₄',170,215,TX,13);\n$('o2').innerHTML='Vaqt: '+s2.t+' daqiqa<br><span class=\"c\">Mis qatlami ≈ '+F(s2.t*.8,0)+' mkm<\/span> (tasvir kattalashtirilgan)'}\n$('b2').onclick=()=>{if(s2.t>=60)s2.t=0;s2.run=!s2.run;$('b2').textContent=s2.run?'⏸ Toʻxtatish':'▶ Davom'};\n$('r2').onclick=()=>{s2.t=0;s2.run=0;s2.fr=0;$('b2').textContent='▶ Boshlash'};\n/* Sim3 */\nconst s3={a:[],b:[],na:[]};for(let i=0;i<8;i++)s3.na.push({x:rnd(70,250),y:rnd(70,185)});\nfunction d3(){const x=X[2],I=+$('i3').value;$('v3i').textContent=I;beaker(x,'rgba(120,170,220,.25)');\nx.strokeStyle='#8a94a6';x.setLineDash([5,4]);x.lineWidth=2;x.beginPath();x.moveTo(170,50);x.lineTo(170,200);x.stroke();x.setLineDash([]);\ns3.na.forEach(o=>{o.x+=.3+I/80;if(o.x>260){o.x=rnd(70,100);o.y=rnd(70,185)}ion(x,o.x,o.y,'#8f6bd1','+')});\nplate(x,50,12,'#555d6b','+',PL);plate(x,270,12,'#9aa3b2','−',MN);\nbub(s3.a,56,170,I/200,1);bub(s3.b,276,170,I/400,1);drawB(x,s3.a,CL);drawB(x,s3.b,MN);\ntxt(x,'Cl₂',56,190,CL,13);txt(x,'H₂',276,190,MN,13);txt(x,'Na⁺ →',120,60,'#8f6bd1',12);txt(x,'NaOH',240,60,TX,12);txt(x,'NaCl eritmasi',170,215,TX,13);\nconst cl=0.367*I*3.6,h=0.0104*I*3.6,na=0.415*I*3.6,E=3.5*I;\n$('o3').innerHTML='<span class=\"g\">Xlor (Cl₂): '+F(cl*1,0)+' kg<\/span><br><span class=\"m\">Vodorod (H₂): '+F(h,0)+' kg<\/span><br>Ishqor (NaOH): '+F(na,0)+' kg<br><span class=\"p\">⚡ Sarflangan energiya: '+F(E,0)+' kVt·soat<\/span>'}\n/* nav */\nconst S=[...document.querySelectorAll('.sec')],D=[...$('dots').children];\nfunction go(n){cur=Math.max(0,Math.min(2,n));S.forEach((s,i)=>s.classList.toggle('on',i==cur));D.forEach((d,i)=>d.classList.toggle('on',i<=cur));$('pv').disabled=cur==0;$('nx').disabled=cur==2;scrollTo(0,0)}\n$('pv').onclick=()=>go(cur-1);$('nx').onclick=()=>go(cur+1);go(0);\n$('sb').onclick=()=>{const o=$('sol');o.style.display=o.style.display=='none'?'block':'none'};\n/* test */\nconst Q=[[\"Elektrolitda elektr tokini kimlar tashiydi?\",[\"Ionlar\",\"Faqat atomlar\",\"Suv molekulalari\"],0,\"Toʻgʻri! Musbat va manfiy ionlar harakati – bu tok.\"],\n[\"Katod qaysi qutb va unga qaysi ionlar boradi?\",[\"Musbat qutb, manfiy ionlar\",\"Manfiy qutb, musbat ionlar\",\"Manfiy qutb, manfiy ionlar\"],1,\"Katod (−) musbat ionlarni tortadi.\"],\n[\"m = k·I·t da tok kuchi 2 marta oshsa, massa nima boʻladi?\",[\"2 marta ortadi\",\"2 marta kamayadi\",\"Oʻzgarmaydi\"],0,\"m va I toʻgʻri proporsional.\"],\n[\"Galvanostegiya nima?\",[\"Metallni eritish\",\"Buyumni yupqa metall bilan qoplash\",\"Tokni oʻlchash\"],1,\"Masalan, nikellash va xromlash.\"],\n[\"Osh tuzi eritmasi elektrolizidan nima olinadi?\",[\"Faqat suv\",\"Alyuminiy\",\"Xlor, vodorod va ishqor\"],2,\"Bu sanoatda juda muhim.\"]];\n$('quiz').innerHTML=Q.map((q,i)=>'<div style=\"margin-bottom:14px\"><b>'+(i+1)+'. '+q[0]+'<\/b>'+q[1].map((o,j)=>'<button data-q=\"'+i+'\" data-j=\"'+j+'\">'+o+'<\/button>').join('')+'<div class=\"ex\" id=\"e'+i+'\"><\/div><\/div>').join('');\n$('quiz').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.q,j=+b.dataset.j,q=Q[i];\ndocument.querySelectorAll('[data-q=\"'+i+'\"]').forEach(k=>{k.disabled=1;if(+k.dataset.j==q[2])k.classList.add('ok')});\nif(j!=q[2])b.classList.add('no');$('e'+i).textContent=(j==q[2]?'✅ ':'❌ ')+q[3]};\nfunction loop(){col();if(cur==0)d1();if(cur==1)d2();if(cur==2)d3();requestAnimationFrame(loop)}\nloop();\n<\/script><\/body><\/html>\n"}, {"t": "Faradeyning 1-qonuni", "i": "1️⃣", "h": "<!DOCTYPE html>\n<html lang=\"uz\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Elektroliz. Faradeyning birinchi qonuni<\/title>\n<style>\n:root{--bg:#f4f6fb;--cd:#fff;--tx:#1b2230;--mu:#5b6577;--ln:#dfe3ec;--ac:#2563eb;--lq:#dbeafe;--ok:#16a34a;--bad:#dc2626;--hd:rgba(244,246,251,.94)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){color-scheme:dark;--bg:#0e13
