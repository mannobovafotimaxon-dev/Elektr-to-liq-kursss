ti:\",o:[\"9·10⁹ N·m²/C²\",\"9·10⁻⁹ N·m²/C²\",\"6,67·10⁻¹¹ N·m²/C²\"],a:0},\n{q:\"Masofa 3 marta ortsa, kuch...\",o:[\"3 marta kamayadi\",\"6 marta kamayadi\",\"9 marta kamayadi\"],a:2},\n{q:\"q₁ = q₂ = 1 µC, r = 0,3 m bo'lsa, F = ?\",o:[\"0,01 N\",\"0,1 N\",\"1 N\"],a:1},\n{q:\"Nyutonning III qonuniga ko'ra ikki zaryad kuchlari:\",o:[\"teng va bir tomonga yo'nalgan\",\"kattalik jihatdan teng, qarama-qarshi yo'nalgan\",\"har xil kattalikda\"],a:1},\n{q:\"Kulon qonuni formulasi qaysi?\",o:[\"F = k·q₁q₂ / r\",\"F = k·|q₁q₂| / r²\",\"F = k·(q₁+q₂) / r²\"],a:1},\n{q:\"Kulon kuchi qanday yo'nalgan?\",o:[\"Zaryadlarni tutashtiruvchi chiziq bo'ylab\",\"Chiziqqa perpendikulyar\",\"Ixtiyoriy tomonga\"],a:0},\n{q:\"Bir chiziqda va bir tomonga yo'nalgan F₁ = 6 N va F₂ = 8 N ning yig'indisi:\",o:[\"2 N\",\"14 N\",\"10 N\"],a:1}]};\nlet fin={n:0,ok:0};\nfunction quiz(el,arr,final){arr.forEach((it,i)=>{const d=document.createElement('div');d.className='q';d.innerHTML=`<p>${i+1}. ${it.q}<\/p>`;\n  const bs=[],fb=document.createElement('div');fb.className='fb';\n  it.o.forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;\n    b.onclick=()=>{bs.forEach((z,k)=>{z.disabled=true;if(k===it.a)z.classList.add('ok')});\n      const good=j===it.a;if(!good)b.classList.add('bad');\n      fb.textContent=good?\"To'g'ri! ✅\":\"Noto'g'ri. To'g'ri javob: \"+it.o[it.a];\n      if(final){fin.n++;if(good)fin.ok++;if(fin.n===arr.length){const g=fin.ok>=7?5:fin.ok>=6?4:fin.ok>=4?3:2;\n        $('#res').textContent=`Natija: ${fin.ok}/${arr.length} — baho: ${g}`+(g>=4?' 🎉':' — mavzuni takrorlang')}}};\n    bs.push(b);d.appendChild(b)});d.appendChild(fb);el.appendChild(d)})}\ndocument.querySelectorAll('.quiz').forEach(e=>quiz(e,Q[e.dataset.set],e.dataset.set==='fin'));\n\n// ===== Tablar, mavzu, asosiy sikl =====\nlet tab=1;\ndocument.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=+b.dataset.t;\n  document.querySelectorAll('#tabs button').forEach(z=>z.classList.toggle('on',z===b));\n  document.querySelectorAll('.panel').forEach((p,i)=>p.classList.toggle('on',i+1===tab));\n  Object.values(O).forEach(fit);scrollTo(0,0)});\naddEventListener('resize',()=>Object.values(O).forEach(fit));\nfunction setTheme(t){document.documentElement.dataset.theme=t;readColors()}\nsetTheme(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');\n$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');\nObject.values(O).forEach(fit);\nlet last=0;\nfunction loop(ms){const t=ms/1000,dt=Math.min(.033,t-last);last=t;\n  if(tab===1){draw_a1(t);sim1(dt);draw_s1()}\n  else if(tab===2){draw_a2(t,dt);draw_m2();draw_g2()}\n  else if(tab===3){draw_a3(t);draw_s3()}\n  requestAnimationFrame(loop)}\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>\n", "<!DOCTYPE html><html lang=\"uz\" data-theme=\"light\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>5-MAVZU. Elektr maydon<\/title>\n<style>\n:root{--bg:#f6f8fb;--c:#fff;--t:#1b2430;--m:#5b6776;--b:#d9e0ea;--p:#e53935;--n:#1e6fd9;--e:#2e9e4f;--r:#8e44ad;--y:#f5a623}\n[data-theme=dark]{--bg:#111821;--c:#1a2431;--t:#e8edf3;--m:#9aa8b8;--b:#2c394a}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.55 system-ui,sans-serif}\nheader{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;gap:8px}h1{font-size:1.2rem;margin:0}\nnav{display:flex;gap:6px;padding:0 12px;overflow-x:auto;position:sticky;top:0;background:var(--bg);z-index:5}\nbutton,select,input{font:inherit;color:var(--t)}button{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:7px 12px;cursor:pointer}\nbutton:hover,button.on{border-color:var(--y);background:color-mix(in srgb,var(--y) 18%,var(--c))}\nmain{max-width:820px;margin:auto;padding:12px}.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin:12px 0}\nh2{font-size:1.1rem;margin:0 0 8px}canvas{width:100%;max-width:520px;background:var(--bg);border:1px solid var(--b);border-radius:8px;touch-action:none;display:block}\n.f{font-family:Georgia,serif;background:color-mix(in srgb,var(--y) 14%,var(--c));padding:2px 8px;border-radius:6px;display:inline-block;margin:2px}\ninput[type=number],input[type=text]{background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:7px;width:150px}\n.ok{color:var(--e);font-weight:600}.no{color:var(--p);font-weight:600}.st{margin:4px 0;padding:6px 10px;border-left:3px solid var(--r)}\n.bar{height:16px;background:var(--y);border-radius:4px;margin:3px 0;transition:width .3s}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}\n.tab{display:none}.tab.on{display:block}\n<\/style><\/head><body>\n<header><h1>5-MAVZU. Elektr maydon<\/h1><button id=\"th\">🌙 / ☀️<\/button><\/header>\n<nav id=\"nav\"><\/nav><main id=\"app\"><\/main>\n<script>\n// ===== Yordamchi funksiyalar =====\nconst k=9e9,e=1.6e-19,$=s=>document.querySelector(s);let FIX=false;\nconst R=(a,b,s=1)=>FIX?a:a+Math.round(Math.random()*(b-a)/s)*s;\nconst F=x=>x===0?'0':(Math.abs(x)>=1e4||Math.abs(x)<1e-2)?x.toExponential(2).replace('e','·10^'):String(+x.toPrecision(3));\nconst sgn=q=>q>0?'var(--p)':'var(--n)';\n$('#th').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme=='dark'?'light':'dark';drawAll()};\nfunction arrow(c,x,y,dx,dy,col,w=2.5){const l=Math.hypot(dx,dy);if(l<2)return;c.strokeStyle=c.fillStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x,y);c.lineTo(x+dx,y+dy);c.stroke();const a=Math.atan2(dy,dx);c.beginPath();c.moveTo(x+dx,y+dy);c.lineTo(x+dx-9*Math.cos(a-.4),y+dy-9*Math.sin(a-.4));c.lineTo(x+dx-9*Math.cos(a+.4),y+dy-9*Math.sin(a+.4));c.fill()}\nfunction dot(c,x,y,q,r=11){c.fillStyle=sgn(q);c.beginPath();c.arc(x,y,r,0,7);c.fill();c.fillStyle='#fff';c.font='bold 14px sans-serif';c.textAlign='center';c.fillText(q>0?'+':'−',x,y+5)}\nfunction cv(id){const c=$(id);c.width=520;c.height=300;return c}\n// Maydon: zaryadlar {x,y (px), q (C)}, 1 px = 0.01 m\nfunction Ef(ch,x,y,skip){let ex=0,ey=0;for(const h of ch){if(h===skip)continue;let dx=x-h.x,dy=y-h.y,r=Math.max(Math.hypot(dx,dy),6);const E=k*h.q/(r*.01)**2;ex+=E*dx/r;ey+=E*dy/r}return[ex,ey]}\nfunction drag(c,pts,cb){let cur=null;const P=ev=>{const b=c.getBoundingClientRect();return[(ev.clientX-b.left)*c.width/b.width,(ev.clientY-b.top)*c.height/b.height]};\nc.onpointerdown=ev=>{const[x,y]=P(ev);cur=null;let m=28;for(const p of pts){const d=Math.hypot(p.x-x,p.y-y);if(d<m){m=d;cur=p}}if(cur)c.setPointerCapture(ev.pointerId)};\nc.onpointermove=ev=>{if(!cur)return;const[x,y]=P(ev);cur.x=Math.min(c.width-10,Math.max(10,x));cur.y=Math.min(c.height-10,Math.max(10,y));cb()};c.onpointerup=()=>cur=null}\n// ===== Masalalar (generatorlar) =====\nconst P={\n1:[()=>{const q=R(2,9),r=R(3,10),E=k*q*1e-9/(r*.01)**2;return{t:`${q} nC zaryaddan ${r} sm masofadagi maydon kuchlanganligini toping.`,u:'N/C',a:E,st:[`Berilgan: q=${q}·10⁻⁹ C, r=${r/100} m`,'Formula: E = kq/r²',`E = 9·10⁹·${q}·10⁻⁹/${(r/100)**2} = ${F(E)} N/C`]}},\n()=>{const E=R(2,9)*1e3,q=R(2,8),F1=q*1e-6*E,Fe=e*E;return{t:`E=${E/1e3} kN/C bo'lgan maydonda q=${q} µC zaryadga ta'sir kuchini toping (elektronga ta'sir ham yechimda).`,u:'N',a:F1,st:[`E=${F(E)} N/C, q=${q}·10⁻⁶ C`,`F = qE = ${F(F1)} N (q>0: E bo'ylab)`,`Elektron: F = eE = ${F(Fe)} N, E ga QARAMA-QARSHI`]}},\n()=>{const q1=R(2,8),q2=R(2,8),d=R(10,40,5),q0=R(1,5),r=d/200,E1=k*q1*1e-9/r**2,E2=k*q2*1e-9/r**2,E=E1+E2,Fq=q0*1e-9*E;return{t:`+${q1} nC va −${q2} nC zaryadlar orasi ${d} sm. O'rtadagi nuqtaning E si va u yerga q₀=${q0} nC qo'yilsa ta'sir kuchi?`,u:'N',a:Fq,st:[`r=d/2=${r} m`,`E₁=kq₁/r²=${F(E1)}, E₂=kq₂/r²=${F(E2)} N/C`,'Ikkalasi ham + dan − ga yo\\'nalgan (bir tomonga): E=E₁+E₂='+F(E)+' N/C',`F=q₀E=${F(Fq)} N (E bo'ylab)`]}}],\n2:[()=>{const q1=R(2,6),q2=q1+R(1,4),d=R(2,8)/10,r=d/2,E1=k*q1*1e-9/r**2,E2=k*q2*1e-9/r**2,E=Math.abs(E1-E2);return{t:`Ikki musbat zaryad ${q1} nC va ${q2} nC orasi ${d} m. O'rtadagi E ni toping.`,u:'N/C',a:E,st:[`E₁=${F(E1)}, E₂=${F(E2)} N/C`,'Bir xil ishora: yo\\'nalishlar qarama-qarshi, E=|E₁−E₂|='+F(E)+' N/C','(Har xil ishorada E₁+E₂ bo\\'lardi)']}},\n()=>{const q=R(2,9),a=R(5,20,5)/100,E1=k*q*1e-9/a**2,E=Math.sqrt(3)*E1;return{t:`Tomoni ${a*100} sm teng tomonli uchburchakning ikki uchida +${q} nC zaryadlar. Uchinchi uchdagi E?`,u:'N/C',a:E,st:[`E₁=E₂=kq/a²=${F(E1)} N/C`,'Ular orasidagi burchak 60°: E=2E₁cos30°=√3·E₁',`E=${F(E)} N/C (uchinchi uchdan uzoqlashadi)`]}},\n()=>{const q=R(2,8),a=R(5,20,5)/100,E1=k*q*1e-9/a**2,E3=E1/2,c=E3*Math.SQRT1_2,Ex=E1+c,E=Math.SQRT2*Ex;return{t:`Tomoni ${a*100} sm kvadratning uchta uchida (C ga qo'shni ikkitasi va qarama-qarshi uchi) +${q} nC. To'rtinchi C uchdagi E?`,u:'N/C',a:E,st:[`Qo'shnilar: E₁=E₂=kq/a²=${F(E1)} N/C (o'qlar bo'ylab)`,`Qarama-qarshi uch: r²=2a², E₃=${F(E3)} N/C, diagonal bo'ylab`,`Ex=Ey=E₁+E₃cos45°=${F(Ex)}`,`E=√(Ex²+Ey²)=${F(E)} N/C`]}}],\n3:[()=>{const q=R(2,9),E=R(2,9)*1e3,d=R(5,20,5)/100,A=q*1e-9*E*d;return{t:`q=${q} nC zaryad E=${E/1e3} kN/C bir jinsli maydonda kuch chizig'i bo'ylab ${d*100} sm ko'chdi. Ish?`,u:'J',a:A,st:[`A=qEd`,`A=${q}·10⁻⁹·${F(E)}·${d}=${F(A)} J`]}},\n()=>{const q=R(2,9),r=R(3,10)/100,ph=k*q*1e-9/r,W=e*200;return{t:`${q} nC zaryaddan ${r*100} sm masofadagi potensialni toping. (Qo'shimcha: U=200 V da elektron energiyasi ${F(W)} J = 200 eV.)`,u:'V',a:ph,st:[`φ=kq/r=9·10⁹·${q}·10⁻⁹/${r}=${F(ph)} V`,`W=eU=1,6·10⁻¹⁹·200=${F(W)} J`,'1 eV=1,6·10⁻¹⁹ J ⇒ W=200 eV']}},\n()=>{const q1=R(2,8),q2=R(2,8),d=R(20,50,10)/100,q0=R(1,4),pA=k*1e-9*(q1/(d/4)-q2/(3*d/4)),pB=k*1e-9*(q1-q2)/(d/2),A=q0*1e-9*(pA-pB);return{t:`+${q1} nC va −${q2} nC zaryadlar orasi ${d*100} sm. A nuqta +zaryaddan d/4, B nuqta o'rtada. q₀=${q0} nC ni A dan B ga ko'chirish ishi?`,u:'J',a:A,st:[`φ_A=k(q₁/r₁+q₂/r₂), q₂<0: φ_A=${F(pA)} V`,`φ_B=k(q₁−q₂)/(d/2)=${F(pB)} V`,`A=q₀(φ_A−φ_B)=${F(A)} J`+(A<0?' (manfiy: tashqi kuch ishlaydi)':'')]}}]};\nconst LV=['Oson','O\\'rta','Qiyin'];\n// ===== Testlar [savol,[variantlar],to'g'ri,izoh,bo'lim] =====\nconst T={1:[['1 nC zaryaddan 3 m da E taxminan?',['1 N/C','1 kN/C','10 N/C'],2,'E=9·10⁹·10⁻⁹/9=1 N/C… hisoblasak 1 N/C; lekin 10⁻⁹·9·10⁹=9, 9/9=1 N/C.',1],['Kerosinda (ε≈2) E vakuumga nisbatan?',['2 marta kam','2 marta ko\\'p','o\\'zgarmaydi'],0,'E=kq/(εr²) — ε marta kamayadi.',1],['Elektronga kuch maydonga nisbatan?',['bo\\'ylab','qarama-qarshi','perpendikulyar'],1,'F=qE, q<0 ⇒ F qarama-qarshi.',1]],\n2:[['Kuch chiziqlari qayerda tugaydi?',['+ zaryadda','− zaryadda','kesishadi'],1,'Musbatdan chiqib, manfiyda tugaydi; kesishmaydi.',2],['Superpozitsiya bu…',['E larning vektor yig\\'indisi','modullar yig\\'indisi','ko\\'paytma'],0,'E=E₁+E₂+… vektor sifatida.',2],['Bir jinsli maydon chiziqlari?',['radial','parallel, teng masofali','aylana'],1,'Parallel va teng zichlikda.',2]],\n3:[['φ=kq/r kattalik turi?',['vektor','skalyar','tenzor'],1,'Skalyar: φ=φ₁+φ₂.',3],['1 eV nechaga teng?',['1,6·10⁻¹⁹ J','9·10⁹ J','1 V'],0,'Elektron 1 V da olgan energiya.',3],['Ekvipotensial sirt kuch chizig\\'iga?',['parallel','perpendikulyar','60° burchak'],1,'Perpendikulyar; unda ish nol.',3]]};\nT[1][0][3]='E=kq/r²=9·10⁹·10⁻⁹/9=1 N/C.';T[1][0][2]=0;\nconst TXT={\n1:{th:'Zaryad atrofida elektr maydon mavjud. Kuchlanganlik <span class=f>E=F/q<\/span> (N/C=V/m). Nuqtaviy zaryad: <span class=f>E=k|q|/r²<\/span>, muhitda <span class=f>E=k|q|/(εr²)<\/span>. Musbat zaryaddan uzoqlashadi, manfiyga yo\\'nalgan. <span class=f>F=qE<\/span> (q<0 da E ga qarama-qarshi).',cl:'Maydon zaryad atrofida bo\\'ladi; E masofa kvadratiga teskari; muhitda ε marta kamayadi.',fact:'Chaqmoq oldidan havodagi E ≈ 3·10⁶ V/m ga yetadi.'},\n2:{th:'Kuch chiziqlari + dan chiqadi, − da tugaydi, kesishmaydi; zichligi E ga proporsional; urinma E yo\\'nalishini beradi. Bir jinsli maydonda chiziqlar parallel. Superpozitsiya: <span class=f>E=E₁+E₂+…<\/span> (vektor), <span class=f>|E|=√(Ex²+Ey²)<\/span>. Dipol — teng, qarama-qarshi zaryadlar juftligi.',cl:'Maydonlar vektor sifatida qo\\'shiladi; chiziqlar maydon shaklini ko\\'rsatadi.',fact:'Suv molekulasi dipol — shuning uchun suv yaxshi erituvchi.'},\n3:{th:'Bir jinsli maydonda <span class=f>A=qEd<\/span>; ish yo\\'lga bog\\'liq emas. Potensial <span class=f>φ=W/q<\/span> (V), nuqtaviy zaryad <span class=f>φ=kq/r<\/span> (skalyar, φ=φ₁+φ₂). <span class=f>A=q(φ₁−φ₂)=qU<\/span>, <span class=f>U=Ed<\/span>. 1 eV=1,6·10⁻¹⁹ J. Ekvipotensial sirtlar kuch chiziqlariga perpendikulyar.',cl:'Ish potensiallar farqiga bog\\'liq: A=qU; potensiallar algebraik qo\\'shiladi.',fact:'Elektron 1 V da 1 eV energiya oladi — atom fizikasida qulay birlik.'}};\nconst NAMES=['1. Maydon kuchlanganligi','2. Kuch chiziqlari','3. Ish va potensial','Yakuniy nazorat'];\n// ===== Sahifa qurish =====\nlet anims=[],draws=[];\nfunction build(){\n$('#nav').innerHTML=NAMES.map((n,i)=>`<button data-i=\"${i}\">${n}<\/button>`).join('');\n$('#app').innerHTML=[1,2,3].map(sec).join('')+'<section class=\"tab\" id=\"tab3\"><\/section>';\ndocument.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(+b.dataset.i));\n[1,2,3].forEach(init);final();show(0)}\nfunction sec(s){const x=TXT[s];return `<section class=\"tab\" id=\"tab${s-1}\"><div class=\"card\"><h2>Nazariya<\/h2>${x.th}<\/div>\n<div class=\"card\"><h2>Animatsiya<\/h2><canvas id=\"an${s}\"><\/canvas><div class=row><button id=\"ab${s}\">Boshlash<\/button><\/div><\/div>\n<div class=\"card\"><h2>Namunaviy masala<\/h2><div id=\"ex${s}\"><\/div><\/div>\n<div class=\"card\"><h2>Simulyatsiya<\/h2><canvas id=\"sm${s}\"><\/canvas><div id=\"ctl${s}\" class=row><\/div><div id=\"ro${s}\"><\/div><\/div>\n<div class=\"card\"><h2>Mustaqil masalalar<\/h2><div id=\"pr${s}\"><\/div><\/div>\n<div class=\"card\"><h2>Xulosa<\/h2>${x.cl}<p><b>Bilib oling:<\/b> ${x.fact}<\/p><\/div>\n<div class=\"card\"><h2>Test<\/h2><div id=\"ts${s}\"><\/div><\/div><\/section>`}\nfunction show(i){document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on',i==j));document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('on',i==j));drawAll()}\nfunction drawAll(){draws.forEach(f=>f())}\nfunction quiz(id,list,after){const el=$(id);el.innerHTML=list.map((q,i)=>`<p><b>${q[0]}<\/b><\/p><div class=row>${q[1].map((o,j)=>`<button data-i=\"${i}\" data-j=\"${j}\">${o}<\/button>`).join('')}<\/div><div id=\"${id.slice(1)}r${i}\"><\/div>`).join('');\nel.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const q=list[b.dataset.i],ok=+b.dataset.j==q[2];$('#'+id.slice(1)+'r'+b.dataset.i).innerHTML=`<span class=\"${ok?'ok':'no'}\">${ok?'To\\'g\\'ri!':'Noto\\'g\\'ri.'}<\/span> To'g'ri javob: ${q[1][q[2]]}. ${q[3]}`;if(after)after(q,ok,+b.dataset.i)}}\nfunction steps(id,p){const el=$(id);let n=0;el.innerHTML=`<p>${p.t}<\/p><p><b>Topish kerak:<\/b> ${p.u} birligida javob<\/p><div class=sl><\/div><div class=row><button class=nx>Keyingi qadam<\/button><\/div><p class=an><\/p>`;\nel.querySelector('.nx').onclick=()=>{if(n<p.st.length)el.querySelector('.sl').insertAdjacentHTML('beforeend',`<div class=st>${p.st[n++]}<\/div>`);if(n==p.st.length)el.querySelector('.an').innerHTML=`<b class=ok>Javob: ${F(p.a)} ${p.u}<\/b>`}}\nfunction probs(s){const el=$('#pr'+s);let cur=[];const gen=()=>{cur=P[s].map(g=>g());render()};\nconst render=()=>{el.innerHTML=cur.map((p,i)=>`<div class=st style=\"border-color:var(--y)\"><b>${LV[i]}.<\/b> ${p.t}<div class=row><input type=text placeholder=\"javob (masalan 1.5e-6)\" id=\"in${s}${i}\"><button data-a=c data-i=${i}>Tekshirish<\/button><button data-a=s data-i=${i}>Yechimni ko'rish<\/button><button data-a=n data-i=${i}>Yangi variant<\/button><\/div><div id=\"pm${s}${i}\"><\/div><\/div>`).join('')};\nel.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const i=+b.dataset.i,p=cur[i],m=$('#pm'+s+i);\nif(b.dataset.a=='c'){const v=parseFloat($('#in'+s+i).value.replace(',','.'));m.innerHTML=isNaN(v)?'Son kiriting.':Math.abs(v-p.a)<=.02*Math.abs(p.a)?'<span class=ok>To\\'g\\'ri!<\/span>':'<span class=no>Noto\\'g\\'ri, qayta urining.<\/span>'}\nif(b.dataset.a=='s')m.innerHTML=p.st.map(x=>`<div class=st>${x}<\/div>`).join('')+`<b class=ok>Javob: ${F(p.a)} ${p.u}<\/b>`;\nif(b.dataset.a=='n'){cur[i]=P[s][i]();render()}};gen()}\nfunction init(s){\nFIX=true;steps('#ex'+s,P[s][1]());FIX=false;probs(s);quiz('#ts'+s,T[s]);\nconst ab=$('#ab'+s),an=cv('#an'+s),ac=an.getContext('2d');let run=0,t=0;\nconst step=()=>{t+=.016;ANIM[s](ac,an,t);if(run)requestAnimationFrame(step)};\nab.onclick=()=>{run=!run;ab.textContent=run?'To\\'xtatish':'Boshlash';if(run)step()};draws.push(()=>ANIM[s](ac,an,t));\nSIM[s]()}\n// ===== Animatsiyalar =====\nconst ANIM={\n1(c,cv,t){c.clearRect(0,0,520,300);const x0=110,y=150,r=60+45*(1+Math.sin(t*1.5)),rm=r*.01,E=k*1e-6/rm**2;dot(c,x0,y,1,16);c.fillStyle='var(--t)';c.fillStyle=getComputedStyle(document.body).color;c.beginPath();c.arc(x0+r*2,y,6,0,7);c.fill();arrow(c,x0+r*2,y,Math.min(160,3e6/E*8),0,'#2e9e4f');c.fillText(`r=${(rm*2).toFixed(2)} m  E∝1/r²`,300,40);c.fillText('E = '+F(k*1e-6/(rm*2)**2)+' N/C (q=1 µC)',300,65)},\n2(c,cv,t){c.clearRect(0,0,520,300);const ch=[{x:170,y:150,q:1e-6},{x:350,y:150,q:-1e-6}];drawLines(c,ch,8);dot(c,170,150,1);dot(c,350,150,-1);let x=180,y=150-40*Math.sin(0),ph=(t*.4)%1,px=0,py=0;x=170+15*Math.cos(1.2);y=150-15*Math.sin(1.2);for(let i=0;i<ph*120;i++){const[ex,ey]=Ef(ch,x,y),l=Math.hypot(ex,ey);x+=3*ex/l;y+=3*ey/l;if(Math.hypot(x-350,y-150)<10)break}c.fillStyle='#e53935';c.beginPath();c.arc(x,y,5,0,7);c.fill()},\n3(c,cv,t){c.clearRect(0,0,520,300);c.fillStyle='#e53935';c.fillRect(90,40,340,8);c.fillStyle='#1e6fd9';c.fillRect(90,250,340,8);const d=.2,E=1e4,q=1e-6,f=(Math.sin(t*1.2)+1)/2,y=48+f*198;c.strokeStyle='#2e9e4f';for(let x=120;x<430;x+=50)arrow(c,x,60,0,170,'#2e9e4f',1.2);dot(c,260+Math.sin(f*6)*40,y,1,10);const A=q*E*d*f;c.fillStyle=getComputedStyle(document.body).color;c.font='15px sans-serif';c.textAlign='left';c.fillText(`Yo'l egri bo'lsa ham A=qEd = ${F(A)} J`,100,285)}};\nfunction drawLines(c,ch,n){c.lineWidth=1.2;c.strokeStyle='#2e9e4f';for(const h of ch){const s=h.q>0?1:-1;if(!ch.some(o=>o.q*s>0)||h.q*s<0)continue;for(let i=0;i<n;i++){let a=i/n*6.283,x=h.x+9*Math.cos(a),y=h.y+9*Math.sin(a);c.beginPath();c.moveTo(x,y);for(let j=0;j<320;j++){const[ex,ey]=Ef(ch,x,y),l=Math.hypot(ex,ey);if(!l)break;x+=s*3*ex/l;y+=s*3*ey/l;c.lineTo(x,y);if(x<0||y<0||x>520||y>300||ch.some(o=>o!==h&&o.q*s<0&&Math.hypot(x-o.x,y-o.y)<9))break}c.stroke()}}}\n// ===== Simulyatsiyalar =====\nconst SIM={\n1(){const c=cv('#sm1'),g=c.getContext('2d'),ch={x:200,y:150,q:5e-6},tp={x:340,y:150};let sq=1,eps=1;\n$('#ctl1').innerHTML=`<label>q(µC): <input type=range id=q1 min=-10 max=10 step=1 value=5><\/label><button id=sg>Sinov zaryadi: +<\/button><select id=ep><option value=1>vakuum<\/option><option value=2>kerosin ε≈2<\/option><option value=7>shisha ε≈7<\/option><option value=81>suv ε=81<\/option><\/select>`;\nconst dr=()=>{g.clearRect(0,0,520,300);const rm=Math.max(Math.hypot(tp.x-ch.x,tp.y-ch.y),6)*.01,Eu=ch.q*k/(eps*rm**2),ux=(tp.x-ch.x)/(rm*100),uy=(tp.y-ch.y)/(rm*100),sg=Math.sign(ch.q)||1,Ex=sg*ux,Ey=sg*uy,L=Math.min(120,10+15*Math.log10(1+Math.abs(Eu)/10));\ndot(g,ch.x,ch.y,ch.q||1,16);g.fillStyle=sgn(sq);g.beginPath();g.arc(tp.x,tp.y,7,0,7);g.fill();arrow(g,tp.x,tp.y,Ex*L,Ey*L,'#2e9e4f');const q=sq*1e-9,Fq=q*Math.abs(Eu),s2=sq*sg;arrow(g,tp.x,tp.y,-Ey*0+Ex*s2*L*.6,Ey*s2*L*.6+14,'#8e44ad',1.5);\nconst Ea=Math.abs(Eu);$('#ro1').innerHTML=`r=${rm.toFixed(2)} m; E=${F(Ea)} N/C (yashil, ${ch.q>0?'zaryaddan uzoqlashadi':'zaryadga qarab'}); F=|q|E=${F(Math.abs(Fq))} N (q=${sq}nC: ${s2>0?'E bo\\'ylab':'E ga qarshi'}, binafsha)<br>`+[1,2,7,81].map(m=>`<div class=bar style=\"width:${Math.max(1,Math.abs(ch.q)*k/(m*rm**2)/(Math.abs(ch.q)*k/rm**2+1e-9)*100)}%\"><\/div><small>ε=${m}: ${F(Math.abs(ch.q)*k/(m*rm**2))} N/C<\/small>`).join('')};\n$('#q1').oninput=e2=>{ch.q=e2.target.value*1e-6;dr()};$('#sg').onclick=e2=>{sq=-sq;e2.target.textContent='Sinov zaryadi: '+(sq>0?'+':'−');dr()};$('#ep').onchange=e2=>{eps=+e2.target.value;dr()};drag(c,[tp],dr);draws.push(dr);dr()},\n2(){const c=cv('#sm2'),g=c.getContext('2d'),ch=[{x:160,y:150,q:2e-6},{x:360,y:150,q:-2e-6}],tp={x:260,y:70};\n$('#ctl2').innerHTML=`<label>q₁(µC): <input type=range id=a2 min=-5 max=5 value=2><\/label><label>q₂(µC): <input type=range id=b2 min=-5 max=5 value=-2><\/label>`;\nconst dr=()=>{g.clearRect(0,0,520,300);const v=ch.filter(h=>h.q);drawLines(g,v,10);ch.forEach(h=>dot(g,h.x,h.y,h.q||1));g.fillStyle='#999';g.beginPath();g.arc(tp.x,tp.y,6,0,7);g.fill();const s=6e-4,E=ch.map(h=>Ef([h],tp.x,tp.y)),T2=[E[0][0]+E[1][0],E[0][1]+E[1][1]];\narrow(g,tp.x,tp.y,E[0][0]*s,E[0][1]*s,'#2e9e4f',1.5);arrow(g,tp.x,tp.y,E[1][0]*s,E[1][1]*s,'#2e9e4f',1.5);g.setLineDash([4,4]);arrow(g,tp.x,tp.y,T2[0]*s,T2[1]*s,'#8e44ad',3);g.setLineDash([]);\n$('#ro2').innerHTML=`E₁=${F(Math.hypot(...E[0]))}, E₂=${F(Math.hypot(...E[1]))} N/C; Ex=${F(T2[0])}, Ey=${F(T2[1])}; <b style=\"color:var(--r)\">|E|=${F(Math.hypot(...T2))} N/C<\/b> (Ey pastga musbat — ekran o'qi). Zaryad/nuqtani sudrang.`};\n$('#a2').oninput=e2=>{ch[0].q=e2.target.value*1e-6;dr()};$('#b2').oninput=e2=>{ch[1].q=e2.target.value*1e-6;dr()};drag(c,[tp,...ch],dr);draws.push(dr);dr()},\n3(){const c=cv('#sm3'),g=c.getContext('2d'),ch=[{x:170,y:150,q:3e-9*3},{x:350,y:150,q:-3e-9*3}],A={x:260,y:70},B={x:260,y:230};\n$('#ctl3').innerHTML=`<label>q₀(nC): <input type=range id=q3 min=-5 max=5 value=1><\/label>`;let q0=1e-9;\nconst ph=(x,y)=>ch.reduce((s,h)=>s+k*h.q/(Math.max(Math.hypot(x-h.x,y-h.y),6)*.01),0);\nconst dr=()=>{for(let x=0;x<520;x+=8)for(let y=0;y<300;y+=8){const p=ph(x+4,y+4),a=Math.min(.9,Math.abs(p)/600);g.fillStyle=getComputedStyle(document.body).backgroundColor;g.fillRect(x,y,8,8);g.fillStyle=p>0?`rgba(245,166,35,${a})`:`rgba(230,110,20,${a*.6})`;g.fillRect(x,y,8,8)}\nch.forEach(h=>dot(g,h.x,h.y,h.q));[A,B].forEach((p,i)=>{g.fillStyle='#8e44ad';g.beginPath();g.arc(p.x,p.y,7,0,7);g.fill();g.fillStyle=getComputedStyle(document.body).color;g.fillText('AB'[i],p.x+10,p.y-8)});\nconst a=ph(A.x,A.y),b=ph(B.x,B.y),U=a-b;$('#ro3').innerHTML=`φ_A=${F(a)} V, φ_B=${F(b)} V, U=φ_A−φ_B=${F(U)} V; A=q₀U=${F(q0*U)} J ${q0*U>=0?'(musbat: maydon ish bajaradi)':'(manfiy: tashqi kuch kerak)'}. A va B ni sudrang.`};\n$('#q3').oninput=e2=>{q0=e2.target.value*1e-9;dr()};drag(c,[A,B],dr);draws.push(dr);dr()}};\n// ===== Yakuniy nazorat =====\nfunction final(){const el=$('#tab3');let pool=[...T[1],...T[2].slice(0,1),...T[3].slice(0,1),T[2][1]],sc=0,ans=0,bad={};FIX=false;\nconst calc=[1,2,3].map(s=>{const p=P[s][s==3?0:1]();return p});\nel.innerHTML=`<div class=card><h2>Yakuniy nazorat<\/h2><div id=fq><\/div><h3>Hisoblash masalalari<\/h3><div id=fc><\/div><button id=fg>Natijani ko'rish<\/button><div id=fr><\/div><\/div>`;\nlet sel={};$('#fq').innerHTML=pool.map((q,i)=>`<p><b>${i+1}. ${q[0]}<\/b><\/p><div class=row>${q[1].map((o,j)=>`<label><input type=radio name=f${i} value=${j}> ${o}<\/label>`).join('')}<\/div>`).join('');\n$('#fc').innerHTML=calc.map((p,i)=>`<p><b>${6+i}. ${p.t}<\/b><\/p><input type=text id=fc${i} placeholder=\"javob (${p.u})\">`).join('');\n$('#fg').onclick=()=>{sc=0;bad={};pool.forEach((q,i)=>{const r=document.querySelector(`input[name=f${i}]:checked`);if(r&&+r.value==q[2])sc++;else bad[q[4]]=1});\ncalc.forEach((p,i)=>{const v=parseFloat($('#fc'+i).value.replace(',','.'));if(Math.abs(v-p.a)<=.02*Math.abs(p.a))sc++;else bad[[1,2,3][i]]=1});\nconst g=sc>=8?5:sc>=6?4:sc>=4?3:2;$('#fr').innerHTML=`<p><b>Natija: ${sc}/8, baho: ${g}<\/b><\/p><p>${Object.keys(bad).length?'Takrorlang: '+Object.keys(bad).map(n=>NAMES[n-1]).join('; '):'Barcha mavzular yaxshi o\\'zlashtirilgan!'}<\/p>`}}\nwindow.onresize=drawAll;build();\n<\/script><\/body><\/html>\n", "<!DOCTYPE html>\n<html lang=\"uz\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>6-mavzu: O‘tkazgichlarda elektr zaryadlarining taqsimlanishi<\/title>\n<style>\n:root{--bg:#f6f7fb;--fg:#1c2130;--card:#fff;--mut:#5b6478;--bd:#dde1ec;--ac:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151d;--fg:#e8ebf3;--card:#1b2030;--mut:#9aa3b8;--bd:#2c3348;--ac:#6ea0ff}}\n:root[data-theme=dark]{--bg:#12151d;--fg:#e8ebf3;--card:#1b2030;--mut:#9aa3b8;--bd:#2c3348;--ac:#6ea0ff}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nmain{max-width:860px;margin:0 auto;padding:14px}\nh1{font-size:1.3rem;margin:.2em 0}h2{font-size:1.15rem;margin:.3em 0}\nnav{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}\nnav button{flex:1;padding:10px 4px;font-size:.95rem}\nbutton,select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer}\nbutton.on{background:var(--ac);color:#fff;border-color:var(--ac)}\n.sec{display:none}.sec.on{display:block}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}\n.note{border-left:5px solid var(--ac)}\n.f{font-family:Georgia,\"Times New Roman\",serif;font-size:1.1rem;background:var(--bg);border-radius:8px;padding:6px 10px;margin:6px 0;overflow-x:auto}\ncanvas{width:100%;height:auto;display:block;background:var(--bg);border-radius:10px}\n.ctl,.btns{display:flex;flex-wrap:wrap;gap:8px 16px;margin:10px 0;align-items:center}\n.ctl label{display:flex;gap:8px;align-items:center;flex-wrap:wrap}\ninput[type=range]{width:180px;max-width:100%}\nsmall,.mut{color:var(--mut)}\ntable{border-collapse:collapse;width:100%;font-size:.95rem}td,th{border:1px solid var(--bd);padding:4px 8px;text-align:right}th:first-child,td:first-child{text-align:left}\n.q p{margin:.6em 0 .3em;font-weight:600}.q button{display:block;width:100%;text-align:left;margin:4px 0}\n.ok{background:#1f9d55!important;color:#fff!important}.bad{background:#d64545!important;color:#fff!important}\n.ex{font-size:.95rem;color:var(--mut)}\ninput[type=number]{font:inherit;width:120px;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}\n.pos{color:#e5484d}.neg{color:#3b82f6}\n<\/style><\/head><body><main>\n<div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px\"><h1>6-MAVZU: O‘tkazgichlarda elektr zaryadlarining taqsimlanishi<\/h1><button id=\"th\" title=\"Yorug‘/qorong‘i\">◐<\/button><\/div>\n<nav><button class=\"on\" data-t=\"1\">1. Muvozanat<\/button><button data-t=\"2\">2. Sirt zichligi<\/button><button data-t=\"3\">3. Egrilik va tatbiq<\/button><\/nav>\n\n<section class=\"sec on\" id=\"s1\">\n<div class=\"card note\"><b>Esda tuting:<\/b> o‘tkazgichda erkin zaryadlar tashqi maydon ta’sirida shu qadar siljiydiki, ichki maydon nolga tushadi. Muvozanatda butun o‘tkazgich ekvipotensial, ortiqcha zaryad esa faqat sirtda joylashadi.<\/div>\n<div class=\"card\"><h2>Nazariya<\/h2>\n<p>Metallda erkin elektronlar bor. Statik muvozanatda ularga kuch ta’sir etmaydi, demak:<\/p>\n<div class=\"f\">E<sub>ich<\/sub> = 0 &nbsp;&nbsp; φ = const &nbsp;&nbsp; E<sub>⊥<\/sub> sirtga, E<sub>τ<\/sub> = 0 &nbsp;&nbsp; E = σ/ε₀<\/div>\n<small>σ — sirt zaryad zichligi (C/m²), ε₀ = 8,85·10⁻¹² F/m. Agar E<sub>τ<\/sub> ≠ 0 bo‘lsa, zaryadlar sirt bo‘ylab siljib, muvozanat buzilardi. Tashqi maydonda induksiyalangan zaryadlar ichki maydonni kompensatsiyalaydi: shu sababli Faraday qafasi ichi himoyalangan.<\/small><\/div>\n<div class=\"card\"><h2>Simulyatsiya: neytral o‘tkazgich tashqi maydonda<\/h2>\n<canvas id=\"c1\" width=\"640\" height=\"320\"><\/canvas>\n<div class=\"ctl\"><label>Tashqi maydon E₀: <b id=\"v1\">5<\/b> kV/m <input type=\"range\" id=\"r1\" min=\"0\" max=\"10\" step=\"0.5\" value=\"5\"><\/label><label><input type=\"checkbox\" id=\"f1\"> Faraday qafasi (to‘r)<\/label><\/div>\n<div class=\"btns\"><button data-s=\"1\" data-a=\"go\">Boshlash<\/button><button data-s=\"1\" data-a=\"stop\">To‘xtatish<\/button><button data-s=\"1\" data-a=\"re\">Qayta boshlash<\/button><\/div>\n<div id=\"o1\"><\/div>\n<small><span class=\"neg\">●<\/span> elektron, <span class=\"pos\">●<\/span> musbat (elektronlari ketgan) sirt, sariq strelka — maydon. <b>Model soddalashtirilgan:<\/b> elektronlarning siljishi eksponensial relaksatsiya (p = 1 − e<sup>−t/τ<\/sup>) bilan sifat jihatdan ko‘rsatilgan; tashqi maydonning o‘tkazgich yaqinidagi egilishi chizilmagan.<\/small><\/div>\n<div class=\"card q\" id=\"z1\"><\/div><\/section>\n\n<section class=\"sec\" id=\"s2\">\n<div class=\"card note\"><b>Esda tuting:<\/b> zaryadlangan o‘tkazgichda bir xil ishorali zaryadlar bir-birini itaradi va sirtga chiqib joylashadi. Ichi bo‘sh bo‘lsa ham, zaryad faqat tashqi sirtda bo‘ladi. Sirt zichligi σ shakl bo‘yicha o‘zgaradi.<\/div>\n<div class=\"card\"><h2>Nazariya<\/h2>\n<div class=\"f\">σ = dq/dS &nbsp;&nbsp; E = σ/ε₀ &nbsp;&nbsp; σ<sub>shar<\/sub> = q/(4πR²)<\/div>\n<small>Gauss teoremasi: o‘tkazgich ichida yopiq sirt bo‘ylab ∮E·dS = 0, demak ichida (bo‘shliqda ham) q<sub>ich<\/sub> = 0. Sirtga yaqin kichik silindr uchun E·ΔS = σΔS/ε₀ ⇒ E = σ/ε₀. q — zaryad, R — shar radiusi.<\/small><\/div>\n<div class=\"card\"><h2>Simulyatsiya: zaryadlarning sirtga chiqishi<\/h2>\n<canvas id=\"c2\" width=\"640\" height=\"320\"><\/canvas>\n<div class=\"ctl\"><label>Shakl: <select id=\"s2x\"><option value=\"0\">Shar<\/option><option value=\"1\">Ellips<\/option><option value=\"2\">Tekis plastina<\/option><\/select><\/label>\n<label>Zaryad q: <b id=\"v2\">40<\/b> nC <input type=\"range\" id=\"r2\" min=\"10\" max=\"90\" step=\"1\" value=\"40\"><\/label><label><input type=\"checkbox\" id=\"f2\" checked> Kuch va ekvipotensial chiziqlar<\/label><\/div>\n<div class=\"btns\"><button data-s=\"2\" data-a=\"go\">Boshlash<\/button><button data-s=\"2\" data-a=\"stop\">To‘xtatish<\/button><button data-s=\"2\" data-a=\"re\">Qayta boshlash<\/button><\/div>\n<div id=\"o2\"><\/div>\n<small>Rang halqasi: σ ning nisbiy zichligi (ko‘k — kam, qizil — ko‘p). <b>Model soddalashtirilgan:<\/b> ko‘ndalang kesim 2D da, har bir nuqta 1 nC, zarralar Kulon itarishi (1/r²) bilan harakatlanadi va o‘tkazgich chegarasidan chiqmaydi (sirt bo‘ylab erkin sirpanadi). Kuch va ekvipotensial chiziqlar sifat jihatidan chizilgan, aniq hisob emas.<\/small><\/div>\n<div class=\"card q\" id=\"z2\"><\/div><\/section>\n\n<section class=\"sec\" id=\"s3\">\n<div class=\"card note\"><b>Esda tuting:<\/b> egrilik radiusi kichik joyda (uchda) zaryad zichligi va maydon kuchi katta bo‘ladi: σ ~ 1/R. Uchli qismda maydon havoni ionlashtirishi mumkin (korona), shuning uchun amaliyotda uchlar ham foydalaniladi, ham yaxlitlanadi.<\/div>\n<div class=\"card\"><h2>Nazariya<\/h2>\n<div class=\"f\">φ₁ = φ₂ ⇒ q₁/R₁ = q₂/R₂ &nbsp;&nbsp; q₁/q₂ = R₁/R₂ &nbsp;&nbsp; σ₁/σ₂ = R₂/R₁<\/div>\n<small>Sim bilan ulangan ikki shar bitta o‘tkazgich: potensial bir xil φ = kq/R. Zaryad kattaroq sharda ko‘p, ammo zichlik kichik sharda katta. E = σ/ε₀; havoda E ≈ 3 MV/m dan oshsa korona razryadi boshlanadi.<\/small><\/div>\n<div class=\"card\"><h2>Simulyatsiya: sim bilan ulangan ikki shar<\/h2>\n<canvas id=\"c3\" width=\"640\" height=\"320\"><\/canvas>\n<div class=\"ctl\"><label>R₁: <b id=\"v3\">10<\/b> sm <input type=\"range\" id=\"r3\" min=\"2\" max=\"12\" step=\"0.5\" value=\"10\"><\/label>\n<label>R₂: <b id=\"v4\">2<\/b> sm <input type=\"range\" id=\"r4\" min=\"0.2\" max=\"12\" step=\"0.1\" value=\"2\"><\/label>\n<label>Jami Q: <b id=\"v5\">300<\/b> nC <input type=\"range\" id=\"r5\" min=\"10\" max=\"1000\" step=\"10\" value=\"300\"><\/label><\/div>\n<div class=\"btns\"><button data-s=\"3\" data-a=\"go\">Boshlash<\/button><button data-s=\"3\" data-a=\"stop\">To‘xtatish<\/button><button data-s=\"3\" data-a=\"re\">Qayta boshlash<\/button><\/div>\n<small>R₂ ni juda kichik qilsangiz (0,2–0,5 sm) u igna uchiga mos keladi. Boshida zaryad teng bo‘lingan, ulanganda qayta taqsimlanadi.<\/small>\n<table><tr><th><\/th><th>q (nC)<\/th><th>σ (µC/m²)<\/th><th>E (kV/m)<\/th><th>φ (kV)<\/th><\/tr><tbody id=\"tb\"><\/tbody><\/table>\n<div id=\"o3\"><\/div>\n<small><b>Model soddalashtirilgan:<\/b> sharlar bir-biridan uzoq (ta’siri e’tiborga olinmaydi), simning sig‘imi nol; qayta taqsimlanish eksponensial vaqt bilan ko‘rsatilgan (τ ~ 0,6 s, haqiqiy vaqt ~ ns). Korona chegarasi 3 MV/m.<\/small><\/div>\n<div class=\"card\"><h2>Amaliy tatbiqlar<\/h2>\n<div class=\"btns\" id=\"apb\"><\/div>\n<canvas id=\"ap\" width=\"640\" height=\"240\"><\/canvas><p id=\"at\"><\/p><\/div>\n<div class=\"card q\" id=\"z3\"><\/div><\/section>\n<\/main>\n<script>\nconst $=s=>document.querySelector(s),V=id=>+$('#'+id).value,fg=()=>getComputedStyle(document.body).color;\nconst RED='#e5484d',BLU='#3b82f6',YEL='#d9a400',E0=8.854e-12;\nconst X1=$('#c1').getContext('2d'),X2=$('#c2').getContext('2d'),X3=$('#c3').getContext('2d'),XA=$('#ap').getContext('2d');\nfunction arr(x,a,b,c,d,col){x.strokeStyle=x.fillStyle=col;x.lineWidth=2;x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke();const t=Math.atan2(d-b,c-a);x.beginPath();x.moveTo(c,d);x.lineTo(c-8*Math.cos(t-.4),d-8*Math.sin(t-.4));x.lineTo(c-8*Math.cos(t+.4),d-8*Math.sin(t+.4));x.fill()}\nfunction dot(x,a,b,r,col){x.fillStyle=col;x.beginPath();x.arc(a,b,r,0,7);x.fill()}\nlet cur=1;const S={};\n/* ---- 1 ---- */\nS[1]={run:true,init(){this.p=0;this.t=0;this.e=[...Array(36)].map(()=>[Math.random(),Math.random(),Math.random()*6.28])},\nstep(dt){this.p+=(1-this.p)*Math.min(1,dt*1.5);this.t+=dt},\ndraw(){const x=X1,f=fg(),E=V('r1'),p=this.p,fa=$('#f1').checked,L=210,R=430,T=90,B=230;x.clearRect(0,0,640,320);\nfor(let y=30;y<=300;y+=30){if(E<.1)break;if(y<T-5||y>B+5)arr(x,20,y,20+580*E/10,y,YEL);else{arr(x,20,y,20+150*E/10,y,YEL);arr(x,450,y,450+150*E/10,y,YEL);const l=190*E/10*(1-p);if(l>3)arr(x,L+10,y,L+10+l,y,YEL)}}\nx.fillStyle='rgba(128,128,128,.18)';x.fillRect(L,T,R-L,B-T);x.strokeStyle=f;x.lineWidth=3;x.strokeRect(L,T,R-L,B-T);\nif(fa){x.lineWidth=1;x.strokeStyle='#888';x.beginPath();for(let i=L+20;i<R;i+=20){x.moveTo(i,T);x.lineTo(i,B)}for(let j=T+20;j<B;j+=20){x.moveTo(L,j);x.lineTo(R,j)}x.stroke();x.fillStyle=f;x.strokeStyle=f;x.strokeRect(300,140,60,50);x.font='13px sans-serif';x.fillText('asbob',308,170)}\nconst sh=E/10*.9;this.e.forEach(e=>{let px=L+12+e[0]*(R-L-24);px-=p*sh*(px-L-8);const py=T+10+e[1]*(B-T-20);dot(x,px+Math.sin(this.t*3+e[2])*2,py+Math.cos(this.t*3+e[2])*2,4,BLU)});\nconst n=Math.round(p*E*2);for(let k=0;k<n;k++){const y=T+10+(B-T-20)*(k+.5)/n;dot(x,L+5,y,4,BLU);dot(x,R-5,y,5,RED)}\nx.fillStyle=f;x.font='14px sans-serif';x.fillText('E₀ = '+E.toFixed(1)+' kV/m',20,16);\n$('#o1').innerHTML='<b>E<sub>ich<\/sub> = '+(E*(1-p)).toFixed(2)+' kV/m<\/b> &nbsp; σ = ε₀E₀p = '+(8.854*E*p).toFixed(1)+' nC/m² &nbsp; p = '+(p*100).toFixed(0)+'%'}};\n/* ---- 2 ---- */\nconst SH=[[95,95],[150,60],[170,10]];\nS[2]={run:true,init(){const s=SH[$('#s2x').value],n=V('r2');this.a=s[0];this.b=s[1];this.P=[];for(let i=0;i<n;i++){const r=Math.sqrt(Math.random())*.5,t=Math.random()*6.283;this.P.push([r*this.a*Math.cos(t),r*this.b*Math.sin(t)])}this.m=9},\nstep(){const P=this.P,a=this.a,b=this.b;let mx=0;for(let it=0;it<2;it++){const D=P.map(()=>[0,0]);\nfor(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const dx=P[i][0]-P[j][0],dy=P[i][1]-P[j][1],d2=dx*dx+dy*dy+9,f=600/(d2*Math.sqrt(d2));D[i][0]+=dx*f;D[i][1]+=dy*f;D[j][0]-=dx*f;D[j][1]-=dy*f}\nP.forEach((q,i)=>{let u=D[i][0],v=D[i][1];const m=Math.hypot(u,v);if(m>3){u*=3/m;v*=3/m}q[0]+=u;q[1]+=v;const rr=(q[0]/a)**2+(q[1]/b)**2;if(rr>1){const s=1/Math.sqrt(rr);q[0]*=s;q[1]*=s}mx=Math.max(mx,m)})}this.m=mx},\ndraw(){const x=X2,f=fg(),a=this.a,b=this.b,P=this.P;x.clearRect(0,0,640,320);x.save();x.translate(320,160);\nconst ln=$('#f2').checked;const N=90,cn=[];let mc=1;\nfor(let i=0;i<N;i++){const t=i/N*6.283,px=a*Math.cos(t),py=b*Math.sin(t);let c=0;P.forEach(q=>{if(Math.hypot(q[0]-px,q[1]-py)<25)c++});cn.push(c);mc=Math.max(mc,c)}\nif(ln){x.strokeStyle='#888';x.setLineDash([4,4]);x.lineWidth=1;[16,32,48].forEach(d=>{x.beginPath();x.ellipse(0,0,a+d,b+d,0,0,7);x.stroke()});x.setLineDash([])}\nx.fillStyle='rgba(128,128,128,.15)';x.beginPath();x.ellipse(0,0,a,b,0,0,7);x.fill();\nfor(let i=0;i<N;i++){const t=i/N*6.283,px=a*Math.cos(t),py=b*Math.sin(t);let nx=Math.cos(t)/a,ny=Math.sin(t)/b;const m=Math.hypot(nx,ny);nx/=m;ny/=m;\nif(ln&&i%3==0)arr(x,px+nx*3,py+ny*3,px+nx*(16+cn[i]/mc*30),py+ny*(16+cn[i]/mc*30),YEL);\nx.strokeStyle='hsl('+(240-240*cn[i]/mc)+',85%,50%)';x.lineWidth=6;x.beginPath();x.moveTo(px,py);x.lineTo(px+nx*-6,py+ny*-6);x.stroke()}\nx.strokeStyle=f;x.lineWidth=2;x.beginPath();x.ellipse(0,0,a,b,0,0,7);x.stroke();\nP.forEach(q=>dot(x,q[0],q[1],3.2,RED));x.fillStyle=f;x.font='13px sans-serif';if(b>30)x.fillText('E = 0',-18,4);x.restore();\nconst ins=P.filter(q=>(q[0]/a)**2+(q[1]/b)**2<.7).length;\n$('#o2').innerHTML='q = '+P.length+' nC &nbsp; ichki hajmda (r&lt;0,84R) zaryad: <b>'+ins+'<\/b> &nbsp; holat: <b>'+(this.m<.05?'muvozanat':'muvozanatga kelmoqda…')+'<\/b>'}};\n/* ---- 3 ---- */\nS[3]={run:true,init(){this.q=V('r5')/2;this.t=0},\ntgt(){const a=V('r3'),b=V('r4');return V('r5')*a/(a+b)},\nstep(dt){this.q+=(this.tgt()-this.q)*Math.min(1,dt*1.6);this.t+=dt},\ndraw(){const x=X3,f=fg(),R1=V('r3'),R2=V('r4'),Q=V('r5'),q1=this.q,q2=Q-q1,r1=R1*8,r2=Math.max(3,R2*8),x1=20+r1,x2=620-r2,y=160,tg=this.tgt(),t=this.t;x.clearRect(0,0,640,320);\nx.strokeStyle=f;x.lineWidth=2;x.beginPath();x.moveTo(x1+r1,y);x.lineTo(x2-r2,y);x.stroke();\n[[x1,r1],[x2,r2]].forEach(s=>{x.fillStyle='rgba(128,128,128,.2)';x.beginPath();x.arc(s[0],y,s[1],0,7);x.fill();x.stroke()});\nconst n1=Math.round(40*q1/Q),n2=40-n1;\nfor(let k=0;k<n1;k++){const a=k*6.283/n1+t*.3;dot(x,x1+r1*Math.cos(a),y+r1*Math.sin(a),2.5,RED)}\nfor(let k=0;k<n2;k++){const a=k*6.283/n2+t*.3;dot(x,x2+r2*Math.cos(a),y+r2*Math.sin(a),2.5,RED)}\nif(Math.abs(q1-tg)>.02*Q){const d=q1>tg?1:-1,a=x1+r1,w=x2-r2-a;for(let k=0;k<6;k++){let u=((t*.8*d+k/6)%1+1)%1;dot(x,a+w*u,y,3.5,RED)}}\nconst sg=(q,R)=>q*1e-9/(4*Math.PI*(R*.01)**2),s1=sg(q1,R1),s2=sg(q2,R2),e1=s1/E0,e2=s2/E0;\nif(e2>3e6||e1>3e6){const cx=e2>3e6?x2:x1,cr=e2>3e6?r2:r1,g=x.createRadialGradient(cx,y,cr,cx,y,cr+40);g.addColorStop(0,'rgba(170,90,255,.6)');g.addColorStop(1,'rgba(170,90,255,0)');x.fillStyle=g;x.beginPath();x.arc(cx,y,cr+40,0,7);x.fill();\nfor(let i=0;i<18;i++){const a=i*.35-1.6,d=(t*70+i*9)%45,al=1-d/45;x.fillStyle='rgba(190,120,255,'+al+')';x.beginPath();x.arc(cx+(cr+3+d)*Math.cos(a),y+(cr+3+d)*Math.sin(a),2.5,0,7);x.fill()}\nx.fillStyle=f;x.font='14px sans-serif';x.fillText('KORONA: havo ionlashdi, \"elektr shamoli\"',180,30)}\nconst ph=(q,R)=>.8988*q/R;\n$('#tb').innerHTML=[['Shar 1',q1,s1,e1,ph(q1,R1)],['Shar 2',q2,s2,e2,ph(q2,R2)]].map(r=>'<tr><td>'+r[0]+'<\/td><td>'+r[1].toFixed(1)+'<\/td><td>'+(r[2]*1e6).toFixed(2)+'<\/td><td>'+(r[3]/1e3).toFixed(0)+'<\/td><td>'+r[4].toFixed(2)+'<\/td><\/tr>').join('');\n$('#o3').innerHTML='σ₁/σ₂ = '+(s1/s2).toFixed(2)+' &nbsp; (R₂/R₁ = '+(R2/R1).toFixed(2)+') &nbsp; q₁/q₂ = '+(q1/q2).toFixed(2)+' &nbsp; E<sub>2<\/sub>/3 MV/m = '+(e2/3e6*100).toFixed(0)+'%'}};\n/* ---- applications ---- */\nconst APP=[['Yashinqaytargich','Uchli sterjen yerga ulangan. Uchida E katta bo‘lgani uchun zaryad tinch oqib chiqadi va chaqmoqni binoga emas, sterjenga yo‘naltiradi.'],['Van de Graaff','Tasma zaryadni ichki bo‘shliqqa olib kiradi; zaryad faqat tashqi sirtga chiqadi, shuning uchun sfera yuz minglab voltgacha zaryadlanadi.'],['Faraday qafasi','Metall qobiq ichida E = 0: tashqi zaryad/razryad qafas sirtida oqib o‘tadi, ichidagilar himoyalangan (mashina, ekranlangan kabel).'],['Korona yo‘qotishlari','Yuqori kuchlanishli simda sirtdagi E havoning teshilish maydoniga yaqinlashsa, atrofdagi havo ionlashadi va energiya yo‘qotiladi; shuning uchun simlar yo‘g‘on/tutamli qilinadi.'],['Uchlarni yaxlitlash','Uchli detalda :['Vakuumda: F₀ = 9·10⁹·12·10⁻¹²/0,3² = 1,2 N.','Suvda: F = F₀/ε = 1,2/81.','F ≈ 0,0148 N.'],a:'F ≈ 1,48·10⁻² N'}];\nconst TH=[\n`<b>e = 1,6·10⁻¹⁹ C<\/b>. Zaryad kvantlanadi: <b>q = ±N·e<\/b>. Elektron ortiqcha → jism <span class=neg>manfiy<\/span>, yetishmasa → <span class=pos>musbat<\/span>. Saqlanish: yopiq sistemada Σq o'zgarmaydi. Bir xil sharlar tekkanda: <b>q' = (q₁+q₂)/2<\/b>.`,\n`Bir o'q bo'ylab kuchlar algebraik qo'shiladi (o'ngga +, chapga −). Bir xil ishora → itarish, har xil → tortish. Muvozanat: <b>r₁/r₂ = √(q₁/q₂)<\/b>. Bir xil ishorali zaryadlar <i>orasida<\/i>, har xil ishoralilarda <i>tashqarisida<\/i> (kichik zaryad yonida).`,\n`Kuchlar vektor sifatida qo'shiladi: Fx = ΣFᵢx, Fy = ΣFᵢy, |F| = √(Fx²+Fy²). Muhitda <b>F = F₀/ε<\/b> (havo ≈1, kerosin ≈2, shisha ≈7, suv 81). Kuch vektorlari <span class=frc>yashil<\/span>, natijaviy <span class=res>binafsha<\/span>.`];\nconst SIM=[\n`<h2>Simulyatsiya A: jism zaryadi<\/h2><div class=box><canvas id=c1 height=150><\/canvas>${sl('n1',-100,100,30,1,'Ortiqcha elektronlar (×10¹⁰; manfiy = yetishmaydi)')}<div id=i1><\/div><\/div>\n<h2>Simulyatsiya B: ikki bir xil shar<\/h2><div class=box>${sl('a1',-10,10,-6,1,'Shar 1, µC')}${sl('b1',-10,10,2,1,'Shar 2, µC')}<button id=tb>Tekkizish<\/button> <button id=ab>Ajratish<\/button><div id=o1><\/div><\/div>`,\n`<h2>Simulyatsiya: muvozanat nuqtasi<\/h2><div class=box><canvas id=c2 height=200><\/canvas>${sl('s1',1,9,4,1,'|q₁|, µC (x=0)')}${sl('s2',1,9,1,1,'|q₂|, µC (x=30 sm)')}<button id=g1>q₁ ishorasi: +<\/button> <button id=g2>q₂ ishorasi: +<\/button><p style=\"font-size:.85rem;color:var(--m)\">Sinov zaryadini (+1 µC) sudrang. Yuqorida F(x) grafigi (logarifmik masshtab).<\/p><div id=i2><\/div><\/div>`,\n`<h2>Simulyatsiya A: muhit ta'siri<\/h2><div class=box>${sl('bq1',1,9,2,1,'q₁, µC')}${sl('bq2',1,9,6,1,'q₂, µC')}${sl('br',5,50,30,1,'r, sm')}<div id=bars><\/div><\/div>\n<h2>Simulyatsiya B: geometrik<\/h2><div class=box><select id=sh><option value=3>Teng tomonli uchburchak<\/option><option value=4>Kvadrat<\/option><\/select> <select id=md><option value=1>Vakuum<\/option><option value=2>Kerosin<\/option><option value=7>Shisha<\/option><option value=81>Suv<\/option><\/select>${sl('a3',5,30,20,1,'Tomon a, sm')}${sl('k1',-9,9,4,1,'q₁, µC (chap-past)')}${sl('k2',-9,9,4,1,'q₂, µC (o\\'ng-past)')}${sl('k3',-9,9,4,1,'q₃, µC (chap-yuqori, kvadratda)')}<canvas id=c3 height=280><\/canvas><div id=i3><\/div><small>Sinov zaryadi +1 µC oxirgi uchda.<\/small><\/div>`];\n// ===== Mustaqil masalalar generatorlari =====\nconst GEN=[[\n()=>{const n=R(2,9),a=-n*160;return{q:`Jismda ${n}·10¹² ta ortiqcha elektron bor. Zaryadi necha nC (ishorasi bilan)?`,a,s:`Q = −N·e = −${n}·10¹²·1,6·10⁻¹⁹ = −${F(n*1.6e-7)} C = ${a} nC`}},\n()=>{const a=R(2,8),b=R(1,a-1),q=(b-a)/2,N=(q+a)*1e-6/e;return{q:`Bir xil sharlar −${a} µC va +${b} µC. Tekkizilib ajratildi. Har birining zaryadi necha µC?`,a:q,s:`q' = (−${a}+${b})/2 = ${q} µC. O'tgan elektronlar: N = |q'−q₁|/e = ${q+a}·10⁻⁶/1,6·10⁻¹⁹ = ${F(N)} ta.`}},\n()=>{const a=R(4,10),b=R(1,3),r=R(10,40),q=(a+b)/2,f=k*(q*1e-6)**2/(r/100)**2;return{q:`Bir xil sharlar +${a} µC va +${b} µC. Tekkizilib ajratildi va ${r} sm masofaga qo'yildi. Ular orasidagi kuch necha N?`,a:f,s:`q' = (${a}+${b})/2 = ${q} µC. F = k·q'²/r² = 9·10⁹·(${q}·10⁻⁶)²/${r/100}² = ${F(f)} N`}}],[\n()=>{const a=R(1,9),b=R(1,9),r=R(5,30),f=k*a*b*1e-12/(r/100)**2;return{q:`q₁ = ${a} µC va q₂ = ${b} µC (bir xil ishorali) ${r} sm masofada. Kuch necha N?`,a:f,s:`F = k·q₁q₂/r² = 9·10⁹·${a*b}·10⁻¹²/${r/100}² = ${F(f)} N`}},\n()=>{const s=()=>P([-1,1])*R(1,6),a=s(),b=s(),c=s(),r=R(5,15),f=k*b*(a-c)*1e-12/(r/100)**2;return{q:`Bir chiziqda teng oraliq (${r} sm) bilan q₁ = ${a}, q₂ = ${b}, q₃ = ${c} µC. Q₂ ga natijaviy kuch (N; o'ngga +, chapga −)?`,a:f,s:`Q₁ dan kuch (o'ngga): k·q₁q₂/r² ishorasi bilan; Q₃ dan (chapga): −k·q₂q₃/r². Jami F = k·q₂(q₁−q₃)/r² = 9·10⁹·${b}·(${a-c})·10⁻¹²/${r/100}² = ${F(f)} N`}},\n()=>{const [n,m]=P([[2,1],[3,1],[3,2],[4,1]]),d=(n+m)*R(2,8),x=d*n/(n+m);return{q:`q₁ = +${n*n} µC va q₂ = +${m*m} µC orasidagi masofa ${d} sm. Uchinchi zaryad q₁ dan necha sm da muvozanatda bo'ladi?`,a:x,s:`r₁/r₂ = √(q₁/q₂) = ${n}/${m}; r₁+r₂ = ${d} sm → r₁ = ${d}·${n}/${n+m} = ${x} sm`}}],[\n()=>{const a=R(1,9),b=R(1,9),r=R(5,30),E=P([2,7,81]),f=k*a*b*1e-12/(r/100)**2/E;return{q:`q₁ = ${a} µC va q₂ = ${b} µC, r = ${r} sm, muhit ε = ${E}. Kuch necha N?`,a:f,s:`F₀ = 9·10⁹·${a*b}·10⁻¹²/${r/100}² = ${F(f*E)} N; F = F₀/ε = ${F(f)} N`}},\n()=>{const q=R(2,9),a=R(10,40),f=Math.sqrt(3)*k*(q*1e-6)**2/(a/100)**2;return{q:`Tomoni ${a} sm bo'lgan teng tomonli uchburchakning har uchida +${q} µC. Bir uchidagi zaryadga ta'sir etuvchi kuch necha N?`,a:f,s:`Ikki kuch F₁ = F₂ = kq²/a² = ${F(f/Math.sqrt(3))} N, orasidagi burchak 60°. F = 2F₁cos30° = √3·F₁ = ${F(f)} N`}},\n()=>{const q=R(2,6),a=R(10,30),f0=k*(q*1e-6)**2/(a/100)**2,f=f0*(Math.SQRT2+.5)/2;return{q:`Kvadrat tomoni ${a} sm; uchta uchida +${q} µC. To'rtinchi uchdagi +${q} µC ga ε = 2 muhitda ta'sir etuvchi kuch necha N?`,a:f,s:`F₀ = kq²/a² = ${F(f0)} N. Yonlardagi ikki kuch (perpendikulyar): √2·F₀; diagonaldagi: F₀/2 (bir tomonga). Vakuumda F = F₀(√2+0,5) = ${F(f0*(Math.SQRT2+.5))} N; ε=2 da: ${F(f)} N`}}]];\nconst V={};\nconst TST=[{q:'Jismdan 2 ta elektron ketsa, zaryadi qancha bo\\'ladi?',o:['−3,2·10⁻¹⁹ C','+3,2·10⁻¹⁹ C','+1,6·10⁻¹⁹ C'],c:1,e:'+2e = +3,2·10⁻¹⁹ C.'},\n{q:'Bir xil ishorali ikki zaryad orasida muvozanat nuqtasi qayerda?',o:['Zaryadlar orasida, kichigiga yaqin','Tashqarida','Aynan o\\'rtada'],c:0,e:'r₁/r₂ = √(q₁/q₂): kichik zaryadga yaqinroq.'},\n{q:'Suvda (ε = 81) Kulon kuchi qanday o\\'zgaradi?',o:['81 marta ortadi','81 marta kamayadi','O\\'zgarmaydi'],c:1,e:'F = F₀/ε.'}];\nconst FACT=['Bir tomchi suvda ~10²³ ta elektron bor, lekin ular protonlar bilan muvozanatda — shuning uchun jism odatda neytral.','Yerdagi barcha zaryadlar yig\\'indisi juda kichik: yashin bir daqiqada ~10⁹ J tashiydi, lekin bulutlar zaryadi bir necha kulon xolos.','Suvning ε = 81 bo\\'lgani uchun tuz suvda ionlarga ajraladi: ionlar orasidagi tortishish 81 marta kuchsizlanadi.'];\nconst SUM=['Q = ±N·e; Σq saqlanadi; tekkanda q\\' = (q₁+q₂)/2.','Bir o\\'qda kuchlar ishora bilan qo\\'shiladi; muvozanat r₁/r₂ = √(q₁/q₂).','Vektor yig\\'indi tashkil etuvchilar orqali; muhitda F = F₀/ε.'];\n// ===== Sahifa qurish =====\nconst app=$('app'),nav=$('nav');let cur=0;\nNAMES.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>show(i);nav.appendChild(b)});\nfunction tst(s,i){const t=TST[s];return`<h2>Test<\/h2><div class=box><b>${t.q}<\/b>${t.o.map((o,j)=>`<button class=opt onclick=\"ans(this,${s},${j})\">${o}<\/button>`).join('')}<div id=te${s}><\/div><\/div>`}\nfunction ans(b,s,j){const t=TST[s],p=b.parentNode;p.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.style.borderColor=j==t.c?'var(--f)':'var(--p)';$('te'+s).innerHTML=(j==t.c?'<span class=ok>To\\'g\\'ri!<\/span> ':'<span class=no>Noto\\'g\\'ri.<\/span> To\\'g\\'ri javob: '+t.o[t.c]+'. ')+t.e}\n[0,1,2].forEach(s=>{\nlet h=`<section class=sec id=s${s}><div class=box>${TH[s]}<\/div><h2>Namunaviy masala<\/h2><div class=box><b>Berilgan:<\/b> ${EX[s].g}<br><b>Topish kerak:<\/b> ${EX[s].f}<div id=ex${s}>${EX[s].st.map(x=>`<div class=st>${x}<\/div>`).join('')}<\/div><button onclick=\"nx(${s})\" id=nb${s}>Keyingi qadam<\/button><div id=ea${s} class=ok><\/div><\/div>${SIM[s]}<h2>Mustaqil masalalar<\/h2>`;\n['Oson','O\\'rta','Qiyin'].forEach((d,i)=>h+=`<div class=box><b>${d}:<\/b> <span id=pq${s}${i}><\/span><br><input type=text id=in${s}${i}> <button onclick=\"chk(${s},${i})\">Tekshirish<\/button> <button onclick=\"sol(${s},${i})\">Yechimni ko'rish<\/button> <button onclick=\"nw(${s},${i})\">Yangi variant<\/button><div id=pr${s}${i}><\/div><\/div>`);\nh+=`<h2>Xulosa<\/h2><div class=box>${SUM[s]}<\/div><div class=box><b>Bilib oling:<\/b> ${FACT[s]}<\/div>${tst(s)}<\/section>`;app.insertAdjacentHTML('beforeend',h)});\nfunction nx(s){const l=[...$('ex'+s).children].find(x=>x.style
