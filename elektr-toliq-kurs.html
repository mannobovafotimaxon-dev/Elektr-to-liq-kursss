order-collapse:collapse}td{padding:6px;border-bottom:1px solid var(--ln)}td:last-child{text-align:right;font-weight:600}\n.qz button{display:block;width:100%;text-align:left;margin:6px 0;font-weight:500}\nbutton.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}\n.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--mu)}\n<\/style><\/head><body><main>\n<header><h1>⚡ 6-MAVZU: O‘tkazgichlarda elektr zaryadlarining taqsimlanishi<\/h1>\n<div id=\"sc\"><\/div><div class=\"bar\"><i id=\"bf\"><\/i><\/div>\n<nav><button data-t=\"0\">1. Muvozanat<\/button><button data-t=\"1\">2. Sirt zichligi<\/button><button data-t=\"2\">3. Ulangan sharlar<\/button><\/nav><\/header>\n<div class=\"lg\"><span style=\"color:var(--pos)\">● musbat<\/span><span style=\"color:var(--neg)\">● manfiy<\/span><span style=\"color:var(--fl)\">→ kuch chiziqlari<\/span><span>σ: <b style=\"color:#2b4fff\">ko‘k<\/b> → <b style=\"color:#e01515\">qizil<\/b><\/span><\/div>\n<div id=\"t0\"><\/div><div id=\"t1\" class=\"hid\"><\/div><div id=\"t2\" class=\"hid\"><\/div>\n<\/main>\n<script>\nconst K=8.99e9,EP=8.854e-12,$=(s,e=document)=>e.querySelector(s);\nconst rnd=(a,b,d=0)=>{const f=10**d;return Math.round((a+Math.random()*(b-a))*f)/f};\nconst N=x=>{if(!isFinite(x))return'—';const a=Math.abs(x);if(a!==0&&(a>=1e5||a<1e-2)){const[m,e]=x.toExponential(2).split('e');return m+'·10<sup>'+(+e)+'<\/sup>'}return''+ +x.toPrecision(3)};\nconst cp=(x,a,b)=>Math.min(b,Math.max(a,x)),ez=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,lerp=(a,b,k)=>a+(b-a)*k;\nconst hc=x=>`hsl(${240-240*cp(x,0,1)},85%,50%)`,sg=s=>Math.log10(s+1)/4;\nconst DEF={E0:30,q:10,R:5,Q:60,R1:3,R2:12,hollow:true};\nfunction fit(cv){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1,W=Math.round(r.width*d),H=Math.round(r.height*d);if(cv.width!=W||cv.height!=H){cv.width=W;cv.height=H}const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return[c,r.width,r.height]}\nfunction arrow(c,x1,y1,x2,y2,col,lw,t){c.strokeStyle=c.fillStyle=col;c.lineWidth=lw;c.setLineDash([8,6]);c.lineDashOffset=-t*30;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.setLineDash([]);const a=Math.atan2(y2-y1,x2-x1);c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-10*Math.cos(a-.4),y2-10*Math.sin(a-.4));c.lineTo(x2-10*Math.cos(a+.4),y2-10*Math.sin(a+.4));c.fill()}\nconst dot=(c,x,y,col,r=4)=>{c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill()};\nconst txt=(c,s,x,y,col,al='center',f=15)=>{c.fillStyle=col;c.textAlign=al;c.font='600 '+f+'px system-ui';c.fillText(s,x,y)};\nconst strip=s=>s.replace(/<[^>]+>/g,'');\n\n/* ---- chizmalar ---- */\nconst d1=(c,w,h,P,p,st,t,V)=>{\n const x1=w*.32,x2=w*.68,y1=h*.2,y2=h*.78,e=cp(P.E0/100,0,1),n=4+Math.round(e*8),k=ez(p),m=(x1+x2)/2;\n if(st>=1){c.fillStyle=V.ln;c.fillRect(x1,y1,x2-x1,y2-y1);c.strokeStyle=V.fg;c.lineWidth=2;c.strokeRect(x1,y1,x2-x1,y2-y1)}\n if(st>=4)for(let i=0;i<4;i++){const y=y1+(i+.5)*(y2-y1)/4;arrow(c,4,y,x1-4,y,V.fl,1.5+e*3,t);arrow(c,x2+4,y,w-4,y,V.fl,1.5+e*3,t)}\n if(st>=3){c.fillStyle=hc(e);c.fillRect(x1-3,y1,6,y2-y1);c.fillRect(x2-3,y1,6,y2-y1);\n  for(let i=0;i<n;i++){const y=y1+(i+.5)*(y2-y1)/n,o=((i%3)-1)*12;dot(c,lerp(m+o,x1+11,k),y,V.neg);dot(c,lerp(m-o,x2-11,k),y,V.pos)}\n  txt(c,'– induksiya',x1,y2+20,V.neg);txt(c,'+ induksiya',x2,y2+20,V.pos)}\n if(st>=2)txt(c,'E₀ = '+strip(N(P.E0))+' kV/m (tashqi maydon)',w/2,18,V.fg);\n if(st>=4)txt(c,'E = 0',m,(y1+y2)/2+6,V.fg,'center',22)};\nconst d2=(c,w,h,P,p,st,t,V)=>{\n const cx=w/2,cy=h/2,r=Math.min(16+P.R*3.5,h*.24),k=ez(p),n=6+Math.round(P.q/2),s=P.q*1e-9/(4*Math.PI*(P.R/100)**2)*1e9,E=K*P.q*1e-9/(P.R/100)**2/1e3;\n if(st>=1){c.beginPath();c.arc(cx,cy,r,0,7);if(!P.hollow){c.fillStyle=V.ln;c.fill()}c.strokeStyle=V.fg;c.lineWidth=2;c.setLineDash(P.hollow?[6,4]:[]);c.stroke();c.setLineDash([])}\n if(st>=3){c.beginPath();c.arc(cx,cy,r,0,7);c.strokeStyle=hc(sg(s));c.lineWidth=7;c.stroke();for(let i=0;i<n;i++){const a=i*2*Math.PI/n,ro=lerp(r*(.1+((i*7)%5)*.08),r,k);dot(c,cx+ro*Math.cos(a),cy+ro*Math.sin(a),V.pos)}}\n if(st>=4){const L=12+cp(Math.log10(E+1)/3.5,0,1)*38;for(let i=0;i<16;i++){const a=i*Math.PI/8,ca=Math.cos(a),sa=Math.sin(a);arrow(c,cx+(r+6)*ca,cy+(r+6)*sa,cx+(r+6+L)*ca,cy+(r+6+L)*sa,V.fl,2,t)}txt(c,'E = 0',cx,cy-10,V.fg,'center',18)}\n if(st>=2){c.strokeStyle=V.mu;c.lineWidth=1;c.setLineDash([4,4]);c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+r,cy);c.stroke();c.setLineDash([]);txt(c,'R',cx+r/2,cy+16,V.mu);txt(c,'q = '+P.q+' nC',8,18,V.pos,'left');txt(c,'R = '+P.R+' sm',8,38,V.fg,'left')}\n if(st>=5)txt(c,'σ = '+strip(N(s))+' nC/m²',8,58,V.fg,'left')};\nconst t3=(P,p)=>{const f=P.R1/(P.R1+P.R2),q1=P.Q*(.5+(f-.5)*ez(p)),q2=P.Q-q1,A=r=>4*Math.PI*(r/100)**2;return{q1,q2,s1:q1*1e-9/A(P.R1)*1e9,s2:q2*1e-9/A(P.R2)*1e9,E1:K*q1*1e-9/(P.R1/100)**2,E2:K*q2*1e-9/(P.R2/100)**2,f1:K*q1*1e-9/(P.R1/100),f2:K*q2*1e-9/(P.R2/100)}};\nconst d3=(c,w,h,P,p,st,t,V)=>{\n const cy=h/2-8,sc=Math.min(h*.25,w*.22)/20,r1=Math.max(8,P.R1*sc),r2=Math.max(8,P.R2*sc),x1=w*.2,x2=w*.72,o=t3(P,p),cor=o.E1>=3e6;\n if(st>=2){c.strokeStyle=V.fg;c.lineWidth=3;c.beginPath();c.moveTo(x1+r1,cy);c.lineTo(x2-r2,cy);c.stroke();\n  if(p>0&&p<1){const dr=P.R1<P.R2?1:-1;for(let i=0;i<4;i++){const u=(t*.8+i/4)%1;dot(c,lerp(x1+r1,x2-r2,dr>0?u:1-u),cy,V.pos,3)}}}\n [[x1,r1,o.q1,o.s1,o.E1,P.R1],[x2,r2,o.q2,o.s2,o.E2,P.R2]].forEach(([x,r,q,s,E,R],j)=>{\n  if(st>=1){c.beginPath();c.arc(x,cy,r,0,7);c.fillStyle=V.ln;c.fill();c.strokeStyle=V.fg;c.lineWidth=2;c.stroke()}\n  if(st>=3){c.beginPath();c.arc(x,cy,r,0,7);c.strokeStyle=hc(sg(s));c.lineWidth=6;c.stroke();const n=Math.max(2,Math.round(q/P.Q*30));for(let i=0;i<n;i++){const a=i*2*Math.PI/n;dot(c,x+r*Math.cos(a),cy+r*Math.sin(a),V.pos,3)}}\n  if(st>=4){const L=6+cp(Math.log10(E/1e3+1)/3.5,0,1)*32;c.strokeStyle=V.fl;c.lineWidth=2;for(let i=0;i<10;i++){const a=i*Math.PI/5+.3,ca=Math.cos(a),sa=Math.sin(a);c.beginPath();c.moveTo(x+(r+4)*ca,cy+(r+4)*sa);c.lineTo(x+(r+4+L)*ca,cy+(r+4+L)*sa);c.stroke()}}\n  if(st>=2){txt(c,`R${j+1} = ${R} sm`,x,h-22,V.fg,'center',14);txt(c,`q${j+1} = ${strip(N(q))} nC`,x,h-6,V.pos,'center',14)}});\n if(st>=4&&cor){for(let i=0;i<9;i++){const a=Math.random()*6.28,l=10+Math.random()*22;c.strokeStyle=i%2?'#a855f7':'#f59e0b';c.lineWidth=2;c.beginPath();c.moveTo(x1+r1*Math.cos(a),cy+r1*Math.sin(a));c.lineTo(x1+(r1+l)*Math.cos(a),cy+(r1+l)*Math.sin(a));c.stroke()}txt(c,'⚡ KORONA',x1,cy-r1-30,'#a855f7','center',16)}};\n\n/* ---- masalalar ---- */\nconst mk=(tx,cv,g,f,fo,sb,c,ans,u,h,sc)=>({tx,cv,g,f,fo,sb,cl:c,ans,u,h,sc});\nconst G1=[\n()=>{const s=rnd(20,200),a=s*1e-9/EP/1e3;return mk(`O‘tkazgich sirtidagi zaryad zichligi σ = ${s} nC/m². Sirtga juda yaqin nuqtada maydon kuchlanganligi E ni kV/m da toping.`,'nC → C: ×10⁻⁹; V/m → kV/m: ÷10³',[`σ = ${s} nC/m² = ${s}·10⁻⁹ C/m²`,'ε₀ = 8,854·10⁻¹² F/m'],'E (kV/m)','E = σ/ε₀',`E = ${s}·10⁻⁹ / 8,854·10⁻¹²`,`E = ${N(a*1e3)} V/m = ${N(a)} kV/m`,a,'kV/m',['Sirt yaqinida (tashqarida) E = σ/ε₀.','σ ni avval C/m² ga o‘tkazing: nC = 10⁻⁹ C.','Natijani V/m da oling, keyin 1000 ga bo‘ling.'],{E0:a})},\n()=>{const e=rnd(10,90),a=EP*e*1e3*1e9;return mk(`Metall jism E₀ = ${e} kV/m bir jinsli tashqi maydonga kiritildi. Sirtda induksiyalangan zaryad zichligi σ ni nC/m² da toping.`,'kV/m → V/m: ×10³; C/m² → nC/m²: ×10⁹',[`E₀ = ${e} kV/m = ${e}·10³ V/m`],'σ (nC/m²)','σ = ε₀E₀',`σ = 8,854·10⁻¹² · ${e}·10³`,`σ = ${N(a*1e-9)} C/m² = ${N(a)} nC/m²`,a,'nC/m²',['Muvozanatda sirt yaqinida E = σ/ε₀, bunda E = E₀.','σ = ε₀E₀ — E₀ ni V/m da qo‘ying.','Javobni C/m² dan nC/m² ga o‘tkazing (×10⁹).'],{E0:e})},\n()=>{const e=rnd(20,90),S=rnd(50,400),a=EP*e*1e3*S*1e-4*1e9;return mk(`Yupqa metall plastinka E₀ = ${e} kV/m maydonga perpendikulyar qo‘yildi. Bir yuzining yuzi S = ${S} sm². Shu yuzdagi induksiyalangan zaryad modulini nC da toping.`,'sm² → m²: ×10⁻⁴; kV/m → V/m: ×10³; C → nC: ×10⁹',[`E₀ = ${e}·10³ V/m`,`S = ${S} sm² = ${S}·10⁻⁴ m²`],'q (nC)','σ = ε₀E₀; q = σ·S',`q = 8,854·10⁻¹² · ${e}·10³ · ${S}·10⁻⁴`,`σ = ${N(EP*e*1e3)} C/m²; q = ${N(a*1e-9)} C = ${N(a)} nC`,a,'nC',['Avval σ = ε₀E₀ ni toping.','Zaryad q = σS; yuzni m² da oling (1 sm² = 10⁻⁴ m²).','C dan nC ga o‘tkazing (×10⁹).'],{E0:e})}];\nconst G2=[\n()=>{const q=rnd(5,50),R=rnd(2,10),a=q*1e-9/(4*Math.PI*(R/100)**2)*1e9;return mk(`Radiusi R = ${R} sm bo‘lgan o‘tkazgich sharga q = ${q} nC zaryad berildi. Sirt zaryad zichligi σ ni nC/m² da toping.`,'sm → m: ×10⁻²; nC → C: ×10⁻⁹',[`q = ${q}·10⁻⁹ C`,`R = ${R} sm = ${R}·10⁻² m`],'σ (nC/m²)','σ = q/(4πR²)',`σ = ${q}·10⁻⁹ / (4π·(${R}·10⁻²)²)`,`4πR² = ${N(4*Math.PI*(R/100)**2)} m²; σ = ${N(a*1e-9)} C/m² = ${N(a)} nC/m²`,a,'nC/m²',['Zaryad sirtda taqsimlanadi, sirt yuzi 4πR².','R ni metrga o‘tkazing, kvadratga ko‘taring.','σ = q / S; javobni ×10⁹ bilan nC/m² ga o‘tkazing.'],{q,R})},\n()=>{const q=rnd(5,40),R=rnd(3,15),a=K*q*1e-9/(R/100)**2/1e3;return mk(`Ichi bo‘sh o‘tkazgich sharga (R = ${R} sm) q = ${q} nC zaryad berildi. Sirtga yaqin tashqi nuqtada E ni kV/m da toping. (Sharning ichida E nimaga teng?)`,'sm → m: ×10⁻²; nC → C: ×10⁻⁹; V/m → kV/m: ÷10³',[`q = ${q}·10⁻⁹ C`,`R = ${R}·10⁻² m`,'k = 8,99·10⁹ N·m²/C²'],'E (kV/m); ichkarida E = ?','E = σ/ε₀ = kq/R²  (ichkarida E = 0)',`E = 8,99·10⁹ · ${q}·10⁻⁹ / (${R}·10⁻²)²`,`E = ${N(a*1e3)} V/m = ${N(a)} kV/m`,a,'kV/m',['Shar sirtida maydon E = σ/ε₀ = kq/R².','Ichi bo‘sh bo‘lsa ham zaryad sirtda — ichkarida E = 0.','R ni m da qo‘ying, oxirida V/m → kV/m.'],{q,R})},\n()=>{const f=rnd(3,30),R=rnd(2,10),a=f*1e3*(R/100)/K*1e9;return mk(`Radiusi R = ${R} sm bo‘lgan o‘tkazgich shar φ = ${f} kV potensialgacha zaryadlandi. Shardagi zaryad q ni nC da toping.`,'kV → V: ×10³; sm → m: ×10⁻²; C → nC: ×10⁹',[`φ = ${f}·10³ V`,`R = ${R}·10⁻² m`],'q (nC)','φ = kq/R ⇒ q = φR/k',`q = ${f}·10³ · ${R}·10⁻² / 8,99·10⁹`,`q = ${N(a*1e-9)} C = ${N(a)} nC`,a,'nC',['Shar potensiali φ = kq/R.','Bu formuladan q ni ifodalang: q = φR/k.','Hamma birliklarni SI ga o‘tkazing, javobni nC da bering.'],{q:a,R})}];\nconst G3=[\n()=>{const a=rnd(2,6),b=rnd(8,20),r=b/a;return mk(`Ikki uzoq joylashgan o‘tkazgich shar ingichka sim bilan ulandi: R₁ = ${a} sm, R₂ = ${b} sm. Sirt zichliklari nisbati σ₁/σ₂ ni toping.`,'Faqat nisbat kerak — sm ni m ga o‘tkazish shart emas (birliklar qisqaradi).',[`R₁ = ${a} sm`,`R₂ = ${b} sm`,'Ulangan ⇒ φ₁ = φ₂'],'σ₁/σ₂','φ₁=φ₂ ⇒ q₁/q₂ = R₁/R₂; σ = q/(4πR²) ⇒ σ₁/σ₂ = R₂/R₁',`σ₁/σ₂ = ${b}/${a}`,`σ₁/σ₂ = ${N(r)}`,r,'marta',['Ulangan o‘tkazgichlarda potensiallar teng: kq₁/R₁ = kq₂/R₂.','Shundan q₁/q₂ = R₁/R₂. So‘ng σ = q/(4πR²) ni yozing.','σ₁/σ₂ = (q₁/q₂)·(R₂/R₁)² = R₂/R₁.'],{Q:60,R1:a,R2:b})},\n()=>{const Q=rnd(20,120),a=rnd(2,6),b=rnd(8,18),r=Q*a/(a+b);return mk(`R₁ = ${a} sm va R₂ = ${b} sm radiusli sharlar sim bilan ulangan. Ularga jami Q = ${Q} nC zaryad berilgan. Kichik shardagi q₁ ni nC da toping.`,'Nisbatda sm qisqaradi; Q nC da qoladi, javob ham nC.',[`R₁ = ${a} sm, R₂ = ${b} sm`,`Q = q₁ + q₂ = ${Q} nC`],'q₁ (nC)','q₁/q₂ = R₁/R₂ ⇒ q₁ = Q·R₁/(R₁+R₂)',`q₁ = ${Q} · ${a}/(${a}+${b})`,`q₁ = ${N(r)} nC`,r,'nC',['φ₁ = φ₂ dan q₁/q₂ = R₁/R₂.','q₂ = Q − q₁ ni o‘rniga qo‘ying.','q₁ = Q·R₁/(R₁+R₂).'],{Q,R1:a,R2:b})},\n()=>{const a=rnd(1,3,1),b=rnd(8,20),S=Math.round((a+b)*10)/10,r=3e6*(a/100)*(S/100)/K*1e9;return mk(`Kichik shar R₁ = ${a} sm va katta shar R₂ = ${b} sm sim bilan ulangan. Havoda korona E ≈ 3 MV/m da boshlanadi. Kichik shar uchida korona boshlanmasligi uchun jami Q ning eng katta qiymatini nC da toping.`,'MV/m → V/m: ×10⁶; sm → m: ×10⁻²; C → nC: ×10⁹',[`R₁ = ${a}·10⁻² m, R₂ = ${b}·10⁻² m`,'E_kr = 3·10⁶ V/m'],'Q_max (nC)','E₁ = kq₁/R₁² ≤ E_kr; q₁ = Q·R₁/(R₁+R₂) ⇒ Q = E_kr·R₁(R₁+R₂)/k',`Q = 3·10⁶ · ${a}·10⁻² · ${S}·10⁻² / 8,99·10⁹`,`Q = ${N(r*1e-9)} C = ${N(r)} nC`,r,'nC',['Korona eng katta σ (eng katta E) joyda — kichik shar sirtida boshlanadi.','E₁ = kq₁/R₁² va q₁ = Q·R₁/(R₁+R₂) ni birlashtiring: E₁ = kQ/(R₁(R₁+R₂)).','E₁ = E_kr dan Q ni toping; birliklarni SI da qo‘ying.'],{Q:r*1.1,R1:a,R2:b})}];\n\n/* ---- tablar ---- */\nconst TABS=[\n{n:'1',d:d1,g:G1,note:'O‘tkazgich ichida muvozanatda E = 0, zaryadlar faqat sirtda. Kuch chiziqlari sirtga perpendikulyar, sirt yaqinida E = σ/ε₀. Tashqi maydonda sirtda σ = ε₀E₀ zaryad induksiyalanadi.',\n fm:'E<sub>ichki<\/sub> = 0 &nbsp;|&nbsp; E<sub>sirt<\/sub> = σ/ε₀ &nbsp;|&nbsp; σ = ε₀E₀<br><small>σ — sirt zaryad zichligi (C/m²); ε₀ = 8,854·10⁻¹² F/m; E₀ — tashqi maydon (V/m).<\/small>',\n model:'Model: cheksiz yassi plastinka, 2D kesim; zaryad nuqtalari soni sxematik (E₀ ga proporsional).',\n sl:[['E0','E₀',0,100,1,30,'kV/m']],\n r:P=>[['σ = ε₀E₀',N(EP*P.E0*1e3*1e9)+' nC/m²'],['E ichkarida','0'],['E sirt yaqinida (σ/ε₀)',N(P.E0)+' kV/m']],\n err:'<b>1.<\/b> nC ni C ga o‘tkazmaslik (×10⁻⁹) — javob 10⁹ marta xato bo‘ladi.<br><b>2.<\/b> Ichkarida ham E = σ/ε₀ deb olish. Noto‘g‘ri: E = σ/ε₀ faqat sirt tashqarisida, ichkarida E = 0 (aks holda erkin zaryadlar harakatlanardi).<br><b>3.<\/b> σ/(2ε₀) (zaryadlangan tekislik formulasi) bilan adashtirish: o‘tkazgich sirtida σ/ε₀.',\n ts:[['Muvozanatdagi o‘tkazgich ichida maydon:',['E = σ/ε₀','E = 0','E = σ/2ε₀','E = kq/R²'],1,'Aks holda erkin zaryadlar siljib, muvozanat buzilardi.'],['Tashqi E₀ maydondagi o‘tkazgich sirtida induksiyalangan σ:',['ε₀E₀','E₀/ε₀','ε₀/E₀','0'],0,'Sirt yaqinida E = σ/ε₀ = E₀ ⇒ σ = ε₀E₀.'],['Muvozanatda kuch chiziqlari o‘tkazgich sirtiga nisbatan:',['parallel','perpendikulyar','45° ostida','ixtiyoriy'],1,'Urinma tashkil etuvchi bo‘lsa, zaryadlar sirt bo‘ylab siljir edi.']],\n ex:'<p>Metall plastinka E₀ = 25 kV/m maydonga perpendikulyar qo‘yilgan. Uning bir yuzidagi induksiyalangan σ ni toping.<\/p><details><summary>Javobni ko‘rish<\/summary>σ = ε₀E₀ = 8,854·10⁻¹² · 25·10³ ≈ 2,2·10⁻⁷ C/m² ≈ 221 nC/m².<\/details>'},\n{n:'2',d:d2,g:G2,hol:1,note:'Zaryad o‘tkazgichning sirtida joylashadi (ichi bo‘sh yoki to‘la — farqi yo‘q). Shar uchun σ = q/(4πR²), sirt yaqinida E = kq/R² = σ/ε₀, sirtdagi potensial φ = kq/R.',\n fm:'σ = q/(4πR²) &nbsp;|&nbsp; E = kq/R² = σ/ε₀ &nbsp;|&nbsp; φ = kq/R<br><small>q — shar zaryadi (C); R — radius (m); k = 1/(4πε₀) = 8,99·10⁹ N·m²/C². Gauss: ichkarida E = 0.<\/small>',\n model:'Model: yakkalangan shar (yaqinda boshqa jism yo‘q), 2D kesim; nuqtalar soni q ga sxematik proporsional.',\n sl:[['q','q',1,60,1,20,'nC'],['R','R',2,15,1,6,'sm']],\n r:P=>[['σ = q/(4πR²)',N(P.q*1e-9/(4*Math.PI*(P.R/100)**2)*1e9)+' nC/m²'],['E sirt yaqinida',N(K*P.q*1e-9/(P.R/100)**2/1e3)+' kV/m'],['E ichkarida','0'],['φ = kq/R',N(K*P.q*1e-9/(P.R/100)/1e3)+' kV']],\n err:'<b>1.<\/b> R ni sm da qoldirish: 4πR² m² da bo‘lishi kerak (1 sm² = 10⁻⁴ m²), R ni avval m ga o‘tkazing.<br><b>2.<\/b> σ ni hajmga bog‘lash (q/(4πR³/3)). Noto‘g‘ri: zaryad sirtda, σ — sirt zichligi, S = 4πR².<br><b>3.<\/b> Ichi bo‘sh shar ichida E = kq/R² deb olish. Noto‘g‘ri: Gauss teoremasiga ko‘ra ichkarida E = 0.',\n ts:[['Radiusi R, zaryadi q shar sirtida σ =',['q/(4πR²)','q/(πR²)','q/(4πR³/3)','q/R'],0,'σ = zaryad / sirt yuzi, shar sirti 4πR².'],['Zaryadlangan ichi bo‘sh o‘tkazgich shar ichida E =',['kq/R²','0','kq/R','σ/ε₀'],1,'Gauss: ichida zaryad yo‘q ⇒ E = 0.'],['Zaryadlangan shar sirtida potensial:',['kq/R','kq/R²','kqR','q/(4πε₀R²)'],0,'φ = kq/R = q/(4πε₀R).']],\n ex:'<p>R = 10 sm li o‘tkazgich shar φ = 9 kV gacha zaryadlangan. q va σ ni toping.<\/p><details><summary>Javobni ko‘rish<\/summary>q = φR/k = 9·10³·0,1/8,99·10⁹ ≈ 1,0·10⁻⁷ C = 100 nC; σ = q/(4πR²) ≈ 7,97·10⁻⁷ C/m² ≈ 0,80 μC/m².<\/details>'},\n{n:'3',d:d3,g:G3,note:'Sim bilan ulangan sharlarda potensiallar tenglashadi (φ₁ = φ₂), zaryadlar esa radiusga proporsional taqsimlanadi. Kichik radiusli shar (uch) da σ va E katta — shu yerda korona boshlanadi (E ≈ 3 MV/m).',\n fm:'φ₁ = φ₂ &nbsp;|&nbsp; q₁/q₂ = R₁/R₂ &nbsp;|&nbsp; σ₁/σ₂ = R₂/R₁ &nbsp;|&nbsp; E = σ/ε₀ = kq/R²<br><small>q₁+q₂ = Q (saqlanadi); R — radius; E_kr ≈ 3 MV/m — havoda korona chegarasi.<\/small>',\n model:'Model soddalashtirilgan: sharlar bir-biridan uzoq (o‘zaro ta’sir yo‘q), sim sig‘imi hisobga olinmaydi, 2D kesim. Boshida Q teng bo‘lingan deb olingan.',\n sl:[['Q','Q jami',10,600,5,100,'nC'],['R1','R₁',1,10,.5,3,'sm'],['R2','R₂',3,20,.5,12,'sm']],\n r:(P,p)=>{const o=t3(P,p);return[['q₁ / q₂',N(o.q1)+' / '+N(o.q2)+' nC'],['σ₁ / σ₂',N(o.s1)+' / '+N(o.s2)+' nC/m²'],['E₁ / E₂',N(o.E1/1e3)+' / '+N(o.E2/1e3)+' kV/m'],['φ₁ / φ₂',N(o.f1/1e3)+' / '+N(o.f2/1e3)+' kV'],['Korona (E₁ ≥ 3 MV/m)',o.E1>=3e6?'⚡ HA':'yo‘q']]},\n err:'<b>1.<\/b> Ulangan sharlarda q₁ = q₂ deb olish. Noto‘g‘ri: tenglashadigan zaryad emas, potensial (φ₁ = φ₂).<br><b>2.<\/b> σ ~ R deb olish. Noto‘g‘ri: σ₁/σ₂ = R₂/R₁ — kichik sharda zichlik katta.<br><b>3.<\/b> Koronani katta shar uchun tekshirish. Noto‘g‘ri: eng katta E kichik radiusli shar (uch) da, shuning uchun aynan o‘shani tekshiring.',\n ts:[['Sim bilan ulangan uzoq sharlarda nima tenglashadi?',['zaryadlar','potensiallar','sirt zichliklari','maydonlar'],1,'Muvozanatda butun o‘tkazgich ekvipotensial: φ₁ = φ₂.'],['R₁ < R₂ bo‘lsa:',['σ₁ > σ₂','σ₁ < σ₂','σ₁ = σ₂','q₁ > q₂'],0,'σ₁/σ₂ = R₂/R₁ > 1.'],['Korona nima?',['Havoning kuchli maydonda (~3 MV/m) ionlashishi va uchda razryad','Simning erishi','Zaryadning butunlay yo‘qolishi','Magnit maydon hosil bo‘lishi'],0,'Uchda E katta bo‘lgani uchun havo ionlashadi va zaryad “oqib” ketadi.']],\n ex:'<p>R₁ = 2 sm, R₂ = 8 sm sharlar sim bilan ulangan, Q = 100 nC. q₁, q₂, σ₁/σ₂ va E₁ ni toping.<\/p><details><summary>Javobni ko‘rish<\/summary>q₁ = 100·2/10 = 20 nC, q₂ = 80 nC; σ₁/σ₂ = 8/2 = 4; E₁ = kq₁/R₁² = 8,99·10⁹·2·10⁻⁸/(4·10⁻⁴) ≈ 4,5·10⁵ V/m = 0,45 MV/m (koronadan past).<\/details>'}];\n\n/* ---- ball ---- */\nconst S={b:{},c:{}};\nfunction award(k,pts){S.b[k]=Math.max(S.b[k]||0,pts);S.c[k]=1;const t=Object.values(S.b).reduce((a,b)=>a+b,0);$('#sc').textContent=`Ball: ${t}/135 · To‘g‘ri javoblar: ${Object.keys(S.c).length}/18`;$('#bf').style.width=t/135*100+'%'}\n$('#sc').textContent='Ball: 0/135 · To‘g‘ri javoblar: 0/18';\n\n/* ---- qurish ---- */\nconst ITEMS=[];\nfunction build(i){\n const T=TABS[i],el=$('#t'+i),st={lv:0,s:0,hi:0,wr:0,pr:null,done:false},A={p:{p:0,run:false},s:{p:0,run:true}},q=s=>$(s,el);\n el.innerHTML=`<div class=box><b>Esda tuting.<\/b> ${T.note}<\/div><div class=fm>${T.fm}<\/div>\n <h3>Masalalar<\/h3><div class=lv>${['Oson','O‘rta','Qiyin'].map((n,j)=>`<button data-l=${j}>${j+1}. ${n}<\/button>`).join('')}<\/div>\n <div class=card><p class=tx><\/p><small class=cv><\/small><canvas class=cp><\/canvas><ol class=stp><\/ol>\n <div class=row><button class=nx>Keyingi qadam ▶<\/button><button class=nw>Yangi variant ↻<\/button><\/div>\n <div class=row><input type=text class=an inputmode=decimal placeholder=\"Javob\"><b class=un><\/b><button class=ck>Tekshirish<\/button><button class=hn>Maslahat<\/button><\/div><div class=fb><\/div><\/div>\n <h3>Simulyatsiya<\/h3><div class=card><canvas class=cs><\/canvas><div class=sl>${T.sl.map(s=>`<label>${s[1]} = <b><\/b> ${s[6]}<input type=range min=${s[2]} max=${s[3]} step=${s[4]} value=${s[5]} data-k=${s[0]}><\/label>`).join('')}${T.hol?'<label><input type=checkbox data-k=hollow checked> Ichi bo‘sh shar<\/label>':''}<\/div>\n <div class=row><button class=b1>▶ Boshlash<\/button><button class=b2>⏸ To‘xtatish<\/button><button class=b3>⟲ Qayta boshlash<\/button><\/div><table class=tb><\/table><small>${T.model}<\/small><\/div>\n <h3>Tipik xatolar<\/h3><div class=box>${T.err}<\/div>\n <h3>Test<\/h3><div class=qs>${T.ts.map((t,j)=>`<div class=\"card qz\"><p><b>${j+1}.<\/b> ${t[0]}<\/p>${t[1].map((o,k)=>`<button data-j=${j} data-k=${k}>${o}<\/button>`).join('')}<div class=ex><\/div><\/div>`).join('')}<\/div>\n <h3>Mustaqil masala<\/h3><div class=card>${T.ex}<\/div>`;\n function render(){const p=st.pr,S6=[['Berilgan',p.g.join('<br>')],['Topish',p.f],['Formula',p.fo],['Almashtirish',p.sb],['Hisoblash',p.cl],['Javob',`<b>${N(p.ans)} ${p.u}<\/b>`]];\n  q('.tx').textContent=p.tx;q('.cv').innerHTML='Birliklar: '+p.cv;q('.un').textContent=p.u;\n  q('.stp').innerHTML=S6.slice(0,st.s).map((x,j)=>`<li${j==st.s-1?' class=cur':''}><b>${x[0]}:<\/b> ${x[1]}<\/li>`).join('');\n  q('.nx').disabled=st.s>=6;el.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('on',+b.dataset.l==st.lv))}\n function load(){st.pr=T.g[st.lv]();Object.assign(st,{s:0,hi:0,wr:0,done:false});q('.an').value='';q('.fb').textContent='';render();A.p.p=0;A.p.run=true}\n el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{st.lv=+b.dataset.l;load()});\n q('.nw').onclick=load;\n q('.nx').onclick=()=>{if(st.s<6){st.s++;A.p.p=0;A.p.run=true;render()}};\n q('.ck').onclick=()=>{const v=parseFloat(q('.an').value.replace(',','.')),fb=q('.fb'),p=st.pr;\n  if(isNaN(v)){fb.className='fb bad';fb.textContent='Son kiriting.';return}\n  if(st.done){fb.className='fb ok';fb.textContent='Bu variant yechilgan — “Yangi variant” ni bosing.';return}\n  if(Math.abs(v-p.ans)<=.03*Math.abs(p.ans)){const pts=st.s>=5?0:Math.max(2,10-3*st.hi-2*st.wr);award('p'+i+st.lv,pts);st.done=true;fb.className='fb ok';fb.textContent=`✔ To‘g‘ri! Javob: ${strip(N(p.ans))} ${p.u}. Ball: +${pts}`;st.s=6;A.p.p=0;A.p.run=true;render()}\n  else{st.wr++;fb.className='fb bad';fb.textContent='✘ Noto‘g‘ri (±3% aniqlikdan tashqari). “Maslahat” tugmasini bosing.'}};\n q('.hn').onclick=()=>{const p=st.pr,fb=q('.fb');if(st.hi<p.h.length){fb.className='fb hint';fb.textContent='💡 Maslahat '+(st.hi+1)+'/'+p.h.length+': '+p.h[st.hi++]}else{st.s=6;render();fb.className='fb hint';fb.textContent='To‘liq yechim ko‘rsatildi.'}};\n q('.b1').onclick=()=>{if(A.s.p>=1)A.s.p=0;A.s.run=true};q('.b2').onclick=()=>A.s.run=false;q('.b3').onclick=()=>{A.s.p=0;A.s.run=true};\n q('.qs').onclick=e=>{const b=e.target.closest('button');if(!b)return;const j=+b.dataset.j,k=+b.dataset.k,t=T.ts[j],box=b.parentNode;if(box.dataset.d)return;box.dataset.d=1;const ok=k==t[2];b.classList.add(ok?'ok':'bad');if(!ok)box.querySelectorAll('button')[t[2]].classList.add('ok');$('.ex',box).textContent=(ok?'✔ To‘g‘ri. ':'✘ Noto‘g‘ri. ')+t[3];if(ok)award('t'+i+j,5)};\n ITEMS[i]={tick(dt,t,V){\n  for(const a of[A.p,A.s])if(a.run){a.p=Math.min(1,a.p+dt/2.5);if(a.p>=1)a.run=false}\n  let[c,w,h]=fit(q('.cp'));c.clearRect(0,0,w,h);\n  if(st.s==0)txt(c,'«Keyingi qadam» tugmasini bosing',w/2,h/2,V.mu);else T.d(c,w,h,Object.assign({},DEF,st.pr.sc),A.p.p,st.s,t,V);\n  const P=Object.assign({},DEF);el.querySelectorAll('.sl input').forEach(x=>{if(x.type=='range'){P[x.dataset.k]=+x.value;x.parentNode.querySelector('b').textContent=x.value}else P[x.dataset.k]=x.checked});\n  [c,w,h]=fit(q('.cs'));c.clearRect(0,0,w,h);T.d(c,w,h,P,A.s.p,6,t,V);\n  q('.tb').innerHTML=T.r(P,A.s.p).map(r=>`<tr><td>${r[0]}<\/td><td>${r[1]}<\/td><\/tr>`).join('')}};\n load()}\n[0,1,2].forEach(build);\nlet cur=0,last=0;\ndocument.querySelectorAll('nav button').forEach(b=>{b.onclick=()=>{cur=+b.dataset.t;[0,1,2].forEach(i=>{$('#t'+i).classList.toggle('hid',i!=cur)});document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b))}});\n$('nav button').classList.add('on');\nfunction frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;const css=getComputedStyle(document.documentElement),g=n=>css.getPropertyValue(n).trim(),V={fg:g('--fg'),mu:g('--mu'),ln:g('--ln'),pos:g('--pos'),neg:g('--neg'),fl:g('--fl')};\n try{ITEMS[cur].tick(dt,ts/1000,V)}catch(e){console.error(e)}requestAnimationFrame(frame)}\nrequestAnimationFrame(frame);\n<\/script><\/body><\/html>\n", "<!DOCTYPE html>\n<html lang=\"uz\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Tabiatdagi elektr hodisalari<\/title>\n<style>\n:root{--bg:#f3f5f9;--fg:#101624;--card:#fff;--mut:#586179;--bd:#d8deea;--ac:#f2c230;--acf:#1a1400;--hero:linear-gradient(135deg,#0b1d3a,#1b3a73);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n:root[data-theme=dark]{--bg:#0d1120;--fg:#e8ecf6;--card:#161c30;--mut:#9aa4bf;--bd:#27304c}\nbody[data-s=\"1\"]{--ac:#19c3a6;--acf:#00201b;--hero:linear-gradient(135deg,#0b3b36,#1f8f5f)}\nbody[data-s=\"2\"]{--ac:#7cf29a;--acf:#04200e;--hero:linear-gradient(135deg,#1f0f45,#2c1b6d,#0f5a4a)}\n*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,\"Segoe UI\",Roboto,sans-serif}\n.hero{background:var(--hero);color:#fff;position:sticky;top:0;z-index:5;padding:10px 12px 0;transition:background .3s}\n.row{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:920px;margin:0 auto}\nh1{font:700 1.2rem/1.2 Georgia,serif;margin:0}\nh2{font:700 1.45rem/1.25 Georgia,serif;margin:18px 0 8px}h3{margin:0 0 8px}\nnav{display:flex;gap:6px;max-width:920px;margin:10px auto 0}\nnav button{flex:1;min-height:48px;border:0;border-radius:12px 12px 0 0;background:rgba(255,255,255,.14);color:#fff;font:600 .95rem inherit;font-family:inherit;cursor:pointer}\nnav button.on{background:var(--bg);color:var(--fg)}\n#th{min-width:44px;min-height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:none;color:#fff;font-size:1.2rem;cursor:pointer}\nmain{max-width:920px;margin:0 auto;padding:4px 12px 40px}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin:12px 0}\ncanvas{width:100%;aspect-ratio:4/3;display:block;border-radius:10px;background:#000}\n@media(min-width:760px){canvas{aspect-ratio:16/9}}\nbutton,summary{font-family:inherit}\n.bar,.modes{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.bar button,.modes button,.big{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font-size:1rem;cursor:pointer}\n.modes button.on,.big{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:700}\n.ctl{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}\nlabel{display:block;font-size:.95rem}label b{color:var(--mut)}\ninput[type=range]{width:100%;height:36px;accent-color:var(--ac)}\ninput[type=checkbox]{width:24px;height:24px;vertical-align:middle;accent-color:var(--ac)}\n.ro{margin-top:10px;padding:10px;border-radius:10px;background:var(--bg);font-size:.93rem;border-left:4px solid var(--ac)}\n.fact{background:var(--ac);color:var(--acf);border-radius:14px;padding:14px;margin:12px 0}\ndetails{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:0 12px;margin:8px 0}\nsummary{min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer}\ndetails p{margin:0 0 12px;color:var(--mut)}\n.q{margin:12px 0}.q p{margin:0 0 6px;font-weight:600}\n.q button{display:block;width:100%;min-height:48px;margin:6px 0;text-align:left;padding:8px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font-size:1rem;cursor:pointer}\n.q .ok{background:#1f9d55;color:#fff;border-color:#1f9d55}.q .no{background:#c0392b;color:#fff;border-color:#c0392b}\n.res{font-weight:700}.note{font-size:.85rem;color:var(--mut)}\n[hidden]{display:none!important}\n<\/style><\/head><body data-s=\"0\">\n<header class=\"hero\"><div class=\"row\"><h1>Tabiatdagi elektr hodisalari<\/h1><button id=\"th\" aria-label=\"Och/toʻq rejim\">◐<\/button><\/div>\n<nav id=\"tabs\"><button class=\"on\">⚡ Chaqmoq<\/button><button>🧠 Biologik<\/button><button>🌌 Koinot<\/button><\/nav><\/header>\n<main>\n\n<section id=\"s0\"><h2>Atmosferadagi elektr hodisalari va chaqmoq<\/h2>\n<p>Bulut ichidagi kuchli yuqoriga yoʻnalgan havo oqimlari muz kristallari va doʻlni toʻqnashtiradi. Taxminan olganda, yengil kristallar musbat, ogʻir doʻl zarralari manfiy zaryadlanadi. Yengillari bulut tepasiga koʻtarilib «+» hosil qiladi, ogʻirlari pastga tushib «−» hosil qiladi; Yer yuzasida induksiya tufayli «+» zaryad paydo boʻladi. Havo teshilish maydon kuchlanganligiga yetganda razryad boshlanadi (quruq havoda E ≈ 3·10⁶ V/m, bulut ichida kamroq). Avval <b>pogʻonali lider<\/b> pastga tushadi, Yerga yetganda <b>teskari zarba<\/b> yuqoriga yuguradi va asosiy yorugʻlik hamda tokni olib oʻtadi.<\/p>\n<div class=\"card\"><canvas><\/canvas><div class=\"bar\"><\/div>\n<div class=\"ctl\">\n<label>Bulut zaryadi Q (C, taxminan): <b id=\"vQ\"><\/b><input type=\"range\" id=\"Q\" min=\"10\" max=\"50\" value=\"30\"><\/label>\n<label>Bulut balandligi h (km): <b id=\"vH\"><\/b><input type=\"range\" id=\"H\" min=\"1\" max=\"5\" step=\"0.5\" value=\"3\"><\/label>\n<label>Namlik (%): <b id=\"vHm\"><\/b><input type=\"range\" id=\"Hm\" min=\"20\" max=\"100\" value=\"70\"><\/label>\n<label>Kuzatuvchigacha masofa (km): <b id=\"vDs\"><\/b><input type=\"range\" id=\"Ds\" min=\"1\" max=\"6\" step=\"0.5\" value=\"3\"><\/label>\n<label><input type=\"checkbox\" id=\"rod\"> Chaqmoqoʻtkazgich qoʻyish<\/label>\n<button class=\"big\" onclick=\"strike()\">⚡ Chaqmoq chaqish<\/button><\/div>\n<div class=\"ro\"><\/div><p class=\"note\">Soddalashtirilgan model: qiymatlar taxminiy, maqsad — tushunchalarni koʻrsatish.<\/p><\/div>\n<details><summary>Sent-Elmo olovi<\/summary><p>Uchli buyumlar (machta, chaqmoqoʻtkazgich uchi) yaqinida maydon kuchlanganligi juda katta boʻladi, havo ionlashadi va koʻkimtir toj razryadi nurlanadi. Slayderda Q ≥ 30 va chaqmoqoʻtkazgichni yoqib koʻring.<\/p><\/details>\n<details><summary>Sharsimon chaqmoq (gipotezalar)<\/summary><p>Hali toʻliq tushuntirilmagan, kuzatuvlar kam. Gipotezalar: yerga urgan chaqmoqdan hosil boʻlgan yonayotgan kremniy zarralari; plazma yoki mikroto‘lqinli «pufak» modeli.<\/p><\/details>\n<details><summary>Chaqmoqoʻtkazgich qanday ishlaydi?<\/summary><p>Uchi yerga ulangan metall oʻtkazgich. Uchida maydon kuchlanganligi eng katta, shu sababli zaryad uchidan oqib chiqib bulut maydonini kamaytiradi, chaqmoq urganda esa tokni xavfsiz yerga oʻtkazadi.<\/p><\/details>\n<div class=\"fact\"><b>Bilasizmi?<\/b> Chaqmoq kanalidagi havo taxminan 30 000 K gacha qiziydi — bu Quyosh sirtidan (≈5800 K) bir necha baravar issiq. Havo keskin kengayib, momaqaldiroq tovushini hosil qiladi.<\/div>\n<div class=\"quiz\"><\/div><\/section>\n\n<section id=\"s1\" hidden><h2>Biologik elektr hodisalari<\/h2>\n<p>Neyron membranasi dam olish holatida tashqarisi «+», ichkarisi «−» boʻlib, potensiallar farqi taxminan −70 mV. Na⁺/K⁺ nasosi (ATF sarflab) 3 ta Na⁺ ni tashqariga, 2 ta K⁺ ni ichkariga haydab bu farqni saqlaydi. Stimul membrana potensialini boʻsagʻaga (≈ −55 mV) yetkazsa, Na⁺ kanallari ochiladi, potensial taxminan +40 mV gacha oshadi (<b>harakat potensiali<\/b>), soʻng K⁺ kanallari uni qaytaradi. Qonun: «hammasi yoki hech nima». Miyelin gʻilofi bor aksonda impuls Ranvye tugunlaridan tugunlarga sakrab oʻtadi va ancha tez tarqaladi.<\/p>\n<div class=\"modes\"><button class=\"on\">Neyron<\/button><button>Yurak (EKG)<\/button><button>Elektr baliqlar<\/button><\/div>\n<div class=\"card\"><canvas><\/canvas><div class=\"bar\"><\/div>\n<div class=\"ctl\">\n<label data-m=\"0\">Stimul kuchi (shartli birlik): <b id=\"vS\"><\/b><input type=\"range\" id=\"S\" min=\"0\" max=\"100\" value=\"60\"><\/label>\n<label data-m=\"0\"><input type=\"checkbox\" id=\"my\"> Miyelin gʻilofi<\/label>\n<button class=\"big\" data-m=\"0\" onclick=\"stim()\">Stimul berish<\/button>\n<label data-m=\"1\">Yurak urishi (urish/min): <b id=\"vHr\"><\/b><input type=\"range\" id=\"Hr\" min=\"40\" max=\"180\" value=\"72\"><\/label>\n<label data-m=\"2\">Elektrotsitlar soni n: <b id=\"vE\"><\/b><input type=\"range\" id=\"E\" min=\"100\" max=\"6000\" step=\"100\" value=\"3000\"><\/label><\/div>\n<div class=\"ro\"><\/div><p class=\"note\">Soddalashtirilgan model; haqiqiy egri chiziqlar ion kanallari dinamikasiga bogʻliq.<\/p><\/div>\n<details><summary>Mushak qisqarishi va EMG<\/summary><p>Mushak tolasining qisqarishi ham harakat potensiali bilan boshlanadi. EMG (elektromiografiya) mushakning elektr faolligini teri yoki ignali elektrod orqali yozib oladi; signal taxminan 0,1–5 mV tartibida.<\/p><\/details>\n<div class=\"fact\"><b>Bilasizmi?<\/b> Elektr ugor (ilonbaliqqa oʻxshash, aslida boshqa turkum) taxminan 600–860 V kuchlanish hosil qiladi: uning minglab elektrotsitlari ketma-ket ulangan mayda batareyalarga oʻxshaydi, kuchlanishlar qoʻshiladi: U = n·ε.<\/div>\n<div class=\"quiz\"><\/div><\/section>\n\n<section id=\"s2\" hidden><h2>Koinot va yuqori atmosferadagi elektr hodisalari<\/h2>\n<p>Quyosh shamoli — Quyoshdan chiqadigan zaryadli zarralar (asosan proton va elektron) oqimi, tezligi taxminan 300–800 km/s. Yerning magnit maydoni (magnitosfera) ularni egadi. Magnit maydonda zaryadga Lorents kuchi F = qvB taʼsir qiladi: zarra maydon chiziqlari atrofida spiral chizib qutblar tomon yoʻnaladi. 100–300 km balandlikda ular kislorod va azot atomlarini qoʻzgʻatadi; atomlar qaytishda yorugʻlik chiqaradi — <b>qutb yogʻdusi<\/b>: kislorod 557,7 nm (yashil), 630 nm (qizil, yuqorida); azot — koʻk/binafsha.<\/p>\n<div class=\"modes\"><button class=\"on\">Qutb yogʻdusi<\/button><button>Lorents kuchi<\/button><\/div>\n<div class=\"card\"><canvas><\/canvas><div class=\"bar\"><\/div>\n<div class=\"ctl\">\n<label data-m=\"0\">Quyosh shamoli tezligi (km/s): <b id=\"vW\"><\/b><input type=\"range\" id=\"W\" min=\"300\" max=\"900\" step=\"10\" value=\"450\"><\/label>\n<label data-m=\"0\">Zichlik (zarra/sm³): <b id=\"vDn\"><\/b><input type=\"range\" id=\"Dn\" min=\"1\" max=\"30\" value=\"5\"><\/label>\n<label data-m=\"0\"><input type=\"checkbox\" id=\"bz\"> Bz janubga yoʻnalgan<\/label>\n<label data-m=\"1\">Tezlik v (10⁶ m/s): <b id=\"vVp\"><\/b><input type=\"range\" id=\"Vp\" min=\"1\" max=\"30\" value=\"10\"><\/label>\n<label data-m=\"1\">B (µT; Yer ≈ 25–65): <b id=\"vBm\"><\/b><input type=\"range\" id=\"Bm\" min=\"10\" max=\"100\" value=\"50\"><\/label>\n<label data-m=\"1\"><input type=\"checkbox\" id=\"pr\"> Proton (oʻchiq — elektron)<\/label><\/div>\n<div class=\"ro\"><\/div><p class=\"note\">Soddalashtirilgan model: Kp indeksi va kenglik formulasi taxminiy.<\/p><\/div>\n<details><summary>Ionosfera va radioaloqa<\/summary><p>Ionosfera (≈60–1000 km) ionlashgan qatlam: qisqa toʻlqinlarni (taxminan 3–30 MHz) qaytarib, uzoq aloqani taʼminlaydi. Quyosh boʻronlarida aloqa vaqtincha uzilishi mumkin.<\/p><\/details>\n<details><summary>Yuqori atmosfera chaqmoqlari<\/summary><p>Sprayt — bulut tepasida qizil yorugʻlik (taxminan 50–90 km gacha), ELF/ELVES — ionosferada halqasimon yorugʻlik (~90 km), koʻk oqim — bulut tepasidan yuqoriga koʻk konus.<\/p><\/details>\n<details><summary>CME va Van Allen kamarlari<\/summary><p>Toj massasi chiqishi (CME) — Quyosh tojidan ulkan plazma bulut; Yerga taxminan 1–3 kunda yetib, kuchli magnit boʻron beradi (1859 yildagi Karrington hodisasi telegraflarni buzgan). Van Allen kamarlari — magnit tuzoqdagi zarralar: ichkisi taxminan 1000–6000 km, tashqisi 13 000–60 000 km balandlikda.<\/p><\/details>\n<div class=\"fact\"><b>Bilasizmi?<\/b> Yashil yogʻdu odatda 100–150 km balandlikda hosil boʻladi; qizil rang esa 200 km dan yuqorida, chunki u kislorodning sekin nurlanish oʻtishi va u siyrak havoda ham taʼsirlashishdan oldin nurlanib ulguradi.<\/div>\n<div class=\"quiz\"><\/div><\/section>\n<\/main>\n<script>\nconst $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];\nconst rnd=(a,b)=>a+Math.random()*(b-a),cl=(x,a,b)=>Math.max(a,Math.min(b,x)),val=id=>+$('#'+id).value;\nconst sci=x=>{const e=Math.floor(Math.log10(x));return (x/10**e).toFixed(1).replace('.',',')+'×10<sup>'+e+'<\/sup>'};\nlet sec=0,paused=matchMedia('(prefers-reduced-motion:reduce)').matches,spd=1,T=0,last=0;const mode=[0,0,0];\nconst html=document.documentElement;html.dataset.theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';\n$('#th').onclick=()=>html.dataset.theme=html.dataset.theme=='dark'?'light':'dark';\ndocument.addEventListener('input',e=>{const o=$('#v'+e.target.id);if(o)o.textContent=e.target.value});\n$$('input[type=range]').forEach(i=>$('#v'+i.id).textContent=i.value);\nfunction ro(h){const e=$('#s'+sec+' .ro');if(e._h!==h){e.innerHTML=h;e._h=h}}\n/* S1 */\nconst L={ph:0,p:0,t:0,since:0,seg:[],tx:0,flash:0};\nconst PT=[...Array(44)].map((_,i)=>({u:rnd(-1,1),v:i%2?rnd(.72,1):rnd(0,.28)}));\nconst baseY=h=>h*.86-h*.22-(val('H')-1)/4*h*.38;\nf function go(i){cur=i;[...nav.children].forEach((b,j)=>b.classList.toggle('on',j==i));f.style.height='70vh';f.srcdoc=D[i];scrollTo(0,0);nav.children[i].scrollIntoView({inline:'center',block:'nearest'})}
document.getElementById('pv').onclick=()=>go((cur+N.length-1)%N.length);
document.getElementById('nx').onclick=()=>go((cur+1)%N.length);
document.getElementById('th').onclick=()=>{R.dataset.theme=R.dataset.theme=='dark'?'light':'dark';sync()};
addEventListener('resize',fit);go(0);
</script></body></html>
