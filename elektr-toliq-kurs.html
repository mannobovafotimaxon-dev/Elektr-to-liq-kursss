<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8">

<style>
:root{--bg:#f3f5f9;--fg:#101624;--bar:#0b1d3a;--ac:#f2c230;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0d1120;--fg:#e8ecf6;--bar:#070b18}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bar);color:#fff;padding:8px 10px}
.r{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:960px;margin:0 auto}
h1{font:700 1.05rem/1.2 Georgia,serif;margin:0}
#th{min-width:44px;min-height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:none;color:#fff;font-size:1.2rem;cursor:pointer}
nav{display:flex;gap:6px;overflow-x:auto;max-width:960px;margin:8px auto 0;padding-bottom:4px;scrollbar-width:thin}
nav button{flex:none;min-height:44px;padding:0 14px;border:0;border-radius:22px;background:rgba(255,255,255,.14);color:#fff;font:600 .92rem inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ac);color:#1a1400}
.w{max-width:960px;margin:0 auto}
iframe{display:block;width:100%;border:0;min-height:70vh;background:var(--bg)}
.w>div{display:flex;justify-content:space-between;gap:8px;padding:10px}
.w>div button{flex:1;min-height:48px;border-radius:12px;border:1px solid #8884;background:var(--bg);color:var(--fg);font:600 1rem inherit;font-family:inherit;cursor:pointer}
</style></head><body>
<header><div class="r"><h1>Elektr hodisalari — toʻliq kurs</h1><button id="th" aria-label="Och/toʻq rejim">◐</button></div><nav id="nav"></nav></header>
<main class="w"><iframe id="f" title="Dars"></iframe><div><button id="pv">← Oldingi</button><button id="nx">Keyingi →</button></div></main>
<script>
const D=["<!DOCTYPE html>\n<html lang=\"uz\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Elektr zaryad — interaktiv dars<\/title>\n<style>\n:root{--bg:#f2f5fa;--card:#fff;--tx:#14213d;--mu:#5b6b85;--pl:#e4572e;--mn:#2a7de1;--bd:#d5deee;--ok:#1a8f4d;--no:#d33a3a;--hint:#fff4d6;--hb:#e6b93a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0d1424;--card:#16203a;--tx:#eaf0ff;--mu:#a3b2d2;--bd:#2b3a5e;--ok:#4cd68a;--no:#ff7b7b;--hint:#3a3117;--hb:#c99a1e}}\n:root[data-theme=\"dark\"]{--bg:#0d1424;--card:#16203a;--tx:#eaf0ff;--mu:#a3b2d2;--bd:#2b3a5e;--ok:#4cd68a;--no:#ff7b7b;--hint:#3a3117;--hb:#c99a1e}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 \"Segoe UI\",system-ui,sans-serif;min-height:100%}\nmain{max-width:760px;margin:0 auto;padding:12px}\nh1{font-size:1.5rem;margin:8px 0 2px}h2{font-size:1.2rem;margin:0 0 8px}h3{font-size:1rem;margin:14px 0 6px}\n.sub{color:var(--mu);margin:0 0 12px}\nnav{display:flex;gap:6px;margin-bottom:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}\n.tab{flex:1;padding:10px 6px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:600 .88rem inherit;font-family:inherit;cursor:pointer}\n.tab[aria-selected=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}\ncanvas{width:100%;height:auto;display:block;background:var(--bg);border-radius:10px;touch-action:none}\nbutton.b{padding:8px 12px;border-radius:8px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer;margin:3px 3px 3px 0}\nbutton.b:focus-visible,.tab:focus-visible,input:focus-visible{outline:3px solid var(--mn);outline-offset:2px}\n.pl{background:var(--pl)!important;color:#fff!important;border-color:var(--pl)!important}.mn{background:var(--mn)!important;color:#fff!important;border-color:var(--mn)!important}\n.know{background:var(--hint);border-left:5px solid var(--hb);border-radius:8px;padding:10px 12px;margin:12px 0}\n.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}.row label{min-width:120px}.row input[type=range]{flex:1;min-width:140px}\n.big{font-size:1.15rem;font-weight:700}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.two div{border:1px solid var(--bd);border-radius:10px;padding:8px;font-size:.92rem}\n.body{border-radius:50%;width:78px;height:78px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.05rem;margin:0 auto 4px}\n.qq{border-top:1px solid var(--bd);padding:8px 0}.qq p{margin:0 0 6px;font-weight:600}\n.qq button{display:block;width:100%;text-align:left;padding:8px 10px;margin:4px 0;border:1.5px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}\n.qq button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}.qq button.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,transparent)}\n.r{font-weight:700;min-height:1.4em}.r.ok,.ok{color:var(--ok)}.no{color:var(--no)}\ninput[type=text]{padding:8px;border-radius:8px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);width:110px;font:inherit}\ndetails{margin:6px 0}summary{cursor:pointer;font-weight:600}\n.dots{font-size:1.1rem;letter-spacing:2px;word-break:break-all;min-height:1.6em;color:var(--mn)}\n@media(max-width:420px){.row label{min-width:100%}}\n<\/style><\/head><body><main>\n<h1>Elektr zaryad<\/h1><p class=\"sub\">8-sinf fizikasi · interaktiv simulyatsiya<\/p>\n<nav role=\"tablist\">\n<button class=\"tab\" data-t=\"s1\" aria-selected=\"true\">1. Zaryad<\/button>\n<button class=\"tab\" data-t=\"s2\" aria-selected=\"false\">2. Qonunlar<\/button>\n<button class=\"tab\" data-t=\"s3\" aria-selected=\"false\">3. Kulon<\/button>\n<\/nav>\n\n<\!-- 1-BO'LIM -->\n<section id=\"s1\">\n<div class=\"card\"><h2>Elektr zaryadi nima?<\/h2>\n<p>Elektr zaryadi — jismning elektr o'zaro ta'sirga kirishish xossasi. Zaryad ikki xil: <b style=\"color:var(--pl)\">musbat (+)<\/b> va <b style=\"color:var(--mn)\">manfiy (−)<\/b>.<\/p>\n<svg viewBox=\"0 0 200 130\" width=\"100%\" style=\"max-height:170px\" aria-label=\"Atom tuzilishi\">\n<g transform=\"translate(100 65)\"><circle r=\"22\" fill=\"var(--pl)\" opacity=\".2\"/>\n<circle cx=\"-6\" cy=\"-5\" r=\"8\" fill=\"#e4572e\"/><circle cx=\"7\" cy=\"-3\" r=\"8\" fill=\"#9aa5b8\"/><circle cx=\"0\" cy=\"8\" r=\"8\" fill=\"#e4572e\"/>\n<ellipse rx=\"70\" ry=\"28\" fill=\"none\" stroke=\"var(--bd)\" stroke-width=\"2\"/>\n<g><circle cx=\"70\" cy=\"0\" r=\"6\" fill=\"#2a7de1\"/><animateTransform attributeName=\"transform\" type=\"rotate\" from=\"0\" to=\"360\" dur=\"4s\" repeatCount=\"indefinite\"/><\/g><\/g>\n<text x=\"4\" y=\"122\" font-size=\"10\" fill=\"var(--pl)\">● proton (+)<\/text><text x=\"70\" y=\"122\" font-size=\"10\" fill=\"#9aa5b8\">● neytron (0)<\/text><text x=\"140\" y=\"122\" font-size=\"10\" fill=\"var(--mn)\">● elektron (−)<\/text><\/svg>\n<p>Atom yadrosida proton (+) va neytron (zaryadsiz) bor, atrofida elektronlar (−) aylanadi. Odatda protonlar va elektronlar soni teng, shuning uchun jism neytral.<\/p><\/div>\n\n<div class=\"card\"><h2>Elektrlanish animatsiyasi<\/h2>\n<p>Ebonit tayoqchani jun matoga ishqalang: elektronlar matodan tayoqchaga o'tadi.<\/p>\n<canvas id=\"c2\" width=\"340\" height=\"190\"><\/canvas>\n<button class=\"b pl\" id=\"rubB\">Ishqalash<\/button><span id=\"rubT\" class=\"big\"><\/span><\/div>\n\n<div class=\"card\"><h2>Zaryadlarni sudrab ko'ring<\/h2>\n<canvas id=\"c1\" width=\"340\" height=\"220\"><\/canvas>\n<button class=\"b pl\" id=\"addP\">+ musbat qo'shish<\/button><button class=\"b mn\" id=\"addM\">− manfiy qo'shish<\/button><button class=\"b\" id=\"resB\">Boshiga qaytarish<\/button>\n<p class=\"sub\">Strelka — zaryadga ta'sir etayotgan kuch. Bir xil ishora: itarish. Har xil ishora: tortishish.<\/p><\/div>\n\n<div class=\"card\"><h2>Zaryadning xossalari<\/h2>\n<div class=\"two\"><div><b>O'tkazgichlar<\/b><br>Erkin zaryadlar bor: metallar, tuzli suv, inson tanasi.<\/div><div><b>Dielektriklar<\/b><br>Erkin zaryadlar deyarli yo'q: shisha, ebonit, rezina, plastmassa.<\/div><\/div>\n<div class=\"know\"><b>Bilib oling:<\/b> zaryad ikki xil bo'ladi; bir xil ishoralilar itarishadi, har xil ishoralilar tortishadi.<\/div>\n<h3>Test<\/h3><div id=\"q1\"><\/div><\/div>\n<\/section>\n\n<\!-- 2-BO'LIM -->\n<section id=\"s2\" hidden>\n<div class=\"card\"><h2>Zaryadning saqlanish qonuni<\/h2>\n<p>Berk sistemada zaryadlarning algebraik yig'indisi o'zgarmaydi: Q₁ + Q₂ = const.<\/p>\n<div class=\"row\"><label>1-jism: <b id=\"v1\"><\/b> nC<\/label><input type=\"range\" id=\"a1\" min=\"-10\" max=\"10\" value=\"6\"><\/div>\n<div class=\"row\"><label>2-jism: <b id=\"v2\"><\/b> nC<\/label><input type=\"range\" id=\"a2\" min=\"-10\" max=\"10\" value=\"-2\"><\/div>\n<div class=\"two\"><div style=\"text-align:center\"><div class=\"body\" id=\"bd1\"><\/div>1-jism<\/div><div style=\"text-align:center\"><div class=\"body\" id=\"bd2\"><\/div>2-jism<\/div><\/div>\n<p class=\"big\" id=\"sum\"><\/p>\n<button class=\"b pl\" id=\"touch\">Jismlarni tekkizish<\/button><button class=\"b\" id=\"untouch\">Qayta boshlash<\/button>\n<p id=\"msg2\" class=\"r\"><\/p><\/div>\n\n<div class=\"card\"><h2>Diskretlik qonuni: q = n·e<\/h2>\n<p>e = 1,6·10⁻¹⁹ C — eng kichik zaryad (elektron zaryadining moduli).<\/p>\n<button class=\"b mn\" data-n=\"1\">+1 elektron<\/button><button class=\"b mn\" data-n=\"10\">+10<\/button><button class=\"b pl\" data-n=\"-1\">−1 elektron<\/button><button class=\"b pl\" data-n=\"-10\">−10<\/button><button class=\"b\" id=\"half\">Yarim elektron<\/button>\n<div class=\"dots\" id=\"dots\"><\/div>\n<p>Ortiqcha elektronlar soni <b>n<\/b> = <span class=\"big\" id=\"nn\">0<\/span><br>Zaryad <b>q<\/b> = −n·e = <span class=\"big\" id=\"qq\">0<\/span><\/p>\n<p id=\"msg3\" class=\"r\"><\/p><\/div>\n\n<div class=\"card\"><h2>Masalalar (e = 1,6·10⁻¹⁹ C)<\/h2>\n<p><b>1.<\/b> Jism 20 ta ortiqcha elektron oldi. Zaryad moduli necha ·10⁻¹⁹ C?<\/p>\n<input type=\"text\" id=\"t1\" inputmode=\"decimal\"> <button class=\"b\" data-c=\"t1\" data-a=\"32\">Tekshirish<\/button> <span id=\"t1r\" class=\"r\"><\/span>\n<p><b>2.<\/b> Jism zaryadi 4,8·10⁻¹⁸ C. Unda nechta ortiqcha elektron bor?<\/p>\n<input type=\"text\" id=\"t2\" inputmode=\"decimal\"> <button class=\"b\" data-c=\"t2\" data-a=\"30\">Tekshirish<\/button> <span id=\"t2r\" class=\"r\"><\/span>\n<div class=\"know\"><b>Bilib oling:<\/b> zaryad saqlanadi (yo'qolmaydi, faqat o'tadi) va faqat e ning butun karralisi bo'ladi.<\/div>\n<h3>Test<\/h3><div id=\"q2\"><\/div><\/div>\n<\/section>\n\n<\!-- 3-BO'LIM -->\n<section id=\"s3\" hidden>\n<div class=\"card\"><h2>Kulon qonuni<\/h2>\n<p class=\"big\">F = k·|q₁·q₂| / r²<\/p><p>k = 9·10⁹ N·m²/C². Kuch zaryadlar ko'paytmasiga to'g'ri, masofa kvadratiga teskari proporsional.<\/p>\n<canvas id=\"c4\" width=\"340\" height=\"150\"><\/canvas>\n<div class=\"row\"><label>q₁ = <b id=\"w1\"><\/b> nC<\/label><input type=\"range\" id=\"q1\" min=\"-10\" max=\"10\" value=\"5\"><\/div>\n<div class=\"row\"><label>q₂ = <b id=\"w2\"><\/b> nC<\/label><input type=\"range\" id=\"q2\" min=\"-10\" max=\"10\" value=\"5\"><\/div>\n<div class=\"row\"><label>r = <b id=\"w3\"><\/b> sm<\/label><input type=\"range\" id=\"r\" min=\"1\" max=\"20\" step=\"0.1\" value=\"5\"><\/div>\n<p class=\"big\" id=\"Fout\"><\/p><p class=\"sub\" id=\"kind\"><\/p>\n<button class=\"b pl\" id=\"go\">Qo'yib yuborish<\/button><button class=\"b\" id=\"stop\">To'xtatish<\/button>\n<p class=\"sub\">Strelka uzunligi F ga proporsional (100 µN ≈ 40 px, juda katta kuchlarda chegaralangan).<\/p><\/div>\n\n<div class=\"card\"><h2>F ning r ga bog'liqligi<\/h2>\n<canvas id=\"c5\" width=\"340\" height=\"200\"><\/canvas><p id=\"dbl\" class=\"r\"><\/p><\/div>\n\n<div class=\"card\"><h2>Masalalar<\/h2>\n<details open><summary>1-masala: q₁ = 2 nC, q₂ = 4 nC, r = 3 sm. F = ?<\/summary>\n<p>1) SI: q₁ = 2·10⁻⁹ C, q₂ = 4·10⁻⁹ C, r = 0,03 m.<br>2) F = 9·10⁹ · (2·10⁻⁹ · 4·10⁻⁹) / 0,03²<br>3) F = 9·10⁹ · 8·10⁻¹⁸ / 9·10⁻⁴ = 8·10⁻⁵ N.<br><b>Javob: 80 µN<\/b> (zaryadlar bir xil ishorali — itarishadi).<\/p><\/details>\n<details><summary>2-masala: q₁ = 1 µC, q₂ = 2 µC, r = 10 sm. F = ?<\/summary>\n<p>1) SI: q₁ = 10⁻⁶ C, q₂ = 2·10⁻⁶ C, r = 0,1 m.<br>2) F = 9·10⁹ · 2·10⁻¹² / 0,01<br>3) F = 1,8·10⁻² / 0,01 = 1,8 N.<br><b>Javob: 1,8 N<\/b><\/p><\/details>\n<div class=\"know\"><b>Bilib oling:<\/b> masofa 2 marta oshsa, kuch 4 marta kamayadi; bir xil ishorali zaryadlar itarishadi, har xillari tortishadi.<\/div>\n<h3>Test<\/h3><div id=\"q3\"><\/div><\/div>\n<\/section>\n<\/main>\n<script>\n// ===== Yordamchi funksiyalar =====\nconst $=s=>document.querySelector(s),css=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();\nconst lerp=(a,b,t)=>a+(b-a)*t, cl=(v,a,b)=>Math.max(a,Math.min(b,v));\nconst uz=(x,d=2)=>(+x).toFixed(d).replace('.',',');\n// Bo'limlar (tablar)\ndocument.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{\n  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));\n  document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==b.dataset.t);});\n// Strelka va zaryad shari\nfunction arrow(c,x,y,a,L,col){const ex=x+Math.cos(a)*L,ey=y+Math.sin(a)*L;c.strokeStyle=c.fillStyle=col;c.lineWidth=3;\n  c.beginPath();c.moveTo(x,y);c.lineTo(ex,ey);c.stroke();c.beginPath();c.moveTo(ex,ey);\n  c.lineTo(ex-Math.cos(a-.5)*10,ey-Math.sin(a-.5)*10);c.lineTo(ex-Math.cos(a+.5)*10,ey-Math.sin(a+.5)*10);c.fill();}\nfunction ball(c,x,y,r,s){c.fillStyle=s>0?css('--pl'):s<0?css('--mn'):'#8a94a6';c.beginPath();c.arc(x,y,r,0,7);c.fill();\n  c.fillStyle='#fff';c.font='bold 18px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(s>0?'+':s<0?'−':'0',x,y+1);}\n// Test savollari\nconst Q={q1:[[\"Atomda manfiy zaryadli zarracha qaysi?\",[\"Proton\",\"Elektron\",\"Neytron\"],1],[\"Ikkita musbat zaryad bir-biriga qanday ta'sir qiladi?\",[\"Tortishadi\",\"Itarishadi\",\"Ta'sir qilmaydi\"],1],[\"Qaysi biri o'tkazgich?\",[\"Mis sim\",\"Shisha\",\"Rezina\"],0]],\nq2:[[\"Ikki jism tekkanda ularning umumiy zaryadi...\",[\"ortadi\",\"kamayadi\",\"o'zgarmaydi\"],2],[\"Elektron zaryadining moduli e = ?\",[\"1,6·10⁻¹⁹ C\",\"9·10⁹ C\",\"1,6·10¹⁹ C\"],0],[\"Qaysi zaryad qiymati mumkin?\",[\"2,4·10⁻¹⁹ C\",\"3,2·10⁻¹⁹ C\",\"0,8·10⁻¹⁹ C\"],1]],\nq3:[[\"Masofa 2 marta oshsa, Kulon kuchi...\",[\"2 marta kamayadi\",\"4 marta kamayadi\",\"4 marta ortadi\"],1],[\"Bir xil ishorali zaryadlar orasidagi kuch...\",[\"tortishish\",\"itarish\",\"nolga teng\"],1],[\"Zaryadlardan biri 2 marta ortsa, kuch...\",[\"2 marta ortadi\",\"4 marta ortadi\",\"o'zgarmaydi\"],0]]};\nObject.keys(Q).forEach(id=>Q[id].forEach(([q,o,a])=>{const d=document.createElement('div');d.className='qq';d.innerHTML='<p>'+q+'<\/p>';\n  const r=document.createElement('div');r.className='r';\n  o.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;\n    b.onclick=()=>{d.querySelectorAll('button').forEach(x=>x.className='');b.className=i===a?'ok':'no';r.className='r '+(i===a?'ok':'no');r.textContent=i===a?\"To'g'ri!\":\"Noto'g'ri. Qayta urinib ko'ring.\";};d.append(b);});\n  d.append(r);$('#'+id).append(d);}));\n\n// ===== 1-bo'lim: zaryadlarni sudrash =====\nconst c1=$('#c1'),g1=c1.getContext('2d');let ch,drag=null;\nconst reset1=()=>ch=[{x:100,y:110,s:1},{x:240,y:110,s:-1}];reset1();\nconst pos=(e,cv)=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};\nc1.onpointerdown=e=>{const[x,y]=pos(e,c1);drag=[...ch].reverse().find(k=>Math.hypot(k.x-x,k.y-y)<24)||null;if(drag)c1.setPointerCapture(e.pointerId)};\nc1.onpointermove=e=>{if(drag){const[x,y]=pos(e,c1);drag.x=cl(x,16,324);drag.y=cl(y,16,204)}};\nc1.onpointerup=()=>drag=null;\nconst add=s=>{ch.push({x:40+Math.random()*260,y:40+Math.random()*140,s});if(ch.length>6)ch.shift()};\n$('#addP').onclick=()=>add(1);$('#addM').onclick=()=>add(-1);$('#resB').onclick=reset1;\nfunction draw1(){g1.clearRect(0,0,340,220);\n  ch.forEach((a,i)=>{let fx=0,fy=0;ch.forEach((b,j)=>{if(i===j)return;const dx=a.x-b.x,dy=a.y-b.y,d=Math.max(Math.hypot(dx,dy),1),f=a.s*b.s*4e5/d/d;fx+=dx/d*f;fy+=dy/d*f});\n    const L=Math.min(70,Math.hypot(fx,fy));if(L>2)arrow(g1,a.x,a.y,Math.atan2(fy,fx),L+16,css('--tx'));});\n  ch.forEach(a=>ball(g1,a.x,a.y,16,a.s));}\n\n// ===== 1-bo'lim: ishqalash animatsiyasi =====\nconst c2=$('#c2'),g2=c2.getContext('2d');let rub={on:false,t:0,e:[]};\n$('#rubB').onclick=()=>rub={on:true,t:0,e:[]};\nfunction draw2(){g2.clearRect(0,0,340,190);\n  if(rub.on){rub.t++;if(rub.t%12===0&&rub.e.length<10)rub.e.push({sx:100+Math.random()*140,ox:-45+Math.random()*90,p:0});if(rub.t>240)rub.on=false;}\n  const rx=170+(rub.on?Math.sin(rub.t/7)*40:0);\n  g2.fillStyle='#c9a66b';g2.fillRect(80,115,180,55);g2.fillStyle='#8a6d3b';g2.font='13px sans-serif';g2.textAlign='center';g2.fillText('jun mato',170,160);\n  g2.fillStyle='#3b2f2f';g2.fillRect(rx-60,72,120,26);g2.fillStyle='#fff';g2.fillText('ebonit tayoqcha',rx,90);\n  let n=0;rub.e.forEach(e=>{if(e.p<1)e.p=Math.min(1,e.p+.03);else n++;\n    const x=lerp(e.sx,rx+e.ox,e.p),y=lerp(135,66,e.p);g2.fillStyle='#2a7de1';g2.beginPath();g2.arc(x,y,5,0,7);g2.fill();});\n  g2.fillStyle=css('--pl');g2.font='bold 16px sans-serif';for(let i=0;i<n;i++)g2.fillText('+',95+i*16,138);\n  $('#rubT').textContent=rub.e.length?`Tayoqcha: −${n}e · Mato: +${n}e`:'';}\n\n// ===== 2-bo'lim: saqlanish qonuni =====\nlet A=6,B=-2,touched=false;\nconst clr=v=>v>0?css('--pl'):v<0?css('--mn'):'#8a94a6';\nfunction r2(){$('#v1').textContent=$('#a1').value;$('#v2').textContent=$('#a2').value;\n  [['#bd1',A],['#bd2',B]].forEach(([s,v])=>{$(s).style.background=clr(v);$(s).textContent=(v>0?'+':'')+uz(v,v%1?1:0)+' nC'});\n  $('#sum').textContent=`Q₁ + Q₂ = ${uz(A,A%1?1:0)} + (${uz(B,B%1?1:0)}) = ${uz(A+B,(A+B)%1?1:0)} nC`;}\nfunction setAB(){A=+$('#a1').value;B=+$('#a2').value;touched=false;$('#msg2').textContent='';r2();}\n$('#a1').oninput=$('#a2').oninput=setAB;$('#untouch').onclick=setAB;\n$('#touch').onclick=()=>{if(touched)return;const m=(A+B)/2,d=Math.abs(A-m);touched=true;\n  $('#msg2').className='r ok';$('#msg2').textContent=d===0?\"Zaryadlar teng — elektronlar o'tmadi. Yig'indi o'zgarmadi.\":`Elektronlar ${A>B?'2-jismdan 1-jismga':'1-jismdan 2-jismga'} o'tdi (${uz(d,d%1?1:0)} nC). Yig'indi o'zgarmadi: ${uz(A+B,(A+B)%1?1:0)} nC.`;\n  A=B=m;r2();};\n\n// ===== 2-bo'lim: diskretlik =====\nlet n=0;const E=1.6;\nfunction r3(){$('#nn').textContent=n;const q=-n*E;$('#qq').textContent=(q===0?'0':uz(q,1)+'·10⁻¹⁹ C')+(n?` = ${-n}·e`:'');\n  const sg=n>0?'−':'+';$('#dots').textContent=n?sg.repeat(Math.min(Math.abs(n),60))+(Math.abs(n)>60?' …':''):'Jism neytral';$('#dots').style.color=n>0?css('--mn'):css('--pl');}\ndocument.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{n+=+b.dataset.n;$('#msg3').textContent='';r3();});\n$('#half').onclick=()=>{$('#msg3').className='r no';$('#msg3').textContent=\"Mumkin emas! Elektronning bo'lagi yo'q — zaryad faqat e ning butun karralisi.\";};\ndocument.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const v=parseFloat($('#'+b.dataset.c).value.replace(',','.')),r=$('#'+b.dataset.c+'r'),ok=Math.abs(v-b.dataset.a)<.01;\n  r.className='r '+(ok?'ok':'no');r.textContent=ok?\"To'g'ri!\":\"Noto'g'ri. q = n·e formulasini qo'llang.\";});\n\n// ===== 3-bo'lim: Kulon qonuni =====\nconst S1=$('#q1'),S2=$('#q2'),SR=$('#r');let mov=false;\nconst Fr=r=>9e9*Math.abs(S1.value*S2.value)*1e-18/((r/100)**2);\nconst fmtF=F=>F>=1?uz(F)+' N':F>=1e-3?uz(F*1e3)+' mN':uz(F*1e6)+' µN';\nfunction r4(){$('#w1').textContent=S1.value;$('#w2').textContent=S2.value;$('#w3').textContent=uz(SR.value,1);\n  const F=Fr(+SR.value),p=S1.value*S2.value;\n  $('#Fout').textContent='F = '+fmtF(F);\n  $('#kind').textContent=p>0?'Bir xil ishora: zaryadlar itarishadi.':p<0?'Har xil ishora: zaryadlar tortishadi.':'Zaryadlardan biri nol: kuch yo\\'q.';\n  const r=+SR.value;$('#dbl').textContent=p===0?'':(2*r<=20?`r = ${uz(r,1)} sm → ${uz(2*r,1)} sm bo'lsa: F = ${fmtF(F)} → ${fmtF(Fr(2*r))} (4 marta kamayadi)`:`r ni 2 marta oshirsangiz, F 4 marta kamayadi (r ≤ 10 sm tanlang).`);}\n[S1,S2,SR].forEach(s=>s.oninput=()=>{mov=false;r4();});\n$('#go').onclick=()=>mov=true;$('#stop').onclick=()=>mov=false;\nfunction draw4(){const g=$('#c4').getContext('2d');g.clearRect(0,0,340,150);\n  if(mov){const p=S1.value*S2.value,F=Fr(+SR.value);if(p===0)mov=false;else{const nr=+SR.value+(p>0?1:-1)*Math.min(.3,.03+F*300);\n    if(nr>=20||nr<=1)mov=false;SR.value=cl(nr,1,20);r4();}}\n  const r=+SR.value,X1=170-r*7,X2=170+r*7;\n  const p=S1.value*S2.value,F=Fr(r),L=cl(F*1e6*.4,4,90),dir=p>0?1:-1;\n  if(p!==0){arrow(g,X1,60,dir>0?Math.PI:0,L+14,css('--tx'));arrow(g,X2,60,dir>0?0:Math.PI,L+14,css('--tx'));}\n  ball(g,X1,60,14,+S1.value);ball(g,X2,60,14,+S2.value);\n  g.strokeStyle=css('--mu');g.lineWidth=1.5;g.beginPath();g.moveTo(X1,115);g.lineTo(X2,115);g.stroke();\n  g.fillStyle=css('--mu');g.font='13px sans-serif';g.textAlign='center';g.fillText(`r = ${uz(r,1)} sm`,170,136);}\nfunction draw5(){const g=$('#c5').getContext('2d');g.clearRect(0,0,340,200);\n  const L=42,R=328,T=14,Bt=160,F1=Fr(1),tx=r=>L+(r-1)/19*(R-L),ty=F=>Bt-F/F1*(Bt-T);\n  g.strokeStyle=css('--mu');g.lineWidth=1.5;g.beginPath();g.moveTo(L,T);g.lineTo(L,Bt);g.lineTo(R,Bt);g.stroke();\n  g.fillStyle=css('--mu');g.font='12px sans-serif';g.textAlign='center';[1,5,10,15,20].forEach(v=>g.fillText(v,tx(v),Bt+16));\n  g.fillText('r, sm',R-14,Bt+34);g.textAlign='left';g.fillText('F',L+6,T+8);\n  if(F1===0){g.fillText(\"Zaryadlar noldan farqli bo'lsin\",60,90);return;}\n  g.strokeStyle=css('--pl');g.lineWidth=2.5;g.beginPath();for(let r=1;r<=20;r+=.25){const x=tx(r),y=ty(Fr(r));r===1?g.moveTo(x,y):g.lineTo(x,y)}g.stroke();\n  const r=+SR.value;g.fillStyle=css('--tx');g.beginPath();g.arc(tx(r),ty(Fr(r)),6,0,7);g.fill();\n  if(2*r<=20){g.strokeStyle=css('--mn');g.lineWidth=2.5;g.beginPath();g.arc(tx(2*r),ty(Fr(2*r)),6,0,7);g.stroke();}}\n\n// ===== Asosiy sikl =====\nfunction loop(){draw1();draw2();draw4();draw5();requestAnimationFrame(loop)}\nsetAB();r3();r4();loop();\n<\/script><\/body><\/html>\n", "<!DOCTYPE html>\n<html lang=\"uz\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Jismlarning zaryadlanishi<\/title>\n<style>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6ff;--card:#fff;--tx:#1d2340;--mu:#5c6485;--ac:#5b5bf0;--pos:#e5484d;--neg:#2f7df6;--bd:#dfe3f5}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#12142a;--card:#1c1f3d;--tx:#eef0ff;--mu:#a3a9cf;--bd:#2f3363}}\n:root[data-theme=\"dark\"]{--bg:#12142a;--card:#1c1f3d;--tx:#eef0ff;--mu:#a3a9cf;--bd:#2f3363}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,\"Segoe UI\",sans-serif}\nheader{padding:18px 16px 6px;text-align:center}\nh1{margin:0;font-size:1.4rem}\nheader p{margin:4px 0 0;color:var(--mu);font-size:.9rem}\nnav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}\nnav button{flex:1 0 auto;padding:10px 14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-weight:600;cursor:pointer}\nnav button.on{background:var(--ac);border-color:var(--ac);color:#fff}\nmain{max-width:760px;margin:0 auto;padding:0 12px 40px}\nsection{display:none}section.on{display:block}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin:10px 0}\nh2{font-size:1.15rem;margin:0 0 6px}\ncanvas{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:14px;touch-action:none;display:block}\n.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}\nbutton.b{padding:9px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}\nbutton.b.s{background:var(--bd);color:var(--tx)}\nbutton.b.on{outline:3px solid var(--ac);outline-offset:2px}\n.read{font-weight:700;padding:6px 12px;border-radius:10px;background:var(--bd)}\nlabel{display:block;font-size:.9rem;color:var(--mu)}\ninput[type=range]{width:100%}\n.sum{border-left:5px solid var(--ac)}.fact{border-left:5px solid #f5a623}\n.q{margin:10px 0}.q b{display:block;margin-bottom:4px}\n.q button{display:block;width:100%;text-align:left;margin:4px 0;padding:9px 12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;cursor:pointer;font-size:.95rem}\n.q button.ok{border-color:#2cb67d;background:#2cb67d33}.q button.no{border-color:var(--pos);background:#e5484d33}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}\n.grid div{background:var(--bd);border-radius:10px;padding:8px 10px;font-size:.9rem}\n.big{font-size:1.6rem;font-weight:800;text-align:center}\n<\/style><\/head><body>\n<header><h1>⚡ Jismlarning zaryadlanishi<\/h1><p>8-sinf fizika · interaktiv dars<\/p><\/header>\n<nav id=\"nav\"><\/nav>\n<main>\n\n<section id=\"s0\" class=\"on\">\n<div class=\"card\"><h2>1. Elektr zaryadi<\/h2>\n<p>Hamma modda atomlardan tashkil topgan. Atom yadrosida <b style=\"color:var(--pos)\">proton (+)<\/b> va neytron (0) bor, atrofida <b style=\"color:var(--neg)\">elektronlar (−)<\/b> aylanadi. Neytral atomda protonlar va elektronlar soni teng. Elektron ortiqcha bo'lsa jism <b>manfiy<\/b>, kam bo'lsa <b>musbat<\/b> zaryadlanadi. Elementar zaryad e = 1,6·10⁻¹⁹ C.<\/p><\/div>\n<canvas id=\"c0\" width=\"600\" height=\"280\"><\/canvas>\n<div class=\"row\"><button class=\"b\" id=\"add\">➕ Elektron qo'shish<\/button><button class=\"b s\" id=\"rem\">➖ Elektronni olish<\/button>\n<span class=\"read\" id=\"r0\"><\/span><\/div>\n<div class=\"card sum\"><h2>Xulosa<\/h2>Zaryad = (protonlar − elektronlar)·e. Zaryad yo'qolmaydi, faqat bir jismdan ikkinchisiga o'tadi — bu zaryadning saqlanish qonuni.<\/div>\n<div class=\"card fact\"><h2>💡 Bilib oling<\/h2>1 kulon zaryadda taxminan 6,24·10¹⁸ ta elektron bor!<\/div>\n<div class=\"card\"><h2>Test<\/h2><div class=\"quiz\" data-s=\"0\"><\/div><\/div>\n<\/section>\n\n<section id=\"s1\">\n<div class=\"card\"><h2>2. Zaryadlash usullari<\/h2>\n<p><b>Ishqalash:<\/b> ebonit tayoqcha junga ishqalanganda elektronlar jundan tayoqchaga o'tadi. <b>Tegizish:<\/b> zaryadlangan jism zaryad beradi. <b>Ta'sir (induksiya):<\/b> tayoqcha tegmasdan yaqinlashtirilganda zaryadlar jism ichida qayta taqsimlanadi.<\/p>\n<p style=\"color:var(--mu);margin:0\">Usulni tanlang, so'ng ebonit tayoqchani barmoq/sichqoncha bilan sudrang.<\/p><\/div>\n<div class=\"row\" id=\"modes\"><\/div>\n<canvas id=\"c1\" width=\"600\" height=\"340\"><\/canvas>\n<div class=\"row\"><button class=\"b s\" id=\"reset1\">↺ Boshidan<\/button><span class=\"read\" id=\"r1\"><\/span><\/div>\n<div class=\"card sum\"><h2>Xulosa<\/h2>Ishqalashda ikkala jism qarama-qarshi zaryadlanadi. Tegizishda jism tayoqcha bilan bir xil ishorali zaryad oladi. Induksiyada jism vaqtincha qutblanadi.<\/div>\n<div class=\"card fact\"><h2>💡 Bilib oling<\/h2>“Elektron” so'zi yunoncha “elektron” — qahrabo degan ma'noni bildiradi. Qahrabo junga ishqalanganda mayda narsalarni tortgan.<\/div>\n<div class=\"card\"><h2>Test<\/h2><div class=\"quiz\" data-s=\"1\"><\/div><\/div>\n<\/section>\n\n<section id=\"s2\">\n<div class=\"card\"><h2>3. Zaryadlarning o'zaro ta'siri<\/h2>\n<p>Bir xil ishorali zaryadlar <b>itarishadi<\/b>, har xil ishoralilari <b>tortishadi<\/b>. Kulon qonuni: <b>F = k·|q₁·q₂| / r²<\/b>, k = 9·10⁹ N·m²/C². Zaryad oshsa kuch ortadi, masofa oshsa kuch kamayadi.<\/p><\/div>\n<canvas id=\"c2\" width=\"600\" height=\"240\"><\/canvas>\n<div class=\"card\">\n<label>q₁ = <span id=\"v1\"><\/span> µC<\/label><input type=\"range\" id=\"q1\" min=\"-5\" max=\"5\" step=\"1\" value=\"3\">\n<label>q₂ = <span id=\"v2\"><\/span> µC<\/label><input type=\"range\" id=\"q2\" min=\"-5\" max=\"5\" step=\"1\" value=\"-3\">\n<label>Masofa r = <span id=\"vr\"><\/span> sm (q₂ ni sudrash ham mumkin)<\/label><input type=\"range\" id=\"rr\" min=\"10\" max=\"50\" step=\"1\" value=\"25\">\n<div class=\"big\" id=\"F\"><\/div><\/div>\n<div class=\"card\"><h2>Amaliy qo'llanilishi<\/h2><div class=\"grid\">\n<div>🌫️ <b>Elektrostatik filtr<\/b> — chang zarralari zaryadlanib plastinkaga yopishadi<\/div>\n<div>🖨️ <b>Printer va fotokopi<\/b> — zaryadlangan baraban toner kukunini tortadi<\/div>\n<div>🎨 <b>Bo'yoq purkash<\/b> — zaryadlangan tomchilar buyumga tekis yopishadi<\/div>\n<div>⛈️ <b>Yashin qaytargich<\/b> — chaqmoq zaryadini yerga o'tkazadi<\/div>\n<div>🛢️ <b>Statik himoya<\/b> — yonilg'i sisternalari yerga ulanadi<\/div><\/div><\/div>\n<div class=\"card sum\"><h2>Xulosa<\/h2>Zaryadlar orasidagi kuch zaryadlar ko'paytmasiga to'g'ri, masofa kvadratiga teskari proporsional.<\/div>\n<div class=\"card fact\"><h2>💡 Bilib oling<\/h2>Chaqmoqda kuchlanish yuz millionlab voltga yetadi, kanal harorati Quyosh yuzasidan ham yuqori bo'ladi.<\/div>\n<div class=\"card\"><h2>Test<\/h2><div class=\"quiz\" data-s=\"2\"><\/div><\/div>\n<\/section>\n\n<section id=\"s3\">\n<div class=\"card\"><h2>🏁 Yakuniy test<\/h2><p>10 ta savol. Oxirida natija ko'rsatiladi.<\/p><\/div>\n<div class=\"card\"><div class=\"quiz\" data-s=\"3\"><\/div><div class=\"big\" id=\"res\"><\/div><\/div>\n<\/section>\n<\/main>\n<script>\n// ---- Yordamchi funksiyalar ----\nconst $=id=>document.getElementById(id);\nconst css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst names=[\"1. Zaryad\",\"2. Usullar\",\"3. Ta'sir\",\"Yakuniy test\"];\nnames.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>go(i);$('nav').append(b)});\nfunction go(i){document.querySelectorAll('section').forEach((s,j)=>s.classList.toggle('on',i==j));\n [...$('nav').children].forEach((b,j)=>b.classList.toggle('on',i==j));scrollTo(0,0)}\ngo(0);\nfunction ptr(c,e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}\nfunction dot(x,y,r,col,sign){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();\n if(sign){ctx.fillStyle='#fff';ctx.font='bold '+r*1.4+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(sign,x,y+1)}}\nlet ctx;\n\n// ---- 1-bo'lim: atom ----\nconst c0=$('c0');let n0=6,t=0;\n$('add').onclick=()=>{if(n0<12)n0++};$('rem').onclick=()=>{if(n0>0)n0--};\nfunction draw0(){ctx=c0.getContext('2d');ctx.clearRect(0,0,600,280);t+=.02;\n const cx=300,cy=140,P=6,q=P-n0;\n for(let r of [60,95,125]){ctx.strokeStyle=css('--bd');ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke()}\n for(let i=0;i<P;i++)dot(cx+Math.cos(i*2)*14,cy+Math.sin(i*2)*14,9,css('--pos'),'+');\n for(let i=0;i<n0;i++){const r=i<2?60:i<8?95:125,a=t*(1.6-r/100)+i*2.4;dot(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.95,8,css('--neg'),'−')}\n const st=q==0?'Neytral':q>0?'Musbat zaryadlangan':'Manfiy zaryadlangan';\n $('r0').textContent=`${st}: q = ${q>0?'+':''}${q}e = ${(q*1.6).toFixed(1)}·10⁻¹⁹ C`;\n requestAnimationFrame(draw0)}draw0();\n\n// ---- 2-bo'lim: usullar ----\nconst c1=$('c1');let mode=0,rod,rq,eq,cl,lastX,lastY,drag=false,hint='';\nconst M=[\"Ishqalash\",\"Tegizish\",\"Induksiya\"];\nM.forEach((m,i)=>{const b=document.createElement('button');b.className='b s';b.textContent=m;b.onclick=()=>{mode=i;rst1();[...$('modes').children].forEach((x,j)=>x.classList.toggle('on',i==j))};$('modes').append(b)});\n$('modes').children[0].classList.add('on');\nfunction rst1(){rod={x:110,y:110};rq=mode==0?0:-6;eq=0;cl=0}rst1();$('reset1').onclick=rst1;\nconst EX=450,EY=200;// elektroskop tepasi\nc1.onpointerdown=e=>{const p=ptr(c1,e);if(Math.hypot(p.x-rod.x,p.y-rod.y)<70){drag=true;lastX=p.x;lastY=p.y;c1.setPointerCapture(e.pointerId)}};\nc1.onpointerup=()=>drag=false;\nc1.onpointermove=e=>{if(!drag)return;const p=ptr(c1,e);\n if(mode==0&&p.y>200&&p.x<300)rq=Math.max(-12,rq-Math.hypot(p.x-lastX,p.y-lastY)/90);\n rod.x=Math.max(30,Math.min(570,p.x));rod.y=Math.max(30,Math.min(320,p.y));lastX=p.x;lastY=p.y};\nfunction draw1(){ctx=c1.getContext('2d');ctx.clearRect(0,0,600,340);ctx.textAlign='center';ctx.textBaseline='middle';\n const tx=css('--tx'),d=Math.hypot(rod.x+60-EX,rod.y-EY);\n if(mode==0){ctx.fillStyle='#c98b3f66';ctx.fillRect(20,235,280,90);ctx.fillStyle=tx;ctx.font='14px sans-serif';\n  ctx.fillText('Jun mato (ishqalang!)',160,280);\n  // jun ishorasi: tayoqchaga o'tgan elektron soni\n  for(let i=0;i<-rq;i++)dot(40+i*20,250,6,css('--pos'),'+')}\n // elektroskop\n let touch=d<50,ind=0;\n if(mode==1&&touch&&rq<0){const k=Math.min(-rq,.05*(1));eq-=.05;rq+=.05*.5}\n if(mode==2){ind=Math.max(0,1-d/220)*Math.abs(rq)/12*70}\n const ang=mode==2?ind:Math.min(70,Math.abs(eq)*12);\n ctx.strokeStyle=tx;ctx.lineWidth=3;ctx.strokeRect(EX-45,EY+40,90,110);\n ctx.beginPath();ctx.moveTo(EX,EY);ctx.lineTo(EX,EY+70);ctx.stroke();dot(EX,EY-8,10,tx);\n for(let s of[-1,1]){ctx.beginPath();ctx.moveTo(EX,EY+70);ctx.lineTo(EX+s*Math.sin(ang*Math.PI/180)*50,EY+70+Math.cos(ang*Math.PI/180)*50);ctx.stroke()}\n if(mode==2&&ind>2){dot(EX,EY-8,5,css('--pos'),'+');dot(EX-8,EY+90,5,css('--neg'),'−')}\n ctx.font='13px sans-serif';ctx.fillStyle=tx;ctx.fillText('Elektroskop',EX,EY+165);\n // tayoqcha\n ctx.save();ctx.translate(rod.x,rod.y);ctx.lineWidth=16;ctx.lineCap='round';ctx.strokeStyle='#4a3b32';\n ctx.beginPath();ctx.moveTo(-60,0);ctx.lineTo(60,0);ctx.stroke();ctx.restore();\n for(let i=0;i<Math.round(-rq)&&i<12;i++)dot(rod.x-55+i*10,rod.y,4,css('--neg'),'');\n ctx.fillStyle=tx;ctx.fillText('Ebonit tayoqcha',rod.x,rod.y-24);\n const qs=Math.round(-rq),es=Math.abs(eq)>.3?(eq<0?'manfiy':'musbat'):'neytral';\n $('r1').textContent=`Tayoqcha: −${qs} birlik · Elektroskop: ${mode==2&&ind>2?'induksiya (qutblangan)':es}`;\n requestAnimationFrame(draw1)}draw1();\n\n// ---- 3-bo'lim: Kulon ----\nconst c2=$('c2');let dr=false;\nfunction draw2(){ctx=c2.getContext('2d');ctx.clearRect(0,0,600,240);\n const q1=+$('q1').value,q2=+$('q2').value,r=+$('rr').value;\n $('v1').textContent=q1;$('v2').textContent=q2;$('vr').textContent=r;\n const x1=300-r*5,x2=300+r*5,y=120,F=9e9*Math.abs(q1*q2)*1e-12/((r/100)**2);\n const dir=Math.sign(q1*q2)||0,L=Math.min(120,F*25);// dir>0 itarish\n ctx.strokeStyle=css('--bd');ctx.beginPath();ctx.moveTo(x1,y+50);ctx.lineTo(x2,y+50);ctx.stroke();\n ctx.fillStyle=css('--mu');ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('r = '+r+' sm',300,y+68);\n const arr=(x,s)=>{if(!L||!dir)return;const e=x+s*L;ctx.strokeStyle='#2cb67d';ctx.fillStyle='#2cb67d';ctx.lineWidth=4;\n  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(e,y);ctx.stroke();ctx.beginPath();ctx.moveTo(e,y);ctx.lineTo(e-s*12,y-8);ctx.lineTo(e-s*12,y+8);ctx.fill()};\n arr(x1,dir>0?-1:1);arr(x2,dir>0?1:-1);\n for(const[x,q]of[[x1,q1],[x2,q2]])dot(x,y,18,q>0?css('--pos'):q<0?css('--neg'):'#999',q>0?'+':q<0?'−':'0');\n $('F').textContent=`F = ${F.toFixed(2)} N — ${!dir?'ta\\'sir yo\\'q':dir>0?'itarishadi':'tortishadi'}`;\n requestAnimationFrame(draw2)}draw2();\nc2.onpointerdown=e=>{dr=true;c2.setPointerCapture(e.pointerId)};c2.onpointerup=()=>dr=false;\nc2.onpointermove=e=>{if(dr)$('rr').value=Math.max(10,Math.min(50,Math.round((ptr(c2,e).x-300)/5)))};\n\n// ---- Testlar ----\nconst Q=[\n[[\"Atom yadrosida qanday zarralar bor?\",[\"Proton va neytron\",\"Proton va elektron\",\"Faqat elektron\"],0],\n [\"Jism elektron yo'qotsa, u...\",[\"Manfiy zaryadlanadi\",\"Musbat zaryadlanadi\",\"Neytral qoladi\"],1],\n [\"Elementar zaryad qiymati:\",[\"1,6·10⁻¹⁹ C\",\"9·10⁹ C\",\"1 C\"],0]],\n[[\"Ebonit tayoqchaga jun ishqalansa, tayoqcha...\",[\"Musbat bo'ladi\",\"Manfiy bo'ladi\",\"Zaryadlanmaydi\"],1],\n [\"Tegizish orqali zaryadlangan jism zaryadi...\",[\"Tayoqchaga qarama-qarshi\",\"Tayoqcha bilan bir xil ishorali\",\"Nolga teng\"],1],\n [\"Induksiyada tayoqcha jismga...\",[\"Tegadi\",\"Tegmaydi, yaqinlashtiriladi\",\"Ishqalanadi\"],1]],\n[[\"Bir xil ishorali zaryadlar...\",[\"Tortishadi\",\"Itarishadi\",\"Ta'sirlashmaydi\"],1],\n [\"Masofa 2 marta ortsa, kuch...\",[\"2 marta kamayadi\",\"4 marta kamayadi\",\"Ortadi\"],1],\n [\"Yashin qaytargich nima uchun kerak?\",[\"Zaryadni yerga o'tkazish\",\"Chaqmoq hosil qilish\",\"Changni tozalash\"],0]],\n[[\"Zaryadning saqlanish qonuni: zaryad...\",[\"Yo'qoladi\",\"Bir jismdan ikkinchisiga o'tadi\",\"Doim ortadi\"],1],\n [\"Neytral atomda...\",[\"Protonlar = elektronlar\",\"Protonlar > elektronlar\",\"Neytronlar yo'q\"],0],\n [\"Ipakka ishqalangan shisha tayoqcha...\",[\"Musbat zaryadlanadi\",\"Manfiy zaryadlanadi\",\"O'zgarmaydi\"],0],\n [\"Elektroskop nimani aniqlaydi?\",[\"Massani\",\"Zaryad borligini\",\"Haroratni\"],1],\n [\"Kulon qonuni formulasi:\",[\"F = k·q₁q₂/r²\",\"F = m·a\",\"F = q/r\"],0],\n [\"Zaryad 2 marta ortsa (r o'zgarmas), kuch...\",[\"2 marta ortadi\",\"O'zgarmaydi\",\"2 marta kamayadi\"],0],\n [\"Elektrostatik filtr nimani ushlaydi?\",[\"Suvni\",\"Chang zarralarini\",\"Yorug'likni\"],1],\n [\"Zaryad birligi:\",[\"Nyuton\",\"Kulon\",\"Volt\"],1],\n [\"Manfiy va musbat zaryad...\",[\"Itarishadi\",\"Tortishadi\",\"Bir-biriga befarq\"],1],\n [\"Printer tonerini nima tortadi?\",[\"Zaryadlangan baraban\",\"Magnit\",\"Shamol\"],0]]];\nlet score=0,done=0;\ndocument.querySelectorAll('.quiz').forEach(box=>{const s=+box.dataset.s;\n Q[s].forEach(([q,o,a],i)=>{const d=document.createElement('div');d.className='q';d.innerHTML=`<b>${i+1}. ${q}<\/b>`;\n  o.forEach((t,j)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{\n   if(d.dataset.d)return;d.dataset.d=1;const ok=j==a;b.classList.add(ok?'ok':'no');\n   if(!ok)d.children[a+1].classList.add('ok');\n   if(s==3){done++;if(ok)score++;if(done==10)$('res').textContent=`Natija: ${score}/10 ${score>=8?\"🏆 A'lo!\":score>=5?'👍 Yaxshi':'📘 Mavzuni takrorlang'}`}};\n   d.append(b)});box.append(d)})});\n<\/script><\/body><\/html>\n", "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Zaryadlarning o'zaro ta'siri. Kulon qonuni<\/title>\n<style>\n:root{--bg:#f2f6fb;--card:#fff;--tx:#14213d;--mut:#5b6b85;--bd:#d9e2ef;--pos:#e5484d;--neg:#2f6bff;--frc:#16a34a;--res:#a855f7;--acc:#0ea5a4;--cv:#f8fbff;--fact:#fff4c7}\n:root[data-theme=dark]{--bg:#0d1420;--card:#16202f;--tx:#e8eef8;--mut:#95a5bf;--bd:#28364c;--pos:#ff6b70;--neg:#6f97ff;--frc:#34d399;--res:#c084fc;--acc:#2dd4bf;--cv:#0f1826;--fact:#3a3110}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",sans-serif}\nheader{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(100deg,var(--pos),var(--neg));color:#fff}\nheader h1{font-size:1.15rem;margin:0;flex:1;line-height:1.25}\n#theme{border:0;border-radius:99px;padding:8px 12px;font-size:1rem;cursor:pointer;background:rgba(255,255,255,.25);color:#fff}\nnav{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--bd)}\nnav button{flex:1 0 auto;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap}\nnav button.on{background:var(--acc);border-color:var(--acc);color:#04211f}\nmain{max-width:860px;margin:0 auto;padding:12px}\n.panel{display:none}.panel.on{display:block}\nh2{margin:8px 0 12px;font-size:1.3rem}\nh3{margin:0 0 8px;font-size:1.05rem}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}\n.sum{border-left:6px solid var(--acc)}\n.fact{background:var(--fact);border-color:transparent}\ncanvas{width:100%;display:block;border-radius:12px;background:var(--cv);border:1px solid var(--bd);touch-action:none}\n.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}\n.btn,.opt{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:.95rem;cursor:pointer}\n.btn.on{border-color:var(--acc);background:var(--acc);color:#04211f;font-weight:700}\n.btn.p{color:var(--pos)}.btn.n{color:var(--neg)}\n.btn.p.on{background:var(--pos);border-color:var(--pos);color:#fff}\n.btn.n.on{background:var(--neg);border-color:var(--neg);color:#fff}\n.sl{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin:6px 0}\n.sl input{width:100%;accent-color:var(--acc);height:28px}\n.big{font-size:1.15rem;font-weight:800;text-align:center;margin:6px 0;min-height:1.6em}\n.calc{background:var(--cv);border:1px dashed var(--bd);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:.88rem;line-height:1.8;overflow-x:auto}\n.q{margin:10px 0}.q p{margin:0 0 6px;font-weight:600}\n.opt{display:block;width:100%;text-align:left;margin:5px 0}\n.opt.ok{background:#16a34a;border-color:#16a34a;color:#fff}\n.opt.bad{background:#dc2626;border-color:#dc2626;color:#fff}\n.fb{font-size:.9rem;color:var(--mut);min-height:1.2em}\n.pos{color:var(--pos);font-weight:700}.neg{color:var(--neg);font-weight:700}.frc{color:var(--frc);font-weight:700}\n.legend{font-size:.85rem;color:var(--mut)}\n#res{text-align:center;font-size:1.2rem;font-weight:800;margin-top:10px}\n:focus-visible{outline:3px solid var(--acc);outline-offset:2px}\n<\/style>\n<\/head>\n<body>\n<header><h1>Zaryadlarning o'zaro ta'siri. Kulon qonuni<\/h1><button id=\"theme\" aria-label=\"Rejimni almashtirish\">🌓<\/button><\/header>\n<nav id=\"tabs\">\n<button data-t=\"1\" class=\"on\">1. O'zaro ta'sir<\/button>\n<button data-t=\"2\">2. Kulon qonuni<\/button>\n<button data-t=\"3\">3. Vektor va superpozitsiya<\/button>\n<button data-t=\"4\">Yakuniy test<\/button>\n<\/nav>\n<main>\n\n<\!-- ============ 1-BO'LIM ============ -->\n<section id=\"t1\" class=\"panel on\">\n<h2>Zaryadlarning o'zaro ta'sir xarakteri<\/h2>\n<div class=\"card\"><h3>Nazariya<\/h3>\n<p>Zaryadlar ikki xil: <span class=\"pos\">musbat (+)<\/span> va <span class=\"neg\">manfiy (−)<\/span>. <b>Bir xil ishorali<\/b> zaryadlar <b>itarishadi<\/b>, <b>har xil ishoralilari<\/b> esa <b>tortishadi<\/b>.<\/p>\n<p>Zaryadlangan jismlarning bir-biriga ta'sir kuchi <b>elektrostatik kuch<\/b> (Kulon kuchi) deyiladi.<\/p>\n<p><b>Nyutonning III qonuni:<\/b> 1-zaryad 2-zaryadga qanday kuch bilan ta'sir qilsa, 2-zaryad ham 1-zaryadga shunday kuch bilan ta'sir qiladi: kattaligi teng, yo'nalishi qarama-qarshi. F₁₂ = −F₂₁.<\/p><\/div>\n<div class=\"card\"><h3>Animatsiya<\/h3><canvas id=\"a1\"><\/canvas><div class=\"legend\">Yashil o'q — kuch. Zaryadlar yaqinlashganda kuch kattalashadi.<\/div><\/div>\n<div class=\"card\"><h3>Simulyatsiya<\/h3>\n<div class=\"row\">1-zaryad: <button class=\"btn p on\" data-w=\"a\" data-s=\"1\">+<\/button><button class=\"btn n\" data-w=\"a\" data-s=\"-1\">−<\/button>\n2-zaryad: <button class=\"btn p\" data-w=\"b\" data-s=\"1\">+<\/button><button class=\"btn n on\" data-w=\"b\" data-s=\"-1\">−<\/button>\n<button class=\"btn\" id=\"rs1\">Qayta boshlash<\/button><\/div>\n<canvas id=\"s1\"><\/canvas>\n<div class=\"big\" id=\"st1\"><\/div>\n<div class=\"legend\">Zaryadni barmoq yoki sichqoncha bilan sudrab, qo'yib yuboring (q = 2 µC, massa 0,5 kg, devorlardan qaytadi).<\/div><\/div>\n<div class=\"card\"><h3>Masala<\/h3>\n<p>1-zaryad 2-zaryadga 0,2 N kuch bilan ta'sir qilmoqda. 2-zaryad 1-zaryadga qanday kuch bilan ta'sir qiladi?<\/p>\n<div class=\"calc\">Yechim: Nyutonning III qonuniga ko'ra<br>F₂₁ = F₁₂ = 0,2 N<br>Yo'nalishi qarama-qarshi.<\/div><\/div>\n<div class=\"card sum\"><h3>Xulosa<\/h3><p>Bir xil ishorali zaryadlar itarishadi, har xil ishoralilari tortishadi. Ikki zaryadning o'zaro kuchlari kattalik jihatdan teng, yo'nalish jihatdan qarama-qarshi.<\/p><\/div>\n<div class=\"card fact\"><h3>Bilib oling<\/h3><p>Quruq sochni taroq bilan tarasangiz, taroq mayda qog'oz parchalarini tortadi. «Elektr» so'zi yunoncha «elektron» (qahrabo) so'zidan kelib chiqqan: qadimda qahrabo junga ishqalab elektrlangan.<\/p><\/div>\n<div class=\"card\"><h3>Test<\/h3><div class=\"quiz\" data-set=\"s1\"><\/div><\/div>\n<\/section>\n\n<\!-- ============ 2-BO'LIM ============ -->\n<section id=\"t2\" class=\"panel\">\n<h2>Kulon qonuni<\/h2>\n<div class=\"card\"><h3>Nazariya<\/h3>\n<p>Ikki nuqtaviy zaryad orasidagi kuch:<\/p>\n<p class=\"big\">F = k · |q₁ · q₂| / r²<\/p>\n<p>k = 9·10⁹ N·m²/C² — proporsionallik koeffitsiyenti. Zaryad birligi — <b>kulon (C)<\/b>. 1 µC (mikrokulon) = 10⁻⁶ C.<\/p>\n<p>Kuch zaryadlar ko'paytmasiga <b>to'g'ri proporsional<\/b>, masofa kvadratiga <b>teskari proporsional<\/b>.<\/p><\/div>\n<div class=\"card\"><h3>Animatsiya<\/h3><canvas id=\"a2\"><\/canvas><div class=\"legend\">Masofa 2 marta ortsa kuch 4 marta, 3 marta ortsa 9 marta kamayadi.<\/div><\/div>\n<div class=\"card\"><h3>Simulyatsiya<\/h3>\n<canvas id=\"m2\"><\/canvas>\n<div class=\"sl\"><span>q₁<\/span><input type=\"range\" id=\"q1\" min=\"-10\" max=\"10\" step=\"0.5\" value=\"2\"><b id=\"v1\"><\/b><\/div>\n<div class=\"sl\"><span>q₂<\/span><input type=\"range\" id=\"q2\" min=\"-10\" max=\"10\" step=\"0.5\" value=\"3\"><b id=\"v2\"><\/b><\/div>\n<div class=\"sl\"><span>r<\/span><input type=\"range\" id=\"r\" min=\"5\" max=\"50\" step=\"1\" value=\"30\"><b id=\"v3\"><\/b><\/div>\n<div class=\"big\" id=\"st2\"><\/div>\n<div class=\"calc\" id=\"steps\"><\/div>\n<h3 style=\"margin-top:12px\">F(r) grafigi<\/h3><canvas id=\"g2\"><\/canvas><\/div>\n<div class=\"card\"><h3>Masala<\/h3>\n<p>q₁ = 2 µC va q₂ = 3 µC zaryadlar r = 30 sm masofada turibdi. Ular orasidagi kuchni toping.<\/p>\n<div class=\"calc\">Berilgan: q₁ = 2·10⁻⁶ C, q₂ = 3·10⁻⁶ C, r = 0,3 m<br>F = k·q₁·q₂ / r²<br>F = 9·10⁹ · 6·10⁻¹² / 0,09 = 0,054 / 0,09 = <b>0,6 N<\/b><\/div><\/div>\n<div class=\"card sum\"><h3>Xulosa<\/h3><p>F = k·|q₁q₂|/r². Zaryad 2 marta ortsa kuch 2 marta ortadi; masofa 2 marta ortsa kuch 4 marta kamayadi.<\/p><\/div>\n<div class=\"card fact\"><h3>Bilib oling<\/h3><p>1 C — juda katta zaryad. Ikki 1 C zaryad 1 m masofada 9·10⁹ N kuch bilan ta'sirlashadi. Bu taxminan 900 ming tonna og'irlikka teng!<\/p><\/div>\n<div class=\"card\"><h3>Test<\/h3><div class=\"quiz\" data-set=\"s2\"><\/div><\/div>\n<\/section>\n\n<\!-- ============ 3-BO'LIM ============ -->\n<section id=\"t3\" class=\"panel\">\n<h2>Vektor xossasi va superpozitsiya<\/h2>\n<div class=\"card\"><h3>Nazariya<\/h3>\n<p>Kulon kuchi <b>vektor kattalik<\/b>: moduli va yo'nalishi bor. Kuch zaryadlarni tutashtiruvchi chiziq bo'ylab yo'nalgan (itarishda — uzoqlashtiradi, tortishda — yaqinlashtiradi).<\/p>\n<p><b>Superpozitsiya prinsipi:<\/b> zaryadga bir necha zaryad ta'sir qilsa, natijaviy kuch alohida kuchlarning vektor yig'indisiga teng:<\/p>\n<p class=\"big\">F = F₁ + F₂ + ...<\/p><\/div>\n<div class=\"card\"><h3>Animatsiya: parallelogramm qoidasi<\/h3><canvas id=\"a3\"><\/canvas><\/div>\n<div class=\"card\"><h3>Simulyatsiya<\/h3>\n<div class=\"row\"><button class=\"btn\" data-sel=\"0\">q₀ (sinov)<\/button><button class=\"btn\" data-sel=\"1\">q₁<\/button><button class=\"btn\" data-sel=\"2\">q₂<\/button>\n<button class=\"btn p\" data-sg=\"1\">+<\/button><button class=\"btn n\" data-sg=\"-1\">−<\/button><\/div>\n<div class=\"sl\"><span>|q|<\/span><input type=\"range\" id=\"q3\" min=\"1\" max=\"10\" step=\"0.5\" value=\"4\"><b id=\"v4\"><\/b><\/div>\n<canvas id=\"s3\"><\/canvas>\n<div class=\"calc\" id=\"side3\"><\/div>\n<div class=\"legend\">Zaryadni sudrang. Yashil — alohida kuchlar, binafsha — natijaviy kuch. Vektorlar masshtabi avtomatik.<\/div><\/div>\n<div class=\"card\"><h3>Masala<\/h3>\n<p>Sinov zaryadiga o'zaro perpendikulyar F₁ = 0,3 N va F₂ = 0,4 N kuchlar ta'sir qiladi. Natijaviy kuchni toping.<\/p>\n<div class=\"calc\">F = √(F₁² + F₂²) = √(0,09 + 0,16) = √0,25 = <b>0,5 N<\/b><br>tg α = F₂/F₁ = 1,33 → α ≈ 53°<\/div><\/div>\n<div class=\"card sum\"><h3>Xulosa<\/h3><p>Kulon kuchi vektor. Bir necha zaryad ta'sirida natijaviy kuch vektorlar yig'indisiga teng. Kuchlar bir chiziqda bo'lsa qo'shiladi yoki ayriladi, boshqa holda parallelogramm qoidasi qo'llanadi.<\/p><\/div>\n<div class=\"card fact\"><h3>Bilib oling<\/h3><p>Kulon qonuni Nyutonning butun olam tortishish qonuniga o'xshash: ikkalasida kuch 1/r² ga proporsional. Farqi: tortishish faqat tortadi, elektr kuchi esa ham tortadi, ham itaradi.<\/p><\/div>\n<div class=\"card\"><h3>Test<\/h3><div class=\"quiz\" data-set=\"s3\"><\/div><\/div>\n<\/section>\n\n<\!-- ============ YAKUNIY TEST ============ -->\n<section id=\"t4\" class=\"panel\">\n<h2>Yakuniy test (8 savol)<\/h2>\n<div class=\"card\"><div class=\"quiz\" data-set=\"fin\"><\/div><div id=\"res\"><\/div><\/div>\n<\/section>\n<\/main>\n\n<script>\n// ===== Umumiy yordamchilar =====\nconst $=s=>document.querySelector(s), K=9e9; // Kulon doimiysi\nconst C={}; // ranglar (CSS o'zgaruvchilardan olinadi)\nfunction readColors(){const s=getComputedStyle(document.documentElement);\n  ['pos','neg','frc','res','tx','mut','bd'].forEach(n=>C[n]=s.getPropertyValue('--'+n).trim());}\n// Sonlarni formatlash: 0,600 yoki 1,25·10⁻⁴\nconst sup=s=>s.replace(/[-0-9]/g,c=>'⁻⁰¹²³⁴⁵⁶⁷⁸⁹'['-0123456789'.indexOf(c)]);\nfunction sci(x){if(!x)return'0';const[m,e]=x.toExponential(2).split('e');return m.replace('.',',')+'·10'+sup(String(+e))}\nfunction fmt(F){return F===0?'0':(F>=0.01&&F<1000)?F.toFixed(3).replace('.',','):sci(F)}\nconst ang=(fx,fy)=>((Math.atan2(-fy,fx)*180/Math.PI)+360)%360; // burchak (y yuqoriga)\n\n// Canvas: DPR bilan aniq chizish, o'lchamni moslash\nconst O={};\nfunction mk(id,ratio,min=220){const c=document.getElementById(id);O[id]={c,x:c.getContext('2d'),r:ratio,m:min,w:0,h:0};return O[id]}\nfunction fit(o){const w=o.c.clientWidth;if(!w)return;const h=Math.max(o.m,w*o.r),d=devicePixelRatio||1;\n  o.w=w;o.h=h;o.c.width=w*d;o.c.height=h*d;o.c.style.height=h+'px';o.x.setTransform(d,0,0,d,0,0)}\nconst clr=o=>o.x.clearRect(0,0,o.w,o.h);\n\n// Zaryad, o'q va matn chizish\nfunction circ(x,X,Y,s,r=17){x.beginPath();x.arc(X,Y,r,0,7);x.fillStyle=s>0?C.pos:s<0?C.neg:'#888';x.fill();\n  x.fillStyle='#fff';x.font='bold 20px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(s>0?'+':s<0?'−':'0',X,Y+1)}\nfunction arr(x,x1,y1,x2,y2,col,w=3){const a=Math.atan2(y2-y1,x2-x1),h=10;x.strokeStyle=x.fillStyle=col;x.lineWidth=w;\n  x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();x.beginPath();x.moveTo(x2,y2);\n  x.lineTo(x2-h*Math.cos(a-.4),y2-h*Math.sin(a-.4));x.lineTo(x2-h*Math.cos(a+.4),y2-h*Math.sin(a+.4));x.closePath();x.fill()}\nfunction txt(x,s,X,Y,col=C.tx,f='600 15px system-ui',al='center'){x.fillStyle=col;x.font=f;x.textAlign=al;x.textBaseline='middle';x.fillText(s,X,Y)}\nfunction line(x,x1,y1,x2,y2,col,dash){x.strokeStyle=col;x.lineWidth=1.5;x.setLineDash(dash||[]);x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();x.setLineDash([])}\n\n// Zaryadlarni sudrash (pointer events: sichqoncha va barmoq). Koordinatalar metrda, kenglik = 0,6 m\nfunction bindDrag(o,items,st,onGrab){const c=o.c,M=.6;\n  const pos=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)/o.w*M,(e.clientY-b.top)/o.w*M]};\n  c.addEventListener('pointerdown',e=>{const[p,q]=pos(e);let best=null,bd=30/o.w*M;\n    items().forEach(i=>{const d=Math.hypot(i.x-p,i.y-q);if(d<bd){bd=d;best=i}});\n    if(best){st.drag=best;c.setPointerCapture(e.pointerId);best.vx=best.vy=0;onGrab&&onGrab(best);e.preventDefault()}});\n  c.addEventListener('pointermove',e=>{if(!st.drag)return;const[p,q]=pos(e);\n    st.drag.x=Math.min(M-.02,Math.max(.02,p));st.drag.y=Math.min(o.h/o.w*M-.02,Math.max(.02,q))});\n  const up=()=>{st.drag=null};c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up)}\n\n// ===== 1-BO'LIM: animatsiya =====\nmk('a1',.4,170);\nfunction draw_a1(t){const o=O.a1,x=o.x;clr(o);const cx=o.w/2,cy=o.h/2-8,att=(t%8)<4;\n  const hh=o.w*(.14+.08*Math.sin(t*Math.PI)),u=(hh-o.w*.06)/(o.w*.16),L=22+40*(1-Math.max(0,Math.min(1,u)));\n  const s2=att?-1:1,d=att?1:-1; // d=1: ichkariga\n  circ(x,cx-hh,cy,1);circ(x,cx+hh,cy,s2);\n  arr(x,cx-hh+d*22,cy-32,cx-hh+d*(22+L),cy-32,C.frc);arr(x,cx+hh-d*22,cy-32,cx+hh-d*(22+L),cy-32,C.frc);\n  txt(x,att?'Tortishadi (har xil ishora)':'Itarishadi (bir xil ishora)',cx,o.h-22,att?C.neg:C.pos,'700 17px system-ui')}\n\n// ===== 1-BO'LIM: simulyatsiya =====\nmk('s1',.55,220);\nconst S1={a:{x:.2,y:.16,vx:0,vy:0,s:1},b:{x:.4,y:.16,vx:0,vy:0,s:-1},drag:null};\nbindDrag(O.s1,()=>[S1.a,S1.b],S1);\nfunction reset1(){const s=[S1.a.s,S1.b.s];Object.assign(S1.a,{x:.2,y:.16,vx:0,vy:0});Object.assign(S1.b,{x:.4,y:.16,vx:0,vy:0})}\ndocument.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{S1[b.dataset.w].s=+b.dataset.s;\n  document.querySelectorAll(`[data-w=${b.dataset.w}]`).forEach(z=>z.classList.toggle('on',z===b));reset1()});\n$('#rs1').onclick=reset1;\nfunction sim1(dt){const o=O.s1,A=S1.a,B=S1.b,W=.6,H=o.h/o.w*W,q=2e-6,m=.5;\n  const dx=B.x-A.x,dy=B.y-A.y,r=Math.hypot(dx,dy)||1e-4,F=K*q*q/Math.pow(Math.max(r,.04),2);\n  S1.F=F;S1.rep=A.s*B.s>0;\n  if(S1.drag)return;\n  const dir=S1.rep?1:-1,ax=dir*F/m*dx/r,ay=dir*F/m*dy/r; // a = F/m\n  B.vx+=ax*dt;B.vy+=ay*dt;A.vx-=ax*dt;A.vy-=ay*dt;\n  [A,B].forEach(c=>{c.vx*=.997;c.vy*=.997;c.x+=c.vx*dt;c.y+=c.vy*dt;\n    if(c.x<.02||c.x>W-.02){c.x=Math.min(W-.02,Math.max(.02,c.x));c.vx*=-.6}\n    if(c.y<.02||c.y>H-.02){c.y=Math.min(H-.02,Math.max(.02,c.y));c.vy*=-.6}});\n  if(!S1.rep&&r<.045){A.vx=A.vy=B.vx=B.vy=0}} // tortishib, tegib to'xtaydi\nfunction draw_s1(){const o=O.s1,x=o.x,A=S1.a,B=S1.b;clr(o);\n  const P=c=>[c.x/.6*o.w,c.y/.6*o.w],[ax,ay]=P(A),[bx,by]=P(B);\n  const L=Math.min(80,14+S1.F*12),d=Math.hypot(bx-ax,by-ay)||1,ux=(bx-ax)/d,uy=(by-ay)/d,s=S1.rep?-1:1;\n  arr(x,ax,ay,ax+s*ux*L,ay+s*uy*L,C.frc);arr(x,bx,by,bx-s*ux*L,by-s*uy*L,C.frc);\n  circ(x,ax,ay,A.s);circ(x,bx,by,B.s);\n  txt(x,'F₁₂ = F₂₁ = '+fmt(S1.F)+' N',o.w/2,18,C.mut,'600 14px system-ui');\n  const t=S1.rep?'ITARISHADI':'TORTISHADI';$('#st1').textContent=t;$('#st1').style.color=S1.rep?C.pos:C.neg}\n\n// ===== 2-BO'LIM: animatsiya =====\nmk('a2',.4,190);const A2={n:1};\nfunction draw_a2(t,dt){const o=O.a2,x=o.x;clr(o);const ph=Math.floor(t/3)%3+1;A2.n+=(ph-A2.n)*Math.min(1,dt*3);\n  const n=A2.n,x0=o.w*.12,u=o.w*.22,y=o.h*.3,F=1/(n*n),X2=x0+n*u;\n  circ(x,x0,y,1);circ(x,X2,y,-1);\n  const L=12+50*F;arr(x,x0+20,y-30,x0+20+L,y-30,C.frc);arr(x,X2-20,y-30,X2-20-L,y-30,C.frc);\n  line(x,x0,y+30,X2,y+30,C.mut);txt(x,'r = '+n.toFixed(1).replace('.',',')+' r₀',(x0+X2)/2,y+46,C.mut);\n  x.fillStyle=C.frc;x.fillRect(o.w*.12,o.h*.68,o.w*.7*F,18);\n  txt(x,'F = F₀ / '+(n*n).toFixed(1).replace('.',','),o.w*.12,o.h*.68+40,C.tx,'700 16px system-ui','left')}\n\n// ===== 2-BO'LIM: simulyatsiya =====\nmk('m2',.3,130);mk('g2',.6,240);\nfunction vals2(){return{q1:+$('#q1').value,q2:+$('#q2').value,r:+$('#r').value}}\nfunction upd2(){const{q1,q2,r}=vals2(),rm=r/100,P=Math.abs(q1*q2)*1e-12,F=K*P/(rm*rm);\n  $('#v1').textContent=q1+' µC';$('#v2').textContent=q2+' µC';$('#v3').textContent=r+' sm';\n  const rep=q1*q2>0,none=q1*q2===0;\n  $('#st2').innerHTML=none?'F = 0 (zaryad yo\\'q)':`F = ${fmt(F)} N — <span class=\"${rep?'pos':'neg'}\">${rep?'itarishadi':'tortishadi'}<\/span>`;\n  $('#steps').innerHTML=`1) SI ga o'tkazamiz: q₁ = ${q1}·10⁻⁶ C, q₂ = ${q2}·10⁻⁶ C, r = ${rm.toFixed(2).replace('.',',')} m<br>2) F = k·|q₁·q₂| / r²<br>3) |q₁·q₂| = ${sci(P)} C²; r² = ${(rm*rm).toFixed(4).replace('.',',')} m²<br>4) F = 9·10⁹ · ${sci(P)} / ${(rm*rm).toFixed(4).replace('.',',')} = <b>${fmt(F)} N<\/b>`}\n['q1','q2
